};
MF.paintMine = function(){
  if(!MF._mine) return;
  MF.paintShaft(); MF.paintFace(); MF.paintYard();
  MF.drainFlashes();          /* after the repaint, so a message survives it */
};

/* ---------- the shaft: descend freely, no gate anywhere ---------- */
MF.paintShaft = function(){
  var host = clear(MF._mine.left);
  var box = E('div','shaft');
  box.appendChild(H('h3',null,'The Shaft'));
  box.appendChild(H('div','hint','Go as deep as you like. You never have to smelt anything to descend — fill the cart and work it whenever you feel like it.'));

  /* the drawn shaft on the left, the layer buttons on the right */
  var body = E('div','shaftbody');
  var way = E('div','shaftway');
  way.appendChild(E('div','sets'));
  way.appendChild(E('div','ladder'));
  var cable = E('div','cable');
  way.appendChild(cable);
  var cage = E('div','cage');
  way.appendChild(cage);
  body.appendChild(way);
  var rungs = E('div'); rungs.style.flex='1 1 auto';
  body.appendChild(rungs);
  box.appendChild(body);

  MF.LAYERS.forEach(function(L){
    var b = E('button','layer'); b.type='button';
    b.appendChild(H('span','n','LAYER ' + L.n));
    b.appendChild(document.createTextNode(L.name));
    b.appendChild(H('div','hint', L.what));
    if(MF.state.layer===L.n) b.setAttribute('aria-current','true');
    on(b,'click',function(){
      MF.state.layer = L.n;
      if(L.n > MF.state.deepest) MF.state.deepest = L.n;
      MF.paintMine();
    });
    rungs.appendChild(b);
  });
  MF.SHUT_SHAFTS.forEach(function(s){
    var b = E('button','layer shut'); b.type='button'; b.disabled = true;
    b.appendChild(H('span','n','NOT YET TIMBERED'));
    b.appendChild(document.createTextNode(s.name));
    b.appendChild(H('div','hint', s.what));
    rungs.appendChild(b);
  });
  host.appendChild(box);

  /* ride the cage to whichever layer is being worked. Measured from the real
     button positions rather than assumed, so it stays right when the layer
     list changes length. */
  requestAnimationFrame(function(){
    var btns = rungs.querySelectorAll('.layer:not(.shut)');
    var here = btns[MF.state.layer-1];
    if(!here) return;
    var wayTop = way.getBoundingClientRect().top;
    var mid = here.getBoundingClientRect().top + here.getBoundingClientRect().height/2 - wayTop;
    var top = Math.max(4, Math.min(way.clientHeight - 44, mid - 20));
    cage.style.top = top + 'px';
    cable.style.height = (top + 6) + 'px';
  });
};

/* =========================================================================
   EACH LAYER IS ITS OWN STONE. Palette, strata and glint change with depth,
   so descending LOOKS like descending rather than reading like a new label.
   ========================================================================= */
MF.LAYER_LOOK = [
  {sky:'#8A7458', rock:'#6E5A40', rock2:'#4A3B28', ore:'#C9A24B', glint:'#FFE9A8', strata:'#7E6A4E', grit:'#8C7554'},
  {sky:'#6E6152', rock:'#5C5140', rock2:'#3C3428', ore:'#C96A1F', glint:'#F6C98A', strata:'#6B5F4C', grit:'#7A6C56'},
  {sky:'#4E5A63', rock:'#44525C', rock2:'#2B343B', ore:'#7FB6C9', glint:'#D8F0F7', strata:'#54626C', grit:'#5E6E78'},
  {sky:'#5A3F3A', rock:'#4E3630', rock2:'#31201C', ore:'#C4543F', glint:'#F7C0A8', strata:'#5C443D', grit:'#6A4A42'},
  {sky:'#33302E', rock:'#2E2A28', rock2:'#191716', ore:'#E2600F', glint:'#FFB347', strata:'#3A3532', grit:'#443E3A'}
];

/* the rocks currently exposed on the face - you look before you break */
/* THE SEAM. The face is not a wall you stand in front of - it is a length of
   rock you SCAN ALONG. It is several screens wide, it scrolls, and the ore is
   spread down its length, so looking for something worth breaking is real
   movement rather than reading a grid of seven.
   SEAM_W is the drawn width; the viewport shows roughly a third of it. */
MF.SEAM_W = 2280;
MF.SEAM_H = 250;
MF.SEAM_COUNT = 15;

MF.stockFace = function(){
  var L = MF.state.layer;
  if(MF.state.faceLayer !== L){
    MF.state.face = []; MF.state.faceLayer = L; MF.state.inspecting = null; MF.state.scan = 0;
  }
  var guard = 0;
  while(MF.state.face.length < MF.SEAM_COUNT && guard++ < 60){
    var o = MF.digOre(L, MF.state.rng);
    if(!o) break;
    o.slot = MF.nextSeamSlot();
    o.px = 92 + o.slot * ((MF.SEAM_W - 180) / (MF.SEAM_COUNT - 1));
    o.px += ((o.slot * 37) % 44) - 22;              /* nudge off the grid */
    o.py = 62 + ((o.slot * 71) % 126);
    o.sz = 32 + ((o.slot * 13) % 18);
    MF.state.face.push(o);
  }
  return MF.state.face;
};
/* the emptiest position along the seam, so ore refills where it was taken */
MF.nextSeamSlot = function(){
  var used = {};
  MF.state.face.forEach(function(o){ used[o.slot] = true; });
  for(var i=0;i<MF.SEAM_COUNT;i++){ if(!used[i]) return i; }
  return MF.state.face.length % MF.SEAM_COUNT;
};

/* ---------- the face: look, choose, break ---------- */
MF.paintFace = function(){
  var host = clear(MF._mine.mid);
  var L = MF.LAYERS[MF.state.layer-1];
  var look = MF.LAYER_LOOK[MF.state.layer-1];
  var rocks = MF.stockFace();

  var wall = E('div','wall');
  wall.style.background = 'linear-gradient(180deg,'+look.rock+','+look.rock2+')';
  wall.appendChild(H('h3',null,'Layer ' + L.n + ' &mdash; ' + L.name));
  wall.appendChild(H('div','depthline', 'The ore here is ' + L.what + '. Look one over before you swing &mdash; nothing breaks until you say so.'));

  /* the viewport scrolls; the seam inside it is far wider than the screen */
  var faceBox = E('div','face seamview');
  var W=MF.SEAM_W, VH=MF.SEAM_H;
  var svg = S('svg',{viewBox:'0 0 '+W+' '+VH,role:'group',
    'aria-label':'A seam of rock at layer '+L.n+', wider than the screen. Scroll or use the scan buttons to move along it.'});
  svg.setAttribute('width', W);
  svg.style.width = W + 'px';
  svg.style.maxWidth = 'none';

  var defs = S('defs',{});
  var g1 = S('linearGradient',{id:'wallg'+L.n,x1:'0',y1:'0',x2:'0',y2:'1'});
  g1.appendChild(S('stop',{offset:'0%','stop-color':look.rock}));
  g1.appendChild(S('stop',{offset:'100%','stop-color':look.rock2}));
  defs.appendChild(g1); svg.appendChild(defs);
  svg.appendChild(S('rect',{x:0,y:0,width:W,height:VH,fill:'url(#wallg'+L.n+')'}));

  /* strata - the rock itself changes with depth, and runs the seam's length */
  for(var s=0;s<9;s++){
    var yy = 14 + s*27 + ((s*11)%9);
    /* strata repeat along the whole length so the seam never looks like it ends */
    var d = 'M0 '+yy;
    for(var seg=0; seg<W; seg+=260){
      d += ' q130 '+((seg/260)%2 ? 9 : -9)+' 260 '+((seg/260)%3===0 ? 3 : -2);
    }
    svg.appendChild(S('path',{d:d, fill:'none', stroke:look.strata,
      'stroke-width':(s%3===0?3:1.6), opacity:'.5'}));
  }
  for(var gq=0;gq<220;gq++){
    svg.appendChild(S('circle',{cx:(gq*173)%W, cy:(gq*53)%VH, r:1+((gq*7)%3), fill:look.grit, opacity:'.45'}));
  }

  /* the rocks */
  rocks.forEach(function(o, idx){
    var g = S('g',{class:'rock',tabindex:'0',role:'button',
      'aria-label':'A lump of ore: ' + MF.oreText(o) + '. Look at it, then break it.'});
    if(MF.state.inspecting===idx) g.setAttribute('data-sel','on');
    var x=o.px, y=o.py, r=o.sz;
    var sel = S('circle',{class:'sel',cx:x,cy:y,r:r+9,fill:'none',stroke:'#E8A33D','stroke-width':'3','stroke-dasharray':'6 5'});
    g.appendChild(sel);
    var body = S('g',{class:'body'});
    var pts = [];
    for(var k=0;k<8;k++){
      var ang = k*Math.PI/4 + ((idx*7+k*3)%5)*0.06;
      var rad = r * (0.78 + ((idx*5+k*11)%7)/22);
      pts.push((x+rad*Math.cos(ang)).toFixed(1)+','+(y+rad*Math.sin(ang)).toFixed(1));
    }
    body.appendChild(S('polygon',{points:pts.join(' '),fill:look.rock,stroke:look.rock2,'stroke-width':'3'}));
    /* ore veins inside: one streak per term, so a rock LOOKS like what it is */
    var terms = (o.kind==='number') ? 1 : [o.a,o.b,o.c].filter(function(v){ return v!==0; }).length;
    for(var t=0;t<terms;t++){
      body.appendChild(S('path',{d:'M'+(x-r*0.6)+' '+(y-r*0.3+t*7)+' q'+(r*0.5)+' '+(t%2?6:-6)+' '+(r*1.2)+' '+(t%2?-3:3),
        fill:'none',stroke:look.ore,'stroke-width':'3','stroke-linecap':'round',opacity:'.92'}));
    }
    body.appendChild(S('circle',{class:'glint',cx:x-r*0.34,cy:y-r*0.38,r:'3.4',fill:look.glint}));
    g.appendChild(body);
    on(g,'click',function(){ MF.state.inspecting=idx; MF.paintMine(); });
    on(g,'keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); MF.state.inspecting=idx; MF.paintMine(); } });
    svg.appendChild(g);
  });

  /* The pick stands beside whichever lump is being looked at, not parked at a
     fixed spot - on a seam this wide a fixed pick would usually be off-screen
     when the swing happened, so the student would never see it land. */
  var target = (MF.state.inspecting!=null && rocks[MF.state.inspecting]) ? rocks[MF.state.inspecting] : null;
  var pickX = target ? Math.min(W-110, Math.max(10, target.px + target.sz + 16)) : (W-104);
  var pickY = target ? Math.min(VH-100, Math.max(4, target.py - 40)) : (VH-96);
  var pick = S('g',{transform:'translate('+pickX+','+pickY+')'});
  var arm = S('g',{class:'pickarmhost'});
  /* handle, then a proper double-ended pick head: two tapered points curving
     down from a thick centre. The first attempt drew a grey fan. */
  arm.appendChild(S('rect',{x:'40',y:'10',width:'9',height:'92',rx:'3',fill:'#8A6A45'}));
  arm.appendChild(S('rect',{x:'38',y:'44',width:'13',height:'7',rx:'2',fill:'#6B5335'}));
  arm.appendChild(S('path',{d:'M2 26 q20 -20 42 -16 q22 -4 42 16 q-6 4 -12 3 q-16 -11 -30 -9 q-14 -2 -30 9 q-6 1 -12 -3 Z',
    fill:'#9AA3AB',stroke:'#4A5158','stroke-width':'2','stroke-linejoin':'round'}));
  arm.appendChild(S('rect',{x:'36',y:'6',width:'17',height:'10',rx:'3',fill:'#5A626A'}));
  pick.appendChild(arm);
  svg.appendChild(pick);
  MF._pickArm = arm;

  faceBox.appendChild(svg);
  wall.appendChild(faceBox);

  /* ---- scanning along the seam ---- */
  var scanRow = E('div','row'); scanRow.style.marginTop='10px'; scanRow.style.alignItems='center';
  function scanBtn(label, dir){
    var b = E('button','btn', label); b.type='button';
    b.style.background='#241D18'; b.style.color='#E4D5BB'; b.style.borderColor='#6B5B48';
    on(b,'click',function(){ faceBox.scrollBy({left: dir * Math.round(faceBox.clientWidth*0.8), behavior:'smooth'}); });
    return b;
  }
  scanRow.appendChild(scanBtn('◀ scan back', -1));
  scanRow.appendChild(scanBtn('scan along ▶', 1));
  var posWrap = E('div'); posWrap.style.flex='1 1 160px'; posWrap.style.minWidth='140px';
  posWrap.appendChild(H('div','hint','Where you are along the seam'));
  var track = E('div');
  track.style.cssText='height:10px;border-radius:999px;background:#241D18;border:2px solid #6B5B48;position:relative;overflow:hidden';
  var marker = E('div');
  marker.style.cssText='position:absolute;top:0;bottom:0;width:26%;background:var(--lamp);border-radius:999px;transition:left .12s linear';
  track.appendChild(marker); posWrap.appendChild(track);
  scanRow.appendChild(posWrap);
  wall.appendChild(scanRow);

  /* keep the position marker honest as the student scrolls or drags */
  function syncMarker(){
    var max = Math.max(1, faceBox.scrollWidth - faceBox.clientWidth);
    var frac = faceBox.scrollLeft / max;
    var vis = faceBox.clientWidth / Math.max(1, faceBox.scrollWidth);
    marker.style.width = Math.max(8, vis*100).toFixed(1) + '%';
    marker.style.left = (frac * (100 - Math.max(8, vis*100))).toFixed(1) + '%';
    MF.state.scan = faceBox.scrollLeft;
  }
  on(faceBox,'scroll',syncMarker);

  /* drag to scan. A rock click still works because a drag under a few pixels
     is not treated as a drag at all. */
  var dragging=false, startX=0, startLeft=0, moved=0;
  on(faceBox,'pointerdown',function(e){
    dragging=true; moved=0; startX=e.clientX; startLeft=faceBox.scrollLeft;
    faceBox.style.scrollBehavior='auto';
  });
  on(faceBox,'pointermove',function(e){
    if(!dragging) return;
    var dx = e.clientX - startX;
    moved = Math.max(moved, Math.abs(dx));
    if(moved > 4){ faceBox.scrollLeft = startLeft - dx; }
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    on(faceBox,ev,function(){ dragging=false; faceBox.style.scrollBehavior='smooth'; });
  });
  on(faceBox,'click',function(e){ if(moved>4){ e.stopPropagation(); e.preventDefault(); moved=0; } }, true);
  host.appendChild(wall);
  /* restore where they were, and centre the lump they are looking at */
  if(target){
    var wantLeft = (target.px / W) * faceBox.scrollWidth - faceBox.clientWidth/2;
    faceBox.scrollLeft = Math.max(0, wantLeft);
  } else {
    faceBox.scrollLeft = MF.state.scan || 0;
  }
  syncMarker();
  MF._seamView = faceBox;

  /* ---- inspect, then break ---- */
  var insp = E('div','inspect');
  if(MF.state.inspecting==null || !rocks[MF.state.inspecting]){
    insp.appendChild(H('div','label','THE FACE'));
    insp.appendChild(H('div','obs','Nothing picked out yet. Click a lump in the wall and have a proper look at it first — you can turn over as many as you like without breaking any.'));
  } else {
    var o = rocks[MF.state.inspecting];
    insp.appendChild(H('div','label','YOU ARE LOOKING AT'));
    insp.appendChild(H('div','expr', MF.oreLabel(o)));
    var obs = E('ul','obs');
    var terms = (o.kind==='number') ? 1 : [o.a,o.b,o.c].filter(function(v){ return v!==0; }).length;
    obs.appendChild(H('li',null, terms===1 ? 'One vein runs through it.' : terms + ' veins run through it.'));
    obs.appendChild(H('li',null, o.kind==='number' ? 'A plain lump of gravel — no x anywhere in it.' :
      (o.a===0 ? 'No x² in it — it is a flat seam.' : (o.a===1 ? 'One x², with nothing sitting in front.' : num(o.a) + ' sitting in front of the x².'))));
    obs.appendChild(H('li',null,'Came out of layer ' + o.layer + ', ' + MF.LAYERS[o.layer-1].name + '.'));
    obs.appendChild(H('li',null,'<em>What kind of seam runs through it is not something you can see from here. That is what the assay is for.</em>'));
    insp.appendChild(obs);
    var brow = E('div','row'); brow.style.marginTop='10px';
    var br = E('button','btn primary big', MF.hasTool('pick') ? 'Swing the deep pick' : 'Swing the pick'); br.type='button';
    on(br,'click',function(){ MF.breakRock(MF.state.inspecting); });
    brow.appendChild(br);
    var skip = E('button','btn','Leave it and look at another'); skip.type='button';
    skip.style.background='#241D18'; skip.style.color='#E4D5BB'; skip.style.borderColor='#6B5B48';
    on(skip,'click',function(){ MF.state.inspecting=null; MF.paintMine(); });
    brow.appendChild(skip);
    insp.appendChild(brow);
  }
  wall.appendChild(insp);

  /* the cart */
  var cartPanel = E('div','panel');
  cartPanel.appendChild(H('div','panel-tag','THE CART'));
  if(!MF.state.cart.length){
    cartPanel.appendChild(H('p','hint','Empty. Swing the pick above — and dig as much as you want before you smelt anything.'));
  } else {
    cartPanel.appendChild(H('p','hint','Raw ore you are carrying. Pick one up to put it on the bench.'));
    var body = E('div','cartbody');
    var cart = E('div','cart');
    MF.state.cart.forEach(function(o){
      var b = E('button','lump' + (o.fresh?' fresh':'')); b.type='button';
      b.appendChild(E('span','glyph'));
      b.appendChild(H('span','txt', MF.oreLabel(o)));
      b.appendChild(H('span','lay','LAYER ' + o.layer));
      if(MF.state.selected && MF.state.selected.id===o.id) b.setAttribute('aria-current','true');
      on(b,'click',function(){
        MF.state.selected = o;
        MF.state.bench = null;
        MF.paintMine();
      });
      cart.appendChild(b);
    });
    body.appendChild(cart);
    cartPanel.appendChild(body);
    var wheels = E('div','cartwheels');
    wheels.appendChild(E('i')); wheels.appendChild(E('i'));
    cartPanel.appendChild(wheels);
    cartPanel.appendChild(E('div','cartrail'));
  }
  host.appendChild(cartPanel);

  if(MF.state.selected) MF.paintBench(host);
  else if(MF.state.cart.length) host.appendChild(MF.says('<b>Mr Factor:</b> Pick a lump out of the cart and set it on the bench when you are ready. No hurry — the cart does not empty itself.'));
};

/* =========================================================================
   BREAKING A ROCK. The swing has weight: the pick arcs down, the rock takes
   the hit, shards fly, the face shudders, and only then does the lump land in
   the cart. Under prefers-reduced-motion every duration collapses and the
   lump simply arrives - the sequence still completes, it just does not perform.
   ========================================================================= */
MF.breakRock = function(idx){
  var rocks = MF.state.face, o = rocks[idx];
  if(!o || MF.state.breaking) return;
  MF.state.breaking = true;
  var startLayer = MF.state.faceLayer;

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var svg = MF._mine.mid.querySelector('.face svg');
  var arm = MF._pickArm;
  var landMs = reduced ? 10 : 400;
  var doneMs = reduced ? 30 : 900;

  if(arm && !reduced){ arm.classList.remove('pickarm'); void arm.getBoundingClientRect(); arm.classList.add('pickarm'); }

  setTimeout(function(){
    if(svg){
      var look = MF.LAYER_LOOK[MF.state.layer-1];
      var ring = S('circle',{class:'impact',cx:o.px,cy:o.py,r:o.sz,fill:'none',stroke:look.glint,'stroke-width':'4'});
      svg.appendChild(ring);
      for(var i=0;i<9;i++){
        var ang = (i/9)*Math.PI*2, dist = 34 + (i%4)*13;
        var sh = S('polygon',{class:'shard',
          points:(o.px)+','+(o.py-5)+' '+(o.px+7)+','+(o.py+4)+' '+(o.px-6)+','+(o.py+6),
          fill: i%3===0 ? look.ore : look.rock, stroke:look.rock2,'stroke-width':'1'});
        sh.style.setProperty('--dx', (Math.cos(ang)*dist).toFixed(1)+'px');
        sh.style.setProperty('--dy', (Math.sin(ang)*dist - 10).toFixed(1)+'px');
        sh.style.setProperty('--rot', ((i*47)%360)+'deg');
        svg.appendChild(sh);
      }
      var faceBox = MF._mine.mid.querySelector('.face');
      if(faceBox && !reduced){ faceBox.classList.add('shudder');
        setTimeout(function(){ faceBox.classList.remove('shudder'); }, 340); }
    }
  }, landMs);

  setTimeout(function(){
    /* SPLICE BY IDENTITY, NOT BY INDEX, and only if we are still on the layer
       the swing started on. A student who changed layer during the 900ms
       landing got a fresh face of fifteen rocks, and this timer then deleted
       whichever NEW rock happened to sit at the old index - a lump they never
       touched, which never reached the cart, on a face that refills to fifteen
       so nothing on screen said a word. */
    if(MF.state.faceLayer !== startLayer){ MF.state.breaking = false; return; }
    var at = MF.state.face.indexOf(o);
    if(at < 0){ MF.state.breaking = false; MF.paintMine(); return; }
    MF.state.face.splice(at,1);
    MF.state.inspecting = null;
    o.fresh = true;
    MF.state.cart.push(o);
    if(!MF.state.selected) MF.state.selected = o;
    MF.state.breaking = false;
    MF.paintMine();
    setTimeout(function(){ o.fresh = false; }, 500);
  }, doneMs);
};

/* ---------- the bench: ASSAY -> SMELT -> POUR ---------- */
MF.benchInit = function(ore){
  return { ore:ore, step:'assay', assayTried:false,
           pieces: ore.kind==='number' ? [ore.n] : null,
           slots: [{m:1,k:0},{m:1,k:0}],
           casting:null };
};
MF.paintBench = function(host){
  var ore = MF.state.selected;
  if(!MF.state.bench || MF.state.bench.ore.id !== ore.id) MF.state.bench = MF.benchInit(ore);
  var B = MF.state.bench;

  var bench = E('div','bench');
  bench.appendChild(H('div','panel-tag','THE BENCH'));

  /* the rack on the wall: the instruments are objects lying on the bench,
     not a list in a sidebar. Empty racks say what they are for. */
  var rack = E('div','toolrack');
  rack.appendChild(H('span','rk','on the bench'));
  var anyTool = false;
  Object.keys(MF.TOOLS).forEach(function(k){
    if(!MF.hasTool(k)) return;
    anyTool = true;
    rack.appendChild(H('span','tl','<span class="ic">'+MF.TOOLS[k].ic+'</span>'+MF.TOOLS[k].nm));
  });
  if(!anyTool) rack.appendChild(H('span','empty','bare — the forge is where tools come from'));
  bench.appendChild(rack);

  bench.appendChild(H('div','eq', MF.oreLabel(ore)));

  var strip = E('div','stepstrip');
  [['assay','ASSAY','what is this?'],['smelt','SMELT','separate it'],['pour','POUR','find out']].forEach(function(s){
    var d = E('div','st' + (B.step===s[0]?' on':'') + (MF.stepDone(B,s[0])?' done':''));
    d.appendChild(H('b',null,s[1]));
    d.appendChild(H('div','s', s[2]));
    strip.appendChild(d);
  });
  bench.appendChild(strip);

  if(B.step==='assay')      MF.paintAssay(bench, B);
  else if(B.step==='smelt') MF.paintSmelt(bench, B);
  else                      MF.paintPour(bench, B);

  host.appendChild(bench);
};
MF.stepDone = function(B, step){
  var order = {assay:0, smelt:1, pour:2};
  return order[step] < order[B.step];
};

MF.paintAssay = function(host, B){
  var ore = B.ore;
  var right = MF.assayOf(ore);
  host.appendChild(H('p','hint','<b>Assay it first.</b> What kind of rock are you holding? Nothing else on the bench opens until you have called it — because a call you made is the only thing you can later catch yourself out on.'));

  /* the Drill reads structure - this is its power, and it is the only thing
     on the assay screen that says anything beyond what is visibly there */
  if(MF.hasTool('drill')){
    var tell = E('div','note');
    var bits = [];
    if(ore.kind==='number'){
      bits.push('It is a plain number, so the only question is whether anything divides it.');
      bits.push('Nothing below ' + Math.ceil(Math.sqrt(Math.abs(ore.n))) + ' needs checking past that point.');
    } else {
      var terms = [ore.a,ore.b,ore.c].filter(function(v){ return v!==0; }).length;
      bits.push('<b>' + terms + '</b> term' + (terms===1?'':'s') + ' in it.');
      var gg = gcdAll([ore.a,ore.b,ore.c].filter(function(v){ return v!==0; }));
      bits.push(gg>1 ? 'Every term divides by <b>'+gg+'</b>.' : 'No number above 1 divides every term.');
      if(ore.c===0 && ore.a!==0) bits.push('There is no plain number on the end, so every term still carries an x.');
      bits.push(ore.a===1 ? 'Nothing sits in front of the x².' : (ore.a===0?'There is no x² at all.':'<b>'+num(ore.a)+'</b> sits in front of the x².'));
      if(terms===2 && ore.b===0 && ore.c<0) bits.push('Two terms with a minus between them — check whether both ends are perfect squares.');
    }
    tell.innerHTML = '<b>Assay Lamp:</b> ' + bits.join(' ');
    host.appendChild(tell);
  }

  var accepted = MF.assayAccepts(ore);
  var opts = (ore.kind==='number') ? ['pure','composite'] : ['pure','shared','twin','plain','loaded'];
  var wrap = E('div','choices');
  MF.balanced(ore.id+'|assay', opts).forEach(function(k){
    var why = MF.ASSAY[k].tell;
    /* a second true reading gets its own words, not the generic tell */
    if(accepted.indexOf(k) >= 0 && k !== right){
      why = 'Also true — this really is two squares with a minus between them. ' +
            'Both readings are right; the shared lump usually comes out first, because once it does ' +
            'the twin seam underneath is easier to see.';
    }
    var btn = H('button','choice', MF.ASSAY[k].name + '<span class="why">' + why + '</span>');
    btn.type='button';
    on(btn,'click',function(){
      if(accepted.indexOf(k) >= 0){
        btn.setAttribute('data-result','yes');
        B.step = 'smelt';
        setTimeout(function(){ MF.paintMine(); }, 260);
      } else {
        btn.setAttribute('data-result','no');
        B.assayTried = true;
      }
    });
    wrap.appendChild(btn);
  });
  host.appendChild(wrap);
};

/* deterministic option order - the correct call must not sit in the same slot */
function hash(str){ var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
MF.balanced = function(seed, list){
  var out = list.slice();
  var h = hash(seed);
  for(var i=out.length-1;i>0;i--){
    var j = (h + i*2654435761) % (i+1);
    var t = out[i]; out[i]=out[j]; out[j]=t;
    h = (h*1664525 + 1013904223) >>> 0;
  }
  return out;
};

MF.paintSmelt = function(host, B){
  var ore = B.ore, kind = MF.assayOf(ore);

  if(kind==='pure'){
    /* Being RIGHT about an ingot used to shrink the bench by a third and take
       every input away with it - the reward for reading the one object this
       mine exists to teach was a smaller panel. It is a result now, and it is
       given the room a result deserves. */
    host.appendChild(H('p','hint','<b>Nothing to separate — and that is the answer, not the absence of one.</b> ' +
      'You called it an ingot and the crucible agrees. It goes in and comes out the same thing.'));
    var cru = E('div','crucible');
    cru.appendChild(H('h4',null,'The crucible'));
    var rowp = E('div','ingotrow');
    var big = H('div','ingot pure', MF.oreText(ore));
    big.style.fontSize='26px'; big.style.padding='16px 26px'; big.style.minWidth='150px';
    big.style.boxShadow='0 0 0 4px rgba(232,163,61,.28), inset 0 3px 0 rgba(255,255,255,.5)';
    rowp.appendChild(big);
    cru.appendChild(rowp);
    cru.appendChild(H('div','hint','The furnace did not fail. There is simply nothing in there but the thing itself.'));
    host.appendChild(cru);
    host.appendChild(H('div','note good','<b>' + (ore.kind==='number' ? 'A prime.' : 'An irreducible.') +
      '</b> ' + (ore.kind==='number'
        ? 'Further down the mine you will meet polynomial ones — <b>x² + 4</b> is the same kind of object as this, and the smelter treats them identically.'
        : 'This is the same kind of object as a prime. A number like 97 and a lump like this are one idea wearing different clothes, and that is the whole reason this mine exists.')));
    if(ore.kind==='poly'){
      var r = MF.smeltPoly(ore.a,ore.b,ore.c);
      host.appendChild(H('div','note','<b>Why nothing came out.</b> ' + (r.realRoots
        ? 'There is a seam in there, but it runs at ' + num(Math.round(r.realRoots[0]*1000)/1000) + ' and ' +
          num(Math.round(r.realRoots[1]*1000)/1000) + ' — not on whole numbers, so no bracket of whole numbers will ever land on it.'
        : 'No seam at all, on whole numbers or on decimals. This one genuinely does not come apart.')));
    }
    var b = E('button','btn primary','Set it in the yard'); b.type='button';
    on(b,'click',function(){
      var ing = (ore.kind==='number') ? {m:0,k:ore.n} : null;
      if(ing) MF.addToYard(ing);
      else MF.addToYard({m:0,k:0, poly:{a:ore.a,b:ore.b,c:ore.c}, label:MF.oreText(ore)});
      MF.finishLump(B, true, 'It went in an ingot and came out an ingot.');
    });
    host.appendChild(b);
    return;
  }

  if(ore.kind==='number'){ MF.paintNumberSmelt(host, B); return; }

  /* polynomial: fill the crucible with ingots of the form m·x + k */
  host.appendChild(H('p','hint','<b>Separate it.</b> Say what metals are in there. Each ingot is <b>m&middot;x + k</b> — ' +
    'set m to 0 for a plain number, or k to 0 for something like 3x. Nothing here tells you whether you are right; ' +
    'the mold does that.'));

  var cru = E('div','crucible');
  cru.appendChild(H('h4',null,'The crucible &mdash; what came out'));
  var slots = E('div','slotwrap');
  B.slots.forEach(function(g, idx){
    var sl = E('div','slot');
    sl.appendChild(H('label',null,'ingot ' + (idx+1)));
    var inner = E('div','row'); inner.style.gap='4px';
    inner.appendChild(H('span','paren','('));
    /* g.raw* holds what the student TYPED. Writing a computed value back into
       the box put the literal string "NaN" in front of them the moment they
       typed a letter, and the warning vanished on the next repaint. */
    var mi = document.createElement('input'); mi.type='text'; mi.inputMode='numeric';
    mi.value = (g.rawM!=null) ? g.rawM : String(g.m);
    mi.setAttribute('aria-label','ingot '+(idx+1)+' x coefficient');
    on(mi,'input',function(){ g.rawM = mi.value; g.m = MF.readInt(mi.value); MF.previewCasting(B); });
    inner.appendChild(mi);
    inner.appendChild(H('span','paren','x +'));
    var ki = document.createElement('input'); ki.type='text'; ki.inputMode='numeric';
    ki.value = (g.rawK!=null) ? g.rawK : String(g.k);
    ki.setAttribute('aria-label','ingot '+(idx+1)+' constant');
    on(ki,'input',function(){ g.rawK = ki.value; g.k = MF.readInt(ki.value); MF.previewCasting(B); });
    inner.appendChild(ki);
    inner.appendChild(H('span','paren',')'));
    sl.appendChild(inner);
    slots.appendChild(sl);
  });
  cru.appendChild(slots);
  var addRow = E('div','row'); addRow.style.marginTop='10px';
  if(B.slots.length < 3){
    var add = E('button','btn','+ another ingot'); add.type='button';
    add.style.background='#241D18'; add.style.color='#E4D5BB'; add.style.borderColor='#6B5B48';
    on(add,'click',function(){ B.slots.push({m:1,k:0}); MF.paintMine(); });
    addRow.appendChild(add);
  }
  if(B.slots.length > 2){
    var rm = E('button','btn','− fewer'); rm.type='button';
    rm.style.background='#241D18'; rm.style.color='#E4D5BB'; rm.style.borderColor='#6B5B48';
    on(rm,'click',function(){ B.slots.pop(); MF.paintMine(); });
    addRow.appendChild(rm);
  }
  cru.appendChild(addRow);
  host.appendChild(cru);

  /* the scanner is a tool, not an answer: it lists pairs, it does not pick one */
  var target = (ore.a===1||ore.a===0) ? ore.c : ore.a*ore.c;
  if(ore.a!==0 && ore.c!==0 && Math.abs(target)<600){
    var sc = E('div','panel'); sc.style.background='#fff'; sc.style.margin='12px 0 0';
    sc.appendChild(H('div','hint','<b>Pair scanner.</b> Every pair that multiplies to <b>' + num(target) + '</b>' +
      (ore.a===1?'':' (that is a·c)') + '. You are looking for the one that also adds to <b>' + num(ore.b) + '</b>.'));
    /* NO highlight. The scanner lists every pair; picking the one that also
       adds to b is the student's job, and marking the winning row was the
       answer printed above the pour - which is meant to be the only judge. */
    MF.scanTable(sc, target, null);
    host.appendChild(sc);
  }

  /* THE SHIFTER'S POWER lives in its own host and is repainted on every
     keystroke by previewCasting - built once at paint time it showed the slot
     values from before the student typed, which is worse than not showing it. */
  var railHost = E('div'); host.appendChild(railHost); B._rail = railHost;
  if(MF.hasTool('dial') && ore.kind==='poly') MF.paintDial(host, B);

  var prev = E('div'); prev.id='casting-preview'; host.appendChild(prev);
  B._preview = prev;
  var pourRow = E('div','row'); pourRow.style.marginTop='12px';
  var pour = E('button','btn primary big','Pour it into the mold'); pour.type='button';
  on(pour,'click',function(){ B.step='pour'; MF.paintMine(); });
  pourRow.appendChild(pour);
  pourRow.appendChild(H('div','hint','The mold forms around whatever you poured. You will see the casting.'));
  host.appendChild(pourRow);
  MF.previewCasting(B, prev);
};
MF.readInt = function(raw){
  var s = String(raw||'').trim().replace(/[−–—]/g,'-');
  if(s===''||s==='-') return 0;
  if(!/^-?\d+$/.test(s)) return NaN;
  return parseInt(s,10);
};
/* The preview element is passed in, NOT looked up by id. paintSmelt runs
   while the bench is still detached, so q('#casting-preview') searched the
   document, found nothing, and returned silently - the live preview was blank
   on every single entry to the crucible and nothing errored. */
/* THE LANTERN'S POWER, and it is not decoration.

   This preview used to be free, which quietly broke the build's one rule: a
   student could nudge the numbers until the preview matched the ore and the
   pour became a formality. Now it is dark until you have forged the Lantern
   out of three primes - and the forging of it IS distribution over plain
   numbers, so the tool is earned by doing the thing it goes on to show you.

   Before the Lantern: you pour, and the casting teaches you.
   After it: you can see what you are building. Blind trial becomes reasoning. */
MF.previewCasting = function(B, host){
  host = host || B._preview; if(!host) return;
  B._preview = host;
  clear(host);
  var bad = B.slots.some(function(g){ return !isFinite(g.m) || !isFinite(g.k); });
  if(bad){ host.appendChild(H('div','note warn','One of those boxes is not a whole number. The crucible only holds whole metals.')); return; }

  MF.paintShifterRail(B);          /* the rail follows every keystroke too */

  if(!MF.hasTool('lantern')){
    host.appendChild(H('div','hint','<span style="opacity:.75">The mold is dark. Pour it and the casting will tell you. ' +
      '(A lantern would let you see it first — the forge knows how to make one.)</span>'));
    return;
  }

  var prod = ingotProduct(B.slots);
  var txt = prod.overflow ? 'something of degree ' + prod.degree : quad(prod.a,prod.b,prod.c);
  var lit = E('div','note');
  lit.style.borderLeftColor = 'var(--lamp)';
  lit.innerHTML = '<b>&#128367; By lantern-light:</b> what you are holding would pour as <b>' + txt + '</b>';
  host.appendChild(lit);

  /* and the model that makes distribution visible rather than imagined */
  if(!prod.overflow && B.slots.length===2 && B.slots.every(function(g){ return isFinite(g.m)&&isFinite(g.k); })){
    var g1=B.slots[0], g2=B.slots[1];
    MF.areaModel(host, {
      rows:[{label:ingotText(g1)==='0'?'0':(g1.m===0?num(g1.k):(g1.m===1?'x':num(g1.m)+'x')), known:true},
            {label:num(g1.k), known:true}],
      cols:[{label:(g2.m===0?num(g2.k):(g2.m===1?'x':num(g2.m)+'x')), known:true},{label:num(g2.k), known:true}],
      cells:[
        [{kind:'sq', text: (g1.m*g2.m===0?'0':(g1.m*g2.m===1?'x²':num(g1.m*g2.m)+'x²'))},
         {kind:'x', text: xt2(g1.m*g2.k), negative:(g1.m*g2.k)<0}],
        [{kind:'x', text: xt2(g1.k*g2.m), negative:(g1.k*g2.m)<0},
         {kind:'k', text: num(g1.k*g2.k), negative:(g1.k*g2.k)<0}]
      ],
      sideMode:'show',
      caption:'Every corner is one of the four products. The two middle tiles are the same kind of thing, so they run together.'
    });
  }
};
function xt2(k){ if(k===0) return '0'; if(k===1) return 'x'; if(k===-1) return '−x'; return num(k)+'x'; }

/* THE SHIFTER'S POWER: the four products, named and traced, so x·x becoming x²
   is watched rather than asserted. Repainted on every keystroke. */
MF.paintShifterRail = function(B, host){
  host = host || B._rail; if(!host) return;
  clear(host);
  if(!MF.hasTool('shifter')) return;
  if(B.slots.length!==2) return;
  var s1=B.slots[0], s2=B.slots[1];
  if(!isFinite(s1.m)||!isFinite(s1.k)||!isFinite(s2.m)||!isFinite(s2.k)) return;

  var rail = E('div','panel'); rail.style.background='#fff'; rail.style.margin='12px 0 0';
  rail.appendChild(H('div','panel-tag','&#8646; THE EXPONENT RAIL'));
  var parts = [
    ['x-part × x-part', xt2(s1.m)+' × '+xt2(s2.m), (s1.m*s2.m===0?'0':(s1.m*s2.m===1?'x²':num(s1.m*s2.m)+'x²')),
     'x · x = x², and this is the only place an x² can come from'],
    ['x-part × number',  xt2(s1.m)+' × '+num(s2.k), xt2(s1.m*s2.k), 'one x survives, so it lands in the middle'],
    ['number × x-part',  num(s1.k)+' × '+xt2(s2.m), xt2(s1.k*s2.m), 'one x survives, so it lands in the middle'],
    ['number × number',  num(s1.k)+' × '+num(s2.k), num(s1.k*s2.k), 'no x left at all, so it lands on the end']
  ];
  var tbl = E('table','scan');
  var hr = E('tr'); ['which two','multiplied','gives','why it lands where it does'].forEach(function(h){ hr.appendChild(E('th',null,h)); });
  tbl.appendChild(hr);
  parts.forEach(function(p,i){
    var tr = E('tr');
    if(i===1||i===2) tr.style.background = 'var(--tile-x)';
    p.forEach(function(cell,ci){ tr.appendChild(H('td',null, ci===2 ? '<b>'+cell+'</b>' : cell)); });
    tbl.appendChild(tr);
  });
  rail.appendChild(tbl);
  var mid = s1.m*s2.k + s1.k*s2.m;
  /* "−x + −8x" reads as nonsense; the two terms are named, not added in prose */
  rail.appendChild(H('div','hint','The two shaded rows are the same kind of thing, so they run together: ' +
    '<b>' + xt2(s1.m*s2.k) + '</b> and <b>' + xt2(s1.k*s2.m) + '</b> make <b>' + xt2(mid) + '</b>.'));
  host.appendChild(rail);
};

/* the number path: split, and keep splitting, until every piece is an ingot */
MF.paintNumberSmelt = function(host, B){
  host.appendChild(H('p','hint','<b>Split it, and keep splitting.</b> Choose any cut you like — every route reaches the same metals.'));
  var cru = E('div','crucible');
  cru.appendChild(H('h4',null,'The crucible'));
  var row = E('div','ingotrow');
  var allPure = true;
  B.pieces.forEach(function(v, idx){
    if(isPrime(v)){
      row.appendChild(H('div','ingot pure', num(v)));
    } else {
      allPure = false;
      var box = E('div');
      box.appendChild(H('div','ingot', num(v)));
      var chips = E('div','chips'); chips.style.marginTop='4px';
      factorPairs(v).filter(function(p){ return p[0]!==1; }).forEach(function(p){
        var b = E('button','btn', num(p[0])+' × '+num(p[1])); b.type='button';
        b.style.minHeight='38px'; b.style.padding='5px 10px'; b.style.fontSize='13px';
        on(b,'click',function(){
          B.pieces.splice(idx,1,p[0],p[1]);
          MF.paintMine();
        });
        chips.appendChild(b);
      });
      box.appendChild(chips);
      row.appendChild(box);
    }
  });
  cru.appendChild(row);
  host.appendChild(cru);
  if(allPure){
    host.appendChild(H('div','note good','<b>Everything in there is an ingot now.</b> Nothing splits any further.'));
    var pour = E('button','btn primary big','Pour it into the mold'); pour.type='button';
    on(pour,'click',function(){
      B.slots = B.pieces.map(function(v){ return {m:0,k:v}; });
      B.step='pour'; MF.paintMine();
    });
    host.appendChild(pour);
  } else {
    host.appendChild(H('p','hint','Keep cutting until every piece is pure.'));
  }
};

/* the decimal dial - gear. This is where integers stop being an assumption. */
MF.paintDial = function(host, B){
  var ore = B.ore;
  var d = E('div','panel'); d.style.background='#fff';
  d.appendChild(H('div','panel-tag','DECIMAL DIAL'));
  d.appendChild(H('p','hint','Nudge the last number off the whole numbers and watch what happens to the seam. The smelter never breaks — the <em>search</em> does.'));
  var off = 0;
  var readout = E('div'); d.appendChild(readout);
  var r = document.createElement('input');
  r.type='range'; r.min=-2; r.max=2; r.step=0.5; r.value=0;
  r.setAttribute('aria-label','Nudge the last term');
  on(r,'input',function(){ off = parseFloat(r.value); paint(); });
  d.appendChild(r);
  host.appendChild(d);
  function paint(){
    clear(readout);
    var c2 = ore.c + off;
    var res = MF.smeltPoly(ore.a, ore.b, c2);
    var clean = (res.kind!=='pure');
    readout.appendChild(H('div','eq sm', quad(ore.a, ore.b, c2)));
    var m = E('div','note ' + (clean?'good':'warn'));
    /* The dial says WHETHER a whole-number seam exists. It must never say what
       it is: printing the factorisation here put the finished answer directly
       above the pour button, which is supposed to be the only judge. */
    m.innerHTML = clean
      ? '<b>A whole-number seam runs through this one.</b> Whole ingots will land on it — though the dial is not going to tell you which.'
      : '<b>No whole-number seam.</b> ' + (res.realRoots
          ? (res.realRoots.length > 1
              ? 'The seam is real — near ' + num(Math.round(res.realRoots[0]*100)/100) + ' and ' + num(Math.round(res.realRoots[1]*100)/100) +
                ' — but those are not whole numbers, and whole ingots will never land on them.'
              : 'The seam is real — it runs at ' + num(Math.round(res.realRoots[0]*1000)/1000) +
                ' — but that is not a whole number, and whole ingots will never land on it.')
          : 'And none on decimals either.');
    readout.appendChild(m);
  }
  paint();
};

MF.scanTable = function(host, target, wanted){
  var rows = [];
  factorPairs(target).forEach(function(pr){
    var f=pr[0], s=pr[1];
    if(target>=0){ rows.push([f,s]); rows.push([-f,-s]); } else { rows.push([-f,s]); rows.push([f,-s]); }
  });
  rows = rows.filter(function(r){ return r[0]*r[1]===target; });
  var tbl = E('table','scan');
  var hr = E('tr'); ['pair','multiply to','add to'].forEach(function(h){ hr.appendChild(E('th',null,h)); });
  tbl.appendChild(hr);
  rows.forEach(function(r){
    var tr = E('tr');
    tr.appendChild(E('td',null, num(r[0]) + '  and  ' + num(r[1])));
    tr.appendChild(E('td',null, num(r[0]*r[1])));
    tr.appendChild(E('td',null, num(r[0]+r[1])));
    if(wanted!=null && r[0]+r[1]===wanted) tr.className='hit';
    tbl.appendChild(tr);
  });
  host.appendChild(tbl);
  return rows.length;
};

/* ---------- POUR: the only correctness signal in the build ---------- */
MF.paintPour = function(host, B){
  var ore = B.ore;
  var prod = ingotProduct(B.slots);
  var want = (ore.kind==='number') ? {a:0,b:0,c:ore.n} : {a:ore.a,b:ore.b,c:ore.c};
  var clean = !prod.overflow && prod.a===want.a && prod.b===want.b && prod.c===want.c;

  /* the pour itself, drawn: molten metal falls from the crucible into the mold
     and the casting comes out of it. The spectacle rewards the work; it never
     reports a quantity and there is nothing to score. */
  var pourArt = E('div','stage'); pourArt.style.background = 'linear-gradient(180deg,#3A3129,#241D18)';
  pourArt.style.borderColor = '#6B5B48';
  var PW=420, PH=190;
  var psvg = S('svg',{viewBox:'0 0 '+PW+' '+PH, role:'img',
    'aria-label': clean ? 'Molten metal pours into the mold and a clean casting forms.'
                        : 'Molten metal pours into the mold and the casting comes out misshapen.'});
  psvg.appendChild(S('path',{d:'M120 26 q46 -14 92 0 l-12 42 q-34 -10 -68 0 Z',fill:'#7C838A',stroke:'#4A5158','stroke-width':'2'}));
  psvg.appendChild(S('path',{d:'M132 34 q34 -9 68 0 l-5 17 q-29 -8 -58 0 Z',fill:'#E2600F'}));
  var stream = S('rect',{class:'moltenstream',x:'160',y:'66',width:'11',height:'56',rx:'5',fill:'#FFB347'});
  psvg.appendChild(stream);
  psvg.appendChild(S('path',{d:'M96 122 h140 l-14 46 h-112 Z',fill:'#4A3F34',stroke:'#2E2620','stroke-width':'3'}));
  if(clean){
    psvg.appendChild(S('rect',{x:'250',y:'104',width:'116',height:'40',rx:'6',fill:'#F2DCA4',stroke:'#8A6A2A','stroke-width':'3'}));
    psvg.appendChild(S('rect',{x:'258',y:'110',width:'100',height:'10',rx:'4',fill:'#FFF3DE',opacity:'.75'}));
  } else {
    psvg.appendChild(S('path',{d:'M250 140 q16 -34 40 -18 q10 -30 34 -8 q28 -14 34 26 q-16 14 -54 8 q-34 8 -54 -8 Z',
      fill:'#8C6A4B',stroke:'#5A4230','stroke-width':'3'}));
    psvg.appendChild(S('path',{d:'M276 132 l12 -14 l6 16 l14 -12',fill:'none',stroke:'#3A2A1C','stroke-width':'3'}));
  }
  var lbl = S('text',{x:'308',y:'168','text-anchor':'middle','font-size':'13',
    'font-family':'Verdana,system-ui,sans-serif',fill:'#D9C39C'});
  lbl.textContent = clean ? 'it holds its shape' : 'it will not hold its shape';
  psvg.appendChild(lbl);
  pourArt.appendChild(psvg);
  host.appendChild(pourArt);

  var cast = E('div','casting castingwrap ' + (clean?'clean':'deformed'));
  cast.appendChild(H('h4',null, clean ? 'A clean casting.' : 'The casting came out deformed.'));

  var poured = B.slots.map(function(g){
    return (g.m===0) ? num(g.k) : '(' + linear(g.m,g.k) + ')';
  }).join('');
  cast.appendChild(H('div','eq sm','you poured ' + poured));
  cast.appendChild(H('div','eq sm','the mold formed <b>' + (prod.overflow ? 'something of degree '+prod.degree : quad(prod.a,prod.b,prod.c)) + '</b>'));
  cast.appendChild(H('div','eq sm','<span class="dim">the ore was</span> ' + MF.oreLabel(ore)));

  if(clean){
    cast.appendChild(H('p',null,'Those metals were in that rock. Nobody had to tell you — the mold told you.'));
  } else {
    var diffs = [];
    if(prod.overflow){ diffs.push('you poured enough metal for a degree-' + prod.degree + ' object, and the ore is not that big'); }
    else {
      if(prod.a!==want.a) diffs.push('the x² part came out <b>' + num(prod.a) + '</b> and the ore has <b>' + num(want.a) + '</b>');
      if(prod.b!==want.b) diffs.push('the middle came out <b>' + num(prod.b) + '</b> and the ore has <b>' + num(want.b) + '</b>');
      if(prod.c!==want.c) diffs.push('the plain number came out <b>' + num(prod.c) + '</b> and the ore has <b>' + num(want.c) + '</b>');
    }
    cast.appendChild(H('p',null,'Where it went wrong: ' + diffs.join('; ') + '.'));
    cast.appendChild(H('p','hint','Nothing is lost. The metal goes back in the crucible and you can pour again.'));
  }
  host.appendChild(cast);

  var row = E('div','row'); row.style.marginTop='12px';
  if(clean){
    var keep = E('button','btn primary','Take the metals to the yard'); keep.type='button';
    on(keep,'click',function(){
      B.slots.forEach(function(g){ MF.addToYard({m:g.m,k:g.k}); });
      MF.finishLump(B, true, 'Clean casting.');
    });
    row.appendChild(keep);
  } else {
    var again = E('button','btn primary','Back to the crucible'); again.type='button';
    on(again,'click',function(){ B.step='smelt'; MF.paintMine(); });
    row.appendChild(again);
    var toss = E('button','btn','Put the lump back in the cart'); toss.type='button';
    on(toss,'click',function(){ MF.state.bench=null; MF.state.selected=null; MF.paintMine(); });
    row.appendChild(toss);
  }
  host.appendChild(row);
};

MF.finishLump = function(B, ok, why){
  var id = B.ore.id;
  MF.state.cart = MF.state.cart.filter(function(o){ return o.id!==id; });
  MF.state.selected = null; MF.state.bench = null;
  MF.state.pours++;
  MF.paintMine();
  MF.flash(why || 'Done.');
};
/* Flashes are QUEUED, not written straight into the column. Two of the three
   gear announcements never reached a student: grantGear flashed, and the very
   next line repainted the mine and wiped the message it had just inserted. */
MF.flashQueue = [];
/* Enqueue only - do NOT drain here. Every caller of flash() is followed by a
   repaint that clears the column, so draining immediately wrote the message
   into a panel that was about to be destroyed: two of the three gear
   announcements never reached the screen. paintMine drains at the END of a
   paint, and the timeout catches any flash with no repaint behind it. */
MF.flash = function(msg){
  MF.flashQueue.push(msg);
  setTimeout(MF.drainFlashes, 0);
};
MF.drainFlashes = function(){
  var host = MF._mine && MF._mine.mid;
  /* isConnected: MF._mine survives navigation away from the mine, so a flash
     raised off-mine drained into a detached node and emptied the queue with
     nothing reaching the page. Nothing triggers it today - flash has one call
     site, on the mine - but it is the same class as the gear announcements. */
  if(!host || !host.isConnected || !MF.flashQueue.length) return;
  MF.flashQueue.splice(0).forEach(function(msg){
    var n = H('div','note good', msg);
    host.insertBefore(n, host.firstChild);
    setTimeout(function(){ if(n.parentNode) n.parentNode.removeChild(n); }, 5200);
  });
};

/* ---------- the yard and the gear rack ---------- */
MF.paintYard = function(){
  var host = clear(MF._mine.right);
  var box = E('div','yard');

  box.appendChild(H('h3',null,'The Yard'));
  var keys = Object.keys(MF.state.yard);
  if(!keys.length){
    box.appendChild(H('div','hint','No metals yet. Everything you smelt cleanly ends up here.'));
  } else {
    box.appendChild(H('div','hint','Metals you have pulled out of the rock.'));
    /* plain metals on one shelf, x-carrying ones on another - a yard is sorted */
    var rack = E('div','metalrack orebin');
    [['plain metal', function(g){ return g.m===0; }],
     ['metal with an x in it', function(g){ return g.m!==0; }]].forEach(function(grp){
      var these = keys.filter(function(k){ return grp[1](MF.state.yard[k].ingot); });
      if(!these.length) return;
      var shelf = E('div','shelf');
      shelf.appendChild(H('div','hint', grp[0]));
      var row = E('div','metalrow heap');
      these.sort().forEach(function(k){
        var e = MF.state.yard[k];
        var label = e.ingot.label || ingotText(e.ingot);
        row.appendChild(H('div','metal' + (e.ingot.m===0?' pure':''),
          label + (e.count>1 ? ' <span class="ct">×'+e.count+'</span>' : '')));
      });
      shelf.appendChild(row);
      rack.appendChild(shelf);
    });
    box.appendChild(rack);
  }

  var gear = E('div','gearbox'); gear.style.marginTop='18px';
  gear.appendChild(H('h3',null,'On your belt'));
  var any = false;
  Object.keys(MF.TOOLS).forEach(function(k){
    if(!MF.hasTool(k)) return;
    any = true;
    var g = MF.TOOLS[k];
    var d = E('div','gear');
    d.appendChild(H('div','ic', g.ic));
    var t = E('div');
    t.appendChild(H('div','nm', g.nm));
    t.appendChild(H('div','ds', g.ds));
    d.appendChild(t);
    gear.appendChild(d);
  });
  if(!any) gear.appendChild(H('div','hint','Empty. Tools are not handed out here — you forge them, from metal you pulled out yourself.'));
  box.appendChild(gear);

  var toForge = E('button','btn primary'); toForge.type='button';
  toForge.textContent = 'Haul the metal to the forge';
  toForge.style.marginTop='12px'; toForge.style.width='100%';
  on(toForge,'click',function(){ MF.go('forge'); });
  box.appendChild(toForge);

  box.appendChild(H('div','hint','<br>Nothing here is a mark. It is a record of what you have — and unlike a mark, you can spend it.'));
  host.appendChild(box);
};

/* =========================================================================
   MF.validate() - every check reports its denominator, and it carries a
   control that MUST fail. A check that only ever passes is worthless.
   ========================================================================= */
MF.validate = function(){
  var errs = [], checked = 0, counts = {};
  function chk(group){ counts[group] = (counts[group]||0)+1; checked++; }

  /* 1. the engine: every factorisation must multiply back exactly */
  for(var a=0;a<=6;a++) for(var b=-12;b<=12;b++) for(var c=-12;c<=12;c++){
    if(a===0 && b===0) continue;
    var r = MF.smeltPoly(a,b,c);
    if(!r.ingots) continue;
    if(r.ingots.some(function(g){ return g.m===0 && g.k===0; })) continue;
    chk('engine');
    var back = ingotProduct(r.ingots);
    if(back.overflow || back.a!==a || back.b!==b || back.c!==c)
      errs.push('engine: '+a+','+b+','+c+' did not multiply back');
  }

  /* 2. seam classification on cases chosen because they are easy to get wrong */
  [[1,0,-9,'twin'],[4,0,-25,'twin'],[1,-5,6,'plain'],[1,0,4,'pure'],[1,0,-2,'pure'],
   [2,7,3,'loaded'],[3,12,0,'shared'],[1,1,0,'shared'],[12,0,-75,'shared'],[0,5,15,'shared'],[0,5,3,'pure']]
  .forEach(function(t){
    chk('classify');
    var got = MF.smeltPoly(t[0],t[1],t[2]).kind;
    if(got!==t[3]) errs.push('classify: '+t[0]+','+t[1]+','+t[2]+' expected '+t[3]+' got '+got);
  });

  /* 3. THE ORE GENERATOR. Every layer, many seeds, and every lump handed to a
        student must be classifiable and smeltable. This is the check that
        matters most, because the ore is generated rather than authored. */
  var rng = makeRng(20260819);
  for(var layer=1; layer<=5; layer++){
    for(var i=0;i<160;i++){
      chk('ore');
      var o = MF.digOre(layer, rng);
      if(!o){ errs.push('ore: layer '+layer+' produced nothing on draw '+i); continue; }
      var kind = MF.assayOf(o);
      if(!MF.ASSAY[kind]){ errs.push('ore: layer '+layer+' gave an unclassifiable lump '+MF.oreText(o)); continue; }
      if(o.kind==='poly'){
        var res = MF.smeltPoly(o.a,o.b,o.c);
        if(res.kind!=='pure'){
          var back2 = ingotProduct(res.ingots||[]);
          if(back2.overflow || back2.a!==o.a || back2.b!==o.b || back2.c!==o.c)
            errs.push('ore: layer '+layer+' lump '+MF.oreText(o)+' does not smelt back');
        }
        if(o.a===0 && o.b===0) errs.push('ore: layer '+layer+' produced an empty lump');
      } else if(o.n < 2){ errs.push('ore: layer '+layer+' produced a number below 2'); }
      /* the layer must actually deliver the ore it advertises */
      if(layer===5 && o.kind==='poly' && o.a===1) errs.push('ore: layer 5 handed out an unloaded trinomial');
      if(layer===1 && o.kind!=='number') errs.push('ore: layer 1 handed out a polynomial');
    }
  }

  /* 4. printing must never leak a float artefact, and never a phantom term */
  [0.1+0.2, 1/3, 4.5, -0.5].forEach(function(f){ chk('print'); if(num(f).length>9) errs.push('print: long float '+num(f)); });
  chk('print'); if(quadText(0,5,15)!=='5x + 15')  errs.push('print: quad(0,5,15) gave '+quadText(0,5,15));
  chk('print'); if(quadText(1,0,-9)!=='x² − 9')   errs.push('print: quad(1,0,-9) gave '+quadText(1,0,-9));
  chk('print'); if(quadText(1,1,1)!=='x² + x + 1')errs.push('print: quad(1,1,1) gave '+quadText(1,1,1));

  /* 5. the pour must be the ONLY thing that judges a smelt. A wrong set of
        metals must produce a deformed casting, and a right one a clean one. */
  chk('pour'); var good = ingotProduct([{m:1,k:-2},{m:1,k:-3}]);
  if(!(good.a===1 && good.b===-5 && good.c===6)) errs.push('pour: correct metals did not cast the ore');
  chk('pour'); var bad = ingotProduct([{m:1,k:2},{m:1,k:3}]);
  if(bad.a===1 && bad.b===-5 && bad.c===6) errs.push('pour: wrong metals cast a clean object');

  /* 5b. THE FORGE. Every order must be forgeable from metal the mine can
         actually produce, forging must SPEND exactly what went in, and a wrong
         pour must come out scrap. */
  var savedYard = MF.state.yard, savedTools = MF.state.tools, savedForge = MF.state.forge;
  MF.state.yard = {}; MF.state.tools = {}; MF.state.forge = {slots:[], picked:null};

  /* stock a yard from real smelts so the metals are ones a student could own */
  var oreRng = makeRng(31337);
  for(var d=0; d<70; d++){
    var lump = MF.digOre(1 + (d % 5), oreRng);
    if(!lump) continue;
    if(lump.kind==='number'){ primeFactors(lump.n).forEach(function(p){ MF.addToYard({m:0,k:p}); }); }
    else {
      var rr = MF.smeltPoly(lump.a,lump.b,lump.c);
      if(rr.ingots) rr.ingots.forEach(function(g){ if(!(g.m===0&&g.k===0)) MF.addToYard({m:g.m,k:g.k}); });
    }
  }
  Object.keys(MF.TOOLS).forEach(function(key){
    chk('forge');
    if(!MF.toolReady(key)) errs.push('forge: "'+MF.TOOLS[key].nm+'" is not forgeable from 70 real smelts - an unreachable order');
  });

  /* a correct forge spends its metal; a wrong one does not and stays scrap */
  chk('forge');
  var beforeCount = MF.yardList().length;
  var threePrimes = MF.yardList().filter(function(e){ return isPlainMetal(e.ingot) && isPrime(e.ingot.k); }).slice(0,3);
  if(threePrimes.length===3){
    var verdict = MF.forgeJudge(MF.TOOLS.lantern, threePrimes.map(function(e){ return e.ingot; }),
                                ingotProduct(threePrimes.map(function(e){ return e.ingot; })));
    if(!verdict.ok) errs.push('forge: three genuine primes were judged unsound for the Lantern');
    MF.spendFromYard(threePrimes.map(function(e){ return e.key; }));
    if(MF.yardList().length !== beforeCount-3) errs.push('forge: spending three metals did not remove exactly three from the yard');
  } else { errs.push('forge: could not find three primes in a yard built from 70 smelts'); }

  chk('forge');
  var wrong = MF.forgeJudge(MF.TOOLS.lantern, [{m:1,k:2},{m:0,k:3},{m:0,k:5}], ingotProduct([{m:1,k:2},{m:0,k:3},{m:0,k:5}]));
  if(wrong.ok) errs.push('forge: an x-carrying ingot was accepted into a Lantern, which is cast from pure metal only');
  chk('forge');
  var mismatched = MF.forgeJudge(MF.TOOLS.drill, [{m:1,k:5},{m:1,k:4}], ingotProduct([{m:1,k:5},{m:1,k:4}]));
  if(mismatched.ok) errs.push('forge: (x+5)(x+4) was accepted as a matched pair for the Drill');
  chk('forge');
  var matched = MF.forgeJudge(MF.TOOLS.drill, [{m:1,k:5},{m:1,k:-5}], ingotProduct([{m:1,k:5},{m:1,k:-5}]));
  if(!matched.ok) errs.push('forge: (x+5)(x-5) was rejected as a matched pair for the Drill');

  /* 5e. EVERY PLACE MUST HAVE A DOOR IN THE WORLD.
         The forge shipped as a whole screen with no building on the surface,
         in a design whose stated principle is that the buildings ARE the
         navigation. Fixing the instance is not enough - this asserts the
         class, so the next screen added cannot be doorless either. */
  var sceneProbe = MF.surfaceScene();
  var doors = {};
  Array.prototype.forEach.call(sceneProbe.querySelectorAll('.hot'), function(g){
    doors[g.getAttribute('data-screen')] = (g.getAttribute('aria-label')||'').trim();
  });
  /* every place that is not the surface itself needs a way in from the world */
  ['workshop-mold','workshop-ore','mine','forge'].forEach(function(scr){
    chk('doors');
    if(!doors[scr]) errs.push('doors: "' + scr + '" is a place with no building on the surface');
  });
  /* and no door may lead somewhere that does not exist */
  Object.keys(doors).forEach(function(scr){
    chk('doors');
    if(!MF.SCREENS[scr]) errs.push('doors: the building labelled "' + doors[scr] + '" opens "' + scr + '", which is not a screen');
  });
  /* the smelting house must open the workshop about SMELTING, not the mold -
     these were wired to each other's screens */
  chk('doors');
  if(!/Smelt/i.test(doors['workshop-ore']||'')) errs.push('doors: the ore workshop is behind "' + doors['workshop-ore'] + '", which does not read as smelting');
  chk('doors');
  if(!/Cast|Mold/i.test(doors['workshop-mold']||'')) errs.push('doors: the mold workshop is behind "' + doors['workshop-mold'] + '", which does not read as casting');

  /* 5d. THE SEAM. Ore must be spread along its whole length, not bunched at
         one end where a student who scans would find nothing. */
  var savedFace = MF.state.face, savedFaceLayer = MF.state.faceLayer, savedScan = MF.state.scan;
  for(var sl=1; sl<=MF.LAYERS.length; sl++){
    chk('seam');
    MF.state.layer = sl; MF.state.face = []; MF.state.faceLayer = null;
    var seam = MF.stockFace();
    if(seam.length < MF.SEAM_COUNT){ errs.push('seam: layer '+sl+' only stocked '+seam.length+' of the seam'); continue; }
    /* split the seam into thirds and assert every third holds ore */
    var thirds = [0,0,0];
    seam.forEach(function(o){ thirds[Math.min(2, Math.floor((o.px / MF.SEAM_W) * 3))]++; });
    thirds.forEach(function(n, i){
      if(n === 0) errs.push('seam: layer '+sl+' has no ore in third '+(i+1)+' - scanning there finds bare rock');
    });
    var offEnd = seam.filter(function(o){ return o.px < 0 || o.px > MF.SEAM_W; }).length;
    if(offEnd) errs.push('seam: layer '+sl+' put '+offEnd+' lumps outside the drawn rock');
  }
  MF.state.face = savedFace; MF.state.faceLayer = savedFaceLayer; MF.state.scan = savedScan;

  /* 5c. A TOOL MUST NEVER GATE DESCENT. With nothing forged and an empty yard,
         every layer must still be reachable and still hand out ore. */
  MF.state.yard = {}; MF.state.tools = {};
  for(var L=1; L<=MF.LAYERS.length; L++){
    chk('nogate');
    var probeRng = makeRng(900+L);
    var got = MF.digOre(L, probeRng);
    if(!got) errs.push('nogate: layer '+L+' produced no ore for a student with no tools');
  }
  MF.state.yard = savedYard; MF.state.tools = savedTools; MF.state.forge = savedForge;

  /* 5h. NO DISTRACTOR MAY BE TRUE, AND NO ROOT MAY BE DENIED.
         Both of these shipped and both were student-facing falsehoods:
         4x²−4 was graded Common Vein only while literally being two squares
         with a minus and no middle term, and the Decimal Dial told every
         linear lump it had no decimal seam when it always has exactly one. */
  var seamRng = makeRng(24601);
  for(var sw=0; sw<400; sw++){
    var slump = MF.digOre(1 + (sw % 5), seamRng);
    if(!slump || slump.kind!=='poly') continue;
    chk('truthy');
    var acc = MF.assayAccepts(slump);
    /* if it LOOKS like a twin seam by the tell this site prints, that call must be accepted */
    var looksTwin = (slump.a!==0 && slump.b===0 && slump.c<0 && isSquare(slump.a) && isSquare(-slump.c));
    if(looksTwin && acc.indexOf('twin') < 0)
      errs.push('truthy: ' + quadText(slump.a,slump.b,slump.c) + ' is two squares minus two squares, but "Twin Seam" is graded wrong');
    /* a lump with a real root must never be told it has none */
    chk('truthy');
    var sres = MF.smeltPoly(slump.a, slump.b, slump.c);
    var hasRealRoot = (slump.a===0) ? (slump.b!==0) : (slump.b*slump.b - 4*slump.a*slump.c > 0);
    if(hasRealRoot && sres.kind==='pure' && !sres.realRoots)
      errs.push('truthy: ' + quadText(slump.a,slump.b,slump.c) + ' has a real root but the dial would report none');
  }
  /* CONTROLS: both must fail */
  chk('truthy');
  if(MF.assayAccepts({kind:'poly',a:4,b:0,c:-4}).indexOf('twin') < 0)
    errs.push('CONTROL: 4x²−4 still rejects the Twin Seam reading');
  chk('truthy');
  var linProbe = MF.smeltPoly(0,12,17);
  if(!linProbe.realRoots || Math.abs(linProbe.realRoots[0] + 17/12) > 1e-9)
    errs.push('CONTROL: 12x+17 does not report its real root of −17/12');

  /* 5g. NO ANIMATED ELEMENT MAY CARRY AN SVG transform ATTRIBUTE.
         A CSS transform animation REPLACES the transform attribute rather than
         composing with it, so a positioned group that also animates drifts off
         its mount. This has now happened three times - the ore cart ended up in
         the sky, the headframe wheel left its tower, and the assay balance
         vanished from its room entirely. Twice it was fixed as an instance.
         This asserts the class: position on an outer mount, animate the inner. */
  MF.ANIM_TRANSFORM_CLASSES = ['sc-wheel','sc-cart','sc-smoke','sc-cloud','sc-bird',
                               'rm-fire','rm-bellows','rm-steam','rm-ladle','rm-scale','pickarm'];
  var animStage = document.createElement('div');
  animStage.style.cssText = 'position:absolute; left:-12000px; top:0; width:1100px';
  document.body.appendChild(animStage);
  var animSubjects = [MF.surfaceScene(), MF.roomScene('foundry'), MF.roomScene('assay'), MF.roomScene('forge')];
  animSubjects.forEach(function(node){ animStage.appendChild(node); });
  MF.ANIM_TRANSFORM_CLASSES.forEach(function(cls){
    chk('animmount');
    var offenders = [];
    animStage.querySelectorAll('.' + cls).forEach(function(el){
      if(el.hasAttribute('transform')) offenders.push(el.getAttribute('transform'));
    });
    if(offenders.length) errs.push('animmount: .' + cls + ' carries a transform attribute (' +
      offenders[0] + ') - the animation will replace it and the piece will drift off its mount');
  });
  /* CONTROL: plant the defect and confirm the check sees it */
  chk('animmount');
  var planted = document.createElementNS('http://www.w3.org/2000/svg','g');
  planted.setAttribute('class','rm-fire');
  planted.setAttribute('transform','translate(10,10)');
  animStage.appendChild(planted);
  var caught = false;
  animStage.querySelectorAll('.rm-fire').forEach(function(el){ if(el.hasAttribute('transform')) caught = true; });
  if(!caught) errs.push('CONTROL: the animated-transform check did not catch a planted offender');
  document.body.removeChild(animStage);

  /* 5f. CONTRAST, MEASURED RATHER THAN REMEMBERED.
         The yard's metal bars measured 2.27:1 for as long as they existed and
         nobody noticed, because the sweep only ever ran by hand and the yard
         was usually empty when it did. This runs on every validate, against a
         POPULATED state, and resolves gradient backdrops properly - the naive
         walker climbs past a gradient to the body colour and reports false
         failures on every dark surface in this build. */
  var stage = document.createElement('div');
  stage.setAttribute('aria-hidden','true');
  /* off-screen, NOT display:none - a hidden subtree has no layout and no
     resolved colours, so it would measure nothing and report clean (s2) */
  stage.style.cssText = 'position:absolute; left:-12000px; top:0; width:1100px';
  document.body.appendChild(stage);

  function _rgb(v){ var m=(v||'').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/); return m?[+m[1],+m[2],+m[3]]:null; }
  function _lum(c){ var a=c.map(function(x){ x/=255; return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4); });
    return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2]; }
  function _ratio(f,b){ var L1=_lum(f),L2=_lum(b); return (Math.max(L1,L2)+0.05)/(Math.min(L1,L2)+0.05); }
  function _backdrops(el, root){
    var n=el;
    while(n && n!==root.parentNode){
      var cs=getComputedStyle(n), bg=_rgb(cs.backgroundColor);
      if(bg && cs.backgroundColor.indexOf('rgba(0, 0, 0, 0)')<0) return [bg];
      var img=cs.backgroundImage||'';
      if(img.indexOf('gradient')>=0){
        var st=(img.match(/rgba?\([^)]+\)/g)||[]).map(_rgb).filter(Boolean);
        if(st.length) return st;
      }
      n=n.parentElement;
    }
    return [[253,248,240]];
  }
  MF._measureContrast = function(root){
    var out = [];
    root.querySelectorAll('*').forEach(function(el){
      var direct = Array.prototype.some.call(el.childNodes, function(n){ return n.nodeType===3 && n.textContent.trim().length>1; });
      if(!direct) return;
      var cs = getComputedStyle(el);
      if(cs.display==='none' || cs.visibility==='hidden' || parseFloat(cs.opacity)===0) return;
      var f=_rgb(cs.color); if(!f) return;
      var px=parseFloat(cs.fontSize), bold=parseInt(cs.fontWeight,10)>=700;
      var need = (px>=24 || (px>=18.66 && bold)) ? 3 : 4.5;
      var r = Math.min.apply(null, _backdrops(el, root).map(function(b){ return _ratio(f,b); }));
      out.push({el:el, ratio:Math.round(r*100)/100, need:need,
                text:(el.textContent||'').trim().slice(0,30), cls:(el.className||'').toString().slice(0,24)});
    });
    return out;
  };

  /* populate hard: tools forged, a stocked yard, a lump mid-smelt - the states
     where the new surfaces actually have text on them */
  var cSaved = {yard:MF.state.yard, tools:MF.state.tools, cart:MF.state.cart, sel:MF.state.selected,
                bench:MF.state.bench, mine:MF._mine, layer:MF.state.layer, face:MF.state.face, fl:MF.state.faceLayer};
  MF.state.yard={}; MF.state.tools={lantern:{forged:true},shifter:{forged:true},drill:{forged:true}};
  var cRng = makeRng(5150);
  for(var ci=0; ci<10; ci++){
    var cl = MF.digOre(1+(ci%5), cRng); if(!cl) continue;
    if(cl.kind==='number') primeFactors(cl.n).forEach(function(p){ MF.addToYard({m:0,k:p}); });
    else { var cr = MF.smeltPoly(cl.a,cl.b,cl.c); if(cr.ingots) cr.ingots.forEach(function(g){ if(!(g.m===0&&g.k===0)) MF.addToYard({m:g.m,k:g.k}); }); }
  }
  var contrastFails = [];
  ['home','workshop-mold','workshop-ore','forge','mine'].forEach(function(scr){
    stage.innerHTML='';
    var probe = document.createElement('div');
    stage.appendChild(probe);
    try {
      if(scr==='mine'){
        MF._mine = null;
        MF.SCREENS.mine(probe);
        MF.state.layer=4; MF.state.face=[]; MF.state.faceLayer=null;
        var lump = MF.digOre(4, cRng);
        if(lump){ MF.state.cart=[lump]; MF.state.selected=lump; MF.state.bench=MF.benchInit(lump); MF.state.bench.step='smelt'; }
        MF.paintMine();
      } else { MF.SCREENS[scr](probe); }
    } catch(e){ errs.push('contrast: screen '+scr+' threw: '+e.message); return; }
    MF._measureContrast(probe).forEach(function(m){
      chk('contrast');
      if(m.ratio < m.need) contrastFails.push(scr+': "'+m.text+'" ('+m.cls+') at '+m.ratio+':1, needs '+m.need);
    });
  });
  contrastFails.slice(0,8).forEach(function(f){ errs.push('contrast: '+f); });
  if(contrastFails.length > 8) errs.push('contrast: and '+(contrastFails.length-8)+' more');

  /* CONTROL: unreadable text must be caught, or the sweep is measuring nothing */
  chk('contrast');
  stage.innerHTML = '<div style="background:#FDF8F0"><p style="color:#FBF6EE;font-size:14px">invisible</p></div>';
  var ctrlHits = MF._measureContrast(stage).filter(function(m){ return m.ratio < m.need; });
  if(!ctrlHits.length) errs.push('CONTROL: the contrast sweep did not catch cream text on cream');

  document.body.removeChild(stage);
  MF.state.yard=cSaved.yard; MF.state.tools=cSaved.tools; MF.state.cart=cSaved.cart;
  MF.state.selected=cSaved.sel; MF.state.bench=cSaved.bench; MF._mine=cSaved.mine;
  MF.state.layer=cSaved.layer; MF.state.face=cSaved.face; MF.state.faceLayer=cSaved.fl;

  /* 6. NOTHING ON SCREEN MAY HAVE A CEILING, A PERCENTAGE, OR A COMPARISON.
        This is a stated requirement, so it is checked mechanically rather
        than trusted (philosophy 2.5a). */
  var banned = /(\d+\s*(?:%|percent))|(\b\d+\s*(?:out of|\/)\s*\d+\b)|\b(score|scored|grade|graded|accuracy|rank|ranked|leaderboard|streak|correct answers)\b/i;
  ['home','workshop-mold','workshop-ore','mine','forge'].forEach(function(name){
    chk('nogrades');
    var probe = document.createElement('div');
    try { MF.SCREENS[name](probe); } catch(e){ errs.push('nogrades: screen '+name+' threw: '+e.message); return; }
    var txt = probe.textContent || '';
    var m = txt.match(banned);
    if(m) errs.push('nogrades: screen "'+name+'" contains "'+m[0]+'"');
  });

  /* 7. CONTROL - must fail, or none of the above is looking at anything */
  chk('control');
  var controlFailed = !(MF.smeltPoly(1,-5,6).kind === 'twin');   /* it is 'plain' */
  var bannedControl = banned.test('you scored 7 out of 10');      /* must be caught */
  if(!controlFailed)  errs.push('CONTROL: seam control did not fail - the instrument is not measuring');
  if(!bannedControl)  errs.push('CONTROL: the no-grades regex does not catch "7 out of 10"');

  var out = {checked:checked, byGroup:counts, errors:errs.length,
             control: (controlFailed && bannedControl) ? 'both controls failed as required' : 'A CONTROL DID NOT FAIL',
             detail: errs.slice(0,20)};
  console.log('[mine] validate:', out.checked, 'checks,', out.errors, 'errors, control:', out.control);
  if(errs.length) console.warn(errs.slice(0,20));
  return out;
};

/* MF.playthrough() - drives a whole lump end to end without a human, so the
   loop itself is covered rather than only its parts. Reports its denominator. */
MF.playthrough = function(layer){
  layer = layer || 4;
  var log = [], rng = makeRng(99);
  MF.go('mine');
  var ore = MF.digOre(layer, rng);
  MF.state.cart.push(ore); MF.state.selected = ore; MF.state.bench = null;
  MF.paintMine();
  var B = MF.state.bench = MF.benchInit(ore);
  log.push('ore: ' + MF.oreText(ore));
  var kind = MF.assayOf(ore);
  B.step = 'smelt'; log.push('assayed: ' + kind);
  var res = (ore.kind==='number') ? null : MF.smeltPoly(ore.a,ore.b,ore.c);
  if(ore.kind==='number'){
    B.pieces = primeFactors(ore.n);
    B.slots = B.pieces.map(function(v){ return {m:0,k:v}; });
  } else if(kind==='pure'){
    log.push('pure - nothing to smelt');
    return {ore:MF.oreText(ore), kind:kind, log:log, clean:true, steps:log.length};
  } else {
    B.slots = res.ingots.slice();
  }
  var prod = ingotProduct(B.slots);
  var want = (ore.kind==='number') ? {a:0,b:0,c:ore.n} : {a:ore.a,b:ore.b,c:ore.c};
  var clean = !prod.overflow && prod.a===want.a && prod.b===want.b && prod.c===want.c;
  log.push('poured: ' + B.slots.map(ingotText).join(' · '));
  log.push('casting: ' + (prod.overflow?'overflow':quadText(prod.a,prod.b,prod.c)) + (clean?' - CLEAN':' - DEFORMED'));
  B.step='pour'; MF.paintMine();
  return {ore:MF.oreText(ore), kind:kind, clean:clean, log:log, steps:log.length};
};

/* =========================================================================
   BOOT
   ========================================================================= */
MF.boot = function(){
  var motes = MF.ambient();
  q('#hero-art').appendChild(MF.art(46));
  MF.loadScreen();
  MF.go('home');
  console.log('[mine] booted:', MF.LAYERS.length, 'layers,', motes, 'motes');
  return {layers:MF.LAYERS.length, motes:motes};
};
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', MF.boot);
else MF.boot();
</script>
