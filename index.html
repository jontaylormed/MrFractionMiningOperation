   [{kind:'number',n:12},       {m:0,k:12}, 'whole',   'the whole lump'],
   [{kind:'number',n:12},       {m:0,k:1},  'nothing', 'one, which takes nothing out'],
   [{kind:'number',n:12},       {m:1,k:3},  'shape',   'an x-shaped pick on a number'],
   [{kind:'poly',a:1,b:0,c:-9}, {m:0,k:0},  'nothing', 'a pick with no edge on it']
  ].forEach(function(t){
    chk('break');
    var r = MF.breakOff(t[0], t[1]);
    if(r.ok) errs.push('break: '+ingotText(t[1])+' came out of '+MF.oreText(t[0])+' and it is '+t[3]);
    else if(r.reason!==t[2]) errs.push('break: '+t[3]+' was refused as "'+r.reason+'", expected "'+t[2]+'"');
  });
  /* and the ones that MUST come out, or the refusals above prove nothing */
  [[{kind:'poly',a:1,b:-5,c:6},  {m:1,k:-2}, 'x − 3'],
   [{kind:'poly',a:6,b:7,c:-3},  {m:2,k:3},  '3x − 1'],
   [{kind:'poly',a:0,b:6,c:15},  {m:0,k:3},  '2x + 5'],
   [{kind:'poly',a:1,b:0,c:-9},  {m:1,k:3},  'x − 3'],
   [{kind:'poly',a:0,b:5,c:15},  {m:1,k:3},  '5'],
   [{kind:'number',n:60},        {m:0,k:6},  '10']
  ].forEach(function(t){
    chk('break');
    var r = MF.breakOff(t[0], t[1]);
    if(!r.ok) errs.push('break: '+ingotText(t[1])+' would not come out of '+MF.oreText(t[0])+' ('+r.reason+')');
    else if(MF.oreText(r.right)!==t[2])
      errs.push('break: '+MF.oreText(t[0])+' ÷ '+ingotText(t[1])+' left '+MF.oreText(r.right)+', expected '+t[2]);
  });

  /* 3c. NATIVE METAL. A prime and an irreducible polynomial must answer this
         question identically - that identity is the whole thesis of the site,
         so it is asserted rather than assumed. */
  for(var nn=2; nn<=200; nn++){
    chk('native');
    if(MF.isNative({kind:'number',n:nn}) !== isPrime(nn))
      errs.push('native: '+nn+' disagreed with isPrime');
  }
  for(var na=0; na<=4; na++) for(var nb=-9; nb<=9; nb++) for(var nc=-9; nc<=9; nc++){
    if(na===0 && nb===0) continue;
    chk('native');
    var want = MF.smeltPoly(na,nb,nc).kind === 'pure';
    if(MF.isNative({kind:'poly',a:na,b:nb,c:nc}) !== want)
      errs.push('native: '+quadText(na,nb,nc)+' disagreed with the smelting engine');
  }
  /* a constant in polynomial clothes is the number, not a 'pure' polynomial */
  chk('native'); if(MF.isNative({kind:'poly',a:0,b:0,c:1}))  errs.push('native: 1 was called an element');
  chk('native'); if(!MF.isNative({kind:'poly',a:0,b:0,c:7})) errs.push('native: 7 in polynomial clothes was not called an element');
  chk('native'); if(MF.isNative({kind:'poly',a:0,b:0,c:12})) errs.push('native: 12 in polynomial clothes was called an element');

  /* 4. printing must never leak a float artefact, and never a phantom term */
  [0.1+0.2, 1/3, 4.5, -0.5].forEach(function(f){ chk('print'); if(num(f).length>9) errs.push('print: long float '+num(f)); });
  chk('print'); if(quadText(0,5,15)!=='5x + 15')  errs.push('print: quad(0,5,15) gave '+quadText(0,5,15));
  chk('print'); if(quadText(1,0,-9)!=='x² − 9')   errs.push('print: quad(1,0,-9) gave '+quadText(1,0,-9));
  chk('print'); if(quadText(1,1,1)!=='x² + x + 1')errs.push('print: quad(1,1,1) gave '+quadText(1,1,1));

  /* 5. the pour must be the ONLY thing that judges a smelt. A wrong set of
        metals must produce a deformed casting, and a right one a clean one. */
  chk('pour'); var good = ingotProduct([{m:1,k:-2},{m:1,k:-3}]);
  if(!(good.a===1 && good.b===-5 && good.c===6)) errs.push('pour: correct metals did not cast the ore');
  chk('pour'); var bad = ingotProduct([{m:1,k:2},{m:1,k:3}]);
  if(bad.a===1 && bad.b===-5 && bad.c===6) errs.push('pour: wrong metals cast a clean object');

  /* 5b. THE FORGE. Every order must be forgeable from metal the mine can
         actually produce, forging must SPEND exactly what went in, and a wrong
         pour must come out scrap. */
  var savedYard = MF.state.yard, savedTools = MF.state.tools, savedForge = MF.state.forge;
  MF.state.yard = {}; MF.state.tools = {}; MF.state.forge = {slots:[], picked:null};

  /* stock a yard from real smelts so the metals are ones a student could own.

     THIS WAS 70 SMELTS AND IT WAS A COIN FLIP DRESSED AS AN ASSERTION.
     70 across five layers is 14 lumps a layer, and the deep orders want very
     particular metal - the Auger is (3x − 1)(2x + 3). Re-run at fifteen other
     seeds, 70 smelts failed TEN times: the Auger missing nine of them, the
     Drill three, the Shifter two. It passed here on the luck of seed 31337
     alone, and the first change to the ore generator tipped it over - which
     read like the change breaking the forge, when what it did was reveal that
     this line had never really been checked.

     At 200 smelts, twenty seeds out of twenty reach all seven. That is also
     closer to what a student actually digs. The number was chosen by measuring
     where the failure rate goes to zero, not by nudging it until green. */
  var oreRng = makeRng(31337);
  for(var d=0; d<200; d++){
    var lump = MF.digOre(1 + (d % 5), oreRng);
    if(!lump) continue;
    if(lump.kind==='number'){ primeFactors(lump.n).forEach(function(p){ MF.addToYard({m:0,k:p}); }); }
    else {
      var rr = MF.smeltPoly(lump.a,lump.b,lump.c);
      if(rr.ingots) rr.ingots.forEach(function(g){ if(!(g.m===0&&g.k===0)) MF.addToYard({m:g.m,k:g.k}); });
    }
  }
  Object.keys(MF.TOOLS).forEach(function(key){
    chk('forge');
    if(!MF.toolReady(key)) errs.push('forge: "'+MF.TOOLS[key].nm+'" is not forgeable from 200 real smelts - an unreachable order');
  });

  /* AND NOT ON ONE SEED. Three more independent students, so a single lucky
     draw can never again be the whole basis of this claim. */
  [4242, 90210, 606060].forEach(function(seed){
    var mrSaved = MF.state.yard;
    MF.state.yard = {};
    var mrRng = makeRng(seed);
    for(var i=0; i<200; i++){
      var ml = MF.digOre(1 + (i % 5), mrRng);
      if(!ml) continue;
      if(ml.kind==='number'){ primeFactors(ml.n).forEach(function(p){ MF.addToYard({m:0,k:p}); }); }
      else { var mrr = MF.smeltPoly(ml.a,ml.b,ml.c);
             if(mrr.ingots) mrr.ingots.forEach(function(g){ if(!(g.m===0&&g.k===0)) MF.addToYard({m:g.m,k:g.k}); }); }
    }
    Object.keys(MF.TOOLS).forEach(function(key){
      chk('forge');
      if(!MF.castableFrom(MF.TOOLS[key].cast, MF.TOOLS[key].slots, MF.yardList()))
        errs.push('forge: "'+MF.TOOLS[key].nm+'" is unreachable for the student who dug seed '+seed+
          ' — the orders are reachable on average and not for everyone');
    });
    MF.state.yard = mrSaved;
  });

  /* EVERY ORDER'S TARGET MUST BE HITTABLE, AND ONLY BY HITTING IT.
     For each tool: the metals the yard actually offers must cast the object,
     that casting must be judged sound, and a near miss must not be. The near
     miss is built by nudging ONE metal by one, so it is the mistake a student
     really makes rather than a straw man. */
  MF.toolOrder().forEach(function(key){
    var t = MF.TOOLS[key];
    var set = MF.castableFrom(t.cast, t.slots, MF.yardList());
    chk('forge');
    if(!set){ errs.push('forge: nothing on a yard from 70 real smelts casts ' + quadText(t.cast.a,t.cast.b,t.cast.c) + ' for "' + t.nm + '"'); return; }
    var ings = set.map(function(e){ return e.ingot; });
    chk('forge');
    var good = MF.forgeJudge(t, ings, ingotProduct(ings));
    if(!good.ok) errs.push('forge: the metals that DO cast ' + quadText(t.cast.a,t.cast.b,t.cast.c) + ' were judged unsound for "' + t.nm + '"');
    /* one metal out by one, which is the miss that actually happens */
    var near = ings.slice();
    near[0] = {m:near[0].m, k:near[0].k + 1};
    chk('forge');
    var bad2 = MF.forgeJudge(t, near, ingotProduct(near));
    if(bad2.ok) errs.push('forge: "' + t.nm + '" accepted a casting that is not ' + quadText(t.cast.a,t.cast.b,t.cast.c));
    chk('forge');
    if(!/miss|over the sides/i.test(bad2.why))
      errs.push('forge: "' + t.nm + '" rejected a near miss without saying where it missed');
  });

  /* 5o. THE MOLD TEACHES, SO THE MOLD MUST BE TRUE.
         The pour shows the maths over the metal: what went in, the products it
         makes, which two run together, and the one thing left. Every one of
         those is a claim, and a picture that quietly says 3(x + 4) makes a
         nought is worse than no picture. Checked against the engine rather
         than against itself. */
  MF.toolOrder().forEach(function(key){
    var t = MF.TOOLS[key];
    var set = MF.castableFrom(t.cast, t.slots, MF.yardList());
    if(!set) return;                       /* the reachability check above owns this */
    var ings = set.map(function(e){ return e.ingot; });
    var mm = MF.moldMaths(ings, ingotProduct(ings));
    chk('mold');
    if(mm.single !== quadText(t.cast.a, t.cast.b, t.cast.c))
      errs.push('mold: pouring "' + t.nm + '" shows it coming to ' + mm.single + ', and the order is ' + quadText(t.cast.a,t.cast.b,t.cast.c));
    /* NO TERM MAY BE NOTHING. A nought on the sand is a product that does not
       exist, and it is what a phantom middle looks like. */
    mm.terms.forEach(function(tm){
      chk('mold');
      if(tm.t === '0' || tm.t === '')
        errs.push('mold: pouring "' + t.nm + '" shows a term that is nothing at all');
    });
    /* the terms must actually add up to the casting */
    chk('mold');
    var mSq=0, mX=0, mK=0;
    mm.terms.forEach(function(tm){
      var s = tm.t;
      if(/x²$/.test(s))      mSq += (s==='x²' ? 1 : (s==='−x²' ? -1 : parseInt(s.replace(/[−–]/g,'-'),10)));
      else if(/x$/.test(s))  mX  += (s==='x' ? 1 : (s==='−x' ? -1 : parseInt(s.replace(/[−–]/g,'-'),10)));
      else                   mK  += parseInt(s.replace(/[−–]/g,'-'),10);
    });
    /* three plain metals are shown as themselves, and multiply rather than add */
    var allPlain = ings.every(function(g){ return g.m===0; });
    if(!allPlain && (mSq !== t.cast.a || mX !== t.cast.b || mK !== t.cast.c))
      errs.push('mold: the products shown for "' + t.nm + '" come to ' + quadText(mSq,mX,mK) +
                ', and the casting is ' + quadText(t.cast.a,t.cast.b,t.cast.c));
    /* a merge is two things becoming one, or it is not a merge */
    chk('mold');
    var midCount = mm.terms.filter(function(tm){ return tm.mid; }).length;
    if(mm.merge !== null && midCount !== 2)
      errs.push('mold: "' + t.nm + '" runs ' + midCount + ' term(s) together, and a merge takes two');
    chk('mold');
    if(mm.merge === null && midCount)
      errs.push('mold: "' + t.nm + '" marks ' + midCount + ' term(s) as running together and then never runs them');
    /* THE CAVITY MUST BE THE TOOL'S OWN ICON, not a shape that merely
       resembles it. Hand-drawn silhouettes were a second source of truth for
       what each tool looks like, and a second source of truth drifts. */
    chk('mold');
    var mScene = MF.moldScene(key, null);
    var mCut = mScene.querySelector('.mdcut');
    if(!mCut){ errs.push('mold: nothing is cut into the sand for "' + t.nm + '"'); }
    else if(mCut.textContent !== MF.iconChar(t.ic))
      errs.push('mold: the cavity for "' + t.nm + '" is cut to "' + mCut.textContent +
                '" and the tool is "' + MF.iconChar(t.ic) + '"');
    chk('mold');
    if(mScene.querySelectorAll('.mdlive').length !== 1)
      errs.push('mold: "' + t.nm + '" has nothing to reveal as the metal crosses it');
    /* NOTHING MAY SHEET OVER THE SAND, AND THE METAL MAY NOT BE THE GLYPH.

       Two faults, one assertion, and the second is the one that shipped: the
       reveal used to paint the tool's own glyph on the assumption that a tool
       icon is a colour emoji. FOUR OF THE SEVEN ARE MONOCHROME text glyphs, so
       the "coloured" copy came out black over a black cut and the pour changed
       nothing a student could see. Every child of the reveal must therefore be
       MASKED - a masked child cannot paint outside the silhouette (the sheet
       fault) and a mask means the colour is coming from a fill rather than
       from whatever palette the font happens to carry (the black-on-black
       fault). A bare <text> in here is the defect itself. */
    chk('mold');
    var mRev = mScene.querySelector('.mdreveal');
    if(!mRev){ errs.push('mold: "' + t.nm + '" has no reveal at all'); }
    else {
      var mStray = [].slice.call(mRev.children).filter(function(n){ return !n.getAttribute('mask'); });
      if(mStray.length)
        errs.push('mold: the reveal for "' + t.nm + '" carries an unmasked <' + mStray[0].tagName.toLowerCase() +
                  '> — it can paint outside the tool, and if it is the glyph it paints black on black');
      /* and the metal must actually be metal-coloured */
      chk('mold');
      var mFill = mRev.querySelector('[fill^="url("]');
      if(!mFill)
        errs.push('mold: nothing in the reveal for "' + t.nm + '" is filled with a gradient — ' +
                  'the casting has no colour of its own and depends on the glyph, which is monochrome for four of the seven tools');
      /* the mask has to be cut from the TOOL, or the fill is the wrong shape */
      chk('mold');
      var mMelt = mRev.querySelector('[mask]');
      var mMaskId = mMelt && mMelt.getAttribute('mask').replace(/^url\(#|\)$/g,'');
      var mMask = mMaskId && mScene.querySelector('mask[id="' + mMaskId + '"]');
      var mMaskGlyph = mMask && mMask.querySelector('text');
      if(!mMaskGlyph || mMaskGlyph.textContent !== MF.iconChar(t.ic))
        errs.push('mold: the metal for "' + t.nm + '" is poured through a mask that is not the tool\'s own icon');
    }
    /* AND THE FILL RISES, AND ENDS FULL. A clip rect resting empty on the floor
       of the glyph and growing upward is what "the outline fills in" means; a
       rect with width in it is the old left-to-right wipe. */
    chk('mold');
    var mClip = mScene.querySelector('.mdrevrect');
    if(!mClip){ errs.push('mold: "' + t.nm + '" has no pour front'); }
    else if(Number(mClip.getAttribute('height')) !== 0)
      errs.push('mold: the cavity for "' + t.nm + '" starts already filled (height ' +
                mClip.getAttribute('height') + ') — there is nothing to watch arrive');
  });
  /* CONTROL: a mold that shows the wrong total must be caught */
  chk('mold');
  var mReal = MF.moldMaths;
  MF.moldMaths = function(ings, prod){ var r = mReal(ings, prod); r.single = 'x + 1'; return r; };
  var mSet = MF.castableFrom(MF.TOOLS.auger.cast, MF.TOOLS.auger.slots, MF.yardList());
  if(mSet){
    var mIng = mSet.map(function(e){ return e.ingot; });
    if(MF.moldMaths(mIng, ingotProduct(mIng)).single === quadText(6,7,-3))
      errs.push('CONTROL: the mold check cannot see a pour that shows the wrong casting');
  }
  MF.moldMaths = mReal;

  /* THE POUR SHOWS THE MULTIPLICATION, TERM BY TERM.

     USER, 2026-09-05: "The Molds need to show multiplication in the pour to
     illustrate multiplying terms."

     The mold room drew an area model and one line of algebra, and the area
     model only ever held ONE ROW - a depth over two parts. That is a number
     distributed over a sum, and it is not the move the mine runs backwards:
     the mine's job is two brackets, four products, and two middle terms that
     turn out to be the same kind of thing and collapse into one.

     So `MF.pourChain` writes it out a line at a time, and this asserts the
     lines are actually there AND that the last one agrees with `ingotProduct`
     - because a chain of working that ends somewhere the engine does not is
     worse than no chain at all.

     READ THE DENOMINATOR: four pours - two brackets, a number over a bracket,
     two plain metals, and one with no middle to merge. It checks the SHAPE of
     the working and its final value. It says nothing about whether the
     intermediate lines are in a helpful order. */
  [[[{m:1,k:2},{m:1,k:3}],  true,  'two brackets'],
   [[{m:1,k:3},{m:1,k:-3}], false, 'a twin seam, whose middles cancel'],
   [[{m:0,k:4},{m:1,k:3}],  false, 'a number over a bracket'],
   [[{m:0,k:3},{m:0,k:5}],  false, 'two plain metals']
  ].forEach(function(cse){
    chk('mold');
    var pcHost = document.createElement('div');
    try { MF.pourChain(pcHost, cse[0]); }
    catch(e){ errs.push('mold: the pour chain threw on ' + cse[2] + ': ' + e.message); return; }
    var rows = pcHost.querySelectorAll('.pcrow');
    if(rows.length < 2){
      errs.push('mold: the pour chain on ' + cse[2] + ' drew ' + rows.length + ' lines of working');
      return;
    }
    chk('mold');
    /* the last line must be what the engine says the pour comes to */
    var prod = ingotProduct(cse[0]);
    var want = quadText(prod.a, prod.b, prod.c);
    var last = rows[rows.length-1];
    var got = ((last.querySelector('.pcline')||{}).textContent||'').replace(/\s+/g,' ').trim();
    if(got !== want.replace(/\s+/g,' ').trim())
      errs.push('mold: the pour chain on ' + cse[2] + ' ends at "' + got +
        '" and the engine says the casting is "' + want + '"');
    chk('mold');
    /* TWO BRACKETS MUST SHOW THE PAIRINGS. This is the whole ask: not the
       answer, but every part of one metal meeting every part of the other. */
    var pairs = pcHost.querySelector('.pcrow.pairs');
    if(cse[1] && !pairs)
      errs.push('mold: ' + cse[2] + ' pours without showing which part multiplied which — ' +
        'that pairing IS the multiplication of terms');
    chk('mold');
    /* and the two middles must be shown collapsing, when there are two */
    var merged = pcHost.querySelector('.pcrow.merged');
    if(cse[1] && !merged)
      errs.push('mold: ' + cse[2] + ' never shows its two middle terms becoming one');
  });
  /* THE TERMS BEING MULTIPLIED ARE IN THE STREAM.

     USER, 2026-09-05, with a reference image: "The illustration around the
     pouring molds needs to look more realistic, 3D... and inside the stream
     there should be visible text of terms being multiplied."

     They used to be one line laid across the casting - `(x + 2) × (x + 3)`
     printed over the shape it was about to become, which puts the question and
     the answer in the same place. In the stream they are the metal ARRIVING.

     Measured as geometry, not as presence: every token's centre must fall
     inside the stream's own box. A token that says the right thing in the
     wrong place is the state this replaced, and a presence check would pass on
     it.

     READ THE DENOMINATOR: two pours - two brackets and a three-metal order,
     which is five tokens rather than three and the case that has to shrink to
     fit. It checks WHERE the text is and that it spells what went in. It says
     nothing about how long it is on screen for, which is a timing question and
     is recorded in SITE-STATE rather than asserted. */
  /* IT NEEDS A STAGE, because `getBBox` is geometry and geometry needs layout.
     The mold checks above read ATTRIBUTES off a detached scene, which is why
     they never needed one - and why none of them could have caught text in the
     wrong place. */
  var mStage = document.createElement('div');
  mStage.style.cssText = 'position:fixed; left:-16000px; top:0; width:430px';
  document.body.appendChild(mStage);
  [[[{m:1,k:2},{m:1,k:3}], 'two brackets'],
   [[{m:0,k:2},{m:0,k:3},{m:0,k:5}], 'three plain metals']
  ].forEach(function(mc){
    chk('mold');
    var mProd = ingotProduct(mc[0]);
    var mSc = MF.moldScene('lantern', {ok:true, maths:MF.moldMaths(mc[0], mProd)});
    mSc.setAttribute('data-pour','sound');
    mStage.appendChild(mSc);
    var mSvg = mSc.querySelector('svg');
    var mStream = mSvg && mSvg.querySelector('.mdstream');
    var mToks = mSvg ? [].slice.call(mSvg.querySelectorAll('.mdin')) : [];
    if(!mStream || !mToks.length){
      errs.push('mold: the pour on ' + mc[1] + ' drew ' + mToks.length +
        ' terms in the stream and ' + (mStream ? 'a' : 'no') + ' stream');
      mStage.removeChild(mSc); return;
    }
    var sBox = mStream.getBBox();
    var outside = mToks.filter(function(n){
      var b = n.getBBox(), cx = b.x + b.width/2, cy = b.y + b.height/2;
      return cx < sBox.x || cx > sBox.x + sBox.width ||
             cy < sBox.y || cy > sBox.y + sBox.height;
    });
    if(outside.length)
      errs.push('mold: ' + outside.length + ' of ' + mToks.length + ' terms on ' + mc[1] +
        ' sit outside the stream — "' + outside.map(function(n){ return n.textContent; }).join(' ') +
        '" is printed somewhere else on the picture');
    /* and they must spell what actually went in */
    chk('mold');
    var said = mToks.map(function(n){ return n.textContent; }).join(' ').replace(/\s+/g,' ').trim();
    var want = MF.moldMaths(mc[0], mProd).into.join(' × ');
    if(said !== want)
      errs.push('mold: the stream on ' + mc[1] + ' reads "' + said + '" and what went in was "' + want + '"');
    /* AND THE POUR COMES OUT OF A VESSEL. The channel it replaced was two flat
       quadrilaterals seen from the same angle as the sand; what makes this read
       as three-quarter and tipped is that the mouth is an ELLIPSE. */
    chk('mold');
    var mLadle = mSvg.querySelector('.mdladle');
    if(!mLadle || !mLadle.querySelector('ellipse'))
      errs.push('mold: the metal on ' + mc[1] + ' is not coming out of anything — ' +
        'the pour needs a vessel with a mouth, not a channel');
    mStage.removeChild(mSc);
  });
  /* CONTROL: put the terms back over the casting and the sweep must say so */
  chk('mold');
  (function(){
    var cProd = ingotProduct([{m:1,k:2},{m:1,k:3}]);
    var cSc = MF.moldScene('lantern', {ok:true, maths:MF.moldMaths([{m:1,k:2},{m:1,k:3}], cProd)});
    cSc.setAttribute('data-pour','sound');
    mStage.appendChild(cSc);
    var cSvg = cSc.querySelector('svg');
    var cStream = cSvg.querySelector('.mdstream');
    [].forEach.call(cSvg.querySelectorAll('.mdin'), function(n){ n.setAttribute('x','256'); });
    var cBox = cStream.getBBox();
    var cOut = [].slice.call(cSvg.querySelectorAll('.mdin')).filter(function(n){
      var b = n.getBBox(), cx = b.x + b.width/2;
      return cx < cBox.x || cx > cBox.x + cBox.width;
    });
    mStage.removeChild(cSc);
    if(!cOut.length)
      errs.push('CONTROL: the stream sweep cannot see terms printed away from the stream');
  })();
  document.body.removeChild(mStage);

  /* CONTROL: a chain that skips straight to the answer must be caught */
  chk('mold');
  var pcReal = MF.moldMaths;
  MF.moldMaths = function(ings, prod){
    var r = pcReal(ings, prod);
    r.terms = [{t:r.single, from:'', mid:false}]; r.merge = null; r.mergeFrom = null;
    return r;
  };
  var pcCtl = document.createElement('div');
  MF.pourChain(pcCtl, [{m:1,k:2},{m:1,k:3}]);
  MF.moldMaths = pcReal;
  if(pcCtl.querySelector('.pcrow.pairs') || pcCtl.querySelector('.pcrow.merged'))
    errs.push('CONTROL: a pour chain with its working stripped out still showed the pairings');

  /* a correct forge SPENDS its metal - exactly what went in, and no more */
  chk('forge');
  var lanternSet = MF.castableFrom(MF.TOOLS.lantern.cast, MF.TOOLS.lantern.slots, MF.yardList());
  var beforeCount = MF.yardList().length;
  if(!lanternSet){ errs.push('forge: the yard could not cast 30 for the Lantern'); }
  else {
    MF.spendFromYard(lanternSet.map(function(e){ return e.key; }));
    if(MF.yardList().length !== beforeCount - MF.TOOLS.lantern.slots)
      errs.push('forge: spending the Lantern\'s metal did not remove exactly ' + MF.TOOLS.lantern.slots + ' from the yard');
  }

  /* THE TARGETS MUST CLIMB. The whole point of the ladder is that a tool which
     does more for you costs a harder object, so the ranks must be a straight
     1..n with no ties - a board that says otherwise is telling the student the
     escalation is real when it is not. */
  var ranks = MF.toolOrder().map(function(k){ return MF.TOOLS[k].rank; });
  chk('forge');
  if(ranks.join(',') !== ranks.map(function(_,i){ return i+1; }).join(','))
    errs.push('forge: the ladder ranks are ' + ranks.join(',') + ' - they must run 1..' + ranks.length + ' with no ties or gaps');
  /* and every target must be a genuinely different object */
  var seen = {};
  MF.toolOrder().forEach(function(k){
    var t = MF.TOOLS[k], sig = t.cast.a+'|'+t.cast.b+'|'+t.cast.c;
    chk('forge');
    if(seen[sig]) errs.push('forge: "' + t.nm + '" and "' + seen[sig] + '" are cut for the same object');
    seen[sig] = t.nm;
  });

  /* 5j. EVERY SCREEN MUST ACTUALLY BUILD.
         Three screens - both workshops and the forge - threw a ReferenceError
         and showed "This screen did not build" for an entire session, while
         MF.validate reported 0 errors across sixteen groups. The try/catch in
         MF.go turned a fatal fault into a polite notice that only a human
         reading the page would ever see, and no instrument was looking.
         The screens are enumerated from MF.SCREENS itself, never a written
         list, so a screen added later cannot escape this (VERIFICATION s36). */
  var screenNames = Object.keys(MF.SCREENS);
  chk('screens');
  if(screenNames.length < 5) errs.push('screens: only ' + screenNames.length + ' screens are registered');
  var scStage = document.createElement('div');
  scStage.style.cssText = 'position:absolute; left:-12000px; top:0; width:1100px';
  document.body.appendChild(scStage);
  var scSavedMine = MF._mine;
  screenNames.forEach(function(name){
    chk('screens');
    var probe = document.createElement('div');
    scStage.appendChild(probe);
    try {
      MF.SCREENS[name](probe);
    } catch(e){
      errs.push('screens: "' + name + '" threw while building: ' + (e.message||e));
      return;
    }
    var txt = (probe.textContent||'').trim();
    if(txt.length < 120)
      errs.push('screens: "' + name + '" built only ' + txt.length + ' characters - it is effectively empty');
    if(/did not build/i.test(txt))
      errs.push('screens: "' + name + '" rendered its own failure notice');
  });
  MF._mine = scSavedMine;
  /* CONTROL: a throwing screen must be caught, not smoothed over */
  chk('screens');
  var realHome = MF.SCREENS.home;
  MF.SCREENS.home = function(){ throw new Error('planted'); };
  var caught = false;
  try { MF.SCREENS.home(document.createElement('div')); } catch(e){ caught = true; }
  MF.SCREENS.home = realHome;
  if(!caught) errs.push('CONTROL: the screens check cannot detect a screen that throws');
  document.body.removeChild(scStage);

  /* 5e. EVERY PLACE MUST HAVE A DOOR IN THE WORLD.
         The forge shipped as a whole screen with no building on the surface,
         in a design whose stated principle is that the buildings ARE the
         navigation. Fixing the instance is not enough - this asserts the
         class, so the next screen added cannot be doorless either. */
  var sceneProbe = MF.surfaceScene();
  var doors = {};
  Array.prototype.forEach.call(sceneProbe.querySelectorAll('.hot'), function(g){
    doors[g.getAttribute('data-screen')] = (g.getAttribute('aria-label')||'').trim();
  });
  /* every place that is not the surface itself needs a way in from the world */
  ['workshop-mold','workshop-ore','mine','forge'].forEach(function(scr){
    chk('doors');
    if(!doors[scr]) errs.push('doors: "' + scr + '" is a place with no building on the surface');
  });
  /* and no door may lead somewhere that does not exist */
  Object.keys(doors).forEach(function(scr){
    chk('doors');
    if(!MF.SCREENS[scr]) errs.push('doors: the building labelled "' + doors[scr] + '" opens "' + scr + '", which is not a screen');
  });
  /* the ore workshop must open the room about BREAKING ORE APART, not the mold
     - these were once wired to each other's screens. The test was /Smelt/i
       while the building was the Smelting House; the mine does not smelt any
       more (§11) and the building is the Stamp Mill, so the assertion moves
       with the name deliberately rather than being quietly deleted. */
  chk('doors');
  if(!/Stamp|Mill|Crush|Break/i.test(doors['workshop-ore']||''))
    errs.push('doors: the ore workshop is behind "' + doors['workshop-ore'] + '", which does not read as a place ore is broken up');
  chk('doors');
  if(!/Cast|Mold/i.test(doors['workshop-mold']||'')) errs.push('doors: the mold workshop is behind "' + doors['workshop-mold'] + '", which does not read as casting');

  /* 5d. THE SEAM. Ore must be spread along its whole length, not bunched at
         one end where a student who scans would find nothing. */
  var savedFace = MF.state.face, savedFaceLayer = MF.state.faceLayer, savedScan = MF.state.scan;
  for(var sl=1; sl<=MF.LAYERS.length; sl++){
    chk('seam');
    MF.state.layer = sl; MF.state.face = []; MF.state.faceLayer = null;
    var seam = MF.stockFace();
    if(seam.length < MF.SEAM_COUNT){ errs.push('seam: layer '+sl+' only stocked '+seam.length+' of the seam'); continue; }
    /* split the seam into thirds and assert every third holds ore */
    var thirds = [0,0,0];
    seam.forEach(function(o){ thirds[Math.min(2, Math.floor((o.px / MF.SEAM_W) * 3))]++; });
    thirds.forEach(function(n, i){
      if(n === 0) errs.push('seam: layer '+sl+' has no ore in third '+(i+1)+' - scanning there finds bare rock');
    });
    var offEnd = seam.filter(function(o){ return o.px < 0 || o.px > MF.SEAM_W; }).length;
    if(offEnd) errs.push('seam: layer '+sl+' put '+offEnd+' lumps outside the drawn rock');
  }
  MF.state.face = savedFace; MF.state.faceLayer = savedFaceLayer; MF.state.scan = savedScan;

  /* AND THE ROCK MUST FILL THE WINDOW ONTO IT.

     USER, 2026-09-04: "The blank spaces on the top and bottom of the layer need
     to be redesigned." There were 91px of them at each end, and they were not
     in the drawing at all: the commit that made the seam taller set
     `height:542px` in CSS and left the width at the viewBox's own 2900 in JS.
     A 2900x360 viewBox in a 2900x542 box with the default `xMidYMid meet`
     scales to fit the WIDTH and letterboxes the rest.

     Nothing could see it. `layout` measures the RIGHT edge and says so;
     `hollow` measures a box against the text drawn in it and this box holds a
     picture; `contrast` walks text nodes and there are none in the seam. A
     drawing that does not fill the element it is given crosses no edge, moves
     no control and has no ink - it just wastes the screen, which is the axis
     this project has spent five sessions buying back.

     Measured as PAINTED CONTENT against the element's content box, per layer,
     because the seam is rebuilt per layer and the palette is the only thing
     that changes - so a fault here would be in all five or in none, and
     checking one would not say which.

     READ THE DENOMINATOR: this is the seam's VERTICAL fit, at the live
     viewport, over five layers. It says nothing about the horizontal - that is
     a scrolling axis by design - and nothing about what is drawn in the space
     once it is filled. */
  var sfStage = document.createElement('div');
  sfStage.style.cssText = 'position:fixed; left:-14000px; top:0; width:' +
    document.documentElement.clientWidth + 'px';
  document.body.appendChild(sfStage);
  var sfSaved = {mine:MF._mine, layer:MF.state.layer, face:MF.state.face,
                 fl:MF.state.faceLayer, cart:MF.state.cart, sel:MF.state.selected, anvil:MF.state.anvil};
  var sfFit = function(root){
    var svg = root.querySelector('.seamview svg'), box = root.querySelector('.seamview');
    if(!svg || !box) return null;
    var wall = svg.querySelector('rect');
    if(!wall) return null;
    var sb = svg.getBoundingClientRect(), wb = wall.getBoundingClientRect();
    return {top: Math.round(wb.top - sb.top), bottom: Math.round(sb.bottom - wb.bottom),
            drawn: Math.round(wb.height), box: box.clientHeight};
  };
  for(var sf=1; sf<=MF.LAYERS.length; sf++){
    chk('seam');
    var sfProbe = document.createElement('div');
    sfStage.innerHTML = ''; sfStage.appendChild(sfProbe);
    MF.state.layer = sf; MF.state.face = []; MF.state.faceLayer = null;
    MF.state.cart = []; MF.state.selected = null; MF.state.anvil = null;
    MF._mine = null;
    try { MF.SCREENS.mine(sfProbe); MF.paintMine(); }
    catch(e){ errs.push('seam: the mine threw while the window was being measured: ' + e.message); break; }
    /* AND THE WINDOW FILLS THE COLUMN THE SHAFT SETS.

       USER, 2026-09-05: "In the mine, the layer needs to be the same size as
       the shaft."

       Both columns were already stretched to one row height; the mismatch was
       INSIDE - a fixed 563px window in a 982px column, so the layer had 264px
       of empty rock panel under it while the shaft was full to the bottom. Two
       boxes the same height, one of them two-thirds empty.

       Measured as "no dead space under the window", not as "the two boxes are
       equal", because the boxes were equal the whole time this was wrong.

       READ THE DENOMINATOR: the wide layout only. Under 900px the columns
       stack, the wall is content-sized and there is no shaft beside it to
       match - the seam holds its 542px design height there, and this says
       nothing about that. */
    if(document.documentElement.clientWidth > 900){
      chk('seam');
      var sfWall = sfProbe.querySelector('.wall');
      var sfWin  = sfProbe.querySelector('.seamview');
      var sfScan = sfProbe.querySelector('.wall > .row');
      if(sfWall && sfWin){
        var sfFoot = sfWall.getBoundingClientRect().bottom -
                     parseFloat(getComputedStyle(sfWall).paddingBottom);
        var sfBelow = sfFoot - sfWin.getBoundingClientRect().bottom;
        var sfUsed  = sfScan ? sfScan.getBoundingClientRect().height + 12 : 0;
        if(sfBelow - sfUsed > 40)
          errs.push('seam: layer '+sf+' leaves ' + Math.round(sfBelow - sfUsed) +
            'px of empty wall under the window — the layer is meant to be the size of the ' +
            'shaft, and the shaft is full to the bottom');
      }
    }
    var fit = sfFit(sfProbe);
    if(!fit){ errs.push('seam: layer '+sf+' drew no window to measure'); continue; }
    if(fit.top > 2 || fit.bottom > 2)
      errs.push('seam: layer '+sf+' paints ' + fit.drawn + 'px of rock in a ' + fit.box +
        'px window — ' + fit.top + 'px of it is blank at the top and ' + fit.bottom +
        'px at the bottom, so the layer is a letterbox');

    /* AND THE ROCK MUST REACH BOTH ENDS OF IT.
       Filling the element is not the same as filling the picture: the top 40
       and the bottom 60 units of the seam held nothing but a gradient and a
       few grit dots, which is the other half of what the user reported. The
       roof and the floor are what went in, so this asserts something is DRAWN
       in each band rather than counting shapes - a count says the texture
       exists somewhere, and somewhere was never the problem. */
    chk('seam');
    var sfTex = sfProbe.querySelector('.seamtex');
    if(!sfTex){
      errs.push('seam: layer '+sf+' drew no rock texture at all — the window is a gradient again');
    } else {
      var sfTop = 0, sfBot = 0;
      [].forEach.call(sfTex.children, function(n){
        var bb; try { bb = n.getBBox(); } catch(e){ return; }
        if(bb.width < 4 && bb.height < 4) return;      /* a grit fleck is not a band */
        if(bb.y < 44) sfTop++;
        if(bb.y + bb.height > MF.SEAM_H - 44) sfBot++;
      });
      if(sfTop < 3)
        errs.push('seam: layer '+sf+' has ' + sfTop + ' things drawn in the top 44 units of the rock — ' +
          'the head of the layer is blank');
      if(sfBot < 3)
        errs.push('seam: layer '+sf+' has ' + sfBot + ' things drawn in the bottom 44 units of the rock — ' +
          'the foot of the layer is blank');
    }
  }
  /* CONTROL: put the fault back and the measurement must report the bands.

     THE FAULT WAS NEVER ONE WRONG NUMBER - it was the two axes being set in
     two places from two numbers. So the control does what the stylesheet did:
     it states a height independently of the width, and lets `xMidYMid meet` do
     the rest. Setting MF.SEAM_ZOOM to 1 would NOT reproduce it, because both
     axes now come off that one constant and the drawing would simply be
     smaller and still filled - a control that proves the opposite of what it
     was written for. */
  chk('seam');
  var sfCtl = document.createElement('div');
  sfStage.innerHTML = ''; sfStage.appendChild(sfCtl);
  MF.state.layer = 2; MF.state.face = []; MF.state.faceLayer = null; MF._mine = null;
  try { MF.SCREENS.mine(sfCtl); MF.paintMine(); } catch(e){}
  var sfSvg = sfCtl.querySelector('.seamview svg');
  if(sfSvg){
    sfSvg.style.width = MF.SEAM_W + 'px'; sfSvg.setAttribute('width', MF.SEAM_W);
    sfSvg.style.height = '542px'; sfSvg.setAttribute('height', '542');
  }
  var sfBad = sfFit(sfCtl);
  if(!sfBad || (sfBad.top <= 2 && sfBad.bottom <= 2))
    errs.push('CONTROL: the seam check cannot see a drawing letterboxed inside its own window');
  /* CONTROL: and a wall with nothing drawn at its head and foot. Built by
     stripping the roof and the floor out of a real texture group rather than
     by an empty div, so what is measured is the thing the check measures. */
  chk('seam');
  var sfTexCtl = sfCtl.querySelector('.seamtex');
  if(!sfTexCtl){
    errs.push('CONTROL: no texture was drawn, so the blank-band rule measured nothing');
  } else {
    [].slice.call(sfTexCtl.children).forEach(function(n){
      var bb; try { bb = n.getBBox(); } catch(e){ return; }
      if(bb.y < 44 || bb.y + bb.height > MF.SEAM_H - 44) sfTexCtl.removeChild(n);
    });
    var sfLeftTop = 0, sfLeftBot = 0;
    [].forEach.call(sfTexCtl.children, function(n){
      var bb; try { bb = n.getBBox(); } catch(e){ return; }
      if(bb.width < 4 && bb.height < 4) return;
      if(bb.y < 44) sfLeftTop++;
      if(bb.y + bb.height > MF.SEAM_H - 44) sfLeftBot++;
    });
    if(sfLeftTop >= 3 || sfLeftBot >= 3)
      errs.push('CONTROL: the blank-band rule still counts ' + sfLeftTop + '/' + sfLeftBot +
        ' after the head and foot of the wall were stripped out');
  }
  document.body.removeChild(sfStage);
  MF._mine = sfSaved.mine; MF.state.layer = sfSaved.layer; MF.state.face = sfSaved.face;
  MF.state.faceLayer = sfSaved.fl; MF.state.cart = sfSaved.cart;
  MF.state.selected = sfSaved.sel; MF.state.anvil = sfSaved.anvil;

  /* 5c. A TOOL MUST NEVER GATE DESCENT. With nothing forged and an empty yard,
         every layer must still be reachable and still hand out ore. */
  MF.state.yard = {}; MF.state.tools = {};
  for(var L=1; L<=MF.LAYERS.length; L++){
    chk('nogate');
    var probeRng = makeRng(900+L);
    var got = MF.digOre(L, probeRng);
    if(!got) errs.push('nogate: layer '+L+' produced no ore for a student with no tools');
  }

  /* EVERY INSTRUMENT MUST CHANGE SOMETHING ON SCREEN.

     The Deep Pick's copy promised "three lumps a swing when you are cutting
     rock out of the wall". MF.breakRock never read hasTool('pick'). The only
     effect the tool had anywhere in the build was changing the swing button's
     LABEL from "Swing the pick" to "Swing the deep pick" - it cost 12 metal
     and cut exactly one lump, the same as bare hands. It shipped that way and
     no group could see it, because nothing anywhere asserted that owning a
     tool DOES anything.

     So it is asserted, for all seven: build the surface each tool acts on with
     the tool on the belt and without it, and require the two to differ. What
     counts as "differ" is deliberately weak - any change in the rendered text
     - because the alternative is seven bespoke assertions that each restate
     one tool's implementation.

     READ THE DENOMINATOR: this catches a tool that does NOTHING. It cannot
     tell you the change is useful, correct, or the one the tool's own copy
     promises - the pick passed its own description for weeks while being a
     relabelled button. That reading is human and it is what the user did. */
  var tgSaved = {tools:MF.state.tools, mine:MF._mine, cart:MF.state.cart,
                 sel:MF.state.selected, bench:MF.state.anvil, layer:MF.state.layer,
                 face:MF.state.face, fl:MF.state.faceLayer, insp:MF.state.inspecting};
  var tgStage = document.createElement('div');
  tgStage.style.cssText = 'position:fixed; left:-13000px; top:0; width:1000px';
  document.body.appendChild(tgStage);
  /* THE FACE IS BUILT ONCE AND REUSED, and that is the whole difficulty.
     The first version of this let each render stock its own face, so the two
     readings described DIFFERENT ROCKS and differed for reasons that had
     nothing to do with the belt - the control passed for the wrong reason and
     I read it as the check being broken. The lump under inspection has to be
     the same object in both renders, so the belt is the only thing that
     moved. */
  MF.state.layer = 3; MF.state.face = []; MF.state.faceLayer = null;
  MF.state.cart = []; MF.state.selected = null; MF.state.anvil = null;
  MF.stockFace();                       /* the seam itself, not a painted one */
  var tgFace = MF.state.face, tgLayer = MF.state.faceLayer;
  function tgFaceText(withPick){
    var probe = document.createElement('div');
    tgStage.innerHTML = ''; tgStage.appendChild(probe);
    MF.state.tools = withPick ? {pick:{forged:true}} : {};
    MF._mine = null; MF.SCREENS.mine(probe);
    MF.state.layer = 3; MF.state.face = tgFace; MF.state.faceLayer = tgLayer;
    MF.state.cart = []; MF.state.selected = null; MF.state.anvil = null;
    if(!(MF.state.face && MF.state.face.length)) return null;
    MF.state.inspecting = 0;
    MF.paintMine();
    var panel = probe.querySelector('.inspect');
    return panel ? (panel.textContent || '').replace(/\s+/g,' ').trim() : null;
  }
  chk('nogate');
  var tgWith = tgFaceText(true), tgWithout = tgFaceText(false);
  if(tgWith === null || tgWithout === null)
    errs.push('nogate: the face never offered a lump to inspect, so the pick was not tested');
  else if(tgWith === tgWithout)
    errs.push('nogate: ' + MF.TOOLS.pick.nm + ' changes nothing at the face — it is a tool that costs ' +
      'metal and does nothing, which is what "three lumps a swing" was for weeks');
  /* CONTROL: make the reading ignore the belt and the comparison must fail */
  chk('nogate');
  var tgRealHas = MF.hasTool;
  MF.hasTool = function(k){ return k === 'pick' ? false : tgRealHas.apply(this, arguments); };
  var tgBlindA = tgFaceText(true), tgBlindB = tgFaceText(false);
  MF.hasTool = tgRealHas;
  if(tgBlindA !== null && tgBlindB !== null && tgBlindA !== tgBlindB)
    errs.push('CONTROL: the face reads differently with the pick even when the belt is ignored');
  /* AND THE CHOICE THE CART OFFERS MUST GO WHERE IT SAYS.
     The flow is: cut ore, it lands in the cart, you put instruments on it
     there and watch it change, and THEN you send it on (§20). So the two
     destinations live under the lump IN THE CART - the face is one Swing
     button again. This assertion moved with the choice rather than being
     deleted: it used to read the face's buttons, and it would have gone on
     passing there while the cart shipped with no way out of it at all. */
  chk('nogate');
  var cyBtns = null;
  (function(){
    var probe = document.createElement('div');
    tgStage.innerHTML = ''; tgStage.appendChild(probe);
    MF.state.tools = {}; MF._mine = null; MF.SCREENS.mine(probe);
    MF.state.layer = 3; MF.state.face = tgFace; MF.state.faceLayer = tgLayer;
    MF.state.cart = [{kind:'poly', a:1, b:-5, c:6, layer:4, id:'cy-cart'}];
    MF.state.selected = null; MF.state.anvil = null;
    MF.paintMine();
    var route = probe.querySelector('.lumproute');
    cyBtns = route ? [].slice.call(route.querySelectorAll('button')).map(function(b){
      return (b.textContent||'').trim(); }) : [];
  })();
  if(!cyBtns.some(function(t){ return /floor|bench|break/i.test(t); }) ||
     !cyBtns.some(function(t){ return /yard/i.test(t); }))
    errs.push('nogate: a lump in the cart offers no choice between the breaking floor and the yard — it read ' +
      JSON.stringify(cyBtns));
  /* AND THE BREAKING FLOOR MUST NOT OPEN BY ITSELF.

     Asked for three times, and I fixed the wrong thing twice: `paintWork` was
     made to draw nothing when nothing is selected, while MF.placeCut still ran
       if(!MF.state.selected) MF.state.selected = o;
     so the FIRST lump a student ever cut selected itself and the floor opened
     behind the guard. Hiding a panel cannot beat the thing that opens it.

     This asserts the STATE, not the panel: cutting ore leaves nothing
     selected. A future fix that hides the floor while still selecting fails
     here, which is the whole point. */
  chk('nogate');
  (function(){
    var ngSave = {cart:MF.state.cart, sel:MF.state.selected, bench:MF.state.anvil};
    MF.state.cart = []; MF.state.selected = null; MF.state.anvil = null;
    MF.placeCut({kind:'poly', a:6, b:15, c:0, layer:2, id:'ng-cut'}, 'cart');
    if(MF.state.selected)
      errs.push('nogate: cutting a lump selected it, so the breaking floor opens before ' +
        'the student has asked for it — the panel may be hidden, the state is not');
    MF.state.cart = ngSave.cart; MF.state.selected = ngSave.sel; MF.state.anvil = ngSave.bench;
  })();
  /* CONTROL: put the auto-select back */
  chk('nogate');
  (function(){
    var ngReal = MF.placeCut, ngSave = {cart:MF.state.cart, sel:MF.state.selected};
    MF.placeCut = function(o, dest){
      if(dest === 'yard'){ MF.stow(o); return; }
      MF.state.cart.push(o);
      if(!MF.state.selected) MF.state.selected = o;
    };
    MF.state.cart = []; MF.state.selected = null;
    MF.placeCut({kind:'poly', a:6, b:15, c:0, layer:2, id:'ng-ctl'}, 'cart');
    var caught = !!MF.state.selected;
    MF.placeCut = ngReal;
    MF.state.cart = ngSave.cart; MF.state.selected = ngSave.sel;
    if(!caught)
      errs.push('CONTROL: a cut that auto-selects the lump is not reported as opening the floor');
  })();

  /* AN INSTRUMENT MUST BE USABLE BY CLICK, AND MUST NOT CARRY draggable.

     The belt's drag is built on POINTER events, and every belt tool also
     carried `draggable="true"` - so a real mouse-down-and-move started the
     browser's own HTML5 drag and cancelled the pointer stream the code was
     listening to. Synthetic PointerEvents never trip that, which is why every
     probe reported the drag working while no student could perform it: the
     instrument simply would not go onto the ore.

     And a drag needs a click path beside it regardless. It is the only gesture
     on this site that wants a pointer held down and moved precisely, and in
     the cart it was the ONLY way to use a tool at all. */
  chk('nogate');
  (function(){
    var probe = document.createElement('div');
    tgStage.innerHTML = ''; tgStage.appendChild(probe);
    MF.state.tools = {steel:{forged:true}}; MF.state.armedTool = null;
    MF._mine = null; MF.SCREENS.mine(probe);
    MF.state.layer = 2; MF.state.face = tgFace; MF.state.faceLayer = tgLayer;
    MF.state.cart = [{kind:'poly', a:6, b:15, c:0, layer:2, id:'ng-tool'}];
    MF.state.selected = null; MF.state.anvil = null;
    MF.paintMine();
    var dragAttrs = probe.querySelectorAll('[draggable]').length;
    if(dragAttrs)
      errs.push('nogate: ' + dragAttrs + ' control(s) carry draggable="true" — the browser will ' +
        'start its own drag and kill the pointer events the belt actually uses');
    var tool = probe.querySelector('.belttool[data-tool="steel"]');
    var rock = probe.querySelector('.lump[data-ore="ng-tool"]');
    chk('nogate');
    if(!tool || !rock){ errs.push('nogate: the cart drew no instrument and rock to test the click path on'); }
    else {
      tool.click();
      if(MF.state.armedTool !== 'steel')
        errs.push('nogate: clicking an instrument does not pick it up, so there is no way to use ' +
          'one without a drag');
      else {
        probe.querySelector('.lump[data-ore="ng-tool"]').click();
        chk('nogate');
        if(MF.state.cart[0].tool !== 'steel')
          errs.push('nogate: clicking a rock with an instrument in hand did not put it on the rock');
      }
    }
    MF.state.armedTool = null;
  })();
  /* CONTROL: put draggable back */
  chk('nogate');
  (function(){
    var d = document.createElement('div');
    d.innerHTML = '<button draggable="true">x</button>';
    if(!d.querySelectorAll('[draggable]').length)
      errs.push('CONTROL: the draggable sweep cannot see a draggable attribute');
  })();

  /* AN INSTRUMENT MUST COME OFF AS EASILY AS IT WENT ON.

     A tool put on a rock could not be taken off: the stone stayed re-spelt and
     the only way back to the plain expression was to break the lump. Selecting
     without unselecting is half a control, and this is a screen a student is
     meant to experiment on.

     Two ways off, both checked, in both places: the same instrument applied
     twice takes itself off, and the slot that appears on a tooled rock removes
     it. The slot's OTHER states are checked by absence - it must not exist on
     a bare rock, because an empty slot was a second way IN and the belt is the
     way in now (§20b). */
  ['cart','floor'].forEach(function(where){
    chk('nogate');
    var probe = document.createElement('div');
    tgStage.innerHTML = ''; tgStage.appendChild(probe);
    MF.state.tools = {steel:{forged:true}}; MF.state.armedTool = null;
    MF._mine = null; MF.SCREENS.mine(probe);
    MF.state.layer = 2; MF.state.face = tgFace; MF.state.faceLayer = tgLayer;
    var tgOre = {kind:'poly', a:6, b:15, c:0, layer:2, id:'ng-off-'+where};
    MF.state.cart = [tgOre];
    if(where === 'floor'){ MF.state.selected = tgOre; MF.state.anvil = MF.anvilInit(tgOre); }
    else { MF.state.selected = null; MF.state.anvil = null; }
    MF.paintMine();
    var scope = where === 'floor' ? '.floorbox ' : '.cartpanel ';
    if(probe.querySelector(scope + '.toolslot'))
      errs.push('nogate: the ' + where + ' shows an instrument slot on a bare rock — an empty slot ' +
        'is a second way in, and the belt is the way in');
    /* put one on, the way a student does */
    if(where === 'floor') MF.applyTool('steel', MF.state.anvil.floor[0].id);
    else MF.applyToolToOre('steel', tgOre.id);
    chk('nogate');
    var slot = probe.querySelector(scope + '.toolslot');
    if(!slot){
      errs.push('nogate: the ' + where + ' offers no way to take an instrument back off a rock');
    } else {
      slot.click();
      chk('nogate');
      var stillOn = where === 'floor' ? MF.state.anvil.floor[0].tool : MF.state.cart[0].tool;
      if(stillOn)
        errs.push('nogate: clicking the slot on the ' + where + ' left the instrument on the rock');
    }
    /* and the same instrument twice takes itself off */
    chk('nogate');
    if(where === 'floor'){
      MF.applyTool('steel', MF.state.anvil.floor[0].id);
      MF.applyTool('steel', MF.state.anvil.floor[0].id);
      if(MF.state.anvil.floor[0].tool)
        errs.push('nogate: the same instrument applied twice on the floor did not take itself off');
    } else {
      MF.applyToolToOre('steel', tgOre.id);
      MF.applyToolToOre('steel', tgOre.id);
      if(MF.state.cart[0].tool)
        errs.push('nogate: the same instrument applied twice in the cart did not take itself off');
    }
  });
  /* CONTROL: a set that cannot be unset */
  chk('nogate');
  (function(){
    var ngReal = MF.applyToolToOre, ngSave = MF.state.cart;
    MF.applyToolToOre = function(key, oreId){
      var f = null; MF.state.cart.forEach(function(o){ if(String(o.id)===String(oreId)) f = o; });
      if(f) f.tool = key;                 /* the old behaviour: set, never clear */
    };
    MF.state.cart = [{kind:'poly', a:6, b:15, c:0, layer:2, id:'ng-stuck'}];
    MF.applyToolToOre('steel','ng-stuck');
    MF.applyToolToOre('steel','ng-stuck');
    var stuck = MF.state.cart[0].tool === 'steel';
    MF.applyToolToOre = ngReal; MF.state.cart = ngSave;
    if(!stuck)
      errs.push('CONTROL: a tool that can only be set, never cleared, is not reported as stuck on');
  })();

  /* AND THE INSTRUMENTS MUST BE THERE TOO. A cart with ore in it and no belt
     is what this whole change is about: the first thing a student could do
     with a lump they had just cut was move it somewhere else. */
  chk('nogate');
  (function(){
    var probe = document.createElement('div');
    tgStage.innerHTML = ''; tgStage.appendChild(probe);
    MF.state.tools = {drill:{forged:true}}; MF._mine = null; MF.SCREENS.mine(probe);
    MF.state.layer = 3; MF.state.face = tgFace; MF.state.faceLayer = tgLayer;
    MF.state.cart = [{kind:'poly', a:1, b:-5, c:6, layer:4, id:'cy-belt'}];
    MF.state.selected = null; MF.state.anvil = null;
    MF.paintMine();
    var cartPanel = probe.querySelector('.cartbody');
    var beltAbove = probe.querySelector('.gearbox .belttool');
    var dropTarget = probe.querySelector('.lump[data-ore]');
    if(!cartPanel) errs.push('nogate: the cart drew no lumps to check');
    else if(!beltAbove)
      errs.push('nogate: there is ore in the cart and no instrument anywhere near it — ' +
        'the belt is not in the cart');
    else if(!dropTarget)
      errs.push('nogate: the cart\'s lumps are not drop targets, so a tool cannot be dragged onto one');
  })();
  [[{kind:'number', n:41, id:'cy-native'}, 'rack'],
   [{kind:'poly', a:1, b:-5, c:6, id:'cy-seamed'}, 'heap']].forEach(function(t){
    chk('nogate');
    var cySaved = {yard:MF.state.yard, heap:MF.state.rockpile, cart:MF.state.cart, sel:MF.state.selected};
    MF.state.yard = {}; MF.state.rockpile = []; MF.state.cart = []; MF.state.selected = null;
    MF.placeCut(t[0], 'yard');
    var onRack = MF.yardList().length, onHeap = MF.state.rockpile.length, inCart = MF.state.cart.length;
    if(inCart)
      errs.push('nogate: ' + MF.oreText(t[0]) + ' cut straight to the yard went into the cart instead');
    else if(t[1] === 'rack' && !onRack)
      errs.push('nogate: ' + MF.oreText(t[0]) + ' is native metal and cutting it to the yard did not rack it');
    else if(t[1] === 'heap' && !onHeap)
      errs.push('nogate: ' + MF.oreText(t[0]) + ' still has a seam and cutting it to the yard did not heap it');
    MF.state.yard = cySaved.yard; MF.state.rockpile = cySaved.heap;
    MF.state.cart = cySaved.cart; MF.state.selected = cySaved.sel;
  });
  /* CONTROL: a yard route that quietly carts must be caught */
  chk('nogate');
  var cyReal = MF.stow, cyCtl = {yard:MF.state.yard, heap:MF.state.rockpile, cart:MF.state.cart};
  MF.state.yard = {}; MF.state.rockpile = []; MF.state.cart = [];
  MF.stow = function(o){ MF.state.cart.push(o); };
  MF.placeCut({kind:'number', n:41, id:'cy-ctl'}, 'yard');
  var cyLeaked = MF.state.cart.length;
  MF.stow = cyReal;
  MF.state.yard = cyCtl.yard; MF.state.rockpile = cyCtl.heap; MF.state.cart = cyCtl.cart;
  if(!cyLeaked)
    errs.push('CONTROL: a yard route wired straight to the cart is not reported as carting');

  document.body.removeChild(tgStage);
  MF.state.tools = tgSaved.tools; MF._mine = tgSaved.mine; MF.state.cart = tgSaved.cart;
  MF.state.selected = tgSaved.sel; MF.state.anvil = tgSaved.bench; MF.state.layer = tgSaved.layer;
  MF.state.face = tgSaved.face; MF.state.faceLayer = tgSaved.fl; MF.state.inspecting = tgSaved.insp;

  /* AND NO QUESTION MAY STAND BETWEEN A LUMP AND THE HAMMER.
     The bench used to open on the assay with the breaking floor hidden behind
     it: a student who wanted to swing had to answer something first. The assay
     survives - it is one of the three verbs and it is still on the bench - but
     as an offer. This asserts the swing is reachable on a freshly built,
     never-clicked bench, which is the only state that matters for a student
     who does not want the question. */
  var ngStage = document.createElement('div');
  ngStage.style.cssText = 'position:fixed; left:-11000px; top:0; width:560px';
  document.body.appendChild(ngStage);
  var ngSaved = {sel:MF.state.selected, anvil:MF.state.anvil, mine:MF._mine};
  [[1,-5,6],[6,7,-3],[0,0,60]].forEach(function(t){
    chk('nogate');
    var ore = t[0]===0 && t[1]===0 ? {kind:'number', n:t[2], id:'ng'+t[2], layer:1}
                                   : {kind:'poly', a:t[0], b:t[1], c:t[2], id:'ng'+t[1]+t[2], layer:4};
    MF.state.selected = ore;
    MF.state.anvil = MF.anvilInit(ore);
    var host = document.createElement('div');
    ngStage.appendChild(host);
    try { MF.paintAnvil(host); }
    catch(e){ errs.push('nogate: the bench threw on ' + MF.oreText(ore) + ': ' + e.message); ngStage.removeChild(host); return; }
    /* THE SWING IS ONE CLICK AWAY, AND THE CLICK IS THE ORE ITSELF (§26).
       The permanent hammer bar went with the two-column bench: the question is
       asked once, in a panel, when the student strikes the stone. So this
       WALKS THE ROUTE rather than hunting for a button on the page. The
       property being protected has not changed - nothing may stand between a
       lump and the hammer - and a route that cannot be walked fails it exactly
       as a gate would. Looking for the old button would now fail for a good
       change, and looking only for the ore would pass on a stone that opens
       nothing. */
    var ngOre = host.querySelector('.anvilore[data-piece]');
    if(!ngOre){
      errs.push('nogate: a freshly dug ' + MF.oreText(ore) + ' lands on a bench with no ore on the anvil to strike');
    } else {
      ngOre.dispatchEvent(new MouseEvent('click',{bubbles:true}));
      var swing = [].slice.call(document.querySelectorAll('.scrim .toolsheet button')).filter(function(b){
        return /bring the hammer down/i.test(b.textContent||''); })[0];
      if(!swing)
        errs.push('nogate: a freshly dug ' + MF.oreText(ore) + ' lands on a bench with no way to swing — something is gating the hammer');
      MF.closeTool();
    }
    chk('nogate');
    if(host.querySelectorAll('.choices .choice').length)
      errs.push('nogate: the bench opens on the assay question for ' + MF.oreText(ore) + ' rather than offering it');
    /* THE ASSAY IS OFF THE BENCH, AND THE CAPABILITY MOVED RATHER THAN DIED.

       This used to require an `.assayoffer` on the bench. The bench's whole
       head - the ore as a headline, the Stamp Mill signpost, the assay button
       and the line under them - was removed as furniture between a student and
       the hammer (§25), so that assertion would now fail for a good change.

       What it was really protecting is that a student can still find out WHAT
       KIND of rock they are holding without being made to. That capability is
       the Prospector's Pick, one step earlier, at the face (§17a) - so the
       check follows it there. Deleting the pick's reading fails this. */
    ngStage.removeChild(host);
  });
  chk('nogate');
  (function(){
    var kinds = [{kind:'poly',a:1,b:-5,c:6}, {kind:'poly',a:6,b:15,c:0}, {kind:'poly',a:1,b:0,c:4}];
    var mute = kinds.filter(function(o){
      var read = MF.lensFor(o, 'pick');
      return !read || !String(read.found || '').trim();
    });
    if(mute.length)
      errs.push('nogate: the prospector\'s pick says nothing about ' + mute.length + ' of ' +
        kinds.length + ' shapes — naming what kind of rock this is left the bench (§25) and ' +
        'the pick is where it went, so a silent pick means the capability was deleted, not moved');
  })();
  /* CONTROL: put the gate back and the sweep must fail.
     THE GATE WAS NEVER THE step FIELD - it was a conditional wrapped
     round paintBreak. Setting the field alone left the hammer on screen and
     the control passed while proving nothing, which is the failure mode a
     control exists to prevent. It patches the thing that actually gated. */
  chk('nogate');
  var ngReal = MF.anvilInit, ngBreak = MF.paintBreak;
  MF.anvilInit = function(o){ var B = ngReal(o); B.step = 'assay'; return B; };
  MF.paintBreak = function(h, B){ if(B.step === 'break') return ngBreak(h, B); };
  var ngGated = document.createElement('div');
  ngStage.appendChild(ngGated);
  MF.state.selected = {kind:'poly',a:1,b:-5,c:6,id:'ngctl',layer:4};
  MF.state.anvil = MF.anvilInit(MF.state.selected);
  MF.paintAnvil(ngGated);
  /* AND THE CONTROL WALKS THE SAME ROUTE. A gate is now "the ore is not there
     to be struck, or striking it opens nothing", so the control has to be
     measured the way the sweep above is measured or it proves nothing about it. */
  var ngSwing = 0;
  var ngCtlOre = ngGated.querySelector('.anvilore[data-piece]');
  if(ngCtlOre){
    ngCtlOre.dispatchEvent(new MouseEvent('click',{bubbles:true}));
    ngSwing = [].slice.call(document.querySelectorAll('.scrim .toolsheet button')).filter(function(b){
      return /bring the hammer down/i.test(b.textContent||''); }).length;
    MF.closeTool();
  }
  MF.anvilInit = ngReal; MF.paintBreak = ngBreak;
  ngStage.removeChild(ngGated);
  if(ngSwing) errs.push('CONTROL: the gate check cannot see a bench that hides the hammer behind the assay');

  /* AND A LUMP MUST BE ABLE TO REACH THE YARD WITHOUT TOUCHING THE BENCH. */
  var ngYard = {yard:MF.state.yard, heap:MF.state.rockpile, cart:MF.state.cart};
  [[{kind:'poly',a:1,b:0,c:4,id:'sy1',layer:3}, 'rack'],      /* native */
   [{kind:'poly',a:1,b:-5,c:6,id:'sy2',layer:4}, 'heap']      /* still rock */
  ].forEach(function(pair){
    chk('nogate');
    MF.state.yard = {}; MF.state.rockpile = []; MF.state.cart = [pair[0]];
    MF.state.selected = null; MF.state.anvil = null; MF._mine = null;
    MF.cartToYard(pair[0].id);
    var racked = MF.yardList().length, heaped = MF.state.rockpile.length;
    var landed = racked ? 'rack' : (heaped ? 'heap' : 'nowhere');
    if(landed !== pair[1])
      errs.push('nogate: ' + MF.oreText(pair[0]) + ' sent straight from the cart landed on the ' +
                landed + ' and belongs on the ' + pair[1]);
    chk('nogate');
    if(MF.state.cart.length)
      errs.push('nogate: ' + MF.oreText(pair[0]) + ' went to the yard and is still in the cart as well');
  });
  /* CONTROL: a stow that drops the ore must be caught */
  chk('nogate');
  MF.state.yard = {}; MF.state.rockpile = [];
  var ngStow = MF.stow;
  MF.stow = function(){ return 'rack'; };
  MF.state.cart = [{kind:'poly',a:1,b:0,c:4,id:'syc',layer:3}];
  MF.cartToYard('syc');
  var ngLost = (MF.yardList().length === 0 && MF.state.rockpile.length === 0);
  MF.stow = ngStow;
  if(!ngLost) errs.push('CONTROL: a stow that drops the ore still put it somewhere');

  /* AND A BAR ON THE RACK MUST KNOW WHAT IT CAME OUT OF.

     The rack was a row of labels: a student who broke 2x² + 10x + 12 down to
     2, (x + 2) and (x + 3) saw three bars with nothing saying they had ever
     been one lump. The mine's whole claim is that breaking IS factoring, and
     the rack is where the evidence of it ends up.

     Driven through the real route - dig, swing until nothing breaks, tip the
     floor - because the origin is set by MF.tipFloor from the lump on the
     BENCH, and a hand-built call to MF.addToYard would pass while the route a
     student walks dropped it on the floor.

     READ THE DENOMINATOR: one lump, broken all the way down. It says nothing
     about a bar that reaches the rack by any other road - a lump sent straight
     from the cart has no parent, and says so in words rather than carrying a
     false one. */
  chk('nogate');
  MF.state.yard = {}; MF.state.rockpile = [];
  var ngPv = {kind:'poly', a:2, b:10, c:12, id:'pv', layer:4};
  MF.state.cart = [ngPv]; MF.state.selected = ngPv;
  var ngB = MF.state.anvil = MF.anvilInit(ngPv), ngG = 0;
  while(!ngB.floor.every(function(p){ return MF.isNative(p.ore); }) && ngG++ < 8){
    var ngPc = ngB.floor[ngB.at], ngF = MF.simplestFactor(ngPc.ore);
    if(!ngF) break;
    ngB.raw = {m:String(ngF.m), k:String(ngF.k)}; ngB.rawFor = ngPc.id;
    MF.swing(ngB);
  }
  MF.tipFloor(ngB, 'checking');
  var ngBars = MF.yardList();
  var ngBlind = ngBars.filter(function(e){
    var rec = MF.state.yard[e.key];
    return !rec || !rec.from || !rec.from.length;
  });
  if(!ngBars.length)
    errs.push('nogate: breaking 2x² + 10x + 12 all the way down racked nothing, so provenance was not tested');
  else if(ngBlind.length)
    errs.push('nogate: ' + ngBlind.length + ' of ' + ngBars.length + ' bars reached the rack with no record ' +
      'of the lump they came out of — the rack is a row of labels again');
  /* CONTROL: an addToYard that forgets the origin must be caught */
  chk('nogate');
  MF.state.yard = {};
  var ngAdd = MF.addToYard;
  MF.addToYard = function(ing){ return ngAdd(ing, null); };
  MF.stow({kind:'poly', a:1, b:0, c:4, id:'pvc', layer:3}, 'x² + 4 came out of something');
  MF.addToYard = ngAdd;
  var ngKeys = Object.keys(MF.state.yard);
  if(ngKeys.length && (MF.state.yard[ngKeys[0]].from || []).length)
    errs.push('CONTROL: a rack that throws the origin away still reported one');

  MF.state.yard = ngYard.yard; MF.state.rockpile = ngYard.heap; MF.state.cart = ngYard.cart;
  MF.state.selected = ngSaved.sel; MF.state.anvil = ngSaved.anvil; MF._mine = ngSaved.mine;
  document.body.removeChild(ngStage);

  MF.state.yard = savedYard; MF.state.tools = savedTools; MF.state.forge = savedForge;

  /* 5h. NO DISTRACTOR MAY BE TRUE, AND NO ROOT MAY BE DENIED.
         Both of these shipped and both were student-facing falsehoods:
         4x²−4 was graded Common Vein only while literally being two squares
         with a minus and no middle term, and the Decimal Dial told every
         linear lump it had no decimal seam when it always has exactly one. */
  var seamRng = makeRng(24601);
  for(var sw=0; sw<400; sw++){
    var slump = MF.digOre(1 + (sw % 5), seamRng);
    if(!slump || slump.kind!=='poly') continue;
    chk('truthy');
    var acc = MF.assayAccepts(slump);
    /* if it LOOKS like a twin seam by the tell this site prints, that call must be accepted */
    var looksTwin = (slump.a!==0 && slump.b===0 && slump.c<0 && isSquare(slump.a) && isSquare(-slump.c));
    if(looksTwin && acc.indexOf('twin') < 0)
      errs.push('truthy: ' + quadText(slump.a,slump.b,slump.c) + ' is two squares minus two squares, but "Twin Seam" is graded wrong');
    /* a lump with a real root must never be told it has none */
    chk('truthy');
    var sres = MF.smeltPoly(slump.a, slump.b, slump.c);
    var hasRealRoot = (slump.a===0) ? (slump.b!==0) : (slump.b*slump.b - 4*slump.a*slump.c > 0);
    if(hasRealRoot && sres.kind==='pure' && !sres.realRoots)
      errs.push('truthy: ' + quadText(slump.a,slump.b,slump.c) + ' has a real root but the dial would report none');
  }
  /* THE DIAL'S OWN RANGE, NOT JUST THE LUMP AS DUG.
     The check above tests each lump's ORIGINAL integer coefficients and never
     nudges c - which is the one thing the Decimal Dial exists to do. It
     therefore reported 0 errors while 1,970 dial states printed a falsehood.
     This sweeps every slider position the control can actually reach. */
  var dialRng = makeRng(8675309);
  for(var dw=0; dw<160; dw++){
    var dlump = MF.digOre(1 + (dw % 5), dialRng);
    if(!dlump || dlump.kind!=='poly') continue;
    for(var off=-2; off<=2; off+=0.5){
      chk('truthy');
      var dres = MF.smeltPoly(dlump.a, dlump.b, dlump.c + off);
      var A=dlump.a, Bc=dlump.b, C=dlump.c+off;
      /* does a real root actually exist at this dial position? */
      var trueRoot = (A===0) ? (Bc!==0) : (Bc*Bc - 4*A*C >= 0);
      var saysNone = (dres.kind==='pure' && !dres.realRoots);
      if(trueRoot && saysNone)
        errs.push('truthy: dial at ' + quadText(A,Bc,C) + ' denies a real root that exists');
      if(dres.realRoots) dres.realRoots.forEach(function(r){
        chk('truthy');
        var resid = A*r*r + Bc*r + C;
        if(Math.abs(resid) > 1e-6 * (Math.abs(A*r*r)+Math.abs(Bc*r)+Math.abs(C)+1))
          errs.push('truthy: dial at ' + quadText(A,Bc,C) + ' printed a root of ' + r + ' that is not a root');
      });
    }
  }
  /* CONTROLS: both must fail */
  chk('truthy');
  if(MF.assayAccepts({kind:'poly',a:4,b:0,c:-4}).indexOf('twin') < 0)
    errs.push('CONTROL: 4x²−4 still rejects the Twin Seam reading');
  chk('truthy');
  var linProbe = MF.smeltPoly(0,12,17);
  if(!linProbe.realRoots || Math.abs(linProbe.realRoots[0] + 17/12) > 1e-9)
    errs.push('CONTROL: 12x+17 does not report its real root of −17/12');

  /* 5i. AN EXPLANATION MUST SURVIVE THE ANSWER THAT REVEALS IT.
         Nobody owned display DURATION - not one agent brief contains the word,
         and art-director's instrument is defined to pause animations before it
         measures, so it can never see a 240ms window. That gap shipped a build
         which showed its reasoning for a quarter second on a correct answer and
         indefinitely on a wrong one: it explained itself only to students who
         got it wrong. This asserts the invariant directly. */
  var expStage = document.createElement('div');
  expStage.style.cssText = 'position:absolute; left:-12000px; top:0; width:1000px';
  document.body.appendChild(expStage);
  [[1,-5,6],[4,0,-4],[1,0,4]].forEach(function(t){
    chk('explain');
    var probe = {kind:'poly', a:t[0], b:t[1], c:t[2], layer:4, id:'exp-'+t[1]+'-'+t[2]};
    var B = MF.anvilInit(probe);
    var host = document.createElement('div');
    /* the state a student is in one instant after a correct call */
    B.step = 'break';
    B.calledAs = MF.assayOf(probe);
    B.calledWhy = MF.ASSAY[B.calledAs].tell;
    MF.paintAssay(host, B);
    expStage.appendChild(host);
    var txt = (host.textContent||'').replace(/\s+/g,' ').trim();
    if(txt.indexOf(MF.ASSAY[B.calledAs].name) < 0)
      errs.push('explain: after calling ' + quadText(t[0],t[1],t[2]) + ' the call itself is no longer on screen');
    if(txt.length < 40)
      errs.push('explain: the reason for ' + quadText(t[0],t[1],t[2]) + ' survives the answer as only ' + txt.length + ' characters');
    expStage.removeChild(host);
  });
  /* CONTROL: an assay panel that drops its explanation must be caught */
  chk('explain');
  var blankHost = document.createElement('div');
  expStage.appendChild(blankHost);
  var blankTxt = (blankHost.textContent||'').trim();
  if(blankTxt.length >= 40)
    errs.push('CONTROL: the explanation check cannot tell an empty panel from a full one');
  document.body.removeChild(expStage);

  /* 5g. NO ANIMATED ELEMENT MAY CARRY AN SVG transform ATTRIBUTE.
         A CSS transform animation REPLACES the transform attribute rather than
         composing with it, so a positioned group that also animates drifts off
         its mount. This has now happened three times - the ore cart ended up in
         the sky, the headframe wheel left its tower, and the assay balance
         vanished from its room entirely. Twice it was fixed as an instance.
         This asserts the class: position on an outer mount, animate the inner. */
  MF.ANIM_TRANSFORM_CLASSES = ['sc-wheel','sc-sails','sc-cart','sc-smoke','sc-cloud','sc-bird',
                               'rm-fire','rm-bellows','rm-steam','rm-ladle','rm-stamp','pickarm',
                               'ct-cart','ct-jolt','ct-wheel','sc-cartout','hammerswing','sc-sun','sc-moon',
                               'sa-run','sa-fill','sa-lift','sa-join','sa-climb'];
  var animStage = document.createElement('div');
  animStage.style.cssText = 'position:absolute; left:-12000px; top:0; width:1100px';
  document.body.appendChild(animStage);
  /* built one at a time, each guarded. These used to be constructed in a bare
     array literal, so a scene builder that threw killed MF.validate outright -
     no report, no denominators, no findings, just an exception. An instrument
     that dies on the defect it is meant to catch is worse than one that is
     silent about it, because the crash looks like the tool being broken. */
  var animSubjects = [];
  [['surface', function(){ return MF.surfaceScene(); }],
   ['foundry', function(){ return MF.roomScene('foundry'); }],
   ['stamps',  function(){ return MF.roomScene('stamps'); }],
   ['forge',   function(){ return MF.roomScene('forge'); }],
   ['carttrack', function(){ return MF.cartTrack(); }]].forEach(function(pair){
    chk('animmount');
    try { animSubjects.push(pair[1]()); }
    catch(e){ errs.push('animmount: the "' + pair[0] + '" scene threw while building: ' + (e.message||e)); }
  });
  animSubjects.forEach(function(node){ animStage.appendChild(node); });
  MF.ANIM_TRANSFORM_CLASSES.forEach(function(cls){
    chk('animmount');
    var offenders = [];
    animStage.querySelectorAll('.' + cls).forEach(function(el){
      if(el.hasAttribute('transform')) offenders.push(el.getAttribute('transform'));
    });
    if(offenders.length) errs.push('animmount: .' + cls + ' carries a transform attribute (' +
      offenders[0] + ') - the animation will replace it and the piece will drift off its mount');
  });
  /* CONTROL: plant the defect and confirm the check sees it */
  chk('animmount');
  var planted = document.createElementNS('http://www.w3.org/2000/svg','g');
  planted.setAttribute('class','rm-fire');
  planted.setAttribute('transform','translate(10,10)');
  animStage.appendChild(planted);
  var caught = false;
  animStage.querySelectorAll('.rm-fire').forEach(function(el){ if(el.hasAttribute('transform')) caught = true; });
  if(!caught) errs.push('CONTROL: the animated-transform check did not catch a planted offender');

  /* 5n. THE SURFACE: what is built where, and the day that turns over it.

         Two things nothing else looks at. The windmill's bottom windows ended
         exactly on the line where the door's arch begins and sat over the
         doorway's own width - two openings sharing an edge read as one hole in
         the wall, and it took a person to notice.

         And the day is four minutes of animation that a still screenshot
         cannot check at all: the only way to know the sun is up at noon and
         under the ground at midnight is to stop the clock at each phase and
         look. Mounted live, because a detached svg has no running animations
         and getBBox on one returns zeroes - both would pass for the wrong
         reason. */
  var surfStage = document.createElement('div');
  surfStage.style.cssText = 'position:absolute; left:-12000px; top:0; width:900px';
  document.body.appendChild(surfStage);
  try {
    surfStage.appendChild(MF.surfaceScene());
    var sSvg = surfStage.querySelector('svg');
    var sWm = [].slice.call(sSvg.querySelectorAll('g')).filter(function(g){
      return g.getAttribute('transform')==='translate(112,132)'; })[0];
    chk('surface');
    if(!sWm){ errs.push('surface: the windmill is not on the site'); }
    else {
      var sDoor = [].slice.call(sWm.querySelectorAll('path')).filter(function(p){
        return (p.getAttribute('d')||'').indexOf('M44 208')===0; })[0];
      var sWins = [].slice.call(sWm.querySelectorAll('rect')).filter(function(r){
        return r.getAttribute('width')==='12' && r.getAttribute('height')==='14'; });
      chk('surface');
      if(!sDoor || !sWins.length){ errs.push('surface: the windmill has no door or no windows to check'); }
      else {
        var sHits = function(win){
          var a = win.getBBox(), b = sDoor.getBBox();
          return (Math.min(a.x+a.width, b.x+b.width) - Math.max(a.x, b.x)) >= 0 &&

    stage.innerHTML='';
    var probe = document.createElement('div');
    stage.appendChild(probe);
    try {
      if(scr==='mine'){
        MF._mine = null;

        var lump = MF.digOre(4, cRng);

        MF.paintMine();
      } else if(scr==='mine-layer1'){

           bottom, and every mount above this one is at layer 4 — a dark one.
           Every piece of light ink on that wall therefore had four chances to
           pass and none to fail. Two elements have now shipped readable on
           layers 2–5 and unreadable on Gravel: the depth line, and the hint
           beside it.
           Layer 1 is the worst case rather than an arbitrary extra, because it
           is the lightest of the five and the wall's ink is light. */
        MF._mine = null;
        MF.SCREENS.mine(probe);
        MF.state.layer=1; MF.state.face=[]; MF.state.faceLayer=null;
        var c1 = MF.digOre(1, cRng);
        if(c1){ MF.state.cart=[c1]; MF.state.selected=c1;
                MF.state.anvil=MF.anvilInit(c1); MF.state.anvil.step='break'; }
        /* A ROCK UNDER INSPECTION, WITH THE PICK HELD. The inspect panel only
           exists once a lump in the wall is picked out, and its one
           tool-conditional line - the prospector's pick naming the kind -

        MF.state.tools = {pick:{forged:true}, lantern:{forged:true},

        MF.state.inspecting = null;
      } else if(scr==='mine-number'){

        MF._mine = null;

        var cNum = {kind:'number', n:72, layer:4, id:'ctr-num'};

      } else if(scr==='mine-done'){

           It is broken for real - MF.swing, through the same engine the

        MF._mine = null;
        MF.SCREENS.mine(probe);
        MF.state.layer=4; MF.state.face=[]; MF.state.faceLayer=null;
        var cdOre = {kind:'poly', a:1, b:-5, c:6, layer:4, id:'ctr-done'};

      } else if(scr==='mine-blow'){
        /* THE BURST, WHICH EXISTS ONLY IN THE THREE SECONDS AFTER A SWING.
           Both words - THUD! on a hit, CLANG! on a glance - painted on their
