  sheet.appendChild(body);

  var foot = E('div','tsfoot');
  foot.appendChild(H('div','hint', o.foot ||
    'Nothing here is a mark, and nothing here swings for you. Press <b>Esc</b> to put it away.'));
  sheet.appendChild(foot);

  scrim.appendChild(sheet);
  document.body.appendChild(scrim);
  /* clicking the ground outside the panel puts the instrument away */
  on(scrim,'pointerdown',function(e){ if(e.target===scrim) MF.closeTool(); });

  MF._sheet = {scrim:scrim, sheet:sheet, opener:o.opener || document.activeElement, key:o.key||null};
  sheet.focus();
  document.addEventListener('keydown', MF._sheetKeys, true);
};

MF.openTool = function(key, ore, opener){
  var t = MF.TOOLS[key];
  if(!t || !ore) return;
  MF._openSheet({
    label: t.nm + ', held to ' + MF.oreText(ore),
    icon: t.ic, title: t.nm, sub: 'held to <b>' + MF.oreLabel(ore) + '</b>',
    closeText: 'Take it away', opener: opener, key: key,
    fill: function(body){
      var reader = MF.TOOL_READ[key];
      if(reader) reader(body, ore);
      else body.appendChild(H('p','hint', t.ds));
    }
  });
};

MF._sheetKeys = function(e){
  if(!MF._sheet) return;
  if(e.key === 'Escape'){ e.preventDefault(); MF.closeTool(); return; }
  if(e.key !== 'Tab') return;
  /* TRAP TAB. Without this, tabbing walks out of the panel and onto the page
     behind it, which is inert to the eye and live to the keyboard. */
  var f = MF._sheet.sheet.querySelectorAll('button, a[href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if(!f.length) return;
  var first = f[0], last = f[f.length-1];
  if(e.shiftKey && (document.activeElement===first || document.activeElement===MF._sheet.sheet)){
    e.preventDefault(); last.focus();
  } else if(!e.shiftKey && document.activeElement===last){
    e.preventDefault(); first.focus();
  }
};

MF.closeTool = function(){
  var s = MF._sheet;
  if(!s) return;
  MF._sheet = null;
  document.removeEventListener('keydown', MF._sheetKeys, true);
  if(s.scrim.parentNode) s.scrim.parentNode.removeChild(s.scrim);
  /* focus goes back where it came from, if that node still exists after the
     repaints that may have happened while the panel was open */
  if(s.opener && s.opener.isConnected && s.opener.focus) s.opener.focus();
};

/* =========================================================================
   THE BELT. The instruments hang off it, and you take them off it to use
   them. It replaces a list of cards in a sidebar, which described the tools
   without ever letting you pick one up.
   ========================================================================= */
/* `atWork` is the belt hanging on the breaking floor, where it is actually
   used: no outer heading, dark labels for the dark box it sits in, and one
   short line of instruction instead of a card's worth. */
MF.paintBelt = function(host, atWork){
  var owned = MF.toolOrder().filter(MF.hasTool);
  var box = E('div', atWork ? 'gearbox atwork' : 'gearbox');
  box.appendChild(atWork ? H('div','beltlab','ON YOUR BELT') : H('h3',null,'On your belt'));

  if(!owned.length){
    var bare = E('div','beltstrap bare');
    bare.appendChild(H('div','beltempty','Bare leather. Tools are not handed out — you make them at the forge, out of metal you broke out yourself.'));
    box.appendChild(bare);
    host.appendChild(box);
    return;
  }

  box.appendChild(H('div', atWork ? 'beltnote' : 'hint',
    atWork ? 'Drag one onto a piece below, or open its slot and choose.'
           : 'Drag one onto a piece of rock, or open a slot on the floor and choose it.'));
  var strap = E('div','beltstrap');
  owned.forEach(function(k){
    var t = MF.TOOLS[k];
    var loop = E('div','beltloop');
    var b = E('button','belttool'); b.type='button';
    b.setAttribute('data-tool', k);
    b.setAttribute('draggable','true');
    b.appendChild(H('span','bic', t.ic));
    b.appendChild(H('span','bnm', t.nm.replace(/^The /,'')));
    b.setAttribute('aria-label', t.nm + '. ' + t.ds + ' Drag it onto a piece of rock, or open a slot on the floor to choose it.');
    b.title = t.ds;
    /* CLICKING A TOOL EXPLAINS IT. It cannot apply it - there is nothing here
       saying which lump - so it says what it is for and where to put it,
       rather than being a control that looks live and does nothing. */
    on(b,'click',function(){ MF.explainTool(k, b); });
    MF.dragTool(b, k);
    loop.appendChild(b);
    strap.appendChild(loop);
  });
  box.appendChild(strap);
  host.appendChild(box);
};

MF.explainTool = function(key, opener){
  var t = MF.TOOLS[key];
  MF._openSheet({
    label: t.nm, icon: t.ic, title: t.nm, sub: 'on your belt',
    closeText: 'Put it back', opener: opener, key: key,
    fill: function(body){
      body.appendChild(H('p',null, t.ds));
      body.appendChild(H('div','note','<b>To use it:</b> drag it onto a piece of rock on the breaking floor, or open that piece’s slot and choose it from there.'));
      body.appendChild(H('div','hint','<b>You made this by:</b> ' + t.forge));
    }
  });
};

/* dragging a tool off the belt. Same shape as the heap drag, and the drop
   targets are the pieces on the floor. */
MF.dragTool = function(node, key){
  var moved=0, sx=0, sy=0, ghost=null, live=false;
  on(node,'pointerdown',function(e){
    if(e.button) return;
    live=true; moved=0; sx=e.clientX; sy=e.clientY;
    node.setPointerCapture && node.setPointerCapture(e.pointerId);
  });
  on(node,'pointermove',function(e){
    if(!live) return;
    moved = Math.max(moved, Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy));
    if(moved <= 5) return;
    if(!ghost){
      ghost = E('div','dragghost tool', MF.TOOLS[key].ic + ' ' + MF.TOOLS[key].nm);
      document.body.appendChild(ghost);
      MF.markPieceTargets(true);
    }
    ghost.style.left = (e.clientX+12)+'px';
    ghost.style.top  = (e.clientY+12)+'px';
    var over = MF.pieceAt(e.clientX, e.clientY);
    ghost.setAttribute('data-over', over ? 'yes' : 'no');
    MF.markPieceTargets(true, over);
  });
  ['pointerup','pointercancel'].forEach(function(ev){
    on(node,ev,function(e){
      if(!live) return;
      live=false;
      if(!ghost) return;
      var over = MF.pieceAt(e.clientX, e.clientY);
      ghost.parentNode && ghost.parentNode.removeChild(ghost); ghost=null;
      MF.markPieceTargets(false);
      if(over){ MF.applyTool(key, parseInt(over.getAttribute('data-piece'),10), node); }
    });
  });
};

MF.markPieceTargets = function(on_, hot){
  var host = MF._mine && MF._mine.mid;
  if(!host) return;
  Array.prototype.forEach.call(host.querySelectorAll('.piece'), function(p){
    if(!on_){ p.removeAttribute('data-tooldrop'); return; }
    p.setAttribute('data-tooldrop', p===hot ? 'hot' : 'open');
  });
};
MF.pieceAt = function(x, y){
  var host = MF._mine && MF._mine.mid;
  if(!host) return null;
  var hit = null;
  Array.prototype.forEach.call(host.querySelectorAll('.piece'), function(p){
    var b = p.getBoundingClientRect();
    if(x>=b.left && x<=b.right && y>=b.top && y<=b.bottom) hit = p;
  });
  return hit;
};

/* the instrument goes in the piece's slot, the slot lights up, and the panel
   rises. The slot keeps showing what was last held to that piece. */
MF.applyTool = function(key, pieceId, opener){
  var B = MF.state.anvil;
  if(!B) return;
  var p = null;
  B.floor.forEach(function(pc){ if(pc.id===pieceId) p = pc; });
  if(!p) return;
  p.tool = key;
  MF.paintMine();
  var slot = MF._mine.mid.querySelector('.toolslot[data-piece="'+pieceId+'"]');
  MF.openTool(key, p.ore, slot || opener);
};

/* opening a slot with no tool in it: choose one, or be told plainly that the
   belt is empty and where tools come from */
MF.openSlot = function(pieceId, opener){
  var B = MF.state.anvil;
  if(!B) return;
  var p = null;
  B.floor.forEach(function(pc){ if(pc.id===pieceId) p = pc; });
  if(!p) return;
  var owned = MF.toolOrder().filter(MF.hasTool);
  MF._openSheet({
    label: 'Choose an instrument to hold to ' + MF.oreText(p.ore),
    icon: '&#128269;', title: 'The slot', sub: 'on <b>' + MF.oreLabel(p.ore) + '</b>',
    closeText: 'Close', opener: opener,
    fill: function(body){
      if(!owned.length){
        body.appendChild(H('div','note','<b>Nothing on the belt yet.</b> Instruments are not handed out here — you make them at the forge, out of metal you broke out yourself. ' +
          'Everything in the mine works without them; they only make it easier to see.'));
        return;
      }
      body.appendChild(H('p','hint','Which one do you want to hold to it?'));
      var row = E('div','pickrow');
      owned.forEach(function(k){
        var t = MF.TOOLS[k];
        var b = E('button','pickbtn'); b.type='button';
        b.appendChild(H('span','ic', t.ic));
        b.appendChild(H('span','nm', t.nm));
        b.setAttribute('aria-label','Hold ' + t.nm + ' to ' + MF.oreText(p.ore));
        on(b,'click',function(){ MF.applyTool(k, pieceId, opener); });
        row.appendChild(b);
      });
      body.appendChild(row);
    }
  });
};

/* =========================================================================
   THE YARD, DRAWN AS A PLACE.

   Not two lists with headings. A yard is a fenced patch of ground outside the
   adit with a lamp on a post: broken rock goes on the HEAP, and metal that
   will not break any further is racked on timber under the lamp. You can see
   at a glance how much of what you have brought up you have actually finished
   with, and you can pick a rock back off the heap.

   THE BACKDROP IS SCENERY AND MUST NEVER TAKE A CLICK. It is painted behind
   the rocks and bars, which are the controls; pointer-events:none on the svg
   is what keeps it that way, and the `overlay` group asserts it.
   ========================================================================= */
MF.yardScene = function(){
  var wrap = E('div','yardart');
  var W=300, VH=76;
  /* A BAND AT A FIXED HEIGHT, NOT A STRETCHED BACKDROP. Filling the whole
     panel with preserveAspectRatio:none scaled a 104-tall drawing over 438px
     of panel - the palings smeared and the lamp rendered as an ellipse. Sliced
     and pinned to the right edge, the drawing keeps its proportions at every
     column width and the lamp stays on screen; the dirt below it is a CSS
     gradient on .yardplace, which stretches without a shape to distort. */
  var svg = S('svg',{viewBox:'0 0 '+W+' '+VH,'aria-hidden':'true',preserveAspectRatio:'xMaxYMid slice'});

  var sky = S('linearGradient',{id:'yardsky',x1:'0',y1:'0',x2:'0',y2:'1'});
  sky.appendChild(S('stop',{offset:'0%','stop-color':'#4A3F34'}));
  sky.appendChild(S('stop',{offset:'100%','stop-color':'#2E2620'}));
  var defs = S('defs',{}); defs.appendChild(sky); svg.appendChild(defs);
  svg.appendChild(S('rect',{x:0,y:0,width:W,height:VH,fill:'url(#yardsky)'}));

  /* the paling fence along the back - a yard has an edge */
  for(var p=0;p<16;p++){
    var px = 4 + p*19;
    svg.appendChild(S('rect',{x:px,y:18,width:5,height:52,rx:1,fill:'#5A4B3C'}));
    svg.appendChild(S('path',{d:'M'+px+' 18 l2.5 -5 l2.5 5 Z',fill:'#6B5B48'}));
  }
  svg.appendChild(S('rect',{x:0,y:28,width:W,height:4,fill:'#6B5B48',opacity:'.8'}));
  svg.appendChild(S('rect',{x:0,y:52,width:W,height:4,fill:'#6B5B48',opacity:'.8'}));

  /* the ground the heap is tipped on, and the ruts a barrow leaves in it */
  svg.appendChild(S('path',{d:'M0 66 q64 -6 126 -2 q74 5 174 -2 L'+W+' '+VH+' L0 '+VH+' Z',fill:'#3E3328'}));
  svg.appendChild(S('path',{d:'M22 72 q42 -4 84 1',fill:'none',stroke:'#2A2118','stroke-width':'2',opacity:'.7'}));

  /* THE SCRIM, and it is not decoration. Text sits over this drawing, and the
     lightest thing behind it was a fence paling at #5A4B3C - lamp-gold on that
     measures 3.88:1 at 10px and the contrast sweep failed the build over it.
     The scrim pulls every backdrop down to about #3C3228, which .yardplace
     declares as its background-color so the sweep measures what is actually
     behind the words rather than the panel underneath the drawing. */
  svg.appendChild(S('rect',{x:0,y:0,width:W,height:VH,fill:'rgba(30,24,20,.55)'}));

  /* the lamp on its post, lit - the same flicker the mine's lanterns carry.
     Pinned near the right edge because the band slices from xMax, so it is on
     screen at every column width. */
  svg.appendChild(S('rect',{x:270,y:16,width:5,height:56,fill:'#4A3F34'}));
  svg.appendChild(S('path',{d:'M259 18 q13 -10 26 0 Z',fill:'#5A626A'}));
  svg.appendChild(S('circle',{class:'yardglow',cx:'272',cy:'28',r:'15',fill:'rgba(232,163,61,.22)'}));
  svg.appendChild(S('rect',{x:'266',y:'21',width:'12',height:'15',rx:'3',fill:'#E8A33D',stroke:'#8A6A2A','stroke-width':'2'}));

  wrap.appendChild(svg);
  return wrap;
};

MF.paintYard = function(){
  var host = clear(MF._mine.right);
  var box = E('div','yard');

  box.appendChild(H('h3',null,'The Yard'));
  box.appendChild(H('div','hint','Everything you have hauled out. Rock on the heap, metal on the rack.'));

  var place = E('div','yardplace');
  place.appendChild(MF.yardScene());
  var inner = E('div','yardin');

  /* ---- THE RACK: metal that will not break any further ---- */
  var rk = E('div','shelfrow');
  rk.appendChild(H('div','ylab','THE RACK &mdash; native metal'));
  var keys = Object.keys(MF.state.yard);
  if(!keys.length){
    rk.appendChild(H('div','yempty','Bare. Anything you break down to an element is racked here, and this is what the forge spends.'));
  } else {
    var rack = E('div','rack');
    [['plain metal', function(g){ return g.m===0; }],
     ['metal with an x in it', function(g){ return g.m!==0; }]].forEach(function(grp){
      var these = keys.filter(function(k){ return grp[1](MF.state.yard[k].ingot); });
      if(!these.length) return;
      var shelf = E('div','shelf');
      shelf.appendChild(H('div','sh', grp[0]));
      var row = E('div','metalrow');
      these.sort().forEach(function(k){
        var e = MF.state.yard[k];
        var label = e.ingot.label || ingotText(e.ingot);
        row.appendChild(H('div','metal' + (e.ingot.m===0?' pure':''),
          label + (e.count>1 ? ' <span class="ct">×'+e.count+'</span>' : '')));
      });
      shelf.appendChild(row);
      rack.appendChild(shelf);
    });
    rk.appendChild(rack);
  }
  inner.appendChild(rk);

  /* ---- THE HEAP: rock tipped here still carrying a seam ---- */
  var hp = E('div','heaprow');
  hp.appendChild(H('div','ylab','THE HEAP &mdash; still carrying a seam'));
  if(!MF.state.rockpile.length){
    hp.appendChild(H('div','yempty','Empty. Anything you tip here half-broken lands on the heap, and it is still here when you come back for it.'));
  } else {
    var heap = E('div','heap');
    MF.state.rockpile.forEach(function(o, idx){
      var b = E('button','heaprock'); b.type='button';
      b.setAttribute('data-heap', idx);
      b.setAttribute('draggable','true');
      b.appendChild(H('span','hv', MF.oreLabel(o)));
      b.setAttribute('aria-label', MF.oreText(o) + ' — still rock. Put it back under the pick.');
      b.title = 'Put it back under the pick';
      /* ONE CLICK DOES IT, and the drag below does exactly the same thing.
         A drag with no click path is a control half the users cannot reach. */
      on(b,'click',function(){ MF.takeFromHeap(idx); });
      MF.dragFromHeap(b, idx);
      heap.appendChild(b);
    });
    hp.appendChild(heap);
    hp.appendChild(H('div','yhint','Take one back under the pick — click it, or drag it onto the floor.'));
  }
  inner.appendChild(hp);

  place.appendChild(inner);
  box.appendChild(place);

  /* THE BELT IS NOT DRAWN TWICE. It hangs on the breaking floor now, beside
     the rock it acts on - a second copy over here would be the one a student
     reached for, and it is the far one. */

  var toForge = E('button','btn primary'); toForge.type='button';
  toForge.textContent = 'Haul the metal to the forge';
  toForge.style.marginTop='12px'; toForge.style.width='100%';
  on(toForge,'click',function(){ MF.go('forge'); });
  box.appendChild(toForge);

  box.appendChild(H('div','hint','<br>Nothing here is a mark. It is a record of what you have — and unlike a mark, you can spend it.'));
  host.appendChild(box);
};

/* off the heap and back under the pick. It goes through the cart, because the
   cart is how anything reaches the anvil - one route in, not two. */
MF.takeFromHeap = function(idx){
  var ore = MF.state.rockpile[idx];
  if(!ore) return;
  MF.state.rockpile.splice(idx,1);
  ore.id = 'heap-' + (MF._heapSeq = (MF._heapSeq||0)+1);
  ore.layer = ore.layer || MF.state.layer;
  ore.fresh = true;
  MF.state.cart.push(ore);
  MF.state.selected = ore;
  MF.state.anvil = null;
  MF.paintMine();
  MF.flash('Off the heap and back under the pick.');
  setTimeout(function(){ ore.fresh = false; }, 600);
};

/* DRAG IS THE SECOND WAY, NEVER THE ONLY WAY. Built on pointer events to match
   the seam's drag-to-scan; HTML5 drag-and-drop is not used anywhere in this
   file and its drop targets do not survive a repaint. A drag under a few
   pixels is not a drag at all, so a click still lands. */
MF.dragFromHeap = function(node, idx){
  var moved = 0, startX = 0, startY = 0, ghost = null, live = false;
  on(node,'pointerdown',function(e){
    if(e.button) return;
    live = true; moved = 0; startX = e.clientX; startY = e.clientY;
    node.setPointerCapture && node.setPointerCapture(e.pointerId);
  });
  on(node,'pointermove',function(e){
    if(!live) return;
    moved = Math.max(moved, Math.abs(e.clientX-startX) + Math.abs(e.clientY-startY));
    if(moved <= 5) return;
    if(!ghost){
      ghost = E('div','dragghost', node.textContent);
      document.body.appendChild(ghost);
      MF.markDropTargets(true);
    }
    ghost.style.left = (e.clientX + 12) + 'px';
    ghost.style.top  = (e.clientY + 12) + 'px';
    var over = MF.dropTargetAt(e.clientX, e.clientY);
    ghost.setAttribute('data-over', over ? 'yes' : 'no');
  });
  ['pointerup','pointercancel'].forEach(function(ev){
    on(node,ev,function(e){
      if(!live) return;
      live = false;
      if(ghost){
        var over = MF.dropTargetAt(e.clientX, e.clientY);
        ghost.parentNode && ghost.parentNode.removeChild(ghost);
        ghost = null;
        MF.markDropTargets(false);
        /* dropped on the floor: same act as the click. Dropped anywhere else:
           nothing happens and the rock stays on the heap. */
        if(over){ MF.takeFromHeap(idx); return; }
      }
    });
  });
};

/* the floor lights up while something is in the air, so a drag has somewhere
   it is visibly going rather than being guesswork */
MF.markDropTargets = function(on_){
  var host = MF._mine && MF._mine.mid;
  var t = host && host.querySelector('.floorbox');
  if(!t) return;
  if(on_) t.setAttribute('data-drop','open'); else t.removeAttribute('data-drop');
};
MF.dropTargetAt = function(x, y){
  var host = MF._mine && MF._mine.mid;
  var t = host && host.querySelector('.floorbox');
  if(!t) return null;
  var b = t.getBoundingClientRect();
  return (x>=b.left && x<=b.right && y>=b.top && y<=b.bottom) ? t : null;
};

/* =========================================================================
   MF.validate() - every check reports its denominator, and it carries a
   control that MUST fail. A check that only ever passes is worthless.
   ========================================================================= */
MF.validate = function(){
  var errs = [], checked = 0, counts = {};
  function chk(group){ counts[group] = (counts[group]||0)+1; checked++; }

  /* THE INSTRUMENT MUST NOT DAMAGE THE SUBJECT (VERIFICATION s35).
     This function mounts every screen into detached probes, and MF.SCREENS.mine
     sets MF._mine as a side effect. Without this save/restore, running
     MF.validate() left MF._mine pointing at a probe that had been thrown away -
     so afterwards paintMine() drew the bench into a dead DOM and every click a
     student made did nothing, with no console error and no words on screen.

     A review agent hit exactly this, ran the documented instrument first as the
     docs tell you to, and reported "I could not assay a pure ingot". The gate
     was fine. The instrument had broken the page it was measuring, and the
     wreckage was indistinguishable from the defect it was hunting. */
  var _liveMine = MF._mine;
  var _liveScreen = MF.state.screen;

  /* 1. the engine: every factorisation must multiply back exactly */
  for(var a=0;a<=6;a++) for(var b=-12;b<=12;b++) for(var c=-12;c<=12;c++){
    if(a===0 && b===0) continue;
    var r = MF.smeltPoly(a,b,c);
    if(!r.ingots) continue;
    if(r.ingots.some(function(g){ return g.m===0 && g.k===0; })) continue;
    chk('engine');
    var back = ingotProduct(r.ingots);
    if(back.overflow || back.a!==a || back.b!==b || back.c!==c)
      errs.push('engine: '+a+','+b+','+c+' did not multiply back');
  }

  /* 2. seam classification on cases chosen because they are easy to get wrong */
  [[1,0,-9,'twin'],[4,0,-25,'twin'],[1,-5,6,'plain'],[1,0,4,'pure'],[1,0,-2,'pure'],
   [2,7,3,'loaded'],[3,12,0,'shared'],[1,1,0,'shared'],[12,0,-75,'shared'],[0,5,15,'shared'],[0,5,3,'pure']]
  .forEach(function(t){
    chk('classify');
    var got = MF.smeltPoly(t[0],t[1],t[2]).kind;
    if(got!==t[3]) errs.push('classify: '+t[0]+','+t[1]+','+t[2]+' expected '+t[3]+' got '+got);
  });

  /* 3. THE ORE GENERATOR. Every layer, many seeds, and every lump handed to a
        student must be classifiable and smeltable. This is the check that
        matters most, because the ore is generated rather than authored. */
  var rng = makeRng(20260819);
  for(var layer=1; layer<=5; layer++){
    for(var i=0;i<160;i++){
      chk('ore');
      var o = MF.digOre(layer, rng);
      if(!o){ errs.push('ore: layer '+layer+' produced nothing on draw '+i); continue; }
      var kind = MF.assayOf(o);
      if(!MF.ASSAY[kind]){ errs.push('ore: layer '+layer+' gave an unclassifiable lump '+MF.oreText(o)); continue; }
      if(o.kind==='poly'){
        var res = MF.smeltPoly(o.a,o.b,o.c);
        if(res.kind!=='pure'){
          var back2 = ingotProduct(res.ingots||[]);
          if(back2.overflow || back2.a!==o.a || back2.b!==o.b || back2.c!==o.c)
            errs.push('ore: layer '+layer+' lump '+MF.oreText(o)+' does not smelt back');
        }
        if(o.a===0 && o.b===0) errs.push('ore: layer '+layer+' produced an empty lump');
      } else if(o.n < 2){ errs.push('ore: layer '+layer+' produced a number below 2'); }
      /* the layer must actually deliver the ore it advertises */
      if(layer===5 && o.kind==='poly' && o.a===1) errs.push('ore: layer 5 handed out an unloaded trinomial');
      if(layer===1 && o.kind!=='number') errs.push('ore: layer 1 handed out a polynomial');
    }
  }

  /* 3b. BREAKING. The mine's one move, swept the way a student uses it: take
         a real lump, break its true factors off ONE AT A TIME, and assert at
         every step that the two pieces still reconstruct the rock they came
         out of. A lump is only finished when nothing left on the floor can be
         broken further.

         READ THE DENOMINATOR: this sweeps generated ore at every layer, and
         the factors it names are the engine's own. It does not sweep what a
         student might type instead - the refusals below do that, and only for
         the four shapes named. */
  var brRng = makeRng(770077);
  for(var bl=1; bl<=MF.LAYERS.length; bl++){
    for(var bi=0; bi<40; bi++){
      var bore = MF.digOre(bl, brRng);
      if(!bore) continue;
      chk('break');
      /* the pieces on the floor, broken down until every one is native */
      var floor = [bore], guard = 0, wantTotal = (bore.kind==='number')
        ? {a:0,b:0,c:bore.n} : {a:bore.a,b:bore.b,c:bore.c};
      while(guard++ < 24){
        var at = -1;
        for(var fi=0; fi<floor.length; fi++){ if(!MF.isNative(floor[fi])){ at=fi; break; } }
        if(at < 0) break;                       /* everything is native metal */
        var piece = floor[at];
        /* the engine's own idea of what is in there, one factor of it */
        var one = null;
        if(piece.kind==='number'){ one = {m:0, k:primeFactors(piece.n)[0]}; }
        else {
          var pr = MF.smeltPoly(piece.a,piece.b,piece.c);
          var cand = (pr.ingots||[]).filter(function(g){ return !(g.m===0&&g.k===0) && !(g.m===0&&Math.abs(g.k)===1); });
          one = cand[0];
        }
        if(!one){ errs.push('break: '+MF.oreText(piece)+' is not native and the engine names nothing in it'); break; }
        var got = MF.breakOff(piece, one);
        if(!got.ok){
          errs.push('break: the engine\'s own factor '+ingotText(one)+' would not come out of '+MF.oreText(piece)+' ('+got.reason+')');
          break;
        }
        chk('break');
        if(!MF.oreSame(MF.oreMul(got.left, got.right), piece))
          errs.push('break: '+MF.oreText(piece)+' split into pieces that do not rebuild it');
        floor.splice(at, 1, got.left, got.right);
      }
      if(guard >= 24){ errs.push('break: '+MF.oreText(bore)+' never broke down to native metal'); continue; }
      /* and the whole floor must still be the lump that was dug */
      var acc = {kind:'number', n:1}, blew = false;
      floor.forEach(function(pc){
        if(blew) return;
        var mm = MF.oreMul(acc, pc);
        if(mm.overflow){ blew = true; return; }
        acc = MF.asOre(mm.a, mm.b, mm.c);
      });
      chk('break');
      if(blew || !MF.oreSame(MF.oreMul(acc, {kind:'number',n:1}), bore))
        errs.push('break: the pieces of '+MF.oreText(bore)+' do not multiply back to it');
    }
  }

  /* 3b-i. WHAT THE BOXES MEAN, WHICH IS NOT WHAT THE ENGINE THINKS.
           Reported as a maths error: on layer 5, (x + 6) was refused as a
           factor of 3x² + 22x + 24 — which it is. The engine was right the
           whole time. The student had CLEARED the x-part box, which read as
           nought, so the hammer was cut to 6 rather than to (x + 6), and the
           refusal named a shape they had never typed.

           An empty constant box means no constant, which IS nought. An empty
           x-part box means no coefficient written in front of the x, which is
           ONE. They are different boxes and they had one reader. */
  [['',      1, 'an empty x-part is one x, not none'],
   ['1',     1, 'a plain 1'],
   ['x',     1, 'the letter itself'],
   ['-x',   -1, 'a negative single x'],
   ['-',    -1, 'a lone minus'],
   ['0',     0, 'an explicit nought, which is how you ask for a plain metal'],
   ['3',     3, 'a coefficient'],
   ['2x',    2, 'a coefficient written with its x'],
   ['−4',   -4, 'a typographic minus']
  ].forEach(function(t){
    chk('break');
    var got = MF.readPickM(t[0]);
    if(got !== t[1])
      errs.push('break: the x-part box read "' + t[0] + '" as ' + got + ', expected ' + t[1] + ' — ' + t[2]);
  });
  /* and the constant box must still read empty as nought */
  chk('break');
  if(MF.readInt('') !== 0) errs.push('break: the constant box no longer reads empty as nought');
  /* the reported case, end to end through the two readers */
  chk('break');
  var repM = MF.readPickM(''), repK = MF.readInt('6');
  if(!MF.breakOff({kind:'poly',a:3,b:22,c:24}, {m:repM, k:repK}).ok)
    errs.push('break: an empty x-part and a 6 still will not take (x + 6) out of 3x² + 22x + 24');

  /* the four refusals, each a shape a student will actually swing */
  [[{kind:'poly',a:1,b:-5,c:6}, {m:1,k:2},  'glance',  'a bracket that is not in there'],
   [{kind:'number',n:12},       {m:0,k:5},  'glance',  'a number that does not divide'],
   [{kind:'number',n:12},       {m:0,k:12}, 'whole',   'the whole lump'],
   [{kind:'number',n:12},       {m:0,k:1},  'nothing', 'one, which takes nothing out'],
   [{kind:'number',n:12},       {m:1,k:3},  'shape',   'an x-shaped pick on a number'],
   [{kind:'poly',a:1,b:0,c:-9}, {m:0,k:0},  'nothing', 'a pick with no edge on it']
  ].forEach(function(t){
    chk('break');
    var r = MF.breakOff(t[0], t[1]);
    if(r.ok) errs.push('break: '+ingotText(t[1])+' came out of '+MF.oreText(t[0])+' and it is '+t[3]);
    else if(r.reason!==t[2]) errs.push('break: '+t[3]+' was refused as "'+r.reason+'", expected "'+t[2]+'"');
  });
  /* and the ones that MUST come out, or the refusals above prove nothing */
  [[{kind:'poly',a:1,b:-5,c:6},  {m:1,k:-2}, 'x − 3'],
   [{kind:'poly',a:6,b:7,c:-3},  {m:2,k:3},  '3x − 1'],
   [{kind:'poly',a:0,b:6,c:15},  {m:0,k:3},  '2x + 5'],
   [{kind:'poly',a:1,b:0,c:-9},  {m:1,k:3},  'x − 3'],
   [{kind:'poly',a:0,b:5,c:15},  {m:1,k:3},  '5'],
   [{kind:'number',n:60},        {m:0,k:6},  '10']
  ].forEach(function(t){
    chk('break');
    var r = MF.breakOff(t[0], t[1]);
    if(!r.ok) errs.push('break: '+ingotText(t[1])+' would not come out of '+MF.oreText(t[0])+' ('+r.reason+')');
    else if(MF.oreText(r.right)!==t[2])
      errs.push('break: '+MF.oreText(t[0])+' ÷ '+ingotText(t[1])+' left '+MF.oreText(r.right)+', expected '+t[2]);
  });

  /* 3c. NATIVE METAL. A prime and an irreducible polynomial must answer this
         question identically - that identity is the whole thesis of the site,
         so it is asserted rather than assumed. */
  for(var nn=2; nn<=200; nn++){
    chk('native');
    if(MF.isNative({kind:'number',n:nn}) !== isPrime(nn))
      errs.push('native: '+nn+' disagreed with isPrime');
  }
  for(var na=0; na<=4; na++) for(var nb=-9; nb<=9; nb++) for(var nc=-9; nc<=9; nc++){
    if(na===0 && nb===0) continue;
    chk('native');
    var want = MF.smeltPoly(na,nb,nc).kind === 'pure';
    if(MF.isNative({kind:'poly',a:na,b:nb,c:nc}) !== want)
      errs.push('native: '+quadText(na,nb,nc)+' disagreed with the smelting engine');
  }
  /* a constant in polynomial clothes is the number, not a 'pure' polynomial */
  chk('native'); if(MF.isNative({kind:'poly',a:0,b:0,c:1}))  errs.push('native: 1 was called an element');
  chk('native'); if(!MF.isNative({kind:'poly',a:0,b:0,c:7})) errs.push('native: 7 in polynomial clothes was not called an element');
  chk('native'); if(MF.isNative({kind:'poly',a:0,b:0,c:12})) errs.push('native: 12 in polynomial clothes was called an element');

  /* 4. printing must never leak a float artefact, and never a phantom term */
  [0.1+0.2, 1/3, 4.5, -0.5].forEach(function(f){ chk('print'); if(num(f).length>9) errs.push('print: long float '+num(f)); });
  chk('print'); if(quadText(0,5,15)!=='5x + 15')  errs.push('print: quad(0,5,15) gave '+quadText(0,5,15));
  chk('print'); if(quadText(1,0,-9)!=='x² − 9')   errs.push('print: quad(1,0,-9) gave '+quadText(1,0,-9));
  chk('print'); if(quadText(1,1,1)!=='x² + x + 1')errs.push('print: quad(1,1,1) gave '+quadText(1,1,1));

  /* 5. the pour must be the ONLY thing that judges a smelt. A wrong set of
        metals must produce a deformed casting, and a right one a clean one. */
  chk('pour'); var good = ingotProduct([{m:1,k:-2},{m:1,k:-3}]);
  if(!(good.a===1 && good.b===-5 && good.c===6)) errs.push('pour: correct metals did not cast the ore');
  chk('pour'); var bad = ingotProduct([{m:1,k:2},{m:1,k:3}]);
  if(bad.a===1 && bad.b===-5 && bad.c===6) errs.push('pour: wrong metals cast a clean object');

  /* 5b. THE FORGE. Every order must be forgeable from metal the mine can
         actually produce, forging must SPEND exactly what went in, and a wrong
         pour must come out scrap. */
  var savedYard = MF.state.yard, savedTools = MF.state.tools, savedForge = MF.state.forge;
  MF.state.yard = {}; MF.state.tools = {}; MF.state.forge = {slots:[], picked:null};

  /* stock a yard from real smelts so the metals are ones a student could own */
  var oreRng = makeRng(31337);
  for(var d=0; d<70; d++){
    var lump = MF.digOre(1 + (d % 5), oreRng);
    if(!lump) continue;
    if(lump.kind==='number'){ primeFactors(lump.n).forEach(function(p){ MF.addToYard({m:0,k:p}); }); }
    else {
      var rr = MF.smeltPoly(lump.a,lump.b,lump.c);
      if(rr.ingots) rr.ingots.forEach(function(g){ if(!(g.m===0&&g.k===0)) MF.addToYard({m:g.m,k:g.k}); });
    }
  }
  Object.keys(MF.TOOLS).forEach(function(key){
    chk('forge');
    if(!MF.toolReady(key)) errs.push('forge: "'+MF.TOOLS[key].nm+'" is not forgeable from 70 real smelts - an unreachable order');
  });

  /* EVERY ORDER'S TARGET MUST BE HITTABLE, AND ONLY BY HITTING IT.
     For each tool: the metals the yard actually offers must cast the object,
     that casting must be judged sound, and a near miss must not be. The near
     miss is built by nudging ONE metal by one, so it is the mistake a student
     really makes rather than a straw man. */
  MF.toolOrder().forEach(function(key){
    var t = MF.TOOLS[key];
    var set = MF.castableFrom(t.cast, t.slots, MF.yardList());
    chk('forge');
    if(!set){ errs.push('forge: nothing on a yard from 70 real smelts casts ' + quadText(t.cast.a,t.cast.b,t.cast.c) + ' for "' + t.nm + '"'); return; }
    var ings = set.map(function(e){ return e.ingot; });
    chk('forge');
    var good = MF.forgeJudge(t, ings, ingotProduct(ings));
    if(!good.ok) errs.push('forge: the metals that DO cast ' + quadText(t.cast.a,t.cast.b,t.cast.c) + ' were judged unsound for "' + t.nm + '"');
    /* one metal out by one, which is the miss that actually happens */
    var near = ings.slice();
    near[0] = {m:near[0].m, k:near[0].k + 1};
    chk('forge');
    var bad2 = MF.forgeJudge(t, near, ingotProduct(near));
    if(bad2.ok) errs.push('forge: "' + t.nm + '" accepted a casting that is not ' + quadText(t.cast.a,t.cast.b,t.cast.c));
    chk('forge');
    if(!/miss|over the sides/i.test(bad2.why))
      errs.push('forge: "' + t.nm + '" rejected a near miss without saying where it missed');
  });

  /* a correct forge SPENDS its metal - exactly what went in, and no more */
  chk('forge');
  var lanternSet = MF.castableFrom(MF.TOOLS.lantern.cast, MF.TOOLS.lantern.slots, MF.yardList());
  var beforeCount = MF.yardList().length;
  if(!lanternSet){ errs.push('forge: the yard could not cast 30 for the Lantern'); }
  else {
    MF.spendFromYard(lanternSet.map(function(e){ return e.key; }));
    if(MF.yardList().length !== beforeCount - MF.TOOLS.lantern.slots)
      errs.push('forge: spending the Lantern\'s metal did not remove exactly ' + MF.TOOLS.lantern.slots + ' from the yard');
  }

  /* THE TARGETS MUST CLIMB. The whole point of the ladder is that a tool which
     does more for you costs a harder object, so the ranks must be a straight
     1..n with no ties - a board that says otherwise is telling the student the
     escalation is real when it is not. */
  var ranks = MF.toolOrder().map(function(k){ return MF.TOOLS[k].rank; });
  chk('forge');
  if(ranks.join(',') !== ranks.map(function(_,i){ return i+1; }).join(','))
    errs.push('forge: the ladder ranks are ' + ranks.join(',') + ' - they must run 1..' + ranks.length + ' with no ties or gaps');
  /* and every target must be a genuinely different object */
  var seen = {};
  MF.toolOrder().forEach(function(k){
    var t = MF.TOOLS[k], sig = t.cast.a+'|'+t.cast.b+'|'+t.cast.c;
    chk('forge');
    if(seen[sig]) errs.push('forge: "' + t.nm + '" and "' + seen[sig] + '" are cut for the same object');
    seen[sig] = t.nm;
  });

  /* 5j. EVERY SCREEN MUST ACTUALLY BUILD.
         Three screens - both workshops and the forge - threw a ReferenceError
         and showed "This screen did not build" for an entire session, while
         MF.validate reported 0 errors across sixteen groups. The try/catch in
         MF.go turned a fatal fault into a polite notice that only a human
         reading the page would ever see, and no instrument was looking.
         The screens are enumerated from MF.SCREENS itself, never a written
         list, so a screen added later cannot escape this (VERIFICATION s36). */
  var screenNames = Object.keys(MF.SCREENS);
  chk('screens');
  if(screenNames.length < 5) errs.push('screens: only ' + screenNames.length + ' screens are registered');
  var scStage = document.createElement('div');
  scStage.style.cssText = 'position:absolute; left:-12000px; top:0; width:1100px';
  document.body.appendChild(scStage);
  var scSavedMine = MF._mine;
  screenNames.forEach(function(name){
    chk('screens');
    var probe = document.createElement('div');
    scStage.appendChild(probe);
    try {
      MF.SCREENS[name](probe);
    } catch(e){
      errs.push('screens: "' + name + '" threw while building: ' + (e.message||e));
      return;
    }
    var txt = (probe.textContent||'').trim();
    if(txt.length < 120)
      errs.push('screens: "' + name + '" built only ' + txt.length + ' characters - it is effectively empty');
    if(/did not build/i.test(txt))
      errs.push('screens: "' + name + '" rendered its own failure notice');
  });
  MF._mine = scSavedMine;
  /* CONTROL: a throwing screen must be caught, not smoothed over */
  chk('screens');
  var realHome = MF.SCREENS.home;
  MF.SCREENS.home = function(){ throw new Error('planted'); };
  var caught = false;
  try { MF.SCREENS.home(document.createElement('div')); } catch(e){ caught = true; }
  MF.SCREENS.home = realHome;
  if(!caught) errs.push('CONTROL: the screens check cannot detect a screen that throws');
  document.body.removeChild(scStage);

  /* 5e. EVERY PLACE MUST HAVE A DOOR IN THE WORLD.
         The forge shipped as a whole screen with no building on the surface,
         in a design whose stated principle is that the buildings ARE the
         navigation. Fixing the instance is not enough - this asserts the
         class, so the next screen added cannot be doorless either. */
  var sceneProbe = MF.surfaceScene();
  var doors = {};
  Array.prototype.forEach.call(sceneProbe.querySelectorAll('.hot'), function(g){
    doors[g.getAttribute('data-screen')] = (g.getAttribute('aria-label')||'').trim();
  });
  /* every place that is not the surface itself needs a way in from the world */
  ['workshop-mold','workshop-ore','mine','forge'].forEach(function(scr){
    chk('doors');
    if(!doors[scr]) errs.push('doors: "' + scr + '" is a place with no building on the surface');
  });
  /* and no door may lead somewhere that does not exist */
  Object.keys(doors).forEach(function(scr){
    chk('doors');
    if(!MF.SCREENS[scr]) errs.push('doors: the building labelled "' + doors[scr] + '" opens "' + scr + '", which is not a screen');
  });
  /* the ore workshop must open the room about BREAKING ORE APART, not the mold
     - these were once wired to each other's screens. The test was /Smelt/i
       while the building was the Smelting House; the mine does not smelt any
       more (§11) and the building is the Stamp Mill, so the assertion moves
       with the name deliberately rather than being quietly deleted. */
  chk('doors');
  if(!/Stamp|Mill|Crush|Break/i.test(doors['workshop-ore']||''))
    errs.push('doors: the ore workshop is behind "' + doors['workshop-ore'] + '", which does not read as a place ore is broken up');
  chk('doors');
  if(!/Cast|Mold/i.test(doors['workshop-mold']||'')) errs.push('doors: the mold workshop is behind "' + doors['workshop-mold'] + '", which does not read as casting');

  /* 5d. THE SEAM. Ore must be spread along its whole length, not bunched at
         one end where a student who scans would find nothing. */
  var savedFace = MF.state.face, savedFaceLayer = MF.state.faceLayer, savedScan = MF.state.scan;
  for(var sl=1; sl<=MF.LAYERS.length; sl++){
    chk('seam');
    MF.state.layer = sl; MF.state.face = []; MF.state.faceLayer = null;
    var seam = MF.stockFace();
    if(seam.length < MF.SEAM_COUNT){ errs.push('seam: layer '+sl+' only stocked '+seam.length+' of the seam'); continue; }
    /* split the seam into thirds and assert every third holds ore */
    var thirds = [0,0,0];
    seam.forEach(function(o){ thirds[Math.min(2, Math.floor((o.px / MF.SEAM_W) * 3))]++; });
    thirds.forEach(function(n, i){
      if(n === 0) errs.push('seam: layer '+sl+' has no ore in third '+(i+1)+' - scanning there finds bare rock');
    });
    var offEnd = seam.filter(function(o){ return o.px < 0 || o.px > MF.SEAM_W; }).length;
    if(offEnd) errs.push('seam: layer '+sl+' put '+offEnd+' lumps outside the drawn rock');
  }
  MF.state.face = savedFace; MF.state.faceLayer = savedFaceLayer; MF.state.scan = savedScan;

  /* 5c. A TOOL MUST NEVER GATE DESCENT. With nothing forged and an empty yard,
         every layer must still be reachable and still hand out ore. */
  MF.state.yard = {}; MF.state.tools = {};
  for(var L=1; L<=MF.LAYERS.length; L++){
    chk('nogate');
    var probeRng = makeRng(900+L);
    var got = MF.digOre(L, probeRng);
    if(!got) errs.push('nogate: layer '+L+' produced no ore for a student with no tools');
  }
  MF.state.yard = savedYard; MF.state.tools = savedTools; MF.state.forge = savedForge;

  /* 5h. NO DISTRACTOR MAY BE TRUE, AND NO ROOT MAY BE DENIED.
         Both of these shipped and both were student-facing falsehoods:
         4x²−4 was graded Common Vein only while literally being two squares
         with a minus and no middle term, and the Decimal Dial told every
         linear lump it had no decimal seam when it always has exactly one. */
  var seamRng = makeRng(24601);
  for(var sw=0; sw<400; sw++){
    var slump = MF.digOre(1 + (sw % 5), seamRng);
    if(!slump || slump.kind!=='poly') continue;
    chk('truthy');
    var acc = MF.assayAccepts(slump);
    /* if it LOOKS like a twin seam by the tell this site prints, that call must be accepted */
    var looksTwin = (slump.a!==0 && slump.b===0 && slump.c<0 && isSquare(slump.a) && isSquare(-slump.c));
    if(looksTwin && acc.indexOf('twin') < 0)
      errs.push('truthy: ' + quadText(slump.a,slump.b,slump.c) + ' is two squares minus two squares, but "Twin Seam" is graded wrong');
    /* a lump with a real root must never be told it has none */
    chk('truthy');
    var sres = MF.smeltPoly(slump.a, slump.b, slump.c);
    var hasRealRoot = (slump.a===0) ? (slump.b!==0) : (slump.b*slump.b - 4*slump.a*slump.c > 0);
    if(hasRealRoot && sres.kind==='pure' && !sres.realRoots)
      errs.push('truthy: ' + quadText(slump.a,slump.b,slump.c) + ' has a real root but the dial would report none');
  }
  /* THE DIAL'S OWN RANGE, NOT JUST THE LUMP AS DUG.
     The check above tests each lump's ORIGINAL integer coefficients and never
     nudges c - which is the one thing the Decimal Dial exists to do. It
     therefore reported 0 errors while 1,970 dial states printed a falsehood.
     This sweeps every slider position the control can actually reach. */
  var dialRng = makeRng(8675309);
  for(var dw=0; dw<160; dw++){
    var dlump = MF.digOre(1 + (dw % 5), dialRng);
    if(!dlump || dlump.kind!=='poly') continue;
    for(var off=-2; off<=2; off+=0.5){
      chk('truthy');
      var dres = MF.smeltPoly(dlump.a, dlump.b, dlump.c + off);
      var A=dlump.a, Bc=dlump.b, C=dlump.c+off;
      /* does a real root actually exist at this dial position? */
      var trueRoot = (A===0) ? (Bc!==0) : (Bc*Bc - 4*A*C >= 0);
      var saysNone = (dres.kind==='pure' && !dres.realRoots);
      if(trueRoot && saysNone)
        errs.push('truthy: dial at ' + quadText(A,Bc,C) + ' denies a real root that exists');
      if(dres.realRoots) dres.realRoots.forEach(function(r){
        chk('truthy');
        var resid = A*r*r + Bc*r + C;
        if(Math.abs(resid) > 1e-6 * (Math.abs(A*r*r)+Math.abs(Bc*r)+Math.abs(C)+1))
          errs.push('truthy: dial at ' + quadText(A,Bc,C) + ' printed a root of ' + r + ' that is not a root');
      });
    }
  }
  /* CONTROLS: both must fail */
  chk('truthy');
  if(MF.assayAccepts({kind:'poly',a:4,b:0,c:-4}).indexOf('twin') < 0)
    errs.push('CONTROL: 4x²−4 still rejects the Twin Seam reading');
  chk('truthy');
  var linProbe = MF.smeltPoly(0,12,17);
  if(!linProbe.realRoots || Math.abs(linProbe.realRoots[0] + 17/12) > 1e-9)
    errs.push('CONTROL: 12x+17 does not report its real root of −17/12');

  /* 5i. AN EXPLANATION MUST SURVIVE THE ANSWER THAT REVEALS IT.
         Nobody owned display DURATION - not one agent brief contains the word,
         and art-director's instrument is defined to pause animations before it
         measures, so it can never see a 240ms window. That gap shipped a build
         which showed its reasoning for a quarter second on a correct answer and
         indefinitely on a wrong one: it explained itself only to students who
         got it wrong. This asserts the invariant directly. */
  var expStage = document.createElement('div');
  expStage.style.cssText = 'position:absolute; left:-12000px; top:0; width:1000px';
  document.body.appendChild(expStage);
  [[1,-5,6],[4,0,-4],[1,0,4]].forEach(function(t){
    chk('explain');
    var probe = {kind:'poly', a:t[0], b:t[1], c:t[2], layer:4, id:'exp-'+t[1]+'-'+t[2]};
    var B = MF.anvilInit(probe);
    var host = document.createElement('div');
    /* the state a student is in one instant after a correct call */
    B.step = 'break';
    B.calledAs = MF.assayOf(probe);
    B.calledWhy = MF.ASSAY[B.calledAs].tell;
    MF.paintAssay(host, B);
    expStage.appendChild(host);
    var txt = (host.textContent||'').replace(/\s+/g,' ').trim();
    if(txt.indexOf(MF.ASSAY[B.calledAs].name) < 0)
      errs.push('explain: after calling ' + quadText(t[0],t[1],t[2]) + ' the call itself is no longer on screen');
    if(txt.length < 40)
      errs.push('explain: the reason for ' + quadText(t[0],t[1],t[2]) + ' survives the answer as only ' + txt.length + ' characters');
    expStage.removeChild(host);
  });
  /* CONTROL: an assay panel that drops its explanation must be caught */
  chk('explain');
  var blankHost = document.createElement('div');
  expStage.appendChild(blankHost);
  var blankTxt = (blankHost.textContent||'').trim();
  if(blankTxt.length >= 40)
    errs.push('CONTROL: the explanation check cannot tell an empty panel from a full one');
  document.body.removeChild(expStage);

  /* 5g. NO ANIMATED ELEMENT MAY CARRY AN SVG transform ATTRIBUTE.
         A CSS transform animation REPLACES the transform attribute rather than
         composing with it, so a positioned group that also animates drifts off
         its mount. This has now happened three times - the ore cart ended up in
         the sky, the headframe wheel left its tower, and the assay balance
         vanished from its room entirely. Twice it was fixed as an instance.
         This asserts the class: position on an outer mount, animate the inner. */
  MF.ANIM_TRANSFORM_CLASSES = ['sc-wheel','sc-sails','sc-cart','sc-smoke','sc-cloud','sc-bird',
                               'rm-fire','rm-bellows','rm-steam','rm-ladle','rm-stamp','pickarm',
                               'ct-cart','ct-jolt','ct-wheel','sc-cartout','hammerswing'];
  var animStage = document.createElement('div');
  animStage.style.cssText = 'position:absolute; left:-12000px; top:0; width:1100px';
  document.body.appendChild(animStage);
  /* built one at a time, each guarded. These used to be constructed in a bare
     array literal, so a scene builder that threw killed MF.validate outright -
     no report, no denominators, no findings, just an exception. An instrument
     that dies on the defect it is meant to catch is worse than one that is
     silent about it, because the crash looks like the tool being broken. */
  var animSubjects = [];
  [['surface', function(){ return MF.surfaceScene(); }],
   ['foundry', function(){ return MF.roomScene('foundry'); }],
   ['stamps',  function(){ return MF.roomScene('stamps'); }],
   ['forge',   function(){ return MF.roomScene('forge'); }],
   ['carttrack', function(){ return MF.cartTrack(); }]].forEach(function(pair){
    chk('animmount');
    try { animSubjects.push(pair[1]()); }
    catch(e){ errs.push('animmount: the "' + pair[0] + '" scene threw while building: ' + (e.message||e)); }
  });
  animSubjects.forEach(function(node){ animStage.appendChild(node); });
  MF.ANIM_TRANSFORM_CLASSES.forEach(function(cls){
    chk('animmount');
    var offenders = [];
    animStage.querySelectorAll('.' + cls).forEach(function(el){
      if(el.hasAttribute('transform')) offenders.push(el.getAttribute('transform'));
    });
    if(offenders.length) errs.push('animmount: .' + cls + ' carries a transform attribute (' +
      offenders[0] + ') - the animation will replace it and the piece will drift off its mount');
  });
  /* CONTROL: plant the defect and confirm the check sees it */
  chk('animmount');
  var planted = document.createElementNS('http://www.w3.org/2000/svg','g');
  planted.setAttribute('class','rm-fire');
  planted.setAttribute('transform','translate(10,10)');
  animStage.appendChild(planted);
  var caught = false;
  animStage.querySelectorAll('.rm-fire').forEach(function(el){ if(el.hasAttribute('transform')) caught = true; });
  if(!caught) errs.push('CONTROL: the animated-transform check did not catch a planted offender');
  document.body.removeChild(animStage);

  /* 5f. CONTRAST, MEASURED RATHER THAN REMEMBERED.
         The yard's metal bars measured 2.27:1 for as long as they existed and
         nobody noticed, because the sweep only ever ran by hand and the yard
         was usually empty when it did. This runs on every validate, against a
         POPULATED state, and resolves gradient backdrops properly - the naive
         walker climbs past a gradient to the body colour and reports false
         failures on every dark surface in this build. */
  var stage = document.createElement('div');
  stage.setAttribute('aria-hidden','true');
  /* off-screen, NOT display:none - a hidden subtree has no layout and no
     resolved colours, so it would measure nothing and report clean (s2) */
  stage.style.cssText = 'position:absolute; left:-12000px; top:0; width:1100px';
  document.body.appendChild(stage);

  function _rgb(v){ var m=(v||'').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/); return m?[+m[1],+m[2],+m[3]]:null; }
  function _lum(c){ var a=c.map(function(x){ x/=255; return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4); });
    return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2]; }
  function _ratio(f,b){ var L1=_lum(f),L2=_lum(b); return (Math.max(L1,L2)+0.05)/(Math.min(L1,L2)+0.05); }
  function _backdrops(el, root){
    var n=el;
    while(n && n!==root.parentNode){
      var cs=getComputedStyle(n), bg=_rgb(cs.backgroundColor);
      if(bg && cs.backgroundColor.indexOf('rgba(0, 0, 0, 0)')<0) return [bg];
      var img=cs.backgroundImage||'';
      if(img.indexOf('gradient')>=0){
        var st=(img.match(/rgba?\([^)]+\)/g)||[]).map(_rgb).filter(Boolean);
        if(st.length) return st;
      }
      n=n.parentElement;
    }
    return [[253,248,240]];
  }
  MF._measureContrast = function(root){
    var out = [];
    root.querySelectorAll('*').forEach(function(el){
      var direct = Array.prototype.some.call(el.childNodes, function(n){ return n.nodeType===3 && n.textContent.trim().length>1; });
      if(!direct) return;
      var cs = getComputedStyle(el);
      if(cs.display==='none' || cs.visibility==='hidden' || parseFloat(cs.opacity)===0) return;
      var f=_rgb(cs.color); if(!f) return;
      var px=parseFloat(cs.fontSize), bold=parseInt(cs.fontWeight,10)>=700;
      var need = (px>=24 || (px>=18.66 && bold)) ? 3 : 4.5;
      var r = Math.min.apply(null, _backdrops(el, root).map(function(b){ return _ratio(f,b); }));
      out.push({el:el, ratio:Math.round(r*100)/100, need:need,
                text:(el.textContent||'').trim().slice(0,30), cls:(el.className||'').toString().slice(0,24)});
    });
    return out;
  };

  /* populate hard: tools forged, a stocked yard, a lump mid-smelt - the states
     where the new surfaces actually have text on them */
  var cSaved = {yard:MF.state.yard, tools:MF.state.tools, cart:MF.state.cart, sel:MF.state.selected,
                bench:MF.state.anvil, mine:MF._mine, layer:MF.state.layer, face:MF.state.face, fl:MF.state.faceLayer,
                forge:MF.state.forge};
  MF.state.yard={}; MF.state.tools={lantern:{forged:true},shifter:{forged:true},drill:{forged:true}};
  var cRng = makeRng(5150);
  for(var ci=0; ci<10; ci++){
    var cl = MF.digOre(1+(ci%5), cRng); if(!cl) continue;
    if(cl.kind==='number') primeFactors(cl.n).forEach(function(p){ MF.addToYard({m:0,k:p}); });
    else { var cr = MF.smeltPoly(cl.a,cl.b,cl.c); if(cr.ingots) cr.ingots.forEach(function(g){ if(!(g.m===0&&g.k===0)) MF.addToYard({m:g.m,k:g.k}); }); }
  }
  var contrastFails = [];
  ['home','workshop-mold','workshop-ore','forge','mine'].forEach(function(scr){
    stage.innerHTML='';
    var probe = document.createElement('div');
    stage.appendChild(probe);
    try {
      if(scr==='mine'){
        MF._mine = null;
        MF.SCREENS.mine(probe);
        MF.state.layer=4; MF.state.face=[]; MF.state.faceLayer=null;
        var lump = MF.digOre(4, cRng);
        if(lump){ MF.state.cart=[lump]; MF.state.selected=lump; MF.state.anvil=MF.anvilInit(lump); MF.state.anvil.step='break'; }
        MF.paintMine();
      } else if(scr==='forge'){
        /* WITH A MOLD OPEN, and with something in it. Mounted cold the forge
           shows an order board and a "the mold is cold" plate - the crucible,
           the filled slots, the empty slots and the not-on-the-rack warning
           were all outside the sweep, which is the denominator question this
           project keeps having to ask of a green result. */
        MF.state.forge = {picked:'lantern', slots:[], result:null};
        var cHave = MF.yardList();
        if(cHave.length) MF.state.forge.slots = [{yardIdx:cHave[0].idx, key:cHave[0].key, ingot:cHave[0].ingot}];
        MF.SCREENS.forge(probe);
      } else { MF.SCREENS[scr](probe); }
    } catch(e){ errs.push('contrast: screen '+scr+' threw: '+e.message); return; }
    MF._measureContrast(probe).forEach(function(m){
      chk('contrast');
      if(m.ratio < m.need) contrastFails.push(scr+': "'+m.text+'" ('+m.cls+') at '+m.ratio+':1, needs '+m.need);
    });
  });
  contrastFails.slice(0,8).forEach(function(f){ errs.push('contrast: '+f); });
  if(contrastFails.length > 8) errs.push('contrast: and '+(contrastFails.length-8)+' more');

  /* CONTROL: unreadable text must be caught, or the sweep is measuring nothing */
  chk('contrast');
  stage.innerHTML = '<div style="background:#FDF8F0"><p style="color:#FBF6EE;font-size:14px">invisible</p></div>';
  var ctrlHits = MF._measureContrast(stage).filter(function(m){ return m.ratio < m.need; });
  if(!ctrlHits.length) errs.push('CONTROL: the contrast sweep did not catch cream text on cream');

  document.body.removeChild(stage);
  MF.state.yard=cSaved.yard; MF.state.tools=cSaved.tools; MF.state.cart=cSaved.cart;
  MF.state.selected=cSaved.sel; MF.state.anvil=cSaved.bench; MF._mine=cSaved.mine;
  MF.state.layer=cSaved.layer; MF.state.face=cSaved.face; MF.state.faceLayer=cSaved.fl;
  MF.state.forge=cSaved.forge;

  /* 5l. WORKING A SCREEN MUST NOT RE-ENTER IT.

         Every click in the forge used to call MF.go('forge'), which rebuilds
         the whole screen, moves focus, restarts the arrival wipe and scrolls
         to the top. Dropping one metal in a slot threw the page back to the
         masthead; choosing three and pouring meant four jumps.

         ASSERTED BY WATCHING MF.go ITSELF, and the first version of this check
         could not have caught the bug it was written for: it compared the grid
         node before and after a click, but MF.go rebuilds `#screen` and the
         probe mounts somewhere else entirely - so a re-entry left the probe's
         grid untouched and the check passed. It was only found by trying to
         reintroduce the fault and watching nothing happen. A control that
         cannot fail is the thing this file is about (s41).

         READ THE DENOMINATOR: this covers the forge's own controls. It says
         nothing about the mine, which has repainted in place since it was
         written, and nothing about how far anything scrolls. */
  var ipSaved = {forge:MF.state.forge, yard:MF.state.yard, tools:MF.state.tools, mine:MF._forge};
  var ipStage = document.createElement('div');
  ipStage.style.cssText = 'position:fixed; left:-6000px; top:0; width:1100px';
  document.body.appendChild(ipStage);
  try {
    MF.state.tools = {};
    MF.state.yard = {};
    [{m:0,k:2},{m:0,k:3},{m:2,k:3},{m:1,k:-1}].forEach(MF.addToYard);
    MF.state.forge = {slots:[], picked:null};
    MF.SCREENS.forge(ipStage);
    var ipGrid = ipStage.querySelector('.forgegrid');
    chk('inplace');
    if(!ipGrid){ errs.push('inplace: the forge drew no grid to work in'); }
    else {
      var ipClick = function(el){ el.dispatchEvent(new MouseEvent('click',{bubbles:true})); };
      var ipFind = function(sel, re){
        return [].slice.call(ipStage.querySelectorAll(sel)).filter(function(n){
          return !re || re.test(n.textContent); })[0];
      };
      /* neuter MF.go for the duration and record anything that reaches for it */
      var ipReal = MF.go, ipWent = [];
      var ipWatch = function(label, act){
        ipWent = [];
        MF.go = function(n){ ipWent.push(n); };
        try { act(); } catch(e){ errs.push('inplace: ' + label + ' threw: ' + e.message); }
        MF.go = ipReal;
        chk('inplace');
        if(ipWent.length)
          errs.push('inplace: ' + label + ' called MF.go("' + ipWent[0] + '") — that rebuilds the whole screen, scrolls to the top, moves focus and replays the arrival wipe');
        chk('inplace');
        if(ipStage.querySelector('.forgegrid') !== ipGrid || !ipGrid.isConnected)
          errs.push('inplace: ' + label + ' replaced the forge grid instead of repainting into it');
      };
      ipWatch('picking an order',   function(){ ipClick(ipFind('.order[data-order="auger"]')); });
      ipWatch('dropping a metal',   function(){ var m = ipFind('.metalbtn', /2x \+ 3/); if(m) ipClick(m); });
      ipWatch('taking it back out', function(){ var c = ipFind('.crucible .ingot'); if(c) ipClick(c); });

      /* CONTROL: a handler that re-enters the screen must be caught. Wired the
         way the forge's own controls were until this commit. */
      chk('inplace');
      var ipBait = E('button','x'); ipBait.type='button';
      on(ipBait,'click',function(){ MF.go('forge'); });
      ipStage.appendChild(ipBait);
      ipWent = [];
      MF.go = function(n){ ipWent.push(n); };
      ipClick(ipBait);
      MF.go = ipReal;
      if(!ipWent.length)
        errs.push('CONTROL: the in-place check cannot see a control that re-enters the screen');
      ipStage.removeChild(ipBait);
    }
  } catch(e){
    chk('inplace');
    errs.push('inplace: the forge threw while being worked: ' + e.message);
  }
  document.body.removeChild(ipStage);
  MF.state.forge = ipSaved.forge; MF.state.yard = ipSaved.yard; MF.state.tools = ipSaved.tools;
  MF._forge = ipSaved.mine;

  /* 5k. THE INSTRUMENT PANEL, AND THE RULE THAT MAKES INSTRUMENTS LEGITIMATE.

         Two separate things are asserted here. First the panel behaves like a
         dialog: focus goes in, Escape closes it, focus comes back, and NOTHING
         IS LEFT IN THE DOM. A scrim left behind covers the whole page and
         makes every control dead - the same fault class that had the pick
         eating every click on the seam (§43), except page-wide.

         Second, and it is the one that matters: an instrument may say what is
         there, never what to swing. The Lantern says a seam still runs and
         must not say along what. A tool that named the factor would be doing
         the one thing the student came to do.

         READ THE DENOMINATOR: five readings across seven shapes of ore, and
         the leak check covers the LANTERN only - the Drill lists every pair by
         design, so the same assertion would be false for it. */
  var shSaved = {tools:MF.state.tools, sheet:MF._sheet};
  MF.closeTool();
  MF.state.tools = {lantern:{forged:true}, drill:{forged:true}, shifter:{forged:true},
                    dial:{forged:true}, pick:{forged:true}};
  var shOres = [{kind:'number',n:60},{kind:'number',n:31},{kind:'poly',a:1,b:-5,c:6},
                {kind:'poly',a:0,b:6,c:15},{kind:'poly',a:6,b:7,c:-3},
                {kind:'poly',a:1,b:0,c:4},{kind:'poly',a:0,b:1,c:3}];
  Object.keys(MF.TOOL_READ).forEach(function(tk){
    shOres.forEach(function(so){
      chk('sheet');
      var h = document.createElement('div');
      try { MF.TOOL_READ[tk](h, so); }
      catch(e){ errs.push('sheet: ' + tk + ' threw on ' + MF.oreText(so) + ': ' + e.message); return; }
      var txt = (h.textContent||'').replace(/\s+/g,' ').trim();
      if(txt.length < 25)
        errs.push('sheet: ' + tk + ' held to ' + MF.oreText(so) + ' said almost nothing (' + txt.length + ' chars)');
    });
  });

  /* THE LANTERN MUST NOT LEAK THE FACTORISATION */
  var lampLeak = function(reader){
    var hits = [];
    [[1,-5,6],[6,7,-3],[2,10,12],[1,0,-9]].forEach(function(t){
      var o = {kind:'poly',a:t[0],b:t[1],c:t[2]};
      var h = document.createElement('div');
      try { reader(h, o); } catch(e){ return; }
      var txt = (h.textContent||'').replace(/\s+/g,' ');
      var res = MF.smeltPoly(t[0],t[1],t[2]);
      (res.ingots||[]).forEach(function(g){
        if(g.m===0 && g.k===0) return;
        var s = ingotText(g);
        if(s.length > 1 && txt.indexOf(s) >= 0) hits.push(MF.oreText(o) + ' leaked "' + s + '"');
      });
    });
    return hits;
  };
  chk('sheet');
  var leaks = lampLeak(MF.TOOL_READ.lantern);
  if(leaks.length) errs.push('sheet: the lantern named the factor — ' + leaks[0]);
  /* CONTROL: a lantern that DID name it must be caught */
  chk('sheet');
  if(!lampLeak(function(h,o){
      h.appendChild(H('div','x','A seam runs, and it is ' + MF.smeltString(MF.smeltPoly(o.a,o.b,o.c)) + '.'));
    }).length)
    errs.push('CONTROL: the leak check cannot see a lantern that prints the factorisation');

  /* the panel itself: opens, focuses, closes on Escape, leaves nothing */
  var shHost = document.createElement('div');
  shHost.style.cssText = 'position:fixed; left:-9000px; top:0';
  document.body.appendChild(shHost);
  var shOpener = document.createElement('button');
  shHost.appendChild(shOpener);
  shOpener.focus();
  MF.openTool('lantern', {kind:'poly',a:1,b:-5,c:6}, shOpener);
  chk('sheet');
  if(!document.querySelector('.scrim .toolsheet')) errs.push('sheet: the panel did not open');
  chk('sheet');
  if(!(document.activeElement && document.activeElement.closest && document.activeElement.closest('.toolsheet')))
    errs.push('sheet: the panel opened without taking focus — a keyboard user is left on the page behind it');
  chk('sheet');
  var shd = document.querySelector('.toolsheet');
  if(!shd || shd.getAttribute('role')!=='dialog' || shd.getAttribute('aria-modal')!=='true')
    errs.push('sheet: the panel is not announced as a modal dialog');
  document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
  chk('sheet');
  if(document.querySelector('.scrim'))
    errs.push('sheet: Escape left the scrim in the DOM — it covers the page and every control under it is dead');
  chk('sheet');
  if(document.activeElement !== shOpener)
    errs.push('sheet: closing the panel did not hand focus back to what opened it');
  /* CONTROL: a scrim left behind must be detectable */
  chk('sheet');
  var ghostScrim = E('div','scrim');
  document.body.appendChild(ghostScrim);
  if(!document.querySelector('.scrim'))
    errs.push('CONTROL: the sheet check cannot see a scrim left covering the page');
  document.body.removeChild(ghostScrim);
  document.body.removeChild(shHost);
  MF.state.tools = shSaved.tools;
  MF.closeTool();

  /* 5i. EVERY CLICK ON A LUMP MUST BE ANSWERED.
         Three separate clicks in the mine used to produce nothing a student
         could see: the lump already selected (paintMine drew a picture
         identical to the one on screen), any lump at all during the 900ms of a
         swing (an early `return`), and the cart lump already on the bench (the
         change was real but below the fold). "It repainted to the same
         picture" is indistinguishable from "this control is not wired up", so
         the reaction is asserted in the DOM rather than trusted.

         READ THE DENOMINATOR: this sweeps clicks on seam rocks and on cart
         lumps. It says nothing about the shaft buttons, the bench, the yard or
         the forge, and nothing about whether the reaction looks any good. */
  var kSaved = {mine:MF._mine, layer:MF.state.layer, face:MF.state.face, fl:MF.state.faceLayer,
                insp:MF.state.inspecting, cart:MF.state.cart, sel:MF.state.selected,
                anvil:MF.state.anvil, brk:MF.state.breaking, scan:MF.state.scan, heap:MF.state.rockpile,
                knock:MF.knockRock};
  var kStage = document.createElement('div');
  kStage.style.cssText = 'position:fixed; left:-4000px; top:0; width:1100px';
  document.body.appendChild(kStage);
  var kRock = function(i){ return MF._mine.mid.querySelector('.face .rock[data-i="'+i+'"]'); };
  var kHalos = function(){ return MF._mine.mid.querySelectorAll('.face .taphalo').length; };
  var kHit = function(el){ el.dispatchEvent(new MouseEvent('click',{bubbles:true})); };
  var kHasCls = function(el, sel, cls){
    var n = el && el.querySelector(sel);
    return !!(n && n.classList.contains(cls));
  };
  try {
    MF._mine = null;
    MF.state.layer = 3; MF.state.face = []; MF.state.faceLayer = null;
    MF.state.inspecting = null; MF.state.breaking = false; MF.state.cart = [];
    MF.state.selected = null; MF.state.anvil = null;
    MF.SCREENS.mine(kStage);

    /* a bare repaint must leave no reaction behind, or every assertion below
       would pass on scenery rather than on the click */
    chk('knock');
    if(kHalos()) errs.push('knock: a freshly painted seam already carries a tap ring - the clicks below prove nothing');

    var r0 = kRock(0);
    chk('knock');
    if(!r0){ errs.push('knock: the seam painted no clickable lump at all'); }
    else {
      kHit(r0);
      chk('knock');
      if(!kHalos()) errs.push('knock: the first click on a lump left no reaction on the face');

      /* THE ONE THAT SHIPPED SILENT: clicking the lump you already picked out */
      MF.paintMine();                                   /* clear the previous answer */
      chk('knock');
      if(kHalos()) errs.push('knock: the repaint did not clear the previous reaction');
      kHit(kRock(0));
      chk('knock');
      if(!kHalos()) errs.push('knock: clicking the lump already selected repainted an identical face and answered nothing');
      chk('knock');
      if(!kHasCls(kRock(0),'.body','knock')) errs.push('knock: the lump itself did not take the knock');

      /* and a click that lands while a swing is in the air */
      MF.state.breaking = true;
      var r1 = kRock(1) || kRock(0);
      kHit(r1);
      chk('knock');
      if(!kHasCls(r1,'.body','refuse')) errs.push('knock: a click during a swing was swallowed without a word');
      chk('knock');
      if(MF.state.inspecting === 1) errs.push('knock: a click during a swing changed the selection - the answer must not be an action');
      MF.state.breaking = false;

      /* CONTROL: unwire the reaction and the same click must go undetected.
         Reintroducing the fault is the only proof the check can see it. */
      MF.knockRock = function(){};
      MF.paintMine();
      kHit(kRock(0));
      chk('knock');
      if(kHalos()) errs.push('CONTROL: the knock check reported a reaction with the reaction unwired');
      MF.knockRock = kSaved.knock;
    }

    /* 5j. NOTHING PAINTED OVER A CONTROL MAY TAKE ITS CLICK.
           The knock above was wired correctly and could not fire, because the
           pick follows the cursor with its HANDLE under the pointer and is
           painted after the rocks: hit-testing the centre of a lump returned
           the pick, never the rock. The same fault sat on the surface, where
           Mr Factor, the portal's dark mouth and the out-going cart all go on
           after the hotspots - so the blackest, most mine-looking part of the
           mine was the one place a click did nothing.

           This sweeps every element painted AFTER the first control in each
           scene, which is exactly the set that can occlude one. It does not
           look at anything painted behind a control, which cannot intercept
           it, and it says nothing about whether a control is big enough or in
           the right place - only that nothing is sitting on top of it. */
    var kOverlay = function(svgEl, controlSel){
      var out = [], started = false;
      Array.prototype.forEach.call(svgEl.querySelectorAll('*'), function(n){
        if(n.closest(controlSel)){ started = true; return; }   /* the control itself */
        if(!started) return;                                   /* painted behind it */
        chk('overlay');
        if(getComputedStyle(n).pointerEvents !== 'none')
          out.push('<' + n.tagName + ' class="' + (n.getAttribute('class')||'') + '">');
      });
      return out;
    };
    var seamSvg = MF._mine.mid.querySelector('.face svg');
    var overSeam = kOverlay(seamSvg, '.rock');
    chk('overlay');
    if(overSeam.length)
      errs.push('overlay: ' + overSeam.length + ' thing(s) painted over the lumps still take the click, first ' + overSeam[0]);

    var sProbe = MF.surfaceScene();
    kStage.appendChild(sProbe);
    var sceneSvg = sProbe.querySelector('svg');
    var overScene = kOverlay(sceneSvg, '.hot');
    chk('overlay');
    if(overScene.length)
      errs.push('overlay: ' + overScene.length + ' thing(s) painted over the buildings still take the click, first ' + overScene[0]);

    /* THE YARD IS DRAWN NOW, and its scenery is painted UNDER the rocks rather
       than over them - but it fills the whole panel, so if it were ever live to
       the mouse it would sit between a student and the heap. There is no
       control before it in document order, so the sweep is stated directly. */
    MF.state.rockpile = [{kind:'poly',a:1,b:5,c:6}, {kind:'number',n:30}];
    MF.paintMine();
    var yardSvg = MF._mine.right.querySelector('.yardart svg');
    chk('overlay');
    if(!yardSvg){ errs.push('overlay: the yard drew no scenery to check'); }
    else {
      var overYard = [];
      Array.prototype.forEach.call(yardSvg.querySelectorAll('*'), function(n){
        chk('overlay');
        if(getComputedStyle(n).pointerEvents !== 'none') overYard.push('<'+n.tagName+'>');
      });
      chk('overlay');
      if(overYard.length)
        errs.push('overlay: ' + overYard.length + ' piece(s) of yard scenery take the click, first ' + overYard[0]);
      /* CONTROL: the same scenery, live to the mouse, must be caught */
      chk('overlay');
      var yv = yardSvg.querySelector('rect');
      yv.style.pointerEvents = 'auto';
      if(getComputedStyle(yv).pointerEvents === 'none')
        errs.push('CONTROL: the yard sweep cannot see scenery that is live to the mouse');
      yv.style.pointerEvents = '';
    }
    /* and a rock on the heap must be reachable and must take you back to it */
    var hr = MF._mine.right.querySelector('.heaprock');
    chk('overlay');
    if(!hr) errs.push('overlay: the heap drew no rock to pick up');
    MF.state.rockpile = [];

    /* CONTROL: put the pick back in front of the mouse and the sweep must say so */
    var kVictim = seamSvg.querySelector('.pickarmhost');
    chk('overlay');
    if(!kVictim){ errs.push('overlay: the seam drew no pick, so the control has nothing to break'); }
    else {
      kVictim.style.pointerEvents = 'auto';
      if(!kOverlay(seamSvg, '.rock').length)
        errs.push('CONTROL: the overlay sweep did not catch the pick sitting live in front of the lumps');
      kVictim.style.pointerEvents = '';
    }

    /* a lump in the cart is ore too, and clicking the one already on the bench
       resets it to the assay - a real thing to have done, off-screen */
    var kRng = makeRng(4242);
    var kl = MF.digOre(3, kRng), kl2 = MF.digOre(3, kRng);
    if(kl && kl2){
      MF.state.cart = [kl, kl2]; MF.state.selected = kl; MF.state.anvil = null;
      MF.paintMine();
      var lumpEl = MF._mine.mid.querySelector('.lump[data-ore="'+kl.id+'"]');
      chk('knock');
      if(!lumpEl){ errs.push('knock: the cart drew no lump to click'); }
      else {
        kHit(lumpEl);
        var after = MF._mine.mid.querySelector('.lump[data-ore="'+kl.id+'"]');
        chk('knock');
        if(!(after && after.classList.contains('knock')))
          errs.push('knock: clicking the cart lump already on the bench answered nothing');
      }
    }
  } catch(e){
    chk('knock');
    errs.push('knock: the seam threw while being clicked: ' + e.message);
  }
  MF.knockRock = kSaved.knock;
  document.body.removeChild(kStage);
  MF._mine = kSaved.mine; MF.state.layer = kSaved.layer; MF.state.face = kSaved.face;
  MF.state.faceLayer = kSaved.fl; MF.state.inspecting = kSaved.insp; MF.state.cart = kSaved.cart;
  MF.state.selected = kSaved.sel; MF.state.anvil = kSaved.anvil; MF.state.breaking = kSaved.brk;
  MF.state.scan = kSaved.scan; MF.state.rockpile = kSaved.heap;

  /* 6. NOTHING ON SCREEN MAY HAVE A CEILING, A PERCENTAGE, OR A COMPARISON.
        This is a stated requirement, so it is checked mechanically rather
        than trusted (philosophy 2.5a). */
  var banned = /(\d+\s*(?:%|percent))|(\b\d+\s*(?:out of|\/)\s*\d+\b)|\b(score|scored|grade|graded|accuracy|rank|ranked|leaderboard|streak|correct answers)\b/i;
  ['home','workshop-mold','workshop-ore','mine','forge'].forEach(function(name){
    chk('nogrades');
    var probe = document.createElement('div');
    try { MF.SCREENS[name](probe); } catch(e){ errs.push('nogrades: screen '+name+' threw: '+e.message); return; }
    var txt = probe.textContent || '';
    var m = txt.match(banned);
    if(m) errs.push('nogrades: screen "'+name+'" contains "'+m[0]+'"');
  });

  /* 7. CONTROL - must fail, or none of the above is looking at anything */
  chk('control');
  var controlFailed = !(MF.smeltPoly(1,-5,6).kind === 'twin');   /* it is 'plain' */
  var bannedControl = banned.test('you scored 7 out of 10');      /* must be caught */
  if(!controlFailed)  errs.push('CONTROL: seam control did not fail - the instrument is not measuring');
  if(!bannedControl)  errs.push('CONTROL: the no-grades regex does not catch "7 out of 10"');

  /* hand the page back exactly as it was found */
  MF._mine = _liveMine;
  chk('selfharm');
  /* only meaningful ON the mine: elsewhere MF._mine legitimately refers to a
     screen that has been replaced, and paintMine guards for that. Asserting it
     unconditionally made the check fire on a perfectly normal state, which is
     how a check teaches you to ignore it. */
  if(_liveScreen === 'mine' && MF._mine && MF._mine.mid && !MF._mine.mid.isConnected)
    errs.push('selfharm: validate() left the live mine columns detached - the bench would render into a dead DOM and every click would silently do nothing');
  chk('selfharm');
  if(MF.state.screen !== _liveScreen)
    errs.push('selfharm: validate() changed which screen the student is on (' + _liveScreen + ' -> ' + MF.state.screen + ')');

  var out = {checked:checked, byGroup:counts, errors:errs.length,
             control: (controlFailed && bannedControl) ? 'both controls failed as required' : 'A CONTROL DID NOT FAIL',
             detail: errs.slice(0,20)};
  console.log('[mine] validate:', out.checked, 'checks,', out.errors, 'errors, control:', out.control);
  if(errs.length) console.warn(errs.slice(0,20));
  return out;
};

/* MF.playthrough() - drives a whole lump end to end without a human, so the
   loop itself is covered rather than only its parts. Reports its denominator. */
MF.playthrough = function(layer){
  layer = layer || 4;
  var log = [], rng = makeRng(99);
  MF.go('mine');
  var ore = MF.digOre(layer, rng);
  MF.state.cart.push(ore); MF.state.selected = ore; MF.state.anvil = null;
  MF.paintMine();
  var B = MF.state.anvil = MF.anvilInit(ore);
  log.push('ore: ' + MF.oreText(ore));
  var kind = MF.assayOf(ore);
  B.step = 'break'; log.push('assayed: ' + kind);

  /* SWING UNTIL NOTHING ON THE FLOOR CAN BE BROKEN. Each swing names one
     factor from the engine and drives it through the real UI path, so what is
     covered is the loop a student walks rather than the arithmetic alone. */
  var swings = 0, glances = 0;
  while(swings < 20){
    var at = -1;
    for(var i=0;i<B.floor.length;i++){ if(!MF.isNative(B.floor[i].ore)){ at=i; break; } }
    if(at < 0) break;
    var pc = B.floor[at].ore, one = null;
    if(pc.kind==='number') one = {m:0, k:primeFactors(pc.n)[0]};
    else {
      var pr = MF.smeltPoly(pc.a,pc.b,pc.c);
      one = (pr.ingots||[]).filter(function(g){
        return !(g.m===0&&g.k===0) && !(g.m===0&&Math.abs(g.k)===1); })[0];
    }
    if(!one){ log.push('nothing named for ' + MF.oreText(pc)); break; }
    B.at = at;
    B.raw = {m:String(one.m), k:String(one.k)};
    B.rawFor = B.floor[at].id;
    var before = B.floor.length;
    MF.swing(B);
    swings++;
    if(B.floor.length === before){ glances++; log.push('glanced off ' + MF.oreText(pc) + ' with ' + ingotText(one)); break; }
    log.push('swung ' + ingotText(one) + ' at ' + MF.oreText(pc) + ' -> ' +
             B.floor.map(function(p){ return MF.oreText(p.ore); }).join(' · '));
  }

  var floor = B.floor.map(function(p){ return p.ore; });
  var allNative = floor.every(MF.isNative);
  /* the pieces must still be the lump that was dug - the mine's whole claim */
  var acc = {kind:'number', n:1}, blew = false;
  floor.forEach(function(pc2){
    if(blew) return;
    var mm = MF.oreMul(acc, pc2);
    if(mm.overflow){ blew = true; return; }
    acc = MF.asOre(mm.a, mm.b, mm.c);
  });
  var whole = !blew && MF.oreSame(MF.oreMul(acc, {kind:'number',n:1}), ore);
  log.push('floor: ' + floor.map(MF.oreText).join(' · ') + (allNative ? ' - ALL NATIVE' : ' - STILL ROCK'));
  log.push(whole ? 'the pieces rebuild the lump' : 'THE PIECES DO NOT REBUILD THE LUMP');
  MF.paintMine();
  return {ore:MF.oreText(ore), kind:kind, swings:swings, glances:glances,
          native:allNative, whole:whole, log:log, steps:log.length};
};

/* =========================================================================
   BOOT
   ========================================================================= */
MF.boot = function(){
  var motes = MF.ambient();
  q('#hero-art').appendChild(MF.art(46));
  MF.loadScreen();
  MF.go('home');
  console.log('[mine] booted:', MF.LAYERS.length, 'layers,', motes, 'motes');
  return {layers:MF.LAYERS.length, motes:motes};
};
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', MF.boot);
else MF.boot();
</script>
