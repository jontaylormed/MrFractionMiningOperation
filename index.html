  }
  /* sleepers and rails */
  for(var t=0;t<30;t++) R(t*21+3,66,13,5,'#5A4B3C',{rx:'1'});
  R(0,64,W,3,'#8A9AA6',{opacity:'.85'});
  R(0,73,W,3,'#8A9AA6',{opacity:'.6'});
  R(0,78,W,8,'#241C15');

  /* the cart: an outer group carries the roll, an inner one the jolt, and the
     wheels spin on their own mounts - none of them owns a transform attribute */
  var roll = S('g',{class:'ct-cart'});
  var jolt = S('g',{class:'ct-jolt'});
  jolt.appendChild(S('path',{d:'M0 30 L74 30 L66 62 L8 62 Z',fill:'#5A6570',stroke:'#39424B','stroke-width':'2'}));
  jolt.appendChild(S('rect',{x:'-3',y:'24',width:'80',height:'9',rx:'3',fill:'#8A9AA6'}));
  jolt.appendChild(S('path',{d:'M8 62 L66 62 L64 66 L10 66 Z',fill:'#39424B'}));
  /* ore heaped above the rim */
  [[16,20,9],[30,15,11],[46,18,10],[58,22,8],[38,24,9]].forEach(function(o){
    jolt.appendChild(S('path',{d:'M'+o[0]+' '+(o[1]+o[2])+
      ' l'+(o[2]*0.3)+' -'+o[2]+' l'+(o[2]*0.8)+' -'+(o[2]*0.2)+' l'+(o[2]*0.5)+' '+(o[2]*0.9)+' Z',
      fill:(o[2]>9?'#8A7358':'#6E5A45')}));
  });
  jolt.appendChild(S('circle',{cx:'34',cy:'18',r:'3.4',fill:'#C8A24B'}));
  roll.appendChild(jolt);
  [[18,66],[56,66]].forEach(function(w){
    var mount = S('g',{transform:'translate('+w[0]+','+w[1]+')'});
    var wheel = S('g',{class:'ct-wheel'});
    wheel.appendChild(S('circle',{cx:'0',cy:'0',r:'8',fill:'#2E353C',stroke:'#6E7A86','stroke-width':'2'}));
    wheel.appendChild(S('rect',{x:'-1.5',y:'-8',width:'3',height:'16',fill:'#6E7A86'}));
    wheel.appendChild(S('rect',{x:'-8',y:'-1.5',width:'16',height:'3',fill:'#6E7A86'}));
    mount.appendChild(wheel);
    roll.appendChild(mount);
  });
  svg.appendChild(roll);

  wrap.appendChild(svg);
  return wrap;
};

/* =========================================================================
   THE SEAM IS ROCK ALL THE WAY UP AND ALL THE WAY DOWN.

   USER, 2026-09-04: "The Layer window should be filled with illustrated rock
   and ore textures. The blank spaces on the top and bottom of the layer need
   to be redesigned."

   The window was a vertical gradient with nine strata lines and 220 grit dots
   across 2900 x 360 units - so the top 40 and the bottom 60 held nothing at
   all, and the middle held a flat wash with lumps floating in it. It read as a
   backdrop rather than as the inside of a mine.

   What is drawn here, back to front:

     the JOINTING   - big low-contrast blocks, the way rock actually breaks
     the STRINGERS  - ore threaded through the wall, which is what makes it a
                      SEAM. Deliberately dim: these are not breakable, and a
                      bright thread would compete with the lumps that are.
     the ROOF       - a hanging wall with a ragged edge and points coming down
                      off it, ore glinting in it, and drips
     the FLOOR      - a ragged sill with a muck pile of broken chunks along it,
                      flecked with ore, and a dark bottom band

   THREE THINGS IT HAD TO BE BUILT AROUND:

   1. IT MUST NOT TAKE A CLICK. `overlay` sweeps this svg for anything live
      sitting in front of the lumps (VERIFICATION s52) - the fault it exists
      for is the pick eating every click on the seam. This is one group, it is
      appended BEFORE the lumps, and it carries pointer-events:none.

   2. IT MUST NOT MOVE ON A REPAINT. `MF.paintFace` runs on every `paintMine`,
      which is every click anywhere in the mine, so a texture drawn from
      `Math.random` would reshuffle the whole wall each time. It is seeded off
      the LAYER.

   3. AND IT MUST NOT DRAW FROM `MF.state.rng`. That is the ore stream. Taking
      numbers out of it here would change which lumps get dug, and the `seam`
      and `native` groups would start disagreeing with themselves between runs
      for reasons nothing in the file explains.
   ========================================================================= */
/* a flat tint of a hex colour: f < 1 darkens, f > 1 lightens */
function sh(hex, f){
  var m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
  if(!m) return hex;
  var c = [1,2,3].map(function(i){
    return Math.max(0, Math.min(255, Math.round(parseInt(m[i],16) * f)));
  });
  return '#' + c.map(function(v){ return ('0'+v.toString(16)).slice(-2); }).join('');
}

MF.seamRock = function(svg, W, VH, look, layer){
  var g = S('g',{class:'seamtex','aria-hidden':'true'});
  g.style.pointerEvents = 'none';
  var rng = makeRng(9000 + layer * 31);
  var P = function(pts, attrs){
    var n = S('polygon', {points: pts.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ')});
    for(var k in attrs) n.setAttribute(k, attrs[k]);
    g.appendChild(n); return n;
  };
  /* an irregular closed shape around (cx,cy) - one call draws every block,
     chunk and stone in here, so no two are the same silhouette twice */
  var blob = function(cx, cy, r, sides, wob){
    var pts = [], rot = rng() * Math.PI * 2;
    for(var i=0;i<sides;i++){
      var a = rot + i * (Math.PI*2/sides) + (rng()-0.5) * 0.4;
      var rr = r * (1 - wob/2 + rng() * wob);
      pts.push([cx + rr*Math.cos(a), cy + rr*Math.sin(a)]);
    }
    return pts;
  };

  var dark = sh(look.rock2, 0.72), darker = sh(look.rock2, 0.5),
      lite = sh(look.rock, 1.14), mid = sh(look.rock, 0.9);

  /* ---- THE JOINTING: how the rock is broken up, behind everything ---- */
  for(var b=0; b<Math.round(W/86); b++){
    var bx = rng() * W, by = 40 + rng() * (VH - 110), br = 46 + rng() * 96;
    P(blob(bx, by, br, 4 + Math.floor(rng()*3), 0.5), {
      fill: rng() < 0.5 ? lite : darker, opacity: (0.10 + rng()*0.09).toFixed(2),
      stroke: darker, 'stroke-width':'2', 'stroke-opacity':'.3','stroke-linejoin':'round'});
  }
  /* joint cracks running down through it */
  for(var c=0; c<Math.round(W/58); c++){
    var jx = rng() * W, jy = 44 + rng() * (VH - 130), d = 'M'+jx.toFixed(1)+' '+jy.toFixed(1);
    var segs = 2 + Math.floor(rng()*3);
    for(var s2=0; s2<segs; s2++)
      d += ' l' + ((rng()-0.5)*22).toFixed(1) + ' ' + (12 + rng()*26).toFixed(1);
    g.appendChild(S('path',{d:d, fill:'none', stroke:darker, 'stroke-width':(1.4+rng()*1.4).toFixed(1),
      opacity:(0.22+rng()*0.2).toFixed(2), 'stroke-linecap':'round'}));
  }

  /* ---- THE STRINGERS: ore threaded through the wall ----
     This is what makes it a SEAM rather than a wall of stone. They are dim on
     purpose: a stringer is not breakable and a bright one would compete with
     the lumps that are. */
  for(var v=0; v<Math.round(W/190); v++){
    var vx = rng() * W, vy = 52 + rng() * (VH - 150);
    var dv = 'M'+vx.toFixed(1)+' '+vy.toFixed(1), px = vx, py = vy;
    var run = 3 + Math.floor(rng()*3);
    for(var q=0;q<run;q++){
      var nx = px + 40 + rng()*90, ny = py + (rng()-0.5)*44;
      dv += ' Q'+((px+nx)/2).toFixed(1)+' '+(py + (rng()-0.5)*40).toFixed(1)+
            ' '+nx.toFixed(1)+' '+ny.toFixed(1);
      px = nx; py = ny;
    }
    g.appendChild(S('path',{d:dv, fill:'none', stroke:look.ore, 'stroke-width':(2+rng()*2.4).toFixed(1),
      opacity:(0.2+rng()*0.16).toFixed(2), 'stroke-linecap':'round'}));
  }

  /* ---- THE ROOF: the hanging wall, and what comes down off it ---- */
  var edge = [[0,0],[W,0]], rx = W, ry;
  for(var e=W; e>=0; e-=74){
    ry = 22 + rng() * 30;
    edge.push([e, ry]);
  }
  edge.push([0, 30]);
  P(edge, {fill:dark, stroke:darker, 'stroke-width':'3','stroke-linejoin':'round'});
  /* a lit lip just under the break, so the roof has a near edge */
  var lip = 'M0 30';
  for(var lx=0; lx<W; lx+=74) lip += ' q37 '+((lx/74)%2?7:-6)+' 74 '+((lx/74)%3===0?4:-3);
  g.appendChild(S('path',{d:lip, fill:'none', stroke:lite, 'stroke-width':'3', opacity:'.28'}));
  /* points hanging down off it */
  for(var pt=0; pt<Math.round(W/104); pt++){
    var tx = rng() * W, tw = 7 + rng()*15, th = 12 + rng()*32, ty = 24 + rng()*18;
    P([[tx-tw, ty],[tx+tw, ty-3],[tx + (rng()-0.5)*8, ty+th]],
      {fill:dark, stroke:darker,'stroke-width':'2.5','stroke-linejoin':'round'});
  }
  /* ore in the roof, and water off it */
  for(var ro=0; ro<Math.round(W/150); ro++){
    var ox = rng()*W, oy = 8 + rng()*22;
    g.appendChild(S('path',{d:'M'+ox.toFixed(1)+' '+oy.toFixed(1)+' q'+(14+rng()*16).toFixed(1)+' '+
      ((rng()-0.5)*10).toFixed(1)+' '+(30+rng()*26).toFixed(1)+' '+((rng()-0.5)*8).toFixed(1),
      fill:'none', stroke:look.ore,'stroke-width':'3','stroke-linecap':'round', opacity:'.5'}));
  }
  for(var dr=0; dr<Math.round(W/230); dr++)
    g.appendChild(S('ellipse',{cx:(rng()*W).toFixed(1), cy:(38+rng()*16).toFixed(1),
      rx:'2.2', ry:'3.4', fill:look.glint, opacity:'.32'}));

  /* ---- THE FLOOR: the sill, the muck, and the dark under it ---- */
  var sill = [[0,VH],[W,VH]], sy;
  for(var f2=W; f2>=0; f2-=88){
    sy = VH - 30 - rng() * 26;
    sill.push([f2, sy]);
  }
  sill.push([0, VH-38]);
  P(sill, {fill:dark, stroke:darker,'stroke-width':'3','stroke-linejoin':'round'});
  /* the muck: broken rock along the sill, which is where a face ends up */
  for(var mk=0; mk<Math.round(W/34); mk++){
    var mx = rng()*W, mr = 8 + rng()*17, my = VH - 34 - rng()*20;
    var tone = rng();
    P(blob(mx, my, mr, 5 + Math.floor(rng()*3), 0.44), {
      fill: tone < 0.34 ? mid : (tone < 0.7 ? look.rock2 : dark),
      stroke: darker, 'stroke-width':'2.5','stroke-linejoin':'round'});
    /* a third of them still have something in them */
    if(rng() < 0.34)
      g.appendChild(S('circle',{cx:(mx + (rng()-0.5)*mr).toFixed(1), cy:(my + (rng()-0.5)*mr).toFixed(1),
        r:(1.8+rng()*2.2).toFixed(1), fill:look.ore, opacity:'.85'}));
  }
  g.appendChild(S('rect',{x:0, y:VH-11, width:W, height:11, fill:sh(look.rock2, 0.4)}));

  svg.appendChild(g);
};

/* ---------- the face: look, choose, break ---------- */
MF.paintFace = function(){
  var host = clear(MF._mine.mid);
  var L = MF.LAYERS[MF.state.layer-1];
  var look = MF.LAYER_LOOK[MF.state.layer-1];
  var rocks = MF.stockFace();

  var wall = E('div','wall');
  wall.style.background = 'linear-gradient(180deg,'+look.rock+','+look.rock2+')';
  wall.appendChild(H('h3',null,'Layer ' + L.n + ' &mdash; ' + L.name));
  wall.appendChild(H('div','depthline', 'The ore here is ' + L.what + '. Look one over before you swing &mdash; nothing breaks until you say so.'));

  /* the viewport scrolls; the seam inside it is far wider than the screen */
  var faceBox = E('div','face seamview');
  var W=MF.SEAM_W, VH=MF.SEAM_H;
  var svg = S('svg',{viewBox:'0 0 '+W+' '+VH,role:'group',
    'aria-label':'A seam of rock at layer '+L.n+', wider than the screen. Scroll or use the scan buttons to move along it.'});
  /* THE SVG IS SIZED AFTER THE WALL IS MOUNTED, by MF.sizeSeam - it takes its
     height from the space the flex column gives it, and that is not knowable
     until it is in the document. MF.SEAM_ZOOM is the fallback for a detached
     probe, and the floor. */
  svg.style.maxWidth = 'none';

  var defs = S('defs',{});
  var g1 = S('linearGradient',{id:'wallg'+L.n,x1:'0',y1:'0',x2:'0',y2:'1'});
  g1.appendChild(S('stop',{offset:'0%','stop-color':look.rock}));
  g1.appendChild(S('stop',{offset:'100%','stop-color':look.rock2}));
  defs.appendChild(g1); svg.appendChild(defs);
  svg.appendChild(S('rect',{x:0,y:0,width:W,height:VH,fill:'url(#wallg'+L.n+')'}));

  /* strata - the rock itself changes with depth, and runs the seam's length */
  for(var s=0;s<9;s++){
    var yy = 14 + s*27 + ((s*11)%9);
    /* strata repeat along the whole length so the seam never looks like it ends */
    var d = 'M0 '+yy;
    for(var seg=0; seg<W; seg+=260){
      d += ' q130 '+((seg/260)%2 ? 9 : -9)+' 260 '+((seg/260)%3===0 ? 3 : -2);
    }
    svg.appendChild(S('path',{d:d, fill:'none', stroke:look.strata,
      'stroke-width':(s%3===0?3:1.6), opacity:'.5'}));
  }
  for(var gq=0;gq<220;gq++){
    svg.appendChild(S('circle',{cx:(gq*173)%W, cy:(gq*53)%VH, r:1+((gq*7)%3), fill:look.grit, opacity:'.45'}));
  }

  /* THE ROCK ITSELF: jointing, ore stringers, the hanging wall and the muck.
     Appended BEFORE the lumps, and inert - `overlay` sweeps this svg for
     anything live sitting in front of a control, and it is the group that
     caught the pick eating every click on the seam. */
  MF.seamRock(svg, W, VH, look, L.n);

  /* the rocks */
  rocks.forEach(function(o, idx){
    var g = S('g',{class:'rock',tabindex:'0',role:'button','data-i':idx,
      'aria-label':'A lump of ore: ' + MF.oreText(o) + '. Look at it, then break it.'});
    if(MF.state.inspecting===idx) g.setAttribute('data-sel','on');
    var x=o.px, y=o.py, r=o.sz;
    var sel = S('circle',{class:'sel',cx:x,cy:y,r:r+9,fill:'none',stroke:'#E8A33D','stroke-width':'3','stroke-dasharray':'6 5'});
    g.appendChild(sel);
    var body = S('g',{class:'body'});
    var pts = [];
    var faces = o.faces || [0.9,0.8,1,0.85,0.95,0.8,0.9];
    for(var k=0;k<faces.length;k++){
      var ang = (o.rot||0) + k*(Math.PI*2/faces.length);
      var rad = r * faces[k];
      pts.push((x+rad*Math.cos(ang)).toFixed(1)+','+(y+rad*Math.sin(ang)).toFixed(1));
    }
    body.appendChild(S('polygon',{points:pts.join(' '),fill:look.rock,stroke:look.rock2,'stroke-width':'3'}));
    /* ore veins inside: one streak per term, so a rock LOOKS like what it is */
    var terms = (o.kind==='number') ? 1 : [o.a,o.b,o.c].filter(function(v){ return v!==0; }).length;
    for(var t=0;t<terms;t++){
      body.appendChild(S('path',{d:'M'+(x-r*0.6)+' '+(y-r*0.3+t*7)+' q'+(r*0.5)+' '+(t%2?6:-6)+' '+(r*1.2)+' '+(t%2?-3:3),
        fill:'none',stroke:look.ore,'stroke-width':'3','stroke-linecap':'round',opacity:'.92'}));
    }
    body.appendChild(S('circle',{class:'glint',cx:x-r*0.34,cy:y-r*0.38,r:'3.4',fill:look.glint}));
    g.appendChild(body);
    /* not while a swing is in the air: rebuilding the face mid-break orphaned
       the shatter, threw the pick across the seam, and wiped the selection the
       student was reading. breaking guarded breakRock but not inspection. */
    /* NOT named `look`. A function declaration is hoisted to the top of its
       enclosing scope, so `function look()` here shadowed the outer `look`
       palette for the whole callback - look.rock, look.ore and look.glint all
       became undefined and every rock painted solid black. The seam looked
       like its ore had failed to render, and nothing threw. */
    function inspectThis(){
      /* A SWING IN THE AIR MUST NOT BE INTERRUPTED - BUT IT MUST STILL ANSWER.
         This used to `return` on the spot, so during the 900ms of a break every
         rock on the face was a control that did nothing and said nothing. */
      if(MF.state.breaking){ MF.knockRock(g, o, true); return; }
      MF.selectRock(idx);
    }
    on(g,'click',inspectThis);
    on(g,'keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); inspectThis(); } });
    svg.appendChild(g);
  });

  /* The pick stands beside whichever lump is being looked at, not parked at a
     fixed spot - on a seam this wide a fixed pick would usually be off-screen
     when the swing happened, so the student would never see it land. */
  var target = (MF.state.inspecting!=null && rocks[MF.state.inspecting]) ? rocks[MF.state.inspecting] : null;
  var pickX = target ? Math.min(W-110, Math.max(10, target.px + target.sz + 16)) : (W-104);
  var pickY = target ? Math.min(VH-100, Math.max(4, target.py - 40)) : (VH-96);
  /* style.transform, not the attribute, so it can be eased as the pick follows
     the cursor along the face */
  var pick = S('g',{});
  pick.style.transform = 'translate('+pickX+'px,'+pickY+'px)';
  pick.style.transition = 'transform .16s ease-out';
  var arm = S('g',{class:'pickarmhost'});
  /* handle, then a proper double-ended pick head: two tapered points curving
     down from a thick centre. The first attempt drew a grey fan. */
  arm.appendChild(S('rect',{x:'40',y:'10',width:'9',height:'92',rx:'3',fill:'#8A6A45'}));
  arm.appendChild(S('rect',{x:'38',y:'44',width:'13',height:'7',rx:'2',fill:'#6B5335'}));
  arm.appendChild(S('path',{d:'M2 26 q20 -20 42 -16 q22 -4 42 16 q-6 4 -12 3 q-16 -11 -30 -9 q-14 -2 -30 9 q-6 1 -12 -3 Z',
    fill:'#9AA3AB',stroke:'#4A5158','stroke-width':'2','stroke-linejoin':'round'}));
  arm.appendChild(S('rect',{x:'36',y:'6',width:'17',height:'10',rx:'3',fill:'#5A626A'}));
  pick.appendChild(arm);
  svg.appendChild(pick);
  MF._pickArm = arm;

  /* THE PICK FOLLOWS THE CURSOR while it is over the face - you are holding it
     while you look the seam over, and it goes back to standing beside the lump
     you picked out when the pointer leaves. */
  function pickHome(){
    pick.style.transform = 'translate('+pickX+'px,'+pickY+'px)';
  }
  on(faceBox,'pointermove',function(e){
    if(MF.state.breaking) return;
    var r = svg.getBoundingClientRect();
    if(!r.width) return;
    var scale = W / r.width;
    var ux = (e.clientX - r.left) * scale;
    var uy = (e.clientY - r.top) * scale;
    var nx = Math.max(6, Math.min(W-108, ux - 46));
    var ny = Math.max(2, Math.min(VH-104, uy - 62));
    pick.style.transform = 'translate('+nx+'px,'+ny+'px)';
  });
  on(faceBox,'pointerleave',function(){ if(!MF.state.breaking) pickHome(); });

  faceBox.appendChild(svg);
  /* THE SEAM GETS A WRAPPER SO SOMETHING CAN SIT OVER IT.
     `.facewrap` is position:relative and nothing else; the pop-out that opens
     when a lump is picked out is absolutely positioned inside it, so it
     overlays the wall instead of being appended under it (MINE-SPEC §33). It
     is OUTSIDE `faceBox`, which is the horizontal scroller - a child of the
     scroller would be clipped by it and would scroll away from the student. */
  var faceWrap = E('div','facewrap');
  faceWrap.appendChild(faceBox);
  wall.appendChild(faceWrap);

  /* ---- scanning along the seam ---- */
  var scanRow = E('div','row'); scanRow.style.marginTop='10px'; scanRow.style.alignItems='center';
  function scanBtn(label, dir){
    var b = E('button','btn', label); b.type='button';
    b.style.background='#241D18'; b.style.color='#E4D5BB'; b.style.borderColor='#6B5B48';
    on(b,'click',function(){ faceBox.scrollBy({left: dir * Math.round(faceBox.clientWidth*0.8), behavior:'smooth'}); });
    return b;
  }
  scanRow.appendChild(scanBtn('◀ scan back', -1));
  scanRow.appendChild(scanBtn('scan along ▶', 1));
  var posWrap = E('div'); posWrap.style.flex='1 1 160px'; posWrap.style.minWidth='140px';
  posWrap.appendChild(H('div','hint','Where you are along the seam'));
  var track = E('div');
  track.style.cssText='height:10px;border-radius:999px;background:#241D18;border:2px solid #6B5B48;position:relative;overflow:hidden';
  var marker = E('div');
  marker.style.cssText='position:absolute;top:0;bottom:0;width:26%;background:var(--lamp);border-radius:999px;transition:left .12s linear';
  track.appendChild(marker); posWrap.appendChild(track);
  scanRow.appendChild(posWrap);
  /* scanRow is built here but NOT appended here - it goes on after the inspect
     panel below, so what you are looking at sits directly under the rock and
     the seam navigation follows it. (Appending `insp` at this point referenced
     a variable declared 40 lines further down: hoisted, undefined, and it threw
     - which emptied the whole middle column. CLAUDE.md rule 1.) */

  /* keep the position marker honest as the student scrolls or drags */
  function syncMarker(){
    var max = Math.max(1, faceBox.scrollWidth - faceBox.clientWidth);
    var frac = faceBox.scrollLeft / max;
    var vis = faceBox.clientWidth / Math.max(1, faceBox.scrollWidth);
    marker.style.width = Math.max(8, vis*100).toFixed(1) + '%';
    marker.style.left = (frac * (100 - Math.max(8, vis*100))).toFixed(1) + '%';
    MF.state.scan = faceBox.scrollLeft;
  }
  on(faceBox,'scroll',function(){
    syncMarker();
    /* THE POP-OUT FOLLOWS THE ROCK IT IS ABOUT. It is pinned to the wrapper,
       not to the scroller, so scanning would otherwise leave it hanging over
       a stone that is no longer there. It is re-placed on every scroll, and
       when the rock leaves the window the panel goes with it - the question
       "swing this one?" is meaningless about something off screen. */
    if(MF._face && MF._face.insp && !MF._face.insp.hidden){
      var rn = MF.state.inspecting == null ? null
             : MF._face.svg.querySelector('.rock[data-i="' + MF.state.inspecting + '"]');
      var vb = faceBox.getBoundingClientRect();
      var rr = rn && rn.getBoundingClientRect();
      if(!rr || rr.right < vb.left + 8 || rr.left > vb.right - 8) MF.selectRock(null);
      else MF.placeInspect();
    }
  });

  /* drag to scan. A rock click still works because a drag under a few pixels
     is not treated as a drag at all. */
  var dragging=false, startX=0, startLeft=0, moved=0;
  on(faceBox,'pointerdown',function(e){
    dragging=true; moved=0; startX=e.clientX; startLeft=faceBox.scrollLeft;
    faceBox.style.scrollBehavior='auto';
  });
  on(faceBox,'pointermove',function(e){
    if(!dragging) return;
    var dx = e.clientX - startX;
    moved = Math.max(moved, Math.abs(dx));
    if(moved > 4){ faceBox.scrollLeft = startLeft - dx; }
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    on(faceBox,ev,function(){ dragging=false; faceBox.style.scrollBehavior='smooth'; });
  });
  on(faceBox,'click',function(e){ if(moved>4){ e.stopPropagation(); e.preventDefault(); moved=0; } }, true);
  host.appendChild(wall);

  /* PUT THEM BACK WHERE THEY WERE, AND DO NOT MOVE THEM FOR CLICKING.

     USER, 2026-09-05: "When I click on the layer tool, it forcibly moves the
     screen, which makes the webpage feel jerky and not smooth."

     This block used to CENTRE the seam on whichever lump was selected, on
     every paint. Measured: scanning 1400px along the seam and clicking a lump
     that was plainly on screen snapped the seam back to 0 and threw the lump
     the student had just clicked 1400px sideways, out from under their cursor.
     A control that moves the thing you aimed at is worse than one that does
     nothing.

     Two rules now. The scroll position is RESTORED, always - it belongs to the
     student, not to the paint. And the seam only moves when the lump being
     looked at is genuinely NOT ON SCREEN, which happens when the selection was
     changed by something other than a click on a visible rock; then it eases
     rather than jumping, because `.seamview` carries scroll-behavior:smooth
     and this is the one case where movement is the point.

     `scrollBehavior='auto'` for the restore itself: a freshly built box being
     put back where it was is not a journey, and animating it from 0 is exactly
     the lurch this is here to stop. */
  /* THE SIZING AND THE SCROLL BOTH HAPPEN AT THE END OF THE PAINT, in
     MF.fitSeam - not here. Everything below this line still has to be appended
     to the wall, and the scan row alone is 71px: sized at this point the seam
     took a height the wall was about to take back off it, and 71px of the
     floor was clipped. Measure last, when the box is finished. */
  MF._seamView = faceBox;

  /* ---- inspect, then break: A POP-OUT OVER THE WALL, NOT A PANEL UNDER IT ----

     USER, 2026-09-05: "When you click on the ore on the layer, there should be
     a pop out window asking to swing or keep scanning. This pop out window
     should be overlaid the layer window not popping below it."

     It lives in `.facewrap`, over the seam. It is hidden until a lump is picked
     out, so nothing below it moves when it opens - which is the whole of "not
     popping below it": the panel used to be a block in the flow, so opening it
     pushed the scan row, the cart and everything under them down the page. */
  var insp = E('div','inspect inspectpop');
  insp.hidden = true;
  insp.setAttribute('role','dialog');
  insp.setAttribute('aria-label','What you are looking at, and what to do with it');
  faceWrap.appendChild(insp);
  wall.appendChild(scanRow);          /* seam navigation, below what it acts on */

  /* WHAT THE LIGHT PATH NEEDS, so a selection does not rebuild the seam.
     `rocks` is MF.state.face, which survives; the rest are live nodes. */
  MF._face = {box:faceBox, svg:svg, insp:insp, wrap:faceWrap, pick:pick,
              rocks:rocks, W:W, VH:VH, target:target, sync:syncMarker};
  /* NOW the wall is finished, so now the window's height is what it will be */
  MF.fitSeam();
  MF.paintInspect();
};

/* =========================================================================
   THE LAYER IS AS BIG AS THE SPACE IT IS GIVEN.

   USER, 2026-09-05: "In the mine, the layer needs to be the same size as the
   shaft."

   Both columns were already stretched to one row height - 982px at 1250px -
   and measuring showed the mismatch was inside: the seam window was a fixed
   563px, leaving 264px of empty rock panel under it while the shaft was full
   to the bottom. Two boxes the same height, one of them two-thirds empty.

   So the zoom is DERIVED rather than declared. The wall's flex column hands
   the window a height; both axes come off that one number, which is the rule
   s28 established after the letterbox - only now the number is measured
   instead of written down, and it follows the shaft because the shaft is what
   sets the row.

   IT IS MORE SEAM, NOT MORE ZOOM, up to a point: the cap keeps a lump the size
   a lump has been, so a tall shaft buys face to scan rather than magnification.
   Past the cap the extra height goes back to the wall as padding, which is
   honest - a 4x lump would be a different design, not a taller one.
   ========================================================================= */
/* NO UPPER CAP ON THE ZOOM, and there was one for a day.
   A cap above the window's own height means the drawing is TALLER than the box
   it is in, and `overflow-y:hidden` clips the difference: at 2.35 the seam came
   out 846px in an 803px window and 43px of the floor - the muck, the ore
   flecks, the dark sill - was cut off. The zoom IS the window height over the
   viewBox height; a cap on it is a cap on nothing but honesty. What stops the
   lumps growing without limit is the shaft, which is what sets the row. */
MF.sizeSeam = function(box){
  /* THE CALLER HANDS IN THE BOX WHEN IT HAS ONE. `MF._face` is not assigned
     until the end of MF.paintFace, so during a paint it still points at the
     PREVIOUS window - which has just been discarded, fails `isConnected`, and
     made this return null every time. The seam then sat at the svg's CSS
     default: full width, height from the aspect, 116px tall. */
  var F = MF._face;
  box = box || (F && F.box) ||
        (MF._mine && MF._mine.mid && MF._mine.mid.querySelector('.seamview'));
  if(!box || !box.isConnected) return null;
  var svg = box.querySelector('svg');
  if(!svg) return null;
  /* clientHeight is what the flex column assigned, and it does NOT include the
     drawing: `overflow-y:hidden` means a tall svg cannot push it out. That is
     what stops this being circular. */
  var avail = box.clientHeight;
  /* NO FLOOR ON THE ZOOM EITHER, for the same reason there is no cap: a floor
     above what the window can show is a floor on clipping. The 1.505 minimum
     put a 542px drawing in a 537px box on a phone and cut 5px off the muck.
     The floor that is wanted is a floor on the WINDOW - `min-height:542px` on
     `.facewrap` - and that one is in the stylesheet where it can be honoured.
     MF.SEAM_ZOOM survives as the fallback for a box with no layout at all. */
  var zoom = (avail > 80) ? (avail / MF.SEAM_H) : MF.SEAM_ZOOM;
  var pxH = Math.round(MF.SEAM_H * zoom), pxW = Math.round(MF.SEAM_W * zoom);
  svg.setAttribute('width', pxW);
  svg.setAttribute('height', pxH);
  svg.style.width = pxW + 'px';
  svg.style.height = pxH + 'px';
  return {zoom:zoom, w:pxW, h:pxH, avail:avail};
};

/* SIZE THE ROCK, THEN PUT THE SCROLL BACK, THEN CHASE THE LUMP IF IT IS OFF
   SCREEN. One function, called at the END of a paint and again on a resize,
   because all three steps depend on the window being its final size and the
   scroll restore reads the width the sizing sets.

   THE SCROLL POSITION BELONGS TO THE STUDENT, NOT TO THE PAINT (§32): it is
   restored every time, without animation - a freshly built box being put back
   where it was is not a journey. The seam only MOVES when the lump being
   looked at is genuinely off screen, and then it eases, because that is the
   one case where movement is the point. */
MF.fitSeam = function(){
  var F = MF._face;
  if(!F || !F.box || !F.box.isConnected) return null;
  var box = F.box, got = MF.sizeSeam(box);
  box.style.scrollBehavior = 'auto';
  box.scrollLeft = MF.state.scan || 0;
  box.style.scrollBehavior = '';
  var target = F.target;
  if(target){
    var tLeft = (target.px / F.W) * box.scrollWidth;
    var pad = Math.max(60, target.sz * (box.scrollWidth / F.W) + 40);
    if(tLeft < box.scrollLeft + pad || tLeft > box.scrollLeft + box.clientWidth - pad){
      var wantLeft = Math.max(0, tLeft - box.clientWidth / 2);
      box.scrollLeft = wantLeft;             /* smooth, per the stylesheet */
      MF.state.scan = wantLeft;
    }
  }
  if(F.sync) F.sync();
  return got;
};

/* AND IT FOLLOWS THE WINDOW WHEN THE WINDOW CHANGES. The height comes from the
   shaft, which comes from the grid, which comes from the viewport - so a
   resize that changes the row changes what the seam should be drawn at.
   Debounced, because resize fires continuously and this reads layout. */
MF._seamFit = null;
on(window,'resize',function(){
  if(MF._seamFit) clearTimeout(MF._seamFit);
  MF._seamFit = setTimeout(function(){
    MF._seamFit = null;
    if(MF.state.screen !== 'mine') return;
    if(MF.fitSeam()) MF.placeInspect();
  }, 120);
});

/* =========================================================================
   PICKING A LUMP OUT DOES NOT REBUILD THE FACE.

   USER, 2026-09-05: "When I click on the layer tool, it forcibly moves the
   screen, which makes the webpage feel jerky and not smooth."

   Clicking a rock used to run MF.paintMine(), which tears down and rebuilds
   the whole middle column - the seam's 691 SVG nodes, the 24 lumps, the
   texture, the pick - to change three things: which rock is ringed, where the
   pick stands, and what the panel underneath says. Then it re-centred the
   seam and scrolled the page.

   Nothing about a selection needs any of that. This is the whole act:

     the ring moves        - a data-sel attribute on two groups
     the pick walks over   - a transform on a node that already eases
     the panel is redrawn  - the one thing whose content actually changed

   The seam is not touched, so the scroll position cannot move, so the lump
   under the cursor cannot jump.

   THE FULL PAINT IS STILL THERE and is still what runs when the FACE changes -
   a new layer, a lump cut out of the wall, ore arriving. This is only for the
   case where the rock the student is looking at is the only thing that moved.
   ========================================================================= */
MF.selectRock = function(idx){
  var F = MF._face;
  MF.state.inspecting = idx;
  if(!F || !F.box || !F.box.isConnected){ MF.paintMine(); return; }

  /* the ring: off whatever had it, on to this one */
  Array.prototype.forEach.call(F.svg.querySelectorAll('.rock[data-sel]'), function(n){
    n.removeAttribute('data-sel');
  });
  var node = (idx == null) ? null : F.svg.querySelector('.rock[data-i="' + idx + '"]');
  if(node) node.setAttribute('data-sel','on');

  /* the pick walks over to it. It carries transition:transform .16s, so this
     is an ease and not a jump - and it is the same expression MF.paintFace
     uses, so the two paths cannot put the pick in different places. */
  var o = (idx == null) ? null : F.rocks[idx];
  if(F.pick){
    var pX = o ? Math.min(F.W-110, Math.max(10, o.px + o.sz + 16)) : (F.W-104);
    var pY = o ? Math.min(F.VH-100, Math.max(4, o.py - 40)) : (F.VH-96);
    F.pick.style.transform = 'translate(' + pX + 'px,' + pY + 'px)';
  }

  MF.paintInspect();
  if(node) MF.knockRock(node, o, false);
  /* ESCAPE PUTS IT AWAY, like every other panel on the site. One listener,
     hung on the document while a lump is picked out and taken off again when
     it is not - a keydown handler that outlives what it closes is the fault
     class `sheet` exists for. */
  if(idx == null){
    if(MF._popKeys){ document.removeEventListener('keydown', MF._popKeys, true); MF._popKeys = null; }
  } else if(!MF._popKeys){
    MF._popKeys = function(e){
      if(e.key !== 'Escape' || MF.state.inspecting == null) return;
      e.preventDefault();
      var back = MF._face && MF._face.svg &&
                 MF._face.svg.querySelector('.rock[data-i="' + MF.state.inspecting + '"]');
      MF.selectRock(null);
      if(back && back.focus) back.focus({preventScroll:true});
    };
    document.addEventListener('keydown', MF._popKeys, true);
  }
  /* AND THE PAGE IS NOT SCROLLED. It used to nudge the panel into view on
     every click; with the seam no longer rebuilt the panel does not move, so
     there is nothing to catch up with - and a page that jumps under a click is
     the whole complaint. */
};

/* the panel under the seam, and it is the only thing a selection redraws */
MF.paintInspect = function(){
  var F = MF._face;
  if(!F || !F.insp || !F.insp.isConnected) return;
  var insp = clear(F.insp);
  var rocks = F.rocks;
  /* NOTHING PICKED OUT MEANS NOTHING ON SCREEN. The pop-out used to carry a
     "nothing picked out yet" plate, which is a box of text explaining that
     there is no box of text. The wall says what to do by being clickable, and
     the line under the layer's name already says it in words. */
  if(MF.state.inspecting==null || !rocks[MF.state.inspecting]){
    insp.hidden = true;
    insp.removeAttribute('data-flip');
    insp.style.left = ''; insp.style.right = '';
    return;
  }
  insp.hidden = false;
  if(true){
    var o = rocks[MF.state.inspecting];
    insp.appendChild(H('div','label','YOU ARE LOOKING AT'));
    insp.appendChild(H('div','expr', MF.oreLabel(o)));
    /* one line, not a four-bullet list: this panel and the swing button have to
       sit on the same screen as the rock they describe, or a click produces no
       response the student can see */
    var terms = (o.kind==='number') ? 1 : [o.a,o.b,o.c].filter(function(v){ return v!==0; }).length;
    var frontOf = (o.kind==='number') ? 'no x in it at all'
      : (o.a===0 ? 'no x², a flat seam' : (o.a===1 ? 'one x², nothing in front' : num(o.a) + ' in front of the x²'));
    /* WHAT THE PROSPECTOR'S PICK IS FOR, and the only place it does anything.
       Without it this line says the kind is not knowable from here. With it,
       the kind IS the reading — and nothing more: it names the shape you are
       about to be looking at and never a number in it, so the rock is still
       the only judge (§11e). Inspecting is free and breaks nothing, so a
       student with this tool can read the whole seam before cutting once. */
    var held = MF.hasTool('pick');
    insp.appendChild(H('div','obs',
      '<b>' + (terms===1 ? 'One vein' : terms + ' veins') + '</b> · ' + frontOf +
      ' · layer ' + o.layer + ', ' + MF.LAYERS[o.layer-1].name +
      (held
        ? '<br><b class="pickread">The pick reads it as ' + MF.ASSAY[MF.assayOf(o)].name + '.</b> ' +
          '<em>' + MF.ASSAY[MF.assayOf(o)].tell + '</em>' +
          /* AND WHAT THAT MEANS FOR THE CHOICE BELOW. This adds no information
             the kind did not already carry - "already an element" and "there is
             nothing to break" are the same sentence - it just says it in the
             words of the decision the student is about to make. It still never
             names a factor. */
          '<br><b class="pickread">' + (MF.isNative(o)
            ? 'Nothing to break. The yard is where this one belongs.'
            : 'A seam runs through it. Worth carting.') + '</b>'
        : '<br><em>Which seam runs through it is not something you can see from here — that is the assay’s job.</em>')));

    /* ---- CUTTING FILLS THE CART, AND THAT IS THE WHOLE DECISION HERE ----
            A yard shortcut lived on this panel for one session. The choice
            moved to the CART (§20), because that is where the instruments are:
            you put a tool on the lump, watch it change, and THEN decide where
            it goes. Choosing before you can read the rock was choosing early. */
    /* ---- THE TWO WAYS OUT OF THE POP-OUT, and they are the question it asks:
            swing at this one, or leave it and carry on scanning. ---- */
    var brow = E('div','row poprow'); brow.style.marginTop='10px';
    var br = E('button','btn primary big','Swing the pick'); br.type='button';
    br.setAttribute('aria-label','Cut ' + MF.oreText(o) + ' out of the seam and into the cart');
    on(br,'click',function(){ MF.breakRock(MF.state.inspecting, 'cart'); });
    brow.appendChild(br);
    var skip = E('button','btn popkeep','Keep scanning'); skip.type='button';
    skip.style.background='#241D18'; skip.style.color='#E4D5BB'; skip.style.borderColor='#6B5B48';
    skip.setAttribute('aria-label','Leave ' + MF.oreText(o) + ' in the wall and carry on along the seam');
    /* putting a lump down is a selection change like any other, and it used to
       rebuild the whole face to clear a ring */
    on(skip,'click',function(){ MF.selectRock(null); });
    brow.appendChild(skip);
    insp.appendChild(brow);
  }
  MF.placeInspect();
};

/* WHERE THE POP-OUT SITS: over the lump it is about, and never over the lump
   it is about.

   Horizontally it is centred on the rock, clamped so it cannot hang off either
   end of the window. Vertically it takes the HALF THE ROCK IS NOT IN - a panel
   that covers the stone you just clicked is answering a question about
   something you can no longer see - and the caret flips with it.

   It is read off the live boxes rather than from the seam's own coordinates,
   because the seam scrolls: the same lump is at a different place on screen
   depending on where the student has scanned to. */
MF.placeInspect = function(){
  var F = MF._face;
  if(!F || !F.insp || F.insp.hidden || !F.wrap || !F.wrap.isConnected) return;
  var node = (MF.state.inspecting == null) ? null
           : F.svg.querySelector('.rock[data-i="' + MF.state.inspecting + '"]');
  if(!node) return;
  var wb = F.wrap.getBoundingClientRect(), rb = node.getBoundingClientRect();
  if(!wb.width) return;
  var pw = F.insp.offsetWidth || 320, ph = F.insp.offsetHeight || 240, gap = 14;
  var rL = rb.left - wb.left, rR = rb.right - wb.left;
  var rTop = rb.top - wb.top, rBot = rb.bottom - wb.top;
  var cx = (rL + rR) / 2, cy = (rTop + rBot) / 2;

  /* BESIDE THE ROCK FIRST, because then it covers none of it.

     Over-or-under was the first version and it could not win: the panel is
     ~255px of a 563px window, so the two positions leave a 25px band that
     neither covers, and a 150px lump spanning the middle got clipped whichever
     way it went - 17 of 54 lumps swept, worst case 77px. The wall is 931px
     wide and the panel is 420, so there is room to stand beside it. */
  var roomRight = wb.width - rR - gap * 2;
  var roomLeft  = rL - gap * 2;
  var side = roomRight >= pw ? 'right' : (roomLeft >= pw ? 'left' : null);

  if(side){
    /* CLAMPED AT BOTH ENDS, and the first version was clamped at one.
       A rock that has been scrolled off the left of the window has a NEGATIVE
       right edge, so `rR + gap` put the panel off the left of the wall - it
       only had a `min`. Every offset in here is clamped into the wall in both
       directions now, because the rock is allowed to be anywhere, including
       outside. */
    var raw = (side === 'right') ? rR + gap : rL - gap - pw;
    var sLeft = Math.max(gap, Math.min(wb.width - pw - gap, raw));
    var sTop = Math.max(gap, Math.min(wb.height - ph - gap, cy - ph/2));
    F.insp.style.left = Math.round(sLeft) + 'px';
    F.insp.style.top = Math.round(sTop) + 'px';
    F.insp.style.bottom = 'auto';
    F.insp.setAttribute('data-flip','side');
    F.insp.setAttribute('data-side', side);
    /* the caret comes off the edge nearest the rock, level with its middle */
    F.insp.style.setProperty('--caretY',
      Math.round(Math.max(16, Math.min(ph - 16, cy - sTop))) + 'px');
    return;
  }

  /* NO ROOM EITHER SIDE - a narrow screen. Fall back to over or under, and
     pick the one that covers LESS of the rock rather than comparing the rock's
     centre to the wall's midpoint, which is only right if the panel is a
     sliver and it is not. */
  F.insp.removeAttribute('data-side');
  F.insp.style.top = ''; F.insp.style.bottom = '';
  /* AND EVEN HERE IT LEANS AWAY. Centring the panel on the rock maximised the
     overlap; pushing it to whichever side has more room shrinks the box the
     two shapes share before the over/under choice is made at all. */
  var lean = (roomRight >= roomLeft) ? (wb.width - pw - gap) : gap;
  var left = Math.max(10, Math.min(wb.width - pw - 10, lean));
  F.insp.style.left = Math.round(left) + 'px';
  F.insp.style.setProperty('--caret', Math.round(Math.max(16, Math.min(pw - 16, cx - left))) + 'px');
  var over = function(aTop, aBot){
    return Math.max(0, Math.min(aBot, rBot) - Math.max(aTop, rTop));
  };
  var high = over(gap, gap + ph);
  var low  = over(wb.height - gap - ph, wb.height - gap);
  F.insp.setAttribute('data-flip', low <= high ? 'low' : 'high');
};

/* =========================================================================
   THE CART - ITS OWN BAND, AND MOSTLY ROCKS.

   Every lump is DRAWN (MF.oreRock) with its expression cut into the stone, at
   a size you can read and drop a tool onto. Under each one, the two places it
   can go. Along the top, the belt. There is one sentence in the whole band and
   it is the instruction for the only gesture that is not obvious.
   ========================================================================= */
MF.paintCart = function(){
  var host = MF._mine && MF._mine.cart;
  if(!host || !host.isConnected) return;
  clear(host);
  var cartPanel = E('div','panel cartpanel');
  cartPanel.appendChild(MF.cartTrack());
  cartPanel.appendChild(H('div','panel-tag','THE CART'));
  if(!MF.state.cart.length){
    cartPanel.appendChild(H('p','hint','Empty. Swing the pick at the face above — dig as much as you like before you work any of it.'));
    host.appendChild(cartPanel);
    return;
  }
  /* THE BELT IS IN THE CART, which is where a student first has a lump and
     nothing to do with it (§20a). */
  MF.paintBelt(cartPanel, true);
  cartPanel.appendChild(H('p','hint','<b>Drag an instrument onto a rock</b> and the numbers cut into it change.'));
  var body = E('div','cartbody');
  var cart = E('div','cart');
  MF.state.cart.forEach(function(o){
    var cell = E('div','lumpcell');
    var nat = MF.isNative(o);
    /* THE ROCK IS THE DROP TARGET. Not a button that moves it - where it goes
       is the two controls underneath; this is the stone itself. */
    var b = E('div','lump' + (o.fresh?' fresh':'') + (nat?' native':''));
    b.setAttribute('data-ore', o.id);      /* survives the repaint, so the knock finds it */
    b.setAttribute('tabindex','0');
    b.appendChild(MF.oreRock(o, {native:nat}));
    b.appendChild(H('span','lay','LAYER ' + o.layer));
    if(MF.state.selected && MF.state.selected.id===o.id) b.setAttribute('aria-current','true');
    b.setAttribute('aria-label', MF.oreDisplayText(o) + ', layer ' + o.layer +
      (MF.state.armedTool
        ? '. Click to use the ' + MF.TOOLS[MF.state.armedTool].nm + ' on it.'
        : '. Drop an instrument on it, or send it on with the two controls below.'));
    if(MF.state.armedTool) b.setAttribute('data-tooldrop','open');
    on(b,'click',function(){
      if(!MF.state.armedTool) return;
      var k = MF.state.armedTool;
      MF.state.armedTool = null;
      MF.applyToolToOre(k, o.id);
    });
    on(b,'keydown',function(e){
      if(e.key!=='Enter' && e.key!==' ') return;
      if(!MF.state.armedTool) return;
      e.preventDefault();
      var k = MF.state.armedTool; MF.state.armedTool = null; MF.applyToolToOre(k, o.id);
    });
    cell.appendChild(b);
    /* AND THE SAME WAY BACK OFF AS THE BREAKING FLOOR (§23): a slot that only
       exists while an instrument is on the rock, and takes it off. */
    if(o.tool && MF.hasTool(o.tool)){
      var ot = MF.TOOLS[o.tool];
      var oslot = E('button','toolslot filled'); oslot.type='button';
      oslot.setAttribute('data-ore-slot', o.id);
      oslot.innerHTML = '<span class="si">' + ot.ic + '</span><span class="sx">&times;</span>';
      oslot.setAttribute('aria-label', ot.nm + ' is on ' + MF.oreText(o) + '. Take it off.');
      oslot.title = 'Take the ' + ot.nm + ' off';
      on(oslot,'click',function(e){ e.stopPropagation(); MF.clearTool(o, null); });
      cell.appendChild(oslot);
    }
    /* ---- WHERE IT GOES, in two controls under the rock ---- */
    var route = E('div','lumproute');
    var toFloor = E('button','btn primary lumpgo','Break it'); toFloor.type='button';
    toFloor.setAttribute('aria-label','Put ' + MF.oreText(o) + ' on the breaking floor and work it');
    on(toFloor,'click',function(){
      MF.state.selected = o;
      MF.state.anvil = null;
      /* the floor did not exist a moment ago and the cart chip changes with it;
         the wall and the yard did not move */
      MF.repaint(['cart','work']);
      MF.knockLump(o.id);
      /* the floor did not exist a moment ago, so say where it went */
      var w = MF._mine && MF._mine.work;
      if(w && w.firstChild && w.getBoundingClientRect().bottom > window.innerHeight)
        w.scrollIntoView({block:'start', behavior:'smooth'});
    });
    route.appendChild(toFloor);
    var y = E('button','btn lumpgo tuyard','To the yard'); y.type='button';
    y.setAttribute('aria-label','Set ' + MF.oreText(o) + ' aside in the yard without working it');
    on(y,'click',function(){ MF.cartToYard(o.id); });
    route.appendChild(y);
    cell.appendChild(route);
    cart.appendChild(cell);
  });
  body.appendChild(cart);
  MF.cartIron(body);
  cartPanel.appendChild(body);
  cartPanel.appendChild(MF.cartUnder());
  cartPanel.appendChild(E('div','cartrail'));
  host.appendChild(cartPanel);
};

/* =========================================================================
   THE CART IS A BUILT OBJECT, AND THE ORE STILL LIVES IN IT.

   USER, 2026-09-04: "Redesign the minecart to include details as shown in the
   included picture, such as the hitch and the bolted edges, etc. But leave
   space for the Ore to exist and be factored."

   From the reference: a heavy lipped rim bolted along its length, riveted
   corner straps down a body that FLARES - wide at the lip, narrower at the
   sill - chips knocked out of the plate, a bolted chassis bar, and spoked
   wheels with a rust-coloured hub cap. Plus the coupling: a drawbar and ring
   off the front, which is the one part of a mine cart that says it belongs to
   a train of them.

   TWO CONSTRAINTS THIS HAD TO BE BUILT AROUND, both of them load-bearing:

   1. THE BED COLOUR STAYS ON `.cartbody` AS A CSS BACKGROUND. The contrast
      sweep's `_backdrops` walks UP from a piece of text looking for paint
      (§64), and the layer tag under each lump has nothing between it and the
      cart's bed. Repaint the bed as an SVG fill behind the content and that
      walk climbs straight past it to the panel's paper, and reports cream ink
      on cream. So the ironwork is drawn OVER a bed that has not moved.

   2. THE BOX HAS TO STRETCH. It holds a scrolling list with a 430px cap, so
      nothing here may be a drawing that distorts when the box grows: the rim
      and the straps are HTML with repeating bolt heads, sized in pixels, and
      the only SVG is the outline - which is `preserveAspectRatio="none"` with
      a non-scaling stroke, so a tall cart is a tall cart and not a fat one.
   ========================================================================= */
MF.cartIron = function(body){
  /* THE OUTLINE, TRACING THE SAME TRAPEZOID `.cartbody` IS CLIPPED TO.
     Stroke 6 because the clip takes the outer half of it: a clipped border is
     half a border, and this is the width that leaves 3px showing. */
  var out = S('svg',{class:'cartline', viewBox:'0 0 100 100', preserveAspectRatio:'none','aria-hidden':'true'});
  out.appendChild(S('path',{d:'M0 0 H100 L97.6 100 H2.4 Z', fill:'none', stroke:'#2A3138',
    'stroke-width':'6', 'vector-effect':'non-scaling-stroke','stroke-linejoin':'round'}));
  body.appendChild(out);

  /* the chips knocked out of the plate. Fixed to the top of the box so they
     never stretch, and inert. */
  var chip = S('svg',{class:'cartchip', viewBox:'0 0 200 90', preserveAspectRatio:'none','aria-hidden':'true'});
  [['M28 16 l7 12 l-4 3 l-8 -12 Z','.5'],
   ['M162 22 l5 15 l-4 2 l-6 -15 Z','.42'],
   ['M96 54 l14 4 l0 4 l-14 -4 Z','.34'],
   ['M50 62 l11 2 l-1 4 l-11 -2 Z','.3']].forEach(function(c){
    chip.appendChild(S('path',{d:c[0], fill:'#2A3138', opacity:c[1]}));
  });
  body.appendChild(chip);

  /* THE RIM: the heavy lipped top, bolted along its length. */
  body.appendChild(E('div','cartrim'));
  /* THE CORNER STRAPS, riveted, leaning with the flare. A vertical strap on a
     wall that tapers is not vertical, and skewing them by the same 2.3° the
     outline leans is the difference between ironwork and two stripes. */
  body.appendChild(E('div','cartstrap l'));
  body.appendChild(E('div','cartstrap r'));
  /* and the sill the body sits down onto */
  body.appendChild(E('div','cartsill'));
};

/* ONE WHEEL: tyre, rim face, four cut-outs, and a rust-coloured hub cap.
   The cut-outs are computed rather than rotated into place - a transform
   attribute on an SVG group is the thing §5g exists about, and while these
   are static today, the wheel in `MF.cartTrack` spins and this shape will be
   wanted there sooner or later. */
MF.cartWheel = function(which){
  var svg = S('svg',{class:'cwheel ' + which, viewBox:'-27 -27 54 54','aria-hidden':'true'});
  svg.appendChild(S('circle',{cx:0,cy:0,r:23,fill:'#39424B',stroke:'#1E242A','stroke-width':'3'}));
  svg.appendChild(S('circle',{cx:0,cy:0,r:18,fill:'#6E7A86',stroke:'#2A3138','stroke-width':'2.5'}));
  var rad = function(d){ return d*Math.PI/180; };
  [45,135,225,315].forEach(function(a){
    var o = 13.5, i = 5.2, sp = 33;
    var x1 = (o*Math.cos(rad(a-sp))).toFixed(1), y1 = (o*Math.sin(rad(a-sp))).toFixed(1);
    var x2 = (o*Math.cos(rad(a+sp))).toFixed(1), y2 = (o*Math.sin(rad(a+sp))).toFixed(1);
    var x3 = (i*Math.cos(rad(a))).toFixed(1),    y3 = (i*Math.sin(rad(a))).toFixed(1);
    svg.appendChild(S('path',{d:'M'+x1+' '+y1+' A'+o+' '+o+' 0 0 1 '+x2+' '+y2+' L'+x3+' '+y3+' Z',
      fill:'#39424B', stroke:'#2A3138','stroke-width':'2','stroke-linejoin':'round'}));
  });
  svg.appendChild(S('circle',{cx:0,cy:0,r:6,fill:'#8A9AA6',stroke:'#2A3138','stroke-width':'2'}));
  svg.appendChild(S('circle',{cx:0,cy:0,r:2.8,fill:'#C96A1F'}));
  /* the bolt head on the axle mount, up and to the left, as in the reference */
  svg.appendChild(S('circle',{cx:-11,cy:-15,r:3.6,fill:'#8A9AA6',stroke:'#2A3138','stroke-width':'2'}));
  return svg;
};

/* THE UNDERCARRIAGE: the bolted chassis bar, the coupling, and the wheels.
   It keeps the class `cartwheels` because that is what `cartdraw` measures -
   6 cart sizes against the height of this row - and because it is still, in
   fact, the wheels. */
MF.cartUnder = function(){
  var row = E('div','cartwheels');
  row.appendChild(E('div','cartaxle'));
  /* THE HITCH: a drawbar off the front with a ring on the end. */
  var hitch = S('svg',{class:'carthitch', viewBox:'0 0 46 30','aria-hidden':'true'});
  hitch.appendChild(S('rect',{x:14,y:11,width:30,height:8,rx:2,fill:'#6E7A86',stroke:'#2A3138','stroke-width':'2.5'}));
  hitch.appendChild(S('circle',{cx:36,cy:15,r:2,fill:'#39424B'}));
  hitch.appendChild(S('ellipse',{cx:10,cy:15,rx:9,ry:11,fill:'none',stroke:'#2A3138','stroke-width':'6'}));
  hitch.appendChild(S('ellipse',{cx:10,cy:15,rx:9,ry:11,fill:'none',stroke:'#8A9AA6','stroke-width':'3'}));
  row.appendChild(hitch);
  row.appendChild(MF.cartWheel('front'));
  row.appendChild(MF.cartWheel('rear'));
  return row;
};


/* THE WORK BAND, full width and below the three places you move between. The
   bench used to be appended to the middle column under the cart, which left
   the breaking floor a third of the page wide and stacked its two boxes one
   above the other. */
/* THE BREAKING FLOOR DOES NOT EXIST UNTIL A LUMP IS SENT TO IT.

   USER, 2026-08-30: "The Breaking floor should not appear until it is
   selected." It used to hold a line of Mr Factor telling you to pick a lump,
   which is a whole band of screen spent saying that a band of screen is empty
   - and it sat under the cart, so every student scrolled past an instruction
   to do the thing they were already doing. Nothing selected, nothing drawn.
   The cart's own controls are what send a lump here (§20a). */
MF.paintWork = function(){
  var host = MF._mine && MF._mine.work;
  if(!host || !host.isConnected) return;
  clear(host);
  if(MF.state.selected) MF.paintAnvil(host);
};

/* =========================================================================
   THE KNOCK. Every click on a lump gets an answer at the point of contact,
   whether or not it changed anything: the rock takes a knock, chips come off
   it, a ring goes out from where you hit it, and the pick tips in.

   THREE CLICKS USED TO BE SILENT, and all three looked like broken controls:
   the lump already selected (repaint drew an identical picture), any lump at
   all during the 900ms of a swing (an early `return`), and the cart lump
   already on the bench (the change was below the fold).

   This is deliberately NOT the break animation. Breaking is 720ms of swing,
   nine shards and a shudder through the whole face; the knock is 300ms and
   local. Nothing here decides anything, spends anything or moves the lump -
   the pour is still the only correctness signal in the build.
   ========================================================================= */
MF.knockRock = function(node, o, refused){
  if(!node || !o) return;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var body = node.querySelector('.body');
  var cls  = refused ? 'refuse' : 'knock';
  if(body){
    /* remove, force a reflow, re-add: without the reflow a second click on the
       same rock re-adds a class the element never lost and the browser does not
       restart the animation - which is exactly the dead-click this fixes. */
    body.classList.remove('knock','refuse');
    void body.getBoundingClientRect();
    body.classList.add(cls);
    setTimeout(function(){ body.classList.remove(cls); }, 420);
  }
  var svg = node.ownerSVGElement;
  if(!svg) return;
  var look = MF.LAYER_LOOK[MF.state.layer-1] || MF.LAYER_LOOK[0];
  var bits = [];
  var halo = S('circle',{class:'taphalo',cx:o.px,cy:o.py,r:o.sz+7,fill:'none',
    stroke:look.glint,'stroke-width':'3'});
  svg.appendChild(halo); bits.push(halo);
  if(!refused && !reduced){
    for(var i=0;i<4;i++){
      var ang = -Math.PI/2 + (i-1.5)*0.55;
      var chip = S('circle',{class:'chip',cx:o.px+(i-1.5)*3.5,cy:o.py-o.sz*0.45,
        r:(2.1+(i%2)).toFixed(1), fill: i%2 ? look.ore : look.grit});
      chip.style.setProperty('--dx',(Math.cos(ang)*(18+i*6)).toFixed(1)+'px');
      chip.style.setProperty('--dy',(Math.sin(ang)*(18+i*6)-5).toFixed(1)+'px');
      svg.appendChild(chip); bits.push(chip);
    }
  }
  /* the seam is repainted constantly; anything left behind accumulates */
  setTimeout(function(){
    bits.forEach(function(b){ if(b.parentNode) b.parentNode.removeChild(b); });
  }, 520);
  var arm = MF._pickArm;
  if(arm && !reduced && !refused){
    arm.classList.remove('picktap'); void arm.getBoundingClientRect();
    arm.classList.add('picktap');
    setTimeout(function(){ arm.classList.remove('picktap'); }, 320);
  }
};

/* the same answer for a lump in the cart, which is ore too */
MF.knockLump = function(id){
  var host = MF._mine && MF._mine.root;        /* the cart is its own band now */
  var el = host && host.querySelector('.lump[data-ore="'+id+'"]');
  if(!el) return;
  el.classList.remove('knock'); void el.getBoundingClientRect();
  el.classList.add('knock');
  setTimeout(function(){ el.classList.remove('knock'); }, 320);
};

/* =========================================================================
   BREAKING A ROCK. The swing has weight: the pick arcs down, the rock takes
   the hit, shards fly, the face shudders, and only then does the lump land in
   the cart. Under prefers-reduced-motion every duration collapses and the
   lump simply arrives - the sequence still completes, it just does not perform.
   ========================================================================= */
/* WHERE A CUT LUMP LANDS, pulled out of MF.breakRock's 900ms timer so it can be
   checked at all. Inside the timer it was unreachable to anything synchronous,
   and an unreachable branch is one nothing asserts - which is how the whole
   Deep Pick went by (§69).

   The YARD route goes through MF.stow, the one place that decides rack or heap
   (§15b), and does NOT touch the cart or the bench: setting a lump aside is the
   entire point of having chosen it. */
MF.placeCut = function(o, dest){
  if(dest === 'yard'){ MF.stow(o); return; }
  MF.state.cart.push(o);
  /* AND IT IS NOT SELECTED. This line used to read
       if(!MF.state.selected) MF.state.selected = o;
     which meant the FIRST lump a student ever cut opened the breaking floor
     by itself. The floor was asked to stay shut three times and I hid the
     PANEL twice - `paintWork` drawing nothing when nothing is selected - while
     the state behind it was still being set here. Hiding a panel cannot beat
     the thing that opens it. The cart's own "Break it" is the only way to the
     floor now (§22). */
};

/* `dest` is 'cart' (work it) or 'yard' (set it aside), chosen at the face
   before the swing. It defaults to the cart, because every caller that predates
   the choice meant the cart. */
MF.breakRock = function(idx, dest){
  var rocks = MF.state.face, o = rocks[idx];
  if(!o || MF.state.breaking) return;
  MF.state.breaking = true;
  var startLayer = MF.state.faceLayer;

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var svg = MF._mine.mid.querySelector('.face svg');
  var arm = MF._pickArm;
  var landMs = reduced ? 10 : 400;
  var doneMs = reduced ? 30 : 900;

  if(arm && !reduced){ arm.classList.remove('pickarm'); void arm.getBoundingClientRect(); arm.classList.add('pickarm'); }

  setTimeout(function(){
    if(svg){
      var look = MF.LAYER_LOOK[MF.state.layer-1];
      var ring = S('circle',{class:'impact',cx:o.px,cy:o.py,r:o.sz,fill:'none',stroke:look.glint,'stroke-width':'4'});
      svg.appendChild(ring);
      for(var i=0;i<9;i++){
        var ang = (i/9)*Math.PI*2, dist = 34 + (i%4)*13;
        var sh = S('polygon',{class:'shard',
          points:(o.px)+','+(o.py-5)+' '+(o.px+7)+','+(o.py+4)+' '+(o.px-6)+','+(o.py+6),
          fill: i%3===0 ? look.ore : look.rock, stroke:look.rock2,'stroke-width':'1'});
        sh.style.setProperty('--dx', (Math.cos(ang)*dist).toFixed(1)+'px');
        sh.style.setProperty('--dy', (Math.sin(ang)*dist - 10).toFixed(1)+'px');
        sh.style.setProperty('--rot', ((i*47)%360)+'deg');
        svg.appendChild(sh);
      }
      var faceBox = MF._mine.mid.querySelector('.face');
      if(faceBox && !reduced){ faceBox.classList.add('shudder');
        setTimeout(function(){ faceBox.classList.remove('shudder'); }, 340); }
    }
  }, landMs);

  setTimeout(function(){
    /* SPLICE BY IDENTITY, NOT BY INDEX, and only if we are still on the layer
       the swing started on. A student who changed layer during the 900ms
       landing got a fresh face of fifteen rocks, and this timer then deleted
       whichever NEW rock happened to sit at the old index - a lump they never
       touched, which never reached the cart, on a face that refills to fifteen
       so nothing on screen said a word. */
    if(MF.state.faceLayer !== startLayer){ MF.state.breaking = false; return; }
    var at = MF.state.face.indexOf(o);
    if(at < 0){ MF.state.breaking = false; MF.paintMine(); return; }
    MF.state.face.splice(at,1);
    MF.state.inspecting = null;
    o.fresh = true;
    MF.placeCut(o, dest);
    MF.state.breaking = false;
    MF.paintMine();
    setTimeout(function(){ o.fresh = false; }, 500);
  }, doneMs);
};

/* =========================================================================
   THE BREAKING FLOOR.  ASSAY, then BREAK - and break again.

   THERE IS NO CRUCIBLE HERE AND NO MOLD. You do not pour in the mine. You
   name ONE thing that is in the rock, swing, and either the seam runs or the
   pick glances off. What comes off lands on the floor beside it, and anything
   on the floor still carrying a seam goes back under the pick.

   That is the whole of it, and it is why 60 and x² − 5x + 6 are the same
   problem: both come apart one factor at a time until what is left will not
   come apart at all.

   Pouring metal into a mold is DISTRIBUTION, it is the opposite move, and it
   happens in exactly one place in this build - the forge, where it makes
   tools. The mine breaks. The forge smelts.
   ========================================================================= */
/* THE BENCH OPENS ON THE HAMMER. It used to open on a question with the
   breaking floor hidden behind it, and a student who wanted to swing had to
   answer something first. The assay is not gone - it is one of the three verbs
   (MINE-SPEC s3) and it is still here, as a call you can make at any time and
   never have to make. What went is the GATE, not the step. */
MF.anvilInit = function(ore){
  return { ore:ore, step:'break', assayTried:false,
           floor:[{ore:ore, id:1}],   /* every piece off this lump, in order */
           seq:1,                     /* piece ids, so a repaint can find one */
           at:0,                      /* which piece is under the pick */
           raw:{m:'1', k:'0'},        /* what the student typed, kept verbatim */
           last:null, swings:0 };
};
/* THE BREAKING FLOOR IS THE WORK AND NOTHING ELSE.

   USER, 2026-08-30: "The top part, text, and buttons above the anvil and
   hammer need to be removed."

   Everything that used to sit above the two work boxes is gone: the ore as a
   76px headline, the Stamp Mill signpost, the assay offer, and the line of
   instruction under them. Each was defensible on its own and together they
   were a screen of furniture between a student and the hammer.

   The headline in particular had become a DUPLICATE - the lump is drawn on
   the stone in the floor box now (§22), so the number was on screen twice and
   the larger copy was the one you could not act on.

   The assay is not deleted, it is unreachable from here: naming the rock was
   already optional (§15a) and the Prospector's Pick reads the kind at the face
   (§17a), which is one step earlier and does not stand between anything. */
MF.paintAnvil = function(host){
  var ore = MF.state.selected;
  if(!MF.state.anvil || MF.state.anvil.ore.id !== ore.id) MF.state.anvil = MF.anvilInit(ore);
  var B = MF.state.anvil;

  var bench = E('div','bench');
  bench.appendChild(H('div','panel-tag','THE BREAKING FLOOR'));
  MF.paintBreak(bench, B);

  host.appendChild(bench);
};
/* MF.stepDone is gone with the step strip it fed. It answered "is this stage
   behind us", which was only ever a question because the stages were a
   sequence you had to walk. There is one act on this bench now. */

/* THE OFFER TO NAME THE ROCK, which lives in the bench's top right corner.
   Split out of MF.paintAssay so the corner column can hold it: the button sits
   under the Stamp Mill signpost with its own line beneath it, and the choices
   it opens still fill the body below. Returns whether it drew anything, so a
   corner with nothing in it is never appended. */
MF.assayOffer = function(host, B){
  if(B.calledAs || B.step === 'assay') return false;
  var offer = E('div','assayoffer');
  var ob = E('button','btn assaybtn','What kind of rock is this?'); ob.type='button';
  ob.setAttribute('aria-label','Name what kind of rock this is. Optional — the hammer works either way.');
  on(ob,'click',function(){ B.step = 'assay'; MF.paintMine(); });
  offer.appendChild(ob);
  offer.appendChild(H('span','assayhint','Optional. The hammer works either way.'));
  host.appendChild(offer);
  return true;
};

MF.paintAssay = function(host, B){
  var ore = B.ore;
  var right = MF.assayOf(ore);

  /* THE CALL, ONCE MADE, STAYS ON SCREEN WITH ITS REASON.
     This used to reveal the explanation by setting data-result on the button
     and then schedule paintMine 260ms later - which destroyed the button. So
     a correct answer showed its reasoning for a QUARTER OF A SECOND while a
     wrong answer kept it indefinitely: the build explained itself only to
     students who got it wrong, and the longest copy in it (the two-true-
     readings note) was the least readable. Now a settled call renders as a
     panel that persists for as long as the lump is on the bench. */
  /* THREE STATES, WHERE THERE USED TO BE TWO.
     Settled: a call has been made, and it stays on screen with its reason for
     as long as the lump is on the bench.
     Offered: no call yet, and the bench is NOT waiting on one - a single quiet
     control that opens the choices when a student wants them.
     Asking: the choices themselves, unchanged. */
  if(B.calledAs){
    var settled = E('div','note good');
    settled.innerHTML = '<b>You called it: ' + MF.ASSAY[B.calledAs].name + '.</b> ' +
      (B.calledWhy || MF.ASSAY[B.calledAs].tell);
    host.appendChild(settled);
    return;
  }
  /* THE OFFER IS NOT DRAWN HERE ANY MORE. It is MF.assayOffer, and paintAnvil
     puts it in the top right corner under the Stamp Mill. Only the CHOICES -
     which are wide, and are a thing you have asked for - open in the body. */
  if(B.step !== 'assay') return;

  host.appendChild(H('p','hint','<b>What kind of rock are you holding?</b> Nothing depends on this — you can swing without it. It is here because a call you made is the only thing you can later catch yourself out on.'));

  /* the Drill reads structure - this is its power, and it is the only thing
     on the assay screen that says anything beyond what is visibly there */
  if(MF.hasTool('drill')){
    var tell = E('div','note');
    var bits = [];
    if(ore.kind==='number'){
      bits.push('It is a plain number, so the only question is whether anything divides it.');
      bits.push('Nothing below ' + Math.ceil(Math.sqrt(Math.abs(ore.n))) + ' needs checking past that point.');
    } else {
      var terms = [ore.a,ore.b,ore.c].filter(function(v){ return v!==0; }).length;
      bits.push('<b>' + terms + '</b> term' + (terms===1?'':'s') + ' in it.');
      var gg = gcdAll([ore.a,ore.b,ore.c].filter(function(v){ return v!==0; }));
      bits.push(gg>1 ? 'Every term divides by <b>'+gg+'</b>.' : 'No number above 1 divides every term.');
      if(ore.c===0 && ore.a!==0) bits.push('There is no plain number on the end, so every term still carries an x.');
      bits.push(ore.a===1 ? 'Nothing sits in front of the x².' : (ore.a===0?'There is no x² at all.':'<b>'+num(ore.a)+'</b> sits in front of the x².'));
      if(terms===2 && ore.b===0 && ore.c<0) bits.push('Two terms with a minus between them — check whether both ends are perfect squares.');
    }
    tell.innerHTML = '<b>Assay Lamp:</b> ' + bits.join(' ');
    host.appendChild(tell);
  }

  var accepted = MF.assayAccepts(ore);
  var opts = (ore.kind==='number') ? ['pure','composite'] : ['pure','shared','twin','plain','loaded'];
  var wrap = E('div','choices');
  MF.balanced(ore.id+'|assay', opts).forEach(function(k){
    var why = MF.ASSAY[k].tell;
    /* a second true reading gets its own words, not the generic tell */
    if(accepted.indexOf(k) >= 0 && k !== right){
      why = 'Also true — this really is two squares with a minus between them. ' +
            'Both readings are right; the shared lump usually comes out first, because once it does ' +
            'the twin seam underneath is easier to see.';
    }
    var btn = H('button','choice', MF.ASSAY[k].name + '<span class="why">' + why + '</span>');
    btn.type='button';
    on(btn,'click',function(){
      if(accepted.indexOf(k) >= 0){
        btn.setAttribute('data-result','yes');
        /* remember WHAT they called it and WHY that is true, so the settled
           panel can carry both. Repaint immediately - no timer, so the screen
           and the state can never disagree (they used to, for 260ms, during
           which a passed gate still took clicks). */
        B.calledAs = k;
        B.calledWhy = why;
        B.step = 'break';
        MF.paintMine();
      } else {
        btn.setAttribute('data-result','no');
      }
    });
    wrap.appendChild(btn);
  });
  host.appendChild(wrap);
  /* AND A WAY OUT OF THE QUESTION. It is opened deliberately now, so it needs
     a door: a student who opens it and changes their mind must not be stuck
     looking at choices they did not want. */
  var skip = E('button','btn assayskip','Never mind — back to the hammer'); skip.type='button';
  on(skip,'click',function(){ B.step = 'break'; MF.paintMine(); });
  host.appendChild(skip);
};

/* deterministic option order - the correct call must not sit in the same slot */
function hash(str){ var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
MF.balanced = function(seed, list){
  var out = list.slice();
  var h = hash(seed);
  for(var i=out.length-1;i>0;i--){
    var j = (h + i*2654435761) % (i+1);
    var t = out[i]; out[i]=out[j]; out[j]=t;
    h = (h*1664525 + 1013904223) >>> 0;
  }
  return out;
};

/* AND WHERE THE ANSWER LANDS IS PLACED, NOT LEFT TO THE SHUFFLE.

   A plain shuffle is unbiased per question and says nothing about the BUILD.
   Run over the eight recognition questions on this site it put the supported
   option in the last slot five times out of eight - better than the eight out
   of eight that shipped, and still a slot worth guessing.

   So the supported option's slot is computed from the question directly and
   the others fill in around it. That makes the spread a property of the hash
   over the question set rather than of luck, and the `quiz` group measures the
   spread it actually produces rather than trusting that shuffling is enough.

   `holds` is what marks the supported option, and a question with none - or
   with several, which is a real shape here, two readings of one lump can both
   be true - falls back to the plain shuffle. */
MF.spreadOptions = function(seed, options){
  var n = options.length;
  var right = -1, holds = 0;
  options.forEach(function(o, i){ if(o.holds){ holds++; right = i; } });
  if(holds !== 1) return MF.balanced(seed, options);
  var rest = MF.balanced(seed + '|rest', options.filter(function(o, i){ return i !== right; }));
  var slot = hash(seed + '|slot') % n, out = [], ri = 0;
  for(var i=0;i<n;i++) out.push(i === slot ? options[right] : rest[ri++]);
  return out;
};

/* THE FLOOR OF THE WORKING, behind the pieces and the belt.

   REDRAWN FROM NOTHING. The first version put a second anvil, a sledge and a
   lamp along the top of the floorbox - a whole competing scene, badly drawn,
   directly above the properly drawn anvil below it. Two anvils on one screen,
   and the crude one on top.

   This is the ground and the wall of the gallery you are standing in: hewn
   rock, a timber prop, a hanging lamp, dust. No focal objects at all, because
   the focal objects are the pieces of rock lying on it. */
MF.anvilArt = function(){
  var wrap = E('div','anvilart');
  var W=320, VH=70;
  var svg = S('svg',{viewBox:'0 0 '+W+' '+VH,'aria-hidden':'true',preserveAspectRatio:'xMidYMax slice'});
  var defs = S('defs',{});
  var g1 = S('linearGradient',{id:'gallw',x1:'0',y1:'0',x2:'0',y2:'1'});
  g1.appendChild(S('stop',{offset:'0%','stop-color':'#2A2219'}));
  g1.appendChild(S('stop',{offset:'100%','stop-color':'#443728'}));
  defs.appendChild(g1); svg.appendChild(defs);
  svg.appendChild(S('rect',{x:0,y:0,width:W,height:VH,fill:'url(#gallw)'}));

  /* hewn rock: courses of chisel work, no two the same length */
  for(var r=0;r<4;r++){
    var y = 10 + r*15;
    var d = 'M0 '+y;
    for(var seg=0; seg<W; seg+=44) d += ' q22 '+((seg/44+r)%2?3:-3)+' 44 '+((seg/44+r)%3===0?2:-1);
    svg.appendChild(S('path',{d:d,fill:'none',stroke:'#584835','stroke-width':(r%2?1.4:2.2),opacity:'.55'}));

  for(var b=0;b<14;b++)
    svg.appendChild(S('path',{d:'M'+(16+b*23)+' '+(12+((b*11)%40))+' l0 13',
      stroke:'#584835','stroke-width':'1.6',opacity:'.4',fill:'none'}));

  /* a timber prop holding the back up, at the left edge where nothing sits */
  svg.appendChild(S('rect',{x:16,y:6,width:11,height:VH-6,fill:'#5A4432'}));
  svg.appendChild(S('rect',{x:12,y:4,width:19,height:7,rx:2,fill:'#6B5335'}));
  svg.appendChild(S('rect',{x:0,y:4,width:W,height:5,fill:'#4A3B2C',opacity:'.8'}));

  /* the lamp on the cap-piece, and the pool it throws */
  svg.appendChild(S('circle',{class:'gallglow',cx:'58',cy:'22',r:'20',fill:'rgba(232,163,61,.16)'}));
  svg.appendChild(S('path',{d:'M54 9 l8 0 l3 5 l-14 0 Z',fill:'#5A626A'}));
  svg.appendChild(S('rect',{x:'53',y:'13',width:'11',height:'13',rx:'3',fill:'#E8A33D',stroke:'#8A6A2A','stroke-width':'2'}));

  /* dust in the light, and grit on the ground */
  for(var d2=0; d2<16; d2++)
    svg.appendChild(S('circle',{cx:String(24+d2*19), cy:String(20+((d2*17)%42)), r:String(1+(d2%3)*0.7),
      fill:'#C8B89A', opacity:'.2'}));
  svg.appendChild(S('path',{d:'M0 '+(VH-9)+' q80 -5 160 -1 q80 4 160 -2 L'+W+' '+VH+' L0 '+VH+' Z',fill:'#241D18'}));

  wrap.appendChild(svg);
  return wrap;
};

/* WHAT THE HAMMER IS CUT TO, echoed under it. The line whose absence let a
   cleared box swing 6 at a lump the student meant to hit with (x + 6). */
MF.echoHammer = function(B){
  var echo = B && B._echo;
  /* NO isConnected GUARD. paintBreak builds the bar detached and appends it at
     the end, so the first call - the one that fills the line at rest - runs
     while the node has no parent. B._echo is replaced on every paint. */
  if(!echo) return;
  var isNum = B._pieceIsNum;
  /* NOTHING TYPED IS NOT THE SAME AS A SHAPE THAT COMES TO NOTHING. Read the
     raw strings for emptiness: an empty x-part parses to 1, so testing the
     PARSED values reported an untouched bar as "cut to (x)" - a shape nobody
     had chosen, sitting there looking like a suggestion. */
  if(String(B.raw.m).trim()==='' && String(B.raw.k).trim()===''){
    echo.innerHTML = 'the head is empty — type what you are taking out';
    return;
  }
  var m = isNum ? 0 : MF.readPickM(B.raw.m), k = MF.readInt(B.raw.k);
  if(!isFinite(m) || !isFinite(k)){
    echo.innerHTML = '<span class="bad">that is not a whole number</span>';
    return;
  }
  echo.innerHTML = 'the hammer is cut to <b>' +
    (m===0 ? num(k) : '(' + ingotHtml({m:m,k:k}) + ')') + '</b>';
};

/* =========================================================================
   THE ANVIL AND THE HAMMER.

   A London-pattern anvil on a stump with the lump on its face, and an UPRIGHT
   hammer standing over it - handle vertical, head square on the end of it,
   and the flat striking face pointing straight down at the work. The head was
   a wide horizontal plate before, because it had the input boxes in it; the
   boxes are back under the picture where they belong, so the hammer can be
   the shape a hammer is.

   Scenery, and inert: the `overlay` group asserts nothing in here takes a click.
   ========================================================================= */
MF.anvilScene = function(ore, opts){
  var op = opts || {};
  var wrap = E('div','anvilsvg');
  var W=340, VH=232;
  var svg = S('svg',{viewBox:'0 0 '+W+' '+VH,'aria-hidden':'true'});

  /* ---- the ground, the stump, the anvil ----

     RENDERED, AND THE REVERSAL IS THE POINT.

     USER, 2026-09-05: "Now make the anvil and hammer look 3D like the ladle."

     This was cut back to flat fill and a dark outline for a stated reason, and
     the reason was not that flat is better: it was that the anvil was THE ONLY
     RENDERED OBJECT ON THE SITE and read as a photograph pasted into a
     drawing. The ladle (§35) is rendered now, and it is the other half of the
     same act - metal poured, metal broken - so the anvil being flat makes it
     the odd one out in the other direction.

     What came back is the SHADING. What did not is the clutter: no tongs
     leaning on the stump, no swarf across the floor, no bolt heads. The
     silhouette is the one it has had since it was flattened.

     EVERY COORDINATE IS THE SAME. The hammer's pivot at (176,10), the face at
     y=154 running x 112..262, the horn, the hardy hole - the ore's mount is
     pinned to the face in percentages of this viewBox and the swing animations
     are pinned to the rest, so a number moved here is a lump floating off the
     anvil. Nothing moved. */
  var aid = 'av' + (MF._anvSeq = (MF._anvSeq || 0) + 1);
  var defs = S('defs',{});
  function agrad(id, stops, horiz){
    var g = S('linearGradient',{id:id, x1:'0', y1:'0', x2:(horiz?'1':'0'), y2:(horiz?'0':'1')});
    stops.forEach(function(s){ g.appendChild(S('stop',{offset:s[0],'stop-color':s[1]})); });
    defs.appendChild(g);
  }
  agrad(aid+'face', [['0%','#D6E0EA'],['30%','#AEBAC6'],['100%','#7E8A96']], true);
  agrad(aid+'body', [['0%','#8A96A2'],['46%','#5E6A76'],['100%','#39424B']]);
  agrad(aid+'base', [['0%','#525C66'],['100%','#2E353C']]);
  agrad(aid+'horn', [['0%','#8E9AA6'],['100%','#4E5862']]);
  agrad(aid+'wood', [['0%','#8A6142'],['40%','#6B4A32'],['100%','#3F2C1D']]);
  agrad(aid+'haft', [['0%','#B08658'],['34%','#8A6A45'],['100%','#54402A']], true);
  agrad(aid+'head', [['0%','#96A2AE'],['38%','#5E6A76'],['100%','#2E353C']], true);
  agrad(aid+'peen', [['0%','#6E7A86'],['100%','#333B43']], true);
  svg.appendChild(defs);

  svg.appendChild(S('ellipse',{cx:172,cy:226,rx:118,ry:7,fill:'#1B1511',opacity:'.42'}));
  /* the stump: a round of timber, lit from the left, with the grain showing */
  svg.appendChild(S('path',{d:'M104 202 h136 l-9 24 h-118 Z',fill:'url(#'+aid+'wood)',
    stroke:'#33240F','stroke-width':'2','stroke-linejoin':'round'}));
  [0,1,2].forEach(function(gr){
    svg.appendChild(S('path',{d:'M'+(112+gr*44)+' 204 q6 12 -2 22',fill:'none',
      stroke:'#3F2C1D','stroke-width':'1.6',opacity:'.4'}));
  });
  /* the shadow the anvil casts onto its own stump, which is what seats it */
  svg.appendChild(S('ellipse',{cx:174,cy:206,rx:70,ry:6,fill:'#20160E',opacity:'.5'}));
  svg.appendChild(S('rect',{x:102,y:208,width:140,height:5,fill:'#5A626A'}));

  /* the anvil, in four planes, each shaded across the direction it faces */
  svg.appendChild(S('path',{d:'M110 192 h124 l6 12 h-136 Z',fill:'url(#'+aid+'base)',
    stroke:'#20262C','stroke-width':'2','stroke-linejoin':'round'}));
  svg.appendChild(S('path',{d:'M138 172 h68 l14 22 h-96 Z',fill:'url(#'+aid+'body)',
    stroke:'#20262C','stroke-width':'2','stroke-linejoin':'round'}));
  /* the waist's near edge, catching the light */
  svg.appendChild(S('path',{d:'M140 174 l-14 18',fill:'none',stroke:'#B6C2CE','stroke-width':'2.5',opacity:'.3'}));
  svg.appendChild(S('path',{d:'M104 170 h136 l-16 6 h-104 Z',fill:'#3E464F'}));
