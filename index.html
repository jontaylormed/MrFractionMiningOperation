<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr Factor's Mining Operation</title>
<meta name="description" content="Break ore apart until what is left will not break, then pour that metal into a mold and craft a tool. Factoring and prime factorisation as one act.">
<style>
/* =========================================================================
   MR FACTOR'S MINING OPERATION - v1, the Ore Cart
   One file. No dependencies. No build step. Runs from file:// and Pages.
   Specification: docs/MINE-SPEC.md. The spec is authoritative.

   THE METAPHOR, and it is load-bearing rather than decorative:
     ore     = any expression (number, monomial, binomial, trinomial)
     SMELT   = factor      - ore separates into its constituents
     ingot   = an irreducible: a prime, or an irreducible polynomial.
               The SAME OBJECT. That is the whole thesis of the site.
     mold    = distribute  - metals go in, one formed object comes out
     POUR    = the check. A clean casting or a visibly deformed one.
               This is the ONLY correctness signal in the build.

   Palette contrast, MEASURED in-browser on a settled page, not estimated:
     --ink    #2A2119 on --paper #FDF8F0 = 14.93:1
     --ore-t  #8F4712 on --paper         =  6.45:1   small text
     --vein   #1F5C4F on --paper         =  7.35:1   small text
     --ore    #C96A1F on --paper         =  3.57:1   FILLS AND BORDERS ONLY
   ========================================================================= */
:root{
  --paper:#FDF8F0; --paper-2:#F5EDDF; --paper-3:#EDE1CD;
  --ink:#2A2119; --ink-soft:#5A4B3A;
  --tan:#C8B89A; --rule:#D9C9AC;
  --ore:#C96A1F; --ore-t:#8F4712; --lamp:#E8A33D;
  --rock:#3A3129; --rock-2:#4A3F34; --rock-3:#2E2620;
  --vein:#1F5C4F; --vein-lite:#2E7D6B;
  --molten:#E2600F; --molten-2:#FFB347;
  --ingot:#6E7B87; --ingot-lite:#AEBAC6;
  --twin:#5B3E8C; --loaded:#1E5A86; --pure:#8C6A1F;
  --tile-sq:#CFE0EF; --tile-sq-ink:#1E4C74;
  --tile-x:#F6DCB8;  --tile-x-ink:#8F4712;
  --tile-k:#CFE6DC;  --tile-k-ink:#1F5C4F;
  --display:'Black Han Sans','Arial Black',Impact,system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',Verdana,Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.55}
h1,h2,h3,h4{font-family:var(--display); font-weight:400; margin:0}
p{margin:0 0 .7em}
sup{font-size:.62em}

/* ---------- ambient: dust + lamplight, non-informational ---------- */
#ambient{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
#ambient .mote{position:absolute; border-radius:50%; background:var(--tan); opacity:.10; animation:drift linear infinite}
#ambient .lamp{position:absolute; top:-160px; left:50%; width:640px; height:520px; margin-left:-320px;
  background:radial-gradient(ellipse at 50% 0%, rgba(232,163,61,.13), rgba(232,163,61,0) 68%);
  transform-origin:50% 0%; animation:sway 11s ease-in-out infinite}
@keyframes drift{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(22px,-120vh,0)}}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
@media (prefers-reduced-motion:reduce){
  #ambient .mote,#ambient .lamp{animation:none !important}
  *{animation-duration:.001s !important; transition-duration:.001s !important}
}

/* ---------- shell ---------- */
header.top{position:relative; z-index:2; background:linear-gradient(180deg,var(--rock-2) 0%, var(--rock) 62%, var(--rock-3) 100%);
  color:#F7EEDD; border-bottom:5px solid var(--ore)}
.top-in{max-width:1240px; margin:0 auto; padding:12px 18px; display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.top h1{font-size:clamp(19px,2.6vw,27px); color:#FFF3DE; line-height:1.05}
.top .tagline{font-size:13px; color:#E4D5BB}
.top .spacer{flex:1 1 auto}
.navbtn{font-family:var(--body); font-size:14px; padding:9px 14px; min-height:44px; cursor:pointer;
  border-radius:9px; border:2px solid #6B5B48; background:transparent; color:#F0E2C8}
.navbtn:hover{border-color:var(--lamp); color:#FFF3DE}
.navbtn[aria-current=page]{background:var(--lamp); border-color:var(--lamp); color:#3A2A10}
.wrap{position:relative; z-index:1; max-width:1240px; margin:0 auto; padding:22px 18px 90px}
/* #screen is focused after every navigation so a screen reader announces the
   new view. That drew the browser's default ring around the ENTIRE page.
   :focus-visible keeps the ring for real keyboard focus and drops it for the
   programmatic call - removing it outright would cost keyboard users. */
#screen:focus:not(:focus-visible){outline:none}

/* ---------- generic ---------- */
.panel{background:var(--paper-2); border:2px solid var(--rule); border-radius:14px; padding:18px; margin:16px 0}
.panel.light{background:#FFFCF6; border-color:var(--tan)}
.panel-tag{display:inline-block; font-family:var(--display); font-size:12px; letter-spacing:.12em;
  padding:3px 10px; border-radius:6px; margin-bottom:10px; background:var(--rock); color:var(--lamp)}
.panel-tag.play{background:var(--lamp); color:#3A2A10}
.hint{font-size:14px; color:var(--ink-soft)}
.lede{max-width:70ch; color:var(--ink-soft)}
.btn{font-family:var(--body); font-size:15px; padding:11px 18px; min-height:44px; cursor:pointer;
  border-radius:10px; border:2px solid var(--tan); background:var(--paper); color:var(--ink)}
.btn:hover{border-color:var(--ore)}
.btn.primary{background:var(--ore-t); border-color:var(--ore-t); color:#FFF7EA; font-family:var(--display); letter-spacing:.04em}
.btn.primary:hover{background:#6E360D; border-color:#6E360D}
.btn.big{font-size:19px; padding:16px 26px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
input[type=text],input[type=number]{font-family:var(--body); font-size:17px; padding:10px 12px; min-height:44px;
  border:2px solid var(--tan); border-radius:10px; background:#fff; color:var(--ink); max-width:100%}
input:focus{outline:3px solid var(--lamp); outline-offset:1px; border-color:var(--ore)}
input[type=range]{width:100%; accent-color:var(--ore); height:44px}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.grow{flex:1 1 auto}
.eq{font-family:var(--display); font-size:clamp(20px,3vw,30px); line-height:1.5; margin:8px 0}
.eq.sm{font-size:clamp(17px,2.2vw,22px)}
.eq .op{color:var(--ore-t); padding:0 .12em}
.eq .dim{color:var(--ink-soft); opacity:.75}
.stage{background:#fff; border:2px solid var(--rule); border-radius:12px; padding:10px; overflow-x:auto}
.stage svg{display:block; width:100%; max-width:520px; height:auto; margin:0 auto}
.model-cap{font-size:14px; color:var(--ink-soft); text-align:center; max-width:60ch; margin:6px auto 2px}
.note{border-left:6px solid var(--tan); background:#fff; padding:12px 15px; border-radius:0 11px 11px 0; margin:12px 0; font-size:15px}
.note.good{border-left-color:var(--vein); background:#F1F8F5}
.note.warn{border-left-color:var(--lamp); background:#FFF9EC}
.note.bad{border-left-color:var(--molten); background:#FDF0E7}
.note b{font-family:var(--display); font-weight:400}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---------- load screen ---------- */
#loadscreen{position:fixed; inset:0; z-index:50; background:linear-gradient(180deg,var(--rock-2),var(--rock-3));
  color:#F7EEDD; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px; padding:24px; text-align:center}
#loadscreen.gone{display:none}
#loadscreen h2{font-size:clamp(24px,5vw,40px); color:#FFF3DE}
#loadscreen .sub{max-width:52ch; color:#E4D5BB; font-size:15px}
.loadbar{width:min(420px,80vw); height:16px; border:2px solid var(--lamp); border-radius:999px; overflow:hidden; background:#241D18}
.loadbar i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--molten),var(--molten-2)); transition:width .25s linear}
.loadticker{font-size:13px; color:var(--lamp); min-height:1.4em; font-family:var(--display); letter-spacing:.06em}

/* ---------- home ---------- */
.hero{display:flex; gap:22px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.cards{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); margin-top:8px}
.card{background:#fff; border:2px solid var(--rule); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:8px}
.card h3{font-size:19px}
.card .why{font-size:14px; color:var(--ink-soft); flex:1 1 auto}
/* the "To forge it" line is pushed to the foot of every card, so four cards of
   different description lengths still line their instructions and buttons up */
.card .hint{margin-top:auto}
.card .go{align-self:flex-start}
.card.locked{opacity:.72; background:var(--paper-2)}
.tagline-pill{display:inline-block; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  border:2px solid var(--tan); color:var(--ore-t); border-radius:999px; padding:3px 11px}

/* ---------- mine layout ---------- */
.minegrid{display:grid; grid-template-columns:230px minmax(0,1fr) 240px; gap:18px; align-items:start}
/* minmax(0,1fr), NOT 1fr: a bare 1fr column has min-width:auto and grows to
   fit its widest child, so the 2280px seam stretched the whole page sideways
   in the single-column layout instead of scrolling inside its viewport. */
/* On one column the rock face comes FIRST. The shaft is tall - five layers and
   four unopened ones - so stacked above the face it pushed the seam and its
   inspect panel about 1600px down the page: clicking a lump worked perfectly
   and produced no visible response, because the panel that answers was far
   below the fold. The work goes at the top; navigation follows it. */
@media (max-width:1080px){
  .minegrid{grid-template-columns:minmax(0,1fr)}
  .minegrid > *:nth-child(2){order:-1}
}
.minegrid > *{min-width:0}

/* ---- THE FORGE: orders on the left, the yard and the mold on the right.
       Same rule as the mine on one column - the WORK goes first and the list
       of what could be made follows it, because a seven-item board stacked on
       top pushes the mold below the fold. ---- */
.forgegrid{display:grid; grid-template-columns:290px minmax(0,1fr); gap:18px; align-items:start}
@media (max-width:980px){
  .forgegrid{grid-template-columns:minmax(0,1fr)}
  .forgegrid > *:nth-child(2){order:-1}
}
.forgegrid > *{min-width:0}
.orderboard{position:sticky; top:12px; background:linear-gradient(180deg,#3A3129,#241C15);
  border:3px solid #1B1511; border-radius:14px; padding:13px 11px 14px;
  box-shadow:inset 0 8px 22px rgba(0,0,0,.5)}
@media (max-width:980px){ .orderboard{position:static} }
.orderboard h3{font-size:14px; letter-spacing:.09em; text-transform:uppercase; color:var(--lamp); margin-bottom:4px}
.orderboard > .hint{color:#D9C39C; margin-bottom:9px}
/* an order is a card hung on the board, not a row in a table */
.order{position:relative; display:flex; gap:10px; align-items:center; width:100%; text-align:left;
  cursor:pointer; border:2px solid #6B5B48; border-radius:10px; padding:9px 11px; margin:0 0 7px;
  min-height:44px; font-family:var(--body); color:#F0E2C8;
  background:linear-gradient(180deg,#463A2E,#3A3129)}
.order:hover{border-color:var(--lamp); background:linear-gradient(180deg,#55432F,#463A2E)}
.order:focus-visible{outline:3px solid var(--lamp); outline-offset:2px}
.order .oic{font-size:21px; line-height:1; flex:0 0 auto}
.order .otx{display:flex; flex-direction:column; gap:1px; min-width:0}
.order .onm{font-family:var(--display); font-size:15px; color:#FFF3DE}
.order .ost{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:#C9B695}
.order.ready .ost{color:#8FE0C0}
.order.short{opacity:.82}
.order.short .ost{color:#E8B87A}
.order.made{background:linear-gradient(180deg,#2E3B34,#25302B); border-color:#3F6B58}
.order.made .ost{color:#8FE0C0}
.order.made:after{content:"\2713"; position:absolute; right:11px; top:50%; transform:translateY(-50%);
  color:#8FE0C0; font-size:17px}
.order[aria-current=true]{border-color:var(--lamp); box-shadow:0 0 0 2px rgba(232,163,61,.5)}

/* metal on the rack, as something you pick up */
.metalbtn{position:relative; display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  background:linear-gradient(170deg,#E6ECF2 0%,#BFC9D3 58%,#9DA9B5 100%);
  color:#141B22; border:0; padding:9px 13px 10px 11px; margin:2px; min-height:44px;
  clip-path:polygon(10% 0%, 92% 3%, 100% 42%, 94% 92%, 40% 100%, 4% 88%, 0% 34%);
  font-family:var(--display); font-size:14px;
  filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}
.metalbtn:before{content:""; width:11px; height:11px; flex:0 0 auto;
  background:linear-gradient(150deg,#8A7358,#4A3F34);
  clip-path:polygon(20% 6%, 78% 0%, 100% 40%, 86% 88%, 40% 100%, 4% 70%, 0% 28%)}
.metalbtn.pure{background:linear-gradient(160deg,#F2DCA4,#C8A24B); color:#2E2208}
.metalbtn.pure:before{background:linear-gradient(150deg,#F2DCA4,#A5811F)}
.metalbtn:hover{filter:brightness(1.1) drop-shadow(0 2px 1px rgba(0,0,0,.45))}
.metalbtn:focus-visible{outline:3px solid var(--lamp); outline-offset:2px}
/* already in the mold: still there, still readable, plainly not available */
.metalbtn.spent{opacity:.4; cursor:default}
/* rock in the forge's yard is shown and is NOT a button - the furnace will
   not take it, and a control that looks live and refuses is worse than a
   thing that plainly is not one */
.heaprock.cold{cursor:default; opacity:.72}

.craft{margin-top:16px}
.crafthead{display:flex; gap:9px; align-items:center; font-family:var(--display); font-size:20px; margin-bottom:6px}
.crafthead .ci{font-size:24px}
.coldmold{font-family:var(--display); font-size:19px; color:var(--ink-soft);
  background:var(--paper-3); border:2px dashed var(--tan); border-radius:12px;
  padding:20px; text-align:center; margin-bottom:12px}
.moldslot{min-width:78px; text-align:center}
/* the object the mold is cut for: the question, at the size of a question */
.castfor{background:linear-gradient(180deg,#FFF6E3,#FBEBCB); border:3px solid var(--lamp);
  border-radius:12px; padding:12px 15px 13px; margin-bottom:12px}
/* #8F6410 measured 4.46:1 against the plate and the sweep failed the build by
   four hundredths. #7F570B is 5.98:1. */
.castfor .cflab{font-family:var(--display); font-size:11px; letter-spacing:.11em; color:#7F570B}
.castfor .cfeq{font-family:var(--display); font-size:clamp(26px,4.4vw,38px); color:#4A3410; line-height:1.1; margin:2px 0 5px}
.castfor .cfwhy{font-size:14px; color:#5A4B2A}
/* the target on an order card, so the board reads as seven objects to make */
.order .ocast{font-size:12px; color:#FFE0A8; font-family:var(--display); letter-spacing:.02em}
.order.made .ocast{color:#A8D8C4}

/* the shaft / layers */
.shaft{position:sticky; top:12px}
@media (max-width:1080px){ .shaft{position:static} }
/* THE SHAFT IS A SHAFT: rock walls, timber sets, a ladder running the whole
   drop, and a cage on a cable that rides to whichever layer you are working. */
.shaftbody{display:flex; gap:10px; align-items:stretch}
.shaftway{position:relative; flex:0 0 58px; border-radius:8px; overflow:hidden;
  background:
    repeating-linear-gradient(180deg, rgba(0,0,0,.16) 0 2px, transparent 2px 15px),
    linear-gradient(90deg,#2E2620 0 8px,#4A3B2C 8px 50px,#2E2620 50px 58px);
  box-shadow:inset 0 0 18px rgba(0,0,0,.55)}
/* timber sets: uprights down both sides, crossbeams every so often */
.shaftway:before{content:""; position:absolute; top:0; bottom:0; left:7px; width:7px;
  background:linear-gradient(90deg,#6B5335,#4A3524)}
.shaftway:after{content:""; position:absolute; top:0; bottom:0; right:7px; width:7px;
  background:linear-gradient(90deg,#4A3524,#6B5335)}
.shaftway .sets{position:absolute; inset:0;
  background:repeating-linear-gradient(180deg, transparent 0 62px, #5A4432 62px 69px)}
/* the ladder */
.shaftway .ladder{position:absolute; top:0; bottom:0; left:23px; width:22px;
  background:
    repeating-linear-gradient(180deg, transparent 0 9px, #8A6A45 9px 13px),
    linear-gradient(90deg,#7A5B3A 0 4px, transparent 4px 18px, #7A5B3A 18px 22px)}
/* the cable and the cage that rides it */
.shaftway .cable{position:absolute; top:0; left:33px; width:3px; background:#C8B89A; opacity:.55}
/* the cage RIDES. 1.5s, easing in off the rest and settling out at the far
   end, because a winding engine takes up the slack before it moves a load and
   eases it in again at the level - a snap between floors reads as a menu. */
.shaftway .cage{position:absolute; left:12px; width:34px; height:40px; border-radius:3px;
  background:linear-gradient(180deg,#8A9AA6,#5E6A76); border:2px solid #3E474F;
  box-shadow:0 3px 0 rgba(0,0,0,.4);
  transition:top 1.5s cubic-bezier(.45,.02,.35,1)}
.shaftway .cable{transition:height 1.5s cubic-bezier(.45,.02,.35,1)}
.shaftway .cage:before{content:""; position:absolute; inset:5px 4px; border-radius:2px;
  background:repeating-linear-gradient(90deg,#46505A 0 3px,transparent 3px 7px)}
.shaftway .cage:after{content:""; position:absolute; left:13px; top:-9px; width:8px; height:9px; background:#3E474F}
@media (prefers-reduced-motion:reduce){ .shaftway .cage{transition:none} }
/* THE WHOLE SHAFT IS UNDERGROUND. The layer list is not a menu beside the
   mine - it is the mine, seen in section, and each level is a gallery cut
   into the rock with its own timber and its own lamp. */
.shaft{background:linear-gradient(180deg,#3A3129 0%,#241C15 100%);
  border:3px solid #1B1511; border-radius:14px; padding:14px 12px 16px;
  box-shadow:inset 0 8px 22px rgba(0,0,0,.55)}
.shaft h3{font-size:14px; letter-spacing:.09em; text-transform:uppercase; color:var(--lamp); margin-bottom:6px}
.shaft .rail-note, .shaft > .hint{color:#D9C39C}
.shaft h3, .shaft > .hint{padding:0 2px}
/* a gallery cut into the rock: timber on the left, rock behind, a lamp that
   only burns on the level you are actually working */
/* The timber is a separate strip, NOT a stop in the button's own gradient.
   As a gradient stop it was the palest colour on the element, so every
   contrast reading measured the text against wood it does not sit on and
   four labels failed at 2.9-4.0. The rock behind the words is now flat. */
.layer{position:relative; display:block; width:100%; text-align:left; cursor:pointer;
  border:0; border-radius:0 8px 8px 0; padding:10px 12px 11px 26px; margin:0 0 6px;
  font-family:var(--body); font-size:14px; color:#F0E2C8; min-height:44px;
  background:linear-gradient(180deg,#3A3129,#332B24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 2px 0 rgba(0,0,0,.35)}
.layer:after{content:""; position:absolute; left:0; top:0; bottom:0; width:11px;
  background:linear-gradient(90deg,#6B5335 0 7px,#4A3B2C 7px 11px)}
.layer:before{content:""; position:absolute; left:15px; top:13px; width:7px; height:7px; border-radius:50%;
  background:#5A4B3C; z-index:1; transition:background .3s ease, box-shadow .3s ease}
.layer:hover{background:linear-gradient(180deg,#46392E,#3C3227)}
.layer[aria-current=true]{color:#FFF3DE; background:linear-gradient(180deg,#55432F,#4A3A28)}
.layer[aria-current=true]:after{background:linear-gradient(90deg,#8A6A45 0 7px,#5A4432 7px 11px)}
.layer[aria-current=true]:before{background:var(--lamp); box-shadow:0 0 9px 3px rgba(232,163,61,.55)}
/* brighter than --lamp and than the old grey: the gallery gradient includes a
   pale timber stop, and both measured under 4.5 against it (3.34 and 3.63) */
.layer .n{font-family:var(--display); font-size:11px; letter-spacing:.08em; color:#FFD79A; display:block}
.layer .hint{color:#E8DCC4; font-size:12px}
.layer[aria-current=true] .hint{color:#E4D5BB}
/* boarded up: not yet timbered, so the gallery is planked over */
/* boarded up, but still readable: these name where the mine goes next, and at
   2.92:1 they were decoration rather than information */
.layer.shut{cursor:not-allowed; color:#C7B6A0;
  background:repeating-linear-gradient(115deg,#3A2E24 0 9px,#332821 9px 18px)}
.layer.shut:after{background:linear-gradient(90deg,#4A3B2C 0 7px,#3A2E24 7px 11px)}
.layer.shut:before{background:#3A3129; box-shadow:none}
.layer.shut .n{color:#B9A489}
.layer.shut .hint{color:#B5A88F}

/* the wall */
.wall{background:linear-gradient(180deg,#5A4B3C,#3A3129); border:3px solid var(--rock-3); border-radius:14px;
  padding:18px; color:#F0E2C8; position:relative; overflow:hidden}
.wall h3{color:#FFE9C4; font-size:20px}
/* #F2E6D0, not #D9C39C: layer 1 is the LIGHTEST rock in the mine, and the
   dimmer cream measured 3.82:1 against it while passing on every dark layer.
   Text that clears on four palettes and fails on the fifth still fails. */
.wall .depthline{font-size:13px; color:#F2E6D0; margin-bottom:10px}
/* .hint is --ink-soft, which is a dark-on-cream colour. Inside the wall and
   the crucible it lands on near-black and disappears, so it is re-set here.
   Measured after the fix: #D9C39C on #45392F = 6.9:1. */
.wall .hint, .crucible .hint{color:#D9C39C}
.wall .facegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:7px; margin:12px 0}
.rockbit{aspect-ratio:1; border-radius:8px; background:linear-gradient(150deg,#6B5A47,#4A3F34); border:1px solid #2E2620}
.rockbit.glint{background:linear-gradient(150deg,#8A6E45,#5A4A38); box-shadow:inset 0 0 0 2px rgba(232,163,61,.55)}

/* cart / bench / yard */
.cart{display:flex; flex-direction:column; gap:7px; max-height:340px; overflow-y:auto}
.lump{display:flex; gap:9px; align-items:center; width:100%; text-align:left; cursor:pointer;
  background:#fff; border:2px solid var(--tan); border-radius:11px; padding:9px 11px; min-height:44px;
  font-family:var(--body); font-size:16px; color:var(--ink)}
.lump:hover{border-color:var(--ore)}
.lump[aria-current=true]{border-color:var(--ore); background:#FFF6EA}
/* an ore chunk, not a rounded square: clipped to an irregular lump */
.lump .glyph{width:26px; height:26px; flex:0 0 auto; background:linear-gradient(150deg,#8A7358,#4A3F34);
  clip-path:polygon(22% 4%, 74% 0%, 100% 38%, 88% 86%, 44% 100%, 6% 74%, 0% 30%);
  box-shadow:inset -3px -3px 6px rgba(0,0,0,.4)}
/* the cart the lumps are sitting in */
.cartbody{position:relative; background:linear-gradient(180deg,#5E6A76,#3E474F);
  border:3px solid #2A3138; border-radius:4px 4px 14px 14px; padding:12px 12px 16px; margin-top:6px}
.cartbody:before{content:""; position:absolute; left:0; right:0; top:-3px; height:8px;
  background:linear-gradient(180deg,#8A9AA6,#66727E); border-radius:3px 3px 0 0}
.cartwheels{display:flex; justify-content:space-around; margin:-6px 10px 0}
.cartwheels i{display:block; width:22px; height:22px; border-radius:50%;
  background:radial-gradient(circle at 40% 38%, #6E7A86 0 26%, #2E353C 28%); border:2px solid #1E242A}
.cartrail{height:6px; margin:2px 0 0; border-radius:3px;
  background:repeating-linear-gradient(90deg,#5A4B3C 0 12px, #3A3129 12px 18px)}
.lump .txt{font-family:var(--display); font-size:17px}
.lump .lay{font-size:11px; color:var(--ink-soft); margin-left:auto; letter-spacing:.06em}

/* THE BENCH IS A PLACE, not a card: sawn timber with the grain running along
   it, iron banding at the edge, and a rack on the wall above holding whatever
   the student has actually forged. */
.bench{
  position:relative; border:3px solid #4A3524; border-radius:14px; padding:16px 16px 18px;
  background:
    repeating-linear-gradient(90deg, rgba(74,53,36,.10) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(180deg, rgba(74,53,36,.16) 0 1px, transparent 1px 26px),
    linear-gradient(180deg,#DDB88A,#C79A66);
  background-color:#D3A877;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.18), inset 0 -8px 18px rgba(58,40,26,.34);
}
.bench > *{position:relative; z-index:1}
.bench:before{content:""; position:absolute; left:0; right:0; top:0; height:9px;
  background:linear-gradient(180deg,#6E5B49,#4A3524); border-radius:11px 11px 0 0}
/* timber is a mid-tone, so body text on it has to go darker than --ink-soft:
   the default measured 3.95:1 on the darker end of the grain */
.bench .eq{color:#2E2013}
.bench .hint{color:#3A2A18}
.bench .stepstrip .st{background:#E8D6BE; border-color:#8A6A4A}
.toolrack{display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  background:linear-gradient(180deg,#5A4432,#42301F); border:2px solid #332416;
  border-radius:10px; padding:8px 10px; margin:2px 0 12px}
.toolrack .rk{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#FFCB7A; margin-right:2px}
.toolrack .tl{display:inline-flex; align-items:center; gap:6px; background:#2E2620; border:2px solid #6B5B48;
  border-radius:8px; padding:5px 10px; color:#F0E2C8; font-size:13px}
.toolrack .tl .ic{font-size:15px}
.toolrack .empty{color:#C0AC90; font-size:13px; font-style:italic}
.stepstrip{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap}
.stepstrip .st{flex:1 1 100px; border:2px solid var(--rule); border-radius:10px; padding:7px 9px; background:var(--paper-2); min-width:96px}
.stepstrip .st b{font-family:var(--display); font-weight:400; font-size:13px; letter-spacing:.08em; display:block; color:var(--ink-soft)}
.stepstrip .st .s{font-size:12px; color:var(--ink-soft)}
.stepstrip .st.on{background:var(--lamp); border-color:var(--lamp)}
.stepstrip .st.on b,.stepstrip .st.on .s{color:#3A2A10}
.stepstrip .st.done{background:#F1F8F5; border-color:var(--vein)}
.stepstrip .st.done b{color:var(--vein)}

.choices{display:grid; gap:9px; margin:10px 0}
.choice{position:relative; text-align:left; padding:13px 15px 13px 46px; min-height:44px; border:2px solid var(--tan);
  border-radius:11px; background:#fff; cursor:pointer; font-family:var(--body); font-size:16px; color:var(--ink)}
.choice:hover{border-color:var(--ore)}
.choice:before{content:""; position:absolute; left:13px; top:50%; transform:translateY(-50%); width:22px; height:22px;
  border-radius:50%; border:2px solid var(--tan); font-family:var(--display); font-size:14px; line-height:19px; text-align:center}
.choice[data-result=yes]{border-color:var(--vein); background:#F1F8F5}
.choice[data-result=yes]:before{content:"\2713"; background:var(--vein); border-color:var(--vein); color:#fff}
.choice[data-result=no]{border-color:var(--molten); background:#FDF0E7}
.choice[data-result=no]:before{content:"\21BA"; background:var(--molten); border-color:var(--molten); color:#fff}
.choice .why{display:none}
.choice[data-result] .why{display:block; font-size:14px; color:var(--ink-soft); margin-top:5px}

/* crucible + ingots */
.crucible{background:linear-gradient(180deg,#3A3129,#241D18); border:3px solid var(--rock-3); border-radius:14px; padding:14px; color:#F0E2C8}
.crucible h4{color:#FFE9C4; font-size:16px; margin-bottom:8px}
.ingotrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.ingot{background:linear-gradient(160deg,var(--ingot-lite),var(--ingot)); color:#16202A; border:2px solid #55606B;
  border-radius:7px 7px 10px 10px; padding:9px 14px; font-family:var(--display); font-size:19px; min-width:64px; text-align:center}
.ingot.pure{background:linear-gradient(160deg,#F2DCA4,#C8A24B); border-color:#8A6A2A; color:#2E2208}
.slotwrap{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.slot{background:#241D18; border:2px dashed #6B5B48; border-radius:10px; padding:9px 11px; color:#E4D5BB}
.slot label{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--lamp); margin-bottom:4px}
.slot input{width:66px; text-align:center; font-family:var(--display); font-size:18px; padding:7px 6px; min-height:44px}
.slot .paren{font-family:var(--display); font-size:22px; color:#E4D5BB; padding:0 2px}

/* ---- the breaking floor: rock on one side of a swing, metal on the other.
       A piece must SAY which it is without being read - rock is dark and
       knocked about, native metal is a cast bar with a lit edge. ---- */
.floorbox{position:relative; overflow:hidden;
  background:linear-gradient(180deg,#3A3129,#241D18); border:3px solid var(--rock-3);
  border-radius:14px; padding:14px; color:#F0E2C8}
/* the corner of the mine this happens in, drawn along the top and inert */
.anvilart{position:absolute; left:0; right:0; top:0; height:64px; pointer-events:none; opacity:.55}
.anvilart svg{display:block; width:100%; height:64px}
.anvilart svg *{pointer-events:none}
@keyframes anvillamp{0%,100%{opacity:.82}40%{opacity:1}75%{opacity:.66}}
.anvilglow{animation:anvillamp 3.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){ .anvilglow{animation:none} }
.floorbox > *{position:relative; z-index:1}
.floorbox h4{color:#FFE9C4; font-size:16px; margin-bottom:9px}
.pieces{display:flex; gap:10px; flex-wrap:wrap; align-items:stretch}
.piece{display:flex; flex-direction:column; gap:2px; align-items:center; cursor:pointer;
  font-family:var(--body); padding:10px 15px; min-height:44px; min-width:78px;
  border:2px solid transparent; border-radius:8px; position:relative}
.piece .pv{font-family:var(--display); font-size:19px; line-height:1.15}
.piece .pt{font-size:10px; letter-spacing:.08em; text-transform:uppercase; opacity:.8}
/* still rock: the same knocked-corner silhouette the seam and the cart use */
.piece.rock{background:linear-gradient(160deg,#7A6650,#4A3F34); color:#FFF3DE; border-color:#2E2620;
  clip-path:polygon(7% 6%, 78% 0%, 100% 26%, 95% 82%, 62% 100%, 14% 94%, 0% 46%)}
.piece.rock:hover{filter:brightness(1.18)}
/* native metal: a cast bar, the same gold as a pure ingot elsewhere */
.piece.native{background:linear-gradient(160deg,#F2DCA4,#C8A24B); color:#2E2208; border-color:#8A6A2A;
  border-radius:7px 7px 10px 10px; cursor:default}
.piece.native .pt{color:#6B4E12; opacity:1}
/* under the pick: the lamp ring, the same one the seam uses for a chosen lump */
.piece.under{box-shadow:0 0 0 3px var(--lamp), 0 0 12px 3px rgba(232,163,61,.4)}
.piece:focus-visible{outline:3px solid var(--lamp); outline-offset:2px}
@keyframes piecedrop{from{opacity:0; transform:translateY(-13px) scale(.88)}to{opacity:1; transform:translateY(0) scale(1)}}
.piece.fresh{animation:piecedrop 420ms cubic-bezier(.2,.8,.3,1) 1}
@keyframes pieceknock{0%{transform:translateY(0) scale(1)}34%{transform:translateY(2px) scale(.95)}
  70%{transform:translateY(-1px) scale(1.03)}100%{transform:translateY(0) scale(1)}}
.piece.knock{animation:pieceknock 280ms cubic-bezier(.3,1.4,.4,1) 1}

/* ---- THE ANVIL AND THE HAMMER ----
       You type the factor into the hammer head and bring it down on the lump.
       The head is a real box holding real inputs, so it sizes to them and it
       is your factor that comes down - not a picture of one. ---- */
.cutbar{background:#241D18; border:2px dashed #6B5B48; border-radius:12px; padding:12px 14px; margin-top:12px; color:#E4D5BB}
.cutbar .cutlab{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--lamp); margin-bottom:3px}
.cutbar .eq{color:#FFF3DE; margin-bottom:4px}
.cutbar .hint{color:#C9B695}
.cutbar input{width:66px; text-align:center; font-family:var(--display); font-size:18px; padding:7px 6px; min-height:44px}
/* #3A3129 on the old darker plate measured 2.3:1, and NO dark text can reach
   4.5 on a #5E6A76 ground - the plate had to get lighter, not the ink darker.
   This is the same polished steel the yard's metal chips already pass on. */
.cutbar .paren{font-family:var(--display); font-size:22px; color:#2A3138; padding:0 2px}

/* the whole anvil scene, hammer included, is one drawing now - the hammer used
   to be a CSS box floating over the svg because it held the input boxes */
.anvilstage{position:relative; width:100%; display:flex; flex-direction:column; align-items:center;
  padding:0; overflow:visible}
.anvilsvg{width:100%; max-width:340px}
.anvilsvg svg{display:block; width:100%; height:auto; overflow:visible}
.anvilsvg svg *{pointer-events:none}

/* ---- what you cut the head to ---- */
.hrow{display:flex; align-items:center; justify-content:center; gap:9px; flex-wrap:wrap; margin-top:4px}
.hlab{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--lamp)}
.hbox{display:inline-flex; align-items:center; gap:3px;
  background:linear-gradient(180deg,#E6ECF2 0%,#C4CED8 52%,#9DA9B5 100%);
  border:3px solid #2A3138; border-radius:8px; padding:6px 11px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.5), inset 0 -4px 0 rgba(0,0,0,.22), 0 3px 0 rgba(0,0,0,.34)}
.hbox input{width:62px; text-align:center; font-family:var(--display); font-size:19px;
  padding:6px 5px; min-height:44px}
.hbox .paren{font-family:var(--display); font-size:22px; color:#2A3138; padding:0 2px}
.hecho{font-size:13px; color:#C9B695; margin-top:8px; text-align:center}
.hecho b{font-family:var(--display); font-size:17px; color:#FFE9C4}
.hecho .bad{color:#FFB37A}

/* ---- THE SWING ----
   The hammer is part of the drawing now, so it rotates about the HAND at
   (176,10) in the scene's own coordinates - a real arc, not a box being
   translated. It rests LEANING BACK at −20°, which it can do because the
   input boxes are no longer riveted to the head and do not have to stay
   level: a hammer held ready is not a hammer lying flat.

   AND IT IS SLOW. 640ms was one blur and the burst was over before you had
   found it. 1300ms, with the wind-up eased and HELD at the top for a beat of
   anticipation, the strike quick, and the head resting on the face after it
   lands. Everything else on the beat is timed to the same 1300ms and to the
   same 56% - the impact - so the anvil shudder, the rock squash, the burst and
   the new pieces all land together instead of drifting apart. */
@keyframes hammerarc{
  0%{transform:rotate(-20deg)}
  8%{transform:rotate(-25deg)}
  30%{transform:rotate(-58deg)}
  40%{transform:rotate(-59deg)}       /* held at the top */
  56%{transform:rotate(6deg)}         /* THE STRIKE */
  62%{transform:rotate(4deg)}
  74%{transform:rotate(3deg)}         /* resting on the face */
  88%{transform:rotate(-26deg)}
  100%{transform:rotate(-20deg)}
}
@keyframes hammerbounce{
  0%{transform:rotate(-20deg)}
  8%{transform:rotate(-25deg)}
  30%{transform:rotate(-58deg)}
  40%{transform:rotate(-59deg)}
  55%{transform:rotate(5deg)}
  63%{transform:rotate(-30deg)}       /* straight back off the face */
  72%{transform:rotate(-8deg)}
  82%{transform:rotate(-28deg)}
  100%{transform:rotate(-20deg)}
}
.anvilstage[data-anim] .hammerswing{transform-origin:176px 10px;
  animation:hammerarc 1300ms cubic-bezier(.36,0,.5,1) 1}
.anvilstage[data-anim=glance] .hammerswing{animation-name:hammerbounce}
/* the hammer stands leaning back when nothing is happening */
.hammerswing{transform-origin:176px 10px; transform:rotate(-20deg)}
/* the anvil takes it, on the beat and not before */
@keyframes anvilhit{0%,54%{transform:translate(0,0)}
  58%{transform:translate(-3px,3px)}64%{transform:translate(3px,-2px)}
  70%{transform:translate(-2px,1px)}76%{transform:translate(1px,0)}100%{transform:translate(0,0)}}
.anvilstage[data-anim] .anvilsvg{animation:anvilhit 1300ms ease-out 1}
@keyframes rockcrack{0%,54%{transform:scale(1)}60%{transform:scale(.88,1.12)}
  70%{transform:scale(1.07,.93)}82%{transform:scale(.98,1.02)}100%{transform:scale(1)}}
.anvilstage[data-anim=hit] .anvilrock{transform-box:fill-box; transform-origin:center bottom;
  animation:rockcrack 1300ms ease-out 1}

/* THE BURST. Comic book: a jagged star and the word, punched in on the beat
   and held long enough to read before it goes. */
.thud{position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
  pointer-events:none; opacity:0; z-index:4}
.thud .tstar{position:absolute; left:50%; top:50%; width:168px; height:168px; margin:-84px 0 0 -84px;
  background:radial-gradient(circle at 50% 50%, #FFD27A 0 34%, #E8A33D 55%, #C96A1F 100%);
  clip-path:polygon(50% 0%,60% 22%,83% 12%,77% 35%,100% 40%,80% 55%,96% 74%,72% 71%,73% 96%,53% 80%,
                    38% 100%,33% 76%,10% 84%,17% 61%,0% 50%,20% 38%,7% 17%,31% 22%,34% 2%)}
.thud .tword{position:relative; font-family:var(--display); font-size:38px; letter-spacing:.03em;
  color:#FFF3DE; paint-order:stroke; -webkit-text-stroke:6px #3A2408; text-shadow:0 4px 0 #7A4A12}
@keyframes thudpop{
  0%,52%{opacity:0; transform:translate(-50%,-50%) scale(.2) rotate(-16deg)}
  58%{opacity:1; transform:translate(-50%,-50%) scale(1.26) rotate(5deg)}
  64%{opacity:1; transform:translate(-50%,-50%) scale(.96) rotate(-3deg)}
  70%{opacity:1; transform:translate(-50%,-50%) scale(1.04) rotate(1deg)}
  86%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg)}
  100%{opacity:0; transform:translate(-50%,-50%) scale(1.1) rotate(0deg)}
}
.floorbox[data-anim] .thud{animation:thudpop 1300ms cubic-bezier(.3,1.5,.5,1) 1}
@keyframes starspin{0%,52%{transform:rotate(0)}100%{transform:rotate(30deg)}}
.floorbox[data-anim] .thud .tstar{animation:starspin 1300ms ease-out 1}
/* a glance is a smaller, colder ring of a word */
.floorbox[data-anim=glance] .thud .tword{font-size:30px; color:#DCE6EE; -webkit-text-stroke:6px #26333D; text-shadow:0 4px 0 #46545F}
.floorbox[data-anim=glance] .thud .tstar{background:radial-gradient(circle at 50% 50%, #E6EEF4 0 34%, #A9B8C4 55%, #6E7E8C 100%)}

/* the pieces are held back so they arrive ON the beat - 56% of 1300ms */
.piece.fresh{animation-delay:728ms; animation-fill-mode:backwards}
/* the lamp in the gallery band overhead */
@keyframes galllamp{0%,100%{opacity:.85}42%{opacity:1}74%{opacity:.66}}
.gallglow{animation:galllamp 4.6s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){
  .anvilstage[data-anim] .hammerswing,.anvilstage[data-anim] .anvilsvg,
  .anvilstage[data-anim] .anvilrock,.floorbox[data-anim] .thud .tstar,.gallglow{animation:none}
  /* the burst still reports the hit, it just does not perform */
  .floorbox[data-anim] .thud{animation:none; opacity:1; transform:translate(-50%,-50%)}
  .piece.fresh{animation-delay:0s}
}

/* casting */
.casting{border-radius:12px; padding:14px; margin-top:12px; border:3px solid}
.casting.clean{border-color:var(--vein); background:#F1F8F5}
.casting.deformed{border-color:var(--molten); background:#FDF0E7}
.casting h4{font-size:18px; margin-bottom:4px}
.casting.clean h4{color:var(--vein)}
.casting.deformed h4{color:#A33E0B}

/* ---- THE YARD AS A PLACE: fenced ground, a lamp on a post, a heap on the
       dirt and metal racked on timber. The drawing is BEHIND the controls and
       inert - the `overlay` group asserts that nothing painted in here can
       take a click meant for a rock. ---- */
/* the background-color is NOT cosmetic - the svg paints over it, but it is the
   only backdrop MF._measureContrast can read, and it is set to the LIGHTEST
   thing the scrimmed drawing puts behind text so the measurement is honest */
/* background-COLOR, not a background shorthand with a gradient in it. The
   shorthand resets background-color to transparent, MF._measureContrast reads
   background-color and would have walked straight past this to the cream panel
   underneath - measuring a backdrop that is not there. The colour is the
   LIGHTEST thing the drawing puts behind text, so the reading is honest; the
   gradient only darkens the dirt below the band. */
.yardplace{position:relative; border:3px solid #241C15; border-radius:12px; overflow:hidden; margin-top:8px;
  background-color:#3C3228;
  background-image:linear-gradient(180deg,rgba(0,0,0,0) 0 76px,rgba(0,0,0,.14) 76px,rgba(0,0,0,.30) 100%)}
/* the band is a fixed 76px at the top; everything below it is dirt drawn in
   CSS, which stretches without a shape in it to distort */
.yardart{position:absolute; left:0; right:0; top:0; height:76px; pointer-events:none}
.yardart svg{display:block; width:100%; height:76px}
.yardart svg *{pointer-events:none}
@keyframes yardlamp{0%,100%{opacity:.8}45%{opacity:1}72%{opacity:.62}}
.yardglow{animation:yardlamp 4.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){ .yardglow{animation:none} }
.yardin{position:relative; z-index:1; padding:11px 12px 13px}
.yardin .ylab{font-family:var(--display); font-size:10px; letter-spacing:.11em; color:var(--lamp); margin-bottom:5px}
.yardin .yempty{font-size:13px; font-style:italic; color:#C9B695; max-width:34ch}
.yardin .yhint{font-size:12px; color:#C9B695; margin-top:6px}
.shelfrow{margin-bottom:13px}
/* timber shelving, drawn in CSS so it grows with what is on it */
.rack{background:linear-gradient(180deg,rgba(90,68,50,.85),rgba(66,48,31,.85)); border:2px solid #332416;
  border-radius:8px; padding:8px; max-height:190px; overflow-y:auto}
.rack .shelf{border-bottom:3px solid #6E5B49; padding-bottom:7px; margin-bottom:7px}
.rack .shelf:last-child{border-bottom:0; margin-bottom:0; padding-bottom:0}
.rack .sh{font-size:11px; color:#E4D5BB; margin-bottom:3px}
/* the heap: rock lying on the dirt, sitting at slightly different heights so
   it reads as tipped rather than filed */
.heap{display:flex; flex-wrap:wrap; gap:5px; align-items:flex-end; padding-top:3px}
.heaprock{cursor:grab; font-family:var(--display); font-size:14px; color:#FFF3DE;
  background:linear-gradient(160deg,#7A6650,#42382C); border:0; padding:8px 12px 9px; margin:0;
  min-height:44px; touch-action:none;
  clip-path:polygon(9% 5%, 76% 0%, 100% 30%, 94% 84%, 58% 100%, 12% 92%, 0% 42%);
  filter:drop-shadow(0 2px 1px rgba(0,0,0,.5))}
.heaprock:nth-child(2n){margin-bottom:5px}
.heaprock:nth-child(3n){margin-bottom:2px}
.heaprock:hover{filter:brightness(1.2) drop-shadow(0 2px 1px rgba(0,0,0,.5))}
.heaprock:active{cursor:grabbing}
.heaprock:focus-visible{outline:3px solid var(--lamp); outline-offset:2px}
/* what is in your hand while you carry it */
.dragghost{position:fixed; z-index:60; pointer-events:none; font-family:var(--display); font-size:15px;
  color:#FFF3DE; background:linear-gradient(160deg,#7A6650,#42382C); border:2px solid var(--lamp);
  border-radius:6px; padding:6px 11px; box-shadow:0 5px 14px rgba(0,0,0,.45); opacity:.94}
.dragghost[data-over=yes]{border-color:#8FE0C0; box-shadow:0 0 0 3px rgba(143,224,192,.35), 0 5px 14px rgba(0,0,0,.45)}
/* and where it can go */
.floorbox[data-drop=open]{outline:3px dashed var(--lamp); outline-offset:3px}

/* yard + gear */
.yard{position:sticky; top:12px}
@media (max-width:1080px){ .yard{position:static} }
.yard h3,.gearbox h3{font-size:14px; letter-spacing:.09em; text-transform:uppercase; color:var(--ore-t); margin-bottom:6px}
.metalrow{display:flex; flex-wrap:wrap; gap:6px}
/* the yard is a RACK of bars, not a list of chips: each metal is a cast bar
   with a lit top edge and a shadow under it, stacked on timber shelving */
.metalrack{background:linear-gradient(180deg,#5A4432,#42301F); border:2px solid #332416;
  border-radius:11px; padding:10px; max-height:260px; overflow-y:auto}
/* .hint is a dark-on-cream colour; inside the dark rack it measured 1.08:1 */
.metalrack .hint{color:#E4D5BB}
.metalrack .shelf{border-bottom:3px solid #6E5B49; padding-bottom:8px; margin-bottom:8px}
.metalrack .shelf:last-child{border-bottom:0; margin-bottom:0; padding-bottom:0}
/* the bars are LIGHT metal: dark text on the old mid-grey measured 2.27:1,
   which had been true since the chips existed and had never been measured */
/* ORE, not boxes. Each metal is a lump with knocked-off corners sitting in a
   heap, with a chunk of raw rock alongside it - the yard is a place ore is
   collected, and it was reading as a filing cabinet. */
.metal{position:relative; display:inline-flex; align-items:center; gap:7px;
  background:linear-gradient(170deg,#E6ECF2 0%,#BFC9D3 58%,#9DA9B5 100%);
  color:#141B22; border:0; padding:7px 12px 8px 10px;
  clip-path:polygon(10% 0%, 92% 3%, 100% 42%, 94% 92%, 40% 100%, 4% 88%, 0% 34%);
  font-family:var(--display); font-size:14px; margin:2px;
  filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}
.metal:before{content:""; width:11px; height:11px; flex:0 0 auto;
  background:linear-gradient(150deg,#8A7358,#4A3F34);
  clip-path:polygon(20% 6%, 78% 0%, 100% 40%, 86% 88%, 40% 100%, 4% 70%, 0% 28%)}
.metal.pure:before{background:linear-gradient(150deg,#F2DCA4,#A5811F)}
/* rock on the heap is NOT metal on the rack, and must not be mistaken for it:
   dark, unlit, and it says so. Contrast measured on the dark rack. */
/* #8A7358 measured 4.09:1 against #FFF3DE and the contrast sweep failed the
   build over it on the first run. #7A6650 is 4.94:1 and is the same brown the
   rock pieces on the floor start from. */
.metal.rough{background:linear-gradient(170deg,#7A6650 0%,#5A4B3C 58%,#42382C 100%); color:#FFF3DE}
.metal.rough:before{background:linear-gradient(150deg,#4A3F34,#241D18)}
/* the bin the heap sits in */
.orebin{background:linear-gradient(180deg,#4A3B2C,#2E2620); border:3px solid #241C15;
  border-radius:4px 4px 12px 12px; padding:10px 10px 12px; box-shadow:inset 0 6px 14px rgba(0,0,0,.5)}
.orebin .heap{display:flex; flex-wrap:wrap; align-items:flex-end}
.metal .ct{font-family:var(--body); font-size:11px; opacity:.85}
.metal.pure{background:linear-gradient(160deg,#F2DCA4,#C8A24B); border-color:#8A6A2A; color:#2E2208}
.gear{display:flex; gap:9px; align-items:flex-start; background:#fff; border:2px solid var(--rule);
  border-radius:11px; padding:9px 11px; margin-bottom:7px}
.gear .ic{font-size:20px}
.gear .nm{font-family:var(--display); font-size:14px}
.gear .ds{font-size:12px; color:var(--ink-soft)}
.gear.new{border-color:var(--lamp); background:#FFF9EC}

/* ---- THE BELT: a leather strap with the instruments hanging off it. You
       take them off it to use them, which a list of cards never let you do. ---- */
.beltstrap{position:relative; display:flex; gap:9px; flex-wrap:wrap; align-items:flex-start;
  background:linear-gradient(180deg,#6B4A32 0%,#54371F 46%,#3E2917 100%);
  border:2px solid #2E1E10; border-radius:9px; padding:13px 11px 12px; margin-top:6px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.09), inset 0 -3px 0 rgba(0,0,0,.3)}
/* the stitching along the strap */
.beltstrap:before{content:""; position:absolute; left:6px; right:6px; top:5px; height:0;
  border-top:2px dashed rgba(255,220,170,.32)}
.beltstrap.bare{padding:11px}
.beltempty{font-size:13px; font-style:italic; color:#E8D6BC}
/* the belt hanging on the breaking floor: it sits INSIDE the dark floorbox,
   so its labels are set for that ground rather than for cream */
.gearbox.atwork{margin:0 0 11px}
.gearbox.atwork .beltlab{font-family:var(--display); font-size:10px; letter-spacing:.11em;
  color:var(--lamp); margin-bottom:4px}
.gearbox.atwork .beltnote{font-size:12px; color:#C9B695; margin-top:6px}
.gearbox.atwork .beltstrap{margin-top:0}
.beltloop{position:relative; padding-top:7px}
/* the loop the tool hangs in */
.beltloop:before{content:""; position:absolute; left:50%; top:-6px; width:15px; height:15px; margin-left:-7px;
  border:3px solid #8A6A45; border-radius:50%; background:transparent}
.belttool{display:flex; flex-direction:column; align-items:center; gap:2px; cursor:grab;
  background:linear-gradient(170deg,#4A4038,#2E2620); color:#FFF3DE; border:2px solid #8A6A45;
  border-radius:8px; padding:8px 10px; min-height:44px; min-width:62px; touch-action:none;
  font-family:var(--body)}
.belttool .bic{font-size:19px; line-height:1}
.belttool .bnm{font-family:var(--display); font-size:10px; letter-spacing:.04em}
.belttool:hover{border-color:var(--lamp); filter:brightness(1.15)}
.belttool:active{cursor:grabbing}
.belttool:focus-visible{outline:3px solid var(--lamp); outline-offset:2px}
.dragghost.tool{background:linear-gradient(170deg,#4A4038,#2E2620)}

/* ---- THE SLOT on a piece of rock ---- */
.piececell{display:flex; flex-direction:column; align-items:center; gap:4px}
.toolslot{cursor:pointer; width:100%; min-height:26px; padding:2px 6px;
  background:#241D18; color:#8A7358; border:2px dashed #6B5B48; border-radius:6px;
  font-family:var(--display); font-size:13px; line-height:1.3}
.toolslot .si{display:block}
.toolslot:hover{border-color:var(--lamp); color:#E4D5BB}
.toolslot:focus-visible{outline:3px solid var(--lamp); outline-offset:2px}
/* something is in it: the slot is lit and solid, not dashed and empty */
.toolslot.filled{border-style:solid; border-color:var(--lamp); background:#3A2E1C; color:#FFE9C4;
  box-shadow:0 0 9px rgba(232,163,61,.45)}
/* a tool is in the air and this is somewhere it can go */
.piece[data-tooldrop=open]{outline:2px dashed rgba(232,163,61,.7); outline-offset:2px}
.piece[data-tooldrop=hot]{outline:3px solid #8FE0C0; outline-offset:2px}

/* ---- THE INSTRUMENT PANEL. A real dialog: traps Tab, closes on Escape,
       hands focus back to the slot it came from. ---- */
@keyframes scrimin{from{opacity:0}to{opacity:1}}
@keyframes sheetrise{from{transform:translateY(16px)}to{transform:translateY(0)}}
.scrim{position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center;
  padding:18px; background:rgba(20,15,11,.72); animation:scrimin 160ms ease-out 1}
.toolsheet{width:min(560px,100%); max-height:88vh; overflow-y:auto; background:var(--paper);
  border:3px solid var(--rock-3); border-radius:15px; box-shadow:0 18px 44px rgba(0,0,0,.5);
  animation:sheetrise 220ms cubic-bezier(.2,.8,.3,1) 1}
.toolsheet:focus{outline:none}
@media (prefers-reduced-motion:reduce){ .scrim,.toolsheet{animation:none} }
.tshead{display:flex; gap:11px; align-items:center; padding:13px 15px;
  background:linear-gradient(180deg,var(--rock-2),var(--rock)); border-radius:12px 12px 0 0; color:#FFF3DE}
.tshead .ic{font-size:26px; line-height:1}
.tshead .tsname{font-family:var(--display); font-size:19px; color:#FFE9C4}
.tshead .tsore{font-size:13px; color:#E4D5BB}
.tsclose{margin-left:auto; font-family:var(--body); font-size:13px; padding:9px 13px; min-height:44px;
  cursor:pointer; border-radius:8px; border:2px solid #8A6A45; background:#241D18; color:#F0E2C8}
.tsclose:hover{border-color:var(--lamp); color:#FFF3DE}
.tsbody{padding:15px}
.tsfoot{padding:0 15px 14px}
/* the lantern's reading, which is the one a student sees most */
.lampread{border-radius:11px; padding:14px 16px; border:3px solid}
.lampread .big{font-family:var(--display); font-size:clamp(19px,3.2vw,25px); line-height:1.15}
.lampread .sm{font-size:15px; margin-top:5px}
.lampread.seamed{border-color:var(--lamp); background:#FFF6E3; color:#4A3410}
.lampread.clear{border-color:var(--vein); background:#F1F8F5; color:#123F35}
.pickrow{display:flex; gap:9px; flex-wrap:wrap}
.pickbtn{display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
  background:#fff; border:2px solid var(--tan); border-radius:11px; padding:11px 13px; min-height:44px;
  font-family:var(--body); color:var(--ink)}
.pickbtn .ic{font-size:21px}
.pickbtn .nm{font-family:var(--display); font-size:13px}
.pickbtn:hover{border-color:var(--ore); background:#FFF6EA}

/* =========================================================================
   THE WORLD. Everything below exists to make the page feel like a PLACE.
   Rules it follows: motion carries weight (a pick swings and lands, it does
   not fade); nothing that moves reports a quantity; every layer is its own
   stone; and all of it stops dead under prefers-reduced-motion.
   ========================================================================= */

/* ---- interiors. Rooms are DECORATIVE ONLY and carry no text: SVG <text>
       inherits the CSS `color` property while painting with `fill`, which
       makes it read as a false failure to any contrast sweep. Every word on
       these screens stays in HTML underneath. ---- */
/* A ROOM IS A BANNER, NOT THE SCREEN. At width:100% the 900x210 viewBox drew
   ~290px tall on a desktop, so the actual work started below the halfway line
   and a student met scenery before they met anything to do. Fixed height with
   `slice` scales to cover and crops a little wall and floor instead. */
/* 232, not 176: at 176 the 900x210 room had to scale ~1.3x to cover and lost
   nearly half its height to the crop, which read as being zoomed into the wall.
   232 trims about 15% - enough to stop the banner dominating, little enough
   that the room still looks like a room. */
.room{border:3px solid var(--rock-3); border-radius:16px; overflow:hidden; margin:0 0 14px;
  background:#2E2620; height:232px}
.room svg{display:block; width:100%; height:100%}
@media (max-width:700px){ .room{height:168px} }
@keyframes bellowspush{0%,100%{transform:scaleY(1)}45%{transform:scaleY(.72)}}
@keyframes firelick{0%,100%{transform:scaleY(1) translateY(0); opacity:.92}50%{transform:scaleY(1.18) translateY(-3px); opacity:1}}
@keyframes quenchsteam{0%{transform:translateY(0) scale(.5); opacity:.5}100%{transform:translateY(-42px) scale(1.5); opacity:0}}
@keyframes ladletip{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-16deg)}}
@keyframes stampfall{0%,44%{transform:translateY(-26px)}62%{transform:translateY(0)}70%{transform:translateY(-3px)}100%{transform:translateY(-26px)}}
.rm-fire{transform-origin:50% 100%; animation:firelick 1.6s ease-in-out infinite}
.rm-bellows{transform-origin:0% 50%; animation:bellowspush 3.4s ease-in-out infinite}
.rm-steam{animation:quenchsteam 3.2s ease-out infinite}
.rm-ladle{transform-origin:74% 30%; animation:ladletip 6s ease-in-out infinite}
/* the battery does not fall in unison - a stamp mill is five hammers out of
   step with each other, which is the whole sound of the thing */
.rm-stamp{animation:stampfall 1.15s cubic-bezier(.4,0,.7,1) infinite}
.rm-stamp.s1{animation-delay:.23s} .rm-stamp.s2{animation-delay:.46s}
.rm-stamp.s3{animation-delay:.69s} .rm-stamp.s4{animation-delay:.92s}

/* ---- the surface scene ---- */
.scene{position:relative; border:3px solid var(--rock-3); border-radius:16px; overflow:hidden;
  background:#8FB8D6; box-shadow:inset 0 -30px 60px rgba(58,49,41,.35)}
.scene svg{display:block; width:100%; height:auto}
/* DECORATION PAINTED OVER A DOOR MUST NOT TAKE THE CLICK.
   SVG paint order is document order, and three things go on AFTER the
   hotspots: Mr Factor, the portal's dark mouth, and the cart rolling out of
   it. All three were live to the mouse, so they swallowed clicks aimed at the
   building underneath - and the mine's black opening, the most mine-looking
   part of the whole scene, was the deadest spot on it.
   Stated as a class rather than patched per element: in a scene, only a door
   takes a hit. Everything else is a picture. */
.scene svg *{pointer-events:none}
.scene .hot,.scene .hot *{pointer-events:auto}
.scene .hot{cursor:pointer}
.scene .hot .hotring{opacity:0; transition:opacity .18s ease}
.scene .hot:hover .hotring,.scene .hot:focus-visible .hotring{opacity:1}
.scene .hot:focus-visible{outline:none}
.scene .hotlabel{font-family:var(--display); font-size:13px; fill:#FFF3DE; paint-order:stroke;
  stroke:#2E2620; stroke-width:4px; stroke-linejoin:round}
/* burnt into the plank: dark on light wood, no outline needed */
.scene .signtext{font-family:var(--display); font-size:11px; fill:#3A2A18; color:#3A2A18}
/* TRANSFORM-BOX IS NOT OPTIONAL ON SVG.
   `transform-origin` on an SVG element resolves against the VIEWBOX by
   default, not the element - so "center" meant the centre of a 900x420 scene,
   hundreds of units away, and every rotating piece swung around a point
   outside itself. fill-box makes the origin mean what it says. */
.sc-wheel,.sc-sails,.rm-ladle,.rm-bellows,.rm-fire,.pickarm{transform-box:fill-box}
@keyframes sailspin{to{transform:rotate(360deg)}}
.sc-sails{transform-origin:center; animation:sailspin 13s linear infinite}
@keyframes wheelspin{to{transform:rotate(360deg)}}
@keyframes cartroll{0%{transform:translateX(0)}45%{transform:translateX(150px)}55%{transform:translateX(150px)}100%{transform:translateX(0)}}
/* out of the portal, along the track in front of the mine, and back in again -
   a shuttle, which is what a haulage cart actually does all day */
/* parks at +12, not +44: the arch interior runs 748-828 and the cart is 54
   wide from a mount at 756, so only 12 leaves it FULLY inside the dark. Any
   further right and its tail stuck out past the mask, over the bluff. */
/* the fade is what conceals it deep in the shaft, now that nothing is painted
   over the top of it - it comes up out of the dark and goes back into it */
@keyframes cartout{
  0%  {transform:translateX(30px); opacity:0}
  10% {transform:translateX(22px); opacity:0}
  20% {transform:translateX(6px);  opacity:1}
  44% {transform:translateX(-168px); opacity:1}
  58% {transform:translateX(-168px); opacity:1}
  82% {transform:translateX(6px);  opacity:1}
  92% {transform:translateX(22px); opacity:0}
  100%{transform:translateX(30px); opacity:0}
}
.sc-cartout{animation:cartout 16s ease-in-out infinite}
@keyframes smokepuff{0%{transform:translate(0,0) scale(.6); opacity:.55}100%{transform:translate(16px,-58px) scale(1.7); opacity:0}}
@keyframes clouddrift{from{transform:translateX(-70px)}to{transform:translateX(660px)}}
@keyframes lampflicker{0%,100%{opacity:.85}45%{opacity:1}70%{opacity:.7}}
@keyframes birdbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sc-wheel{transform-origin:center; animation:wheelspin 9s linear infinite}
.sc-wheel.slow{animation-duration:14s}
.sc-cart{animation:cartroll 11s ease-in-out infinite}
.sc-smoke{animation:smokepuff 4.5s ease-out infinite}
.sc-cloud{animation:clouddrift 46s linear infinite}
.sc-lamp{animation:lampflicker 3.2s ease-in-out infinite}
.sc-bird{animation:birdbob 3s ease-in-out infinite}

/* ---- the rock face ---- */
.face{position:relative; border:3px solid var(--rock-3); border-radius:16px; overflow:hidden}
.face svg{display:block; width:100%; height:auto}
/* the seam viewport: the rock inside is several screens wide and is scanned
   along by scrolling, dragging or the scan buttons */
.seamview{overflow-x:auto; overflow-y:hidden; cursor:grab; scroll-behavior:smooth;
  scrollbar-color:var(--lamp) #241D18}
.seamview:active{cursor:grabbing}
.seamview svg{width:auto; max-width:none; height:190px}
.seamview::-webkit-scrollbar{height:10px}
.seamview::-webkit-scrollbar-track{background:#241D18}
.seamview::-webkit-scrollbar-thumb{background:var(--lamp); border-radius:999px}
/* THE PICK WAS EATING EVERY CLICK ON THE SEAM.
   It follows the cursor at (ux-46, uy-62), which puts the cursor at local
   (46,62) - INSIDE the handle rect (x:40 y:10 w:9 h:92) - and it is appended
   after the rocks, so it is painted on top of them. Hit-testing the centre of
   a lump returned the pick's handle, head and collar; the rock was never
   reached. The reaction was wired up correctly and could not fire, because the
   click never arrived. Same rule as the scene: only a lump takes a hit here,
   everything else is a picture. The svg itself keeps its events so that
   dragging the face to scan along the seam still works. */
.face svg *{pointer-events:none}
.face .rock,.face .rock *{pointer-events:auto}
.rock{cursor:pointer}
.rock .body{transition:transform .16s ease, filter .16s ease}
.rock:hover .body,.rock:focus-visible .body{transform:translateY(-2px); filter:brightness(1.22)}
.rock:focus-visible{outline:none}
.rock .sel{opacity:0}
.rock[data-sel=on] .sel{opacity:1}
.rock[data-sel=on] .body{filter:brightness(1.3)}
@keyframes glintpulse{0%,100%{opacity:.25}50%{opacity:.9}}
.rock .glint{animation:glintpulse 2.6s ease-in-out infinite}
@keyframes pickswing{
  0%{transform:rotate(-58deg) translate(0,0)}
  55%{transform:rotate(16deg) translate(0,0)}
  62%{transform:rotate(12deg) translate(-3px,2px)}
  100%{transform:rotate(-58deg) translate(0,0)}
}
.pickarm{transform-origin:86% 88%; animation:pickswing 720ms cubic-bezier(.5,.05,.3,1) 1}
@keyframes shardfly{
  0%{opacity:1; transform:translate(0,0) rotate(0deg)}
  100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}
}
.shard{animation:shardfly 620ms ease-out forwards}
@keyframes impactring{0%{opacity:.85; transform:scale(.2)}100%{opacity:0; transform:scale(2.4)}}
.impact{transform-origin:center; animation:impactring 520ms ease-out forwards}
@keyframes shudder{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,-2px)}80%{transform:translate(2px,1px)}}
.shudder{animation:shudder 320ms ease-in-out 1}

/* ---- THE KNOCK: every click on a lump is answered where the mouse is ----
   Clicking the lump you already had picked out repainted the face to a picture
   identical to the one you were already looking at, and a click that landed
   during a swing returned without a word. Both are indistinguishable from a
   control that was never wired up. The knock decides nothing - it only says
   "yes, that one", at the point of contact, every single time.

   transform-box:fill-box is load-bearing. A <g> defaults to view-box, so
   scale() on the rock body would resolve about the top-left corner of the
   2280-wide seam and fling the rock off the face instead of compressing it
   where it sits. */
.rock .body{transform-box:fill-box; transform-origin:center}
@keyframes rockknock{
  0%{transform:translate(0,0) scale(1)}
  28%{transform:translate(0,2.5px) scale(.93)}
  58%{transform:translate(0,-1.5px) scale(1.05)}
  100%{transform:translate(0,0) scale(1)}
}
.rock .body.knock{animation:rockknock 300ms cubic-bezier(.3,1.5,.4,1) 1}
/* a swing is already in the air: the click still answers, it answers "not now" */
@keyframes rockrefuse{0%,100%{transform:translate(0,0)}25%{transform:translate(-2.6px,0)}75%{transform:translate(2.6px,0)}}
.rock .body.refuse{animation:rockrefuse 240ms ease-in-out 1}
@keyframes chipfly{0%{opacity:.95; transform:translate(0,0)}100%{opacity:0; transform:translate(var(--dx),var(--dy))}}
.chip{animation:chipfly 400ms ease-out forwards; pointer-events:none}
@keyframes tapring{0%{opacity:.8; transform:scale(.62)}100%{opacity:0; transform:scale(1.28)}}
.taphalo{transform-box:fill-box; transform-origin:center; pointer-events:none;
  animation:tapring 400ms ease-out forwards}
/* the pick is in your hand and follows the cursor, so it has to be seen to
   touch what you touched - a tip, not the full swing, which is what breaking
   looks like and must stay unmistakable */
@keyframes picktap{0%,100%{transform:rotate(0)}42%{transform:rotate(-19deg)}}
.pickarmhost.picktap{transform-origin:86% 88%; animation:picktap 260ms cubic-bezier(.4,.1,.3,1) 1}
@keyframes tapfade{0%{opacity:.85}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  /* the answer stays, it stops moving. A ring that fades is still an answer. */
  .rock .body.knock,.rock .body.refuse,.lump.knock,.pickarmhost.picktap{animation:none}
  .chip{display:none}
  .taphalo{animation:tapfade 420ms linear forwards}
}

/* ---- inspecting a rock before you break it ---- */
.inspect{background:#241D18; border:2px solid #6B5B48; border-radius:12px; padding:11px 13px; color:#F0E2C8; margin-top:10px}
.inspect .label{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--lamp)}
.inspect .expr{font-family:var(--display); font-size:clamp(22px,3.4vw,34px); color:#FFF3DE; margin:2px 0 6px}
.inspect .obs{font-size:14px; color:#D9C39C}
.inspect .obs li{margin:2px 0}

/* ---- the crucible pour ---- */
@keyframes moltenfall{0%{transform:scaleY(0); opacity:0}18%{opacity:1}100%{transform:scaleY(1); opacity:1}}
@keyframes castrise{from{opacity:0; transform:translateY(14px) scale(.94)}to{opacity:1; transform:translateY(0) scale(1)}}
@keyframes gleam{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
.moltenstream{transform-origin:top center; animation:moltenfall 620ms ease-in 1}
.castingwrap{animation:castrise 420ms cubic-bezier(.2,.8,.3,1) 1; position:relative; overflow:hidden}
.castingwrap.clean:after{content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);
  animation:gleam 1100ms ease-out 1}
@keyframes cracktwitch{0%,100%{transform:translate(0,0) rotate(0)}30%{transform:translate(-2px,1px) rotate(-.6deg)}70%{transform:translate(2px,-1px) rotate(.6deg)}}
.castingwrap.deformed{animation:castrise 420ms ease-out 1, cracktwitch 300ms ease-in-out 1 420ms}

/* ---- moving between places. A short wipe, so going somewhere feels like
       going somewhere rather than the page swapping its contents. ---- */
/* MOVEMENT ONLY, NEVER OPACITY. Animating from opacity:0 means any dropped
   frame, slow paint or interrupted animation leaves the whole screen faint or
   blank - the mine looked like its rocks had not rendered at all. A transition
   should never be able to hide the content it is introducing. */
@keyframes placewipe{
  0%{transform:translateY(9px)}
  100%{transform:translateY(0)}
}
#screen.arriving{animation:placewipe 260ms cubic-bezier(.2,.8,.3,1) 1}
@media (prefers-reduced-motion:reduce){ #screen.arriving{animation:none} }

/* ---- the haulage road above the cart: a cart running the track, endlessly ---- */
.carttrack{border:2px solid #241C15; border-radius:11px 11px 0 0; overflow:hidden;
  background:linear-gradient(180deg,#3A3129,#2A231C)}
.carttrack svg{display:block; width:100%; height:auto}
@keyframes cartroll2{from{transform:translateX(-110px)}to{transform:translateX(640px)}}
@keyframes wheelroll{to{transform:rotate(360deg)}}
@keyframes cartjolt{0%,100%{transform:translateY(0)}25%{transform:translateY(-1.4px)}60%{transform:translateY(.9px)}}
.ct-cart{animation:cartroll2 9s linear infinite}
.ct-jolt{transform-box:fill-box; animation:cartjolt .5s ease-in-out infinite}
.ct-wheel{transform-box:fill-box; transform-origin:center; animation:wheelroll 1.1s linear infinite}

/* ---- a lump arriving in the cart ---- */
@keyframes lumpdrop{from{opacity:0; transform:translateY(-16px) scale(.9)}to{opacity:1; transform:translateY(0) scale(1)}}
.lump.fresh{animation:lumpdrop 380ms cubic-bezier(.2,.8,.3,1) 1}
/* AFTER .lump.fresh, deliberately: same specificity, so a click on a lump that
   has only just landed in the cart still knocks rather than being outranked by
   its own arrival. */
@keyframes lumpknock{0%{transform:translateY(0) scale(1)}34%{transform:translateY(2px) scale(.96)}
  68%{transform:translateY(-1px) scale(1.025)}100%{transform:translateY(0) scale(1)}}
.lump.knock{animation:lumpknock 260ms cubic-bezier(.3,1.4,.4,1) 1}
