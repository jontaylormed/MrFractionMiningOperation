<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr Factor's Mining Operation</title>
<meta name="description" content="Break ore apart until what is left will not break, then pour that metal into a mold and craft a tool. Factoring and prime factorisation as one act.">
<style>
/* =========================================================================
   MR FACTOR'S MINING OPERATION - v1, the Ore Cart
   One file. No dependencies. No build step. Runs from file:// and Pages.
   Specification: docs/MINE-SPEC.md. The spec is authoritative.

   THE METAPHOR, and it is load-bearing rather than decorative:
     ore     = any expression (number, monomial, binomial, trinomial)
     SMELT   = factor      - ore separates into its constituents
     ingot   = an irreducible: a prime, or an irreducible polynomial.
               The SAME OBJECT. That is the whole thesis of the site.
     mold    = distribute  - metals go in, one formed object comes out
     POUR    = the check. A clean casting or a visibly deformed one.
               This is the ONLY correctness signal in the build.

   Palette contrast, MEASURED in-browser on a settled page, not estimated:
     --ink    #2A2119 on --paper #FDF8F0 = 14.93:1
     --ore-t  #8F4712 on --paper         =  6.45:1   small text
     --vein   #1F5C4F on --paper         =  7.35:1   small text
     --ore    #C96A1F on --paper         =  3.57:1   FILLS AND BORDERS ONLY
   ========================================================================= */
:root{
  --paper:#FDF8F0; --paper-2:#F5EDDF; --paper-3:#EDE1CD;
  --ink:#2A2119; --ink-soft:#5A4B3A;
  --tan:#C8B89A; --rule:#D9C9AC;
  --ore:#C96A1F; --ore-t:#8F4712; --lamp:#E8A33D;
  --rock:#3A3129; --rock-2:#4A3F34; --rock-3:#2E2620;
  --vein:#1F5C4F; --vein-lite:#2E7D6B;
  --molten:#E2600F; --molten-2:#FFB347;
  /* --ingot IS THE DARK END OF EVERY METAL BAR, AND IT WAS TOO DARK.
     #16202A on #6E7B87 is 3.80:1. The bars pass in the mine's yard, where the
     label is bold and the threshold drops to 3, and fail in the forge's mold
     slots, where it is not — the same colour reading as a pass or a fail
     depending on font-weight. #8A97A3 puts it at 5.52:1 either way, and an
     ingot is polished steel, so lighter is also more like the thing. */
  --ingot:#8A97A3; --ingot-lite:#C4CED8;
  --twin:#5B3E8C; --loaded:#1E5A86; --pure:#8C6A1F;
  --tile-sq:#CFE0EF; --tile-sq-ink:#1E4C74;
  --tile-x:#F6DCB8;  --tile-x-ink:#8F4712;
  --tile-k:#CFE6DC;  --tile-k-ink:#1F5C4F;
  --display:'Black Han Sans','Arial Black',Impact,system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',Verdana,Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.55}
h1,h2,h3,h4{font-family:var(--display); font-weight:400; margin:0}
p{margin:0 0 .7em}
sup{font-size:.62em}

/* ---------- ambient: dust + lamplight, non-informational ---------- */
#ambient{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
#ambient .mote{position:absolute; border-radius:50%; background:var(--tan); opacity:.10; animation:drift linear infinite}
#ambient .lamp{position:absolute; top:-160px; left:50%; width:640px; height:520px; margin-left:-320px;
  background:radial-gradient(ellipse at 50% 0%, rgba(232,163,61,.13), rgba(232,163,61,0) 68%);
  transform-origin:50% 0%; animation:sway 11s ease-in-out infinite}
@keyframes drift{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(22px,-120vh,0)}}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
@media (prefers-reduced-motion:reduce){
  #ambient .mote,#ambient .lamp{animation:none !important}
  *{animation-duration:.001s !important; transition-duration:.001s !important}
}

/* ---------- shell ---------- */
header.top{position:relative; z-index:2; background:linear-gradient(180deg,var(--rock-2) 0%, var(--rock) 62%, var(--rock-3) 100%);
  color:#F7EEDD; border-bottom:5px solid var(--ore)}
.top-in{max-width:1240px; margin:0 auto; padding:12px 18px; display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.top h1{font-size:clamp(19px,2.6vw,27px); color:#FFF3DE; line-height:1.05}
.top .tagline{font-size:13px; color:#E4D5BB}
.top .spacer{flex:1 1 auto}
.navbtn{font-family:var(--body); font-size:14px; padding:9px 14px; min-height:44px; cursor:pointer;
  border-radius:9px; border:2px solid #6B5B48; background:transparent; color:#F0E2C8}
.navbtn:hover{border-color:var(--lamp); color:#FFF3DE}
.navbtn[aria-current=page]{background:var(--lamp); border-color:var(--lamp); color:#3A2A10}
.wrap{position:relative; z-index:1; max-width:1240px; margin:0 auto; padding:22px 18px 90px}
/* #screen is focused after every navigation so a screen reader announces the
   new view. That drew the browser's default ring around the ENTIRE page.
   :focus-visible keeps the ring for real keyboard focus and drops it for the
   programmatic call - removing it outright would cost keyboard users. */
#screen:focus:not(:focus-visible){outline:none}

/* ---------- generic ---------- */
.panel{background:var(--paper-2); border:2px solid var(--rule); border-radius:14px; padding:18px; margin:16px 0}
.panel.light{background:#FFFCF6; border-color:var(--tan)}
.panel-tag{display:inline-block; font-family:var(--display); font-size:12px; letter-spacing:.12em;
  padding:3px 10px; border-radius:6px; margin-bottom:10px; background:var(--rock); color:var(--lamp)}
.panel-tag.play{background:var(--lamp); color:#3A2A10}
.hint{font-size:14px; color:var(--ink-soft)}
.lede{max-width:70ch; color:var(--ink-soft)}
.btn{font-family:var(--body); font-size:15px; padding:11px 18px; min-height:44px; cursor:pointer;
  border-radius:10px; border:2px solid var(--tan); background:var(--paper); color:var(--ink)}
.btn:hover{border-color:var(--ore)}
.btn.primary{background:var(--ore-t); border-color:var(--ore-t); color:#FFF7EA; font-family:var(--display); letter-spacing:.04em}
.btn.primary:hover{background:#6E360D; border-color:#6E360D}
.btn.big{font-size:19px; padding:16px 26px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
input[type=text],input[type=number]{font-family:var(--body); font-size:17px; padding:10px 12px; min-height:44px;
  border:2px solid var(--tan); border-radius:10px; background:#fff; color:var(--ink); max-width:100%}
input:focus{outline:3px solid var(--lamp); outline-offset:1px; border-color:var(--ore)}
input[type=range]{width:100%; accent-color:var(--ore); height:44px}
/* THE PLACEHOLDER IS COPY, AND IT WAS THE BROWSER'S. The hammer bar's ghost
   `1` and `0` are the line that tells a student what an empty box MEANS - the
   thing that stops a cleared box swinging 6 at a lump they meant to hit with
   (x + 6), per §47 - and it was being painted in Chrome's UA default #757575.
   That is 4.61:1: a pass, and a pass this file did not choose. Firefox paints
   its placeholder at 54% alpha, which on the same white is ~3.5:1, so the one
   number a zero-dependency single file cannot control was deciding whether
   that copy was legible. Pinned at 6.53:1, with opacity:1 because Firefox
   applies its own on top. */
input::placeholder, textarea::placeholder{color:#6B5B48; opacity:1}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.grow{flex:1 1 auto}
.eq{font-family:var(--display); font-size:clamp(20px,3vw,30px); line-height:1.5; margin:8px 0}
.eq.sm{font-size:clamp(17px,2.2vw,22px)}
.eq .op{color:var(--ore-t); padding:0 .12em}
.eq .dim{color:var(--ink-soft); opacity:.75}
.stage{background:#fff; border:2px solid var(--rule); border-radius:12px; padding:10px; overflow-x:auto}
.stage svg{display:block; width:100%; max-width:520px; height:auto; margin:0 auto}
.model-cap{font-size:14px; color:var(--ink-soft); text-align:center; max-width:60ch; margin:6px auto 2px}
/* A NOTE PAINTS ITS OWN BACKGROUND, SO IT MUST PAINT ITS OWN INK.
   All four variants lay down a near-white card - and none of them set a
   `color`, so a note dropped inside a dark panel inherited that panel's cream
   text onto its own white. The end-of-lump note under the anvil - the one that
   tells a student the lump is finished and that finishing it is not a failure
   - was #E4D5BB on #F1F8F5 at 1.34:1. Effectively invisible, in the one place
   on the bench where the copy is doing pastoral work rather than mechanical
   work. Seventeen notes are built in this file and any of them could land on a
   dark surface, so the ink is set here rather than at any of the call sites. */
.note{border-left:6px solid var(--tan); background:#fff; color:var(--ink); padding:12px 15px; border-radius:0 11px 11px 0; margin:12px 0; font-size:15px}
.note.good{border-left-color:var(--vein); background:#F1F8F5}
.note.warn{border-left-color:var(--lamp); background:#FFF9EC}
.note.bad{border-left-color:var(--molten); background:#FDF0E7}
.note b{font-family:var(--display); font-weight:400}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---------- load screen ---------- */
#loadscreen{position:fixed; inset:0; z-index:50; background:linear-gradient(180deg,var(--rock-2),var(--rock-3));
  color:#F7EEDD; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px; padding:24px; text-align:center}
#loadscreen.gone{display:none}
#loadscreen h2{font-size:clamp(24px,5vw,40px); color:#FFF3DE}
#loadscreen .sub{max-width:52ch; color:#E4D5BB; font-size:15px}
.loadbar{width:min(420px,80vw); height:16px; border:2px solid var(--lamp); border-radius:999px; overflow:hidden; background:#241D18}
.loadbar i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--molten),var(--molten-2)); transition:width .25s linear}
.loadticker{font-size:13px; color:var(--lamp); min-height:1.4em; font-family:var(--display); letter-spacing:.06em}

/* ---------- home ---------- */
.hero{display:flex; gap:22px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.cards{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); margin-top:8px}
.card{background:#fff; border:2px solid var(--rule); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:8px}
.card h3{font-size:19px}
.card .why{font-size:14px; color:var(--ink-soft); flex:1 1 auto}
/* the "To forge it" line is pushed to the foot of every card, so four cards of
   different description lengths still line their instructions and buttons up */
.card .hint{margin-top:auto}
.card .go{align-self:flex-start}
.card.locked{opacity:.72; background:var(--paper-2)}
.tagline-pill{display:inline-block; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  border:2px solid var(--tan); color:var(--ore-t); border-radius:999px; padding:3px 11px}

/* ---------- mine layout ---------- */
/* THE MINE IN TWO BANDS. The top band is the three PLACES - shaft, face, yard
   - held tight against each other so the operation reads as one glance. The
   bottom band is the WORK, full width, and it carries the two boxes side by
   side: what is on the floor, and what is under the hammer.

   gap:12px, not 18: the three places are one machine and were floating apart.
   minmax(0,1fr) on the face for the reason below - a bare 1fr grows to fit the
   2280px seam and takes the page sideways with it. */
/* THE THREE PLACES SHARE A BOTTOM EDGE. align-items:start left each column at
   its natural height, so the shaft ran to 1215, the cart stopped at 991 and
   the yard at 650 - a ragged 565px of dead space above the break floor, and
   565px of scrolling nobody needed. They stretch to one row height now and
   their panels fill it, so the band is a rectangle and the work starts
   directly under all three. */
/* THE MINE IN FOUR FULL-WIDTH BANDS (MINE-SPEC §22). The cart used to be the
   middle column of a three-column grid - a third of the page - so a lump was a
   44px list row with nowhere to drop a tool. Only the shaft and the rock face
   still share a row, because a list of five layers and a scrolling seam
   genuinely pair. */
.minetop{display:grid; grid-template-columns:214px minmax(0,1fr); gap:12px; align-items:stretch}
.minetop > *{min-width:0; display:flex; flex-direction:column}
.minetop > * > .shaft, .minetop > * > .panel, .minetop > * > .wall{flex:1 1 auto}
.minetop > * > :last-child{margin-bottom:0}
@media (max-width:760px){ .minetop{grid-template-columns:minmax(0,1fr)} }
.mineband{margin-top:12px}
.mineband > .panel:last-child, .mineband > *:last-child{margin-bottom:0}
.minegrid{display:grid; grid-template-columns:214px minmax(0,1fr) 232px; gap:12px; align-items:stretch}
.minegrid > *{min-width:0; display:flex; flex-direction:column}
/* the panel in each column takes the height the column was given */
.minegrid > * > .shaft,
.minegrid > * > .panel{flex:1 1 auto}
/* and the LAST panel in a column carries no bottom margin, so its edge is the
   column edge. The cart stopped 16px short of the break floor on its own
   margin, which is exactly the ragged edge this band exists to remove. */
.minegrid > * > :last-child{margin-bottom:0}
/* THE FACE TAKES ITS HEIGHT, THE CART TAKES WHAT IS LEFT.

   The middle column is stretched to the row height the shaft sets, so anything
   the seam gains has to come out of the cart or the column grows and pushes the
   break floor down the page. The face is sized by its content; the cart is the
   flexible one and scrolls inside itself when it holds more than fits. The
   student loses nothing - the cart is a list and it was already scrollable. */
.minegrid > *:nth-child(2) > .face{flex:0 0 auto}
.minegrid > *:nth-child(2) > .panel:last-child{flex:1 1 auto; min-height:150px; max-height:430px;
  display:flex; flex-direction:column; overflow:hidden}
/* .cartbody has to BE a flex container, or .cart's flex rules mean nothing to
   it and the list grows to its content inside a clipped panel - which does not
   scroll, it just hides the lumps past the fold. min-height:0 at every level,
   because the flexbox default is min-height:auto and that refuses to shrink
   below the content. */
.minegrid > *:nth-child(2) > .panel:last-child .cartbody{flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column}
/* the cart list KEEPS ITS CAP and scrolls inside itself. Letting it grow to
   fit its contents put a full cart in charge of the row height - eight lumps
   took the column to 1811 and the page to 2733, which is the scrolling this
   whole band exists to remove. */
.minegrid > *:nth-child(2) > .panel:last-child .cart{max-height:none; flex:1 1 auto; min-height:0; overflow-y:auto}
.minework{margin-top:12px}
/* the two work boxes, side by side. 1fr each so neither squeezes the other;
   the floor holds the pieces you choose between and the bar holds the head you
   cut, and choosing without seeing what you are cutting to is the hurdle this
   removes. */
/* THE TWO WORK BOXES ARE ONE BOX NOW, so `.workpair` and everything that kept
   its two columns level went with them. What replaced the pair is not a
   narrower version of it: the anvil IS the work, the ore sits on it, and there
   is no second column for a picture of an anvil to live in. */
/* minmax(0,1fr), NOT 1fr: a bare 1fr column has min-width:auto and grows to
   fit its widest child, so the 2280px seam stretched the whole page sideways
   in the single-column layout instead of scrolling inside its viewport. */
/* On one column the rock face comes FIRST. The shaft is tall - five layers and
   four unopened ones - so stacked above the face it pushed the seam and its
   inspect panel about 1600px down the page: clicking a lump worked perfectly
   and produced no visible response, because the panel that answers was far
   below the fold. The work goes at the top; navigation follows it. */
@media (max-width:1080px){
  .minegrid{grid-template-columns:minmax(0,1fr)}
  .minegrid > *:nth-child(2){order:-1}
}

/* ---- THE FORGE: orders on the left, the yard and the mold on the right.
       Same rule as the mine on one column - the WORK goes first and the list
       of what could be made follows it, because a seven-item board stacked on
       top pushes the mold below the fold. ---- */
.forgegrid{display:grid; grid-template-columns:290px minmax(0,1fr); gap:18px; align-items:start}
@media (max-width:980px){
  .forgegrid{grid-template-columns:minmax(0,1fr)}
  .forgegrid > *:nth-child(2){order:-1}
}
.forgegrid > *{min-width:0}
.orderboard{position:sticky; top:12px; background:linear-gradient(180deg,#3A3129,#241C15);
  border:3px solid #1B1511; border-radius:14px; padding:13px 11px 14px;
  box-shadow:inset 0 8px 22px rgba(0,0,0,.5)}
@media (max-width:980px){ .orderboard{position:static} }
.orderboard h3{font-size:14px; letter-spacing:.09em; text-transform:uppercase; color:var(--lamp); margin-bottom:4px}
.orderboard > .hint{color:#D9C39C; margin-bottom:9px}
/* an order is a card hung on the board, not a row in a table */
.order{position:relative; display:flex; gap:10px; align-items:center; width:100%; text-align:left;
  cursor:pointer; border:2px solid #6B5B48; border-radius:10px; padding:9px 11px; margin:0 0 7px;
  min-height:44px; font-family:var(--body); color:#F0E2C8;
  background:linear-gradient(180deg,#463A2E,#3A3129)}
.order:hover{border-color:var(--lamp); background:linear-gradient(180deg,#55432F,#463A2E)}
.order:focus-visible{outline:3px solid var(--lamp); outline-offset:2px}
.order .oic{font-size:21px; line-height:1; flex:0 0 auto}
.order .otx{display:flex; flex-direction:column; gap:1px; min-width:0}
.order .onm{font-family:var(--display); font-size:15px; color:#FFF3DE}
.order .ost{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:#C9B695}
.order.ready .ost{color:#8FE0C0}
.order.short{opacity:.82}
.order.short .ost{color:#E8B87A}
.order.made{background:linear-gradient(180deg,#2E3B34,#25302B); border-color:#3F6B58}
.order.made .ost{color:#8FE0C0}
.order.made:after{content:"\2713"; position:absolute; right:11px; top:50%; transform:translateY(-50%);
  color:#8FE0C0; font-size:17px}
.order[aria-current=true]{border-color:var(--lamp); box-shadow:0 0 0 2px rgba(232,163,61,.5)}

/* metal on the rack, as something you pick up */
.metalbtn{position:relative; display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  background:linear-gradient(170deg,#E6ECF2 0%,#BFC9D3 58%,#9DA9B5 100%);
  color:#141B22; border:0; padding:9px 13px 10px 11px; margin:2px; min-height:44px;
  clip-path:polygon(10% 0%, 92% 3%, 100% 42%, 94% 92%, 40% 100%, 4% 88%, 0% 34%);
  font-family:var(--display); font-size:14px;
  filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}
.metalbtn:before{content:""; width:11px; height:11px; flex:0 0 auto;
  background:linear-gradient(150deg,#8A7358,#4A3F34);
  clip-path:polygon(20% 6%, 78% 0%, 100% 40%, 86% 88%, 40% 100%, 4% 70%, 0% 28%)}
.metalbtn.pure{background:linear-gradient(160deg,#F2DCA4,#C8A24B); color:#2E2208}
.metalbtn.pure:before{background:linear-gradient(150deg,#F2DCA4,#A5811F)}
.metalbtn:hover{filter:brightness(1.1) drop-shadow(0 2px 1px rgba(0,0,0,.45))}
.metalbtn:focus-visible{outline:3px solid var(--lamp); outline-offset:2px}
/* already in the mold: still there, still readable, plainly not available */
.metalbtn.spent{opacity:.4; cursor:default}
/* rock in the forge's yard is shown and is NOT a button - the furnace will
   not take it, and a control that looks live and refuses is worse than a
   thing that plainly is not one */
.heaprock.cold{cursor:default; opacity:.72}

/* ---- THE MOLD, SEEN FROM ABOVE ----
   The cavity is the tool's OWN ICON knocked down to black - a shape cut into
   sand, seen from overhead. The metal runs down a trough, off the lip, into
   the basin and along the runner, and as the pour front crosses the shape it
   REVEALS the icon: colour and edges coming up out of the black at the speed
   of the metal. ---- */
/* CAPPED, because the picture is not the work. The mold is a 400x300 drawing
   with width:100%, so on a wide screen it grew to fill the column and pushed
   1399px between the target and the pour button - the `reach` group caught it
   and named the number. It is a picture of what you are making; it does not
   need to be bigger than the thing you are making it with. */
.moldwrap{border:3px solid #241C15; border-radius:12px; overflow:hidden; margin:8px auto 12px;
  background:#241A12; max-width:310px}
/* 310, not 430. The pour is the best picture on the site and it was also 324px
   of the 805px between the target and the pour button - the single biggest
   reason a student had to scroll to find the thing they were about to press.
   At 310 the same drawing is 232 tall and the whole craft floor fits a laptop. */
.moldwrap svg{display:block; width:100%; height:auto}
.moldwrap svg *{pointer-events:none}

/* THE CUT. brightness(0) is what blacks out a COLOUR EMOJI - `fill` does not
   touch one, because the glyph carries its own colour table. */
.mdcut{filter:brightness(0); opacity:.92}
.mdcutshadow{filter:brightness(0); opacity:.4; transform:translate(7px,8px); transform-box:view-box}
/* and the same glyph in its own colours, shown only where the metal has run */
.mdlive{filter:drop-shadow(0 0 7px rgba(255,190,90,.75))}
/* THE THREE STATES OF THE METAL, all painted through the tool's own alpha mask
   so not one of them can put a pixel outside the silhouette. Hot underneath;
   red and steel fade in over it as the casting cools. */
.mdhot{}
.mdred{opacity:0}
.mdsteel{opacity:0}
@keyframes mdcoolred{ from{opacity:0} to{opacity:.94} }
@keyframes mdcoolsteel{ from{opacity:0} to{opacity:.97} }
/* THE THREE BEATS. The fill lands at 2.45s; the red is fully in by 3.65s and
   holds for three quarters of a second before the steel starts at 4.4s. They
   used to overlap, which turned a casting going off the boil into one muddy
   fade with no red in it at all. */
.moldwrap[data-pour] .mdred{animation:mdcoolred 1200ms ease-in 2.45s both}
.moldwrap[data-pour] .mdsteel{animation:mdcoolsteel 2200ms ease-in 4.4s both}
/* and the heat-glow round it dies with the colour */
@keyframes mdglowdown{
  0%{filter:drop-shadow(0 0 12px rgba(255,190,90,.95))}
  55%{filter:drop-shadow(0 0 7px rgba(226,96,15,.5))}
  100%{filter:drop-shadow(0 0 2px rgba(90,101,112,.35))} }
.moldwrap[data-pour] .mdlive{animation:mdglowdown 3000ms ease-in 2.45s both}

/* nothing is hot until it is poured */
.moldwrap .mdtrough,.moldwrap .mdstream,.moldwrap .mdrun,.moldwrap .mdnum{opacity:0}
.moldwrap .mdrevrect{ y:261px; height:0 }

@keyframes mdtrough{ 0%{opacity:0} 8%{opacity:1} 82%{opacity:1} 100%{opacity:0} }
.moldwrap[data-pour] .mdtrough{animation:mdtrough 2600ms linear 0s backwards}
@keyframes mdstream{ 0%{opacity:0} 14%{opacity:1} 80%{opacity:1} 100%{opacity:0} }
.moldwrap[data-pour] .mdstream{animation:mdstream 2600ms linear .25s backwards}
@keyframes mdrun{ 0%{opacity:0} 100%{opacity:1} }
.moldwrap[data-pour] .mdrun{animation:mdrun 500ms linear .5s both}

/* THE METAL RISES IN THE CAVITY. One rect anchored on the floor of the glyph
   grows UPWARD, clipping the coloured icon - so the black outline fills with
   metal from the bottom instead of a picture being wiped across it.

   There is no pool any more. It was a translucent orange panel laid over the
   whole cavity area, and what it looked like was a transparent sheet dropped
   over the sand rather than metal arriving in a shape. The sand around the
   tool stays sand. */
@keyframes mdrev{ from{ y:261px; height:0 } to{ y:111px; height:150px } }
.moldwrap[data-pour] .mdrevrect{animation:mdrev 1700ms cubic-bezier(.4,0,.7,1) .75s both}

/* THE NUMBERS SIT IN THE METAL. Transparent, so the liquid shows through, with
   a light stroke behind them so they hold up over sand as well as over metal. */
.mdnum{opacity:0; paint-order:stroke; stroke:#FFE9A8; stroke-width:4px; stroke-linejoin:round}
.mdfrom{stroke-width:3px}
/* THE TERMS RIDE THE STREAM, SO THEY LEAVE WITH IT. Two animations: they fall
   in a beat apart (the delay is set per token in MF.moldScene) and then go at
   2.25s, which is inside the window `mdstream` fades in. Left `forwards` on
   the first one alone they hung in mid-air after the metal had stopped
   falling, over sand, labelling nothing. */
/* ONE KEYFRAME FOR THE WHOLE LIFE OF A TOKEN: in, hold, out. It was two
   animations, both filling `forwards` on the same property, and they spent the
   pour arguing about which one owned the opacity - sampled at 0.82 a third of
   a second after the fade-out should have finished it. One animation is one
   delay and one answer, and it holds the term on screen for 1.3s rather than
   the 0.9 that survived the argument. */
@keyframes mdin{
  0%{opacity:0; transform:translateY(-8px)}
  14%{opacity:.85; transform:translateY(0)}
  76%{opacity:.85; transform:translateY(0)}
  100%{opacity:0; transform:translateY(5px)}
}
.moldwrap[data-pour] .mdin{transform-box:fill-box; animation:mdin 1900ms ease-out forwards}
/* the sign between them is quieter than the metals it separates */
.mdinx{opacity:0}
.moldwrap[data-pour] .mdinx{stroke-width:3px}
/* the bright core of the stream is a highlight, not a second stream */
@keyframes mdcore{ 0%{opacity:0} 14%{opacity:.5} 80%{opacity:.5} 100%{opacity:0} }
.moldwrap[data-pour] .mdstream.mdcore{animation:mdcore 2600ms linear .25s backwards}
@keyframes mdterm{ 0%{opacity:0; transform:scale(.6)} 60%{opacity:.74; transform:scale(1.12)} 100%{opacity:.66; transform:scale(1)} }
.moldwrap[data-pour] .mdterm,.moldwrap[data-pour] .mdfrom{transform-box:fill-box; transform-origin:center;
  animation:mdterm 380ms cubic-bezier(.3,1.5,.5,1) forwards}
/* the two middles slide together and go, and the one they make takes their place */
@keyframes mdmidgo{ 0%{opacity:.66} 100%{opacity:0} }
.moldwrap[data-pour] .mdmid{animation:mdterm 380ms cubic-bezier(.3,1.5,.5,1) forwards,
  mdmidgo 300ms ease-in 3.05s forwards}
@keyframes mdmerged{ 0%{opacity:0; transform:scale(.7)} 100%{opacity:.78; transform:scale(1)} }
.moldwrap[data-pour] .mdmerged,.moldwrap[data-pour] .mdmergefrom{transform-box:fill-box; transform-origin:center;
  animation:mdmerged 420ms cubic-bezier(.3,1.5,.5,1) 3.2s forwards}
@keyframes mdsingle{ 0%{opacity:0; transform:scale(.72)} 70%{opacity:.9; transform:scale(1.08)} 100%{opacity:.84; transform:scale(1)} }
.moldwrap[data-pour] .mdsingle{transform-box:fill-box; transform-origin:center;
  animation:mdsingle 560ms cubic-bezier(.3,1.5,.5,1) 3.8s forwards}
/* scrap: the metal in the shape goes dull, and the tool never quite comes up */
.moldwrap[data-pour=scrap] .mdrun,
.moldwrap[data-pour=scrap] .mdstream,.moldwrap[data-pour=scrap] .mdtrough{filter:saturate(.35) brightness(.7)}
/* SCRAP GOES ON THE ANCESTOR, not on .mdlive - that element now carries an
   animated filter of its own, and a static rule cannot beat an animation.
   Nested filters compose, so the whole reveal is dulled and the cooling still
   runs underneath it. */
.moldwrap[data-pour=scrap] .mdreveal{filter:saturate(.22) brightness(.6)}

@media (prefers-reduced-motion:reduce){
  .moldwrap[data-pour] .mdtrough,.moldwrap[data-pour] .mdstream,.moldwrap[data-pour] .mdrun,
  .moldwrap[data-pour] .mdrevrect,.moldwrap[data-pour] .mdnum{animation:none}
  /* the casting is full, the tool is up, and the maths is there; it arrives */
  .moldwrap[data-pour] .mdrun,.moldwrap[data-pour] .mdtrough{opacity:1}
  /* THE STREAM STAYS UP. It used to be hidden here, because a stream frozen in
     mid-air over a flat channel looked like a mistake. Coming off the lip of a
     tipped ladle it is a pour held still, which is a picture - and the terms
     being multiplied are IN it, so hiding it would take them with it and leave
     a reduced-motion student with no sight of what went in. */
  .moldwrap[data-pour] .mdstream{opacity:1}
  .moldwrap[data-pour] .mdstream.mdcore{opacity:.5}
  /* the cavity is FULL, not half filled and not wiped part way across */
  .moldwrap[data-pour] .mdrevrect{ y:111px; height:150px }
  .moldwrap[data-pour] .mdnum{opacity:.66}
  /* a finished casting is a COLD one */
  .moldwrap[data-pour] .mdred{animation:none; opacity:.94}
  .moldwrap[data-pour] .mdsteel{animation:none; opacity:.97}
  .moldwrap[data-pour] .mdlive{animation:none}
  .moldwrap[data-pour] .mdmid{opacity:0}
  .moldwrap[data-pour] .mdsingle{opacity:.84}
}
/* THE POUR, ARMED. It sits directly under the rack, so the next thing to do
   after the last metal drops is the next thing on screen. `data-armed` says
   only that the mold is FULL - never that the metals are right, which is the
   casting's to say and nothing else's. */
.pourrow{margin-top:12px; align-items:center}
.pourbtn{transition:box-shadow .18s ease, transform .18s ease}
.pourbtn[data-armed]{box-shadow:0 0 0 4px rgba(232,163,61,.5), 0 5px 0 rgba(0,0,0,.3)}
.pourbtn[data-armed]:focus-visible{box-shadow:0 0 0 4px var(--lamp), 0 0 0 8px rgba(232,163,61,.35), 0 5px 0 rgba(0,0,0,.3)}
@media (prefers-reduced-motion:reduce){ .pourbtn{transition:none} }
/* the rack, inside the craft floor rather than in a panel of its own */
.craft .shelfrow{margin-top:13px}
.craft{margin-top:16px}
.crafthead{display:flex; gap:9px; align-items:center; font-family:var(--display); font-size:20px; margin-bottom:6px}
.crafthead .ci{font-size:24px}
.coldmold{font-family:var(--display); font-size:19px; color:var(--ink-soft);
  background:var(--paper-3); border:2px dashed var(--tan); border-radius:12px;
  padding:20px; text-align:center; margin-bottom:12px}
.moldslot{min-width:78px; text-align:center}
/* the object the mold is cut for: the question, at the size of a question */
.castfor{background:linear-gradient(180deg,#FFF6E3,#FBEBCB); border:3px solid var(--lamp);
  border-radius:12px; padding:9px 14px 10px; margin-bottom:9px}
/* #8F6410 measured 4.46:1 against the plate and the sweep failed the build by
   four hundredths. #7F570B is 5.98:1. */
.castfor .cflab{font-family:var(--display); font-size:11px; letter-spacing:.11em; color:#7F570B}
.castfor .cfeq{font-family:var(--display); font-size:clamp(26px,4.4vw,38px); color:#4A3410; line-height:1.1; margin:2px 0 5px}
.castfor .cfwhy{font-size:14px; color:#5A4B2A}
/* the target on an order card, so the board reads as seven objects to make */
.order .ocast{font-size:12px; color:#FFE0A8; font-family:var(--display); letter-spacing:.02em}
.order.made .ocast{color:#A8D8C4}

/* the shaft / layers */
.shaft{position:sticky; top:12px}
@media (max-width:1080px){ .shaft{position:static} }
/* THE SHAFT IS A SHAFT: rock walls, timber sets, a ladder running the whole
   drop, and a cage on a cable that rides to whichever layer you are working. */
.shaftbody{display:flex; gap:10px; align-items:stretch}
.shaftway{position:relative; flex:0 0 58px; border-radius:8px; overflow:hidden;
  background:
    repeating-linear-gradient(180deg, rgba(0,0,0,.16) 0 2px, transparent 2px 15px),
    linear-gradient(90deg,#2E2620 0 8px,#4A3B2C 8px 50px,#2E2620 50px 58px);
  box-shadow:inset 0 0 18px rgba(0,0,0,.55)}
/* timber sets: uprights down both sides, crossbeams every so often */
.shaftway:before{content:""; position:absolute; top:0; bottom:0; left:7px; width:7px;
  background:linear-gradient(90deg,#6B5335,#4A3524)}
.shaftway:after{content:""; position:absolute; top:0; bottom:0; right:7px; width:7px;
  background:linear-gradient(90deg,#4A3524,#6B5335)}
.shaftway .sets{position:absolute; inset:0;
  background:repeating-linear-gradient(180deg, transparent 0 62px, #5A4432 62px 69px)}
/* the ladder */
.shaftway .ladder{position:absolute; top:0; bottom:0; left:23px; width:22px;
  background:
    repeating-linear-gradient(180deg, transparent 0 9px, #8A6A45 9px 13px),
    linear-gradient(90deg,#7A5B3A 0 4px, transparent 4px 18px, #7A5B3A 18px 22px)}
/* the cable and the cage that rides it */
.shaftway .cable{position:absolute; top:0; left:33px; width:3px; background:#C8B89A; opacity:.55}
/* the cage RIDES. 1.5s, easing in off the rest and settling out at the far
   end, because a winding engine takes up the slack before it moves a load and
   eases it in again at the level - a snap between floors reads as a menu. */
.shaftway .cage{position:absolute; left:12px; width:34px; height:40px; border-radius:3px;
  background:linear-gradient(180deg,#8A9AA6,#5E6A76); border:2px solid #3E474F;
  box-shadow:0 3px 0 rgba(0,0,0,.4);
  transition:top 1.5s cubic-bezier(.45,.02,.35,1)}
.shaftway .cable{transition:height 1.5s cubic-bezier(.45,.02,.35,1)}
.shaftway .cage:before{content:""; position:absolute; inset:5px 4px; border-radius:2px;
  background:repeating-linear-gradient(90deg,#46505A 0 3px,transparent 3px 7px)}
.shaftway .cage:after{content:""; position:absolute; left:13px; top:-9px; width:8px; height:9px; background:#3E474F}
@media (prefers-reduced-motion:reduce){ .shaftway .cage{transition:none} }
/* THE WHOLE SHAFT IS UNDERGROUND. The layer list is not a menu beside the
   mine - it is the mine, seen in section, and each level is a gallery cut
   into the rock with its own timber and its own lamp. */
.shaft{background:linear-gradient(180deg,#3A3129 0%,#241C15 100%);
  border:3px solid #1B1511; border-radius:14px; padding:14px 12px 16px;
  box-shadow:inset 0 8px 22px rgba(0,0,0,.55)}
.shaft h3{font-size:14px; letter-spacing:.09em; text-transform:uppercase; color:var(--lamp); margin-bottom:6px}
.shaft .rail-note, .shaft > .hint{color:#D9C39C}
.shaft h3, .shaft > .hint{padding:0 2px}
/* a gallery cut into the rock: timber on the left, rock behind, a lamp that
   only burns on the level you are actually working */
/* The timber is a separate strip, NOT a stop in the button's own gradient.
   As a gradient stop it was the palest colour on the element, so every
   contrast reading measured the text against wood it does not sit on and
   four labels failed at 2.9-4.0. The rock behind the words is now flat. */
/* TIGHTER GALLERIES. Nine rows at 10-11px of padding and a 6px gap ran the
   shaft to 921px, which set the height of the whole top band and put the break
   floor 1227px down the page. 7px of padding and a 4px gap holds the 44px
   minimum every control on this site keeps and takes ~180px out of the scroll. */
.layer{position:relative; display:block; width:100%; text-align:left; cursor:pointer;
  border:0; border-radius:0 8px 8px 0; padding:7px 11px 7px 26px; margin:0 0 4px;
  font-family:var(--body); font-size:14px; color:#F0E2C8; min-height:44px;
  background:linear-gradient(180deg,#3A3129,#332B24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 2px 0 rgba(0,0,0,.35)}
.layer:after{content:""; position:absolute; left:0; top:0; bottom:0; width:11px;
  background:linear-gradient(90deg,#6B5335 0 7px,#4A3B2C 7px 11px)}
.layer:before{content:""; position:absolute; left:15px; top:11px; width:7px; height:7px; border-radius:50%;
  background:#5A4B3C; z-index:1; transition:background .3s ease, box-shadow .3s ease}
.layer:hover{background:linear-gradient(180deg,#46392E,#3C3227)}
.layer[aria-current=true]{color:#FFF3DE; background:linear-gradient(180deg,#55432F,#4A3A28)}
.layer[aria-current=true]:after{background:linear-gradient(90deg,#8A6A45 0 7px,#5A4432 7px 11px)}
.layer[aria-current=true]:before{background:var(--lamp); box-shadow:0 0 9px 3px rgba(232,163,61,.55)}
/* brighter than --lamp and than the old grey: the gallery gradient includes a
   pale timber stop, and both measured under 4.5 against it (3.34 and 3.63) */
.layer .n{font-family:var(--display); font-size:11px; letter-spacing:.08em; color:#FFD79A; display:block}
.layer .hint{color:#E8DCC4; font-size:12px}
.layer[aria-current=true] .hint{color:#E4D5BB}
/* boarded up: not yet timbered, so the gallery is planked over */
/* boarded up, but still readable: these name where the mine goes next, and at
   2.92:1 they were decoration rather than information */
.layer.shut{cursor:not-allowed; color:#C7B6A0;
  background:repeating-linear-gradient(115deg,#3A2E24 0 9px,#332821 9px 18px)}
.layer.shut:after{background:linear-gradient(90deg,#4A3B2C 0 7px,#3A2E24 7px 11px)}
.layer.shut:before{background:#3A3129; box-shadow:none}
.layer.shut .n{color:#B9A489}
.layer.shut .hint{color:#B5A88F}

/* the wall */
/* THE LAYER IS THE SAME SIZE AS THE SHAFT (user, 2026-09-05).

   Both columns were already stretched to one row height - 982px at 1250 - but
   the seam WINDOW inside the wall was a fixed 563px, so the layer had 264px of
   empty rock panel under it while the shaft was full to the bottom. Two boxes
   the same height, one of them two-thirds empty.

   The wall is a flex column now and the seam window takes what is left of it.
   `flex:1 1 0` and not `1 1 auto`: an auto basis is the CONTENT height, which
   is the drawing, which is the thing being sized - the box would take its
   height from the svg and the svg from the box. A zero basis breaks that. */
.wall{background:linear-gradient(180deg,#5A4B3C,#3A3129); border:3px solid var(--rock-3); border-radius:14px;
  padding:18px; color:#F0E2C8; position:relative; overflow:hidden;
  display:flex; flex-direction:column}
/* A ZERO BASIS AND A REAL FLOOR, and both halves were wrong once.

   `flex:1 1 auto` makes the basis the CONTENT height - which is the drawing,
   which is the thing being sized from the box. Measured: the wall inflated the
   grid row 71px past the shaft's own 982 and dragged the shaft up with it, so
   the layer was SETTING the row rather than filling it. Backwards.

   `flex:1 1 0` breaks that, and with a 210px minimum it broke the other way:
   under 900px the columns stack, the wall is content-sized, there is no free
   space to hand out, and the window fell to its minimum - the layer came out
   205px on a phone, far smaller than the 563 it replaced.

   Zero basis so the drawing cannot feed its own height back in; 542 - the
   height the seam was designed at - as the floor for when there is no free
   space to grow into. */
.wall .facewrap{flex:1 1 0; min-height:542px; display:flex; flex-direction:column}
.wall .facewrap .seamview{flex:1 1 0; min-height:0}
.wall h3{color:#FFE9C4; font-size:20px}
/* #F2E6D0, not #D9C39C: layer 1 is the LIGHTEST rock in the mine, and the
   dimmer cream measured 3.82:1 against it while passing on every dark layer.
   Text that clears on four palettes and fails on the fifth still fails. */
.wall .depthline{font-size:13px; color:#F2E6D0; margin-bottom:10px}
/* .hint is --ink-soft, which is a dark-on-cream colour. Inside the wall and
   the crucible it lands on near-black and disappears, so it is re-set here.
   Measured after the fix: #D9C39C on #45392F = 6.9:1. */
/* THE WALL IS TINTED PER LAYER, AND LAYER 1 IS THE LIGHTEST ROCK ON THE SITE.
   `MF.LAYER_LOOK` runs #6E5A40 at the top of the shaft down to #2E2A28 at the
   bottom, so any light ink on this wall has to clear GRAVEL, not the layer the
   sweep happens to mount. #D9C39C reads 3.82:1 on layer 1 and passes on the
   other four.

   THIS IS THE SECOND TIME. `.depthline` was raised to #F2E6D0 for exactly this
   failure, on exactly this wall, and the hint sitting beside it was left at
   the old value. Fixing an instance twice is the signal that the class is the
   hazard: it is not this hint, it is light ink on a wall whose brightness the
   student chooses. The sweep now mounts layer 1 as `mine-layer1`. */
.wall .hint{color:#EDDCBC}
.crucible .hint{color:#D9C39C}
.wall .facegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:7px; margin:12px 0}
.rockbit{aspect-ratio:1; border-radius:8px; background:linear-gradient(150deg,#6B5A47,#4A3F34); border:1px solid #2E2620}
.rockbit.glint{background:linear-gradient(150deg,#8A6E45,#5A4A38); box-shadow:inset 0 0 0 2px rgba(232,163,61,.55)}

/* cart / bench / yard */
/* THE CART IS A TRAY OF ROCKS, laid out across the band rather than stacked in
   a narrow column. Each cell is wide enough to read the numbers on the stone
   and big enough to drop an instrument onto. */
/* THE ORE SITS IN THE MIDDLE OF THE CART (user, 2026-09-04).

   `auto-fill` with a `1fr` maximum could not do it, for two reasons at once:
   auto-fill KEEPS the empty tracks it makes, so one lump in a 1140px cart sat
   in the first of five columns; and a `1fr` maximum lets the tracks absorb
   every spare pixel, so `justify-content` had nothing left to centre.

   `auto-fit` collapses the empty tracks to zero, and a 230px CAP leaves the
   spare width outside the tracks where centring can reach it. One lump is
   centred; four are a centred row of four. The cap is also what stops a
   single stone stretching to 1140px, which is what a bare `auto-fit` would
   have done instead. */
.cart{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,230px));
  justify-content:center; gap:14px; align-items:start; max-height:none}
/* THE LUMP IS THE STONE, not a list row. It was
     .lump{background:#fff; border-radius:11px; min-height:44px}
   - a white row with a 26px glyph and a text label beside it - which is what
   "information not in the ore" meant (§22). */
.lump{display:block; width:100%; cursor:grab; background:none; border:0; padding:0;
  position:relative; text-align:center}
.lump[aria-current=true] .orerock svg polygon:first-of-type{stroke:var(--lamp)}
/* an ore chunk, not a rounded square: clipped to an irregular lump */
.lump .glyph{width:26px; height:26px; flex:0 0 auto; background:linear-gradient(150deg,#8A7358,#4A3F34);
  clip-path:polygon(22% 4%, 74% 0%, 100% 38%, 88% 86%, 44% 100%, 6% 74%, 0% 30%);
  box-shadow:inset -3px -3px 6px rgba(0,0,0,.4)}
/* ---- THE CART THE LUMPS ARE SITTING IN ----

   Built to the reference the user sent (2026-09-04): a heavy bolted rim, a
   body that flares from the lip down to the sill, riveted corner straps, chips
   in the plate, a bolted chassis and spoked wheels with a rust hub cap.

   THE BED GRADIENT DOES NOT MOVE. `_backdrops` (§64) walks up from the layer
   tag under each lump to find what is painted behind it, and this is what it
   finds. Everything below is drawn OVER it.

   THE FLARE IS A CLIP, NOT A BORDER. A clip-path takes the border with it, so
   the outline is `.cartline` - an svg tracing the same trapezoid at double
   stroke width, half of which the clip removes. */
.cartbody{position:relative; background:linear-gradient(180deg,#5E6A76,#3E474F);
  padding:19px 23px 20px; margin-top:8px;
  clip-path:polygon(0 0, 100% 0, 97.6% 100%, 2.4% 100%)}
.cartbody > .cart{position:relative; z-index:3}
.cartline,.cartchip{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.cartline{z-index:4}
.cartchip{z-index:1; height:90px}
/* THE RIM: the lipped top, with bolt heads every 30px along it. Repeating
   gradients rather than drawn circles, because this box stretches and a bolt
   that stretches is not a bolt. */
.cartrim{position:absolute; left:0; right:0; top:0; height:15px; z-index:2; pointer-events:none;
  background:
    radial-gradient(circle at 15px 50%, #C2CDD8 0 2.6px, #7C8994 2.6px 4px, transparent 4.2px) 0 0/30px 100% repeat-x,
    linear-gradient(180deg,#9CA9B5 0%,#7A8794 62%,#4E5862 100%);
  border-bottom:2px solid #2A3138}
/* THE CORNER STRAPS, leaning with the flare - a vertical strap on a tapering
   wall is not vertical. 2.3deg is the taper the outline is drawn to. */
/* THEY ARE NOT SKEWED, AND THE FIRST VERSION WAS. A skew is a fixed ANGLE and
   this box is a list with a 430px cap - so the same 2.3° that matched the
   taper at 200px tall threw the strap 21px off the plate at 526px. The taper
   is a percentage of the width and the lean it needs is a function of the
   height, which no single angle can be.
   So the straps run straight down the corner and `.cartbody`'s clip trims
   their outer edge to the plate - which is how a strap over a tapering corner
   is drawn in flat art anyway: the inner edge straight, the outer following
   the plate. */
.cartstrap{position:absolute; top:13px; bottom:0; width:16px; z-index:2; pointer-events:none;
  background:
    radial-gradient(circle at 50% 13px, #C2CDD8 0 2.6px, #7C8994 2.6px 4px, transparent 4.2px) 0 0/100% 28px repeat-y,
    linear-gradient(90deg,#8A97A3,#5E6A76 60%,#48525B);
  border-left:2px solid #2A3138; border-right:2px solid #2A3138}
.cartstrap.l{left:0}
.cartstrap.r{right:0}
/* and the sill the body sits down onto */
.cartsill{position:absolute; left:5%; right:5%; bottom:0; height:9px; z-index:2; pointer-events:none;
  background:linear-gradient(180deg,#4E5862,#39424B); border-top:2px solid #2A3138}
/* THE WHEELS AND THE TRACK DO NOT FLEX. The cart panel is a flex column with a
   430px cap, and a flex item with no `flex-shrink:0` is a candidate for being
   squeezed when the column is over budget. `.cartrail` is 6px of track under
   the wheels and it was measuring 2, 3, 3, 4, 5, 6px as lumps left the cart -
   a bar at the bottom of the box that appeared and disappeared on every click.
   The LIST is the thing that gives up height here; the cart it is drawn in
   keeps its shape. */
/* THE UNDERCARRIAGE IS POSITIONED, NOT FLEXED. `justify-content:space-around`
   put the two wheels at the quarter points of the row, which on a 1140px cart
   is 570px apart with the drawbar stranded 80px in front of nothing. Percent
   offsets keep the same proportions at every width, and the chassis bar and
   the coupling can then be pinned to the wheels rather than to the box. */
.cartwheels{position:relative; height:44px; margin:-4px 12px 0; flex:0 0 auto}
/* the bolted chassis bar the axles hang off, behind the wheels */
.cartaxle{position:absolute; left:15%; right:15%; top:16px; height:9px; z-index:0;
  background:
    radial-gradient(circle at 11px 50%, #C2CDD8 0 2.2px, transparent 2.4px) 0 0/26px 100% repeat-x,
    linear-gradient(180deg,#8A97A3,#4E5862);
  border:2px solid #2A3138; border-radius:3px}
/* THE HITCH: a drawbar and ring off the front of the chassis, which is what
   makes it one of a train of carts rather than a bucket on wheels. Pinned to
   the bar's front end, so it is coupled to something at every width. */
.carthitch{position:absolute; left:15%; margin-left:-42px; top:6px;
  width:46px; height:30px; z-index:1; pointer-events:none}
.cwheel{position:absolute; top:0; z-index:2; width:44px; height:44px; overflow:visible}
.cwheel.front{left:14%}
.cwheel.rear{right:14%}
@media (max-width:560px){
  .cartwheels{height:38px; margin:-4px 8px 0}
  .cwheel{width:38px; height:38px}
  .carthitch{width:38px; height:25px; top:7px; margin-left:-34px}
  .cartaxle{top:14px}
}
.cartrail{height:6px; margin:2px 0 0; border-radius:3px; flex:0 0 auto;
  background:repeating-linear-gradient(90deg,#5A4B3C 0 12px, #3A3129 12px 18px)}
.lump .txt{font-family:var(--display); font-size:17px}
.lump .lay{font-size:11px; color:var(--ink-soft); margin-left:auto; letter-spacing:.06em}

/* THE BENCH IS A PLACE, not a card: sawn timber with the grain running along
   it, iron banding at the edge, and a rack on the wall above holding whatever
   the student has actually forged. */
.bench{
  position:relative; border:3px solid #4A3524; border-radius:14px; padding:16px 16px 18px;
  background:
    repeating-linear-gradient(90deg, rgba(74,53,36,.10) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(180deg, rgba(74,53,36,.16) 0 1px, transparent 1px 26px),
    linear-gradient(180deg,#DDB88A,#C79A66);
  background-color:#D3A877;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.18), inset 0 -8px 18px rgba(58,40,26,.34);
}
.bench > *{position:relative; z-index:1}
.bench:before{content:""; position:absolute; left:0; right:0; top:0; height:9px;
  background:linear-gradient(180deg,#6E5B49,#4A3524); border-radius:11px 11px 0 0}
/* timber is a mid-tone, so body text on it has to go darker than --ink-soft:
   the default measured 3.95:1 on the darker end of the grain */
.bench .eq{color:#2E2013}
.bench .hint{color:#3A2A18}
.bench .stepstrip .st{background:#E8D6BE; border-color:#8A6A4A}
.toolrack{display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  background:linear-gradient(180deg,#5A4432,#42301F); border:2px solid #332416;
  border-radius:10px; padding:8px 10px; margin:2px 0 12px}
.toolrack .rk{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#FFCB7A; margin-right:2px}
.toolrack .tl{display:inline-flex; align-items:center; gap:6px; background:#2E2620; border:2px solid #6B5B48;
  border-radius:8px; padding:5px 10px; color:#F0E2C8; font-size:13px}
.toolrack .tl .ic{font-size:15px}
.toolrack .empty{color:#C0AC90; font-size:13px; font-style:italic}
.stepstrip{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap}
.stepstrip .st{flex:1 1 100px; border:2px solid var(--rule); border-radius:10px; padding:7px 9px; background:var(--paper-2); min-width:96px}
.stepstrip .st b{font-family:var(--display); font-weight:400; font-size:13px; letter-spacing:.08em; display:block; color:var(--ink-soft)}
.stepstrip .st .s{font-size:12px; color:var(--ink-soft)}
.stepstrip .st.on{background:var(--lamp); border-color:var(--lamp)}
.stepstrip .st.on b,.stepstrip .st.on .s{color:#3A2A10}
.stepstrip .st.done{background:#F1F8F5; border-color:var(--vein)}
.stepstrip .st.done b{color:var(--vein)}

.choices{display:grid; gap:9px; margin:10px 0}
.choice{position:relative; text-align:left; padding:13px 15px 13px 46px; min-height:44px; border:2px solid var(--tan);
  border-radius:11px; background:#fff; cursor:pointer; font-family:var(--body); font-size:16px; color:var(--ink)}
.choice:hover{border-color:var(--ore)}
.choice:before{content:""; position:absolute; left:13px; top:50%; transform:translateY(-50%); width:22px; height:22px;
  border-radius:50%; border:2px solid var(--tan); font-family:var(--display); font-size:14px; line-height:19px; text-align:center}
.choice[data-result=yes]{border-color:var(--vein); background:#F1F8F5}
.choice[data-result=yes]:before{content:"\2713"; background:var(--vein); border-color:var(--vein); color:#fff}
.choice[data-result=no]{border-color:var(--molten); background:#FDF0E7}
.choice[data-result=no]:before{content:"\21BA"; background:var(--molten); border-color:var(--molten); color:#fff}
.choice .why{display:none}
.choice[data-result] .why{display:block; font-size:14px; color:var(--ink-soft); margin-top:5px}

/* crucible + ingots */
.crucible{background:linear-gradient(180deg,#3A3129,#241D18); border:3px solid var(--rock-3); border-radius:14px; padding:10px 14px 11px; color:#F0E2C8}
/* the crucible carried a full h4 and 8px under it; the slots are the content
   and the heading is a label. Every row trimmed here is a row a student does
   not scroll past to reach the pour button. */
.crucible h4{color:#FFE9C4; font-size:14px; margin-bottom:5px}
.ingotrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.ingot{background:linear-gradient(160deg,var(--ingot-lite),var(--ingot)); color:#16202A; border:2px solid #55606B;
  border-radius:7px 7px 10px 10px; padding:9px 14px; font-family:var(--display); font-size:19px; min-width:64px; text-align:center}
.ingot.pure{background:linear-gradient(160deg,#F2DCA4,#C8A24B); border-color:#8A6A2A; color:#2E2208}
.slotwrap{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.slot{background:#241D18; border:2px dashed #6B5B48; border-radius:10px; padding:9px 11px; color:#E4D5BB}
.slot label{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--lamp); margin-bottom:4px}
.slot input{width:66px; text-align:center; font-family:var(--display); font-size:18px; padding:7px 6px; min-height:44px}
.slot .paren{font-family:var(--display); font-size:22px; color:#E4D5BB; padding:0 2px}

/* ---- the breaking floor: rock on one side of a swing, metal on the other.
       A piece must SAY which it is without being read - rock is dark and
       knocked about, native metal is a cast bar with a lit edge. ---- */
/* THE CURSOR OVER THE BREAKING FLOOR IS THE HAND, THE SAME AS IN THE LAYER.

   USER, 2026-09-04, first: "the mouse cursor in the layer should be a hammer."
   USER, same day, after seeing it: "When the mouse is on the breaking field,
   it can be the hand icon as its in the layer tool."

   So it was built as a drawn hammer with its hotspot on the striking face, and
   it is a plain pointer again. THE ORE STILL HAS TO SAY IT IS CLICKABLE - it
   is the one control on this floor and there is no button on screen naming it
   - which is what these rules are for: `.piece` already carries `cursor:pointer`
   and the stone on the anvil must not lose it to any later rule.

   Kept as a custom property because that is what lets the ore ask for the
   floor's cursor by name rather than restating a value, and it is the seam
   between this decision and the next one. */
.floorbox{position:relative; overflow:hidden;
  --floorcur:pointer;
  cursor:var(--floorcur);
  background:linear-gradient(180deg,#3A3129,#241D18); border:3px solid var(--rock-3);
  border-radius:14px; padding:14px; color:#F0E2C8}
.floorbox .piece,.floorbox .piece.rock{cursor:var(--floorcur)}
.floorbox .gearbox,.floorbox .gearbox *,.floorbox .btn,.floorbox .toolslot{cursor:pointer}
/* native metal is finished: there is nothing to bring a hammer down on */
.floorbox .piece.native{cursor:default}
/* the cue under the anvil, which is the only instruction left on this floor */
.anvilcue{margin-top:10px; text-align:center; color:#E4D5BB; font-size:14px}
.anvilcue b{color:#FFE9C4}
/* and what stands in its place when the lump is finished */
.spentnote{margin-top:10px; text-align:center; color:#E4D5BB; font-size:14px; line-height:1.45}
.spentnote b{color:var(--lamp)}
/* the corner of the mine this happens in, drawn along the top and inert */
.anvilart{position:absolute; left:0; right:0; top:0; height:64px; pointer-events:none; opacity:.55}
.anvilart svg{display:block; width:100%; height:64px}
.anvilart svg *{pointer-events:none}
@keyframes anvillamp{0%,100%{opacity:.82}40%{opacity:1}75%{opacity:.66}}
.anvilglow{animation:anvillamp 3.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){ .anvilglow{animation:none} }
.floorbox > *{position:relative; z-index:1}
.floorbox h4{color:#FFE9C4; font-size:16px; margin-bottom:9px}
.pieces{display:flex; gap:10px; flex-wrap:wrap; align-items:stretch}
.piece{display:flex; flex-direction:column; gap:2px; align-items:center; cursor:pointer;
  font-family:var(--body); padding:10px 15px; min-height:44px; min-width:78px;
  border:2px solid transparent; border-radius:8px; position:relative}
.piece .pv{font-family:var(--display); font-size:19px; line-height:1.15}

/* =========================================================================
   THE LENS lives INSIDE the ore, not beside it (MINE-SPEC §19).
   MF.oreDisplay returns the lump's own expression, re-spelt by whatever
   instrument is on it, and that goes straight into the chip where the plain
   expression used to be. There is no panel: these are marks on the ore.
   ========================================================================= */
/* =========================================================================
   A DRAWN LUMP OF ORE, with its numbers cut into the stone (MF.oreRock).
   The stone is SVG; every character on it is an HTML span pinned over the
   middle of it, because SVG <text> paints with `fill` and inherits the
   `color` a contrast sweep reads (§59) - and a lens marks these in colour.
   ========================================================================= */
.orerock{position:relative; width:100%; max-width:230px; margin:0 auto}
.orerock svg{display:block; width:100%; height:auto}
.orerock .orelab{position:absolute; left:8%; right:8%; top:44%; transform:translateY(-50%);
  text-align:center; font-family:var(--display); line-height:1.12;
  font-size:clamp(15px,2.4vw,21px); color:#FFF3DE;
  text-shadow:0 2px 0 #241D18, 0 -2px 0 #241D18, 2px 0 0 #241D18, -2px 0 0 #241D18,
              1px 1px 0 #241D18, -1px -1px 0 #241D18}
.orerock.native .orelab{color:#2E2208; text-shadow:0 2px 0 #F2DCA4, 0 -2px 0 #F2DCA4,
  2px 0 0 #F2DCA4, -2px 0 0 #F2DCA4, 1px 1px 0 #F2DCA4, -1px -1px 0 #F2DCA4}
.orerock.big{max-width:320px}
.orerock.big .orelab{font-size:clamp(19px,3vw,30px)}
/* the layer tag sits under the stone, not on it */
/* --ink-soft is a LIGHT-surface colour and the cart's bed is steel (#5E6A76 to
   #3E474F), where it reads 1.13:1. */
.lump .lay{display:block; margin-top:2px; font-size:10px; letter-spacing:.1em;
  color:#FFF3DE; text-align:center}

.lensed{display:inline-flex; flex-wrap:wrap; align-items:baseline; gap:0; justify-content:center}
.lensed .lop{color:var(--ore-t); padding:0 .18em}
.lensed .lterm{display:inline-flex; align-items:baseline}
/* THE SHARED METAL, PICKED OUT INSIDE EVERY TERM - the one mark on the page
   whose whole job is to be spotted in three places at once. */
.lensed .lshared{color:var(--ore-t)}
.lensed .ldot{color:var(--ink-soft); padding:0 .04em; font-size:.82em}
.lensed .lsplit{color:var(--ore-t)}
.lensed .llit{color:inherit}
.lensed .ldark{opacity:.72}
.lensed .lqm{color:var(--ore-t)}
.lensed .ldial{color:var(--ore-t)}
/* the prospector's pick's mark for an element: nothing left in it */
.lensed .lfinal{color:var(--ore-t)}
/* on the DARK chips of the cart and the breaking floor the ink has to invert:
   --ore-t is #8F4712 and reads 1.6:1 on #4A3F34. --lamp is 6.9:1 on it. */
.lump .lensed .lop,.lump .lensed .lshared,.lump .lensed .lsplit,.lump .lensed .lfinal,
.lump .lensed .lqm,.lump .lensed .ldial,
.piece.rock .lensed .lop,.piece.rock .lensed .lshared,.piece.rock .lensed .lsplit,.piece.rock .lensed .lfinal,
.piece.rock .lensed .lqm,.piece.rock .lensed .ldial{color:var(--lamp)}
.lump .lensed .ldot,.piece.rock .lensed .ldot{color:#C9B695}
/* a lensed lump carries more characters than a bare one, so the chip's text
   is allowed to wrap rather than forcing the cart wider */
.lump .txt .lensed,.piece .pv .lensed{white-space:normal}
.piece .pt{font-size:10px; letter-spacing:.08em; text-transform:uppercase; opacity:.8}
/* still rock: the same knocked-corner silhouette the seam and the cart use */
.piece.rock{background:linear-gradient(160deg,#7A6650,#4A3F34); color:#FFF3DE; border-color:#2E2620;
  clip-path:polygon(7% 6%, 78% 0%, 100% 26%, 95% 82%, 62% 100%, 14% 94%, 0% 46%)}
.piece.rock:hover{filter:brightness(1.18)}
/* native metal: a cast bar, the same gold as a pure ingot elsewhere */
.piece.native{background:linear-gradient(160deg,#F2DCA4,#C8A24B); color:#2E2208; border-color:#8A6A2A;
  border-radius:7px 7px 10px 10px; cursor:default}
/* NATIVE METAL is the word for the thing this whole screen is driving at, and
   it was #6B4E12 on the gold's darker stop at 3.2:1. It had never been
   measured either: a piece only carries this label once it IS native, and
   nothing had ever broken a lump all the way down. 4.98:1 now. */
.piece.native .pt{color:#4A3208; opacity:1}
/* under the pick: the lamp ring, the same one the seam uses for a chosen lump */
.piece.under{box-shadow:0 0 0 3px var(--lamp), 0 0 12px 3px rgba(232,163,61,.4)}
.piece:focus-visible{outline:3px solid var(--lamp); outline-offset:2px}
@keyframes piecedrop{from{opacity:0; transform:translateY(-13px) scale(.88)}to{opacity:1; transform:translateY(0) scale(1)}}
.piece.fresh{animation:piecedrop 420ms cubic-bezier(.2,.8,.3,1) 1}
@keyframes pieceknock{0%{transform:translateY(0) scale(1)}34%{transform:translateY(2px) scale(.95)}
  70%{transform:translateY(-1px) scale(1.03)}100%{transform:translateY(0) scale(1)}}
.piece.knock{animation:pieceknock 280ms cubic-bezier(.3,1.4,.4,1) 1}

/* ---- THE ANVIL AND THE HAMMER ----
       You type the factor into the hammer head and bring it down on the lump.
       The head is a real box holding real inputs, so it sizes to them and it
       is your factor that comes down - not a picture of one. ---- */
.cutbar{background:#241D18; border:2px dashed #6B5B48; border-radius:12px; padding:12px 14px; margin-top:12px; color:#E4D5BB}
.cutbar .cutlab{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--lamp); margin-bottom:3px}
.cutbar .eq{color:#FFF3DE; margin-bottom:4px}
.cutbar .hint{color:#C9B695}
.cutbar input{width:66px; text-align:center; font-family:var(--display); font-size:18px; padding:7px 6px; min-height:44px}
/* #3A3129 on the old darker plate measured 2.3:1, and NO dark text can reach
   4.5 on a #5E6A76 ground - the plate had to get lighter, not the ink darker.
   This is the same polished steel the yard's metal chips already pass on. */
.cutbar .paren{font-family:var(--display); font-size:22px; color:#2A3138; padding:0 2px}

/* the whole anvil scene, hammer included, is one drawing now - the hammer used
   to be a CSS box floating over the svg because it held the input boxes */
.anvilstage{position:relative; width:100%; display:flex; flex-direction:column; align-items:center;
  padding:0; overflow:visible; min-height:210px; justify-content:flex-end}
/* 420, not 260. It was capped at 260 because it was the tallest thing in a
   two-column bench and it pushed the belt off a laptop screen. It is the ONLY
   thing in the box now, and the ore standing on it has to be readable at arm's
   length, so it gets the width back. The `reach` group is what says whether
   this number is small enough. */
.anvilsvg{position:relative; width:100%; max-width:420px}
.anvilsvg svg{display:block; width:100%; height:auto; overflow:visible}
.anvilsvg svg *{pointer-events:none}

/* ---- THE ORE, ON TOP OF THE ANVIL ----
   The mount is pinned over the anvil's face in percentages of the scene's own
   340x232 viewBox - the face runs x 112..262 and its top is y 154, so the
   stone's bottom sits at 33% up from the foot of the stage and it is a little
   wider than the face, the way a lump of rock lies on one.
   POSITION HERE, ANIMATION ON THE LUMP INSIDE (s5g). */
/* BACK TO FRONT: the anvil, the stone, the hammer, the burst (MINE-SPEC §37).
   The stone drops to 2 so the hammer can come down IN FRONT of it - it is
   HTML pinned over the drawing, and HTML with a z-index always paints over the
   svg it sits on, so the head used to swing behind the lump it was hitting. */
.anvilmount{position:absolute; left:32%; right:26%; bottom:33%; z-index:2}
/* the hammer's own layer: the same viewBox as the scene, so (176,10) is still
   (176,10) and the arc does not move by a pixel */
.hammerlayer{position:absolute; inset:0; width:100%; height:100%; z-index:3;
  pointer-events:none; overflow:visible}
/* the stone is a `.piece`, so the belt's drag and MF.pieceAt find it exactly
   as they find a chip on the ground - but it must not LOOK like a chip. The
   chip's own plate, clip-path and padding all come off; what is left is the
   drawn rock and a hit area round it. */
.piece.anvilore{display:block; width:100%; padding:0; min-width:0; min-height:0;
  background:none; border:none; border-radius:0; clip-path:none; box-shadow:none;
  gap:0; filter:none}
.piece.rock.anvilore,.piece.native.anvilore{background:none; border-color:transparent; clip-path:none}
.piece.rock.anvilore:hover .orerock,.piece.native.anvilore:hover .orerock{filter:brightness(1.14)}
.piece.anvilore:focus-visible{outline:3px solid var(--lamp); outline-offset:4px}
.piece.anvilore .orerock{max-width:none}
/* and the instrument's tag rides on the top corner of the stone */
/* `width:100%` on the base rule is for the slot under a chip on the ground,
   where it is the chip's own footer. On the stone it is a tag pinned to the
   corner, so it takes its own width back. */
.toolslot.onanvil{position:absolute; right:-4px; top:-16px; z-index:4;
  width:auto; margin-top:0; padding:5px 9px; display:inline-flex; align-items:center; gap:5px}
.toolslot.onanvil .si{display:inline}

/* ---- what you cut the head to ---- */
.hrow{display:flex; align-items:center; justify-content:center; gap:9px; flex-wrap:wrap; margin-top:4px}
.hlab{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--lamp)}
.hbox{display:inline-flex; align-items:center; gap:3px;
  background:linear-gradient(180deg,#E6ECF2 0%,#C4CED8 52%,#9DA9B5 100%);
  border:3px solid #2A3138; border-radius:8px; padding:6px 11px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.5), inset 0 -4px 0 rgba(0,0,0,.22), 0 3px 0 rgba(0,0,0,.34)}
.hbox input{width:62px; text-align:center; font-family:var(--display); font-size:19px;
  padding:6px 5px; min-height:44px}
.hbox .paren{font-family:var(--display); font-size:22px; color:#2A3138; padding:0 2px}
.hecho{font-size:13px; color:#C9B695; margin-top:8px; text-align:center}
.hecho b{font-family:var(--display); font-size:17px; color:#FFE9C4}
.hecho .bad{color:#FFB37A}

/* ---- THE SWING ----
   The hammer is part of the drawing now, so it rotates about the HAND at
   (176,10) in the scene's own coordinates - a real arc, not a box being
   translated. It rests LEANING BACK at −20°, which it can do because the
   input boxes are no longer riveted to the head and do not have to stay
   level: a hammer held ready is not a hammer lying flat.

   AND IT IS SLOW. 640ms was one blur and the burst was over before you had
   found it. 1300ms, with the wind-up eased and HELD at the top for a beat of
   anticipation, the strike quick, and the head resting on the face after it
   lands. Everything else on the beat is timed to the same 1300ms and to the
   same 56% - the impact - so the anvil shudder, the rock squash, the burst and
   the new pieces all land together instead of drifting apart. */
@keyframes hammerarc{
  0%{transform:rotate(-62deg)}
  5%{transform:rotate(-57deg)}        /* the weight shifts before it lifts */
  36%{transform:rotate(-82deg)}       /* THE UPSWING, slow and deliberate */
  46%{transform:rotate(-84deg)}       /* held at the top */
  58%{transform:rotate(6deg)}         /* THE STRIKE */
  62%{transform:rotate(4deg)}
  74%{transform:rotate(3deg)}         /* resting on the face */
  88%{transform:rotate(-46deg)}
  100%{transform:rotate(-62deg)}
}
@keyframes hammerbounce{
  0%{transform:rotate(-62deg)}
  5%{transform:rotate(-57deg)}
  36%{transform:rotate(-82deg)}
  46%{transform:rotate(-84deg)}
  57%{transform:rotate(5deg)}
  64%{transform:rotate(-34deg)}       /* straight back off the face */
  72%{transform:rotate(-12deg)}
  82%{transform:rotate(-44deg)}
  100%{transform:rotate(-62deg)}
}
/* A FULL THREE SECONDS, and it is one move with four beats in it: the weight
   shifts, the hammer goes UP, it hangs at the top, and then it comes down.
   1300ms had no upswing worth the name and the burst was gone before you had
   found it. */
.anvilstage[data-anim] .hammerswing{transform-origin:176px 10px;
  animation:hammerarc 3000ms cubic-bezier(.34,0,.48,1) 1}
.anvilstage[data-anim=glance] .hammerswing{animation-name:hammerbounce}
/* AT REST IT IS HELD UP AND BACK, CLEAR OF THE WORK. At −20° the head covered
   the expression cut into the ore by 49x10px - and the expression is 11px tall,
   so it was covering the thing the student is there to read. Measured against
   the label's own box: it clears from −55°, and this rests at −62°. */
.hammerswing{transform-origin:176px 10px; transform:rotate(-62deg)}
/* the anvil takes it, on the beat and not before */
/* everything on the beat shares the 3000ms clock and the same 58%, so the
   shudder, the squash, the burst and the pieces land together */
@keyframes anvilhit{0%,56%{transform:translate(0,0)}
  60%{transform:translate(-3px,3px)}66%{transform:translate(3px,-2px)}
  72%{transform:translate(-2px,1px)}78%{transform:translate(1px,0)}100%{transform:translate(0,0)}}
.anvilstage[data-anim] .anvilsvg{animation:anvilhit 3000ms ease-out 1}
@keyframes rockcrack{0%,56%{transform:scale(1)}62%{transform:scale(.88,1.12)}
  70%{transform:scale(1.07,.93)}82%{transform:scale(.98,1.02)}100%{transform:scale(1)}}
.anvilstage[data-anim=hit] .anvilrock{transform-box:fill-box; transform-origin:center bottom;
  animation:rockcrack 3000ms ease-out 1}
/* THE FINISHING BLOW LEAVES THE ANVIL BARE. The last piece squashes, blows
   apart and is gone, and `forwards` keeps it gone - there is nothing left to
   work, and an anvil with ore still on it says the opposite.
   Specificity beats the rockcrack rule above rather than relying on order. */
@keyframes rockgone{
  0%,56%{opacity:1; transform:scale(1)}
  62%{opacity:1; transform:scale(.84,1.16)}
  68%{opacity:.85; transform:scale(1.3,.66)}
  76%{opacity:.3; transform:scale(1.6,.42)}
  84%,100%{opacity:0; transform:scale(1.9,.3)}
}
/* AND A SHATTERED LUMP IS GONE WHETHER OR NOT ANYTHING IS PLAYING. The class
   is set by the paint, not by the animation, so a repaint of a finished bench -
   or reduced motion, or coming back to the lump later - used to draw the stone
   sitting whole on the anvil again. The keyframes above declare opacity at
   every step, so they still drive it while the blow runs. */
.anvilrock.shatter{opacity:0}
.anvilstage[data-anim=hit] .anvilrock.shatter{transform-box:fill-box; transform-origin:center bottom;
  animation:rockgone 3000ms ease-out 1 forwards}

/* THE BURST. Comic book: a jagged star and the word, punched in on the beat
   and held long enough to read before it goes. */
/* centred on the rock, which is where the face lands - a little left of the
   stage centre and just above halfway down */
.thud{position:absolute; left:47%; top:55%; transform:translate(-50%,-50%);
  pointer-events:none; opacity:0; z-index:4}
.thud .tstar{position:absolute; left:50%; top:50%; width:168px; height:168px; margin:-84px 0 0 -84px;
  background:radial-gradient(circle at 50% 50%, #FFD27A 0 34%, #E8A33D 55%, #C96A1F 100%);
  clip-path:polygon(50% 0%,60% 22%,83% 12%,77% 35%,100% 40%,80% 55%,96% 74%,72% 71%,73% 96%,53% 80%,
                    38% 100%,33% 76%,10% 84%,17% 61%,0% 50%,20% 38%,7% 17%,31% 22%,34% 2%)}
/* THE WORD IS DARK AND THE HALO IS LIGHT, not the other way round.
   It was cream (#FFF3DE) with a dark outline - and it is sitting on the STAR,
   which is pale gold. Cream on #FFD27A is 1.30:1; the letterforms were doing
   nothing and the only thing carrying the word was its own 6px outline. The
   fill and the stroke have swapped roles: near-black letters, a warm cream
   halo behind them, and the same drop shadow under the whole thing. Against
   the star's three stops the fill now reads 11.98 / 7.91 / 4.52. */
.thud .tword{position:relative; font-family:var(--display); font-size:38px; letter-spacing:.03em;
  color:#2A1806; paint-order:stroke; -webkit-text-stroke:6px #FFE9C4; text-shadow:0 4px 0 #7A4A12}
@keyframes thudpop{
  0%,56%{opacity:0; transform:translate(-50%,-50%) scale(.2) rotate(-16deg)}
  61%{opacity:1; transform:translate(-50%,-50%) scale(1.26) rotate(5deg)}
  66%{opacity:1; transform:translate(-50%,-50%) scale(.96) rotate(-3deg)}
  71%{opacity:1; transform:translate(-50%,-50%) scale(1.04) rotate(1deg)}
  90%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg)}
  100%{opacity:0; transform:translate(-50%,-50%) scale(1.1) rotate(0deg)}
}
.anvilstage[data-anim] .thud{animation:thudpop 3000ms cubic-bezier(.3,1.5,.5,1) 1}
@keyframes starspin{0%,56%{transform:rotate(0)}100%{transform:rotate(26deg)}}
.anvilstage[data-anim] .thud .tstar{animation:starspin 3000ms ease-out 1}
/* a glance is a smaller, colder ring of a word */
/* the same swap on the cold word: it was #DCE6EE on a silver star at 1.08:1,
   which is the worst reading on the site. Dark slate on the star's stops now
   reads 14.8 / 8.81 / 4.28. */
.anvilstage[data-anim=glance] .thud .tword{font-size:30px; color:#101820; -webkit-text-stroke:6px #EAF2F8; text-shadow:0 4px 0 #46545F}
.anvilstage[data-anim=glance] .thud .tstar{background:radial-gradient(circle at 50% 50%, #E6EEF4 0 34%, #A9B8C4 55%, #6E7E8C 100%)}

/* the pieces are held back so they arrive ON the beat - 58% of 3000ms.
   `backwards` is what holds them invisible through the delay, so the timeout
   in MF.swing that strips .fresh has to outlast delay + duration or they pop
   into view mid-upswing, before the hammer has landed. */
.piece.fresh{animation-delay:1740ms; animation-fill-mode:backwards}
/* the lamp in the gallery band overhead */
@keyframes galllamp{0%,100%{opacity:.85}42%{opacity:1}74%{opacity:.66}}
.gallglow{animation:galllamp 4.6s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){
  .anvilstage[data-anim] .hammerswing,.anvilstage[data-anim] .anvilsvg,
  .anvilstage[data-anim] .anvilrock,.anvilstage[data-anim] .thud .tstar,.gallglow{animation:none}
  /* the last piece is still GONE, it just does not perform going */
  .anvilstage[data-anim=hit] .anvilrock.shatter{animation:none; opacity:0}
  /* the burst still reports the hit, it just does not perform */
  .anvilstage[data-anim] .thud{animation:none; opacity:1; transform:translate(-50%,-50%)}
  .piece.fresh{animation-delay:0s}
}

/* casting */
.casting{border-radius:12px; padding:14px; margin-top:12px; border:3px solid}
.casting.clean{border-color:var(--vein); background:#F1F8F5}
.casting.deformed{border-color:var(--molten); background:#FDF0E7}
.casting h4{font-size:18px; margin-bottom:4px}
.casting.clean h4{color:var(--vein)}
.casting.deformed h4{color:#A33E0B}

/* ---- THE YARD AS A PLACE: fenced ground, a lamp on a post, a heap on the
       dirt and metal racked on timber. The drawing is BEHIND the controls and
       inert - the `overlay` group asserts that nothing painted in here can
       take a click meant for a rock. ---- */
/* the background-color is NOT cosmetic - the svg paints over it, but it is the
   only backdrop MF._measureContrast can read, and it is set to the LIGHTEST
   thing the scrimmed drawing puts behind text so the measurement is honest */
/* background-COLOR, not a background shorthand with a gradient in it. The
   shorthand resets background-color to transparent, MF._measureContrast reads
   background-color and would have walked straight past this to the cream panel
   underneath - measuring a backdrop that is not there. The colour is the
   LIGHTEST thing the drawing puts behind text, so the reading is honest; the
   gradient only darkens the dirt below the band. */
.yardplace{position:relative; border:3px solid #241C15; border-radius:12px; overflow:hidden; margin-top:8px;
  background-color:#3C3228;
  background-image:linear-gradient(180deg,rgba(0,0,0,0) 0 76px,rgba(0,0,0,.14) 76px,rgba(0,0,0,.30) 100%)}
/* the band is a fixed 76px at the top; everything below it is dirt drawn in
   CSS, which stretches without a shape in it to distort */
.yardart{position:absolute; left:0; right:0; top:0; height:76px; pointer-events:none}
.yardart svg{display:block; width:100%; height:76px}
.yardart svg *{pointer-events:none}
@keyframes yardlamp{0%,100%{opacity:.8}45%{opacity:1}72%{opacity:.62}}
.yardglow{animation:yardlamp 4.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){ .yardglow{animation:none} }
.yardin{position:relative; z-index:1; padding:11px 12px 13px}
.yardin .ylab{font-family:var(--display); font-size:10px; letter-spacing:.11em; color:var(--lamp); margin-bottom:5px}
.yardin .yempty{font-size:13px; font-style:italic; color:#C9B695; max-width:34ch}
.yardin .yhint{font-size:12px; color:#C9B695; margin-top:6px}
.shelfrow{margin-bottom:13px}
/* timber shelving, drawn in CSS so it grows with what is on it */
.rack{background:linear-gradient(180deg,rgba(90,68,50,.85),rgba(66,48,31,.85)); border:2px solid #332416;
  border-radius:8px; padding:8px; max-height:190px; overflow-y:auto}
.rack .shelf{border-bottom:3px solid #6E5B49; padding-bottom:7px; margin-bottom:7px}
.rack .shelf:last-child{border-bottom:0; margin-bottom:0; padding-bottom:0}
.rack .sh{font-size:11px; color:#E4D5BB; margin-bottom:3px}
/* the heap: rock lying on the dirt, sitting at slightly different heights so
   it reads as tipped rather than filed */
.heap{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; padding-top:3px}
/* THE HEAP IS DRAWN LUMPS NOW. It was a text chip in a rock-shaped clip-path -
   the last place in the mine where the expression sat BESIDE the stone rather
   than cut into it. MF.oreRock brings its own silhouette and its own shadow,
   so the button around it is nothing but a hit area and a grab handle. */
.heaprock{cursor:grab; background:none; border:0; padding:0; margin:0;
  width:132px; min-height:44px; touch-action:none;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.heaprock .orerock{max-width:none}
.heaprock .orelab{font-size:clamp(13px,1.5vw,17px)}
.heaprock:nth-child(2n){margin-bottom:5px}
.heaprock:nth-child(3n){margin-bottom:2px}
.heaprock:hover{filter:brightness(1.2) drop-shadow(0 2px 1px rgba(0,0,0,.5))}
.heaprock:active{cursor:grabbing}
.heaprock:focus-visible{outline:3px solid var(--lamp); outline-offset:2px}
/* what is in your hand while you carry it */
.dragghost{position:fixed; z-index:60; pointer-events:none; font-family:var(--display); font-size:15px;
  color:#FFF3DE; background:linear-gradient(160deg,#7A6650,#42382C); border:2px solid var(--lamp);
  border-radius:6px; padding:6px 11px; box-shadow:0 5px 14px rgba(0,0,0,.45); opacity:.94}
.dragghost[data-over=yes]{border-color:#8FE0C0; box-shadow:0 0 0 3px rgba(143,224,192,.35), 0 5px 14px rgba(0,0,0,.45)}
/* and where it can go */
.floorbox[data-drop=open]{outline:3px dashed var(--lamp); outline-offset:3px}

/* yard + gear */
.yard{position:sticky; top:12px}
@media (max-width:1080px){ .yard{position:static} }
.yard h3,.gearbox h3{font-size:14px; letter-spacing:.09em; text-transform:uppercase; color:var(--ore-t); margin-bottom:6px}
.metalrow{display:flex; flex-wrap:wrap; gap:6px; align-items:flex-start}
/* A BAR, AND UNDER IT THE LUMP IT CAME OUT OF. `.metal` is an inline-flex chip
   with a clip-path and an ore fleck in its `:before`; putting a second line
   inside it would have had to fight both. The cell is the column the caption
   needs, and the chip is untouched. */
.metalcell{display:flex; flex-direction:column; align-items:flex-start; max-width:190px}
.mfrom{font-size:11px; line-height:1.25; color:#E4D5BB; margin:1px 0 0 4px;
  font-family:var(--body)}
.mfrom .mmore{color:#C9B695; font-style:italic}
/* the yard is a RACK of bars, not a list of chips: each metal is a cast bar
   with a lit top edge and a shadow under it, stacked on timber shelving */
.metalrack{background:linear-gradient(180deg,#5A4432,#42301F); border:2px solid #332416;
  border-radius:11px; padding:10px; max-height:260px; overflow-y:auto}
/* .hint is a dark-on-cream colour; inside the dark rack it measured 1.08:1 */
.metalrack .hint{color:#E4D5BB}
.metalrack .shelf{border-bottom:3px solid #6E5B49; padding-bottom:8px; margin-bottom:8px}
.metalrack .shelf:last-child{border-bottom:0; margin-bottom:0; padding-bottom:0}
/* the bars are LIGHT metal: dark text on the old mid-grey measured 2.27:1,
   which had been true since the chips existed and had never been measured */
/* ORE, not boxes. Each metal is a lump with knocked-off corners sitting in a
   heap, with a chunk of raw rock alongside it - the yard is a place ore is
   collected, and it was reading as a filing cabinet. */
.metal{position:relative; display:inline-flex; align-items:center; gap:7px;
  background:linear-gradient(170deg,#E6ECF2 0%,#BFC9D3 58%,#9DA9B5 100%);
  color:#141B22; border:0; padding:7px 12px 8px 10px;
  clip-path:polygon(10% 0%, 92% 3%, 100% 42%, 94% 92%, 40% 100%, 4% 88%, 0% 34%);
  font-family:var(--display); font-size:14px; margin:2px;
  filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}
.metal:before{content:""; width:11px; height:11px; flex:0 0 auto;
  background:linear-gradient(150deg,#8A7358,#4A3F34);
  clip-path:polygon(20% 6%, 78% 0%, 100% 40%, 86% 88%, 40% 100%, 4% 70%, 0% 28%)}
.metal.pure:before{background:linear-gradient(150deg,#F2DCA4,#A5811F)}
/* rock on the heap is NOT metal on the rack, and must not be mistaken for it:
   dark, unlit, and it says so. Contrast measured on the dark rack. */
/* #8A7358 measured 4.09:1 against #FFF3DE and the contrast sweep failed the
   build over it on the first run. #7A6650 is 4.94:1 and is the same brown the
