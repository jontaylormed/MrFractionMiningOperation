};

/* ---------- the right column, top: what you are holding ---------- */
MF.paintForgeYard = function(host, st){
  var box = E('div','panel'); box.style.marginTop='0';
  box.appendChild(H('div','panel-tag','THE YARD'));

  var open = !!st.picked && !st.result;
  var want = open ? MF.slotsWanted(MF.TOOLS[st.picked]) : 0;

  var place = E('div','yardplace');
  place.appendChild(MF.yardScene());
  var inner = E('div','yardin');

  /* ---- the rack: what the forge can actually spend ---- */
  var rk = E('div','shelfrow');
  rk.appendChild(H('div','ylab','THE RACK &mdash; native metal, and the forge spends this'));
  var have = MF.yardList();
  if(!have.length){
    rk.appendChild(H('div','yempty','Bare. Break a lump all the way down in the mine and the metal is racked here.'));
  } else {
    var rack = E('div','rack');
    [['plain metal', function(g){ return g.m===0; }],
     ['metal with an x in it', function(g){ return g.m!==0; }]].forEach(function(grp){
      var these = have.filter(function(e){ return grp[1](e.ingot); });
      if(!these.length) return;
      var shelf = E('div','shelf');
      shelf.appendChild(H('div','sh', grp[0]));
      var row = E('div','metalrow');
      these.forEach(function(e){
        var used = st.slots.some(function(s){ return s.yardIdx===e.idx; });
        var b = E('button','metalbtn' + (isPlainMetal(e.ingot)?' pure':'') + (used?' spent':''));
        b.type='button';
        b.setAttribute('data-metal', e.idx);
        b.appendChild(H('span','ml', e.ingot.label || ingotText(e.ingot)));
        b.setAttribute('aria-label', (e.ingot.label || ingotText(e.ingot)) +
          (used ? ' — already in the mold' : (open ? ' — drop it in the mold' : ' — pick an order first')));
        b.title = used ? 'Already in the mold' : (open ? 'Drop it in the mold' : 'Pick an order first');
        on(b,'click',function(){
          /* NOT A DEAD CONTROL WHEN NOTHING IS OPEN. It says what is missing
             instead of doing nothing, which is how the old chips behaved. */
          if(used){ st.note = 'That one is already in the mold. Click it in the slot to take it back out.'; MF.paintForge(); return; }
          if(!open){ st.note = 'Pick an order from the board on the left first, and the mold will open.'; MF.paintForge(); return; }
          if(st.slots.length >= want){ st.note = 'The mold is full. Take something out of a slot if you want to change it.'; MF.paintForge(); return; }
          st.slots.push({yardIdx:e.idx, key:e.key, ingot:e.ingot});
          st.note = null;
          MF.paintForge();
        });
        row.appendChild(b);
      });
      shelf.appendChild(row);
      rack.appendChild(shelf);
    });
    rk.appendChild(rack);
  }
  inner.appendChild(rk);

  /* ---- the heap: here, and deliberately not spendable ---- */
  var hp = E('div','heaprow');
  hp.appendChild(H('div','ylab','THE HEAP &mdash; still carrying a seam'));
  if(!MF.state.rockpile.length){
    hp.appendChild(H('div','yempty','Nothing tipped here. Anything you leave half-broken in the mine lands on the heap.'));
  } else {
    var heap = E('div','heap');
    MF.state.rockpile.forEach(function(o){
      var r = E('div','heaprock cold');
      r.appendChild(H('span','hv', MF.oreLabel(o)));
      r.setAttribute('aria-label', MF.oreText(o) + ' — still rock. The forge cannot spend it until it is broken down.');
      heap.appendChild(r);
    });
    hp.appendChild(heap);
    hp.appendChild(H('div','yhint','<b>The furnace will not take rock.</b> Anything on the heap still has a seam in it — break it down in the mine and the metal comes back here.'));
  }
  inner.appendChild(hp);

  place.appendChild(inner);
  box.appendChild(place);
  host.appendChild(box);
};

/* how many slots an order's mold has. This used to special-case matchedPair to
   2 - which its own `count` already says, and every other order's does too. */
MF.slotsWanted = function(t){ return t.slots; };

/* ---------- the right column, below: the mold ---------- */
MF.paintCraft = function(host, st){
  var box = E('div','panel craft');
  box.appendChild(H('div','panel-tag','THE CRAFT FLOOR'));

  if(st.note){
    box.appendChild(H('div','note', st.note));
    st.note = null;
  }

  if(!st.picked){
    box.appendChild(H('div','coldmold','The mold is cold.'));
    box.appendChild(MF.says('<b>Mr Factor:</b> Pick an order off the board and I will open the mold. ' +
      'Whatever you drop in gets used up — so if you spend your only (x + 3), you will be going back down for another.'));
    host.appendChild(box);
    return;
  }

  var t = MF.TOOLS[st.picked];
  box.appendChild(H('div','crafthead','<span class="ci">' + t.ic + '</span><b>' + t.nm + '</b>'));

  /* once poured, the casting IS the panel - the slots are gone and what the
     student is looking at is the thing they made */
  if(st.result){
    box.appendChild(st.result);
    host.appendChild(box);
    return;
  }

  /* THE TARGET, LARGE AND ON SCREEN THE WHOLE TIME. It is the question being
     asked, and asking it in a hint under the heading made it scenery. */
  var tgt = E('div','castfor');
  tgt.appendChild(H('div','cflab','THIS MOLD IS CUT FOR'));
  tgt.appendChild(H('div','cfeq', MF.castText(t)));
  tgt.appendChild(H('div','cfwhy', t.forge));
  box.appendChild(tgt);

  var want = MF.slotsWanted(t);
  var cru = E('div','crucible');
  cru.appendChild(H('h4',null,'What is going in'));
  var slotRow = E('div','ingotrow');
  for(var i=0;i<want;i++){
    (function(idx){
      var got = st.slots[idx];
      if(got){
        var chip = E('button','ingot' + (isPlainMetal(got.ingot)?' pure':''));
        chip.type='button';
        chip.appendChild(document.createTextNode(ingotText(got.ingot)));
        chip.title='Take it back out';
        chip.setAttribute('aria-label', ingotText(got.ingot) + ' is in the mold. Take it back out.');
        on(chip,'click',function(){ st.slots.splice(idx,1); st.note=null; MF.paintForge(); });
        slotRow.appendChild(chip);
      } else {
        var empty = H('div','slot moldslot','<span style="opacity:.6">empty</span>');
        slotRow.appendChild(empty);
      }
    })(i);
  }
  cru.appendChild(slotRow);
  cru.appendChild(H('div','hint', st.slots.length
    ? 'Click one to take it back out.'
    : 'Click a metal on the rack above to drop it in.'));
  box.appendChild(cru);

  /* WHAT IT IS WAITING FOR, when you cannot fill it. The old board disabled
     the button and said "not enough metal yet", which named nothing you could
     go and look for. */
  if(!MF.toolReady(st.picked) && st.slots.length < want){
    box.appendChild(H('div','note warn','<b>The rack cannot make ' + MF.castText(t) + ' yet.</b> ' +
      'No ' + want + ' metals on it multiply to that. Nothing is locked — break more ore and what comes out is racked here.'));
  }

  var full = st.slots.length === want;
  var pourRow = E('div','row'); pourRow.style.marginTop='12px';
  var pour = E('button','btn primary big','Pour the mold'); pour.type='button';
  pour.disabled = !full;
  on(pour,'click',function(){ MF.forgePour(st); });
  pourRow.appendChild(pour);
  if(!full) pourRow.appendChild(H('div','hint','The mold is not full yet.'));
  box.appendChild(pourRow);
  host.appendChild(box);
};

MF.forgePour = function(st){
  var t = MF.TOOLS[st.picked];
  var ingots = st.slots.map(function(s){ return s.ingot; });
  var prod = ingotProduct(ingots);
  var sound = MF.forgeJudge(t, ingots, prod);

  var box = E('div','casting castingwrap ' + (sound.ok?'clean':'deformed'));
  box.appendChild(H('h4',null, sound.ok ? 'The part came out sound.' : 'It came out scrap.'));
  /* joined with a dot: three plain metals ran together as "22 2" and an
     x-ingot printed as a bare "(x)" beside them, which read as nonsense */
  box.appendChild(H('div','eq sm','you poured ' + ingots.map(function(g){
    return (g.m===0) ? num(g.k) : '(' + linear(g.m,g.k) + ')'; }).join(' &middot; ')));
  box.appendChild(H('div','eq sm','the mold formed <b>' +
    (prod.overflow ? 'something of degree ' + prod.degree : quad(prod.a,prod.b,prod.c)) + '</b>'));
  box.appendChild(H('p',null, sound.why));
  st.result = box;

  if(sound.ok){
    MF.spendFromYard(st.slots.map(function(s){ return s.key; }));
    MF.state.tools[st.picked] = {forged:true};
    var keep = E('button','btn primary','Hang it on your belt'); keep.type='button';
    on(keep,'click',function(){ st.picked=null; st.slots=[]; st.result=null; MF.paintForge(); });
    box.appendChild(keep);
  } else {
    var again = E('button','btn','Rake it out and try again'); again.type='button';
    on(again,'click',function(){ st.slots=[]; st.result=null; MF.paintForge(); });
    box.appendChild(again);
  }
  MF.paintForge();
  /* THE ONE SCROLL WORTH DOING, and only when it is needed. The casting is the
     answer to the pour; if it lands below the fold the student poured and saw
     nothing. `nearest` moves the page as little as it can, so it is a nudge
     rather than the jump to the masthead this screen used to do on every
     single click. */
  if(box.isConnected && box.getBoundingClientRect().bottom > window.innerHeight)
    box.scrollIntoView({block:'nearest', behavior:'smooth'});
};

/* WHAT MAKES A PART SOUND, and there is now exactly one rule: the casting is
   the object the order named, or it is not.

   This replaced seven bespoke shape predicates - "all plain and prime", "two
   ingots that both carry an x", "the same x-part and opposite numbers". Each
   was a different idea of correctness, none of them was the thing a
   factorisation actually is, and a student could satisfy every one of them
   without ever hitting a particular object.

   A miss is DESCRIBED, term by term, exactly as the mine describes a pick that
   glanced off: which part came out wrong and what the order wanted there. */
MF.forgeJudge = function(t, ingots, prod){
  var want = t.cast;
  if(prod.overflow)
    return {ok:false, why:'That is more metal than the mold holds — it has run over the sides. ' +
      'The order is for <b>' + MF.castText(t) + '</b>, and what you poured is bigger than that.'};
  if(prod.a===want.a && prod.b===want.b && prod.c===want.c)
    return {ok:true, why:'That is <b>' + MF.castText(t) + '</b>, exactly. Those metals were the ones in it — ' +
      'and finding which metals multiply to a named object is the same work as taking one apart, run the other way.'};

  var off = [];
  if(prod.a!==want.a) off.push('the x² came out <b>' + num(prod.a) + '</b> and the order wants <b>' + num(want.a) + '</b>');
  if(prod.b!==want.b) off.push('the middle came out <b>' + num(prod.b) + '</b> and the order wants <b>' + num(want.b) + '</b>');
  if(prod.c!==want.c) off.push('the plain number came out <b>' + num(prod.c) + '</b> and the order wants <b>' + num(want.c) + '</b>');
  return {ok:false, why:'The mold was cut for <b>' + MF.castText(t) + '</b> and this came out <b>' +
    quad(prod.a,prod.b,prod.c) + '</b>. Where it missed: ' + off.join('; ') + '.'};
};

/* =========================================================================
   THE MINE
   ========================================================================= */
MF.SCREENS.mine = function(host){
  var grid = E('div','minegrid');
  var colL = E('div'), colM = E('div'), colR = E('div');
  grid.appendChild(colL); grid.appendChild(colM); grid.appendChild(colR);
  host.appendChild(grid);
  MF._mine = {left:colL, mid:colM, right:colR};
  MF.paintMine();
};
MF.paintMine = function(){
  /* isConnected, same guard drainFlashes carries: MF._mine outlives a
     navigation away from the mine, and painting into a detached column is the
     silent-failure class that already cost a review cycle (s35) */
  if(!MF._mine || !MF._mine.mid || !MF._mine.mid.isConnected) return;
  MF.paintShaft(); MF.paintFace(); MF.paintYard();
  MF.drainFlashes();          /* after the repaint, so a message survives it */
};

/* ---------- the shaft: descend freely, no gate anywhere ---------- */
MF.paintShaft = function(){
  var host = clear(MF._mine.left);
  var box = E('div','shaft');
  box.appendChild(H('h3',null,'The Shaft'));
  box.appendChild(H('div','hint','Go as deep as you like. You never have to break anything to descend — fill the cart and work it whenever you feel like it.'));

  /* the drawn shaft on the left, the layer buttons on the right */
  var body = E('div','shaftbody');
  var way = E('div','shaftway');
  way.appendChild(E('div','sets'));
  way.appendChild(E('div','ladder'));
  var cable = E('div','cable');
  way.appendChild(cable);
  var cage = E('div','cage');
  way.appendChild(cage);
  body.appendChild(way);
  var rungs = E('div'); rungs.style.flex='1 1 auto';
  body.appendChild(rungs);
  box.appendChild(body);

  MF.LAYERS.forEach(function(L){
    var b = E('button','layer'); b.type='button';
    b.appendChild(H('span','n','LAYER ' + L.n));
    b.appendChild(document.createTextNode(L.name));
    b.appendChild(H('div','hint', L.what));
    if(MF.state.layer===L.n) b.setAttribute('aria-current','true');
    on(b,'click',function(){
      MF.state.layer = L.n;
      if(L.n > MF.state.deepest) MF.state.deepest = L.n;
      MF.paintMine();
    });
    rungs.appendChild(b);
  });
  MF.SHUT_SHAFTS.forEach(function(s){
    var b = E('button','layer shut'); b.type='button'; b.disabled = true;
    b.appendChild(H('span','n','NOT YET TIMBERED'));
    b.appendChild(document.createTextNode(s.name));
    b.appendChild(H('div','hint', s.what));
    rungs.appendChild(b);
  });
  host.appendChild(box);

  /* ride the cage to whichever layer is being worked. Measured from the real
     button positions rather than assumed, so it stays right when the layer
     list changes length. */
  /* paintMine rebuilds the shaft on every click, so the cage is a NEW element
     each time and a CSS transition on it would have nothing to move from.
     It is planted at the last known position first, then sent to the new one
     on the next frame - which is what makes the ride visible. */
  requestAnimationFrame(function(){
    var btns = rungs.querySelectorAll('.layer:not(.shut)');
    var here = btns[MF.state.layer-1];
    if(!here) return;
    var wayTop = way.getBoundingClientRect().top;
    var mid = here.getBoundingClientRect().top + here.getBoundingClientRect().height/2 - wayTop;
    var top = Math.max(4, Math.min(way.clientHeight - 44, mid - 20));

    var from = (MF.state.cageTop == null) ? top : MF.state.cageTop;
    cage.style.transition = 'none';
    cage.style.top = from + 'px';
    cable.style.transition = 'none';
    cable.style.height = (from + 6) + 'px';
    void cage.offsetHeight;                       /* commit the start position */
    requestAnimationFrame(function(){
      cage.style.transition = '';
      cable.style.transition = '';
      cage.style.top = top + 'px';
      cable.style.height = (top + 6) + 'px';
      MF.state.cageTop = top;
    });
  });
};

/* =========================================================================
   EACH LAYER IS ITS OWN STONE. Palette, strata and glint change with depth,
   so descending LOOKS like descending rather than reading like a new label.
   ========================================================================= */
MF.LAYER_LOOK = [
  {sky:'#8A7458', rock:'#6E5A40', rock2:'#4A3B28', ore:'#C9A24B', glint:'#FFE9A8', strata:'#7E6A4E', grit:'#8C7554'},
  {sky:'#6E6152', rock:'#5C5140', rock2:'#3C3428', ore:'#C96A1F', glint:'#F6C98A', strata:'#6B5F4C', grit:'#7A6C56'},
  {sky:'#4E5A63', rock:'#44525C', rock2:'#2B343B', ore:'#7FB6C9', glint:'#D8F0F7', strata:'#54626C', grit:'#5E6E78'},
  {sky:'#5A3F3A', rock:'#4E3630', rock2:'#31201C', ore:'#C4543F', glint:'#F7C0A8', strata:'#5C443D', grit:'#6A4A42'},
  {sky:'#33302E', rock:'#2E2A28', rock2:'#191716', ore:'#E2600F', glint:'#FFB347', strata:'#3A3532', grit:'#443E3A'}
];

/* the rocks currently exposed on the face - you look before you break */
/* THE SEAM. The face is not a wall you stand in front of - it is a length of
   rock you SCAN ALONG. It is several screens wide, it scrolls, and the ore is
   spread down its length, so looking for something worth breaking is real
   movement rather than reading a grid of seven.
   SEAM_W is the drawn width; the viewport shows roughly a third of it. */
MF.SEAM_W = 2280;
MF.SEAM_H = 190;
MF.SEAM_COUNT = 15;

MF.stockFace = function(){
  var L = MF.state.layer;
  if(MF.state.faceLayer !== L){
    MF.state.face = []; MF.state.faceLayer = L; MF.state.inspecting = null; MF.state.scan = 0;
  }
  var guard = 0;
  while(MF.state.face.length < MF.SEAM_COUNT && guard++ < 60){
    var o = MF.digOre(L, MF.state.rng);
    if(!o) break;
    /* GENUINELY RANDOM, not modulo arithmetic on the slot index. The old
       formulas were deterministic in the slot, so every layer laid its rocks
       out in the same repeating rhythm at the same repeating sizes and the
       seam looked stamped rather than dug. The slot still sets the coarse
       spacing, which is what keeps ore spread along the whole length. */
    var rng = MF.state.rng;
    var span = (MF.SEAM_W - 200) / (MF.SEAM_COUNT - 1);
    o.slot = MF.nextSeamSlot();
    o.px = 100 + o.slot * span + (rng() - 0.5) * span * 0.6;
    o.py = 50 + rng() * 142;
    o.sz = 26 + rng() * 24;
    o.rot = rng() * Math.PI * 2;
    /* its own silhouette: a different number of faces, each pulled in or out
       by a different amount, so no two lumps are the same rock twice */
    o.faces = [];
    var nf = 7 + Math.floor(rng() * 4);
    for(var f=0; f<nf; f++) o.faces.push(0.68 + rng() * 0.5);
    MF.state.face.push(o);
  }
  return MF.state.face;
};
/* the emptiest position along the seam, so ore refills where it was taken */
MF.nextSeamSlot = function(){
  var used = {};
  MF.state.face.forEach(function(o){ used[o.slot] = true; });
  for(var i=0;i<MF.SEAM_COUNT;i++){ if(!used[i]) return i; }
  return MF.state.face.length % MF.SEAM_COUNT;
};

/* =========================================================================
   THE HAULAGE ROAD. A cart running the track above the cart box - the ore
   you break has to get out somehow. Decorative: no text, no information,
   and the animated parts sit on mounts so nothing drifts (see animmount).
   ========================================================================= */
MF.cartTrack = function(){
  var wrap = E('div','carttrack');
  var W=600, VH=86;
  var svg = S('svg',{viewBox:'0 0 '+W+' '+VH,'aria-hidden':'true'});
  function R(x,y,w,h,f,extra){ var n=S('rect',{x:x,y:y,width:w,height:h,fill:f});
    if(extra) for(var k in extra) n.setAttribute(k,extra[k]); svg.appendChild(n); return n; }

  /* tunnel wall behind, with timber sets receding down the road */
  R(0,0,W,VH,'#2E2620');
  for(var s=0;s<9;s++){
    var sx = s*72 + 6;
    R(sx,8,7,54,'#4A3B2C',{opacity:'.85'});
    R(sx+50,8,7,54,'#4A3B2C',{opacity:'.85'});
    R(sx,4,57,7,'#5A4432',{opacity:'.85'});
  }
  for(var g=0; g<44; g++){
    svg.appendChild(S('circle',{cx:(g*97)%W, cy:(g*31)%58, r:1+((g*7)%2), fill:'#5A4B3C', opacity:'.4'}));
  }
  /* sleepers and rails */
  for(var t=0;t<30;t++) R(t*21+3,66,13,5,'#5A4B3C',{rx:'1'});
  R(0,64,W,3,'#8A9AA6',{opacity:'.85'});
  R(0,73,W,3,'#8A9AA6',{opacity:'.6'});
  R(0,78,W,8,'#241C15');

  /* the cart: an outer group carries the roll, an inner one the jolt, and the
     wheels spin on their own mounts - none of them owns a transform attribute */
  var roll = S('g',{class:'ct-cart'});
  var jolt = S('g',{class:'ct-jolt'});
  jolt.appendChild(S('path',{d:'M0 30 L74 30 L66 62 L8 62 Z',fill:'#5A6570',stroke:'#39424B','stroke-width':'2'}));
  jolt.appendChild(S('rect',{x:'-3',y:'24',width:'80',height:'9',rx:'3',fill:'#8A9AA6'}));
  jolt.appendChild(S('path',{d:'M8 62 L66 62 L64 66 L10 66 Z',fill:'#39424B'}));
  /* ore heaped above the rim */
  [[16,20,9],[30,15,11],[46,18,10],[58,22,8],[38,24,9]].forEach(function(o){
    jolt.appendChild(S('path',{d:'M'+o[0]+' '+(o[1]+o[2])+
      ' l'+(o[2]*0.3)+' -'+o[2]+' l'+(o[2]*0.8)+' -'+(o[2]*0.2)+' l'+(o[2]*0.5)+' '+(o[2]*0.9)+' Z',
      fill:(o[2]>9?'#8A7358':'#6E5A45')}));
  });
  jolt.appendChild(S('circle',{cx:'34',cy:'18',r:'3.4',fill:'#C8A24B'}));
  roll.appendChild(jolt);
  [[18,66],[56,66]].forEach(function(w){
    var mount = S('g',{transform:'translate('+w[0]+','+w[1]+')'});
    var wheel = S('g',{class:'ct-wheel'});
    wheel.appendChild(S('circle',{cx:'0',cy:'0',r:'8',fill:'#2E353C',stroke:'#6E7A86','stroke-width':'2'}));
    wheel.appendChild(S('rect',{x:'-1.5',y:'-8',width:'3',height:'16',fill:'#6E7A86'}));
    wheel.appendChild(S('rect',{x:'-8',y:'-1.5',width:'16',height:'3',fill:'#6E7A86'}));
    mount.appendChild(wheel);
    roll.appendChild(mount);
  });
  svg.appendChild(roll);

  wrap.appendChild(svg);
  return wrap;
};

/* ---------- the face: look, choose, break ---------- */
MF.paintFace = function(){
  var host = clear(MF._mine.mid);
  var L = MF.LAYERS[MF.state.layer-1];
  var look = MF.LAYER_LOOK[MF.state.layer-1];
  var rocks = MF.stockFace();

  var wall = E('div','wall');
  wall.style.background = 'linear-gradient(180deg,'+look.rock+','+look.rock2+')';
  wall.appendChild(H('h3',null,'Layer ' + L.n + ' &mdash; ' + L.name));
  wall.appendChild(H('div','depthline', 'The ore here is ' + L.what + '. Look one over before you swing &mdash; nothing breaks until you say so.'));

  /* the viewport scrolls; the seam inside it is far wider than the screen */
  var faceBox = E('div','face seamview');
  var W=MF.SEAM_W, VH=MF.SEAM_H;
  var svg = S('svg',{viewBox:'0 0 '+W+' '+VH,role:'group',
    'aria-label':'A seam of rock at layer '+L.n+', wider than the screen. Scroll or use the scan buttons to move along it.'});
  svg.setAttribute('width', W);
  svg.style.width = W + 'px';
  svg.style.maxWidth = 'none';

  var defs = S('defs',{});
  var g1 = S('linearGradient',{id:'wallg'+L.n,x1:'0',y1:'0',x2:'0',y2:'1'});
  g1.appendChild(S('stop',{offset:'0%','stop-color':look.rock}));
  g1.appendChild(S('stop',{offset:'100%','stop-color':look.rock2}));
  defs.appendChild(g1); svg.appendChild(defs);
  svg.appendChild(S('rect',{x:0,y:0,width:W,height:VH,fill:'url(#wallg'+L.n+')'}));

  /* strata - the rock itself changes with depth, and runs the seam's length */
  for(var s=0;s<9;s++){
    var yy = 14 + s*27 + ((s*11)%9);
    /* strata repeat along the whole length so the seam never looks like it ends */
    var d = 'M0 '+yy;
    for(var seg=0; seg<W; seg+=260){
      d += ' q130 '+((seg/260)%2 ? 9 : -9)+' 260 '+((seg/260)%3===0 ? 3 : -2);
    }
    svg.appendChild(S('path',{d:d, fill:'none', stroke:look.strata,
      'stroke-width':(s%3===0?3:1.6), opacity:'.5'}));
  }
  for(var gq=0;gq<220;gq++){
    svg.appendChild(S('circle',{cx:(gq*173)%W, cy:(gq*53)%VH, r:1+((gq*7)%3), fill:look.grit, opacity:'.45'}));
  }

  /* the rocks */
  rocks.forEach(function(o, idx){
    var g = S('g',{class:'rock',tabindex:'0',role:'button','data-i':idx,
      'aria-label':'A lump of ore: ' + MF.oreText(o) + '. Look at it, then break it.'});
    if(MF.state.inspecting===idx) g.setAttribute('data-sel','on');
    var x=o.px, y=o.py, r=o.sz;
    var sel = S('circle',{class:'sel',cx:x,cy:y,r:r+9,fill:'none',stroke:'#E8A33D','stroke-width':'3','stroke-dasharray':'6 5'});
    g.appendChild(sel);
    var body = S('g',{class:'body'});
    var pts = [];
    var faces = o.faces || [0.9,0.8,1,0.85,0.95,0.8,0.9];
    for(var k=0;k<faces.length;k++){
      var ang = (o.rot||0) + k*(Math.PI*2/faces.length);
      var rad = r * faces[k];
      pts.push((x+rad*Math.cos(ang)).toFixed(1)+','+(y+rad*Math.sin(ang)).toFixed(1));
    }
    body.appendChild(S('polygon',{points:pts.join(' '),fill:look.rock,stroke:look.rock2,'stroke-width':'3'}));
    /* ore veins inside: one streak per term, so a rock LOOKS like what it is */
    var terms = (o.kind==='number') ? 1 : [o.a,o.b,o.c].filter(function(v){ return v!==0; }).length;
    for(var t=0;t<terms;t++){
      body.appendChild(S('path',{d:'M'+(x-r*0.6)+' '+(y-r*0.3+t*7)+' q'+(r*0.5)+' '+(t%2?6:-6)+' '+(r*1.2)+' '+(t%2?-3:3),
        fill:'none',stroke:look.ore,'stroke-width':'3','stroke-linecap':'round',opacity:'.92'}));
    }
    body.appendChild(S('circle',{class:'glint',cx:x-r*0.34,cy:y-r*0.38,r:'3.4',fill:look.glint}));
    g.appendChild(body);
    /* not while a swing is in the air: rebuilding the face mid-break orphaned
       the shatter, threw the pick across the seam, and wiped the selection the
       student was reading. breaking guarded breakRock but not inspection. */
    /* NOT named `look`. A function declaration is hoisted to the top of its
       enclosing scope, so `function look()` here shadowed the outer `look`
       palette for the whole callback - look.rock, look.ore and look.glint all
       became undefined and every rock painted solid black. The seam looked
       like its ore had failed to render, and nothing threw. */
    function inspectThis(){
      /* A SWING IN THE AIR MUST NOT BE INTERRUPTED - BUT IT MUST STILL ANSWER.
         This used to `return` on the spot, so during the 900ms of a break every
         rock on the face was a control that did nothing and said nothing. */
      if(MF.state.breaking){ MF.knockRock(g, o, true); return; }
      MF.state.inspecting=idx;
      MF.paintMine();
      /* THE FACE HAS JUST BEEN REBUILT, so `g` is detached and animating it
         would play the knock on a node nobody can see. data-i survives the
         repaint; the element reference does not. */
      var fresh = MF._mine && MF._mine.mid &&
                  MF._mine.mid.querySelector('.face .rock[data-i="'+idx+'"]');
      MF.knockRock(fresh || g, o, false);
      /* make sure the answer is on screen. A click that works but whose
         response is below the fold is indistinguishable from a dead control. */
      var panel = MF._mine && MF._mine.mid && MF._mine.mid.querySelector('.inspect');
      if(panel && panel.getBoundingClientRect().bottom > window.innerHeight){
        panel.scrollIntoView({block:'nearest', behavior:'smooth'});
      }
    }
    on(g,'click',inspectThis);
    on(g,'keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); inspectThis(); } });
    svg.appendChild(g);
  });

  /* The pick stands beside whichever lump is being looked at, not parked at a
     fixed spot - on a seam this wide a fixed pick would usually be off-screen
     when the swing happened, so the student would never see it land. */
  var target = (MF.state.inspecting!=null && rocks[MF.state.inspecting]) ? rocks[MF.state.inspecting] : null;
  var pickX = target ? Math.min(W-110, Math.max(10, target.px + target.sz + 16)) : (W-104);
  var pickY = target ? Math.min(VH-100, Math.max(4, target.py - 40)) : (VH-96);
  /* style.transform, not the attribute, so it can be eased as the pick follows
     the cursor along the face */
  var pick = S('g',{});
  pick.style.transform = 'translate('+pickX+'px,'+pickY+'px)';
  pick.style.transition = 'transform .16s ease-out';
  var arm = S('g',{class:'pickarmhost'});
  /* handle, then a proper double-ended pick head: two tapered points curving
     down from a thick centre. The first attempt drew a grey fan. */
  arm.appendChild(S('rect',{x:'40',y:'10',width:'9',height:'92',rx:'3',fill:'#8A6A45'}));
  arm.appendChild(S('rect',{x:'38',y:'44',width:'13',height:'7',rx:'2',fill:'#6B5335'}));
  arm.appendChild(S('path',{d:'M2 26 q20 -20 42 -16 q22 -4 42 16 q-6 4 -12 3 q-16 -11 -30 -9 q-14 -2 -30 9 q-6 1 -12 -3 Z',
    fill:'#9AA3AB',stroke:'#4A5158','stroke-width':'2','stroke-linejoin':'round'}));
  arm.appendChild(S('rect',{x:'36',y:'6',width:'17',height:'10',rx:'3',fill:'#5A626A'}));
  pick.appendChild(arm);
  svg.appendChild(pick);
  MF._pickArm = arm;

  /* THE PICK FOLLOWS THE CURSOR while it is over the face - you are holding it
     while you look the seam over, and it goes back to standing beside the lump
     you picked out when the pointer leaves. */
  function pickHome(){
    pick.style.transform = 'translate('+pickX+'px,'+pickY+'px)';
  }
  on(faceBox,'pointermove',function(e){
    if(MF.state.breaking) return;
    var r = svg.getBoundingClientRect();
    if(!r.width) return;
    var scale = W / r.width;
    var ux = (e.clientX - r.left) * scale;
    var uy = (e.clientY - r.top) * scale;
    var nx = Math.max(6, Math.min(W-108, ux - 46));
    var ny = Math.max(2, Math.min(VH-104, uy - 62));
    pick.style.transform = 'translate('+nx+'px,'+ny+'px)';
  });
  on(faceBox,'pointerleave',function(){ if(!MF.state.breaking) pickHome(); });

  faceBox.appendChild(svg);
  wall.appendChild(faceBox);

  /* ---- scanning along the seam ---- */
  var scanRow = E('div','row'); scanRow.style.marginTop='10px'; scanRow.style.alignItems='center';
  function scanBtn(label, dir){
    var b = E('button','btn', label); b.type='button';
    b.style.background='#241D18'; b.style.color='#E4D5BB'; b.style.borderColor='#6B5B48';
    on(b,'click',function(){ faceBox.scrollBy({left: dir * Math.round(faceBox.clientWidth*0.8), behavior:'smooth'}); });
    return b;
  }
  scanRow.appendChild(scanBtn('◀ scan back', -1));
  scanRow.appendChild(scanBtn('scan along ▶', 1));
  var posWrap = E('div'); posWrap.style.flex='1 1 160px'; posWrap.style.minWidth='140px';
  posWrap.appendChild(H('div','hint','Where you are along the seam'));
  var track = E('div');
  track.style.cssText='height:10px;border-radius:999px;background:#241D18;border:2px solid #6B5B48;position:relative;overflow:hidden';
  var marker = E('div');
  marker.style.cssText='position:absolute;top:0;bottom:0;width:26%;background:var(--lamp);border-radius:999px;transition:left .12s linear';
  track.appendChild(marker); posWrap.appendChild(track);
  scanRow.appendChild(posWrap);
  /* scanRow is built here but NOT appended here - it goes on after the inspect
     panel below, so what you are looking at sits directly under the rock and
     the seam navigation follows it. (Appending `insp` at this point referenced
     a variable declared 40 lines further down: hoisted, undefined, and it threw
     - which emptied the whole middle column. CLAUDE.md rule 1.) */

  /* keep the position marker honest as the student scrolls or drags */
  function syncMarker(){
    var max = Math.max(1, faceBox.scrollWidth - faceBox.clientWidth);
    var frac = faceBox.scrollLeft / max;
    var vis = faceBox.clientWidth / Math.max(1, faceBox.scrollWidth);
    marker.style.width = Math.max(8, vis*100).toFixed(1) + '%';
    marker.style.left = (frac * (100 - Math.max(8, vis*100))).toFixed(1) + '%';
    MF.state.scan = faceBox.scrollLeft;
  }
  on(faceBox,'scroll',syncMarker);

  /* drag to scan. A rock click still works because a drag under a few pixels
     is not treated as a drag at all. */
  var dragging=false, startX=0, startLeft=0, moved=0;
  on(faceBox,'pointerdown',function(e){
    dragging=true; moved=0; startX=e.clientX; startLeft=faceBox.scrollLeft;
    faceBox.style.scrollBehavior='auto';
  });
  on(faceBox,'pointermove',function(e){
    if(!dragging) return;
    var dx = e.clientX - startX;
    moved = Math.max(moved, Math.abs(dx));
    if(moved > 4){ faceBox.scrollLeft = startLeft - dx; }
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    on(faceBox,ev,function(){ dragging=false; faceBox.style.scrollBehavior='smooth'; });
  });
  on(faceBox,'click',function(e){ if(moved>4){ e.stopPropagation(); e.preventDefault(); moved=0; } }, true);
  host.appendChild(wall);
  /* restore where they were, and centre the lump they are looking at */
  if(target){
    var wantLeft = (target.px / W) * faceBox.scrollWidth - faceBox.clientWidth/2;
    faceBox.scrollLeft = Math.max(0, wantLeft);
  } else {
    faceBox.scrollLeft = MF.state.scan || 0;
  }
  syncMarker();
  MF._seamView = faceBox;

  /* ---- inspect, then break ---- */
  var insp = E('div','inspect');
  if(MF.state.inspecting==null || !rocks[MF.state.inspecting]){
    insp.appendChild(H('div','label','THE FACE'));
    insp.appendChild(H('div','obs','Nothing picked out yet. Click a lump in the wall and have a proper look at it first — you can turn over as many as you like without breaking any.'));
  } else {
    var o = rocks[MF.state.inspecting];
    insp.appendChild(H('div','label','YOU ARE LOOKING AT'));
    insp.appendChild(H('div','expr', MF.oreLabel(o)));
    /* one line, not a four-bullet list: this panel and the swing button have to
       sit on the same screen as the rock they describe, or a click produces no
       response the student can see */
    var terms = (o.kind==='number') ? 1 : [o.a,o.b,o.c].filter(function(v){ return v!==0; }).length;
    var frontOf = (o.kind==='number') ? 'no x in it at all'
      : (o.a===0 ? 'no x², a flat seam' : (o.a===1 ? 'one x², nothing in front' : num(o.a) + ' in front of the x²'));
    insp.appendChild(H('div','obs',
      '<b>' + (terms===1 ? 'One vein' : terms + ' veins') + '</b> · ' + frontOf +
      ' · layer ' + o.layer + ', ' + MF.LAYERS[o.layer-1].name +
      '<br><em>Which seam runs through it is not something you can see from here — that is the assay’s job.</em>'));
    var brow = E('div','row'); brow.style.marginTop='10px';
    var br = E('button','btn primary big', MF.hasTool('pick') ? 'Swing the deep pick' : 'Swing the pick'); br.type='button';
    on(br,'click',function(){ MF.breakRock(MF.state.inspecting); });
    brow.appendChild(br);
    var skip = E('button','btn','Leave it and look at another'); skip.type='button';
    skip.style.background='#241D18'; skip.style.color='#E4D5BB'; skip.style.borderColor='#6B5B48';
    on(skip,'click',function(){ MF.state.inspecting=null; MF.paintMine(); });
    brow.appendChild(skip);
    insp.appendChild(brow);
  }
  wall.appendChild(insp);
  wall.appendChild(scanRow);          /* seam navigation, below what it acts on */

  /* the cart */
  var cartPanel = E('div','panel');
  cartPanel.appendChild(MF.cartTrack());
  cartPanel.appendChild(H('div','panel-tag','THE CART'));
  if(!MF.state.cart.length){
    cartPanel.appendChild(H('p','hint','Empty. Swing the pick above — and dig as much as you want before you smelt anything.'));
  } else {
    cartPanel.appendChild(H('p','hint','Raw ore you are carrying. Pick one up to put it on the bench.'));
    var body = E('div','cartbody');
    var cart = E('div','cart');
    MF.state.cart.forEach(function(o){
      var b = E('button','lump' + (o.fresh?' fresh':'')); b.type='button';
      b.setAttribute('data-ore', o.id);      /* survives the repaint, so the knock finds it */
      b.appendChild(E('span','glyph'));
      b.appendChild(H('span','txt', MF.oreLabel(o)));
      b.appendChild(H('span','lay','LAYER ' + o.layer));
      if(MF.state.selected && MF.state.selected.id===o.id) b.setAttribute('aria-current','true');
      on(b,'click',function(){
        /* picking up the lump ALREADY on the bench resets the bench to the
           assay, which is a real thing to have done - but off-screen, below the
           cart, so the click looked like nothing. It knocks now. */
        MF.state.selected = o;
        MF.state.anvil = null;
        MF.paintMine();
        MF.knockLump(o.id);
      });
      cart.appendChild(b);
    });
    body.appendChild(cart);
    cartPanel.appendChild(body);
    var wheels = E('div','cartwheels');
    wheels.appendChild(E('i')); wheels.appendChild(E('i'));
    cartPanel.appendChild(wheels);
    cartPanel.appendChild(E('div','cartrail'));
  }
  host.appendChild(cartPanel);

  if(MF.state.selected) MF.paintAnvil(host);
  else if(MF.state.cart.length) host.appendChild(MF.says('<b>Mr Factor:</b> Pick a lump out of the cart and set it on the bench when you are ready. No hurry — the cart does not empty itself.'));
};

/* =========================================================================
   THE KNOCK. Every click on a lump gets an answer at the point of contact,
   whether or not it changed anything: the rock takes a knock, chips come off
   it, a ring goes out from where you hit it, and the pick tips in.

   THREE CLICKS USED TO BE SILENT, and all three looked like broken controls:
   the lump already selected (repaint drew an identical picture), any lump at
   all during the 900ms of a swing (an early `return`), and the cart lump
   already on the bench (the change was below the fold).

   This is deliberately NOT the break animation. Breaking is 720ms of swing,
   nine shards and a shudder through the whole face; the knock is 300ms and
   local. Nothing here decides anything, spends anything or moves the lump -
   the pour is still the only correctness signal in the build.
   ========================================================================= */
MF.knockRock = function(node, o, refused){
  if(!node || !o) return;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var body = node.querySelector('.body');
  var cls  = refused ? 'refuse' : 'knock';
  if(body){
    /* remove, force a reflow, re-add: without the reflow a second click on the
       same rock re-adds a class the element never lost and the browser does not
       restart the animation - which is exactly the dead-click this fixes. */
    body.classList.remove('knock','refuse');
    void body.getBoundingClientRect();
    body.classList.add(cls);
    setTimeout(function(){ body.classList.remove(cls); }, 420);
  }
  var svg = node.ownerSVGElement;
  if(!svg) return;
  var look = MF.LAYER_LOOK[MF.state.layer-1] || MF.LAYER_LOOK[0];
  var bits = [];
  var halo = S('circle',{class:'taphalo',cx:o.px,cy:o.py,r:o.sz+7,fill:'none',
    stroke:look.glint,'stroke-width':'3'});
  svg.appendChild(halo); bits.push(halo);
  if(!refused && !reduced){
    for(var i=0;i<4;i++){
      var ang = -Math.PI/2 + (i-1.5)*0.55;
      var chip = S('circle',{class:'chip',cx:o.px+(i-1.5)*3.5,cy:o.py-o.sz*0.45,
        r:(2.1+(i%2)).toFixed(1), fill: i%2 ? look.ore : look.grit});
      chip.style.setProperty('--dx',(Math.cos(ang)*(18+i*6)).toFixed(1)+'px');
      chip.style.setProperty('--dy',(Math.sin(ang)*(18+i*6)-5).toFixed(1)+'px');
      svg.appendChild(chip); bits.push(chip);
    }
  }
  /* the seam is repainted constantly; anything left behind accumulates */
  setTimeout(function(){
    bits.forEach(function(b){ if(b.parentNode) b.parentNode.removeChild(b); });
  }, 520);
  var arm = MF._pickArm;
  if(arm && !reduced && !refused){
    arm.classList.remove('picktap'); void arm.getBoundingClientRect();
    arm.classList.add('picktap');
    setTimeout(function(){ arm.classList.remove('picktap'); }, 320);
  }
};

/* the same answer for a lump in the cart, which is ore too */
MF.knockLump = function(id){
  var host = MF._mine && MF._mine.mid;
  var el = host && host.querySelector('.lump[data-ore="'+id+'"]');
  if(!el) return;
  el.classList.remove('knock'); void el.getBoundingClientRect();
  el.classList.add('knock');
  setTimeout(function(){ el.classList.remove('knock'); }, 320);
};

/* =========================================================================
   BREAKING A ROCK. The swing has weight: the pick arcs down, the rock takes
   the hit, shards fly, the face shudders, and only then does the lump land in
   the cart. Under prefers-reduced-motion every duration collapses and the
   lump simply arrives - the sequence still completes, it just does not perform.
   ========================================================================= */
MF.breakRock = function(idx){
  var rocks = MF.state.face, o = rocks[idx];
  if(!o || MF.state.breaking) return;
  MF.state.breaking = true;
  var startLayer = MF.state.faceLayer;

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var svg = MF._mine.mid.querySelector('.face svg');
  var arm = MF._pickArm;
  var landMs = reduced ? 10 : 400;
  var doneMs = reduced ? 30 : 900;

  if(arm && !reduced){ arm.classList.remove('pickarm'); void arm.getBoundingClientRect(); arm.classList.add('pickarm'); }

  setTimeout(function(){
    if(svg){
      var look = MF.LAYER_LOOK[MF.state.layer-1];
      var ring = S('circle',{class:'impact',cx:o.px,cy:o.py,r:o.sz,fill:'none',stroke:look.glint,'stroke-width':'4'});
      svg.appendChild(ring);
      for(var i=0;i<9;i++){
        var ang = (i/9)*Math.PI*2, dist = 34 + (i%4)*13;
        var sh = S('polygon',{class:'shard',
          points:(o.px)+','+(o.py-5)+' '+(o.px+7)+','+(o.py+4)+' '+(o.px-6)+','+(o.py+6),
          fill: i%3===0 ? look.ore : look.rock, stroke:look.rock2,'stroke-width':'1'});
        sh.style.setProperty('--dx', (Math.cos(ang)*dist).toFixed(1)+'px');
        sh.style.setProperty('--dy', (Math.sin(ang)*dist - 10).toFixed(1)+'px');
        sh.style.setProperty('--rot', ((i*47)%360)+'deg');
        svg.appendChild(sh);
      }
      var faceBox = MF._mine.mid.querySelector('.face');
      if(faceBox && !reduced){ faceBox.classList.add('shudder');
        setTimeout(function(){ faceBox.classList.remove('shudder'); }, 340); }
    }
  }, landMs);

  setTimeout(function(){
    /* SPLICE BY IDENTITY, NOT BY INDEX, and only if we are still on the layer
       the swing started on. A student who changed layer during the 900ms
       landing got a fresh face of fifteen rocks, and this timer then deleted
       whichever NEW rock happened to sit at the old index - a lump they never
       touched, which never reached the cart, on a face that refills to fifteen
       so nothing on screen said a word. */
    if(MF.state.faceLayer !== startLayer){ MF.state.breaking = false; return; }
    var at = MF.state.face.indexOf(o);
    if(at < 0){ MF.state.breaking = false; MF.paintMine(); return; }
    MF.state.face.splice(at,1);
    MF.state.inspecting = null;
    o.fresh = true;
    MF.state.cart.push(o);
    if(!MF.state.selected) MF.state.selected = o;
    MF.state.breaking = false;
    MF.paintMine();
    setTimeout(function(){ o.fresh = false; }, 500);
  }, doneMs);
};

/* =========================================================================
   THE BREAKING FLOOR.  ASSAY, then BREAK - and break again.

   THERE IS NO CRUCIBLE HERE AND NO MOLD. You do not pour in the mine. You
   name ONE thing that is in the rock, swing, and either the seam runs or the
   pick glances off. What comes off lands on the floor beside it, and anything
   on the floor still carrying a seam goes back under the pick.

   That is the whole of it, and it is why 60 and x² − 5x + 6 are the same
   problem: both come apart one factor at a time until what is left will not
   come apart at all.

   Pouring metal into a mold is DISTRIBUTION, it is the opposite move, and it
   happens in exactly one place in this build - the forge, where it makes
   tools. The mine breaks. The forge smelts.
   ========================================================================= */
MF.anvilInit = function(ore){
  return { ore:ore, step:'assay', assayTried:false,
           floor:[{ore:ore, id:1}],   /* every piece off this lump, in order */
           seq:1,                     /* piece ids, so a repaint can find one */
           at:0,                      /* which piece is under the pick */
           raw:{m:'1', k:'0'},        /* what the student typed, kept verbatim */
           last:null, swings:0 };
};
MF.paintAnvil = function(host){
  var ore = MF.state.selected;
  if(!MF.state.anvil || MF.state.anvil.ore.id !== ore.id) MF.state.anvil = MF.anvilInit(ore);
  var B = MF.state.anvil;

  var bench = E('div','bench');
  bench.appendChild(H('div','panel-tag','THE BREAKING FLOOR'));

  /* NO TOOL RACK HERE ANY MORE. This was an inert list of names, and the real
     belt was in the far right column - so dragging a tool onto a lump meant
     crossing the whole page, and on a narrow screen it meant scrolling, which
     you cannot do mid-drag. The belt now hangs inside the floorbox itself,
     directly above the pieces it acts on. */
  bench.appendChild(H('div','eq', MF.oreLabel(ore)));

  var strip = E('div','stepstrip');
  [['assay','ASSAY','what is this?'],['break','BREAK','take it apart']].forEach(function(s){
    var d = E('div','st' + (B.step===s[0]?' on':'') + (MF.stepDone(B,s[0])?' done':''));
    d.appendChild(H('b',null,s[1]));
    d.appendChild(H('div','s', s[2]));
    strip.appendChild(d);
  });
  bench.appendChild(strip);

  /* the call is always drawn - interactive at the assay step, settled after -
     so the reason a student gave stays with the lump instead of vanishing */
  MF.paintAssay(bench, B);
  if(B.step==='break') MF.paintBreak(bench, B);

  host.appendChild(bench);
};
MF.stepDone = function(B, step){
  var order = {assay:0, 'break':1};
  return order[step] < order[B.step];
};

MF.paintAssay = function(host, B){
  var ore = B.ore;
  var right = MF.assayOf(ore);

  /* THE CALL, ONCE MADE, STAYS ON SCREEN WITH ITS REASON.
     This used to reveal the explanation by setting data-result on the button
     and then schedule paintMine 260ms later - which destroyed the button. So
     a correct answer showed its reasoning for a QUARTER OF A SECOND while a
     wrong answer kept it indefinitely: the build explained itself only to
     students who got it wrong, and the longest copy in it (the two-true-
     readings note) was the least readable. Now a settled call renders as a
     panel that persists for as long as the lump is on the bench. */
  if(B.step !== 'assay'){
    var called = B.calledAs || right;
    var settled = E('div','note good');
    settled.innerHTML = '<b>You called it: ' + MF.ASSAY[called].name + '.</b> ' +
      (B.calledWhy || MF.ASSAY[called].tell);
    host.appendChild(settled);
    return;
  }

  host.appendChild(H('p','hint','<b>Assay it first.</b> What kind of rock are you holding? Nothing else on the bench opens until you have called it — because a call you made is the only thing you can later catch yourself out on.'));

  /* the Drill reads structure - this is its power, and it is the only thing
     on the assay screen that says anything beyond what is visibly there */
  if(MF.hasTool('drill')){
    var tell = E('div','note');
    var bits = [];
    if(ore.kind==='number'){
      bits.push('It is a plain number, so the only question is whether anything divides it.');
      bits.push('Nothing below ' + Math.ceil(Math.sqrt(Math.abs(ore.n))) + ' needs checking past that point.');
    } else {
      var terms = [ore.a,ore.b,ore.c].filter(function(v){ return v!==0; }).length;
      bits.push('<b>' + terms + '</b> term' + (terms===1?'':'s') + ' in it.');
      var gg = gcdAll([ore.a,ore.b,ore.c].filter(function(v){ return v!==0; }));
      bits.push(gg>1 ? 'Every term divides by <b>'+gg+'</b>.' : 'No number above 1 divides every term.');
      if(ore.c===0 && ore.a!==0) bits.push('There is no plain number on the end, so every term still carries an x.');
      bits.push(ore.a===1 ? 'Nothing sits in front of the x².' : (ore.a===0?'There is no x² at all.':'<b>'+num(ore.a)+'</b> sits in front of the x².'));
      if(terms===2 && ore.b===0 && ore.c<0) bits.push('Two terms with a minus between them — check whether both ends are perfect squares.');
    }
    tell.innerHTML = '<b>Assay Lamp:</b> ' + bits.join(' ');
    host.appendChild(tell);
  }

  var accepted = MF.assayAccepts(ore);
  var opts = (ore.kind==='number') ? ['pure','composite'] : ['pure','shared','twin','plain','loaded'];
  var wrap = E('div','choices');
  MF.balanced(ore.id+'|assay', opts).forEach(function(k){
    var why = MF.ASSAY[k].tell;
    /* a second true reading gets its own words, not the generic tell */
    if(accepted.indexOf(k) >= 0 && k !== right){
      why = 'Also true — this really is two squares with a minus between them. ' +
            'Both readings are right; the shared lump usually comes out first, because once it does ' +
            'the twin seam underneath is easier to see.';
    }
    var btn = H('button','choice', MF.ASSAY[k].name + '<span class="why">' + why + '</span>');
    btn.type='button';
    on(btn,'click',function(){
      if(accepted.indexOf(k) >= 0){
        btn.setAttribute('data-result','yes');
        /* remember WHAT they called it and WHY that is true, so the settled
           panel can carry both. Repaint immediately - no timer, so the screen
           and the state can never disagree (they used to, for 260ms, during
           which a passed gate still took clicks). */
        B.calledAs = k;
        B.calledWhy = why;
        B.step = 'break';
        MF.paintMine();
      } else {
        btn.setAttribute('data-result','no');
      }
    });
    wrap.appendChild(btn);
  });
  host.appendChild(wrap);
};

/* deterministic option order - the correct call must not sit in the same slot */
function hash(str){ var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
MF.balanced = function(seed, list){
  var out = list.slice();
  var h = hash(seed);
  for(var i=out.length-1;i>0;i--){
    var j = (h + i*2654435761) % (i+1);
    var t = out[i]; out[i]=out[j]; out[j]=t;
    h = (h*1664525 + 1013904223) >>> 0;
  }
  return out;
};

/* THE FLOOR OF THE WORKING, behind the pieces and the belt.

   REDRAWN FROM NOTHING. The first version put a second anvil, a sledge and a
   lamp along the top of the floorbox - a whole competing scene, badly drawn,
   directly above the properly drawn anvil below it. Two anvils on one screen,
   and the crude one on top.

   This is the ground and the wall of the gallery you are standing in: hewn
   rock, a timber prop, a hanging lamp, dust. No focal objects at all, because
   the focal objects are the pieces of rock lying on it. */
MF.anvilArt = function(){
  var wrap = E('div','anvilart');
  var W=320, VH=70;
  var svg = S('svg',{viewBox:'0 0 '+W+' '+VH,'aria-hidden':'true',preserveAspectRatio:'xMidYMax slice'});
  var defs = S('defs',{});
  var g1 = S('linearGradient',{id:'gallw',x1:'0',y1:'0',x2:'0',y2:'1'});
  g1.appendChild(S('stop',{offset:'0%','stop-color':'#2A2219'}));
  g1.appendChild(S('stop',{offset:'100%','stop-color':'#443728'}));
  defs.appendChild(g1); svg.appendChild(defs);
  svg.appendChild(S('rect',{x:0,y:0,width:W,height:VH,fill:'url(#gallw)'}));

  /* hewn rock: courses of chisel work, no two the same length */
  for(var r=0;r<4;r++){
    var y = 10 + r*15;
    var d = 'M0 '+y;
    for(var seg=0; seg<W; seg+=44) d += ' q22 '+((seg/44+r)%2?3:-3)+' 44 '+((seg/44+r)%3===0?2:-1);
    svg.appendChild(S('path',{d:d,fill:'none',stroke:'#584835','stroke-width':(r%2?1.4:2.2),opacity:'.55'}));
  }
  for(var b=0;b<14;b++)
    svg.appendChild(S('path',{d:'M'+(16+b*23)+' '+(12+((b*11)%40))+' l0 13',
      stroke:'#584835','stroke-width':'1.6',opacity:'.4',fill:'none'}));

  /* a timber prop holding the back up, at the left edge where nothing sits */
  svg.appendChild(S('rect',{x:16,y:6,width:11,height:VH-6,fill:'#5A4432'}));
  svg.appendChild(S('rect',{x:12,y:4,width:19,height:7,rx:2,fill:'#6B5335'}));
  svg.appendChild(S('rect',{x:0,y:4,width:W,height:5,fill:'#4A3B2C',opacity:'.8'}));

  /* the lamp on the cap-piece, and the pool it throws */
  svg.appendChild(S('circle',{class:'gallglow',cx:'58',cy:'22',r:'20',fill:'rgba(232,163,61,.16)'}));
  svg.appendChild(S('path',{d:'M54 9 l8 0 l3 5 l-14 0 Z',fill:'#5A626A'}));
  svg.appendChild(S('rect',{x:'53',y:'13',width:'11',height:'13',rx:'3',fill:'#E8A33D',stroke:'#8A6A2A','stroke-width':'2'}));

  /* dust in the light, and grit on the ground */
  for(var d2=0; d2<16; d2++)
    svg.appendChild(S('circle',{cx:String(24+d2*19), cy:String(20+((d2*17)%42)), r:String(1+(d2%3)*0.7),
      fill:'#C8B89A', opacity:'.2'}));
  svg.appendChild(S('path',{d:'M0 '+(VH-9)+' q80 -5 160 -1 q80 4 160 -2 L'+W+' '+VH+' L0 '+VH+' Z',fill:'#241D18'}));

  wrap.appendChild(svg);
  return wrap;
};

/* WHAT THE HAMMER IS CUT TO, echoed under it. The line whose absence let a
   cleared box swing 6 at a lump the student meant to hit with (x + 6). */
MF.echoHammer = function(B){
  var echo = B && B._echo;
  /* NO isConnected GUARD. paintBreak builds the bar detached and appends it at
     the end, so the first call - the one that fills the line at rest - runs
     while the node has no parent. B._echo is replaced on every paint. */
  if(!echo) return;
  var isNum = B._pieceIsNum;
  /* NOTHING TYPED IS NOT THE SAME AS A SHAPE THAT COMES TO NOTHING. Read the
     raw strings for emptiness: an empty x-part parses to 1, so testing the
     PARSED values reported an untouched bar as "cut to (x)" - a shape nobody
     had chosen, sitting there looking like a suggestion. */
  if(String(B.raw.m).trim()==='' && String(B.raw.k).trim()===''){
    echo.innerHTML = 'the head is empty — type what you are taking out';
    return;
  }
  var m = isNum ? 0 : MF.readPickM(B.raw.m), k = MF.readInt(B.raw.k);
  if(!isFinite(m) || !isFinite(k)){
    echo.innerHTML = '<span class="bad">that is not a whole number</span>';
    return;
  }
  echo.innerHTML = 'the hammer is cut to <b>' +
    (m===0 ? num(k) : '(' + ingotHtml({m:m,k:k}) + ')') + '</b>';
};

/* =========================================================================
   THE ANVIL AND THE HAMMER.

   A London-pattern anvil on a stump with the lump on its face, and an UPRIGHT
   hammer standing over it - handle vertical, head square on the end of it,
   and the flat striking face pointing straight down at the work. The head was
   a wide horizontal plate before, because it had the input boxes in it; the
   boxes are back under the picture where they belong, so the hammer can be
   the shape a hammer is.

   Scenery, and inert: the `overlay` group asserts nothing in here takes a click.
   ========================================================================= */
MF.anvilScene = function(ore){
  var wrap = E('div','anvilsvg');
  var W=340, VH=232;
  var svg = S('svg',{viewBox:'0 0 '+W+' '+VH,'aria-hidden':'true'});
  var defs = S('defs',{});
  function grad(id, stops){
    var g = S('linearGradient',{id:id,x1:'0',y1:'0',x2:'0',y2:'1'});
    stops.forEach(function(s){ g.appendChild(S('stop',{offset:s[0],'stop-color':s[1]})); });
    defs.appendChild(g);
  }
  function gradX(id, stops){
    var g = S('linearGradient',{id:id,x1:'0',y1:'0',x2:'1',y2:'0'});
    stops.forEach(function(s){ g.appendChild(S('stop',{offset:s[0],'stop-color':s[1]})); });
    defs.appendChild(g);
  }
  grad('anvFace',[['0%','#D6DEE5'],['38%','#9DA9B5'],['100%','#6E7A86']]);

/* what the pick is cut to by default, for the shape of lump under it */
/* THE HEAD STARTS EMPTY, with the boxes showing what they would mean if left
   that way. Pre-filling them with 1 and 0 made the resting hammer read "cut to
   (x)" - a shape nobody had chosen, sitting there looking like a suggestion. */
MF.pickDefault = function(ore){ return {m:'', k:''}; };

MF.paintBreak = function(host, B){
  var pieces = B.floor;
  var done = pieces.every(function(p){ return MF.isNative(p.ore); });

  /* THE PICK NEVER RESTS ON FINISHED METAL. Without this the swing bar sat
     over an ingot and every swing came back "nothing left in that one",
     which reads as a broken control rather than as a finished piece. */
  if(!done && (B.at >= pieces.length || MF.isNative(pieces[B.at].ore))){
    for(var i=0;i<pieces.length;i++){ if(!MF.isNative(pieces[i].ore)){ B.at=i; break; } }
  }

  host.appendChild(H('p','hint', pieces.length===1
    ? '<b>Name one thing that is in there, and swing.</b> If the seam runs, the lump comes apart and both pieces land on the floor. Nothing here tells you beforehand whether it will.'
    : '<b>Anything still rock goes back under the pick.</b> Break it again.'));

  /* ---- the floor: every piece this lump has come apart into ---- */
  var fl = E('div','floorbox');
  /* THE BURST LIVES HERE, NOT IN THE HAMMER BAR. The bar disappears the moment
     every piece is native - which is the FINISHING blow, the most satisfying
     one there is - so a burst drawn inside it played on every hit except that
     one. The floor is always on screen while a lump is being worked.
     `B.anim` is consumed here too, in the one place that always runs, so a
     later repaint cannot replay a swing that already happened. */
  if(B.anim){ fl.setAttribute('data-anim', B.anim); }
  var thud = E('div','thud');
  thud.appendChild(E('div','tstar'));
  thud.appendChild(H('div','tword', B.anim==='glance' ? 'CLANG!' : 'THUD!'));
  fl.appendChild(thud);
  fl.appendChild(MF.anvilArt());
  fl.appendChild(H('h4',null, pieces.length===1 ? 'On the anvil' : 'On the floor'));
  /* THE BELT HANGS HERE, inside the floorbox and directly above the pieces.
     It used to live in the yard column on the far side of the page: the drag
     crossed the whole screen, and under 1080px the columns stack so it was a
     scroll away - and you cannot scroll while you are holding something. */
  MF.paintBelt(fl, true);
  var rowf = E('div','pieces');
  pieces.forEach(function(p, idx){
    var nat = MF.isNative(p.ore);
    var cell = E('div','piececell');
    var b = E('button','piece' + (nat?' native':' rock') + (idx===B.at && !nat?' under':'') + (p.fresh?' fresh':''));
    b.type='button';
    b.setAttribute('data-piece', p.id);
    b.appendChild(H('span','pv', MF.oreLabel(p.ore)));
    b.appendChild(H('span','pt', nat ? 'native metal' : 'still rock'));
    b.setAttribute('aria-label', MF.oreText(p.ore) + (nat
      ? ' — native metal. Nothing in it comes apart.'
      : ' — still rock. Put it under the pick.'));
    on(b,'click',function(){
      if(nat) B.last = {ok:false, native:true,
        why:'Nothing left in that one. ' + MF.oreText(p.ore) + ' does not come apart — it is an element.'};
      else { B.at = idx; B.last = null; }
      MF.paintMine();
      MF.knockPiece(p.id);
    });
    cell.appendChild(b);

    /* THE SLOT: where an instrument goes. It shows what was last held to this
       piece, and opening it is the click path for everything the drag does. */
    var t = p.tool && MF.hasTool(p.tool) ? MF.TOOLS[p.tool] : null;
    var slot = E('button','toolslot' + (t?' filled':'')); slot.type='button';
    slot.setAttribute('data-piece', p.id);
    slot.innerHTML = t ? ('<span class="si">'+t.ic+'</span>') : '<span class="si">+</span>';
    slot.setAttribute('aria-label', t
      ? (t.nm + ' is in the slot on ' + MF.oreText(p.ore) + '. Open its reading again.')
      : ('Empty instrument slot on ' + MF.oreText(p.ore) + '. Choose something to hold to it.'));
    slot.title = t ? ('Read it again with the ' + t.nm) : 'Hold an instrument to this';
    on(slot,'click',function(){
      if(t) MF.openTool(p.tool, p.ore, slot);
      else MF.openSlot(p.id, slot);
    });
    cell.appendChild(slot);
    rowf.appendChild(cell);
  });
  fl.appendChild(rowf);
  host.appendChild(fl);
  B.anim = null;                 /* consumed: a repaint must not replay a swing */

  /* ---- what the last swing did. A description of the rock, every time ---- */
  if(B.last){
    if(B.last.ok){
      host.appendChild(H('div','note good','<b>The seam runs.</b> <b>' + MF.oreLabel(B.last.left) +
        '</b> came out of it, and <b>' + MF.oreLabel(B.last.right) + '</b> is what was left behind.'));
      /* the auger traces the division it just watched run */
      if(MF.hasTool('auger')) MF.augerTrace(host, B.last);
      /* the rail, if it is on the belt: where the x² in that lump came from */
      var l=B.last.left, r=B.last.right, flat = function(o){ return o.kind==='number' || o.a===0; };
      if(MF.hasTool('shifter') && flat(l) && flat(r))
        MF.paintShifterRail(host, MF.oreToIngot(l), MF.oreToIngot(r));
    } else {
      host.appendChild(H('div','note','<b>' + B.last.why + '</b>' +
        (B.last.swung ? ' The hammer was cut to <b>' +
            (B.last.swung.m===0 ? num(B.last.swung.k) : '(' + ingotHtml(B.last.swung) + ')') + '</b>.' : '') +
        (B.last.native ? '' : ' Nothing is lost — the rock is exactly as it was, and you can swing again.')));
    }
  }

  /* ---- the swing, or the end of the lump ---- */
  if(done){
    host.appendChild(H('div','note good','<b>Every piece on the floor is native metal.</b> ' +
      'Nothing in any of them comes apart any further. That is the end of the lump — ' +
      'not a failure to get further into it.'));
  } else {
    var t = pieces[B.at];
    /* the boxes are cut for the lump under the pick: an x-shaped pick on a
       number is a swing that can never land */
    if(B.rawFor !== t.id){ B.raw = MF.pickDefault(t.ore); B.rawFor = t.id; }

    /* ---- THE HAMMER BAR: the picture, then the boxes ----
       Back to typing it. The drag-a-tile-into-the-head version made the head a
       wide plate that had to hold two sign toggles, two number boxes and two
       remove buttons - it stopped looking like a hammer and it overflowed the
       column. The boxes sit under the picture now and the hammer is the shape
       a hammer is.

       WHAT SURVIVED FROM THE TILES, because it was the actual fix and not the
       mechanism: an empty x-part box means ONE, not nought (MF.readPickM), and
       the bar echoes what the head is cut to before you swing it. Those are
       what stop a cleared box swinging 6 at a lump you meant to hit with
       (x + 6). */
    var cut = E('div','cutbar');
    cut.appendChild(H('div','cutlab','UNDER THE HAMMER'));

    var stage = E('div','anvilstage');
    if(B.anim) stage.setAttribute('data-anim', B.anim);
    stage.appendChild(MF.anvilScene(t.ore));
    cut.appendChild(stage);

    var isNum = t.ore.kind==='number';
    B._pieceIsNum = isNum;

    var inner = E('div','hrow');
    inner.appendChild(H('span','hlab','cut the head to'));
    var box = E('div','hbox');
    if(!isNum){
      box.appendChild(H('span','paren','('));
      var mi = document.createElement('input'); mi.type='text'; mi.inputMode='numeric';
      mi.value = B.raw.m; mi.placeholder = '1';
      mi.setAttribute('aria-label','how many x — leave it empty for a single x, or put 0 for a plain number');
      on(mi,'input',function(){ B.raw.m = mi.value; MF.echoHammer(B); });
      on(mi,'keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); MF.swing(B); } });
      box.appendChild(mi);
      box.appendChild(H('span','paren','x +'));
    }
    var ki = document.createElement('input'); ki.type='text'; ki.inputMode='numeric';
    ki.value = B.raw.k; ki.placeholder = '0';
    ki.setAttribute('aria-label', isNum ? 'the number you are taking out' : 'the number on the end');
    on(ki,'input',function(){ B.raw.k = ki.value; MF.echoHammer(B); });
    on(ki,'keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); MF.swing(B); } });
    box.appendChild(ki);
    if(!isNum) box.appendChild(H('span','paren',')'));
    inner.appendChild(box);
    cut.appendChild(inner);

    var echo = E('div','hecho');
    cut.appendChild(echo);
    B._echo = echo;
    MF.echoHammer(B);

    cut.appendChild(H('div','hint', isNum
      ? 'A whole number that runs through it.'
      : 'An empty x-part is a single x. Put 0 there to take out a plain number instead.'));

    var swr = E('div','row'); swr.style.marginTop='10px';
    var sw = E('button','btn primary big','Bring the hammer down'); sw.type='button';
    on(sw,'click',function(){ MF.swing(B); });
    swr.appendChild(sw);
    swr.appendChild(H('div','hint','Nothing here says whether it will run. The rock does.'));
    cut.appendChild(swr);
    host.appendChild(cut);
    B._cutbar = cut;
    B._stage = stage;

    /* THE PAIR SCANNER IS NOT FREE ANY MORE. It is the Core Drill's reading,
       held to the piece you choose - the same move §10a already made with the
       casting preview, and for the same reason: a list of every pair sitting
       permanently under the lump did the looking for you. It also made this
       column long enough that the swing button fell below the fold.
       Without the drill you are not stuck: you name something and swing. */
    if(!MF.hasTool('drill'))
      cut.appendChild(H('div','hint','<span style="opacity:.8">No instrument on this one. A core drill would read the pairs out of it — the forge knows how to make one.</span>'));
  }

  /* ---- the ways off the floor. Always at least one. ---- */
  var exits = E('div','row'); exits.style.marginTop='14px';
  if(done){
    var carry = E('button','btn primary','Carry the metal to the yard'); carry.type='button';
    on(carry,'click',function(){ MF.tipFloor(B, 'Native metal on the rack.'); });
    exits.appendChild(carry);
  } else {
    var tip = E('button','btn primary','Tip what you have in the yard'); tip.type='button';
    on(tip,'click',function(){ MF.tipFloor(B, 'Tipped in the yard. The rock is still there when you want it.'); });
    exits.appendChild(tip);
    exits.appendChild(H('div','hint','Metal goes on the rack, rock goes on the heap. The heap can be broken later.'));
  }
  var leave = E('button','btn','Leave it for now'); leave.type='button';
  leave.style.background='#241D18'; leave.style.color='#E4D5BB'; leave.style.borderColor='#6B5B48';
  /* the floor is NOT thrown away - the anvil is keyed to this lump, so picking
     it up again puts every piece back exactly where it was left */
  on(leave,'click',function(){ MF.state.selected = null; MF.paintMine(); });
  exits.appendChild(leave);
  host.appendChild(exits);
};

/* THE SWING. The only thing in the mine that decides anything, and all it
   decides is whether the rock came apart. */
MF.swing = function(B){
  var t = B.floor[B.at];
  if(!t || MF.isNative(t.ore)) return;
  var isNum = t.ore.kind==='number';
  var m = isNum ? 0 : MF.readPickM(B.raw.m);
  var k = MF.readInt(B.raw.k);
  B.swings++;
  if(!isFinite(m) || !isFinite(k)){
    B.last = {ok:false, why:'A hammer is cut to a whole shape. Those boxes only take whole numbers.'};
    B.anim = 'glance';
    MF.paintMine(); return;
  }
  var r = MF.breakOff(t.ore, {m:m, k:k});
  if(!r.ok){
    /* WHAT WAS ACTUALLY SWUNG, on every refusal. A student who meant one shape
       and cut another has to be able to see the difference; being told "6 does
       not run through every term" when you typed x + 6 reads as the mine being
       wrong about arithmetic. */
    B.last = {ok:false, why:r.why, reason:r.reason, swung:{m:m, k:k}};
    B.anim = 'glance';
    MF.paintMine(); return;
  }
  var a = {ore:r.left, id:++B.seq, fresh:true}, b2 = {ore:r.right, id:++B.seq, fresh:true};
  B.floor.splice(B.at, 1, a, b2);
  B.last = {ok:true, why:r.why, left:r.left, right:r.right};
  /* the pick moves itself to the next thing that is still rock */
  var nx = -1;
  for(var i=0;i<B.floor.length;i++){ if(!MF.isNative(B.floor[i].ore)){ nx=i; break; } }
  if(nx >= 0) B.at = nx;
  B.rawFor = null;
  B.anim = 'hit';
  /* THE STATE CHANGES NOW AND THE PICTURE CATCHES UP.
     The splice and the repaint stay synchronous, because MF.playthrough and
     the `break` and `inplace` groups all read the floor the instant swing()
     returns - deferring it to the moment of impact would have made every one
     of them read a floor that had not moved yet. The sequence a student sees
     is built out of animation-delay instead: the hammer falls, the burst lands
     at 260ms, and the new pieces are held back to arrive with it. */
  MF.paintMine();
  setTimeout(function(){ a.fresh=false; b2.fresh=false; }, 900);
};

/* THE AUGER'S TRACE: the division, after it has run. Not a hint - the swing
   has already landed and the answer is on screen. What this adds is WHY it
   landed, term by term, which is the part a loaded lump hides. */
MF.augerTrace = function(host, last){
  var l = last.left, r = last.right;
  if(l.kind==='number' || r.kind==='number') return;   /* nothing to trace on a plain metal */
  var lm = l.a===0 ? l.b : 0, lk = l.a===0 ? l.c : 0;
  var rm = r.a===0 ? r.b : 0, rk = r.a===0 ? r.c : 0;
  if(!lm || !rm) return;
  var box = E('div','panel'); box.style.background='#fff'; box.style.margin='10px 0 0';
  box.appendChild(H('div','panel-tag','&#128295; THE AUGER &mdash; HOW IT RAN'));
  var t = E('table','scan');
  var hr = E('tr'); ['this part of the rock','came from','which is'].forEach(function(h){ hr.appendChild(E('th',null,h)); });
  t.appendChild(hr);
  [['the x²', xt2(lm)+' × '+xt2(rm), (lm*rm===1?'x²':num(lm*rm)+'x²')],
   ['the end', num(lk)+' × '+num(rk), num(lk*rk)],
   ['the middle', xt2(lm)+' × '+num(rk)+'  and  '+num(lk)+' × '+xt2(rm),
    xt2(lm*rk)+' and '+xt2(lk*rm)+', which run together as '+xt2(lm*rk+lk*rm)]
  ].forEach(function(row){
    var tr = E('tr');
    tr.appendChild(H('td',null,'<b>'+row[0]+'</b>'));
    tr.appendChild(E('td',null,row[1]));
    tr.appendChild(H('td',null,'<b>'+row[2]+'</b>'));
    t.appendChild(tr);
  });
  box.appendChild(t);
  box.appendChild(H('div','hint','The ends were forced. The middle is the part that had to be checked, and it checked out.'));
  host.appendChild(box);
};

/* MF.glanceOff is gone. It shuddered the whole input bar to say a swing had
   not landed, which was the best a row of text boxes could do. The hammer
   bounces off the anvil and the burst reads CLANG! now - the refusal is
   performed where the swing happened, so a class on a panel is not needed. */

/* every click on a piece is answered, the same rule as the lumps in the seam */
MF.knockPiece = function(id){
  var host = MF._mine && MF._mine.mid;
  var el = host && host.querySelector('.piece[data-piece="'+id+'"]');
  if(!el) return;
  el.classList.remove('knock'); void el.getBoundingClientRect();
  el.classList.add('knock');
  setTimeout(function(){ el.classList.remove('knock'); }, 320);
};

/* THE FLOOR GOES IN THE YARD: metal on the rack, rock on the heap. Rock is
   never destroyed and never counted - it is ore you have not finished with,
   and the heap is where you left it. */
MF.tipFloor = function(B, why){
  B.floor.forEach(function(p){
    if(MF.isNative(p.ore)) MF.addToYard(MF.oreToIngot(p.ore));
    else MF.state.rockpile.push(p.ore);
  });
  MF.finishLump(B, why);
};
/* THE X-PART BOX IS NOT THE NUMBER BOX, AND EMPTY DOES NOT MEAN ZERO IN IT.

   An empty CONSTANT box means "no constant", which is nought. An empty X-PART
   box means the student wrote no coefficient in front of the x — and that is
   ONE, exactly as x means 1x everywhere else in mathematics.

   Read as nought, clearing that box turned a swing at (x + 6) into a swing at
   6, refused it, and reported "6 does not run through every term" about a
   bracket the student had typed and the mine had never seen. It was reported
   as a maths error, and from where the student sat it was one: they swung a
   true factor of 3x² + 22x + 24 and were told it was not one.

   'x' and '-x' are read too, because a student who types what they mean has
   not made a mistake. */
MF.readPickM = function(raw){
  var s = String(raw==null?'':raw).trim().replace(/[−–—]/g,'-').replace(/[xX]/g,'');
  if(s==='' || s==='+') return 1;
  if(s==='-') return -1;
  return MF.readInt(s);
};
MF.readInt = function(raw){
  var s = String(raw||'').trim().replace(/[−–—]/g,'-');
  if(s===''||s==='-') return 0;
  if(!/^-?\d+$/.test(s)) return NaN;
  return parseInt(s,10);
};
function xt2(k){ if(k===0) return '0'; if(k===1) return 'x'; if(k===-1) return '−x'; return num(k)+'x'; }

/* THE SHIFTER'S POWER: the four products, named and traced, so x·x becoming x²
   is watched rather than asserted.
   TAKES TWO INGOTS DIRECTLY. It used to read B.slots and repaint into a host
   it had cached - both of which belonged to a crucible that no longer exists.
   On the breaking floor the two things it traces are the two pieces a swing
   just made, so it is handed them. */
MF.paintShifterRail = function(host, s1, s2){
  if(!host || !s1 || !s2) return;
  if(!isFinite(s1.m)||!isFinite(s1.k)||!isFinite(s2.m)||!isFinite(s2.k)) return;

  var rail = E('div','panel'); rail.style.background='#fff'; rail.style.margin='12px 0 0';
  rail.appendChild(H('div','panel-tag','&#8646; THE EXPONENT RAIL'));
  var parts = [
    ['x-part × x-part', xt2(s1.m)+' × '+xt2(s2.m), (s1.m*s2.m===0?'0':(s1.m*s2.m===1?'x²':num(s1.m*s2.m)+'x²')),
     'x · x = x², and this is the only place an x² can come from'],
    ['x-part × number',  xt2(s1.m)+' × '+num(s2.k), xt2(s1.m*s2.k), 'one x survives, so it lands in the middle'],
    ['number × x-part',  num(s1.k)+' × '+xt2(s2.m), xt2(s1.k*s2.m), 'one x survives, so it lands in the middle'],
    ['number × number',  num(s1.k)+' × '+num(s2.k), num(s1.k*s2.k), 'no x left at all, so it lands on the end']
  ];
  var tbl = E('table','scan');
  var hr = E('tr'); ['which two','multiplied','gives','why it lands where it does'].forEach(function(h){ hr.appendChild(E('th',null,h)); });
  tbl.appendChild(hr);
  parts.forEach(function(p,i){
    var tr = E('tr');
    if(i===1||i===2) tr.style.background = 'var(--tile-x)';
    p.forEach(function(cell,ci){ tr.appendChild(H('td',null, ci===2 ? '<b>'+cell+'</b>' : cell)); });
    tbl.appendChild(tr);
  });
  rail.appendChild(tbl);
  var mid = s1.m*s2.k + s1.k*s2.m;
  /* "−x + −8x" reads as nonsense; the two terms are named, not added in prose */
  rail.appendChild(H('div','hint','The two shaded rows are the same kind of thing, so they run together: ' +
    '<b>' + xt2(s1.m*s2.k) + '</b> and <b>' + xt2(s1.k*s2.m) + '</b> make <b>' + xt2(mid) + '</b>.'));
  host.appendChild(rail);
};

/* the decimal dial - gear. This is where integers stop being an assumption. */
MF.paintDial = function(host, B){
  var ore = B.ore;
  var d = E('div','panel'); d.style.background='#fff';
  d.appendChild(H('div','panel-tag','DECIMAL DIAL'));
  d.appendChild(H('p','hint','Nudge the last number off the whole numbers and watch what happens to the seam. The rock never changes — the <em>search</em> does.'));
  var off = 0;
  var readout = E('div'); d.appendChild(readout);
  var r = document.createElement('input');
  r.type='range'; r.min=-2; r.max=2; r.step=0.5; r.value=0;
  r.setAttribute('aria-label','Nudge the last term');
  on(r,'input',function(){ off = parseFloat(r.value); paint(); });
  d.appendChild(r);
  host.appendChild(d);
  function paint(){
    clear(readout);
    var c2 = ore.c + off;
    var res = MF.smeltPoly(ore.a, ore.b, c2);
    var clean = (res.kind!=='pure');
    readout.appendChild(H('div','eq sm', quad(ore.a, ore.b, c2)));
    var m = E('div','note ' + (clean?'good':'warn'));
    /* The dial says WHETHER a whole-number seam exists. It must never say what
       it is: printing the factorisation here put the finished answer directly
       above the pour button, which is supposed to be the only judge. */
    m.innerHTML = clean
      ? '<b>A whole-number seam runs through this one.</b> Whole ingots will land on it — though the dial is not going to tell you which.'
      : '<b>No whole-number seam.</b> ' + (res.realRoots
          ? (res.realRoots.length > 1
              ? 'The seam is real — near ' + num(Math.round(res.realRoots[0]*100)/100) + ' and ' + num(Math.round(res.realRoots[1]*100)/100) +
                ' — but those are not whole numbers, and whole ingots will never land on them.'
              : 'The seam is real — it runs at ' + num(Math.round(res.realRoots[0]*1000)/1000) +
                ' — but that is not a whole number, and whole ingots will never land on it.')
          : 'And none on decimals either.');
    readout.appendChild(m);
  }
  paint();
};

MF.scanTable = function(host, target, wanted){
  var rows = [];
  factorPairs(target).forEach(function(pr){
    var f=pr[0], s=pr[1];
    if(target>=0){ rows.push([f,s]); rows.push([-f,-s]); } else { rows.push([-f,s]); rows.push([f,-s]); }
  });
  rows = rows.filter(function(r){ return r[0]*r[1]===target; });
  var tbl = E('table','scan');
  var hr = E('tr'); ['pair','multiply to','add to'].forEach(function(h){ hr.appendChild(E('th',null,h)); });
  tbl.appendChild(hr);
  rows.forEach(function(r){
    var tr = E('tr');
    tr.appendChild(E('td',null, num(r[0]) + '  and  ' + num(r[1])));
    tr.appendChild(E('td',null, num(r[0]*r[1])));
    tr.appendChild(E('td',null, num(r[0]+r[1])));
    if(wanted!=null && r[0]+r[1]===wanted) tr.className='hit';
    tbl.appendChild(tr);
  });
  host.appendChild(tbl);
  return rows.length;
};


MF.finishLump = function(B, why){
  var id = B.ore.id;
  MF.state.cart = MF.state.cart.filter(function(o){ return o.id!==id; });
  MF.state.selected = null; MF.state.anvil = null;
  MF.state.broken++;
  MF.paintMine();
  MF.flash(why || 'Done.');
};
/* Flashes are QUEUED, not written straight into the column. Two of the three
   gear announcements never reached a student: grantGear flashed, and the very
   next line repainted the mine and wiped the message it had just inserted. */
MF.flashQueue = [];
/* Enqueue only - do NOT drain here. Every caller of flash() is followed by a
   repaint that clears the column, so draining immediately wrote the message
   into a panel that was about to be destroyed: two of the three gear
   announcements never reached the screen. paintMine drains at the END of a
   paint, and the timeout catches any flash with no repaint behind it. */
MF.flash = function(msg){
  MF.flashQueue.push(msg);
  setTimeout(MF.drainFlashes, 0);
};
MF.drainFlashes = function(){
  var host = MF._mine && MF._mine.mid;
  /* isConnected: MF._mine survives navigation away from the mine, so a flash
     raised off-mine drained into a detached node and emptied the queue with
     nothing reaching the page. Nothing triggers it today - flash has one call
     site, on the mine - but it is the same class as the gear announcements. */
  if(!host || !host.isConnected || !MF.flashQueue.length) return;
  MF.flashQueue.splice(0).forEach(function(msg){
    var n = H('div','note good', msg);
    host.insertBefore(n, host.firstChild);
    setTimeout(function(){ if(n.parentNode) n.parentNode.removeChild(n); }, 5200);
  });
};
/* =========================================================================
   HOLDING AN INSTRUMENT TO A PIECE OF ROCK.

   Drag a tool off the belt onto a lump, or open the lump's slot and pick one.
   The slot lights up with whatever is in it, and a panel rises with the
   reading. Both routes reach the same place: a drag with no click path is a
   control half the users cannot reach.

   THE PANEL IS A REAL DIALOG. It traps Tab, closes on Escape, and hands focus
   back to the slot it came from. A panel that steals focus and does not give
   it back leaves a keyboard user stranded on a page they cannot see.

   AND IT MUST LEAVE NOTHING BEHIND. A scrim left in the DOM covers the entire
   page and makes every control dead - the exact fault class that had the pick
   eating every click on the seam. The `sheet` group asserts it is gone.
   ========================================================================= */
MF._sheet = null;

/* ONE PLACE BUILDS THE PANEL. Three surfaces open one - a tool held to a
   lump, a tool explained off the belt, and an empty slot asking which - and
   three copies of the scrim, the focus move, the Tab trap and the Escape
   wiring is three chances for one of them to drift and quietly lose the trap.
   Callers supply the head and fill the body; everything that makes it a
   dialog lives here. */
MF._openSheet = function(o){
  MF.closeTool();                              /* never two at once */
  var scrim = E('div','scrim');
  var sheet = E('div','toolsheet');
  sheet.setAttribute('role','dialog');
  sheet.setAttribute('aria-modal','true');
  sheet.setAttribute('aria-label', o.label);
  sheet.tabIndex = -1;

  var head = E('div','tshead');
  head.appendChild(H('span','ic', o.icon));
  var ht = E('div');
  ht.appendChild(H('div','tsname', o.title));
  ht.appendChild(H('div','tsore', o.sub));
  head.appendChild(ht);
  var x = E('button','tsclose', o.closeText || 'Close'); x.type='button';
  x.setAttribute('aria-label', (o.closeText || 'Close') + ' — closes this panel');
  on(x,'click',function(){ MF.closeTool(); });
  head.appendChild(x);
  sheet.appendChild(head);

  var body = E('div','tsbody');
  try { o.fill(body); }
  catch(e){ body.appendChild(H('div','note warn','This instrument could not get a reading off that.')); }
