}

MF.surfaceScene = function(){
  var wrap = E('div','scene');
  var W=900, VH=420;
  var svg = S('svg',{viewBox:'0 0 '+W+' '+VH, role:'img',
    'aria-label':'A mining operation on the surface: a winding house with a turning wheel, the smelting house, the casting shed, the forge with its furnace lit, an ore cart on rails, and the mine entrance.'});

  function P(d,f,extra){ var n=S('path',{d:d,fill:f}); if(extra) for(var k in extra) n.setAttribute(k,extra[k]); svg.appendChild(n); return n; }
  function R(x,y,w,h,f,extra){ var n=S('rect',{x:x,y:y,width:w,height:h,fill:f}); if(extra) for(var k in extra) n.setAttribute(k,extra[k]); svg.appendChild(n); return n; }

  /* sky */
  var defs = S('defs',{});
  var sky = S('linearGradient',{id:'sky',x1:'0',y1:'0',x2:'0',y2:'1'});
  [['0%','#9FC6E0'],['58%','#CFE0EA'],['100%','#E8DCC4']].forEach(function(st){
    sky.appendChild(S('stop',{offset:st[0],'stop-color':st[1]}));
  });
  defs.appendChild(sky);
  var grd = S('linearGradient',{id:'grd',x1:'0',y1:'0',x2:'0',y2:'1'});
  [['0%','#9C7F55'],['100%','#6B5539']].forEach(function(st){ grd.appendChild(S('stop',{offset:st[0],'stop-color':st[1]})); });
  defs.appendChild(grd);
  /* ---- A DAY, FOUR MINUTES LONG ----
     Morning, noon, dusk, midnight, and round again. The sky is four tinted
     sheets stacked over the base gradient, each fading in on its own phase -
     you cannot animate the stops of a gradient, but you can cross-fade whole
     skies, and that is what this does.

     The sun and the moon ride ONE circle whose centre sits on the horizon at
     (450,310), so each is above ground for exactly half the turn: they rise in
     the east, cross, and set in the west behind the hills, which are drawn
     after them. The moon is half a turn behind the sun, so it is at the top of
     the sky at midnight and under the ground at noon.

     Positioning is baked into the coordinates and the rotation is on the
     class, so neither carries a transform attribute - MF.ANIM_TRANSFORM_CLASSES
     and the animmount group. */
  [['skyDawn',[['0%','#4E5C8A'],['38%','#C97F6A'],['72%','#F0B489'],['100%','#F6D9A8']]],
   ['skyNoon',[['0%','#6FA9D6'],['54%','#AFD2E8'],['100%','#E3E9DC']]],
   ['skyDusk',[['0%','#2E3A6B'],['40%','#A85A62'],['74%','#E08A4E'],['100%','#F2C078']]],
   ['skyNight',[['0%','#080D22'],['58%','#141F3E'],['100%','#26314E']]]
  ].forEach(function(sk){
    var g3 = S('linearGradient',{id:sk[0],x1:'0',y1:'0',x2:'0',y2:'1'});
    sk[1].forEach(function(st){ g3.appendChild(S('stop',{offset:st[0],'stop-color':st[1]})); });
    defs.appendChild(g3);
  });
  svg.appendChild(defs);
  R(0,0,W,VH,'url(#sky)');
  ['skyDawn','skyNoon','skyDusk','skyNight'].forEach(function(id){
    svg.appendChild(S('rect',{class:'sc-sky sc-'+id, x:0,y:0,width:W,height:VH,fill:'url(#'+id+')'}));
  });

  /* stars, out only at night */
  var stars = S('g',{class:'sc-stars'});
  for(var st2=0; st2<46; st2++){
    var sx = (st2*173)%W, sy = 12 + ((st2*67)%210);
    stars.appendChild(S('circle',{cx:sx, cy:sy, r:String(0.8+((st2*7)%3)*0.5),
      fill:'#FFF8E4', opacity:String(0.45+((st2*11)%5)*0.11)}));
  }
  svg.appendChild(stars);

  /* the sun and the moon, on the same circle, half a turn apart */
  var sun = S('g',{class:'sc-sun'});
  sun.appendChild(S('circle',{cx:450,cy:46,r:44,fill:'#FFE9A8',opacity:'.22'}));
  sun.appendChild(S('circle',{cx:450,cy:46,r:29,fill:'#FFD873'}));
  sun.appendChild(S('circle',{cx:450,cy:46,r:23,fill:'#FFF3C4'}));
  svg.appendChild(sun);
  var moon = S('g',{class:'sc-moon'});
  moon.appendChild(S('circle',{cx:450,cy:46,r:34,fill:'#CFE0EA',opacity:'.16'}));
  moon.appendChild(S('circle',{cx:450,cy:46,r:22,fill:'#E8EEF4'}));
  moon.appendChild(S('circle',{cx:458,cy:40,r:5,fill:'#C6D2DC',opacity:'.8'}));
  moon.appendChild(S('circle',{cx:444,cy:53,r:3.4,fill:'#C6D2DC',opacity:'.7'}));
  moon.appendChild(S('circle',{cx:452,cy:57,r:2.4,fill:'#C6D2DC',opacity:'.6'}));
  svg.appendChild(moon);

  /* clouds */
  [[0,58,1],[0,112,.75],[0,40,.6]].forEach(function(c,i){
    var g = S('g',{class:'sc-cloud',opacity:String(.55+i*.12)});
    g.style.animationDuration = (52 + i*18) + 's';
    g.style.animationDelay = (-i*17) + 's';
    var cl = S('g',{transform:'translate(-120,'+c[1]+') scale('+c[2]+')'});
    [[0,0,26],[30,-10,20],[58,2,17],[26,10,20]].forEach(function(b){
      cl.appendChild(S('ellipse',{cx:b[0],cy:b[1],rx:b[2],ry:b[2]*0.66,fill:'#FFFFFF'}));
    });
    g.appendChild(cl); svg.appendChild(g);
  });

  /* ---- THE MOUNTAIN RANGE THE MINE IS CUT INTO ----

     The mine used to be a single dome of rock standing in the middle of a
     green field, with soft hills a long way behind it. Nobody digs a mine into
     a boulder: a portal is the foot of something much bigger than itself, and
     without that the whole right-hand end of the site read as a stone dropped
     on a lawn.

     IT IS KEPT TO THE RIGHT, AND MOSTLY ABOVE THE HILL LINE. The range runs
     from x=500 east and its bases are drawn down to y=300 and y=330 - which
     the two soft hills, painted immediately after this, cover completely. What
     is left on screen is peaks standing above the ridgeline over the mine end
     of the valley. The plains, the fence, the cart track and the four pines to
     the west are untouched; the two eastern pines now stand SILHOUETTED
     against rock instead of against empty sky, which is more of a tree than
     they were before, not less.

     AERIAL PERSPECTIVE DOES THE DEPTH: the far range is hazy and blue because
     there is more air in front of it, the near one greyer and darker. That is
     what puts one behind the other without either being drawn smaller. */
  /* THE PEAKS HAVE TO CLEAR THE GREEN. The soft hill behind this end of the
     valley tops out around y=185..222, so a range peaking at 154 showed a few
     pixels of itself and the rest was buried - and at 50% over a pale sky it
     was so hazy that a colour test written to find sky classified the MOUNTAIN
     as sky. Aerial perspective is a tint, not an erasure. */
  P(ridgePath([[500,300],[542,210],[580,242],[624,178],[664,214],[706,146],
               [748,190],[796,124],[840,172],[880,144],[916,196],[960,300]], 300),
    '#8795A8', {opacity:'.72', class:'sc-range'});
  /* snow on the two that earn it, cut to the same slopes as the peaks */
  P('M796 124 L779 152 L789 147 L796 155 L806 143 L813 152 Z','#EEF3F8',{opacity:'.85', class:'sc-range'});
  P('M880 144 L867 166 L874 162 L882 169 L888 159 L893 166 Z','#EEF3F8',{opacity:'.7', class:'sc-range'});
  P(ridgePath([[620,330],[664,228],[700,262],[744,208],[788,240],[832,196],
               [876,234],[920,210],[980,330]], 330),
    '#6E7788', {opacity:'.78', class:'sc-range'});

  /* far hills */
  P('M0 250 q120 -66 240 -20 q120 46 250 -14 q140 -64 410 6 V420 H0 Z','#A8B79B',{opacity:'.75'});
  P('M0 276 q160 -50 300 -6 q130 40 260 -20 q120 -54 340 14 V420 H0 Z','#8E9E82',{opacity:'.85'});
  /* ground */
  P('M0 300 q150 -34 320 -8 q170 26 300 -12 q140 -40 280 8 V420 H0 Z','url(#grd)');
  R(0,352,W,68,'#5E4A32');
  for(var i=0;i<40;i++){
    svg.appendChild(S('circle',{cx:(i*23+11)%W, cy:362+((i*13)%42), r:1.6+((i*7)%3), fill:'#7A6244', opacity:'.6'}));
  }

  /* pines on the ridges, drawn BEFORE anything is built on the site */
  [[42,246,1],[86,252,.8],[208,244,.75],[538,240,.8],[700,236,.85],[878,244,1]].forEach(function(t){
    var g2 = S('g',{transform:'translate('+t[0]+','+t[1]+') scale('+t[2]+')'});
    g2.appendChild(S('rect',{x:'-3',y:'-6',width:'6',height:'22',fill:'#5A4632'}));
    g2.appendChild(S('path',{d:'M0 -34 L15 -2 L-15 -2 Z',fill:'#4E6B4A'}));
    g2.appendChild(S('path',{d:'M0 -48 L12 -18 L-12 -18 Z',fill:'#5A7A54'}));
    g2.appendChild(S('path',{d:'M0 -58 L9 -34 L-9 -34 Z',fill:'#6B8A62'}));
    svg.appendChild(g2);
  });

  /* ---- the windmill. It drives the winding gear the Shifter is made for. ---- */
  var wm = S('g',{transform:'translate(112,132)'});
  /* stone tower, tapered, with banding and a door */
  wm.appendChild(S('path',{d:'M14 208 L34 56 L74 56 L94 208 Z',fill:'#8A7A66'}));
  wm.appendChild(S('path',{d:'M14 208 L34 56 L50 56 L38 208 Z',fill:'#9C8C77',opacity:'.7'}));
  [96,140,180].forEach(function(y){
    wm.appendChild(S('rect',{x:String(15+ (y-96)*0.06),y:String(y),width:String(78 - (y-96)*0.12),height:'6',fill:'#6E6053',opacity:'.75'}));
  });
  wm.appendChild(S('path',{d:'M44 208 l0 -34 q10 -10 20 0 l0 34 Z',fill:'#4A3524'}));
  /* THE BOTTOM WINDOWS MUST NOT TOUCH THE DOOR. They were at y=160 and 14 tall,
     so they ended exactly on y=174 - which is where the door's arch begins -
     and they sat over the door's own x range (44..64) as well. Two openings
     sharing an edge read as one hole in the wall.
     They are at y=148 now (ending at 162, seven clear of the arch's peak) and
     spread to x=30 and x=66, which is symmetric about the tower's centre line
     at this height and clear of the doorway on both sides. */
  [ [40,92],[64,92],[30,148],[66,148] ].forEach(function(w){
    wm.appendChild(S('rect',{x:String(w[0]),y:String(w[1]),width:'12',height:'14',rx:'2',fill:'#3A3129'}));
    /* FULL STRENGTH GLASS, and the day cycle does the dimming. Pinned at .55
       the window could never get brighter than half lit, so the ramp had only
       the top half of its range to work in and midnight looked like dusk. */
    wm.appendChild(S('rect',{x:String(w[0]+2),y:String(w[1]+2),width:'8',height:'10',rx:'1',fill:'#FFE9A8',class:'sc-lit'}));
  });
  /* cap and hub */
  wm.appendChild(S('path',{d:'M26 58 q28 -34 56 0 Z',fill:'#6B4A32'}));
  wm.appendChild(S('rect',{x:'48',y:'34',width:'14',height:'12',rx:'3',fill:'#4A3524'}));

  /* the sails. Positioning on the mount, rotation on the inner group, and the
     rotation is about the SAILS' own centre - see transform-box above. */
  var sailMount = S('g',{transform:'translate(55,40)'});
  var sails = S('g',{class:'sc-sails'});
  for(var b=0;b<4;b++){
    var ang = b*90;
    var blade = S('g',{transform:'rotate('+ang+')'});
    blade.appendChild(S('rect',{x:'-4',y:'-62',width:'8',height:'56',rx:'2',fill:'#6B5335'}));

  /* ---- THE SMELTING HOUSE -> the ore workshop.

  var sm = S('g',{transform:'translate(232,214)'});

  /* the stack runs from its cap all the way DOWN INTO THE BODY at y=48, so it

  sm.appendChild(S('rect',{x:'92',y:'-24',width:'24',height:'72',fill:'#6B4A32'}));
  sm.appendChild(S('rect',{x:'88',y:'-30',width:'32',height:'9',rx:'2',fill:'#4A3F34'}));
  /* NEGATIVE delays, and opacity 0 at rest. With a positive delay each puff

     delay starts them already mid-rise, and the zero opacity means that if an

  [0,1,2].forEach(function(k){
    var puff = S('circle',{cx:'104',cy:'-34',r:String(7+k*2),fill:'#D8CFC0',

  });
  nameplate(sm, 66, 54, 'The Stamp Mill');
  /* THE STAMP MILL'S WINDOWS - both of them. The second was a dead brown rect
     that stayed dark through midnight while the one beside it burned, which
     reads as a broken window rather than as an unlit room. The tall opening on
     the end is the DOOR and is left dark deliberately. */
  sm.appendChild(S('rect',{x:'12',y:'90',width:'36',height:'36',rx:'3',fill:'#2A1E14'}));
  sm.appendChild(lit(S('rect',{x:'14',y:'92',width:'32',height:'32',rx:'3',fill:'#E2600F',opacity:'.9',class:'sc-lamp'})));
  sm.appendChild(S('rect',{x:'54',y:'94',width:'28',height:'28',rx:'3',fill:'#2A1E14'}));
  sm.appendChild(lit(S('rect',{x:'56',y:'96',width:'24',height:'24',rx:'3',fill:'#FFC46A',class:'sc-lamp'})));
  sm.appendChild(S('rect',{x:'92',y:'98',width:'26',height:'38',rx:'2',fill:'#4A3524'}));   /* the door */
  svg.appendChild(sm);

  /* ---- THE CASTING SHED -> the mold workshop. Ingots stacked outside. ---- */
  var cs = S('g',{transform:'translate(400,236)'});
  cs.appendChild(S('rect',{x:'0',y:'34',width:'118',height:'82',rx:'4',fill:'#6E7B87'}));
  /* slate, to match the shed's grey walls, and a lead gutter down the far end */
  tiledRoof(cs, {lx:-8, rx:126, ey:34, ax:59, ay:4,
    tile:'#4A5560', tileLit:'#5E6C79', tileDark:'#2E3840', ridge:'#3E4750',
    fascia:'#3E4750', gutter:'#7E8892', gutterDark:'#414A52',
    downX:113, downTo:112});
  nameplate(cs, 59, 44, 'Casting Shed');
  /* BOTH THE SHED'S WINDOWS BURN. The second was slate-coloured and never lit;
     the tall one on the end is the door and stays dark. */
  cs.appendChild(S('rect',{x:'10',y:'78',width:'28',height:'28',rx:'2',fill:'#1E262C'}));
  cs.appendChild(lit(S('rect',{x:'12',y:'80',width:'24',height:'24',rx:'2',fill:'#FFE9A8',class:'sc-lamp'})));
  cs.appendChild(S('rect',{x:'44',y:'78',width:'28',height:'28',rx:'2',fill:'#1E262C'}));
  cs.appendChild(lit(S('rect',{x:'46',y:'80',width:'24',height:'24',rx:'3',fill:'#FFD68A',class:'sc-lamp'})));
  cs.appendChild(S('rect',{x:'84',y:'78',width:'26',height:'38',rx:'2',fill:'#3E4750'}));   /* the door */

  [0,1].forEach(function(side){

      fg.appendChild(S('rect',{x:String(side? 104 : 0),y:String(44+q*13),width:'14',height:'11',rx:'1',

  /* THE PANTILES ARE REAL COURSES NOW. They were seven rake lines drawn from
     the eaves to the ridge - a hint at a roof rather than a roof, and the only

  tiledRoof(fg, {lx:-8, rx:126, ey:38, ax:59, ay:6,
    tile:'#6B3F32', tileLit:'#8A5240', tileDark:'#472619', ridge:'#5A3428',

    downX:2, downTo:114});
  nameplate(fg, 59, 47, 'The Forge');

  /* TWO CHIMNEYS: the tall one off the hearth, and a squatter one off the

  [{x:6, y:-30, w:26, h:72, capW:34, capX:2, smoke:0},
   {x:82, y:-6, w:22, h:48, capW:30, capX:78, smoke:1}].forEach(function(ch){
    fg.appendChild(S('rect',{x:String(ch.x),y:String(ch.y),width:String(ch.w),height:String(ch.h),rx:'2',fill:'#6E6055'}));

      fg.appendChild(S('rect',{x:String(ch.x+1),y:String(ch.y+7+b2*11),width:String(ch.w-2),height:'1.4',
        fill:'#4A4038',opacity:'.5'}));
      fg.appendChild(S('rect',{x:String(ch.x + (b2%2 ? ch.w*0.32 : ch.w*0.62)),y:String(ch.y+8+b2*11),

    [0,1].forEach(function(k){

      fg.appendChild(puff);

  /* THE FURNACE MOUTH, BUILT LIKE A LANTERN. It used to be an orange arch the
     same colour as the wall it was cut into, with a flat ellipse on the ground
     - the brightest thing on the site drawn as the dimmest. It has a dark
     mouth behind it now so the fire has something to be brighter THAN, a
     flickering body, and a white-hot core; the halo it throws lives in the
     light layer above the night, with the lanterns. */
  fg.appendChild(S('path',{d:'M32 112 q0 -33 26 -33 q26 0 26 33 Z',fill:'#1B1008'}));
  fg.appendChild(lit(S('path',{d:'M34 112 q0 -30 24 -30 q24 0 24 30 Z',fill:'#E2600F',class:'sc-lamp'})));
  fg.appendChild(lit(S('path',{d:'M40 112 q0 -21 18 -21 q18 0 18 21 Z',fill:'#FFB347',class:'sc-lamp'})));

/* =========================================================================
   ONE DAY, NOT ONE PER VISIT.

   MF.go rebuilds a screen from nothing every time you arrive, so every trip
   back to the surface handed the sky a brand new set of CSS animations - and a
   CSS animation starts at zero. The day restarted at dawn each time: mine,
   forge, surface, and the sun was back on the eastern hills whatever the
   clock said.

   The day belongs to the SESSION, not to the scene. One start time is taken
   when the file loads, and every part of the sky is given a NEGATIVE
   animation-delay equal to however far through the four minutes we are - which
   drops it into the cycle already running. No timers, nothing to keep in sync,
   and it is correct even for a scene built and never mounted.
   ========================================================================= */
MF.DAY_MS = 240000;
MF._dayT0 = Date.now();
MF.dayOffset = function(){ return (Date.now() - MF._dayT0) % MF.DAY_MS; };
MF.DAY_PARTS = '.sc-sky,.sc-sun,.sc-moon,.sc-stars,.sc-night,.sc-lit,.sc-glow';
MF.syncDay = function(root){
  if(!root) return 0;
  var off = MF.dayOffset();
  Array.prototype.forEach.call(root.querySelectorAll(MF.DAY_PARTS), function(el){
    el.style.animationDelay = (-off) + 'ms';
  });
  return off;
};

  function P(d,f,extra){ var n=S('path',{d:d,fill:f}); if(extra) for(var k in extra) n.setAttribute(k,extra[k]);

  if(kind==='stamps'){

  if(kind==='forge'){

      fill:'#7A5335',stroke:'#3A2A1C','stroke-width':'2.5'}));
    [16,28,40].forEach(function(px){
      bel.appendChild(S('line',{x1:String(px),y1:'6',x2:String(px),y2:'26',stroke:'#3A2A1C','stroke-width':'1.6',opacity:'.55'}));

    /* anvil on its stump. Outlined and given its horn and waist - at banner

    R(388,142,58,22,'#4A3B2C',{stroke:'#2E2418','stroke-width':'2'});
    P('M354 116 q26 -11 52 -9 q20 1 26 9 l-7 9 h-64 Z','#7C858E',{stroke:'#39424A','stroke-width':'2.5'});
    P('M370 125 h32 l-4 12 h-24 Z','#5E6871',{stroke:'#39424A','stroke-width':'2'});

    /* the horn */

    /* quench barrel, steaming */
    R(500,112,64,52,'#5A4938',{rx:'4'});

    [0,1].forEach(function(i){

      svg.appendChild(S('rect',{x:String(x-9),y:String(84+(i%3)*14),width:'24',height:'10',rx:'3',fill:'#8A9AA6'}));

  }

  wrap.appendChild(svg);
  return wrap;
};

MF.areaModel = function(host, o){
  var stage = E('div','stage');
  var W=430, VH=268, padL=74, padT=52,
      cw=(W-padL-14)/o.cols.length, ch=(VH-padT-16)/o.rows.length;
  var svg = S('svg',{viewBox:'0 0 '+W+' '+VH});
  var tints={sq:'var(--tile-sq)',x:'var(--tile-x)',k:'var(--tile-k)'};
  var inks ={sq:'var(--tile-sq-ink)',x:'var(--tile-x-ink)',k:'var(--tile-k-ink)'};
  o.rows.forEach(function(r,ri){
    o.cols.forEach(function(c,ci){
      var cell=o.cells[ri][ci], x=padL+ci*cw, y=padT+ri*ch, kind=cell.kind||'k';
      var rect=S('rect',{x:x,y:y,width:cw-3,height:ch-3,rx:5,fill:tints[kind],stroke:'rgba(0,0,0,.16)','stroke-width':1});
      if(cell.negative) rect.setAttribute('stroke-dasharray','6 4');
      svg.appendChild(rect);
      var t=S('text',{x:x+(cw-3)/2,y:y+(ch-3)/2+7,'text-anchor':'middle',
        'font-family':"'Black Han Sans','Arial Black',Impact,sans-serif",'font-size':20,fill:inks[kind]});
      t.textContent=cell.text; svg.appendChild(t);
    });
  });
  o.cols.forEach(function(c,ci){
    var x=padL+ci*cw+(cw-3)/2, known=(o.sideMode==='show'||c.known);
    var t=S('text',{x:x,y:padT-18,'text-anchor':'middle','font-family':"'Black Han Sans','Arial Black',Impact,sans-serif",
      'font-size':19,fill:known?'var(--ink)':'var(--ore-t)'});
    t.textContent=known?c.label:'?'; svg.appendChild(t);
    svg.appendChild(S('line',{x1:padL+ci*cw,y1:padT-10,x2:padL+ci*cw+cw-3,y2:padT-10,
      stroke:known?'var(--tan)':'var(--ore)','stroke-width':3,'stroke-dasharray':known?'':'5 4'}));
  });
  o.rows.forEach(function(r,ri){
    var y=padT+ri*ch+(ch-3)/2+6, known=(o.sideMode==='show'||r.known);
    var t=S('text',{x:padL-16,y:y,'text-anchor':'end','font-family':"'Black Han Sans','Arial Black',Impact,sans-serif",
      'font-size':19,fill:known?'var(--ink)':'var(--ore-t)'});
    t.textContent=known?r.label:'?'; svg.appendChild(t);
    svg.appendChild(S('line',{x1:padL-8,y1:padT+ri*ch,x2:padL-8,y2:padT+ri*ch+ch-3,
      stroke:known?'var(--tan)':'var(--ore)','stroke-width':3,'stroke-dasharray':known?'':'5 4'}));
  });
  svg.setAttribute('aria-label', o.a11y || o.caption || 'area model');
  svg.setAttribute('width','100%'); svg.removeAttribute('height');
  stage.appendChild(svg);
  if(o.caption) stage.appendChild(H('div','model-cap', o.caption));
  host.appendChild(stage);
  return svg;
};

/* =========================================================================
   THE TRANSLATION TABLE, and it is generated rather than typed.

   Every word this site uses for a thing, against the word a textbook uses for
   the same thing. A student who learns "the seam runs" and never learns that
   the seam is A FACTOR has learned a game, not algebra - and the metaphor
   stops being a way in the moment it becomes a private language.

   EACH ROW CARRIES A WORKED EXAMPLE THAT COMES OUT OF THE ENGINE, not out of
   prose. `show(ore)` is asked to produce the example and `holds(ore)` is what
   makes the row TRUE - so the `rosetta` group can assert that x² − 25 really
   does classify as a twin seam and 3x + 12 really does carry a common metal,
   instead of trusting a sentence somebody typed. A row whose claim stopped
   being true would be caught rather than sitting there teaching a falsehood.
   ========================================================================= */
MF.ROSETTA = [
  { mine:'ore',                real:'an expression',
    note:'Any expression at all — a number, a monomial, a binomial, a trinomial.',
    ore:{kind:'poly',a:2,b:10,c:12},
    show:function(o){ return MF.oreLabel(o) + ' is a lump of ore'; },
    holds:function(o){ return o.kind==='poly'; } },

  { mine:'a seam, a vein',     real:'a factor',
    note:'It was in the rock before you arrived. Finding it does not put it there.',
    ore:{kind:'poly',a:1,b:5,c:6},
    show:function(o){ var g = MF.simplestFactor(o); return '( ' + ingotHtml(g) + ' ) runs through ' + MF.oreLabel(o); },
    holds:function(o){ var g = MF.simplestFactor(o); return !!g && MF.breakOff(o, g).ok; } },

  { mine:'breaking it',        real:'factoring',
    note:'One swing takes out one factor. What is left goes back under the hammer, and that repeats until nothing will come apart.',
    ore:{kind:'poly',a:2,b:10,c:12},
    show:function(o){ return MF.oreLabel(o) + ' <span class="op">&rarr;</span> ' + MF.smeltString(MF.smeltPoly(o.a,o.b,o.c)); },
    holds:function(o){ return !!MF.smeltPoly(o.a,o.b,o.c).ingots; } },

  { mine:'native metal',       real:'a prime, or an irreducible polynomial',
    note:'THE ONE THIS PLACE EXISTS FOR. They are not two similar things — they are the same object, an element that breaking cannot separate further.',
    ore:{kind:'poly',a:1,b:0,c:4},
    show:function(o){ return num(7) + ' and ' + MF.oreLabel(o) + ' are the same kind of thing'; },
    holds:function(o){ return MF.isNative(o) && isPrime(7); } },

  { mine:'a twin seam',        real:'a difference of two squares',
    note:'No middle term, and both ends square. The two middles cancel each other out.',
    ore:{kind:'poly',a:1,b:0,c:-25},
    show:function(o){ return MF.oreLabel(o) + ' <span class="op">=</span> ' + MF.smeltString(MF.smeltPoly(o.a,o.b,o.c)); },
    holds:function(o){ return MF.smeltPoly(o.a,o.b,o.c).kind === 'twin'; } },

  { mine:'the common metal',   real:'the greatest common factor (the GCF)',
    note:'The one thing every term is carrying. Always the first thing to look for.',
    ore:{kind:'poly',a:0,b:3,c:12},
    show:function(o){ return MF.oreLabel(o) + ' <span class="op">=</span> ' + num(MF.commonMetal(o)) + ' ( ' + quad(0, o.b/MF.commonMetal(o), o.c/MF.commonMetal(o)) + ' )'; },
    holds:function(o){ var g = MF.commonMetal(o); return !!g && Math.abs(g) > 1 && o.b % g === 0 && o.c % g === 0; } },

  { mine:'loaded ore',         real:'ax² + bx + c with a ≠ 1',
    note:'Both ends are pinned, so the x-parts have to multiply to a and the numbers to c. That is what factoring by grouping is for.',
    ore:{kind:'poly',a:6,b:7,c:-3},
    show:function(o){ return MF.oreLabel(o) + ' <span class="op">=</span> ' + MF.smeltString(MF.smeltPoly(o.a,o.b,o.c)); },
    holds:function(o){ return o.a !== 1 && o.a !== 0; } },

  { mine:'the assay',          real:'recognising the form before you work it',
    note:'Naming what kind of thing is in front of you, which is the step that decides which method you reach for.',
    ore:{kind:'poly',a:1,b:-5,c:6},
    show:function(o){ return MF.oreLabel(o) + ' is ' + (MF.ASSAY[MF.assayOf(o)] ? MF.ASSAY[MF.assayOf(o)].name : MF.assayOf(o)); },
    holds:function(o){ return !!MF.ASSAY[MF.assayOf(o)]; } },

  { mine:'the pour, the mold', real:'the distributive property',
    note:'The forge’s move, and the only place it happens. Metals go in separate and one object comes out.',
    ore:{kind:'poly',a:1,b:5,c:6},
    show:function(o){ return '( x + 2 )( x + 3 ) <span class="op">=</span> ' + MF.oreLabel(o); },
    holds:function(o){ var p = ingotProduct([{m:1,k:2},{m:1,k:3}]); return p.a===o.a && p.b===o.b && p.c===o.c; } },

  { mine:'sound, or scrap',    real:'checking by multiplying back',
    note:'If the pieces multiply back to the rock they came out of, they were the pieces. There is nothing else to check.',
    ore:{kind:'poly',a:1,b:5,c:6},
    show:function(o){ return 'multiply the pieces and see whether ' + MF.oreLabel(o) + ' comes back'; },
    holds:function(o){ var p = ingotProduct([{m:1,k:2},{m:1,k:3}]); return p.a===o.a && p.b===o.b && p.c===o.c; } }
];

MF.paintRosetta = function(host){
  var box = E('div','panel light');
  box.appendChild(H('div','panel-tag','WHAT EVERY WORD HERE MEANS'));
  box.appendChild(H('p','lede','This place calls things by mining names, and every one of them is a real mathematical thing with a real name. ' +
    'If you only ever learn one column you have learned half of it.'));
  var tbl = E('table','rosetta');
  var hr = E('tr');
  ['in the mine','in the maths','worked out'].forEach(function(h){ hr.appendChild(E('th',null,h)); });
  tbl.appendChild(hr);
  MF.ROSETTA.forEach(function(r){
    var tr = E('tr');
    tr.appendChild(H('td','rm','<b>' + r.mine + '</b><div class="rn">' + r.note + '</div>'));
    tr.appendChild(H('td','rr', r.real));
    var ex = '';
    try { ex = r.show(r.ore); } catch(e){ ex = ''; }
    tr.appendChild(H('td','rx', ex));
    tbl.appendChild(tr);
  });
  /* THE TABLE SCROLLS INSIDE A WRAPPER, not by being display:block itself.
     A <table> forced to display:block still leaks its min-content width to
     the page in this engine - 450px of row inside a 344px column - so the
     whole page scrolled sideways at 380px. The wrapper is the scroll
     container and the table stays a table. */
  var scroller = E('div','tablescroll');
  scroller.appendChild(tbl);
  box.appendChild(scroller);
  box.appendChild(H('div','note good','<b>The row that matters most is “native metal”.</b> ' +
    'A prime and a polynomial that nothing separates are not <em>like</em> each other. They are the same object: something already refined, ' +
    'which breaking cannot take further. That is why <b>72</b> and <b>x² − 5x + 6</b> are one job and not two.'));
  host.appendChild(box);
  return box;
};

/* =========================================================================
   THE WORKING FLOOR: WHERE A TOOL IS TAUGHT, ONE STEP AT A TIME.

   USER, 2026-09-04: "The Casting Shed should include a section that teaches
   how to use the tools on preselected ores, with an interactive, guided
   textual explanation. Only tools that have been successfully cast should be
   available as lessons." And, the same day: "There should no more lessons on
   the tools in the forge."

   So there is now exactly ONE place a tool is taught, and it is not the forge.
   What the forge does is make the thing; what this room does is teach it.

   WHAT REPLACED WHAT:

   - `MF.paintSchemaIndex` listed all seven methods as folded essays, whether
     or not you owned the tool, each with `MF.toolLesson` inside it. Both are
     gone. The index printed the whole method at once, which is a page to read
     rather than a thing to be walked through.
   - `MF.toolLesson` also ran in the forge, three seconds after a pour, where
     a student is looking at the casting they just made. It taught nobody
     twice and it is where the user asked for it not to be.

   THE GATE, AND WHY IT IS NOT THE GATE §10a FORBIDS. The binding constraint
   is that a tool never gates DESCENT: a student with an empty belt can reach
   and work the deepest layer, and `nogate` walks every layer to prove it. That
   is untouched. What is gated here is a LESSON ABOUT AN INSTRUMENT YOU ARE
   HOLDING - and a lesson about a tool nobody has is a page about a thing that
   is not in the room. The methods themselves are not secret: every one of them
   is performed in the mine the moment the instrument touches a rock, and the
   Stamp Mill and the mold room teach the mathematics with no tool at all.

   THE ORE IS PRESELECTED, per tool, and it is `SCHEMA[key].practice.ore` -
   the lump the method was written against and the one the `schema` group
   already checks the practice answer comes out of. One lump, chosen for the
   method, so the walkthrough and the thing you then try are the same rock.
   ========================================================================= */
MF.paintToolSchool = function(host){
  var owned = MF.toolOrder().filter(MF.hasTool);
  var box = E('div','panel school');
  box.appendChild(H('div','panel-tag','THE WORKING FLOOR'));

  if(!owned.length){
    /* NOT A LOCKED DOOR, AND IT MUST NOT READ AS ONE. Nothing here is earned
       and nothing in the mine is behind it - this says where lessons come
       from and that the mine does not wait for them. */
    box.appendChild(H('p','lede','<b>Nothing on your belt yet, so there is nothing to teach here.</b> ' +
      'A lesson appears on this floor for every instrument you have <b>cast</b> — the method it carries, ' +
      'walked one step at a time on a lump chosen for it, and then one to try yourself.'));
    box.appendChild(H('div','note','Instruments are not handed out. You make them at the forge, out of metal ' +
      'you broke out of the rock yourself — so the first lesson here is one you will have earned by factoring. ' +
      '<b>Nothing in the mine is waiting on it:</b> every layer works with an empty belt, and the rooms above ' +
      'teach the mathematics with no instrument at all.'));
    var go = E('div','row'); go.style.marginTop = '10px';
    go.appendChild(MF.jump('To the forge &rarr;', 'forge'));
    go.appendChild(MF.jump('The Stamp Mill &rarr;', 'workshop-ore'));
    box.appendChild(go);
    host.appendChild(box);
    return box;
  }

  box.appendChild(H('p','lede','One lesson for every instrument you have cast. Each is the method that instrument ' +
    'carries, <b>walked a step at a time</b> on a lump chosen for it — and at the end, the same lump to try ' +
    'yourself. Nothing here is marked, and the thing that answers you is the engine the anvil swings through.'));

  owned.forEach(function(key, i){
    var t = MF.TOOLS[key], s = MF.SCHEMA[key];
    if(!s) return;
    var d = document.createElement('details');
    d.className = 'schemadet lessondet';
    if(i === 0) d.setAttribute('open','');       /* the first one is open */
    var sm = document.createElement('summary');
    sm.innerHTML = '<span class="sdic">' + t.ic + '</span><span class="sdnm">' + s.name + '</span>' +
      '<span class="sdtool">' + t.nm + '</span>';
    d.appendChild(sm);
    var body = E('div','sdbody');
    d.appendChild(body);
    box.appendChild(d);
    /* THE LESSON REPAINTS INTO ITS OWN BODY. `MF.go` would rebuild the whole
       screen, scroll to the top, move focus and replay the arrival wipe - the
       exact fault the `inplace` group exists for - and it would close the
       `details` the student is reading. */
    MF.drawLesson(body, key);
  });

  host.appendChild(box);
  return box;
};

/* WHERE EACH STUDENT IS IN EACH LESSON. Kept on MF.state so walking away from
   the room and coming back does not send them to step one, and so a repaint
   for any other reason cannot either. */
MF.lessonState = function(key){
  if(!MF.state.school) MF.state.school = {};
  if(!MF.state.school[key]) MF.state.school[key] = {at:0};
  return MF.state.school[key];
};

/* ONE LESSON, DRAWN AT WHATEVER STEP IT IS ON.
   `at` is the index of the LAST revealed step; `at === steps.length` means the
   walkthrough is done and the practice is out. */
MF.drawLesson = function(box, key){
  var t = MF.TOOLS[key], s = MF.SCHEMA[key];
  if(!t || !s) return null;
  var ore = s.practice.ore;
  var steps = [];
  try { steps = s.steps(ore) || []; } catch(e){ steps = []; }
  /* THE REASONING IS THE FIRST SLIDE, NOT A FOLD.

     USER, 2026-09-05: "there are walkthroughs with explicit text about how and
     why the tool works, with interactive slides and buttons to work through
     the process."

     `s.why` was behind a `<details>` labelled "why this works" - the best
     paragraph in the lesson, one click away and therefore unread. It is beat
     ZERO of the walk now: WHY it works, then HOW, step by step. The steps
     themselves are unchanged and still come from MF.SCHEMA, which the `schema`
     group checks. */
  var beats = [{kind:'why', act:s.why}].concat(steps);
  var st = MF.lessonState(key);
  if(st.at > beats.length) st.at = beats.length;
  if(st.at < 0) st.at = 0;
  var done = st.at >= beats.length;
  var hadFocus = box.contains(document.activeElement);

  clear(box);
  var wrap = E('div','lesson guided');

  /* ---- THE LUMP THIS LESSON IS ABOUT, DRAWN ---- */
  var head = E('div','lshead');
  var rock = MF.oreRock(ore, {native:false});
  rock.classList.add('lsrock');
  head.appendChild(rock);
  var hx = E('div','lstext');
  hx.appendChild(H('div','lslab','THE METHOD'));
  hx.appendChild(H('div','lsnm', s.name));
  hx.appendChild(H('div','lstool','<b>' + t.nm + '</b> carries it. The method is the part worth having — ' +
    'it works in a notebook with no instrument at all.'));
  head.appendChild(hx);
  wrap.appendChild(head);

  /* ---- THE WALKTHROUGH, AS FAR AS IT HAS BEEN OPENED ---- */
  var prog = E('div','lsprog');
  prog.appendChild(H('span','lsstep', done
    ? 'all ' + beats.length + ' slides out'
    : 'slide ' + (st.at + 1) + ' of ' + beats.length));
  var pips = E('div','lspips');
  for(var pi=0; pi<beats.length; pi++)
    pips.appendChild(E('i', pi <= st.at ? 'on' : null));
  prog.appendChild(pips);
  wrap.appendChild(prog);

  var ol = E('ol','ssteps');
  beats.forEach(function(step, i){
    if(i > st.at) return;
    var li = E('li', (step.kind === 'why' ? 'whyslide ' : '') +
                     (step.open ? 'open ' : '') + (i === st.at && !done ? 'now' : ''));
    if(step.kind === 'why') li.appendChild(H('div','swhylab','WHY IT WORKS'));
    li.appendChild(H('div','sact', step.act));
    if(step.shows) li.appendChild(H('div','sshow', step.shows));
    if(step.draw){ try { step.draw(li); } catch(e2){} }
    ol.appendChild(li);
  });
  wrap.appendChild(ol);

  /* ---- WHAT MOVES YOU ALONG IT ---- */
  var nav = E('div','lsnav');
  var back = E('button','btn lsback','&larr; back a slide'); back.type='button';
  back.innerHTML = '&larr; back a slide';
  back.disabled = (st.at === 0);
  back.setAttribute('aria-label','Go back one slide in this method');
  on(back,'click',function(){ st.at--; MF.drawLesson(box, key); });
  nav.appendChild(back);

  if(!done){
    var next = E('button','btn primary lsnext'); next.type='button';
    var nx = beats[st.at + 1];
    next.textContent = (st.at === 0) ? 'now how →' : ((nx && nx.open) ? 'and then it is yours →' : 'next slide →');
    next.setAttribute('aria-label','Show the next slide of ' + s.name);
    on(next,'click',function(){ st.at++; MF.drawLesson(box, key); });
    nav.appendChild(next);
    nav.appendChild(H('div','hint','Nothing is skipped by going forward, and nothing is lost by going back.'));
  } else {
    var again = E('button','btn lsagain','start it over'); again.type='button';
    on(again,'click',function(){ st.at = 0; MF.drawLesson(box, key); });
    nav.appendChild(again);
  }
  wrap.appendChild(nav);

  /* ---- THE CORE OF IT: HOLD THE INSTRUMENT TO REAL ORE ----
     USER: "the core of the activity is applying tools to ores." So the bench
     is NOT behind the walkthrough - it is there from the first slide, because
     reading about an instrument is the side of this the student can skip and
     using one is not. */
  MF.lessonBench(wrap, key);

  /* ---- AND AT THE END OF THE WALK, THE SAME LUMP TO TRY ---- */
  if(done) MF.lessonPractice(wrap, key);

  /* ---- WHERE THIS METHOD TURNS UP OUTSIDE A MINE ---- */
  MF.paintRealWorld(wrap, key);

  wrap.appendChild(H('div','hint','<b>In the mine:</b> click this instrument on your belt, then click a rock — ' +
    'or drag it onto one. The rock re-spells itself exactly as it does on the bench above.'));

  box.appendChild(wrap);
  /* KEEP THE KEYBOARD WHERE IT WAS. Every control here is destroyed by the
     repaint, so a student who is tabbing lands back at the top of the document
     on the first press of Next unless focus is put back deliberately. */
  if(hadFocus){
    var landing = box.querySelector('.lsnext') || box.querySelector('.practice input') ||
                  box.querySelector('.lsagain') || box.querySelector('.lsback');
    if(landing && landing.focus) landing.focus({preventScroll:true});
  }
  return wrap;
};

/* THE PRACTICE. One lump, one thing to name, DESCRIBED afterwards.

   IT HAS NO JUDGE OF ITS OWN. What the student names goes to MF.breakOff - the
   same engine the anvil swings through - so a miss is described by the rock
   ("the hammer glanced off; 4 does not run through 6x and 15") rather than
   marked. One engine, one description, no second opinion to drift. */
MF.lessonPractice = function(host, key){
  var s = MF.SCHEMA[key];
  var p = s && s.practice;
  if(!p) return null;
  var pr = E('div','practice');
  pr.appendChild(H('div','prlab','NOW YOU'));
  pr.appendChild(H('div','eq sm', MF.oreLabel(p.ore)));
  pr.appendChild(H('div','prask', p.ask));

  var isNum = (p.ore.kind === 'number');
  var row = E('div','nsrow');
  var bx = E('div','hbox');
  var mi = null;
  if(!isNum){
    bx.appendChild(H('span','paren','('));
    mi = document.createElement('input'); mi.type='text'; mi.inputMode='numeric'; mi.placeholder='1';
    mi.setAttribute('aria-label','how many x — leave it empty for a single x, or put 0 for a plain number');
    bx.appendChild(mi);
    bx.appendChild(H('span','paren','x +'));
  }
  var ki = document.createElement('input'); ki.type='text'; ki.inputMode='numeric'; ki.placeholder='0';
  ki.setAttribute('aria-label', isNum ? 'the number you are taking out' : 'the number on the end');
  bx.appendChild(ki);
  if(!isNum) bx.appendChild(H('span','paren',')'));
  row.appendChild(bx);

  var out = E('div','prout');
  var go = E('button','btn primary','Try it'); go.type='button';
  on(go,'click',function(){
    var m = isNum ? 0 : MF.readPickM(mi.value);
    var k = MF.readInt(ki.value);
    clear(out);
    if(!isFinite(m) || !isFinite(k) || isNaN(m) || isNaN(k)){
      out.appendChild(H('div','note','That is not a whole number, so there is nothing to try yet.'));
      return;
    }
    var got = MF.breakOff(p.ore, {m:m, k:k});
    if(got.ok){
      out.appendChild(H('div','note good','<b>The seam runs.</b> <b>' + MF.oreLabel(got.left) +
        '</b> came out of it, and <b>' + MF.oreLabel(got.right) + '</b> is what was left behind. ' +
        'That is the move — and it is the same one the anvil makes.'));
    } else {
      out.appendChild(H('div','note','<b>' + got.why + '</b> Nothing is lost — the lump is exactly as it was, and you can go again.'));
    }
  });
  on(ki,'keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); go.click(); } });
  row.appendChild(go);
  pr.appendChild(row);
  pr.appendChild(out);
  pr.appendChild(H('div','hint','Nothing here is kept and nothing here is a mark. It is the same engine the anvil ' +
    'swings through, so what it says about the rock is what the rock would say.'));
  host.appendChild(pr);
  return pr;
};

/* =========================================================================
   THE BENCH: HOLDING THE INSTRUMENT TO REAL ORE, WHICH IS THE ACTIVITY.

   USER, 2026-09-05: "the core of the activity is applying tools to ores."

   Everything above this on a lesson is reading. This is the part that is not:
   three lumps on a bench, the instrument on a hook, and the same gesture the
   cart uses - pick it up, put it on a rock, watch the numbers change. Take it
   off and the rock goes back to plain.

   IT IS THE SAME MECHANISM AS THE MINE'S, DELIBERATELY. `MF.oreDisplay` reads
   `ore.tool` and re-spells through `MF.lensFor`, so what a student sees here
   is not a demonstration OF the instrument - it is the instrument, on ore,
   doing the one thing it does. The only difference is that this bench keeps
   its own armed flag rather than touching `MF.state.armedTool`, which belongs
   to the belt in the mine and must not be left armed in another room.

   AND IT SAYS WHAT THE INSTRUMENT FOUND. In the mine nothing may be drawn
   beside a lump (§21) - the re-spelling has to be the whole reading. Here it
   may, because the user drew that line themselves: "Tutorials can have numbers
   out of the ore for teaching purposes." This is the tutorial.
   ========================================================================= */
MF.LESSON_ORES = {
  pick:    [{kind:'poly',a:1,b:-5,c:6}, {kind:'poly',a:1,b:0,c:4}, {kind:'number',n:72}],
  lantern: [{kind:'poly',a:1,b:-5,c:6}, {kind:'poly',a:0,b:6,c:15}, {kind:'number',n:72}],
  steel:   [{kind:'poly',a:0,b:6,c:15}, {kind:'poly',a:2,b:10,c:12}, {kind:'poly',a:3,b:12,c:0}],
  dial:    [{kind:'poly',a:1,b:3,c:2},  {kind:'poly',a:1,b:-5,c:6}, {kind:'poly',a:2,b:7,c:3}],
  shifter: [{kind:'poly',a:1,b:-5,c:6}, {kind:'poly',a:1,b:8,c:16}, {kind:'poly',a:6,b:7,c:-3}],
  drill:   [{kind:'poly',a:6,b:7,c:-3}, {kind:'poly',a:1,b:-5,c:6}, {kind:'poly',a:4,b:0,c:-9}],
  auger:   [{kind:'poly',a:6,b:7,c:-3}, {kind:'poly',a:2,b:7,c:3},  {kind:'poly',a:1,b:-5,c:6}]
};

MF.lessonBench = function(host, key){
  var t = MF.TOOLS[key];
  if(!t) return null;
  var st = MF.lessonState(key);
  /* THE ORE IS COPIED ONCE, per lesson. MF.oreDisplay reads `ore.tool`, so
     applying an instrument MUTATES the lump - and MF.LESSON_ORES is a shared
     literal. Two lessons that name the same shape would otherwise be holding
     the same object, and putting the drill on one would put it on both. */
  if(!st.bench){
    var src = MF.LESSON_ORES[key] || [MF.SCHEMA[key].practice.ore];
    st.bench = {armed:false, ores: src.map(function(o, i){
      var c = {kind:o.kind, id:'ls-' + key + '-' + i};
      if(o.kind === 'number') c.n = o.n; else { c.a=o.a; c.b=o.b; c.c=o.c; }
      return c;
    })};
  }
  var b = st.bench;

  var box = E('div','lbench');
  box.appendChild(H('div','lblab','&#128296; HOLD IT TO THE ORE &mdash; THIS IS THE PART THAT IS NOT READING'));
  box.appendChild(H('p','lbhint', b.armed
    ? '<b>' + t.nm + ' is in your hand.</b> Click a lump to hold it there. Click the same lump again and it comes off.'
    : 'Take <b>' + t.nm + '</b> off the hook, then click a lump. The numbers cut into the rock change — that is the whole of what an instrument does.'));

  /* ---- the instrument, on its hook ---- */
  var hook = E('div','lbhook');
  var tb = E('button','belttool lbtool'); tb.type='button';
  tb.setAttribute('data-tool', key);
  if(b.armed) tb.setAttribute('data-armed','yes');
  tb.setAttribute('aria-pressed', b.armed ? 'true' : 'false');
  tb.appendChild(H('span','bic', t.ic));
  tb.appendChild(H('span','bnm', t.nm.replace(/^The /,'')));
  tb.setAttribute('aria-label', t.nm + '. ' + (b.armed
    ? 'In your hand — click a lump to hold it there, or click again to put it back.'
    : 'Click to pick it up, then click a lump.'));
  on(tb,'click',function(){ b.armed = !b.armed; MF.drawLesson(host.parentNode || host, key); });
  hook.appendChild(tb);
  box.appendChild(hook);

  /* ---- the ore ---- */
  var row = E('div','lbores');
  b.ores.forEach(function(o){
    var cell = E('div','lbcell');
    var nat = MF.isNative(o);
    var btn = E('button','lbore' + (o.tool ? ' held' : '') + (nat ? ' native' : '')); btn.type='button';
    btn.setAttribute('data-lo', o.id);
    btn.appendChild(MF.oreRock(o, {native:nat}));
    btn.setAttribute('aria-label', MF.oreDisplayText(o) +
      (o.tool ? '. ' + t.nm + ' is on it — click to take it off.' : '. Click to hold ' + t.nm + ' to it.'));
    on(btn,'click',function(){
      /* PICK IT UP FIRST. Clicking a lump barehanded is not a silent no-op -
         it arms the instrument, because a student who clicks the rock has
         plainly said which rock they want. */
      if(!b.armed && !o.tool){ b.armed = true; }
      o.tool = (o.tool === key) ? null : key;
      MF.drawLesson(host.parentNode || host, key);
    });
    cell.appendChild(btn);

    /* WHAT THE INSTRUMENT FOUND, in words, under the stone. Not in the mine -
       there the re-spelling is the whole reading (§21) - but this is the room
       where a lesson is allowed to say it out loud. */
    if(o.tool){
      var read = null;
      try { read = MF.lensFor(o, key); } catch(e){ read = null; }
      cell.appendChild(H('div','lbfound', read && read.found
        ? '<b>' + t.nm.replace(/^The /,'The ') + ':</b> ' + read.found
        : '<b>Nothing moves in there.</b>'));
    } else {
      cell.appendChild(H('div','lbfound plain','plain rock — nothing on it yet'));
    }
    row.appendChild(cell);
  });
  box.appendChild(row);
  box.appendChild(H('div','hint','Nothing here is marked and nothing is spent. Put the instrument on all three — ' +
    'the point is what it has to say about <b>different shapes of lump</b>, including the one it can say nothing about.'));
  host.appendChild(box);
  return box;
};

/* =========================================================================
   WHERE THE METHOD TURNS UP OUTSIDE A MINE.

   USER, 2026-09-05: "not every section needs to end with a quiz; maybe add a
   reflection or a real-world example of the tool."

   So a lesson ends on this rather than on being asked something. Each one is
   a place the SAME MOVE is made by somebody who has never heard of this site,
   and the tie-back names which part of the method it is - because "maths is
   everywhere" is a poster, and "this is that step, here" is a lesson.
   ========================================================================= */
MF.REALWORLD = {
  pick: {
    where: 'Sorting scrap before it is melted',
    body: 'A yard that buys scrap metal tests a piece before it goes anywhere near the furnace — a magnet, a spark test, a scratch. None of it says what the piece is <b>worth</b>. It says what <b>kind</b> of thing it is, so the next decision is made on purpose instead of by guessing.',
    tie: 'That is this method exactly: name the shape before you commit to a move, and accept that naming it tells you nothing about the answer.'
  },
  lantern: {
    where: 'Reading a recipe backwards',
    body: 'You know a pot of soup fed twelve and you know you used three tins. You do not need to re-derive the whole recipe to work out how much each tin covered — one known part forces the other, because the total is the two of them multiplied.',
    tie: 'One side lit forces the other. That is why the lantern will not light both: once you have one, the second is not a second question.'
  },
  steel: {
    where: 'Costing a job',
    body: 'Three parts of a quote come in at £6, £15 and £9. A builder does not read that as three unrelated numbers — they see three threes, and quote it as "three lots of £2, £5 and £3". Pulling the common amount out is how a quote gets checked in your head on a doorstep.',
    tie: 'That is the GCF, and it is the first thing to try on any lump for the same reason: it makes everything after it smaller.',
  },
  dial: {
    where: 'Cutting stock to length',
    body: 'A machinist cutting 2.4m lengths out of a 12m bar gets exactly five with nothing left. Ask for 2.5m and you get four and a 2m offcut — the bar has not changed, the number you asked of it has. Whole cuts exist for some lengths and not for others.',
    tie: 'That is the whole-number test: some lumps come apart on whole numbers and some do not, and no amount of looking harder changes which.'
  },
  shifter: {
    where: 'Laying out a room',
    body: 'A floor 7m by 5m is 35m². Tile it in two strips — 4m and 3m — and it is 20 + 15, the same floor described twice. Every kitchen fitter and every tiler works in this rectangle, and none of them call it the distributive property.',
    tie: 'The box method IS that rectangle, run backwards: you know the area, and you are hunting for the two sides.'
  },
  drill: {
    where: 'Fitting a gear pair',
    body: 'You need two gears whose teeth multiply to a fixed ratio and whose sizes add up to the space in the housing. There is a short list of pairs that multiply right, and only some of them also fit — so you list the pairs first and then check the sum.',
    tie: 'Multiply to one number, add to another. That is the pair hunt, and it is the same search a gearbox designer runs.'
  },
  auger: {
    where: 'Splitting a bill that will not split evenly',
    body: 'Six people, an awkward total, and two of them shared a dish. You break the total into parts that group cleanly rather than dividing the whole thing at once — regroup first, and the arithmetic that was ugly becomes two easy sums.',
    tie: 'That is factoring by grouping: split the middle into two pieces that each share something with a neighbour, then take the common part out of each pair.'
  }
};

MF.paintRealWorld = function(host, key){
  var rw = MF.REALWORLD[key];
  if(!rw) return null;
  var box = E('div','realworld');
  box.appendChild(H('div','rwlab','&#127758; THE SAME MOVE, OUTSIDE A MINE'));
  box.appendChild(H('div','rwwhere', rw.where));
  box.appendChild(H('p','rwbody', rw.body));
  box.appendChild(H('div','rwtie', rw.tie));
  host.appendChild(box);
  return box;
};

/* =========================================================================
   A REFLECTION, WHICH IS NOT A QUESTION.

   Nothing is submitted, nothing is checked, nothing is stored, and it says so
   in the box. It is here because a room can end by asking a student to put
   something in their own words without also asking whether they got it right -
   and because `nogrades` would fail the build over anything that scored it.
   ========================================================================= */
/* =========================================================================
   WHAT DID THE MINER DO WRONG?

   USER, 2026-09-05. A worked attempt with the fault in it, on the bench, and
   the question is where it went off - not what the answer is.

   IT IS DESCRIBED, NOT MARKED, like everything else here: every option carries
   its own `says`, so the reading you get is about the WORKING rather than
   about you, and `holds` marks the one the mathematics supports so the `quiz`
   group can check it against the engine. The options go through
   MF.spreadOptions for the same reason every other question does - the
   supported one must not sit in the same slot every time.
   ========================================================================= */
MF.paintMiscut = function(host, o){
  /* CLASS `ask` AS WELL AS `miscut`: the quiz group sweeps `.ask` cards and
     clicks every `.qopt` in them, requiring each to say something back. This
     question has that shape exactly, so it gets the same sweep for free rather
     than a second copy of the same assertion somewhere else. */
  var box = E('div','miscut ask');
  box.appendChild(H('div','mclab', o.lab || '&#9935; WHAT DID THE MINER DO WRONG?'));
  if(o.lede) box.appendChild(H('p','mclede', o.lede));

  /* the log, line by line, with what the miner thought each line showed */
  var log = E('div','mclog');
  (o.work || []).forEach(function(w, i){
    var r = E('div','mcrow');
    r.appendChild(H('span','mcn', String(i+1)));
    r.appendChild(H('span','mcline', w.line));
    if(w.note) r.appendChild(H('span','mcnote', w.note));
    log.appendChild(r);
  });
  box.appendChild(log);

  box.appendChild(H('div','mcq', o.q || 'Where did it go wrong?'));
  var out = E('div','qout');
  var opts = E('div','qopts');
  MF.spreadOptions('miscut|' + String(o.q || '') + String(o.lab || ''), o.options).forEach(function(op){
    var b = E('button','qopt'); b.type='button';
    b.innerHTML = op.label;
    b.setAttribute('aria-label','Choose ' + (op.a11y || op.label.replace(/<[^>]+>/g,'')));
    on(b,'click',function(){
      Array.prototype.forEach.call(opts.children, function(n){ n.removeAttribute('data-chosen'); });
      b.setAttribute('data-chosen','yes');
      clear(out);
      out.appendChild(H('div','note' + (op.holds ? ' good' : ''),
        '<b>You chose ' + op.label.replace(/<[^>]+>/g,'') + '.</b> ' + op.says));
      if(op.holds && o.after) out.appendChild(H('div','mcafter', o.after));
    });
    opts.appendChild(b);
  });
  box.appendChild(opts);
  box.appendChild(out);
  box.appendChild(H('div','hint','Nothing here is kept and nothing here is marked. Every answer describes the ' +
    'working — including the ones that are not what went wrong.'));
  host.appendChild(box);
  return box;
};

/* =========================================================================
   FOLLOW-UP QUESTIONS, AND NOT ONE OF THEM IS MARKED.

   A workshop that shows you a thing and never asks you anything lets you
   leave believing you followed it. These ask - and then DESCRIBE what the
   answer you gave would mean about the rock, which is the same move the mine
   makes when a hammer glances off and the same move the forge makes when a
   casting misses. There is no tally, no "correct", no second attempt counter,
   and nothing that goes up or down. The `nogrades` group would fail the build
   over any of those, which is that check doing its job.

   TWO KINDS, and both end in the same place:

   - `pick`  - a recognition question. Every option carries its own `says`, so
               choosing the one the mathematics does not support gets a
               description of THAT lump rather than a buzzer. `true_` marks
               which option the maths actually supports, and it exists for the
               `quiz` group to verify against the engine - it is never used to
               style a button or print a verdict.

   - `type`  - an expression typed into the engine. It goes to MF.breakOff or
               ingotProduct, exactly as the forge's practice does, so the
               thing answering is the thing the anvil swings through. One
               engine, one description, no second opinion to drift.

   `check(m,k)` returns {ok, why} and is the workshop's own words for what the
   engine just said. Engine first, wording second - never the reverse.
   ========================================================================= */
MF.paintQuestions = function(host, o){
  var box = E('div','asks');
  box.appendChild(H('div','askslab', o.lab || 'BEFORE YOU GO'));
  box.appendChild(H('p','askslede', o.lede ||
    'Nothing here is kept and nothing here is marked. They are here because answering one is how you find out whether you followed it.'));

  o.list.forEach(function(qn, qi){
    var card = E('div','ask');
    /* THE QUESTION TEXT GETS ITS OWN SPAN. .qn is a flex row so the number
       badge sits beside the text - and a flex container turns every inline
       <b> in the question into a SEPARATE FLEX ITEM, which then refuses to
       wrap and walks off the right of the page. Two flex items, and the
       wrapping happens inside the second one where it belongs. */
    var qnRow = E('div','qn');
    qnRow.appendChild(H('span','qi', String(qi+1)));
    qnRow.appendChild(H('span','qt', qn.q));
    card.appendChild(qnRow);
    if(qn.sub) card.appendChild(H('div','qsub', qn.sub));
    var out = E('div','qout');

    if(qn.kind === 'type'){
      var isNum = !!qn.plain;
      var row = E('div','nsrow');
      var bx = E('div','hbox');
      var mi = null;
      if(!isNum){
        bx.appendChild(H('span','paren','('));
        mi = document.createElement('input'); mi.type='text'; mi.inputMode='numeric'; mi.placeholder='1';
        mi.setAttribute('aria-label','how many x — leave it empty for a single x, or put 0 for a plain number');
        bx.appendChild(mi);
        bx.appendChild(H('span','paren','x +'));
      }
      var ki = document.createElement('input'); ki.type='text'; ki.inputMode='numeric'; ki.placeholder='0';
      ki.setAttribute('aria-label', isNum ? 'the number' : 'the number on the end');
      bx.appendChild(ki);
      if(!isNum) bx.appendChild(H('span','paren',')'));
      row.appendChild(bx);
      var go = E('button','btn primary', qn.cta || 'Try it'); go.type='button';
      on(go,'click',function(){
        var m = isNum ? 0 : MF.readPickM(mi.value);
        var k = MF.readInt(ki.value);
        clear(out);
        if(!isFinite(m) || !isFinite(k) || isNaN(m) || isNaN(k)){
          out.appendChild(H('div','note','That is not a whole number, so there is nothing to try yet.'));
          return;
        }
        var got = qn.check(m, k);
        out.appendChild(H('div','note' + (got.ok ? ' good' : ''), got.why));
      });
      on(ki,'keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); go.click(); } });
      row.appendChild(go);
      card.appendChild(row);
    } else {
      var opts = E('div','qopts');
      /* THE ANSWER MUST NOT SIT IN THE SAME SLOT EVERY TIME.

         USER, 2026-09-05: "your multiple-choice questions are not random, and
         often the first choice is the best-fitting choice."

         Measured before touching anything: the option carrying `holds` was
         FIRST in EIGHT OF EIGHT questions across the whole build. A student
         who clicks the top option and reads nothing answers every recognition
         question in the site correctly - which is the surface-cue trap this
         project's own teaching brief exists to prevent, shipped in the one
         place whose job is to check whether a student followed the room.

         MF.balanced already existed for exactly this, and the assay has used
         it since §3: a deterministic shuffle, seeded so the order is stable
         under a repaint - the student's finger must not have the answer move
         out from under it - and different from question to question. The seed
         is the question's own text, so it is stable across sessions too and
         does not need to be stored. */
      MF.spreadOptions('q|' + String(qn.q).replace(/<[^>]+>/g,''), qn.options).forEach(function(op, oi){
        var b = E('button','qopt'); b.type='button';
        b.innerHTML = op.label;
        b.setAttribute('aria-label', 'Choose ' + (op.a11y || op.label.replace(/<[^>]+>/g,'')));
        on(b,'click',function(){
          Array.prototype.forEach.call(opts.children, function(n){ n.removeAttribute('data-chosen'); });
          b.setAttribute('data-chosen','yes');
          clear(out);
          /* THE DESCRIPTION IS OF THE LUMP, NOT OF THE STUDENT. Every option
             has one, so there is no shape of answer that gets a buzzer. */
          out.appendChild(H('div','note' + (op.holds ? ' good' : ''), '<b>You chose ' +
            op.label.replace(/<[^>]+>/g,'') + '.</b> ' + op.says));
        });
        opts.appendChild(b);
      });
      card.appendChild(opts);
    }
    card.appendChild(out);
    box.appendChild(card);
  });
  host.appendChild(box);
  return box;
};
/* =========================================================================
   THE THREE ILLUSTRATIONS, AND THEY MOVE.

   One per workshop, and each one is a drawing of the idea rather than a
   decoration beside it: the mold fills and one object comes out; the two
   columns of words trade places; the seven methods climb a ladder against ore
   that gets harder.

   NOT ONE WORD IS IN THE SVG. This is the rule roomScene already carries and
   this function broke on its first pass: SVG <text> paints with `fill` and
   inherits the CSS `color` property, so a contrast sweep measures a property
   that touches none of its pixels and reports a failure that is real
   arithmetic about nothing you can see. Ten of them, at 1.06:1. The drawing
   is shapes; every label is an HTML span pinned over it in percentages, which
   is measurable, selectable, and translatable by a browser.

   THE TRANSFORM RULE (VERIFICATION §38, and the animmount group enforces it):
   a CSS transform animation REPLACES the SVG transform attribute rather than
   composing with it. So anything both placed and animated is a placed <g>
   with an animated <g> INSIDE it. Every class below is in
   MF.ANIM_TRANSFORM_CLASSES, so the check fails the build if that is ever
   done the other way round.

   And under prefers-reduced-motion each one stops on a frame that still
   reads - the metal in the channels, the mold full, the object out - because
   a still frame of a good illustration is a diagram.
   ========================================================================= */
MF.shedArt = function(kind){
  var wrap = E('div','shedart');
  var W = 620, VH = 200;
  var svg = S('svg',{viewBox:'0 0 '+W+' '+VH, preserveAspectRatio:'xMidYMid meet','aria-hidden':'true'});
  var labs = E('div','shedlabs');
  function R(x,y,w,h,f,extra){ var n=S('rect',{x:x,y:y,width:w,height:h,fill:f});
    if(extra) for(var k in extra) n.setAttribute(k,extra[k]); svg.appendChild(n); return n; }
  /* a word goes HERE, in HTML, pinned over the drawing in percentages */
  function L(x, y, html, cls){
    var n = H('span','shedlab' + (cls?' '+cls:''), html);
    n.style.left = ((x/W)*100).toFixed(2) + '%';
    n.style.top  = ((y/VH)*100).toFixed(2) + '%';
    labs.appendChild(n); return n;
  }

  var defs = S('defs',{});
  var mg = S('linearGradient',{id:'sa'+kind+'m',x1:'0',y1:'0',x2:'0',y2:'1'});
  [['0%','#FFD873'],['52%','#E2600F'],['100%','#A8380A']].forEach(function(s){
    mg.appendChild(S('stop',{offset:s[0],'stop-color':s[1]})); });
  defs.appendChild(mg);
  svg.appendChild(defs);
  R(0,0,W,VH,'#2E2620');

  /* ---------------- THE MOLD: metals in separate, one object out ---------- */
  if(kind === 'mold'){
    wrap.setAttribute('role','img');
    wrap.setAttribute('aria-label','Two metals run down separate channels into one mold, which fills; a single formed bar is lifted out of it.');
    [[70,44,'x + 2'],[70,110,'x + 3']].forEach(function(ch, i){
      R(ch[0]-14, ch[1]-20, 172, 40, '#3E3328', {rx:'7', stroke:'#5A4938','stroke-width':'3'});
      L(ch[0]+72, ch[1], ch[2]);
      /* the drop of metal, travelling. Placed group outside, animated inside. */
      var seat = S('g',{transform:'translate('+(ch[0]+8)+','+ch[1]+')'});
      var run = S('g',{class:'sa-run r'+i});
      run.appendChild(S('circle',{cx:'0',cy:'0',r:'11',fill:'url(#sa'+kind+'m)'}));
      run.appendChild(S('circle',{cx:'0',cy:'0',r:'5',fill:'#FFF3C4',opacity:'.85'}));
      seat.appendChild(run);
      svg.appendChild(seat);
    });
    /* the mold itself, filling */
    R(300,34,150,132,'#241D18',{rx:'10',stroke:'#6B5B48','stroke-width':'4'});
    var fillSeat = S('g',{transform:'translate(304,38)'});
    var fill = S('g',{class:'sa-fill'});
    fill.appendChild(S('rect',{x:'0',y:'0',width:'142',height:'124',rx:'7',fill:'url(#sa'+kind+'m)'}));
    fillSeat.appendChild(fill);
    svg.appendChild(fillSeat);
    L(375,150,'the mold','dim');
    /* and one formed object leaving it */
    var outSeat = S('g',{transform:'translate(470,64)'});
    var outg = S('g',{class:'sa-lift'});
    outg.appendChild(S('rect',{x:'0',y:'0',width:'128',height:'54',rx:'8',fill:'#C8A24B',stroke:'#8A6A2A','stroke-width':'3'}));
    outSeat.appendChild(outg);
    svg.appendChild(outSeat);
    L(534,91,'x&sup2; + 5x + 6','ongold');
    L(534,142,'one formed object','dim');
  }

  /* ------------- THE WORDS: two columns that mean the same thing --------- */
  if(kind === 'words'){
    wrap.setAttribute('role','img');
    wrap.setAttribute('aria-label','Two columns of words facing each other — mining words on the left, mathematical terms on the right — with a light travelling along the bar that joins each pair.');
    L(150,26,'IN THE MINE','head lamp');
    L(470,26,'IN THE MATHS','head veinlt');
    [['ore','an expression'],['a seam','a factor'],['native metal','a prime']].forEach(function(pr, i){
      var y = 68 + i*44;
      R(30,y-21,240,38,'#3E3328',{rx:'7'});
      R(370,y-21,220,38,'#26332F',{rx:'7'});
      L(150,y,pr[0]);
      L(480,y,pr[1],'veinlt');
      R(272,y-3,96,6,'#5A4938',{rx:'3'});
      var seat = S('g',{transform:'translate(274,'+y+')'});
      var spark = S('g',{class:'sa-join j'+i});
      spark.appendChild(S('circle',{cx:'0',cy:'0',r:'8',fill:'#FFD873',opacity:'.35'}));
      spark.appendChild(S('circle',{cx:'0',cy:'0',r:'4',fill:'#FFF3C4'}));
      seat.appendChild(spark);
      svg.appendChild(seat);
    });
    L(310,190,'the same object, twice','dim');
  }

  /* ------------- THE METHODS: seven rungs against harder ore ------------- */
  if(kind === 'methods'){
    wrap.setAttribute('role','img');
    wrap.setAttribute('aria-label','A ladder of seven rungs climbing to the right against a row of lumps of ore that grow larger, with a lamp climbing the rungs.');
    for(var o=0; o<7; o++){
      var ox = 58 + o*80, sz = 15 + o*4;
      svg.appendChild(S('path',{d:'M'+(ox-sz)+' 178 l'+(sz*0.5)+' '+(-sz)+' l'+sz+' 0 l'+(sz*0.5)+' '+sz+' Z',
        fill:'#6B5B48', stroke:'#4A3F34','stroke-width':'2'}));
    }
    for(var r2=0; r2<7; r2++){
      var rx = 58 + r2*80, ry = 150 - r2*17;
      R(rx-30, ry, 60, 7, '#8A6A2A', {rx:'3'});
      R(rx-30, ry, 60, 7, 'none', {stroke:'#C8A24B','stroke-width':'2',rx:'3'});
    }
    var lseat = S('g',{transform:'translate(58,142)'});
    var climb = S('g',{class:'sa-climb'});
    climb.appendChild(S('circle',{cx:'0',cy:'0',r:'21',fill:'#FFD873',opacity:'.22'}));
    climb.appendChild(S('circle',{cx:'0',cy:'0',r:'11',fill:'#FFE9A8'}));
    climb.appendChild(S('rect',{x:'-7',y:'-20',width:'14',height:'8',rx:'2',fill:'#8A9AA6'}));
    lseat.appendChild(climb);
    svg.appendChild(lseat);
    L(310,26,'one method a rung, and the ore gets harder in step','dim');
  }

  svg.setAttribute('width','100%'); svg.removeAttribute('height');
  wrap.appendChild(svg);
  wrap.appendChild(labs);
  return wrap;
};

/* =========================================================================
   THE CASTING SHED, AND IT IS AN INTRODUCTION NOW.

   It used to be one long page: the mold player, then the translation table,
   then seven folded methods. Three separate lessons stacked in a column, and
   the third one was a screen and a half below the fold. They are three
   workshops now, each with its own page, its own moving illustration and its
   own questions - and this screen is the way in, which is the one job it
   keeps.

   THE SHED ITSELF STILL EXPLAINS THE MOLD. An introduction that only lists
   doors is a menu; this one says what the building is for before it offers
   the three ways further in.
   ========================================================================= */

/* THE FACTS THE QUESTIONS ARE BUILT ON, stated once and verified against the
   engine by the `quiz` group. A described-not-marked question can quietly
   describe the wrong thing and nothing on screen contradicts it, because
   there is no verdict to disagree with - so the claim under each option is
   written here as an engine call rather than as a sentence. */
MF.QUIZ_CLAIMS = [
  /* THE WHAT-WENT-WRONG IN THE WORDS RESTS ON THESE TWO TOGETHER, and the
     whole point of the question is that they are BOTH true of one lump: the
     miner checked for a common metal, found none, and read that as "nothing
     comes out of it". Checked separately here so the pair cannot quietly stop
     being the pair (§39). */
  {what:'x² − 9 carries no common metal',    want:false,
   holds:function(){ return !!MF.commonMetal({kind:'poly',a:1,b:0,c:-9}); }},
  {what:'x² − 9 comes apart all the same',   want:true,
   holds:function(){ return !MF.isNative({kind:'poly',a:1,b:0,c:-9}); }},
  {what:'x² − 9 runs at (x + 3)',            want:true,
   holds:function(){ return MF.breakOff({kind:'poly',a:1,b:0,c:-9}, {m:1,k:3}).ok; }},
  {what:'x² + 4 is native metal',            want:true,
   holds:function(){ return MF.isNative({kind:'poly',a:1,b:0,c:4}); }},
  {what:'x² − 9 still comes apart',          want:false,
   holds:function(){ return MF.isNative({kind:'poly',a:1,b:0,c:-9}); }},
  {what:'x² − 9 is a twin seam',             want:true,
   holds:function(){ return MF.smeltPoly(1,0,-9).kind === 'twin'; }},
  {what:'2x + 6 carries a common metal',     want:true,
   holds:function(){ return MF.commonMetal({kind:'poly',a:0,b:2,c:6}) === 2; }},
  {what:'6x² + 7x − 3 is loaded ore',        want:true,
   holds:function(){ return MF.smeltPoly(6,7,-3).kind === 'loaded'; }},
  {what:'6, 7 and −3 share no common metal', want:false,
   holds:function(){ return !!MF.commonMetal({kind:'poly',a:6,b:7,c:-3}); }},
  {what:'6x² + 7x − 3 has no middle term',   want:false,
   holds:function(){ return MF.smeltPoly(6,7,-3).b === 0; }},
  {what:'4(x + 3) pours to 4x + 12',         want:true,
   holds:function(){ var p = ingotProduct([{m:0,k:4},{m:1,k:3}]); return p.a===0 && p.b===4 && p.c===12; }},
  {what:'the GCF of 18x + 24 is 6',          want:true,
   holds:function(){ return MF.commonMetal({kind:'poly',a:0,b:18,c:24}) === 6; }},
  {what:'3 also divides 18x + 24, and is smaller', want:true,
   holds:function(){ return 18 % 3 === 0 && 24 % 3 === 0 && 3 < MF.commonMetal({kind:'poly',a:0,b:18,c:24}); }},
  {what:'(x − 2) comes out of x² − 5x + 6',  want:true,
   holds:function(){ return MF.breakOff({kind:'poly',a:1,b:-5,c:6},{m:1,k:-2}).ok; }},
  {what:'2 comes out of 2x² + 10x + 12',     want:true,
   holds:function(){ return MF.breakOff({kind:'poly',a:2,b:10,c:12},{m:0,k:2}).ok; }},
  {what:'x² + 4 is the same kind of object as a prime', want:true,
   holds:function(){ return MF.isNative({kind:'poly',a:1,b:0,c:4}) && MF.isNative({kind:'number',n:7}); }}
];

/* ---------------- WORKSHOP 1: THE MOLD ---------------- */
MF.SCREENS['shed-mold'] = function(host){
  var st = {a:3, b:4, c:5, mode:'num'};
  MF.shedHead(host, 'shed-mold');
  host.appendChild(MF.shedArt('mold'));
  host.appendChild(H('p','lede','Two metals go in <b>separate</b> and one object comes out <b>single</b>. ' +
    'The mold does not choose the shape — the metals do. And because the result is determined, running it backwards has a definite answer, ' +
    'which is the whole reason the mine is possible at all.'));

  var panel = E('div','panel light');
  panel.appendChild(H('div','panel-tag play','PLAY &mdash; NOTHING TO ANSWER'));
  var ctrls = E('div','row');
  function slider(key,label,min,max){
    var w=E('div'); w.style.minWidth='170px'; w.style.flex='1 1 170px';
    w.appendChild(H('div','hint',label));
    var v=H('div','eq sm', num(st[key])); w.appendChild(v);
    var r=document.createElement('input');
    r.type='range'; r.min=min; r.max=max; r.step=1; r.value=st[key];

        quadText(1, a + c, a * c);

    MF.areaModel(stageHost,{
      rows:[{label:num(a)}],

    });

       same act at different sizes rather than two different lessons. */
    MF.pourChain(chainHost, isX ? [{m:0,k:a},{m:1,k:c}] : [{m:0,k:a},{m:0,k:b+c}]);
    eq.innerHTML = isX
      ? num(a)+'( x + '+num(c)+' ) <span class="op">=</span> '+num(a)+'x <span class="op">+</span> '+num(a*c)
      : num(a)+'( '+num(b)+' + '+num(c)+' ) <span class="op">=</span> '+num(a*b)+' <span class="op">+</span> '+num(a*c)+
        ' <span class="op">=</span> '+num(a*(b+c));
  }
  draw();
};

   WHAT WENT. A slider, a number box, and a row of buttons listing EVERY factor

   face for doing the looking for you (§10a), sitting here doing it for free.
   Picking one drew a static tree. Nothing was pressed, nothing moved, and the
   panel was labelled "PLAY - NOTHING TO ANSWER", which is a sign on a room
   saying there is nothing in it.

   WHAT IS HERE. The same loop the breaking floor runs, in numbers: a lump on
   the bench, you name something you think is in it, you PULL THE LEVER, and
   the press comes down. It splits or it does not. What comes off stays on the
   bench and can be stamped again. When nothing left will split, every piece is

/* ---- THE MILL ITSELF: frame, press, bench, lever ----
   The press slides between the uprights and the lever turns on a pin. Both are
   animated by CSS transforms, so NEITHER may carry a transform attribute - the
   attribute would be replaced rather than composed with (s5g). Everything in
   here is drawn where it stands. */
MF.millScene = function(M){
  var wrap = E('div','millsvg');
  var W=340, VH=214, uid='ml'+(MF._millSeq = (MF._millSeq||0)+1);
  var svg = S('svg',{viewBox:'0 0 '+W+' '+VH,'aria-hidden':'true'});
  var defs = S('defs',{});
  function mgrad(id, stops, horiz){
    var g = S('linearGradient',{id:id,x1:'0',y1:'0',x2:(horiz?'1':'0'),y2:(horiz?'0':'1')});
    stops.forEach(function(s){ g.appendChild(S('stop',{offset:s[0],'stop-color':s[1]})); });
    defs.appendChild(g);
  }
  mgrad(uid+'iron', [['0%','#8E9AA6'],['40%','#5E6A76'],['100%','#2E353C']], true);
  mgrad(uid+'head', [['0%','#A2AEBA'],['34%','#6E7A86'],['100%','#333B43']], true);
  mgrad(uid+'wood', [['0%','#8A6142'],['46%','#6B4A32'],['100%','#3F2C1D']]);
  svg.appendChild(defs);

  /* the wall behind it, so the frame has something to stand against */
  svg.appendChild(S('rect',{x:0,y:0,width:W,height:VH,fill:'#3A3129'}));
  for(var b=0;b<5;b++)
    svg.appendChild(S('path',{d:'M0 '+(16+b*34)+' q120 '+((b%2)?4:-4)+' 340 '+((b%3)?3:-2),
      fill:'none',stroke:'#2E2620','stroke-width':'2',opacity:'.5'}));

  /* ---- the frame: two uprights and a crown ---- */
  svg.appendChild(S('rect',{x:40,y:26,width:24,height:132,rx:3,fill:'url(#'+uid+'iron)',
    stroke:'#20262C','stroke-width':'2.5'}));
  svg.appendChild(S('rect',{x:276,y:26,width:24,height:132,rx:3,fill:'url(#'+uid+'iron)',
    stroke:'#20262C','stroke-width':'2.5'}));
  svg.appendChild(S('rect',{x:32,y:8,width:276,height:26,rx:4,fill:'url(#'+uid+'iron)',
    stroke:'#20262C','stroke-width':'2.5'}));
  [52,288].forEach(function(bx){
    svg.appendChild(S('circle',{cx:bx,cy:21,r:4,fill:'#A2AEBA',stroke:'#20262C','stroke-width':'1.6'}));
  });

  /* ---- THE PRESS: a shaft down from the crown and a heavy shoe on it ---- */
  var press = S('g',{class:'stamphead'});
  press.appendChild(S('rect',{x:158,y:30,width:24,height:44,fill:'url(#'+uid+'iron)',
    stroke:'#20262C','stroke-width':'2.5'}));
  press.appendChild(S('rect',{x:100,y:70,width:140,height:38,rx:4,fill:'url(#'+uid+'head)',
    stroke:'#20262C','stroke-width':'3'}));
  press.appendChild(S('rect',{x:104,y:74,width:132,height:5,rx:2,fill:'#C4CED8',opacity:'.5'}));
  /* the striking face, the polished underside */
  press.appendChild(S('rect',{x:110,y:106,width:120,height:9,rx:2,fill:'#B6C2CE',
    stroke:'#20262C','stroke-width':'2.5'}));
  svg.appendChild(press);

  /* ---- THE BENCH the lump sits on ---- */
  svg.appendChild(S('rect',{x:26,y:158,width:288,height:22,rx:4,fill:'url(#'+uid+'wood)',
    stroke:'#33240F','stroke-width':'2.5'}));

  [56,262].forEach(function(lx){

  });
  svg.appendChild(S('ellipse',{cx:170,cy:208,rx:130,ry:6,fill:'#1B1511',opacity:'.4'}));

  /* ---- THE LEVER: a pin on the near upright and a bar you pull ---- */

    stroke:'#20262C','stroke-width':'2.5'}));

    var rock = MF.oreRock(ore, {native: isPrime(piece.n)});
    rock.classList.add('millrock');
    seat.appendChild(rock);
  }
  wrap.appendChild(seat);
