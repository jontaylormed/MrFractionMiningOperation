           swing, this sweep never swings, and `.thud` rests at opacity 0 so
           the walker would have skipped it even if it had been there. They
           shipped at 1.30:1 and 1.08:1.
           The opacity is forced because the animation is what raises it, and
           `art-director`'s instrument pauses animations before it measures -
           so a state that only exists mid-keyframe is invisible to every
           instrument this project owns unless it is mounted on purpose. */
        ['hit','glance'].forEach(function(kind){
          var cbs = E('div','anvilstage done');
          cbs.setAttribute('data-anim', kind);
          cbs.appendChild(MF.anvilScene({kind:'poly',a:1,b:-5,c:6,id:'ctr-blow-'+kind}, {shatter:true}));
          var cbBurst = MF.thudBurst(kind);
          cbBurst.style.opacity = '1';
          cbs.appendChild(cbBurst);
          probe.appendChild(cbs);
        });
      } else if(scr==='forge'){
        /* WITH A MOLD OPEN, and with something in it. Mounted cold the forge
           shows an order board and a "the mold is cold" plate - the crucible,
           the filled slots, the empty slots and the not-on-the-rack warning
           were all outside the sweep, which is the denominator question this
           project keeps having to ask of a green result. */
        MF.state.forge = {picked:'lantern', slots:[], result:null};
        var cHave = MF.yardList();
        if(cHave.length) MF.state.forge.slots = [{yardIdx:cHave[0].idx, key:cHave[0].key, ingot:cHave[0].ingot}];
        MF.SCREENS.forge(probe);
      } else if(scr==='forge-armed'){
        /* A MOLD WITH EVERY SLOT FILLED AND NOTHING POURED YET.
           The `forge` pass fills ONE slot and `forge-poured` pours - so the
           armed mold, the moment before the student presses pour, was never
           mounted. That is where the metal chips are on screen in numbers, and
           `.ingot` shipped at 3.80:1 in them: #16202A on the #6E7B87 end of the
           bar. The same chips PASS in the mine's yard, where the label is bold
           and the threshold drops to 3 - one colour reading as a pass or a fail
           depending on font-weight, which is not a property anyone was
           tracking. Every tool, because each fills a different number of slots
           with different metals. */
        MF.state.yard = {};
        [2,2,2,3,3,5,5].forEach(function(k){ MF.addToYard({m:0,k:k}); });
        [[1,4],[1,4],[1,1],[1,2],[1,-5],[1,5],[3,-1],[2,3]].forEach(function(g){ MF.addToYard({m:g[0],k:g[1]}); });
        var caArmed = 0;
        Object.keys(MF.TOOLS).forEach(function(tk){
          var spec = MF.TOOLS[tk];
          MF.state.tools = {};
          MF.state.forge = {picked:tk, slots:[], result:null};
          var caPick = MF.castableFrom(spec.cast, spec.slots, MF.yardList());
          if(!caPick || caPick.length !== spec.slots) return;
          MF.state.forge.slots = caPick.map(function(e){ return {yardIdx:e.idx, key:e.key, ingot:e.ingot}; });
          var caBox = document.createElement('div');
          probe.appendChild(caBox);
          MF._forge = null; MF.SCREENS.forge(caBox);
          if(caBox.querySelector('.ingot')) caArmed++;
        });
        if(!caArmed)
          errs.push('contrast: forge-armed filled no mold, so the metal chips in the slots were not swept');
      } else if(scr==='forge-poured'){
        /* AND ONCE MORE, POURED. The casting carries the tool's tutorial - the
           method, the reasoning and a practice - and none of it existed on the
           cold plate or on an open mold, so the sweep above walked straight
           past every pixel of it. Same denominator question as the mold-open
           pass that came before it. */
        MF.state.forge = {picked:'lantern', slots:[], result:null};
        MF.addToYard({m:0,k:2}); MF.addToYard({m:0,k:3}); MF.addToYard({m:0,k:5});
        MF.SCREENS.forge(probe);
        var cPool = MF.yardList().filter(function(e){ return e.ingot.m===0 && [2,3,5].indexOf(e.ingot.k)>=0; });
        var cPick = {}, cSlots = [];
        cPool.forEach(function(e){ if(!cPick[e.ingot.k] && cSlots.length<3){ cPick[e.ingot.k]=1; cSlots.push({yardIdx:e.idx, key:e.key, ingot:e.ingot}); } });
        MF.state.forge.slots = cSlots;
        if(cSlots.length===3) MF.forgePour(MF.state.forge);
      } else if(scr==='toolsheet'){
        /* THE PANEL THAT RISES OFF THE BELT. Every instrument's reading lives
           in it - the lit side, the method, the open steps, the box - and it is
           appended to document.body rather than into a screen, so mounting the
           five screens never measured one character of it. */
        MF.state.tools = {lantern:{forged:true},shifter:{forged:true},drill:{forged:true},auger:{forged:true},
                          dial:{forged:true},steel:{forged:true},pick:{forged:true}};
        MF.state.layer=4; MF.state.face=[]; MF.state.faceLayer=null;
        var cLump = {kind:'poly', a:6, b:7, c:-3, id:'ctr'};
        MF.state.cart=[cLump]; MF.state.selected=cLump;
        MF.state.anvil=MF.anvilInit(cLump); MF.state.anvil.step='break';
        MF._mine = null; MF.SCREENS.mine(probe); MF.paintMine();
        var cPiece = MF.state.anvil.floor[0].id;
        ['lantern','shifter','auger','drill'].forEach(function(tk){
          MF.openTool(tk, cLump, null, cPiece);
          var cs = document.querySelector('.toolsheet');
          if(cs) MF._measureContrast(cs).forEach(function(m){
            chk('contrast');
            if(m.ratio < m.need) contrastFails.push(tk + ' panel: "'+m.text+'" ('+m.cls+') at '+m.ratio+':1, needs '+m.need);
          });
          MF.closeTool();
        });
      } else if(scr==='hammersheet'){
        /* THE PANEL THE HAMMER IS ASKED FOR IN (§26). The whole swing bar moved
           into it - the label, the steel head, the echo of what the head is cut
           to, the hint about an empty x-part, and the button - and it is
           appended to document.body when a student clicks the ore, so mounting
           the five screens measures none of it. Exactly the denominator hole
           the `toolsheet` pass above was added to close, opened again the day
           the bar stopped being on the bench.
           TWO LUMPS, because a plain number draws one box and a hint of its
           own, and a student with no drill draws a third line neither of the
           others has. */
        MF.state.tools = {};
        MF.state.layer=4; MF.state.face=[]; MF.state.faceLayer=null;
        var cHam = 0;
        [{kind:'poly', a:6, b:7, c:-3, layer:4, id:'ctr-ham'},
         {kind:'number', n:72, layer:4, id:'ctr-hamn'}].forEach(function(hOre){
          MF.state.cart=[hOre]; MF.state.selected=hOre;
          MF.state.anvil=MF.anvilInit(hOre);
          MF.openHammer(MF.state.anvil, null);
          var hs = document.querySelector('.scrim .toolsheet');
          if(!hs) return;
          cHam++;
          MF._measureContrast(hs).forEach(function(m){
            chk('contrast');
            if(m.ratio < m.need) contrastFails.push('hammer panel on ' + MF.oreText(hOre) +
              ': "'+m.text+'" ('+m.cls+') at '+m.ratio+':1, needs '+m.need);
          });
          MF.closeTool();
        });
        if(cHam < 2)
          errs.push('contrast: the hammer panel opened for ' + cHam + ' of 2 lumps, so it was not swept');
      } else if(scr==='mold-pour'){
        /* THE NUMBERS ON A POUR, WHICH NOTHING HAD EVER MEASURED.

           `MF._measureContrast` on a poured mold returned ZERO elements.
           `.mdnum` rests at `opacity:0` and is raised by an animation on a
           delay, and the sweep skips anything at zero opacity - correctly,
           because you cannot measure what is not painted. So the halo those
           numbers depend on was documented, hand-measured once, and verified
           by nothing (VERIFICATION §82).

           The `mine-blow` pass above already solved this shape for the THUD
           burst by forcing its opacity before measuring. This does the same,
           with `!important` because an inline value alone loses to a running
           animation - important author declarations are the one thing that
           beats one.

           READ THE DENOMINATOR: this measures the INK against the surface, the
           way every other pass does. It does not model the text at the 0.85
           opacity its keyframes hold it at - no pass on this site composites a
           fade, and a check that did would have to do it everywhere or mean
           nothing. What it closes is that these numbers were not looked at.

           Three pours, because what is under the numbers differs: two brackets
           put four products over the casting, a twin seam has middles that
           cancel, and three plain metals is the five-token stream. */
        MF.state.yard = {};
        [[{m:1,k:2},{m:1,k:3}], [{m:1,k:3},{m:1,k:-3}], [{m:0,k:2},{m:0,k:3},{m:0,k:5}]]
          .forEach(function(ings){
            var mp = MF.moldScene('lantern', {ok:true, maths:MF.moldMaths(ings, ingotProduct(ings))});
            mp.setAttribute('data-pour','sound');
            probe.appendChild(mp);
          });
        var cLit = 0;
        probe.querySelectorAll('.mdnum').forEach(function(n){
          n.style.setProperty('opacity','1','important');
          cLit++;
        });
        if(!cLit)
          errs.push('contrast: the poured molds drew no numbers, so the pour was not swept');
        /* AND THE FORCING HAS TO HAVE WORKED. This is the assertion that keeps
           the hole shut: if a later change makes these un-forceable - an
           `!important` in a keyframe, a parent at zero opacity - the sweep
           goes back to measuring nothing and reporting clean, which is the
           state §82 was written about. */
        var cDark = 0;
        probe.querySelectorAll('.mdnum').forEach(function(n){
          if(parseFloat(getComputedStyle(n).opacity) === 0) cDark++;
        });
        chk('contrast');
        if(cDark)
          errs.push('contrast: ' + cDark + ' of ' + cLit + ' numbers on the pour are still at zero ' +
            'opacity, so the sweep skips them and measures nothing');
      } else if(scr==='shed-taught'){
        /* THE CASTING SHED WITH SOMETHING TO TEACH.

           `shed-methods` is in MF.SCREENS and is swept generically - with
           whatever `MF.state.tools` happens to hold, which through most of a
           run is nothing. So the sweep mounted the EMPTY state and measured
           not one character of a lesson, and the moment the working floor
           replaced the seven-method index the group's denominator quietly
           fell by 140 checks while still reporting clean (§26 all over again).

           Every tool cast, every lesson WALKED TO ITS END, because the last
           step, the practice and the "start it over" control only exist once
           the walkthrough is finished - three states the first paint has
           none of. */
        MF.state.tools = {};
        MF.toolOrder().forEach(function(tk){ MF.state.tools[tk] = {forged:true}; });
        MF.state.school = {};
        MF.SCREENS['shed-methods'](probe);
        var cWalk = 0;
        [].forEach.call(probe.querySelectorAll('.lessondet'), function(d){
          d.setAttribute('open','');                 /* fold-away copy is still copy */
          for(var g=0; g<12; g++){
            var nx = d.querySelector('.lsnext');
            if(!nx) break;
            nx.dispatchEvent(new MouseEvent('click',{bubbles:true}));
          }
          if(d.querySelector('.practice')) cWalk++;
        });
        if(cWalk < MF.toolOrder().length)
          errs.push('contrast: only ' + cWalk + ' of ' + MF.toolOrder().length +
            ' lessons reached their practice, so the end of the walkthrough was not swept');
      } else { MF.SCREENS[scr](probe); }
    } catch(e){ errs.push('contrast: screen '+scr+' threw: '+e.message); return; }
    MF._measureContrast(probe).forEach(function(m){
      chk('contrast');
      if(m.ratio < m.need) contrastFails.push(scr+': "'+m.text+'" ('+m.cls+') at '+m.ratio+':1, needs '+m.need);
    });
  });
  /* TWO KINDS OF TEXT THE SWEEP ABOVE STRUCTURALLY CANNOT SEE.

     `_measureContrast` walks elements with a text node in them and reads
     `color`. That misses:

     - A PLACEHOLDER, which is a pseudo-element and has no text node of its
       own. It is also the only text on this site whose colour the file was
       not choosing: unset, Chrome paints #757575 (4.61:1) and Firefox 54%
       alpha (~3.5:1), so the same build was legible or not depending on what
       the student happened to open it in.
     - SVG <text>, which paints with `fill` and only INHERITS `color`. §59 is
       the whole story: ten labels once measured 1.06:1 because a sweep read a
       property that draws none of their pixels. The one SVG label left in the
       mine is the expression cut into the rock on the anvil, and what is
       behind it is a <polygon> fill, not a CSS background - so both halves of
       that reading have to come from SVG attributes.

     Both are measured against the real backdrop rather than skipped. */
  var cPh = document.createElement('div');
  cPh.style.cssText = 'position:fixed; left:-13000px; top:0; width:' +
    document.documentElement.clientWidth + 'px';
  document.body.appendChild(cPh);
  function cRgb(v){
    var m=(v||'').match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/);
    if(m) return [+m[1],+m[2],+m[3], m[4]!==undefined?+m[4]:1];
    m=(v||'').match(/^#([0-9a-fA-F]{6})$/);
    if(m) return [parseInt(m[1].slice(0,2),16),parseInt(m[1].slice(2,4),16),parseInt(m[1].slice(4,6),16),1];
    return null;
  }
  function cLum(c){ var a=c.slice(0,3).map(function(x){ x/=255;
    return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4); });
    return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2]; }
  function cFlat(fg,bg){ var a=fg[3];
    return [0,1,2].map(function(i){ return fg[i]*a + bg[i]*(1-a); }).concat([1]); }
  function cRatio(f,b){ var L1=cLum(f),L2=cLum(b);
    return Math.round(((Math.max(L1,L2)+0.05)/(Math.min(L1,L2)+0.05))*100)/100; }
  var cPhProbe = document.createElement('div');
  cPh.appendChild(cPhProbe);
  MF._mine = null; MF.SCREENS.mine(cPhProbe);
  MF.state.layer=4; MF.state.face=[]; MF.state.faceLayer=null;
  var cPhOre = {kind:'poly', a:6, b:7, c:-3, layer:4, id:'ctr-ph'};
  MF.state.cart=[cPhOre]; MF.state.selected=cPhOre;
  MF.state.anvil=MF.anvilInit(cPhOre); MF.state.anvil.step='break';
  MF.paintMine();
  cPhProbe.querySelectorAll('input, textarea').forEach(function(el){
    if(!el.placeholder) return;
    chk('contrast');
    var cs=getComputedStyle(el), ps=getComputedStyle(el,'::placeholder');
    var bg=cRgb(cs.backgroundColor) || [255,255,255,1];
    var pc=cRgb(ps.color);
    if(!pc){ errs.push('contrast: the placeholder "'+el.placeholder+'" reports no colour at all'); return; }
    var px=parseFloat(cs.fontSize), need=(px>=24)?3:4.5;
    var r=cRatio(cFlat(pc,bg), bg);
    if(r < need)
      errs.push('contrast: the placeholder "'+el.placeholder+'" is '+r+':1 on its own box, needs '+need);
  });
  /* TEXT ON A SURFACE THAT CHANGES COLOUR MUST CARRY ITS OWN BACKGROUND.

     The maths written over a casting cannot be checked against "the backdrop",
     because the backdrop is a three-second animation from molten through deep
     red to steel. A flat ink that clears the dark end cannot clear the bright
     end - the arithmetic is in the comment on MF.moldArt's `txt`. What can be
     asserted is the thing that makes it readable at every frame: a HALO, drawn
     behind the letterforms, that the fill contrasts against.

     IT READS COMPUTED STYLE, NOT ATTRIBUTES. The halo lives in the stylesheet
     on `.mdnum`, and CSS wins over SVG presentation attributes - so a check
     that read the attributes would be reading whatever the last author wrote
     there, pass, and say nothing about what renders. That is a check grading
     its own input, and this one was written that way first.

     READ THE DENOMINATOR: this asserts the halo EXISTS in the rendered style,
     contrasts with the fill, and is thick enough to hold the letterform off
     the casting. It does NOT measure a pixel against the casting - a stroke
     can still be visually thin on a busy background, and no check here can see
     that. It replaces a measurement that cannot be made with a structural rule
     that can. */
  var cHalo = document.createElement('div');
  cHalo.style.cssText = 'position:fixed; left:-13000px; top:0; width:900px';
  document.body.appendChild(cHalo);
  MF.state.yard = {};
  [2,2,2,3,3,5,5].forEach(function(k){ MF.addToYard({m:0,k:k}); });
  [[1,4],[1,4],[1,1],[1,2],[1,-5],[1,5],[3,-1],[2,3]].forEach(function(g){ MF.addToYard({m:g[0],k:g[1]}); });
  Object.keys(MF.TOOLS).forEach(function(tk){
    var spec = MF.TOOLS[tk];
    MF.state.tools = {};
    MF.state.forge = {picked:tk, slots:[], result:null};
    var pick = MF.castableFrom(spec.cast, spec.slots, MF.yardList());
    if(!pick || pick.length !== spec.slots) return;
    MF.state.forge.slots = pick.map(function(e){ return {yardIdx:e.idx, key:e.key, ingot:e.ingot}; });
    cHalo.innerHTML = '';
    MF._forge = null;
    try { MF.SCREENS.forge(cHalo); MF.forgePour(MF.state.forge); }
    catch(e){ errs.push('contrast: the '+tk+' mold threw while pouring: '+e.message); return; }
    var nums = cHalo.querySelectorAll('text.mdnum');
    chk('contrast');
    if(!nums.length){ errs.push('contrast: the '+tk+' casting wrote no maths over itself, so the halo was not checked'); return; }
    nums.forEach(function(t){
      chk('contrast');
      var ts = getComputedStyle(t);
      var fill = ts.fill, halo = ts.stroke;
      var sw = parseFloat(ts.strokeWidth || 0);
      var fs = parseFloat(ts.fontSize);
      var fr = cRgb(fill), hr = cRgb(halo);
      if(!hr || !sw || ts.paintOrder.indexOf('stroke') !== 0){
        errs.push('contrast: the casting\'s "'+(t.textContent||'').trim().slice(0,14)+
          '" is written straight onto metal that goes from molten to steel, with no halo drawn behind it');
        return;
      }
      if(sw < fs * 0.15)
        errs.push('contrast: the halo on "'+(t.textContent||'').trim().slice(0,14)+'" is '+sw+
          ' on '+fs+'px text — too thin to hold the letterform off the casting');
      var hrRatio = cRatio(fr, hr);
      if(hrRatio < 4.5)
        errs.push('contrast: the casting\'s "'+(t.textContent||'').trim().slice(0,14)+
          '" is '+fill+' on a '+halo+' halo — '+hrRatio+':1, needs 4.5');
    });
  });
  document.body.removeChild(cHalo);

  /* AND THE ONE SVG LABEL: its fill against the fill of the shape under it */
  cPhProbe.querySelectorAll('svg text').forEach(function(t){
    if(!(t.textContent||'').trim()) return;
    chk('contrast');
    var fill = t.getAttribute('fill') || getComputedStyle(t).fill;
    var box = t.getBoundingClientRect(), svg = t.ownerSVGElement, under = null;
    if(svg && box.width){
      var cx=box.left+box.width/2, cy=box.top+box.height/2;
      svg.querySelectorAll('rect,polygon,path,circle,ellipse').forEach(function(s){
        var sb=s.getBoundingClientRect();
        if(cx<sb.left||cx>sb.right||cy<sb.top||cy>sb.bottom) return;
        var f=s.getAttribute('fill');
        if(f && f !== 'none' && f.indexOf('url(')<0) under = f;   /* last painted wins */
      });
    }
    var fr=cRgb(fill), ur=cRgb(under);

  var ipSaved = {forge:MF.state.forge, yard:MF.state.yard, tools:MF.state.tools, mine:MF._forge};

  /* 5k. THE INSTRUMENT PANEL, AND THE RULE THAT MAKES INSTRUMENTS LEGITIMATE.

         dialog: focus goes in, Escape closes it, focus comes back, and NOTHING

         makes every control dead - the same fault class that had the pick

  var shSaved = {tools:MF.state.tools, sheet:MF._sheet};
  MF.closeTool();
  MF.state.tools = {lantern:{forged:true}, drill:{forged:true}, shifter:{forged:true},
                    dial:{forged:true}, pick:{forged:true}};
  var shOres = [{kind:'number',n:60},{kind:'number',n:31},{kind:'poly',a:1,b:-5,c:6},
                {kind:'poly',a:0,b:6,c:15},{kind:'poly',a:6,b:7,c:-3},
                {kind:'poly',a:1,b:0,c:4},{kind:'poly',a:0,b:1,c:3}];
  Object.keys(MF.TOOL_READ).forEach(function(tk){
    shOres.forEach(function(so){
      chk('sheet');

      catch(e){ errs.push('sheet: ' + tk + ' threw on ' + MF.oreText(so) + ': ' + e.message); return; }

  /* PART OF A FACTORISATION, NEVER ALL OF IT.

     This check used to assert the Lantern named NO factor. That is false by
     design now (MINE-SPEC §13): the Lantern lights one side and leaves the
     other as a ?. The rule it enforces is the one the user actually stated -
     a tool "help realize part of the factor not all the factor" - so it
     counts how many of the lump's own factors a reading contains and requires
     the answer to be exactly one.

     BOTH FAILURE DIRECTIONS ARE CONTROLLED, because an amended check that only
     catches "too much" would pass silently on a Lantern that had stopped
     saying anything at all - and a green group over a dead instrument is
     exactly the failure §5 of CLAUDE.md is about.

     READ THE DENOMINATOR: four lumps, one reader. It says nothing about the

  var lampNames = function(reader){

  /* AND ONE SIDE MUST ACTUALLY BE LIT - asserted STRUCTURALLY, not by

  var lampTooFew = function(reader){

  chk('sheet');

  chk('sheet');
  if(!lampTooMany(function(h,o){
      h.appendChild(H('div','x','A seam runs, and it is ' + MF.smeltString(MF.smeltPoly(o.a,o.b,o.c)) + '.'));

    errs.push('CONTROL: the leak check cannot see a lantern that prints the whole factorisation');
  /* CONTROL 2: a lantern that names NOTHING must be caught too. Without this,

  chk('sheet');
  if(!lampTooFew(function(h,o){

    }).length)
    errs.push('CONTROL: the leak check cannot see a lantern that lights no side at all');

  if(!(document.activeElement && document.activeElement.closest && document.activeElement.closest('.toolsheet')))

  chk('sheet');
  var shd = document.querySelector('.toolsheet');
  if(!shd || shd.getAttribute('role')!=='dialog' || shd.getAttribute('aria-modal')!=='true')
    errs.push('sheet: the panel is not announced as a modal dialog');

  chk('sheet');

  document.body.removeChild(shHost);

  MF.closeTool();

  /* 5i. EVERY CLICK ON A LUMP MUST BE ANSWERED.

         could see: the lump already selected (paintMine drew a picture

         lumps. It says nothing about the shaft buttons, the bench, the yard or
         the forge, and nothing about whether the reaction looks any good. */
  var kSaved = {mine:MF._mine, layer:MF.state.layer, face:MF.state.face, fl:MF.state.faceLayer,

      MF.paintMine();                                   /* clear the previous answer */
      chk('knock');
      if(kHalos()) errs.push('knock: the repaint did not clear the previous reaction');
      kHit(kRock(0));
      chk('knock');
      if(!kHalos()) errs.push('knock: clicking the lump already selected repainted an identical face and answered nothing');
      chk('knock');
      if(!kHasCls(kRock(0),'.body','knock')) errs.push('knock: the lump itself did not take the knock');

      /* and a click that lands while a swing is in the air */
      MF.state.breaking = true;

      MF.knockRock = function(){};

       a lump that was plainly on screen ran a full MF.paintMine, which rebuilt

    chk('knock');

      var kf2 = MF._mine.mid.querySelector('.seamview');

      chk('knock');
      if(Math.abs(dPage) > 2)
        errs.push('knock: clicking a lump scrolled the page ' + dPage + 'px');

      chk('knock');
      if(!kNow || kNow.getAttribute('data-sel') !== 'on')

      chk('knock');
      var kSaid = ((MF._mine.mid.querySelector('.inspect .expr')||{}).textContent||'').trim();
      if(!kSaid)

      /* and the seam is not thrown away to do it */
      chk('knock');

    })();

       not popping below it."

       lump out PUSHED the scan row, the cart and everything under them down

       below it, it offers BOTH choices, and it is not on screen at all when
       nothing is picked out - an empty "nothing picked out yet" plate would
       reserve the height and give the shove back.

       READ THE DENOMINATOR: one lump, at the live viewport. It says nothing

    chk('knock');
    (function(){
      var pWall = MF._mine.mid.querySelector('.facewrap');
      var pPop  = MF._mine.mid.querySelector('.inspectpop');
      if(!pWall || !pPop){ errs.push('knock: the wall has no pop-out to open over it'); return; }
      MF.selectRock(null);
      chk('knock');

        errs.push('knock: the pop-out is on screen with nothing picked out — an empty plate ' +
          'reserves the height it was moved out of the flow to stop reserving');
      var below = MF._mine.mid.querySelector('.wall .row');
      var yBefore = below ? below.getBoundingClientRect().top : null;
      var pRock = MF._mine.mid.querySelector('.seamview .rock');
      if(!pRock){ errs.push('knock: no lump to open the pop-out with'); return; }
      kHit(pRock);
      chk('knock');
      if(pPop.hidden){ errs.push('knock: clicking a lump opened no pop-out'); return; }
      var pb = pPop.getBoundingClientRect(), wb = pWall.getBoundingClientRect();
      if(pb.bottom > wb.bottom + 2 || pb.top < wb.top - 2 ||
         pb.left < wb.left - 2 || pb.right > wb.right + 2)
        errs.push('knock: the pop-out is not inside the layer window — it is meant to be ' +
          'overlaid on the wall, not hanging off it');
      chk('knock');
      var yAfter = below ? below.getBoundingClientRect().top : null;
      if(yBefore != null && Math.abs(yAfter - yBefore) > 2)
        errs.push('knock: opening the pop-out moved what is under the wall by ' +
          Math.round(yAfter - yBefore) + 'px — it is overlaid, so nothing below it may shift');
      chk('knock');
      var labels = [].map.call(pPop.querySelectorAll('.btn'), function(b){ return b.textContent; }).join(' | ');
      if(!/swing/i.test(labels) || !/scan/i.test(labels))

    })();

       must report both the shove and the panel hanging outside the window. */
    chk('knock');
    (function(){
      var pWall = MF._mine.mid.querySelector('.facewrap');
      var pPop  = MF._mine.mid.querySelector('.inspectpop');

    /* CONTROL: put the re-centring back and the sweep must report the jump.

    /* 5j. NOTHING PAINTED OVER A CONTROL MAY TAKE ITS CLICK.

           the pick, never the rock. The same fault sat on the surface, where
           Mr Factor, the portal's dark mouth and the out-going cart all go on
           after the hotspots - so the blackest, most mine-looking part of the
           mine was the one place a click did nothing.

           This sweeps every element painted AFTER the first control in each
           scene, which is exactly the set that can occlude one. It does not
           look at anything painted behind a control, which cannot intercept
           it, and it says nothing about whether a control is big enough or in
           the right place - only that nothing is sitting on top of it. */
    var kOverlay = function(svgEl, controlSel){

          out.push('<' + n.tagName + ' class="' + (n.getAttribute('class')||'') + '">');

    var sProbe = MF.surfaceScene();
    kStage.appendChild(sProbe);
    var sceneSvg = sProbe.querySelector('svg');
    var overScene = kOverlay(sceneSvg, '.hot');
    chk('overlay');
    if(overScene.length)

    /* THE YARD IS DRAWN NOW, and its scenery is painted UNDER the rocks rather

    MF.state.rockpile = [{kind:'poly',a:1,b:5,c:6}, {kind:'number',n:30}];
    MF.paintMine();
    var yardSvg = MF._mine.right.querySelector('.yardart svg');

    else {

    var hr = MF._mine.right.querySelector('.heaprock');

    /* 5m. A SWING MUST ACTUALLY SWING.

           `B.anim` had two readers - the floorbox partway down paintBreak and

           animation was correct; nothing reached it.

           Asserted on the live DOM because a running animation is the thing in
           question: getAnimations() on a detached node reports nothing, which
           would have passed for exactly the wrong reason.

           READ THE DENOMINATOR: this checks that a swing arms the hammer and
           puts the burst where the hammer is. It says nothing about how the
           swing looks or how long it takes. */
    var swSetup = function(a,b,c){
      var so = {kind:'poly',a:a,b:b,c:c,layer:5,id:'sw'+a+b+c};
      MF.state.cart=[so]; MF.state.selected=so; MF.state.anvil=null; MF.state.rockpile=[];
      MF.paintMine();
      /* THE BENCH IS IN THE WORK BAND NOW, not the middle column. This probe

      var m2 = MF._mine.work, nm2 = MF.ASSAY[MF.assayOf(so)].name;

    /* THE BOXES ARE NOT ON THE BENCH ANY MORE (§26). Clicking the ore on the

    var swHit = function(m2, xs, ks){

     ['a swing that glances off',       3,22,24, '1','5']

      chk('swing');

      chk('swing');

      var finished = MF.state.anvil.floor.every(function(pc){ return MF.isNative(pc.ore); });

      if(finished && !(rk && rk.classList.contains('shatter')))

      chk('swing');

    });
    /* THE ORDER THE THREE THINGS PAINT IN.

       USER, 2026-09-05: "On the breaking floor, the hammer animation needs to

    chk('swing');
    (function(){

    chk('swing');

    MF.paintMine();
    if(MF._mine.work.querySelector('.anvilstage[data-anim]'))
      errs.push('CONTROL: the swing check cannot see an anvil that was never armed');

    /* A LUMP IN THE CART IS NOT A BUTTON ANY MORE - IT IS THE DROP TARGET.

    var kRng = makeRng(4242);

    if(kl && kl2){
      MF.state.cart = [kl, kl2]; MF.state.selected = kl; MF.state.anvil = null;
      MF.paintMine();

      chk('knock');
      if(!lumpEl){ errs.push('knock: the cart drew no lump at all'); }
      else {
        var cellEl = lumpEl.parentElement;
        var goBtn = cellEl && cellEl.querySelector('.lumproute .lumpgo');
        chk('knock');
        if(!goBtn){ errs.push('knock: the cart lump has no control to send it anywhere'); }
        else {

  MF._mine = kSaved.mine; MF.state.layer = kSaved.layer; MF.state.face = kSaved.face;
  MF.state.faceLayer = kSaved.fl; MF.state.inspecting = kSaved.insp; MF.state.cart = kSaved.cart;
  MF.state.selected = kSaved.sel; MF.state.anvil = kSaved.anvil; MF.state.breaking = kSaved.brk;
  MF.state.scan = kSaved.scan; MF.state.rockpile = kSaved.heap;


  /* 5j. THE SCHEMAS. Every instrument is now a named method, and a method has
         two ways of being wrong that prose cannot catch:

         it can DO THE STUDENT'S WORK - naming every factor of the lump, which
         is the rule the user set out ("help realize part of the factor not all
         the factor") and which the sheet group only enforces for the Lantern;

         and its PRACTICE can be a lie - a worked example whose stated answer
         does not actually come out of the lump it is attached to. That one is
         checked against MF.breakOff, the same engine the anvil swings through,
         because a practice that judged itself could agree with itself while
         both were wrong.

         READ THE DENOMINATOR: seven methods over the same seven ore shapes the
         sheet group sweeps, plus one practice each. It says nothing about
         whether a method is well WORDED or whether the steps are in a helpful
         order - no check on this page can see that. */
  var scSchemaOres = [{kind:'number',n:60},{kind:'number',n:31},{kind:'poly',a:1,b:-5,c:6},
                      {kind:'poly',a:0,b:6,c:15},{kind:'poly',a:6,b:7,c:-3},
                      {kind:'poly',a:1,b:0,c:4},{kind:'poly',a:0,b:1,c:3}];

  /* every tool has a method, and every method has a tool. A tool whose schema
     was never written would render an empty panel and say nothing about it. */
  Object.keys(MF.TOOLS).forEach(function(k){
    chk('schema');
    if(!MF.SCHEMA[k]) errs.push('schema: ' + k + ' is a tool with no method behind it');
  });
  Object.keys(MF.SCHEMA).forEach(function(k){
    chk('schema');
    if(!MF.TOOLS[k]) errs.push('schema: there is a method for "' + k + '", which is not a tool');
  });

  /* HOW MANY OF A LUMP'S OWN FACTORS DOES A METHOD PRINT? More than one is the
     method doing the work the student came to do. */
  var scNamed = function(fn, ore){
    var h = document.createElement('div');
    try { fn(h, ore); } catch(e){ return {err:e.message}; }
    var txt = (h.textContent||'').replace(/\s+/g,' ');
    if(ore.kind !== 'poly') return {n:0};
    var res = MF.smeltPoly(ore.a, ore.b, ore.c);

  /* AND THE SUPPORTED OPTION MUST NOT SIT IN THE SAME SLOT EVERY TIME.

    return {wheels: w ? Math.round(w.getBoundingClientRect().height * 100) / 100 : null,
            rail:   r ? Math.round(r.getBoundingClientRect().height * 100) / 100 : null};
  }
  [6,5,4,3,2,1].forEach(function(n){
    chk('cartdraw');
    var got;
    try { got = cdChrome(n); }
    catch(e){ errs.push('cartdraw: the mine threw with ' + n + ' lumps in the cart: ' + e.message); return; }
    if(got.wheels === null || got.rail === null){
      errs.push('cartdraw: with ' + n + ' lumps the cart has no wheels or no track drawn under it');
      return;
    }
    cdSeen[n] = got;
    var first = cdSeen[6];
    if(!first) return;
    /* TWO ASSERTIONS, AND THE SECOND ONE WAS MISSING.
       This compared each cart size against the six-lump reading, which catches
       a rail that BREATHES - the reported symptom. It cannot catch a rail that
       is crushed the SAME amount at every size, and adding the belt to the
       cart made exactly that possible: at 380px the column is over budget with
       one lump in it, so the fault flattened the track to 0px throughout and
       both the check and its own control saw a perfectly consistent nothing.
       "Consistent" was standing in for "correct", and the proxy fails whenever
       the fault is uniform. The drawn height is asserted too now. */
    [['wheels','the wheels under the cart', 21],
     ['rail','the track under the wheels', 5.5]].forEach(function(part){
      chk('cartdraw');

        errs.push('cartdraw: ' + part[1] + ' is ' + got[part[0]] + 'px with ' + n +
          ' lump' + (n===1?'':'s') + ' in it — it is drawn at ' + part[2] +
          'px and something is squeezing it flat');
      chk('cartdraw');
      if(Math.abs(got[part[0]] - first[part[0]]) > 0.5)
        errs.push('cartdraw: ' + part[1] + ' measures ' + got[part[0]] + 'px with ' + n +
          ' lump' + (n===1?'':'s') + ' in it and ' + first[part[0]] +

    });
  });
  /* CONTROL: flatten the track and watch the drawn-height assertion catch it.

     THE ORIGINAL FAULT IS NOW ARCHITECTURALLY IMPOSSIBLE, and saying so is the
     point of this note. The rail used to be squeezed because the cart lived in
     a column with a 430px cap; the cart is its own full-width band with no cap
     (§22), so nothing can compress it and `flex:0 1 auto` no longer changes a
     pixel. A control that cannot introduce its fault proves nothing, so it
     injects one that IS possible - a track drawn at no height at all - and the
     group keeps guarding the property that still matters: the cart is drawn
     the same whatever is in it, at the size it is designed at. */
  chk('cartdraw');
  var cdCtl = document.createElement('style');
  cdCtl.textContent = '.cartrail{height:0 !important; min-height:0 !important}';
  document.head.appendChild(cdCtl);
  var cdA = cdChrome(6), cdB = cdChrome(1);
  document.head.removeChild(cdCtl);
  if(cdA.rail >= 5.5 || cdB.rail >= 5.5)
    errs.push('CONTROL: a track drawn at no height is still reported as its designed 5.5px');
  document.body.removeChild(cdStage);
  MF._mine = cdSaved.mine; MF.state.cart = cdSaved.cart; MF.state.selected = cdSaved.sel;
  MF.state.anvil = cdSaved.bench; MF.state.layer = cdSaved.layer;
  MF.state.face = cdSaved.face; MF.state.faceLayer = cdSaved.fl;


  /* 5n. REACH: THE WORK MUST FIT ON ONE SCREEN.

         The user's requirement, and it is a design constraint with a
         measurable form: "creating less hurdles in our UI design for students
         that will easily give up on a site that makes them scroll or click too
         many unnecessary buttons."

         §57 is the reason this is a GROUP and not a sentence. `SITE-STATE` had
         asserted "no horizontal page scroll" for weeks while the page scrolled
         155px sideways, because the claim was made by hand once and could
         never be re-run. Reach rots the same way: every panel added between
         two controls pushes them apart by exactly as much as nobody measured.

         TWO CLUSTERS, each mounted at a real width, each measured from its
         first control to its last:

           the bench  - the belt, the piece under the pick, and the swing
           the forge  - the target, the slots, the rack, and the pour

         READ THE DENOMINATOR: two clusters, two widths, one budget. It says
         nothing about the surface, the workshops or the yard; nothing about
         whether a control that fits is one a student will FIND; and nothing
         about the vertical run of the page as a whole - only about the
         distance between the first and last thing in one piece of work. */
  /* SAME HAZARD AS THE LAYOUT GROUP, and it bit the same way: this set the
     STAGE to 1280px and 380px while @media keyed off the WINDOW, so it measured
     a wide forge crushed into 380px - a layout no student can produce - and
     called the result a reach failure. It measures at the live viewport now,
     against the height of the screen actually in front of the tester, and it
     reports both. A budget of 800 was a guess about somebody else's monitor. */
  var rcW = document.documentElement.clientWidth;
  var rcBudget = Math.max(520, window.innerHeight);
  var rcStage = document.createElement('div');
  rcStage.style.cssText = 'position:fixed; left:-13000px; top:0; overflow:visible';
  document.body.appendChild(rcStage);
  var rcSaved = {mine:MF._mine, forge:MF._forge, tools:MF.state.tools, cart:MF.state.cart,
                 sel:MF.state.selected, anvil:MF.state.anvil, layer:MF.state.layer,
                 face:MF.state.face, fl:MF.state.faceLayer, yard:MF.state.yard,
                 forgeSt:MF.state.forge, heap:MF.state.rockpile};

  var rcSpan = function(root, fromSel, toSel){
    var a = root.querySelector(fromSel), b = root.querySelector(toSel);
    if(!a || !b) return {missing:(!a ? fromSel : toSel)};
    var ab = a.getBoundingClientRect(), bb = b.getBoundingClientRect();
    return {px: Math.round(bb.bottom - ab.top), from:a, to:b};
  };

  [rcW].forEach(function(w){
    rcStage.style.width = w + 'px';

    /* ---- the bench: belt -> pieces -> swing ---- */
    chk('reach');
    rcStage.innerHTML = '';
    var rcMine = document.createElement('div');
    rcStage.appendChild(rcMine);
    MF.state.tools = {lantern:{forged:true}, drill:{forged:true}, auger:{forged:true}};
    var rcLump = {kind:'poly', a:6, b:7, c:-3, id:'reach'};
    MF.state.cart = [rcLump]; MF.state.selected = rcLump;
    MF.state.anvil = MF.anvilInit(rcLump); MF.state.anvil.step = 'break';
    MF.state.layer = 5; MF.state.face = []; MF.state.faceLayer = null;
    MF._mine = null;
    try { MF.SCREENS.mine(rcMine); MF.paintMine(); }
    catch(e){ errs.push('reach: the mine threw while being measured: ' + e.message); return; }
    /* THE FLOOR'S BELT, NOT THE CART'S. There are two now (§20) - one in the
       cart, where a lump first lands, and one on the breaking floor. A bare
       '.beltstrap' took the first in the DOM, which is the cart's, and
       reported the bench as 1748px from belt to swing: a true measurement of
       two things that were never meant to be on one screen together. What this
       group is about is the belt you reach for WHILE SWINGING. */
    /* AND THE FAR END OF THE CLUSTER IS THE STONE, NOT A BUTTON (§26).
       The swing button is in the hammer panel now, which is a fixed dialog
       centred on the viewport - the distance to it is not a property of the
       bench and measuring it would report a pass no matter how long the bench
       got. What a student has to see at once is what they are HOLDING and what
       they are HITTING: the belt, and the ore on the anvil. */
    var rcB = rcSpan(rcMine, '.floorbox .beltstrap', '.floorbox .anvilore');
    if(rcB.missing) errs.push('reach: the bench has no ' + rcB.missing + ' to measure at ' + w + 'px');
    else if(rcB.px > rcBudget)
      errs.push('reach: at ' + w + 'px the bench runs ' + rcB.px + 'px from the belt to the ore on the anvil — ' +
                (rcB.px - rcBudget) + 'px more than one ' + rcBudget + 'px screen, so a student cannot see ' +
                'what they are holding and what they are hitting at the same time');
    /* THE BELT HANGS OVER THE ANVIL, which is the user's own words for it
       (2026-09-04) and the reason it moved: an instrument is something you
       reach up for and bring down onto the work. Under the anvil it was a rack
       between the stone and the ground the pieces land on. */
    chk('reach');
    var rcBelt = rcMine.querySelector('.floorbox .beltstrap'),
        rcAnv = rcMine.querySelector('.floorbox .anvilstage');
    if(rcBelt && rcAnv && rcBelt.getBoundingClientRect().top > rcAnv.getBoundingClientRect().top)
      errs.push('reach: the belt has gone back under the anvil — it hangs above the work, ' +
                'so a hand goes up to it and comes down onto the stone');
    /* AND THE QUESTION MUST FIT IN ITS OWN PANEL. The swing lives in a dialog
       now; the dialog is capped at 88vh and scrolls, so a panel that outgrows
       it puts the button that answers the question below the fold of a box
       that does not look like it scrolls. Measured as content against box,
       because the box's own height can never exceed the cap. */
    chk('reach');
    (function(){
      var ao = rcMine.querySelector('.floorbox .anvilore');
      if(!ao){ errs.push('reach: there is no ore on the anvil to open the hammer with'); return; }
      ao.dispatchEvent(new MouseEvent('click',{bubbles:true}));
      var sh = document.querySelector('.scrim .toolsheet');
      if(!sh){ errs.push('reach: clicking the ore on the anvil opened no hammer panel'); return; }
      if(!sh.querySelector('.swingbtn'))
        errs.push('reach: the hammer panel opened with no swing in it');
      else if(sh.scrollHeight > sh.clientHeight + 2)
        errs.push('reach: at ' + w + 'px the hammer panel holds ' + sh.scrollHeight + 'px of question in a ' +
                  sh.clientHeight + 'px box — the swing button is below the fold of a dialog');
      MF.closeTool();
    })();

    /* ---- the forge: target -> slots -> rack -> pour ---- */
    chk('reach');
    rcStage.innerHTML = '';
    var rcForge = document.createElement('div');
    rcStage.appendChild(rcForge);
    MF.state.yard = {}; MF.state.rockpile = [];
    [{m:0,k:2},{m:0,k:3},{m:0,k:5}].forEach(function(g){ MF.addToYard(g); });
    MF.state.forge = {picked:'lantern', slots:[], result:null};
    try { MF.SCREENS.forge(rcForge); }
    catch(e){ errs.push('reach: the forge threw while being measured: ' + e.message); return; }
    var rcF = rcSpan(rcForge, '.castfor', '.pourbtn');
    if(rcF.missing) errs.push('reach: the craft floor has no ' + rcF.missing + ' to measure at ' + w + 'px');
    else if(rcF.px > rcBudget)
      errs.push('reach: at ' + w + 'px the craft floor runs ' + rcF.px + 'px from the target to the pour — ' +
                (rcF.px - rcBudget) + 'px more than one ' + rcBudget + 'px screen');

    /* THE RACK MUST BE BETWEEN THE SLOTS AND THE POUR, and all three inside the
       craft panel. A rack in a sibling panel above is the layout this replaced. */
    chk('reach');
    var craft = rcForge.querySelector('.craft');
    var rcRack = craft && craft.querySelector('.shelfrow');
    var rcCru = craft && craft.querySelector('.crucible');
    var rcPour = craft && craft.querySelector('.pourbtn');
    if(!rcRack || !rcCru || !rcPour){
      errs.push('reach: the craft floor is missing ' +
        (!rcCru ? 'its slots' : (!rcRack ? 'the rack' : 'the pour button')) + ' — they must be one cluster');
    } else {
      var yC = rcCru.getBoundingClientRect().bottom,
          yR = rcRack.getBoundingClientRect().top,
          yP = rcPour.getBoundingClientRect().top;
      if(!(yR >= yC - 1 && yP >= yR - 1))
        errs.push('reach: the craft floor is out of order — slots, then the rack, then the pour');
    }

    /* THE DROP THAT FILLS THE MOLD MUST HAND FOCUS TO THE POUR. This is the
       whole point of arming it: the next thing to do is the next thing your
       hands are already on, with no hunting and no scroll. It shipped broken
       once already - focus() was called on the panel before it was mounted, so
       it did nothing and said nothing, which is the silent-failure class §35
       is about. */
    chk('reach');
    if(rcRack && rcPour){
      var rcMetals = rcRack.querySelectorAll('.metalbtn:not(.spent)');
      var rcWant = MF.slotsWanted(MF.TOOLS.lantern);
      if(rcMetals.length >= rcWant){
        for(var rcI=0; rcI<rcWant; rcI++){
          var rcNext = rcForge.querySelector('.craft .metalbtn:not(.spent)');
          if(rcNext) rcNext.click();
        }
        var rcNowPour = rcForge.querySelector('.craft .pourbtn');
        if(!rcNowPour || rcNowPour.disabled)
          errs.push('reach: filling every slot did not arm the pour button');
        else if(document.activeElement !== rcNowPour)
          errs.push('reach: the metal that filled the mold did not hand focus to the pour button — ' +
                    'a student has to go and find it');
      }
    }
  });

  /* CONTROL 1: the bench cluster must overflow if the belt and the stone are
     pushed a screen apart */
  chk('reach');
  rcStage.style.width = '1280px';
  rcStage.innerHTML = '';
  var rcCtl = document.createElement('div');
  rcStage.appendChild(rcCtl);
  var rcTall = document.createElement('div');
  rcTall.style.cssText = 'height:900px';
  rcCtl.appendChild(H('div','beltstrap','belt'));
  rcCtl.appendChild(rcTall);
  rcCtl.appendChild(H('div','anvilore','ore'));
  var rcCheck = rcSpan(rcCtl, '.beltstrap', '.anvilore');
  if(rcCheck.missing || rcCheck.px <= rcBudget)
    errs.push('CONTROL: the reach check cannot see a cluster taller than one screen');
  /* CONTROL 3: and a hammer panel whose content runs past the bottom of it */
  chk('reach');
  MF.state.selected = {kind:'poly', a:6, b:7, c:-3, id:'reach-ctl'};
  MF.state.anvil = MF.anvilInit(MF.state.selected);
  MF.openHammer(MF.state.anvil, null);
  var rcSheet = document.querySelector('.scrim .toolsheet');
  if(!rcSheet){
    errs.push('CONTROL: the hammer panel would not open, so the fits-its-own-box rule measured nothing');
  } else {
    var rcPad = document.createElement('div'); rcPad.style.height = '4000px';
    rcSheet.querySelector('.tsbody').appendChild(rcPad);
    if(!(rcSheet.scrollHeight > rcSheet.clientHeight + 2))
      errs.push('CONTROL: the reach check cannot see a hammer panel whose content runs past the bottom of it');
  }
  MF.closeTool();
  /* CONTROL 2: an out-of-order craft floor must be caught */
  chk('reach');
  rcStage.innerHTML = '';
  var rcOrd = document.createElement('div');
  rcStage.appendChild(rcOrd);
  rcOrd.innerHTML = '<div class="craft"><div class="shelfrow">rack</div>' +
                    '<div class="crucible">slots</div><button class="pourbtn">pour</button></div>';
  var oC = rcOrd.querySelector('.crucible').getBoundingClientRect().bottom,
      oR = rcOrd.querySelector('.shelfrow').getBoundingClientRect().top;
  if(oR >= oC - 1)
    errs.push('CONTROL: the reach check cannot see a rack sitting above the slots');

  document.body.removeChild(rcStage);
  MF._mine = rcSaved.mine; MF._forge = rcSaved.forge; MF.state.tools = rcSaved.tools;
  MF.state.cart = rcSaved.cart; MF.state.selected = rcSaved.sel; MF.state.anvil = rcSaved.anvil;
  MF.state.layer = rcSaved.layer; MF.state.face = rcSaved.face; MF.state.faceLayer = rcSaved.fl;
  MF.state.yard = rcSaved.yard; MF.state.forge = rcSaved.forgeSt; MF.state.rockpile = rcSaved.heap;


  /* 5n. THE TOOLS MUST DRAW, AND MUST LEAVE A HOLE.

         The instruments were correct and unreadable: a method name, a
         paragraph of reasoning and a numbered list of sentences. Nothing in
         the build could see that, because every group measured whether a
         reading was TRUE and none measured whether it was a PICTURE. The user
         could see it immediately - "mostly text with no diagrams and not
         enough number information" - which is the signature of a property
         nobody asserted.

         Three things are asserted per reading, on a lump that actually
         factors:

         - it DRAWS. At least one <svg> in the panel.
         - it LEAVES A HOLE. At least one `.qm` - the user's rule, "at least
           one number needs to be a ?", and the same rule the `schema` group
           enforces from the other side, since on a monic trinomial the two
           sides of the X are the two bracket constants and filling both in
           would be printing the whole factorisation.
         - it is NOT MOSTLY PROSE. The visible text outside the diagram and the
           worked lines has a budget, so a diagram bolted onto four paragraphs
           does not pass.

         READ THE DENOMINATOR: five instruments that read a trinomial, over two
         lumps. It says nothing about whether a diagram is LEGIBLE, whether the
         redacted number is the interesting one, or whether the X is drawn the
         way a particular teacher draws it. Those are human readings and none
         of them has happened. */
  var vsOres = [{kind:'poly',a:1,b:-5,c:6}, {kind:'poly',a:6,b:7,c:-3}];
  var vsTools = ['drill','shifter','auger','lantern','steel'];
  var vsRead = function(tk, ore){
    var h = document.createElement('div');
    vsStage.appendChild(h);
    try { MF.TOOL_READ[tk](h, ore, null); } catch(e){ vsStage.removeChild(h); return {err:e.message}; }
    var prose = 0;
    /* every paragraph-ish node that is NOT inside a diagram or a worked line */
    h.querySelectorAll('p, .hint, .swhy, .sact, .sm, .big').forEach(function(n){
      if(n.closest('.xwrap') || n.closest('.wline') || n.closest('.stage')) return;
      prose += (n.textContent||'').trim().length;
    });
    var out = {svg:h.querySelectorAll('svg').length, qm:h.querySelectorAll('.qm').length,
               prose:prose, all:(h.textContent||'').trim().length};
    vsStage.removeChild(h);
    return out;
  };
  var vsStage = document.createElement('div');
  vsStage.style.cssText = 'position:fixed; left:-11000px; top:0; width:560px';
  document.body.appendChild(vsStage);
  var vsSaved = MF.state.anvil;
  MF.state.anvil = null;                 /* paintNameSide needs no bench here */

  vsTools.forEach(function(tk){
    vsOres.forEach(function(ore){
      var g = vsRead(tk, ore);
      chk('visual');
      if(g.err){ errs.push('visual: ' + tk + ' threw on ' + MF.oreText(ore) + ': ' + g.err); return; }
      if(!g.svg)
        errs.push('visual: ' + tk + ' held to ' + MF.oreText(ore) + ' drew nothing — it is a wall of text');
      chk('visual');
      if(!g.qm)
        errs.push('visual: ' + tk + ' held to ' + MF.oreText(ore) + ' left no ? — it either does the work or asks nothing');
      chk('visual');
      if(g.prose > 620)
        errs.push('visual: ' + tk + ' held to ' + MF.oreText(ore) + ' is ' + g.prose +
                  ' characters of prose outside its diagrams — the picture is not the panel');
    });
  });
  /* CONTROL 1: a reading that draws nothing must be caught */
  chk('visual');
  var vsNoDraw = (function(){
    var h = document.createElement('div');
    h.appendChild(H('p','hint','A long enough sentence about the rock to look like a real reading, with no picture in it at all.'));
    return {svg:h.querySelectorAll('svg').length, qm:h.querySelectorAll('.qm').length};
  })();
  if(vsNoDraw.svg || vsNoDraw.qm)
    errs.push('CONTROL: the visual check cannot tell a drawing from a paragraph');
  /* CONTROL 2: a reading with every number filled in must be caught */
  chk('visual');
  var vsFilled = document.createElement('div');
  vsStage.appendChild(vsFilled);
  MF.xDiagram(vsFilled, {top:'-18', bottom:'7', left:'-2', right:'9'});
  if(vsFilled.querySelectorAll('.qm').length)
    errs.push('CONTROL: an X with all four cells given still reports a redaction');
  vsStage.removeChild(vsFilled);
  /* CONTROL 3: and an X with an open cell must report one */
  chk('visual');
  var vsOpen = document.createElement('div');
  vsStage.appendChild(vsOpen);
  MF.xDiagram(vsOpen, {top:'-18', bottom:'7', left:'-2', right:null});
  if(!vsOpen.querySelectorAll('.qm').length)
    errs.push('CONTROL: an X with an open cell does not draw a ? — the redaction is invisible to the check');
  vsStage.removeChild(vsOpen);

  /* THE X ITSELF MUST BE TRUE. Its two sides multiply to the top and add to
     the bottom, checked against the engine's own factorisation rather than
     against the arithmetic that drew it. */
  var vsX = [[1,-5,6],[6,7,-3],[2,10,12],[1,8,16],[3,-2,-8]];
  vsX.forEach(function(t){
    chk('visual');
    var pr = MF.xPair({kind:'poly',a:t[0],b:t[1],c:t[2]});
    if(!pr){ errs.push('visual: the X cannot be filled for ' + quadText(t[0],t[1],t[2]) + ', which does factor'); return; }
    if(pr.p * pr.q !== pr.ac || pr.p + pr.q !== pr.b)
      errs.push('visual: the X for ' + quadText(t[0],t[1],t[2]) + ' claims ' + pr.p + ' and ' + pr.q +
                ' multiply to ' + pr.ac + ' and add to ' + pr.b + ', and they do not');
  });
  /* CONTROL: a pair nudged by one must break the X's own arithmetic */
  chk('visual');
  var vsP = MF.xPair({kind:'poly',a:6,b:7,c:-3});
  if(vsP && (vsP.p + 1) * vsP.q === vsP.ac)
    errs.push('CONTROL: the X arithmetic check cannot see a wrong pair');

  document.body.removeChild(vsStage);
  MF.state.anvil = vsSaved;

  /* 6. NOTHING ON SCREEN MAY HAVE A CEILING, A PERCENTAGE, OR A COMPARISON.
        This is a stated requirement, so it is checked mechanically rather
        than trusted (philosophy 2.5a). */
  var banned = /(\d+\s*(?:%|percent))|(\b\d+\s*(?:out of|\/)\s*\d+\b)|\b(score|scored|grade|graded|accuracy|rank|ranked|leaderboard|streak|correct answers)\b/i;
  /* ENUMERATED FROM THE REGISTRY, NOT WRITTEN OUT. The list used to be five
     names typed by hand, so the three workshop pages added to the Casting
     Shed would have been outside this sweep from the moment they existed and
     nothing would have said so. A screen that exists is a screen a student
     can reach; the `screens` group already enumerates for the same reason. */
  Object.keys(MF.SCREENS).forEach(function(name){
    chk('nogrades');
    var probe = document.createElement('div');
    try { MF.SCREENS[name](probe); } catch(e){ errs.push('nogrades: screen '+name+' threw: '+e.message); return; }
    var txt = probe.textContent || '';
    var m = txt.match(banned);
    if(m) errs.push('nogrades: screen "'+name+'" contains "'+m[0]+'"');
  });

  /* 7. CONTROL - must fail, or none of the above is looking at anything */
  chk('control');
  var controlFailed = !(MF.smeltPoly(1,-5,6).kind === 'twin');   /* it is 'plain' */
  var bannedControl = banned.test('you scored 7 out of 10');      /* must be caught */
  if(!controlFailed)  errs.push('CONTROL: seam control did not fail - the instrument is not measuring');
  if(!bannedControl)  errs.push('CONTROL: the no-grades regex does not catch "7 out of 10"');

  /* hand the page back exactly as it was found */
  MF._mine = _liveMine;
  chk('selfharm');
  /* only meaningful ON the mine: elsewhere MF._mine legitimately refers to a
     screen that has been replaced, and paintMine guards for that. Asserting it
     unconditionally made the check fire on a perfectly normal state, which is
     how a check teaches you to ignore it. */
  if(_liveScreen === 'mine' && MF._mine && MF._mine.mid && !MF._mine.mid.isConnected)
    errs.push('selfharm: validate() left the live mine columns detached - the bench would render into a dead DOM and every click would silently do nothing');
  chk('selfharm');
  if(MF.state.screen !== _liveScreen)
    errs.push('selfharm: validate() changed which screen the student is on (' + _liveScreen + ' -> ' + MF.state.screen + ')');

  var out = {checked:checked, byGroup:counts, errors:errs.length,
             control: (controlFailed && bannedControl) ? 'both controls failed as required' : 'A CONTROL DID NOT FAIL',
             detail: errs.slice(0,20)};
  console.log('[mine] validate:', out.checked, 'checks,', out.errors, 'errors, control:', out.control);
  if(errs.length) console.warn(errs.slice(0,20));
  return out;
};

/* MF.playthrough() - drives a whole lump end to end without a human, so the
   loop itself is covered rather than only its parts. Reports its denominator. */
MF.playthrough = function(layer){
  layer = layer || 4;
  var log = [], rng = makeRng(99);
  MF.go('mine');
  var ore = MF.digOre(layer, rng);
  MF.state.cart.push(ore); MF.state.selected = ore; MF.state.anvil = null;
  MF.paintMine();
  var B = MF.state.anvil = MF.anvilInit(ore);
  log.push('ore: ' + MF.oreText(ore));
  var kind = MF.assayOf(ore);
  B.step = 'break'; log.push('called it: ' + kind + ' (optional now — the bench opens on the hammer)');

  /* SWING UNTIL NOTHING ON THE FLOOR CAN BE BROKEN. Each swing names one
     factor from the engine and drives it through the real UI path, so what is
     covered is the loop a student walks rather than the arithmetic alone. */
  var swings = 0, glances = 0;
  while(swings < 20){
    var at = -1;
    for(var i=0;i<B.floor.length;i++){ if(!MF.isNative(B.floor[i].ore)){ at=i; break; } }
    if(at < 0) break;
    var pc = B.floor[at].ore, one = null;
    if(pc.kind==='number') one = {m:0, k:primeFactors(pc.n)[0]};
    else {
      var pr = MF.smeltPoly(pc.a,pc.b,pc.c);
      one = (pr.ingots||[]).filter(function(g){
        return !(g.m===0&&g.k===0) && !(g.m===0&&Math.abs(g.k)===1); })[0];
    }
    if(!one){ log.push('nothing named for ' + MF.oreText(pc)); break; }
    B.at = at;
    B.raw = {m:String(one.m), k:String(one.k)};
    B.rawFor = B.floor[at].id;
    var before = B.floor.length;
    MF.swing(B);
    swings++;
    if(B.floor.length === before){ glances++; log.push('glanced off ' + MF.oreText(pc) + ' with ' + ingotText(one)); break; }
    log.push('swung ' + ingotText(one) + ' at ' + MF.oreText(pc) + ' -> ' +
             B.floor.map(function(p){ return MF.oreText(p.ore); }).join(' · '));
  }

  var floor = B.floor.map(function(p){ return p.ore; });
  var allNative = floor.every(MF.isNative);
  /* the pieces must still be the lump that was dug - the mine's whole claim */
  var acc = {kind:'number', n:1}, blew = false;
  floor.forEach(function(pc2){
    if(blew) return;
    var mm = MF.oreMul(acc, pc2);
    if(mm.overflow){ blew = true; return; }
    acc = MF.asOre(mm.a, mm.b, mm.c);
  });
  var whole = !blew && MF.oreSame(MF.oreMul(acc, {kind:'number',n:1}), ore);
  log.push('floor: ' + floor.map(MF.oreText).join(' · ') + (allNative ? ' - ALL NATIVE' : ' - STILL ROCK'));
  log.push(whole ? 'the pieces rebuild the lump' : 'THE PIECES DO NOT REBUILD THE LUMP');
  MF.paintMine();
  return {ore:MF.oreText(ore), kind:kind, swings:swings, glances:glances,
          native:allNative, whole:whole, log:log, steps:log.length};
};

/* =========================================================================
   BOOT
   ========================================================================= */
MF.boot = function(){
  var motes = MF.ambient();
  q('#hero-art').appendChild(MF.art(46));
  MF.loadScreen();
  MF.go('home');
  console.log('[mine] booted:', MF.LAYERS.length, 'layers,', motes, 'motes');
  return {layers:MF.LAYERS.length, motes:motes};
};
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', MF.boot);
else MF.boot();
</script>
