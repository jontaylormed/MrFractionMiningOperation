   rock pieces on the floor start from. */
.metal.rough{background:linear-gradient(170deg,#7A6650 0%,#5A4B3C 58%,#42382C 100%); color:#FFF3DE}
.metal.rough:before{background:linear-gradient(150deg,#4A3F34,#241D18)}
/* the bin the heap sits in */
.orebin{background:linear-gradient(180deg,#4A3B2C,#2E2620); border:3px solid #241C15;
  border-radius:4px 4px 12px 12px; padding:10px 10px 12px; box-shadow:inset 0 6px 14px rgba(0,0,0,.5)}
.orebin .heap{display:flex; flex-wrap:wrap; align-items:flex-end}
.metal .ct{font-family:var(--body); font-size:11px; opacity:.85}
.metal.pure{background:linear-gradient(160deg,#F2DCA4,#C8A24B); border-color:#8A6A2A; color:#2E2208}
.gear{display:flex; gap:9px; align-items:flex-start; background:#fff; border:2px solid var(--rule);
  border-radius:11px; padding:9px 11px; margin-bottom:7px}
.gear .ic{font-size:20px}
.gear .nm{font-family:var(--display); font-size:14px}
.gear .ds{font-size:12px; color:var(--ink-soft)}
.gear.new{border-color:var(--lamp); background:#FFF9EC}

/* ---- THE BELT: a leather strap with the instruments hanging off it. You
       take them off it to use them, which a list of cards never let you do. ---- */
.beltstrap{position:relative; display:flex; gap:9px; flex-wrap:wrap; align-items:flex-start;
  background:linear-gradient(180deg,#6B4A32 0%,#54371F 46%,#3E2917 100%);
  border:2px solid #2E1E10; border-radius:9px; padding:13px 11px 12px; margin-top:6px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.09), inset 0 -3px 0 rgba(0,0,0,.3)}
/* the stitching along the strap */
.beltstrap:before{content:""; position:absolute; left:6px; right:6px; top:5px; height:0;
  border-top:2px dashed rgba(255,220,170,.32)}
.beltstrap.bare{padding:11px}
.beltempty{font-size:13px; font-style:italic; color:#E8D6BC}
/* the belt hanging on the breaking floor: it sits INSIDE the dark floorbox,
   so its labels are set for that ground rather than for cream */
/* THE BELT CARRIES ITS OWN GROUND. It was styled for the breaking floor's dark
   box and nothing else, so putting the same belt in the CART - a light panel -
   printed its label at 1.85:1, its line at 1.70 and every "how?" at 3.67. A
   component that assumes a background has to bring one, which is §66 in the
   other direction. */
.gearbox.atwork{margin:0 0 11px; background:#241D18; border:2px solid #4A3B2C;
  border-radius:12px; padding:9px 11px 11px}
.gearbox.atwork .beltlab{font-family:var(--display); font-size:10px; letter-spacing:.11em;
  color:var(--lamp); margin-bottom:4px}
.gearbox.atwork .beltnote{font-size:12px; color:#C9B695; margin-top:6px}
.gearbox.atwork .beltstrap{margin-top:0}
.beltloop{position:relative; padding-top:7px}
/* the loop the tool hangs in */
.beltloop:before{content:""; position:absolute; left:50%; top:-6px; width:15px; height:15px; margin-left:-7px;
  border:3px solid #8A6A45; border-radius:50%; background:transparent}
.belttool{display:flex; flex-direction:column; align-items:center; gap:2px; cursor:grab;
  background:linear-gradient(170deg,#4A4038,#2E2620); color:#FFF3DE; border:2px solid #8A6A45;
  border-radius:8px; padding:8px 10px; min-height:44px; min-width:62px; touch-action:none;
  font-family:var(--body)}
/* the instrument in hand, for the click path */
.belttool[data-armed]{border-color:var(--lamp); background:linear-gradient(170deg,#6B5335,#4A3B24);
  box-shadow:0 0 0 3px rgba(232,163,61,.35)}
/* and every rock that will take it */
.lump[data-tooldrop],.piece[data-tooldrop]{outline:3px dashed var(--lamp); outline-offset:3px}
.belttool .bic{font-size:19px; line-height:1}
.belttool .bnm{font-family:var(--display); font-size:10px; letter-spacing:.04em}
.belttool:hover{border-color:var(--lamp); filter:brightness(1.15)}
.belttool:active{cursor:grabbing}
.belttool:focus-visible{outline:3px solid var(--lamp); outline-offset:2px}
.dragghost.tool{background:linear-gradient(170deg,#4A4038,#2E2620)}

/* ---- THE SLOT on a piece of rock ---- */
.piececell{display:flex; flex-direction:column; align-items:center; gap:4px}
/* THE SLOT ONLY EXISTS WHILE AN INSTRUMENT IS ON THE ROCK, and its whole job
   is taking it off again (§23) - so it reads as a thing you dismiss: the
   tool's own icon with a × beside it. */
.toolslot{cursor:pointer; width:100%; min-height:32px; margin-top:5px;
  display:flex; align-items:center; justify-content:center; gap:7px;
  padding:3px 8px; background:#241D18; color:#E4D5BB; border:2px solid #6B5B48;
  border-radius:6px; font-family:var(--display); font-size:13px; line-height:1.3}
.toolslot .sx{font-size:15px; color:var(--lamp)}
.toolslot:hover{border-color:var(--lamp); background:#33291F}
.toolslot .si{display:block}
.toolslot:hover{border-color:var(--lamp); color:#E4D5BB}
.toolslot:focus-visible{outline:3px solid var(--lamp); outline-offset:2px}
/* something is in it: the slot is lit and solid, not dashed and empty */
.toolslot.filled{border-style:solid; border-color:var(--lamp); background:#3A2E1C; color:#FFE9C4;
  box-shadow:0 0 9px rgba(232,163,61,.45)}
/* a tool is in the air and this is somewhere it can go */
.piece[data-tooldrop=open]{outline:2px dashed rgba(232,163,61,.7); outline-offset:2px}
.piece[data-tooldrop=hot]{outline:3px solid #8FE0C0; outline-offset:2px}

/* ---- THE INSTRUMENT PANEL. A real dialog: traps Tab, closes on Escape,
       hands focus back to the slot it came from. ---- */
@keyframes scrimin{from{opacity:0}to{opacity:1}}
@keyframes sheetrise{from{transform:translateY(16px)}to{transform:translateY(0)}}
.scrim{position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center;
  padding:18px; background:rgba(20,15,11,.72); animation:scrimin 160ms ease-out 1}
.toolsheet{width:min(560px,100%); max-height:88vh; overflow-y:auto; background:var(--paper);
  border:3px solid var(--rock-3); border-radius:15px; box-shadow:0 18px 44px rgba(0,0,0,.5);
  animation:sheetrise 220ms cubic-bezier(.2,.8,.3,1) 1}
.toolsheet:focus{outline:none}
@media (prefers-reduced-motion:reduce){ .scrim,.toolsheet{animation:none} }
.tshead{display:flex; gap:11px; align-items:center; padding:13px 15px;
  background:linear-gradient(180deg,var(--rock-2),var(--rock)); border-radius:12px 12px 0 0; color:#FFF3DE}
.tshead .ic{font-size:26px; line-height:1}
.tshead .tsname{font-family:var(--display); font-size:19px; color:#FFE9C4}
.tshead .tsore{font-size:13px; color:#E4D5BB}
.tsclose{margin-left:auto; font-family:var(--body); font-size:13px; padding:9px 13px; min-height:44px;
  cursor:pointer; border-radius:8px; border:2px solid #8A6A45; background:#241D18; color:#F0E2C8}
.tsclose:hover{border-color:var(--lamp); color:#FFF3DE}
.tsbody{padding:15px}
.tsfoot{padding:0 15px 14px}
/* the lantern's reading, which is the one a student sees most */
.lampread{border-radius:11px; padding:14px 16px; border:3px solid}
.lampread .big{font-family:var(--display); font-size:clamp(19px,3.2vw,25px); line-height:1.15}
.lampread .sm{font-size:15px; margin-top:5px}
.lampread.seamed{border-color:var(--lamp); background:#FFF6E3; color:#4A3410}
.lampread.clear{border-color:var(--vein); background:#F1F8F5; color:#123F35}
.pickrow{display:flex; gap:9px; flex-wrap:wrap}
.pickbtn{display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
  background:#fff; border:2px solid var(--tan); border-radius:11px; padding:11px 13px; min-height:44px;
  font-family:var(--body); color:var(--ink)}
.pickbtn .ic{font-size:21px}
.pickbtn .nm{font-family:var(--display); font-size:13px}
.pickbtn:hover{border-color:var(--ore); background:#FFF6EA}

/* =========================================================================
   THE SCHEMAS. A method drawn as a numbered method, with the steps that are
   still the student's marked as open rather than merely unfilled - an open
   step and a finished step that look alike is a list nobody reads twice.
   ========================================================================= */
.schema{background:#FFFCF6; border:2px solid var(--tan); border-left:6px solid var(--ore);
  border-radius:0 12px 12px 0; padding:13px 16px; margin:13px 0}
.schema .slab{font-family:var(--display); font-size:11px; letter-spacing:.12em; color:var(--ore-t)}
.schema .snm{font-family:var(--display); font-size:clamp(18px,2.7vw,22px); line-height:1.2; color:var(--ink); margin:1px 0 5px}
.schema .swhy{font-size:15px; color:var(--ink-soft); max-width:66ch}
ol.ssteps{margin:11px 0 0; padding-left:22px}
ol.ssteps li{margin-bottom:10px; padding-left:4px}
ol.ssteps li::marker{font-family:var(--display); color:var(--ore-t)}
ol.ssteps li.open::marker{color:var(--vein)}
.ssteps .sact{font-size:15px; color:var(--ink)}
.ssteps .sshow{font-family:var(--display); font-size:clamp(16px,2.3vw,20px); color:var(--ink);
  background:#fff; border:2px solid var(--rule); border-radius:9px; padding:6px 11px;
  margin-top:5px; display:inline-block; max-width:100%; overflow-x:auto}
/* an open step is the student's, and it says so in the colour the mine uses
   for a seam that has not been driven yet */
.ssteps li.open{border-left:4px dashed var(--vein); margin-left:-14px; padding-left:14px}
.ssteps li.open .sact{color:var(--vein)}
.schema .sfoot{font-size:13px; color:var(--ink-soft); margin-top:9px; font-style:italic}
/* THE ?. It is the one mark on this page that means "and this part is yours",
   so it is the same shape everywhere it appears. */
.qm{font-family:var(--display); font-size:1.12em; color:var(--vein); background:#E8F2EE;
  border:2px dashed var(--vein-lite); border-radius:7px; padding:0 .34em; display:inline-block}

/* the lantern's one lit side */
.onesided{background:#FFF6E3; border:3px solid var(--lamp); border-radius:12px; padding:12px 15px; margin:12px 0}
.onesided .oslab{font-family:var(--display); font-size:11px; letter-spacing:.11em; color:#7F570B}
.onesided .eq{margin:3px 0 4px; color:#4A3410; overflow-x:auto}
.onesided .hint{color:#5A4B2A}

/* naming the other side, and taking it to the anvil. The panel does NOT judge
   it - the button cuts the hammer and the rock answers. */
.nameside{background:#241D18; border:2px dashed #6B5B48; border-radius:12px; padding:12px 14px; margin:13px 0; color:#E4D5BB}
.nameside .nslab{font-family:var(--display); font-size:11px; letter-spacing:.1em; color:var(--lamp)}
.nameside .nshint{font-size:14px; color:#C9B695; margin:2px 0 9px; max-width:60ch}
.nsrow{display:flex; align-items:center; gap:11px; flex-wrap:wrap}
.nssay{margin-top:8px}
.nssay .hint{color:#C9B695}

/* =========================================================================
   THE GUIDED LESSON on the Casting Shed's working floor. It is not in the
   forge any more (MINE-SPEC §29) and it is not an essay: the method is walked
   a step at a time on one preselected lump, and the lump is drawn.
   ========================================================================= */
.lesson{background:var(--paper); border:3px solid var(--tan); border-radius:14px; padding:15px 17px; margin:14px 0}
.lesson .lslab{font-family:var(--display); font-size:11px; letter-spacing:.12em; color:var(--ore-t)}
.lesson .lsnm{font-family:var(--display); font-size:clamp(19px,3vw,24px); line-height:1.2; margin:2px 0 6px;
  display:flex; align-items:center; gap:9px}
.lesson .lsic{font-size:26px}
.lesson .lswhy{font-size:15px; color:var(--ink-soft); max-width:66ch}
.lesson .schema{background:#fff}
/* the lump this lesson is about, beside the name of the method */
.lshead{display:flex; gap:15px; align-items:flex-start; flex-wrap:wrap}
.lshead .lstext{flex:1 1 260px; min-width:0}
.lshead .lsrock{flex:0 0 auto; width:170px; max-width:170px; margin:0}
/* HOW FAR ALONG IT IS. A walkthrough with no sense of length is a corridor
   with no end in sight - the count and the pips are how long it is. */
.lsprog{display:flex; align-items:center; gap:10px; margin:11px 0 2px; flex-wrap:wrap}
.lsprog .lsstep{font-family:var(--display); font-size:12px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ore-t)}
.lspips{display:flex; gap:5px}
.lspips i{display:block; width:9px; height:9px; border-radius:50%;
  background:#fff; border:2px solid var(--tan)}
.lspips i.on{background:var(--ore); border-color:var(--ore-t)}
/* the step just opened, so the eye lands on the new one and not on step one */
.ssteps li.now .sact{font-weight:600}
.ssteps li.now{position:relative}
.ssteps li.now:after{content:""; position:absolute; left:-20px; top:6px; width:7px; height:7px;
  border-radius:50%; background:var(--ore)}
.lsnav{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-top:12px}
.lsnav .hint{flex:1 1 200px; min-width:0}
.lsback[disabled]{opacity:.4; cursor:default}
.lstool{font-size:14px; color:var(--ink-soft); max-width:60ch; margin-top:2px}
/* THE WHY IS SLIDE ONE, not a fold. It is the best paragraph in the lesson and
   behind a `<details>` it was one click away and therefore unread. */
.ssteps li.whyslide{list-style:none; margin-left:-22px; padding-left:0;
  background:#FFF6EA; border:2px solid var(--tan); border-radius:11px; padding:11px 13px}
.ssteps li.whyslide .swhylab{font-family:var(--display); font-size:11px; letter-spacing:.12em;
  color:var(--ore-t); margin-bottom:4px}
.ssteps li.whyslide .sact{font-size:15px; color:var(--ink); max-width:66ch}
.ssteps li.whyslide.now:after{display:none}

/* ---- THE BENCH: the instrument, and ore to hold it to (MINE-SPEC §31) ---- */
.lbench{background:linear-gradient(180deg,#3A3129,#241D18); border:3px solid var(--rock-3);
  border-radius:14px; padding:13px 15px 15px; margin-top:14px; color:#F0E2C8}
.lbench .lblab{font-family:var(--display); font-size:11px; letter-spacing:.11em;
  color:var(--lamp); margin-bottom:5px}
.lbench .lbhint{font-size:14px; color:#E4D5BB; max-width:64ch; margin-bottom:9px}
.lbench .lbhint b{color:#FFE9C4}
.lbench .hint{color:#C9B695; margin-top:9px}
.lbench .hint b{color:#E4D5BB}
.lbhook{margin-bottom:11px}
.lbhook .lbtool{max-width:180px}
.lbores{display:flex; flex-wrap:wrap; gap:13px; align-items:flex-start}
.lbcell{flex:0 1 190px; min-width:150px}
.lbore{display:block; width:100%; padding:0; margin:0; background:none; border:0;
  border-radius:10px; cursor:pointer}
.lbore:focus-visible{outline:3px solid var(--lamp); outline-offset:3px}
.lbore:hover .orerock{filter:brightness(1.14)}
.lbore .orerock{max-width:none}
.lbore.held .orerock{filter:drop-shadow(0 0 0 transparent)}
.lbore.held{box-shadow:0 0 0 3px var(--lamp), 0 0 14px 3px rgba(232,163,61,.35)}
.lbfound{font-size:12.5px; line-height:1.35; color:#E4D5BB; margin-top:5px; text-align:center}
.lbfound b{color:var(--lamp)}
.lbfound.plain{color:#C9B695; font-style:italic}

/* ---- THE SAME MOVE, OUTSIDE A MINE ---- */
.realworld{background:#F1F8F5; border:2px solid var(--vein); border-left:6px solid var(--vein);
  border-radius:12px; padding:12px 15px; margin-top:14px}
.realworld .rwlab{font-family:var(--display); font-size:11px; letter-spacing:.12em; color:var(--vein)}
.realworld .rwwhere{font-family:var(--display); font-size:clamp(17px,2.5vw,20px); color:var(--ink); margin:2px 0 5px}
.realworld .rwbody{font-size:15px; color:var(--ink); max-width:66ch}
.realworld .rwtie{font-size:14px; color:var(--ink-soft); margin-top:7px; max-width:66ch;
  border-top:1px dashed var(--rule); padding-top:7px}

/* ---- WHAT DID THE MINER DO WRONG: a worked attempt with the fault in it ---- */
.miscut{background:#FFFCF6; border:2px solid var(--tan); border-left:6px solid var(--molten);
  border-radius:12px; padding:13px 15px; margin-top:16px}
.miscut .mclab{font-family:var(--display); font-size:11px; letter-spacing:.12em; color:#A33E0B}
.miscut .mclede{font-size:15px; color:var(--ink); max-width:64ch; margin:3px 0 10px}
/* the log: a numbered line, the working, and what the miner took it to show */
.mclog{background:#fff; border:2px solid var(--rule); border-radius:10px; padding:9px 11px; margin-bottom:11px}
.mcrow{display:flex; align-items:baseline; gap:9px; padding:5px 0; flex-wrap:wrap;
  border-bottom:1px dashed var(--rule)}
.mcrow:last-child{border-bottom:0}
.mcn{font-family:var(--display); font-size:12px; color:var(--ore-t); flex:0 0 auto; min-width:1.2em}
.mcline{font-family:var(--display); font-size:clamp(16px,2.3vw,20px); color:var(--ink); flex:1 1 auto; min-width:0}
.mcnote{font-size:12.5px; color:var(--ink-soft); flex:0 1 auto; font-style:italic}
/* the last line is the one that is wrong, and it is not marked as wrong -
   that is the question */
.mcrow:last-child .mcline{color:#A33E0B}
.miscut .mcq{font-family:var(--display); font-size:clamp(16px,2.4vw,19px); color:var(--ink); margin-bottom:8px}
.miscut .qopts{margin-bottom:2px}
.mcafter{font-size:14.5px; color:var(--ink); background:#F1F8F5; border:2px solid var(--vein);
  border-radius:10px; padding:10px 12px; margin-top:9px; max-width:66ch}
.miscut .hint{margin-top:8px}

/* ---- A REFLECTION, WHICH IS NOT A QUESTION ---- */
.reflect{background:var(--paper); border:2px dashed var(--tan); border-radius:12px;
  padding:13px 15px; margin-top:16px}
.reflect .rflab{font-family:var(--display); font-size:11px; letter-spacing:.12em; color:var(--ore-t)}
.reflect .rfask{font-size:15px; color:var(--ink); max-width:64ch; margin:3px 0 9px}
.reflect .rfbox{width:100%; box-sizing:border-box; font-family:var(--body); font-size:15px;
  padding:10px 12px; border:2px solid var(--rule); border-radius:9px; background:#fff;
  color:var(--ink); resize:vertical; min-height:88px}
.reflect .rfbox:focus-visible{outline:3px solid var(--lamp); outline-offset:2px}
.reflect .rfnote{font-size:12.5px; color:var(--ink-soft); margin-top:7px; max-width:64ch}
.reflect .rfprompts{margin:8px 0 0; padding-left:20px; font-size:14px; color:var(--ink-soft)}
.reflect .rfprompts li{margin-bottom:4px; max-width:62ch}

@media (max-width:560px){
  .lshead .lsrock{width:132px; max-width:132px}
  .lsnav .btn{flex:1 1 auto}
  .lbcell{flex:1 1 100%}
}
.practice{background:#fff; border:2px solid var(--rule); border-radius:12px; padding:13px 15px; margin-top:13px}
.practice .prlab{font-family:var(--display); font-size:11px; letter-spacing:.12em; color:var(--vein)}
.practice .eq{margin:2px 0 4px}
.practice .prask{font-size:15px; color:var(--ink); margin-bottom:9px; max-width:62ch}
.practice .prout{margin-top:4px}

/* =========================================================================
   THE STAMP MILL (MINE-SPEC §38): a lump on a bench, a press over it, and a
   lever you pull. The mine's own loop, in numbers 2-100.
   ========================================================================= */
.millpanel{padding-top:14px}
.millstage{position:relative; width:100%; display:flex; justify-content:center; margin-bottom:12px}
.millsvg{position:relative; width:100%; max-width:400px}
.millsvg svg{display:block; width:100%; height:auto; overflow:visible}
.millsvg svg *{pointer-events:none}
/* the lump on the bench, pinned over the drawing the way the anvil's is */
.millmount{position:absolute; left:34%; right:34%; bottom:20%; z-index:2}
.millmount .orerock{max-width:none}
.millmount .orelab{font-size:clamp(17px,2.6vw,26px)}

/* THE PRESS COMES DOWN. A transform on the group, which is why the group
   carries no transform attribute of its own (s5g). */
@keyframes stampdrop{
  0%,26%{transform:translateY(0)}
  46%{transform:translateY(6px)}          /* it gathers before it falls */
  58%{transform:translateY(52px)}         /* THE BLOW */
  66%{transform:translateY(46px)}
  100%{transform:translateY(0)}
}
@keyframes stampmiss{
  0%,26%{transform:translateY(0)}
  46%{transform:translateY(6px)}
  58%{transform:translateY(52px)}
  64%{transform:translateY(30px)}         /* it bounces straight back off */
  72%{transform:translateY(42px)}
  100%{transform:translateY(0)}
}
.millstage[data-stamp=hit] .stamphead{animation:stampdrop 1100ms cubic-bezier(.4,0,.6,1) 1}
.millstage[data-stamp=miss] .stamphead{animation:stampmiss 1100ms cubic-bezier(.4,0,.6,1) 1}
/* the lever turns on its pin, and the pin is the transform-origin */
@keyframes leverpull{
  0%,20%{transform:rotate(0)}
  50%{transform:rotate(38deg)}
  70%{transform:rotate(34deg)}
  100%{transform:rotate(0)}
}
.stamplever{transform-origin:298px 57px}
.millstage[data-stamp] .stamplever{animation:leverpull 1100ms cubic-bezier(.4,0,.6,1) 1}
/* the lump takes the blow */
.millstage[data-stamp=hit] .millrock{transform-box:fill-box; transform-origin:center bottom;
  animation:rockcrack 1100ms ease-out 1}
.millstage[data-stamp=miss] .millrock{transform-box:fill-box; transform-origin:center bottom;
  animation:pieceknock 420ms cubic-bezier(.3,1.4,.4,1) .55s 1}

.millask{background:#FFFCF6; border:2px solid var(--tan); border-left:6px solid var(--ore);
  border-radius:12px; padding:12px 14px}
.millask .mlab,.millpanel .mlab{font-family:var(--display); font-size:11px; letter-spacing:.12em;
  color:var(--ore-t); margin-bottom:3px}
.millask .meq{font-family:var(--display); font-size:clamp(28px,5vw,42px); line-height:1.05; color:var(--ink)}
.millask .mhint,.millpick .mhint{font-size:13.5px; color:var(--ink-soft); max-width:62ch; margin-top:4px}
.millrow{margin-top:10px; gap:9px; align-items:center}
.millin{width:110px; text-align:center; font-family:var(--display); font-size:22px;
  padding:8px 6px; min-height:48px}
.leverbtn{min-height:48px}
/* what is on the bench: ore is rough and dark, an ingot is a cast bar */
.millfloor{display:flex; flex-wrap:wrap; gap:8px; margin:5px 0 14px}
.millpiece{font-family:var(--display); font-size:19px; min-height:44px; min-width:52px;
  padding:8px 14px; border-radius:8px; cursor:pointer; border:2px solid transparent}
/* #7A6650, NOT #8A7358. The sweep failed this on its first run at 4.09:1 -
   and the file already had the answer written down: the yard's rough chips hit
   exactly the same wall, and #7A6650 is 4.94:1 against the same cream. It is
   also the brown the rock pieces on the breaking floor start from, so a lump
   of ore is one colour everywhere it is drawn. */
.millpiece.ore{background:linear-gradient(160deg,#7A6650,#4A3F34); color:#FFF3DE; border-color:#3A2A1C;
  clip-path:polygon(8% 6%, 78% 0%, 100% 30%, 94% 84%, 58% 100%, 12% 92%, 0% 40%)}
.millpiece.ore:hover{filter:brightness(1.15)}
.millpiece.ingot{cursor:default}
.millpiece.under{box-shadow:0 0 0 3px var(--ore), 0 0 10px 2px rgba(201,106,31,.35)}
.millpiece:focus-visible{outline:3px solid var(--lamp); outline-offset:2px}
.millpiece.fresh{animation:piecedrop 420ms cubic-bezier(.2,.8,.3,1) 1}
.millpick{border-top:2px dashed var(--rule); padding-top:11px; margin-top:2px}
.millpick .meq{font-family:var(--display); font-size:26px; color:var(--ink); min-width:2.4em}
.millslide{flex:1 1 200px; min-width:0}
@media (prefers-reduced-motion:reduce){
  .millstage[data-stamp] .stamphead,.millstage[data-stamp] .stamplever,
  .millstage[data-stamp] .millrock,.millpiece.fresh{animation:none}
}

/* =========================================================================
   THE POUR, WRITTEN OUT. Every part of one metal meets every part of the
   other, a line at a time, ending in one object (MINE-SPEC §30).
   ========================================================================= */
.pourchain{background:#FFFCF6; border:2px solid var(--tan); border-left:6px solid var(--vein);
  border-radius:12px; padding:12px 14px; margin-top:12px; overflow-x:auto}
.pourchain .pclab{font-family:var(--display); font-size:11px; letter-spacing:.12em;
  color:var(--vein); margin-bottom:7px}
.pcrow{padding:6px 0; border-bottom:1px dashed var(--rule)}
.pcrow:last-child{border-bottom:0; padding-bottom:0}
.pcline{font-family:var(--display); font-size:clamp(16px,2.4vw,21px); color:var(--ink);
  display:flex; flex-wrap:wrap; align-items:baseline; white-space:nowrap}
.pcline .pcop{color:var(--ore-t); padding:0 .34em}
/* THE TWO MIDDLES ARE PICKED OUT, because "they are the same kind of thing"
   is the one claim in the chain a student has to SEE rather than be told. */
.pcline .pcterm.mid{color:var(--vein)}
.pcnote{font-size:12.5px; color:var(--ink-soft); margin-top:2px; max-width:62ch; white-space:normal}
.pcrow.out .pcline{font-size:clamp(18px,2.8vw,24px)}
.pcrow.out .pcnote{color:var(--vein)}
.pcrow.in .pcline{color:var(--ore-t)}

/* =========================================================================
   THE TRANSLATION TABLE. Two columns that mean the same thing, and a third
   that proves it.
   ========================================================================= */
.tablescroll{overflow-x:auto; margin-top:10px; max-width:100%}
table.rosetta{border-collapse:collapse; width:100%; min-width:440px; font-size:15px}
table.rosetta th{font-family:var(--display); font-weight:400; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ore-t); text-align:left; padding:6px 16px 6px 0; border-bottom:2px solid var(--rule); white-space:nowrap}
table.rosetta td{padding:9px 16px 9px 0; border-bottom:1px solid var(--rule); vertical-align:top}
table.rosetta td.rm{min-width:150px}
table.rosetta td.rm b{font-family:var(--display); font-weight:400; font-size:17px}
table.rosetta .rn{font-size:13px; color:var(--ink-soft); margin-top:3px; max-width:38ch}
table.rosetta td.rr{font-family:var(--display); font-size:16px; color:var(--vein); min-width:150px}
table.rosetta td.rx{font-family:var(--display); font-size:16px; color:var(--ink); min-width:150px}

/* the seven methods, folded away until wanted */
.schemadet{border:2px solid var(--rule); border-radius:12px; background:#FFFCF6; margin:9px 0; overflow:hidden}
.schemadet summary{display:flex; align-items:center; gap:10px; flex-wrap:wrap; cursor:pointer;
  padding:12px 15px; min-height:44px; list-style:none}
.schemadet summary::-webkit-details-marker{display:none}
.schemadet summary:before{content:"▸"; color:var(--ore-t); font-size:15px}
.schemadet[open] summary:before{content:"▾"}
.schemadet summary:hover{background:#FFF6EA}
.sdic{font-size:22px}
.sdnm{font-family:var(--display); font-size:17px; color:var(--ink)}
.sdtool{font-size:13px; color:var(--ink-soft)}
.sdbody{padding:0 15px 13px}
.sdbody .lesson{margin-top:0}

/* =========================================================================
   THE X, AND THE LINE-BY-LINE WORKING UNDER IT.
   Every number in the diagram is HTML pinned over the SVG strokes, never SVG
   <text> — see VERIFICATION §59.
   ========================================================================= */
.xwrap{display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  background:#FFFCF6; border:2px solid var(--rule); border-radius:12px; padding:12px 14px; margin:10px 0}
.xdia{position:relative; flex:0 0 auto; width:min(260px,100%)}
.xdia svg{display:block; width:100%; height:auto}
.xlabs{position:absolute; inset:0; pointer-events:none}
.xcell{position:absolute; transform:translate(-50%,-50%); white-space:nowrap;
  font-family:var(--display); font-size:clamp(17px,3vw,22px); color:var(--ink); line-height:1}
.xcell.xtop{color:var(--ore-t)}
.xcell.xbot{color:var(--vein)}
.xkey{flex:1 1 180px; min-width:0}
.xkey .xk{font-size:13px; color:var(--ink-soft); margin-bottom:5px}
.xkey .xk b{font-family:var(--display); font-weight:400; color:var(--ink)}
.xkey .dim{opacity:.8}

.diaglab{font-family:var(--display); font-size:11px; letter-spacing:.11em;
  color:var(--ore-t); margin:12px 0 2px}
/* a line of working with holes in it */
.wline{display:flex; gap:9px; align-items:baseline; flex-wrap:wrap; margin:6px 0}
.wline .wlab{font-size:13px; color:var(--ink-soft); flex:0 0 auto}
.wline .weq{font-family:var(--display); font-size:clamp(16px,2.4vw,21px); color:var(--ink);
  display:inline-flex; align-items:center; gap:2px; flex-wrap:wrap}
.wline.wbig .weq{font-size:clamp(18px,2.8vw,24px)}
.wline .wpart{white-space:pre}

/* the assay, now that it is offered rather than demanded */
.assayoffer{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:10px 0}
.assaybtn{background:#FFFCF6}
/* --ink-soft on the bench's tan (211,168,119) reads 3.85:1 and the sweep
   failed the build over it. The bench is a light surface, so the ink has to be
   the dark one. */
.assayhint{font-size:13px; color:var(--ink)}
.assayskip{margin-top:10px}
.millpoint .btn{margin-top:8px}

/* SENDING A LUMP STRAIGHT FROM THE CART TO THE YARD - small, centred, orange.
   At full width in the dark of the cart it read as heavy as the lump above it,
   and the lump is the thing you are meant to reach for. It is a tab under the
   chip now, not a second slab.

   THE INK ON IT IS DARK, NOT CREAM. #FFF7EA on --ore is 3.55:1 and this button
   IS inside the contrast sweep - the mine screen mounts with a lump in the
   cart - so cream would fail the build at 11px. Near-black on --ore is
   4.9:1. */
.lumpcell{display:flex; flex-direction:column; gap:5px; align-items:stretch}
/* WHERE A LUMP GOES, in two controls under the ore itself (§20). Not a tab
   under a chip any more: the two destinations are the decision the cart is
   for, so they are the same weight and they are side by side. */
.lumproute{display:flex; gap:7px; flex-wrap:wrap; margin-top:2px}
.lumproute .lumpgo{flex:1 1 132px; font-size:13px; min-height:40px; padding:8px 10px}
/* the tool's quiet door to the room that teaches it */
/* --lamp is 3.67:1 on the belt's LEATHER, not on the panel behind it — the
   strap is its own surface and it is lighter than the box. #FFE9C4 is 6.67. */
.beltwhy{display:block; width:100%; margin-top:3px; padding:3px 6px; min-height:24px;
  background:none; border:0; cursor:pointer; font-size:11px; letter-spacing:.06em;
  color:#FFE9C4; text-decoration:underline; text-underline-offset:2px}
.beltwhy:hover{color:#FFF7EA}
.tuyard{align-self:center; font-size:14px; letter-spacing:.05em;
  padding:9px 20px; min-height:40px; background:var(--ore); color:#1A120B;
  border:2px solid var(--lamp); border-radius:999px; cursor:pointer;
  font-family:var(--display)}
.tuyard:hover{background:var(--lamp); border-color:#FFE9C4; color:#1A120B}

/* the folded reasoning */
.swhyfold{margin:6px 0 2px}
.swhyfold summary{cursor:pointer; font-size:13px; color:var(--ore-t);
  font-family:var(--display); letter-spacing:.03em; min-height:24px; list-style:none}
.swhyfold summary::-webkit-details-marker{display:none}
.swhyfold summary:before{content:"▸ "; }
.swhyfold[open] summary:before{content:"▾ "; }
.swhyfold .swhy{margin-top:5px}
/* the method, credited in one line, with the reading a click away */
.methodline{display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  border-top:2px solid var(--rule); margin-top:12px; padding-top:10px}
.methodline .mlab{font-family:var(--display); font-size:11px; letter-spacing:.11em; color:var(--ore-t)}
.methodline .mnm{font-family:var(--display); font-size:16px; color:var(--ink); flex:1 1 auto}
.methodline .mlgo{font-size:12px; padding:8px 11px; min-height:44px}
/* the head of the bench: the lump on the left, the Stamp Mill signpost in the
   top right corner with its line underneath it */
.benchhead{display:flex; align-items:flex-start; justify-content:space-between;
  gap:14px; flex-wrap:wrap; margin-bottom:4px}
/* THE ORE IS THE HEADLINE, AND IT IS THE BIGGEST THING ON THE BENCH BY A LONG
   WAY. It was the same size as any other .eq on the page (~30px), and it is
   the STARTING NUMBER of the whole breaking floor - everything under it is a
   consequence of it. At 58px it was merely large; at 76px it is the first
   thing on the screen and reads as where the work begins. It clears the corner
   column's whole stack, so the top of this box is the number and nothing
   else. */
.benchore{flex:1 1 240px; min-width:0; margin:0 0 4px;
  font-size:clamp(40px,7.4vw,76px); line-height:1.06; letter-spacing:-.01em}
/* THE CORNER: the two asides on this bench, stacked hard into the top right.
   The Stamp Mill signpost first, the assay under it, each with its line of
   explanation beneath its own button. Neither is the act this screen is for,
   so neither lies across the work - they are tucked up against the banding.
   The negative margins pull the stack out of the bench's 16px padding so it
   sits in the corner rather than politely inside it. */
.benchcorner{flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end;
  text-align:right; gap:9px; max-width:214px; margin:-6px -6px 0 0}
.benchcorner > *{margin:0}
/* the signpost: button first, its line under it, both hard against the right */
.millpoint{flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end;
  text-align:right; gap:4px; max-width:100%}
/* --ink-soft on the bench's timber is 3.85:1, the same failure .assayhint
   above already carries. The bench is a mid-tone; its body text goes dark. */
.millpoint .mpt{font-size:12px; color:var(--ink); line-height:1.3}
/* DARK INK ON THE ORANGE, not cream: #FFF7EA on --ore is 3.55:1 and this
   button shipped at that, unseen, because the contrast sweep's mine pass dug
   a polynomial every time and the signpost only exists for a number. The two
   orange buttons in the mine - this and the cart's tab to the yard - are now
   one treatment. */
.mpbtn{background:var(--ore); color:#1A120B; border-color:var(--lamp);
  font-size:12px; padding:7px 12px; min-height:44px}
.mpbtn:hover{background:var(--lamp); border-color:#FFE9C4; color:#1A120B}
/* the assay, offered in the corner under the signpost and in the same shape */
.benchcorner .assayoffer{display:flex; flex-direction:column; align-items:flex-end;
  text-align:right; gap:4px; margin:0; max-width:100%}
.benchcorner .assaybtn{font-size:12px; padding:7px 12px; min-height:38px}
.benchcorner .assayhint{font-size:12px; line-height:1.3; color:var(--ink)}
/* `.endbar` is gone with the second anvil it drew. The finishing blow lands on
   the one anvil, like every other blow, and the stage's own min-height is what
   keeps the box from changing shape between the last swing and the end. */

/* ---- THE HAMMER PANEL, which is where the swing bar went ----
   It is the bench's dark plate lifted into the dialog, so every colour in it -
   the echo, the hints, the parens on the steel head - is the one that was
   measured against #241D18 rather than against the panel's paper. */
.hammerask{margin-top:0}
.hammerask .askrock{max-width:230px; margin:8px auto 4px}
.hammerask .swingrow{justify-content:center}
.hammerask .swingbtn{width:100%}
/* AND IT HAS TO FIT ITS OWN BOX ON A PHONE. The panel is capped at 88vh and
   scrolls, so anything past the cap puts the swing button below the fold of a
   dialog - which does not look like a thing that scrolls. Measured, not
   guessed: the `reach` group caught this at 380px at 870px of content in a
   681px box, and these are the numbers that brought it under. */
@media (max-width:620px){
  .hammerask .askrock{max-width:148px; margin:4px auto 2px}
  .hammerask .hrow{gap:6px; margin-top:2px}
  .hammerask .hecho{margin-top:5px}
  .hammerask .hint{font-size:12.5px; line-height:1.35}
  .toolsheet .hammerask{padding:10px 11px}
  .scrim{padding:10px}
}
@media (max-width:560px){
  .benchhead{flex-direction:column}
  /* FLEX-BASIS IS A HEIGHT ONCE THE AXIS TURNS. .benchore carries
     `flex:1 1 240px` for the wide layout, where 240px is a minimum WIDTH; in
     column direction the same declaration made the label 240px TALL for a
     single 48px line, and 192px of empty timber sat under the ore on every
     phone. Nothing measured it - `reach` counts the distance between two
     controls, and this was inside one box. */
  .benchore{flex:0 0 auto}
  .benchcorner{align-items:flex-start; text-align:left; max-width:100%; margin:0}
  .millpoint,.benchcorner .assayoffer{align-items:flex-start; text-align:left; max-width:100%}
}
.splitdia{width:min(300px,100%)}

/* =========================================================================
   THE CASTING SHED'S THREE WORKSHOPS.
   ========================================================================= */
.shedcards{margin-top:16px}
.shedcard{display:flex; flex-direction:column}
.shedic{font-size:38px; line-height:1; margin:6px 0 2px}
.shedic.sm{font-size:26px; margin:0 9px 0 0; display:inline-block; vertical-align:-2px}
.shedcard .why{flex:1 1 auto}
.backbtn{margin-bottom:10px}
.shedfoot{border-top:2px solid var(--rule); padding-top:14px}

/* the moving illustration at the head of each workshop */
.shedart{border:3px solid var(--rock-3); border-radius:14px; overflow:hidden; background:#2E2620; margin:0 0 14px}
/* EVERY WORD ON AN ILLUSTRATION IS HTML, pinned over the drawing in
   percentages so it rides the SVG at any width. SVG <text> would paint with
   `fill` while the contrast sweep reads `color` — real arithmetic about
   nothing you can see, and it failed this build at 1.06:1 ten times over
   before the words came out of the drawing. The labels are inert; the picture
   underneath is inert too. */
.shedart{position:relative}
.shedart svg{display:block; width:100%; height:auto}
.shedlabs{position:absolute; inset:0; pointer-events:none}
.shedlab{position:absolute; transform:translate(-50%,-50%); white-space:nowrap;
  font-family:var(--display); font-size:clamp(12px,1.9vw,18px); color:#E4D5BB; line-height:1}
.shedlab.dim{color:#C9B695; font-size:clamp(10px,1.4vw,13px)}
.shedlab.head{font-size:clamp(10px,1.4vw,13px); letter-spacing:.09em}
.shedlab.lamp{color:#E8A33D}
.shedlab.veinlt{color:#8FD3BF}
/* this one sits on the poured bar, so it carries the bar's own ground with it
   rather than being measured against the dark room behind it */
.shedlab.ongold{color:#2E2208; background:#C8A24B; padding:2px 7px; border-radius:5px}

/* THE TRANSFORM RULE (VERIFICATION §38): every one of these classes is
   animated with a CSS transform, so not one of them may carry a transform
   ATTRIBUTE - the animation replaces it rather than composing with it, and
   the piece drifts off its mount. Each sits inside a placed <g>, and
   MF.ANIM_TRANSFORM_CLASSES lists them all so animmount fails the build if
   that is ever done the other way round. */
@keyframes sarun{0%{transform:translateX(0); opacity:0}
  10%{opacity:1} 62%{transform:translateX(152px); opacity:1} 76%,100%{transform:translateX(152px); opacity:0}}
@keyframes safill{0%,8%{transform:scaleY(0)} 62%,100%{transform:scaleY(1)}}
@keyframes salift{0%,58%{transform:translateY(14px); opacity:0}
  72%{transform:translateY(0); opacity:1} 100%{transform:translateY(0); opacity:1}}
@keyframes sajoin{0%{transform:translateX(0); opacity:.15}
  50%{transform:translateX(92px); opacity:1} 100%{transform:translateX(0); opacity:.15}}
@keyframes saclimb{0%{transform:translate(0,0)} 100%{transform:translate(480px,-119px)}}

.sa-run{animation:sarun 3.6s ease-in infinite}
.sa-run.r1{animation-delay:.45s}
.sa-fill{transform-origin:0% 100%; animation:safill 3.6s ease-out infinite}
.sa-lift{animation:salift 3.6s ease-out infinite}
.sa-join{animation:sajoin 3.1s ease-in-out infinite}
.sa-join.j1{animation-delay:.5s}
.sa-join.j2{animation-delay:1s}
.sa-climb{animation:saclimb 7s steps(6, end) infinite}

/* UNDER REDUCED MOTION EACH ILLUSTRATION MUST STILL READ. The global rule
   collapses every duration to .001s, which lands each animation on its LAST
   keyframe - and for .sa-run that frame is opacity:0, so the metal running
   down the channels would simply not be there. A still frame of a good
   illustration should be a diagram, so the frames are stated: the metal is
   in the channels, the mold is full, the object is out, the pairs are lit,
   and the lamp is at the top of the ladder. */
@media (prefers-reduced-motion:reduce){
  .sa-run,.sa-fill,.sa-lift,.sa-join,.sa-climb{animation:none !important}
  .sa-run{transform:translateX(120px); opacity:1}
  .sa-fill{transform:scaleY(1)}
  .sa-lift{transform:translateY(0); opacity:1}
  .sa-join{transform:translateX(46px); opacity:1}
  .sa-climb{transform:translate(480px,-119px)}
}

/* =========================================================================
   THE QUESTIONS. Described, never marked - so there is no "right" styling
   and no "wrong" styling, only a chosen one and a description under it.
   ========================================================================= */
.asks{background:var(--paper-2); border:3px solid var(--tan); border-radius:14px; padding:16px 18px; margin:16px 0}
.asks .askslab{font-family:var(--display); font-size:11px; letter-spacing:.12em; color:var(--ore-t)}
.asks .askslede{font-size:14px; color:var(--ink-soft); max-width:64ch; margin:3px 0 4px}
.ask{background:#fff; border:2px solid var(--rule); border-radius:12px; padding:13px 15px; margin-top:12px}
.ask .qn{font-size:16px; color:var(--ink); display:flex; gap:9px; align-items:baseline}
.ask .qt{flex:1 1 auto; min-width:0}
.ask .qi{flex:0 0 auto; font-family:var(--display); font-size:13px; color:#FFF7EA;
  background:var(--ore-t); border-radius:50%; width:24px; height:24px; line-height:24px; text-align:center}
.ask .qsub{font-size:13px; color:var(--ink-soft); margin:5px 0 0 33px}
.qopts{display:flex; gap:9px; flex-wrap:wrap; margin:11px 0 0 33px}
.qopt{cursor:pointer; background:#FFFCF6; border:2px solid var(--tan); border-radius:11px;
  padding:11px 15px; min-height:44px; font-family:var(--display); font-size:17px; color:var(--ink)}
.qopt:hover{border-color:var(--ore); background:#FFF6EA}
/* CHOSEN, NOT CORRECT. The only thing this says is which one you picked. */
.qopt[data-chosen=yes]{border-color:var(--ore-t); background:#FFF1DF; box-shadow:inset 0 0 0 2px var(--ore-t)}
.ask .qout{margin-left:33px}
.ask .nsrow{margin:11px 0 0 33px}
@media (max-width:560px){
  .ask .qsub, .qopts, .ask .qout, .ask .nsrow{margin-left:0}
}

/* =========================================================================
   THE WORLD. Everything below exists to make the page feel like a PLACE.
   Rules it follows: motion carries weight (a pick swings and lands, it does
   not fade); nothing that moves reports a quantity; every layer is its own
   stone; and all of it stops dead under prefers-reduced-motion.
   ========================================================================= */

/* ---- interiors. Rooms are DECORATIVE ONLY and carry no text: SVG <text>
       inherits the CSS `color` property while painting with `fill`, which
       makes it read as a false failure to any contrast sweep. Every word on
       these screens stays in HTML underneath. ---- */
/* A ROOM IS A BANNER, NOT THE SCREEN. At width:100% the 900x210 viewBox drew
   ~290px tall on a desktop, so the actual work started below the halfway line
   and a student met scenery before they met anything to do. Fixed height with
   `slice` scales to cover and crops a little wall and floor instead. */
/* 232, not 176: at 176 the 900x210 room had to scale ~1.3x to cover and lost
   nearly half its height to the crop, which read as being zoomed into the wall.
   232 trims about 15% - enough to stop the banner dominating, little enough
   that the room still looks like a room. */
.room{border:3px solid var(--rock-3); border-radius:16px; overflow:hidden; margin:0 0 14px;
  background:#2E2620; height:232px}
.room svg{display:block; width:100%; height:100%}
@media (max-width:700px){ .room{height:168px} }
@keyframes bellowspush{0%,100%{transform:scaleY(1)}45%{transform:scaleY(.72)}}
@keyframes firelick{0%,100%{transform:scaleY(1) translateY(0); opacity:.92}50%{transform:scaleY(1.18) translateY(-3px); opacity:1}}
@keyframes quenchsteam{0%{transform:translateY(0) scale(.5); opacity:.5}100%{transform:translateY(-42px) scale(1.5); opacity:0}}
@keyframes ladletip{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-16deg)}}
@keyframes stampfall{0%,44%{transform:translateY(-26px)}62%{transform:translateY(0)}70%{transform:translateY(-3px)}100%{transform:translateY(-26px)}}
.rm-fire{transform-origin:50% 100%; animation:firelick 1.6s ease-in-out infinite}
.rm-bellows{transform-origin:0% 50%; animation:bellowspush 3.4s ease-in-out infinite}
.rm-steam{animation:quenchsteam 3.2s ease-out infinite}
.rm-ladle{transform-origin:74% 30%; animation:ladletip 6s ease-in-out infinite}
/* the battery does not fall in unison - a stamp mill is five hammers out of
   step with each other, which is the whole sound of the thing */
.rm-stamp{animation:stampfall 1.15s cubic-bezier(.4,0,.7,1) infinite}
.rm-stamp.s1{animation-delay:.23s} .rm-stamp.s2{animation-delay:.46s}
.rm-stamp.s3{animation-delay:.69s} .rm-stamp.s4{animation-delay:.92s}

/* ---- A DAY ON THE SURFACE, four minutes long ----
   One clock, 240s, and every part of it is a phase of the same turn:

     0s    morning     the sun clears the eastern hills
     60s   noon        sun overhead, sky at its bluest
     120s  dusk        sun setting west, the sky burns
     180s  midnight    moon overhead, stars out, the site goes dark
     240s  morning     round again

   The sky is four tinted sheets cross-fading over the base gradient - you
   cannot animate the stops of a gradient, so you fade whole skies instead. */
@keyframes skyDawn { 0%{opacity:1} 12%{opacity:.9} 22%{opacity:0} 84%{opacity:0} 94%{opacity:.75} 100%{opacity:1} }
@keyframes skyNoon { 0%{opacity:0} 16%{opacity:.85} 25%{opacity:1} 36%{opacity:.9} 46%{opacity:0} 100%{opacity:0} }
@keyframes skyDusk { 0%{opacity:0} 40%{opacity:0} 50%{opacity:1} 60%{opacity:.85} 70%{opacity:0} 100%{opacity:0} }
@keyframes skyNight{ 0%{opacity:0} 62%{opacity:0} 75%{opacity:1} 86%{opacity:1} 96%{opacity:.15} 100%{opacity:0} }
.sc-sky{opacity:0}
.sc-skyDawn { animation:skyDawn  240s linear infinite }
.sc-skyNoon { animation:skyNoon  240s linear infinite }
.sc-skyDusk { animation:skyDusk  240s linear infinite }
.sc-skyNight{ animation:skyNight 240s linear infinite }

/* THE CENTRE OF THE CIRCLE IS ON THE HORIZON, at (450,310) in the scene's own
   coordinates. That is what makes each body up for exactly half the turn -
   put the centre lower and the sun is only out for a third of the day. */
@keyframes sunorbit { from{transform:rotate(-90deg)} to{transform:rotate(270deg)} }
@keyframes moonorbit{ from{transform:rotate(90deg)}  to{transform:rotate(450deg)} }
.sc-sun { transform-origin:450px 310px; animation:sunorbit  240s linear infinite }
.sc-moon{ transform-origin:450px 310px; animation:moonorbit 240s linear infinite }
@keyframes starsout{ 0%{opacity:0} 58%{opacity:0} 74%{opacity:1} 88%{opacity:.9} 96%{opacity:0} 100%{opacity:0} }
.sc-stars{opacity:0; animation:starsout 240s linear infinite}
/* the site itself goes dark, not only the sky above it */
@keyframes nightfall{ 0%{opacity:0} 46%{opacity:0} 58%{opacity:.22} 75%{opacity:.52} 88%{opacity:.46} 97%{opacity:0} 100%{opacity:0} }
.sc-night{opacity:0; animation:nightfall 240s linear infinite; mix-blend-mode:multiply}
/* ---- EVERY LIGHT ON THE SITE ANSWERS THE CLOCK ----
   Two ranges, because a lamp and the light it throws are not the same thing.
   `sc-lit` is the SOURCE - lantern glass, a furnace mouth, a lit window - and
   it never goes out, it only gets stronger. `sc-glow` is the light CAST - a
   halo, a pool on the ground - which should be all but invisible at noon and
   unmistakable at midnight.

   AND THEY GO ON A WRAPPER, NOT ON THE FLICKERING SHAPE ITSELF. `.sc-lamp`
   already animates opacity at 3.2s, and two animations cannot share one
   property: the later rule wins outright and the other silently does nothing.
   `.sc-lamp` is declared below this, so it was quietly cancelling the day/night
   level on five of the nine lights - every one of the ones a student would
   call a lamp. Nested, the two opacities multiply, which is what "flickering,
   and brighter after dark" actually means. */
/* THE RANGE IS THE EFFECT. At .55 -> 1 the sources moved by less than half a
   stop and midnight read as dusk with the lamps on. A source now falls to a
   third of full at noon and burns flat out from dusk to dawn, so the change
   between the two ends of the day is a change in what kind of place this is. */
@keyframes lampsup{ 0%{opacity:.78} 22%{opacity:.34} 46%{opacity:.52} 62%{opacity:.9} 76%{opacity:1} 90%{opacity:1} 100%{opacity:.78} }
.sc-lit{animation:lampsup 240s linear infinite}
@keyframes glowup{ 0%{opacity:.3} 22%{opacity:.02} 46%{opacity:.1} 62%{opacity:.56} 76%{opacity:.95} 90%{opacity:.88} 100%{opacity:.3} }
.sc-glow{animation:glowup 240s linear infinite}
/* SCREEN, so a light can only ADD. The night rect is a multiply blend over the
   whole site and it was taking the lamps down with the hillside - the one
   thing that must not happen after dark. This layer is painted after it and
   can never darken a pixel. */
.sc-lightlayer{mix-blend-mode:screen; pointer-events:none}
@media (prefers-reduced-motion:reduce){
  /* the day stops at noon rather than flickering through four skies */
  .sc-sky,.sc-stars,.sc-night,.sc-sun,.sc-moon,.sc-lit,.sc-glow{animation:none}
  .sc-skyNoon{opacity:1}
  .sc-moon{opacity:0}
  .sc-lit{opacity:.34}
  .sc-glow{opacity:.02}
  .sc-lightlayer{opacity:.02}
}

/* ---- the surface scene ---- */
.scene{position:relative; border:3px solid var(--rock-3); border-radius:16px; overflow:hidden;
  background:#8FB8D6; box-shadow:inset 0 -30px 60px rgba(58,49,41,.35)}
.scene svg{display:block; width:100%; height:auto}
/* DECORATION PAINTED OVER A DOOR MUST NOT TAKE THE CLICK.
   SVG paint order is document order, and three things go on AFTER the
   hotspots: Mr Factor, the portal's dark mouth, and the cart rolling out of
   it. All three were live to the mouse, so they swallowed clicks aimed at the
   building underneath - and the mine's black opening, the most mine-looking
   part of the whole scene, was the deadest spot on it.
   Stated as a class rather than patched per element: in a scene, only a door
   takes a hit. Everything else is a picture. */
.scene svg *{pointer-events:none}
.scene .hot,.scene .hot *{pointer-events:auto}
.scene .hot{cursor:pointer}
.scene .hot .hotring{opacity:0; transition:opacity .18s ease}
.scene .hot:hover .hotring,.scene .hot:focus-visible .hotring{opacity:1}
.scene .hot:focus-visible{outline:none}
.scene .hotlabel{font-family:var(--display); font-size:13px; fill:#FFF3DE; paint-order:stroke;
  stroke:#2E2620; stroke-width:4px; stroke-linejoin:round}
/* burnt into the plank: dark on light wood, no outline needed */
.scene .signtext{font-family:var(--display); font-size:11px; fill:#3A2A18; color:#3A2A18}
/* TRANSFORM-BOX IS NOT OPTIONAL ON SVG.
   `transform-origin` on an SVG element resolves against the VIEWBOX by
   default, not the element - so "center" meant the centre of a 900x420 scene,
   hundreds of units away, and every rotating piece swung around a point
   outside itself. fill-box makes the origin mean what it says. */
.sc-wheel,.sc-sails,.rm-ladle,.rm-bellows,.rm-fire,.pickarm{transform-box:fill-box}
@keyframes sailspin{to{transform:rotate(360deg)}}
.sc-sails{transform-origin:center; animation:sailspin 13s linear infinite}
@keyframes wheelspin{to{transform:rotate(360deg)}}
@keyframes cartroll{0%{transform:translateX(0)}45%{transform:translateX(150px)}55%{transform:translateX(150px)}100%{transform:translateX(0)}}
/* out of the portal, along the track in front of the mine, and back in again -
   a shuttle, which is what a haulage cart actually does all day */
/* parks at +12, not +44: the arch interior runs 748-828 and the cart is 54
   wide from a mount at 756, so only 12 leaves it FULLY inside the dark. Any
   further right and its tail stuck out past the mask, over the bluff. */
/* the fade is what conceals it deep in the shaft, now that nothing is painted
   over the top of it - it comes up out of the dark and goes back into it */
@keyframes cartout{
  0%  {transform:translateX(30px); opacity:0}
  10% {transform:translateX(22px); opacity:0}
  20% {transform:translateX(6px);  opacity:1}
  44% {transform:translateX(-168px); opacity:1}
  58% {transform:translateX(-168px); opacity:1}
  82% {transform:translateX(6px);  opacity:1}
  92% {transform:translateX(22px); opacity:0}
  100%{transform:translateX(30px); opacity:0}
}
.sc-cartout{animation:cartout 16s ease-in-out infinite}
@keyframes smokepuff{0%{transform:translate(0,0) scale(.6); opacity:.55}100%{transform:translate(16px,-58px) scale(1.7); opacity:0}}
@keyframes clouddrift{from{transform:translateX(-70px)}to{transform:translateX(660px)}}
@keyframes lampflicker{0%,100%{opacity:.85}45%{opacity:1}70%{opacity:.7}}
@keyframes birdbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sc-wheel{transform-origin:center; animation:wheelspin 9s linear infinite}
.sc-wheel.slow{animation-duration:14s}
.sc-cart{animation:cartroll 11s ease-in-out infinite}
.sc-smoke{animation:smokepuff 4.5s ease-out infinite}
.sc-cloud{animation:clouddrift 46s linear infinite}
.sc-lamp{animation:lampflicker 3.2s ease-in-out infinite}
.sc-bird{animation:birdbob 3s ease-in-out infinite}

/* ---- the rock face ---- */
.face{position:relative; border:3px solid var(--rock-3); border-radius:16px; overflow:hidden}
.face svg{display:block; width:100%; height:auto}
/* the seam viewport: the rock inside is several screens wide and is scanned
   along by scrolling, dragging or the scan buttons */
/* `scroll`, NOT `auto`. The bar is always there in practice - the seam is five
   screens wide by design - but with `auto` it is not there at the moment the
   drawing is measured, and it appears once the drawing makes the box overflow.
   So the height was read 15px too large and the seam was sized to a window it
   then made smaller: 15px of the floor clipped, every time. Reserving the bar
   makes the measurement the same before and after. */
.seamview{overflow-x:scroll; overflow-y:hidden; cursor:grab; scroll-behavior:smooth;
  scrollbar-color:var(--lamp) #241D18}
.seamview:active{cursor:grabbing}
/* THE SEAM IS SHOWN TALLER THAN IT IS DRAWN. The rock is the same 2280x190
   it always was - what changed is the size it is rendered at. At 190px it was
   a letterbox strip and the lumps in it were small; at 286 the same rock and
   the same lumps are half again as big, which is what "extend it vertically"
   buys. The width scales with it, so you scan a little less seam per screen
   and see a great deal more of what is in it. */
/* NO HEIGHT HERE. It used to say `height:542px` while JS set the width to the
   viewBox's own 2900 - two numbers for one drawing, in two files' worth of
   different places, and they drifted: the rock painted 360px tall in a 542px
   element with 91px of blank above and below it. Both axes come off
   MF.SEAM_ZOOM in MF.paintFace now, so there is one number and it cannot. */
.seamview svg{max-width:none}
.seamview::-webkit-scrollbar{height:10px}
.seamview::-webkit-scrollbar-track{background:#241D18}
.seamview::-webkit-scrollbar-thumb{background:var(--lamp); border-radius:999px}
/* THE PICK WAS EATING EVERY CLICK ON THE SEAM.
   It follows the cursor at (ux-46, uy-62), which puts the cursor at local
   (46,62) - INSIDE the handle rect (x:40 y:10 w:9 h:92) - and it is appended
   after the rocks, so it is painted on top of them. Hit-testing the centre of
   a lump returned the pick's handle, head and collar; the rock was never
   reached. The reaction was wired up correctly and could not fire, because the
   click never arrived. Same rule as the scene: only a lump takes a hit here,
   everything else is a picture. The svg itself keeps its events so that
   dragging the face to scan along the seam still works. */
.face svg *{pointer-events:none}
.face .rock,.face .rock *{pointer-events:auto}
.rock{cursor:pointer}
.rock .body{transition:transform .16s ease, filter .16s ease}
.rock:hover .body,.rock:focus-visible .body{transform:translateY(-2px); filter:brightness(1.22)}
.rock:focus-visible{outline:none}
.rock .sel{opacity:0}
.rock[data-sel=on] .sel{opacity:1}
.rock[data-sel=on] .body{filter:brightness(1.3)}
@keyframes glintpulse{0%,100%{opacity:.25}50%{opacity:.9}}
.rock .glint{animation:glintpulse 2.6s ease-in-out infinite}
@keyframes pickswing{
  0%{transform:rotate(-58deg) translate(0,0)}
  55%{transform:rotate(16deg) translate(0,0)}
  62%{transform:rotate(12deg) translate(-3px,2px)}
  100%{transform:rotate(-58deg) translate(0,0)}
}
.pickarm{transform-origin:86% 88%; animation:pickswing 720ms cubic-bezier(.5,.05,.3,1) 1}
@keyframes shardfly{
  0%{opacity:1; transform:translate(0,0) rotate(0deg)}
  100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}
}
.shard{animation:shardfly 620ms ease-out forwards}
@keyframes impactring{0%{opacity:.85; transform:scale(.2)}100%{opacity:0; transform:scale(2.4)}}
.impact{transform-origin:center; animation:impactring 520ms ease-out forwards}
@keyframes shudder{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,-2px)}80%{transform:translate(2px,1px)}}
.shudder{animation:shudder 320ms ease-in-out 1}

/* ---- THE KNOCK: every click on a lump is answered where the mouse is ----
   Clicking the lump you already had picked out repainted the face to a picture
   identical to the one you were already looking at, and a click that landed
   during a swing returned without a word. Both are indistinguishable from a
   control that was never wired up. The knock decides nothing - it only says
   "yes, that one", at the point of contact, every single time.

   transform-box:fill-box is load-bearing. A <g> defaults to view-box, so
   scale() on the rock body would resolve about the top-left corner of the
   2280-wide seam and fling the rock off the face instead of compressing it
   where it sits. */
.rock .body{transform-box:fill-box; transform-origin:center}
@keyframes rockknock{
  0%{transform:translate(0,0) scale(1)}
  28%{transform:translate(0,2.5px) scale(.93)}
  58%{transform:translate(0,-1.5px) scale(1.05)}
  100%{transform:translate(0,0) scale(1)}
}
.rock .body.knock{animation:rockknock 300ms cubic-bezier(.3,1.5,.4,1) 1}
/* a swing is already in the air: the click still answers, it answers "not now" */
@keyframes rockrefuse{0%,100%{transform:translate(0,0)}25%{transform:translate(-2.6px,0)}75%{transform:translate(2.6px,0)}}
.rock .body.refuse{animation:rockrefuse 240ms ease-in-out 1}
@keyframes chipfly{0%{opacity:.95; transform:translate(0,0)}100%{opacity:0; transform:translate(var(--dx),var(--dy))}}
.chip{animation:chipfly 400ms ease-out forwards; pointer-events:none}
@keyframes tapring{0%{opacity:.8; transform:scale(.62)}100%{opacity:0; transform:scale(1.28)}}
.taphalo{transform-box:fill-box; transform-origin:center; pointer-events:none;
  animation:tapring 400ms ease-out forwards}
/* the pick is in your hand and follows the cursor, so it has to be seen to
   touch what you touched - a tip, not the full swing, which is what breaking
   looks like and must stay unmistakable */
@keyframes picktap{0%,100%{transform:rotate(0)}42%{transform:rotate(-19deg)}}
.pickarmhost.picktap{transform-origin:86% 88%; animation:picktap 260ms cubic-bezier(.4,.1,.3,1) 1}
@keyframes tapfade{0%{opacity:.85}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  /* the answer stays, it stops moving. A ring that fades is still an answer. */
  .rock .body.knock,.rock .body.refuse,.lump.knock,.pickarmhost.picktap{animation:none}
  .chip{display:none}
  .taphalo{animation:tapfade 420ms linear forwards}
}

/* ---- inspecting a rock before you break it ---- */
/* =========================================================================
   THE POP-OUT OVER THE WALL (MINE-SPEC §33).

   USER, 2026-09-05: "there should be a pop out window asking to swing or keep
   scanning. This pop out window should be overlaid the layer window not
   popping below it."

   It is absolutely positioned inside `.facewrap`, so it covers the seam and
   NOTHING BELOW IT MOVES when it opens. As a block in the flow it used to push
   the scan row, the cart and everything under them down the page every time a
   lump was picked out.
   ========================================================================= */
.facewrap{position:relative}
.inspect{background:#241D18; border:2px solid #6B5B48; border-radius:12px; padding:11px 13px; color:#F0E2C8; margin-top:10px}
/* 420, NOT 340. At 340 the two buttons could not sit side by side and the
   reading wrapped to five lines: the panel came out 359px tall in a 563px
   window, which is a pop-out that cannot avoid covering the stone it is about.
   Wider is SHORTER here, and short is the whole requirement. */
.inspectpop{position:absolute; z-index:6; margin:0; width:min(420px, calc(100% - 20px));
  padding:10px 13px 11px;
  border-color:var(--lamp); box-shadow:0 14px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4);
  animation:popin 150ms cubic-bezier(.2,.8,.3,1) 1}
@keyframes popin{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){ .inspectpop{animation:none} }
/* BESIDE the rock when there is room, which is the only placement that covers
   none of it; over or under only on a screen too narrow for that. */
.inspectpop[data-flip=low]{bottom:14px}
.inspectpop[data-flip=high]{top:14px}
/* a caret pointing back at the rock, wherever the clamp put the panel */
.inspectpop:after{content:""; position:absolute; border:9px solid transparent;
  width:0; height:0}
.inspectpop[data-flip=low]:after,.inspectpop[data-flip=high]:after{
  left:var(--caret,50%); margin-left:-9px}
.inspectpop[data-flip=low]:after{bottom:100%; border-bottom-color:var(--lamp)}
.inspectpop[data-flip=high]:after{top:100%; border-top-color:var(--lamp)}
.inspectpop[data-flip=side]:after{top:var(--caretY,50%); margin-top:-9px}
.inspectpop[data-side=right]:after{right:100%; border-right-color:var(--lamp)}
.inspectpop[data-side=left]:after{left:100%; border-left-color:var(--lamp)}
.inspectpop .label{font-size:10px}
.inspectpop .expr{font-size:clamp(19px,2.4vw,24px); margin:1px 0 4px}
.inspectpop .obs{font-size:13px; line-height:1.4}
.inspectpop .poprow{gap:8px; flex-wrap:nowrap; margin-top:9px}
/* the swing is the wider of the two, because it is the one the panel is for */
.inspectpop .poprow .btn{flex:2 1 0; min-width:0; font-size:14px; padding:9px 10px; min-height:44px}
.inspectpop .poprow .popkeep{flex:1 1 0; white-space:nowrap}
@media (max-width:560px){
  .inspectpop{width:calc(100% - 16px)}
  .inspectpop[data-flip=low]{bottom:8px}
  .inspectpop[data-flip=high]{top:8px}
}
.inspect .label{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--lamp)}
.inspect .expr{font-family:var(--display); font-size:clamp(22px,3.4vw,34px); color:#FFF3DE; margin:2px 0 6px}
.inspect .obs{font-size:14px; color:#D9C39C}
.inspect .obs li{margin:2px 0}
/* the prospector's pick's whole output: the kind, named, at the face. 7.70:1
   on the inspect panel's #241D18. */
.inspect .obs .pickread{color:var(--lamp)}
/* the line under the cart/yard choice. --ink-soft is a LIGHT-surface colour and
   this panel is #241D18, so .hint's default would be measured against the wrong
   ground entirely; #E4D5BB reads 10.7:1 on it. */
.inspect .yardhint{color:#E4D5BB; margin-top:8px; font-size:13px}

/* ---- the crucible pour ---- */
@keyframes moltenfall{0%{transform:scaleY(0); opacity:0}18%{opacity:1}100%{transform:scaleY(1); opacity:1}}
@keyframes castrise{from{opacity:0; transform:translateY(14px) scale(.94)}to{opacity:1; transform:translateY(0) scale(1)}}
@keyframes gleam{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
.moltenstream{transform-origin:top center; animation:moltenfall 620ms ease-in 1}
.castingwrap{animation:castrise 420ms cubic-bezier(.2,.8,.3,1) 1; position:relative; overflow:hidden}
.castingwrap.clean:after{content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);
  animation:gleam 1100ms ease-out 1}
@keyframes cracktwitch{0%,100%{transform:translate(0,0) rotate(0)}30%{transform:translate(-2px,1px) rotate(-.6deg)}70%{transform:translate(2px,-1px) rotate(.6deg)}}
.castingwrap.deformed{animation:castrise 420ms ease-out 1, cracktwitch 300ms ease-in-out 1 420ms}

/* ---- moving between places. A short wipe, so going somewhere feels like
       going somewhere rather than the page swapping its contents. ---- */
/* MOVEMENT ONLY, NEVER OPACITY. Animating from opacity:0 means any dropped
   frame, slow paint or interrupted animation leaves the whole screen faint or
   blank - the mine looked like its rocks had not rendered at all. A transition
   should never be able to hide the content it is introducing. */
@keyframes placewipe{
  0%{transform:translateY(9px)}
  100%{transform:translateY(0)}
}
#screen.arriving{animation:placewipe 260ms cubic-bezier(.2,.8,.3,1) 1}
@media (prefers-reduced-motion:reduce){ #screen.arriving{animation:none} }

/* ---- the haulage road above the cart: a cart running the track, endlessly ---- */
.carttrack{border:2px solid #241C15; border-radius:11px 11px 0 0; overflow:hidden;
  background:linear-gradient(180deg,#3A3129,#2A231C)}
.carttrack svg{display:block; width:100%; height:auto}
@keyframes cartroll2{from{transform:translateX(-110px)}to{transform:translateX(640px)}}
@keyframes wheelroll{to{transform:rotate(360deg)}}
@keyframes cartjolt{0%,100%{transform:translateY(0)}25%{transform:translateY(-1.4px)}60%{transform:translateY(.9px)}}
.ct-cart{animation:cartroll2 9s linear infinite}
.ct-jolt{transform-box:fill-box; animation:cartjolt .5s ease-in-out infinite}
.ct-wheel{transform-box:fill-box; transform-origin:center; animation:wheelroll 1.1s linear infinite}

/* ---- a lump arriving in the cart ---- */
@keyframes lumpdrop{from{opacity:0; transform:translateY(-16px) scale(.9)}to{opacity:1; transform:translateY(0) scale(1)}}
.lump.fresh{animation:lumpdrop 380ms cubic-bezier(.2,.8,.3,1) 1}
/* AFTER .lump.fresh, deliberately: same specificity, so a click on a lump that
   has only just landed in the cart still knocks rather than being outranked by
   its own arrival. */
@keyframes lumpknock{0%{transform:translateY(0) scale(1)}34%{transform:translateY(2px) scale(.96)}
  68%{transform:translateY(-1px) scale(1.025)}100%{transform:translateY(0) scale(1)}}
.lump.knock{animation:lumpknock 260ms cubic-bezier(.3,1.4,.4,1) 1}

table.scan{border-collapse:collapse; font-size:15px; margin-top:8px}
table.scan th{font-family:var(--display); font-weight:400; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ore-t); text-align:left; padding:5px 14px 5px 0; border-bottom:2px solid var(--rule)}
table.scan td{padding:5px 14px 5px 0; border-bottom:1px solid var(--rule); font-variant-numeric:tabular-nums}
table.scan tr.hit td{background:#F1F8F5; color:var(--vein); font-weight:700}

.mf{display:flex; gap:14px; align-items:flex-start; margin:14px 0 0}
.mf svg{flex:0 0 auto}
.bubble{position:relative; background:#fff; border:2px solid var(--tan); border-radius:14px; padding:12px 15px; font-size:15px; max-width:64ch}
.bubble:before{content:""; position:absolute; left:-11px; top:20px; width:0; height:0; border:9px solid transparent; border-right-color:var(--tan)}
.bubble b{font-family:var(--display); font-weight:400; color:var(--ore-t)}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0}
.chip{border:2px solid var(--tan); background:#fff; border-radius:999px; padding:6px 13px; font-size:14px; color:var(--ink)}
</style>
</head>
<body>
<div id="ambient" aria-hidden="true"><div class="lamp"></div></div>

<div id="loadscreen">
  <div id="load-art" aria-hidden="true"></div>
  <h2>Mr Factor's Mining Operation</h2>
  <div class="sub">Ore looks like rock. <b>x&sup2; &minus; 5x + 6</b> looks like a lump.
    Down here they are the same problem, and the same three tools solve both.</div>
  <div class="loadbar"><i id="loadbar-fill"></i></div>
  <div class="loadticker" id="loadticker">opening the shaft</div>
  <button class="btn primary big" id="enter-btn" style="display:none">Enter the operation</button>
</div>

<header class="top">
  <div class="top-in">
    <div id="hero-art" aria-hidden="true"></div>
    <div>
      <h1>Mr Factor's Mining Operation</h1>
      <div class="tagline">smelt it apart &middot; pour it back &middot; find out</div>
    </div>
    <div class="spacer"></div>
    <nav id="nav" aria-label="Main"></nav>
  </div>
</header>

<div class="wrap"><main id="screen" tabindex="-1"></main></div>

<script>
"use strict";
/* =========================================================================
   CORE HELPERS
   ========================================================================= */
var MF = {}; window.MF = MF;

function E(tag, cls, txt){ var n=document.createElement(tag); if(cls) n.className=cls; if(txt!=null) n.textContent=txt; return n; }
function H(tag, cls, html){ var n=document.createElement(tag); if(cls) n.className=cls; if(html!=null) n.innerHTML=html; return n; }
function S(tag, attrs){ var n=document.createElementNS('http://www.w3.org/2000/svg',tag); for(var k in attrs){ n.setAttribute(k,attrs[k]); } return n; }
function q(sel,root){ return (root||document).querySelector(sel); }
function on(node,ev,fn){ node.addEventListener(ev,fn); return node; }
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); return node; }

/* number printing. Every displayed value goes through this so a float
   artefact can never reach a student. */
function num(n){
  if(n==null || !isFinite(n)) return '?';
  var r = Math.round(n*1e6)/1e6;
  if(Object.is(r,-0)) r = 0;
  return r.toFixed(6).replace(/0+$/,'').replace(/\.$/,'').replace('-','−');
}
function isInt(n){ return Math.abs(n-Math.round(n)) < 1e-9; }
function signed(n){ var v=Math.round(n*1e6)/1e6; return (v<0?' − ':' + ') + num(Math.abs(v)); }

/* gcd / primes */
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a; }
function gcdAll(l){ return l.reduce(function(g,v){ return gcd(g,v); },0); }
function isPrime(n){ n=Math.abs(n); if(n<2) return false; for(var i=2;i*i<=n;i++){ if(n%i===0) return false; } return true; }
function primeFactors(n){ var out=[],v=Math.abs(n); if(v<2) return out;
  for(var p=2;p*p<=v;p++){ while(v%p===0){ out.push(p); v/=p; } } if(v>1) out.push(v); return out; }
function factorPairs(n){ var out=[],a=Math.abs(n); for(var i=1;i*i<=a;i++){ if(a%i===0) out.push([i,a/i]); } return out; }
function isSquare(n){ if(n<0) return false; var r=Math.round(Math.sqrt(n)); return r*r===n; }

/* seeded rng - so a sweep can be reproduced. Scrambled before first draw,
   because an xorshift seeded with a small integer emits a near-linear ramp. */
function makeRng(seed){
  var s = (seed>>>0) || 1;
  s ^= 0x9E3779B9; s = Math.imul(s ^ (s>>>16), 0x85EBCA6B) >>> 0;
  s = Math.imul(s ^ (s>>>13), 0xC2B2AE35) >>> 0; s ^= s>>>16;
  return function(){ s ^= s<<13; s>>>=0; s ^= s>>>17; s ^= s<<5; s>>>=0; return s/4294967296; };
}
function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
function irange(rng, lo, hi){ return lo + Math.floor(rng()*(hi-lo+1)); }

/* =========================================================================
   EXPRESSION PRINTING - one place, so two surfaces cannot disagree
   ========================================================================= */
function sqTerm(a){ return a===1?'x<sup>2</sup>' : a===-1?'−x<sup>2</sup>' : num(a)+'x<sup>2</sup>'; }
function linear(m,k){
  var head = (m===1?'x' : m===-1?'−x' : num(m)+'x');
  if(Math.round(k*1e6)/1e6===0) return head;
  return head + signed(k);
}
function quad(a,b,c){
  var bb=Math.round(b*1e6)/1e6, cc=Math.round(c*1e6)/1e6, s='';
  if(a!==0) s = sqTerm(a);
  if(bb!==0){
    if(s==='') s = (bb===1?'x' : bb===-1?'−x' : num(bb)+'x');
    else       s += (bb<0?' − ':' + ') + (Math.abs(bb)===1?'x':num(Math.abs(bb))+'x');
  }
  if(cc!==0){ if(s==='') s = num(cc); else s += signed(cc); }
  return s===''?'0':s;
}
function quadText(a,b,c){ return quad(a,b,c).replace(/<sup>2<\/sup>/g,'²').replace(/<[^>]+>/g,''); }

/* an INGOT is m·x + k. A plain number is {m:0,k:n}. */
function ingotHtml(g){
  if(g.m===0) return num(g.k);
  if(g.k===0) return (g.m===1?'x':(g.m===-1?'−x':num(g.m)+'x'));
  return linear(g.m,g.k);
}
function ingotText(g){ return ingotHtml(g).replace(/<[^>]+>/g,''); }
/* An irreducible POLYNOMIAL is stored with m=0,k=0 and a label, so keying on
   m|k alone collapsed x²+4, x²+7 and every other pure polynomial into one
   yard chip that then counted upward as if it were the same metal. */
function ingotKey(g){ return g.label ? ('poly|'+g.label) : (g.m+'|'+g.k); }
/* product of a list of ingots -> {a,b,c}. Degree above 2 returns null. */
function ingotProduct(list){
  var poly = [1];                          /* coefficients, ascending powers */
  for(var i=0;i<list.length;i++){
    var g=list[i], next=[];
    for(var j=0;j<poly.length+1;j++) next[j]=0;
    for(var j2=0;j2<poly.length;j2++){
      next[j2]   += poly[j2]*g.k;
      next[j2+1] += poly[j2]*g.m;
    }
    poly = next;
    while(poly.length>1 && poly[poly.length-1]===0) poly.pop();
  }
  if(poly.length>3) return {overflow:true, degree:poly.length-1};
  return {a: poly[2]||0, b: poly[1]||0, c: poly[0]||0};
}

/* =========================================================================
   THE SMELTING ENGINE.
   The only thing on this page that factors. Nothing that DISPLAYS a
   factorisation is permitted to compute one of its own.
   ========================================================================= */
function reduceFrac(n,d){ var s=(d<0?-1:1); n*=s; d*=s; var g=gcd(n,d)||1; if(g===0) g=1; return {n:n/g,d:d/g}; }

MF.smeltPoly = function(a,b,c){
  var res = {a:a,b:b,c:c, kind:null, g:1, ingots:null};
  if(!isInt(a)||!isInt(b)||!isInt(c)){
    res.kind='pure'; res.nonInteger=true;
    /* THIS BRANCH IS THE DIAL'S ENTIRE WORKING RANGE - every half-step lands
       here - and it used to hand back roots only when a!==0 AND disc>0. So a
       linear lump denied its own root at every dial position (492 lumps x 4
       positions = 1,968 false denials), and a perfect square with a
       non-integer c was denied its repeated root. The earlier fix added roots
       to the INTEGER linear path, which this early return never reaches:
       35% of the falsehood removed, 65% left. */
    var dd=b*b-4*a*c; res.disc=dd;
    if(a===0){
      if(b!==0) res.realRoots=[-c/b];
      else res.constantOre=true;
    } else if(dd>0){
      res.realRoots=[(-b+Math.sqrt(dd))/(2*a),(-b-Math.sqrt(dd))/(2*a)];
    } else if(dd===0){
      res.realRoots=[-b/(2*a)];               /* repeated, but still a root */
    }
    return res;
  }
  /* a constant is not ore: gcdAll([0,c]) is c, so smeltPoly(0,0,7) reported a
     Common Vein and the dial claimed a whole-number seam through a prime */
  if(a===0 && b===0){
    res.constantOre = true;
    res.kind = (Math.abs(c)>1 && !isPrime(c)) ? 'shared' : 'pure';
    return res;
  }
  if(a===0){
    var gl = gcdAll([b,c])||1; if(b<0) gl=-gl;
    res.linearOre = true; res.g = gl;
    /* A LINEAR LUMP HAS A ROOT, and the Decimal Dial was denying it.
       realRoots was only ever populated for a !== 0, so the dial told a student
       that 12x + 17 has no seam "on decimals either" - false: it runs at
       -17/12. That is a mathematical falsehood printed by the one instrument
       whose whole job is the difference between whole numbers and decimals. */
    if(b !== 0) res.realRoots = [-c/b];
    res.kind = (Math.abs(gl)>1) ? 'shared' : 'pure';
    res.ingots = [{m:0,k:gl},{m:b/gl,k:c/gl}];
    if(Math.abs(gl)===1) res.ingots=[{m:b,k:c}];
    return res;
  }
  var g = gcdAll([a,b,c])||1; if(a<0) g=-g;
  var A=a/g, B=b/g, C=c/g;
  res.g=g; res.A=A; res.B=B; res.C=C;
  var disc = B*B-4*A*C; res.disc=disc;

  if(isSquare(disc)){
    var s=Math.round(Math.sqrt(disc));
    var f1=reduceFrac(-B+s, 2*A), f2=reduceFrac(-B-s, 2*A);
    var i1={m:f1.d, k:-f1.n}, i2={m:f2.d, k:-f2.n};
    res.ingots = (g===1) ? [i1,i2] : [{m:0,k:g}, i1, i2];
    /* a twin seam is TWO SQUARES with a minus and no middle term - not
       "A must be 1". 4x^2 - 25 is a twin seam. */
    if(B===0 && C<0 && isSquare(A) && isSquare(-C)) res.kind='twin';
    else if(A===1)                                  res.kind='plain';
    else                                            res.kind='loaded';
    if(C===0) res.kind='shared';                  /* every term still carries an x */
    if(Math.abs(g)!==1){ res.coreKind=res.kind; res.kind='shared'; }
    if(A===1 && res.kind!=='shared'){ res.p=-f1.n/f1.d; res.q=-f2.n/f2.d; }
  } else {
    res.kind = (Math.abs(g)!==1) ? 'shared' : 'pure';
    if(Math.abs(g)!==1) res.ingots=[{m:0,k:g},{m:0,k:0}];  /* core stays ore */
    res.pureCore = true;
    if(disc>0) res.realRoots=[(-B+Math.sqrt(disc))/(2*A),(-B-Math.sqrt(disc))/(2*A)];
  }
  return res;
};

/* readable factorisation, straight off the engine */
MF.smeltString = function(res){
  if(!res || !res.ingots) return null;
  var parts = res.ingots.map(function(g){
    if(g.m===0) return num(g.k);
    if(g.k===0) return (g.m===1?'x':num(g.m)+'x');
    return '('+linear(g.m,g.k)+')';
  });
  if(res.ingots.length===2 && parts[0]===parts[1] && parts[0].charAt(0)==='(') return parts[0]+'<sup>2</sup>';
  return parts.join('');
};

/* =========================================================================
   BREAKING - THE MINE'S ONE MOVE.

   You name ONE factor and swing. Either the seam runs and the lump comes
   apart into that factor and what is left, or the pick glances off. What is
   left goes straight back on the anvil, so factoring 60 and factoring
   x² − 5x + 6 are the SAME REPEATED ACT rather than two methods that happen
   to share a word.

   The mine does not pour and does not multiply back in front of a student:
   that is the forge's move and it is distribution. Here the only signal is
   whether the rock came apart.

   NOTHING IN HERE JUDGES A STUDENT. Every `why` describes the rock.
   `reason` is a code for the checks, never shown.
   ========================================================================= */

/* a piece that has lost its x is a number again, not a polynomial with two
   zeroes in it - or isNative would ask smeltPoly about a constant, and the
   anvil would offer an x-shaped pick to something with no x in it */
function asOre(a,b,c){
  return (a===0 && b===0) ? {kind:'number', n:c} : {kind:'poly', a:a, b:b, c:c};
}
MF.asOre = asOre;

/* CAN THIS BE BROKEN FURTHER? That is the whole of it. A prime and an
   irreducible polynomial answer the same way, because they are the same
   object - which is the one idea this site exists to carry. */
MF.isNative = function(ore){
  if(!ore) return false;
  if(ore.kind==='number') return isPrime(ore.n);
  /* a constant wearing polynomial clothes: smeltPoly calls {0,0,1} 'pure',
     and 1 is not an element - it is nothing at all */
  if(ore.a===0 && ore.b===0) return isPrime(ore.c);
  return MF.smeltPoly(ore.a, ore.b, ore.c).kind === 'pure';
};

/* the coefficients of any piece, number or polynomial */
function oreCoeffs(o){ return o.kind==='number' ? {a:0,b:0,c:o.n} : {a:o.a,b:o.b,c:o.c}; }

/* MULTIPLY TWO PIECES BACK TOGETHER.
   NOT ingotProduct. An irreducible quadratic is stored as an ingot with
   m:0,k:0 and a label - which is what the YARD needs and what ingotProduct
   multiplies to ZERO. Every piece that comes off the anvil can be quadratic,
   so arithmetic on pieces goes through here and never through ingotProduct.
   The check found this on its first run: 2x² + 10x refused its own factor. */
MF.oreMul = function(l, r){
  var L=oreCoeffs(l), R=oreCoeffs(r);
  var p=[L.c,L.b,L.a], q=[R.c,R.b,R.a], out=[0,0,0,0,0];
  for(var i=0;i<3;i++) for(var j=0;j<3;j++) out[i+j] += p[i]*q[j];
  if(out[3]||out[4]) return {overflow:true, degree:(out[4]?4:3)};
  return {a:out[2], b:out[1], c:out[0]};
};
MF.oreSame = function(prod, ore){
  var w = oreCoeffs(ore);
  return !prod.overflow && prod.a===w.a && prod.b===w.b && prod.c===w.c;
};

/* the ingot a piece becomes once it is set aside in the yard. An irreducible
   POLYNOMIAL carries its label, matching what the yard has always stored
   (ingotKey). NEVER use the result for arithmetic - see MF.oreMul. */
