  svg.appendChild(S('path',{d:'M104 156 q-32 2 -58 12 q26 8 58 8 Z',fill:'url(#'+aid+'horn)',
    stroke:'#20262C','stroke-width':'2','stroke-linejoin':'round'}));
  /* the light running along the top of the horn */
  svg.appendChild(S('path',{d:'M100 158 q-30 3 -52 10',fill:'none',stroke:'#CBD5DF','stroke-width':'2.5',
    opacity:'.42','stroke-linecap':'round'}));
  svg.appendChild(S('path',{d:'M112 154 h150 l0 16 h-150 Z',fill:'url(#'+aid+'face)',
    stroke:'#20262C','stroke-width':'2','stroke-linejoin':'round'}));
  /* THE FACE IS THE LIT PLANE: a hard specular along its top edge and a dark
     line where it overhangs the waist. Those two together are what make a
     rectangle read as a slab with a thickness. */
  svg.appendChild(S('rect',{x:114,y:154.5,width:146,height:2.5,fill:'#EAF1F8',opacity:'.65'}));
  svg.appendChild(S('rect',{x:112,y:168,width:150,height:2.5,fill:'#161B20',opacity:'.5'}));
  /* the hardy hole, with a lip on it so it reads as a hole and not a sticker */
  svg.appendChild(S('rect',{x:232,y:158,width:11,height:9,rx:1,fill:'#161B20'}));
  svg.appendChild(S('path',{d:'M232 158 h11',fill:'none',stroke:'#20262C','stroke-width':'2.5',opacity:'.85'}));

  /* THE LUMP IS NOT DRAWN INSIDE THIS SVG ANY MORE.
     It used to be a polygon with an SVG <text> on it, and that could not be
     what the user asked for on 2026-09-04: "the ore should be on top of the
     anvil, and its text should change as different [tools] are applied and
     unapplied". An SVG <text> cannot carry the coloured spans an instrument's
     re-spelling is made of (MF.oreDisplay), and it paints with `fill` while
     inheriting the `color` a contrast sweep reads (VERIFICATION s59).

     So the ore on the anvil is MF.oreRock - the same drawn lump the seam and
     the cart already show, with the expression cut into the stone as HTML
     pinned over it - mounted below, over the anvil's face. It still carries
     the class `anvilrock`, so the squash and the shatter find it unchanged. */

  /* ---- THE HAMMER: upright, face down, standing over the work ----
     The pivot is the hand at (176,10). Positioning lives on this outer mount;
     the animation goes on the inner group, per MF.ANIM_TRANSFORM_CLASSES. */
  /* ---- THE HAMMER GETS ITS OWN LAYER, OVER THE ORE ----

     USER, 2026-09-05: "On the breaking floor, the hammer animation needs to be
     in front of the ore but behind the sound text."

     It used to be drawn inside the scene's own svg, which put it UNDER the
     stone: the ore is HTML pinned over the drawing (§26b, because an SVG
     <text> cannot carry a lens's coloured spans), and HTML with a z-index
     always paints over the svg it sits on. So the head came down BEHIND the
     lump it was hitting.

     A second svg, absolutely over the first and sharing its viewBox, fixes the
     order without moving a coordinate: the transform-origin at (176,10) is in
     the viewBox's own units, so the arc is identical.

     back to front: the anvil, the stone, the hammer, the burst.
       .anvilmount  z 2
       .hammerlayer z 3
       .thud        z 4  */
  var hamLayer = S('svg',{class:'hammerlayer', viewBox:'0 0 '+W+' '+VH,'aria-hidden':'true'});
  var mount = S('g',{});
  var ham = S('g',{class:'hammerswing'});
  /* the haft: a timber CYLINDER, so the shading runs across it rather than
     down it - a light edge, a body, and a shadowed far side */
  ham.appendChild(S('path',{d:'M170 12 l12 0 l3 88 l-18 0 Z',fill:'url(#'+aid+'haft)',
    stroke:'#3C2C1B','stroke-width':'2','stroke-linejoin':'round'}));
  ham.appendChild(S('path',{d:'M172.5 14 l1.6 84',fill:'none',stroke:'#D6AE7C','stroke-width':'2',
    opacity:'.45','stroke-linecap':'round'}));
  /* the head: a forged block, shaded across its length, with a bevel where the
     top face turns over into the side */
  ham.appendChild(S('path',{d:'M148 98 h56 l6 8 l0 14 l-6 8 h-56 l-6 -8 l0 -14 Z',
    fill:'url(#'+aid+'head)',stroke:'#20262C','stroke-width':'2.5','stroke-linejoin':'round'}));
  ham.appendChild(S('path',{d:'M146 101 h60',fill:'none',stroke:'#C4CED8','stroke-width':'2.5',opacity:'.4'}));
  ham.appendChild(S('path',{d:'M144 124 h64',fill:'none',stroke:'#161B20','stroke-width':'3',opacity:'.42'}));
  /* the eye, where the haft passes through - sunk, so it gets a lip */
  ham.appendChild(S('rect',{x:167,y:100,width:18,height:8,rx:2,fill:'#161B20'}));
  ham.appendChild(S('path',{d:'M167.5 108.5 h17',fill:'none',stroke:'#8A96A2','stroke-width':'1.6',opacity:'.5'}));
  /* THE STRIKING FACE, flared and light: the side that meets the anvil, and
     the brightest thing on the hammer because it is the polished one */
  ham.appendChild(S('path',{class:'hface',d:'M140 122 h64 l-4 10 h-56 Z',fill:'url(#'+aid+'face)',
    stroke:'#20262C','stroke-width':'2.5','stroke-linejoin':'round'}));
  ham.appendChild(S('path',{d:'M143 130 h58',fill:'none',stroke:'#F2F7FB','stroke-width':'2',opacity:'.5'}));
  /* a cross-peen off the back, so it reads as a forging hammer and not a brick */
  ham.appendChild(S('path',{d:'M204 102 l22 6 l0 8 l-22 6 Z',fill:'url(#'+aid+'peen)',
    stroke:'#20262C','stroke-width':'2.5','stroke-linejoin':'round'}));
  mount.appendChild(ham);
  hamLayer.appendChild(mount);

  wrap.appendChild(svg);
  /* the hammer goes on AFTER the stone below, so the DOM order and the
     z-index say the same thing */

  /* ---- THE ORE, STANDING ON THE ANVIL FACE ----

     `.anvilmount` is the POSITIONING - an absolute box pinned over the anvil's
     face in percentages of the scene's own viewBox - and the lump inside it is
     what ANIMATES. Position on the outer mount, animate the inner: the rule
     s5g exists for, and the reason the stone does not fly off the anvil the
     instant it is struck.

     If `opts.piece` is given, the lump is LIVE: a `.piece` carrying data-piece,
     so the belt's drag and MF.pieceAt reach it exactly as they reach a piece
     lying on the floor, and a click on it brings the hammer. Without it the
     scene is what it always was - scenery, and inert. */
  var seat = E('div','anvilmount');
  var pc = op.piece || null;
  var nat = MF.isNative(ore);
  var rock = MF.oreRock(ore, {native:nat});
  rock.classList.add('anvilrock');
  if(op.shatter) rock.classList.add('shatter');
  if(pc){
    var hit = E('button','piece anvilore ' + (nat ? 'native' : 'rock')); hit.type='button';
    hit.setAttribute('data-piece', pc.id);
    hit.setAttribute('aria-label', MF.oreDisplayText(ore) +
      ' — on the anvil. Click it to bring the hammer down on it.');
    if(MF.state.armedTool) hit.setAttribute('data-tooldrop','open');
    on(hit,'click',function(){
      /* AN INSTRUMENT IN HAND GOES ON THE ROCK, and does not also swing.
         One click, one act - the same rule the floor pieces follow. */
      if(MF.state.armedTool){
        var k = MF.state.armedTool; MF.state.armedTool = null;
        MF.applyTool(k, pc.id);
        return;
      }
      MF.openHammer(MF.state.anvil, hit);
    });
    hit.appendChild(rock);
    seat.appendChild(hit);
    /* AND THE WAY AN INSTRUMENT COMES OFF AGAIN (s23), on the stone itself. */
    var tl = pc.tool && MF.hasTool(pc.tool) ? MF.TOOLS[pc.tool] : null;
    if(tl){
      var slot = E('button','toolslot filled onanvil'); slot.type='button';
      slot.setAttribute('data-piece', pc.id);
      slot.innerHTML = '<span class="si">' + tl.ic + '</span><span class="sx">&times;</span>';
      slot.setAttribute('aria-label', tl.nm + ' is on ' + MF.oreText(ore) + '. Take it off.');
      slot.title = 'Take the ' + tl.nm + ' off';
      on(slot,'click',function(e){ e.stopPropagation(); MF.clearTool(ore, pc); });
      seat.appendChild(slot);
    }
  } else {
    seat.appendChild(rock);
  }
  wrap.appendChild(seat);
  wrap.appendChild(hamLayer);      /* over the stone, under the burst */
  return wrap;
};

/* what the pick is cut to by default, for the shape of lump under it */
/* THE HEAD STARTS EMPTY, with the boxes showing what they would mean if left
   that way. Pre-filling them with 1 and 0 made the resting hammer read "cut to
   (x)" - a shape nobody had chosen, sitting there looking like a suggestion. */
MF.pickDefault = function(ore){ return {m:'', k:''}; };

/* =========================================================================
   THE BREAKING FLOOR: ONE ANVIL, THE BELT OVER IT, AND THE ORE ON TOP.

   USER, 2026-09-04: "after the breaking floor has been selected from the cart,
   an anvil should appear with a tool belt above it. The ore should be on top of
   the anvil, and its text should change as different [tools] are applied and
   unapplied. Then the mouse cursor in the layer should be a hammer. When the
   mouse clicks on the ore, a pop-up box should ask what factor to hammer into
   the ore. And then it should split for this process to be repeated."

   WHAT WENT, AND WHY IT WAS IN THE WAY:

   - THE TWO-COLUMN `workpair`. One box held a row of chips and the belt; the
     other held a picture of an anvil, the type-in boxes and the swing button.
     So the anvil a student was looking at was NOT the thing their ore was on -
     the ore was a chip in the other box - and the picture was decoration
     beside the work rather than the work itself.
   - THE PERMANENT HAMMER BAR. Two number boxes, a label, an echo line, a hint
     and a button, sitting under the anvil at all times whether or not the
     student had chosen anything to hit. It is a question, and a question that
     is always on screen stops reading as one. It is asked now, once, when the
     ore is struck.
   - THE SECOND ANVIL. `endbar` drew a whole second stage for the last blow.
     There is one anvil, and the last blow lands on it like every other.

   What is here is the physical loop and nothing else: the belt you reach up
   to, the anvil you work on, the stone on it, and whatever has already come
   off it lying on the ground.
   ========================================================================= */
MF.paintBreak = function(host, B){
  var pieces = B.floor;
  var done = pieces.every(function(p){ return MF.isNative(p.ore); });

  /* THE HAMMER NEVER RESTS ON FINISHED METAL. Without this the anvil held an
     ingot and every swing came back "nothing left in that one", which reads as
     a broken control rather than as a finished piece. */
  if(!done && (B.at >= pieces.length || MF.isNative(pieces[B.at].ore))){
    for(var i=0;i<pieces.length;i++){ if(!MF.isNative(pieces[i].ore)){ B.at=i; break; } }
  }

  /* READ THE SWING FLAG ONCE, AT THE TOP, AND CLEAR IT HERE.
     It used to be consumed by the floorbox partway down this function, and the
     anvil stage - built further down still - then read it as null. So the
     burst fired and THE HAMMER NEVER MOVED. Two readers, one flag, and
     whichever ran first won. There is one stage now, but the flag is still
     read once and cleared once, because that is what made it safe. */
  var anim = B.anim;
  B.anim = null;

  /* THE INSTRUMENT RIDES WITH THE ORE. A tool dropped on a lump in the cart is
     still on it when the lump reaches the floor - it is the same object - so
     the piece takes its own tool if it has one and the ore's otherwise, and
     the ore takes the piece's back, because MF.oreDisplay reads the ORE.

     THIS RUNS OVER EVERY PIECE, BEFORE ANYTHING IS DRAWN. It used to sit inside
     the chip loop, and the lump on the anvil is not drawn by that loop any
     more - so the instrument a student put on the ore in the cart would have
     reached the chips on the ground and not the stone in front of them. */
  pieces.forEach(function(p){
    if(!p.tool && p.ore && p.ore.tool) p.tool = p.ore.tool;
    if(p.tool && p.ore) p.ore.tool = p.tool;
  });

  var fl = E('div','floorbox');
  fl.appendChild(MF.anvilArt());

  /* ---- THE BELT, ABOVE THE ANVIL ----
     It hung under the pieces before, which put a rack of instruments between
     the ore and the ground it was lying on. Over the anvil is where a belt
     hangs and where a hand reaches: you take an instrument down onto the work.
     The `reach` group measures that the belt and the stone are on one screen. */
  MF.paintBelt(fl, true);

  /* ---- THE ANVIL, AND THE ORE ON TOP OF IT ---- */
  var onIt = done ? (B.last && B.last.struck ? B.last.struck : pieces[0].ore)
                  : pieces[B.at].ore;
  var stage = E('div','anvilstage');
  if(anim) stage.setAttribute('data-anim', anim);
  /* the piece is handed in ONLY while there is something to break: it is what
     makes the stone live, and a finished lump leaves the anvil bare */
  stage.appendChild(MF.anvilScene(onIt, {shatter:done, piece: done ? null : pieces[B.at]}));
  /* THE BURST BELONGS WHERE THE HAMMER LANDS. */
  stage.appendChild(MF.thudBurst(anim));
  fl.appendChild(stage);

  if(done){
    fl.appendChild(H('div','spentnote','<b>Every piece is native metal.</b> ' +
      'Nothing in any of them comes apart further. That is the end of the lump &mdash; ' +
      'not a failure to get further into it.'));
  } else {
    B._pieceIsNum = (pieces[B.at].ore.kind === 'number');
    fl.appendChild(H('div','anvilcue','<b>Click the ore.</b> The hammer will ask what you are cutting out of it.'));
  }

  /* ---- WHAT HAS ALREADY COME OFF, LYING ON THE GROUND ----
     Only ever the pieces that are NOT on the anvil, so the stone in front of
     the student appears exactly once. A first lump has nothing down here at
     all, which is the state the user described: an anvil, a belt, and the ore
     on top of it. */
  var rest = [];
  pieces.forEach(function(p, idx){ if(done || idx !== B.at) rest.push({p:p, i:idx}); });
  if(rest.length){
    fl.appendChild(H('h4',null,'On the floor'));
    var rowf = E('div','pieces');
    rest.forEach(function(e){
      var p = e.p, idx = e.i;
      var nat = MF.isNative(p.ore);
      var cell = E('div','piececell');
      var b = E('button','piece' + (nat?' native':' rock') + (p.fresh?' fresh':''));
      b.type='button';
      b.setAttribute('data-piece', p.id);
      /* THE INSTRUMENT RE-SPELLS THE PIECE ITSELF, in the chip, where the
         expression already was. Nothing is drawn beside it. */
      b.appendChild(H('span','pv', MF.oreDisplay(p.ore)));
      b.appendChild(H('span','pt', nat ? 'native metal' : 'still rock'));
      b.setAttribute('aria-label', MF.oreDisplayText(p.ore) + (nat
        ? ' — native metal. Nothing in it comes apart.'
        : ' — still rock. Click it to put it on the anvil.'));
      if(MF.state.armedTool) b.setAttribute('data-tooldrop','open');
      on(b,'click',function(){
        if(MF.state.armedTool){
          var k = MF.state.armedTool; MF.state.armedTool = null;
          MF.applyTool(k, p.id);
          return;
        }
        /* A PIECE ON THE GROUND GOES ON THE ANVIL. It does not also open the
           hammer: picking a rock up and deciding what to hit it with are two
           acts, and running them together would ask the question about a stone
           the student had not yet seen sitting on the anvil. */
        if(nat) B.last = {ok:false, native:true,
          why:'Nothing left in that one. ' + MF.oreText(p.ore) + ' does not come apart — it is an element.'};
        else { B.at = idx; B.last = null; }
        /* only the floor moved: nothing in the wall, the cart or the yard
           changed because a different piece went under the hammer */
        MF.repaint(['work']);
        MF.knockPiece(p.id);
      });
      cell.appendChild(b);
      var t = p.tool && MF.hasTool(p.tool) ? MF.TOOLS[p.tool] : null;
      if(t){
        var slot = E('button','toolslot filled'); slot.type='button';
        slot.setAttribute('data-piece', p.id);
        slot.innerHTML = '<span class="si">' + t.ic + '</span><span class="sx">&times;</span>';
        slot.setAttribute('aria-label', t.nm + ' is on ' + MF.oreText(p.ore) + '. Take it off.');
        slot.title = 'Take the ' + t.nm + ' off';
        on(slot,'click',function(ev){ ev.stopPropagation(); MF.clearTool(p.ore, p); });
        cell.appendChild(slot);
      }
      rowf.appendChild(cell);
    });
    fl.appendChild(rowf);
  }
  host.appendChild(fl);

  /* ---- what the last swing did. A description of the rock, every time ---- */
  if(B.last){
    if(B.last.ok){
      host.appendChild(H('div','note good','<b>The seam runs.</b> <b>' + MF.oreLabel(B.last.left) +
        '</b> came out of it, and <b>' + MF.oreLabel(B.last.right) + '</b> is what was left behind.'));
      /* the auger traces the division it just watched run */
      if(MF.hasTool('auger')) MF.augerTrace(host, B.last);
      /* the rail, if it is on the belt: where the x squared in that lump came from */
      var l=B.last.left, r=B.last.right, flat = function(o){ return o.kind==='number' || o.a===0; };
      if(MF.hasTool('shifter') && flat(l) && flat(r))
        MF.paintShifterRail(host, MF.oreToIngot(l), MF.oreToIngot(r));
    } else {
      host.appendChild(H('div','note','<b>' + B.last.why + '</b>' +
        (B.last.swung ? ' The hammer was cut to <b>' +
            (B.last.swung.m===0 ? num(B.last.swung.k) : '(' + ingotHtml(B.last.swung) + ')') + '</b>.' : '') +
        (B.last.native ? '' : ' Nothing is lost &mdash; the rock is exactly as it was, and you can swing again.')));
    }
  }

  /* ---- the ways off the floor. Always at least one. ---- */
  var exits = E('div','row'); exits.style.marginTop='14px';
  if(done){
    var carry = E('button','btn primary','Carry the metal to the yard'); carry.type='button';
    on(carry,'click',function(){ MF.tipFloor(B, 'Native metal on the rack.'); });
    exits.appendChild(carry);
  } else {
    var tip = E('button','btn primary','Tip what you have in the yard'); tip.type='button';
    on(tip,'click',function(){ MF.tipFloor(B, 'Tipped in the yard. The rock is still there when you want it.'); });
    exits.appendChild(tip);
    exits.appendChild(H('div','hint','Metal goes on the rack, rock goes on the heap. The heap can be broken later.'));
  }
  var leave = E('button','btn','Leave it for now'); leave.type='button';
  leave.style.background='#241D18'; leave.style.color='#E4D5BB'; leave.style.borderColor='#6B5B48';
  /* the floor is NOT thrown away - the anvil is keyed to this lump, so picking
     it up again puts every piece back exactly where it was left */
  on(leave,'click',function(){ MF.state.selected = null; MF.repaint(['cart','work']); });
  exits.appendChild(leave);
  host.appendChild(exits);
};

/* =========================================================================
   THE HAMMER, ASKED FOR ONCE.

   USER: "When the mouse clicks on the ore, a pop-up box should ask what factor
   to hammer into the ore. And then it should split for this process to be
   repeated."

   Everything in here was on the bench permanently until this commit: the two
   number boxes, the echo of what the head is cut to, the line about an empty
   x-part meaning one, and the swing itself. None of it is new and none of it
   changed - what changed is WHEN it is on screen. A question that is always
   showing is not being asked.

   IT CLOSES BEFORE IT SWINGS. MF.swing repaints the mine, which destroys the
   button that opened this panel; leaving the scrim up over a repainted bench
   would cover the blow the student just struck. Closing first also means one
   panel is one blow - a glance comes back as a note beside the anvil and the
   ore is still sitting there to be clicked again, which is the loop.
   ========================================================================= */
MF.openHammer = function(B, opener){
  if(!B) return;
  var t = B.floor[B.at];
  if(!t || MF.isNative(t.ore)) return;
  var ore = t.ore, isNum = ore.kind === 'number';
  /* the boxes are cut for the lump under the hammer: an x-shaped head on a
     plain number is a swing that can never land */
  if(B.rawFor !== t.id){ B.raw = MF.pickDefault(ore); B.rawFor = t.id; }
  B._pieceIsNum = isNum;

  MF._openSheet({
    label: 'The hammer, over ' + MF.oreDisplayText(ore),
    icon: '🔨',
    /* SHORT, BECAUSE THE HEAD IS 155px OF A 680px BOX AT 380px OTHERWISE.
       "What are you cutting out of it?" wrapped to three lines beside a
       three-line close button, and between them they were most of the reason
       the swing button fell below the fold of a dialog. This is the mine's own
       phrase for the act, and it fits on one. */
    title: 'Name one thing in it',
    sub: '<b>' + MF.oreLabel(ore) + '</b>',
    closeText: 'Put it down',
    opener: opener,
    foot: 'The rock decides, not this panel. <b>Esc</b> puts the hammer down.',
    fill: function(body){
      var cut = E('div','cutbar hammerask');
      /* NO `cutlab` HERE. The panel's own title asks the question and the row
         below labels the boxes; a third heading saying the same thing again is
         the furniture this whole redesign is taking off the floor - and on a
         phone it was 22px of the overflow the `reach` group caught. */

      /* THE ORE ITSELF, IN THE PANEL. The question is about this stone, and the
         numbers belong on it - not restated as a sentence beside it. */
      var shown = MF.oreRock(ore, {native:false});
      shown.classList.add('askrock');
      cut.appendChild(shown);

      var inner = E('div','hrow');
      inner.appendChild(H('span','hlab','cut the head to'));
      var box = E('div','hbox');
      var fire = function(e){ if(e.key==='Enter'){ e.preventDefault(); MF.closeTool(); MF.swing(B); } };
      if(!isNum){
        box.appendChild(H('span','paren','('));
        var mi = document.createElement('input'); mi.type='text'; mi.inputMode='numeric';
        mi.value = B.raw.m; mi.placeholder = '1';
        mi.setAttribute('aria-label','how many x — leave it empty for a single x, or put 0 for a plain number');
        on(mi,'input',function(){ B.raw.m = mi.value; MF.echoHammer(B); });
        on(mi,'keydown',fire);
        box.appendChild(mi);
        box.appendChild(H('span','paren','x +'));
      }
      var ki = document.createElement('input'); ki.type='text'; ki.inputMode='numeric';
      ki.value = B.raw.k; ki.placeholder = '0';
      ki.setAttribute('aria-label', isNum ? 'the number you are taking out' : 'the number on the end');
      on(ki,'input',function(){ B.raw.k = ki.value; MF.echoHammer(B); });
      on(ki,'keydown',fire);
      box.appendChild(ki);
      if(!isNum) box.appendChild(H('span','paren',')'));
      inner.appendChild(box);
      cut.appendChild(inner);

      var echo = E('div','hecho');
      cut.appendChild(echo);
      B._echo = echo;
      MF.echoHammer(B);

      cut.appendChild(H('div','hint', isNum
        ? 'A whole number that runs through it.'
        : 'An empty x-part is a single x. Put 0 there to take out a plain number instead.'));

      var swr = E('div','row swingrow'); swr.style.marginTop='10px';
      var sw = E('button','btn primary big swingbtn','Bring the hammer down'); sw.type='button';
      on(sw,'click',function(){ MF.closeTool(); MF.swing(B); });
      swr.appendChild(sw);
      cut.appendChild(swr);

      /* THE PAIR SCANNER IS NOT FREE. It is the Core Drill's reading, held to
         the piece you chose - a list of every pair sitting permanently under
         the lump did the looking for you. Without the drill you are not stuck:
         you name something and swing. */
      if(!MF.hasTool('drill'))
        cut.appendChild(H('div','hint','<span style="opacity:.8">A core drill would read the pairs out of this one.</span>'));

      body.appendChild(cut);
    }
  });
  /* AND THE CURSOR LANDS IN THE BOX. The panel opened because the student
     clicked the ore meaning to hit it; the next thing they do is type. */
  var first = MF._sheet && MF._sheet.sheet.querySelector('.hbox input');
  if(first) first.focus();
};

/* THE SWING. The only thing in the mine that decides anything, and all it
   decides is whether the rock came apart. */
MF.swing = function(B){
  var t = B.floor[B.at];
  if(!t || MF.isNative(t.ore)) return;
  var isNum = t.ore.kind==='number';
  var m = isNum ? 0 : MF.readPickM(B.raw.m);
  var k = MF.readInt(B.raw.k);
  B.swings++;
  if(!isFinite(m) || !isFinite(k)){
    B.last = {ok:false, why:'A hammer is cut to a whole shape. Those boxes only take whole numbers.'};
    B.anim = 'glance';
    MF.repaint(['work']); return;
  }
  var r = MF.breakOff(t.ore, {m:m, k:k});
  if(!r.ok){
    /* WHAT WAS ACTUALLY SWUNG, on every refusal. A student who meant one shape
       and cut another has to be able to see the difference; being told "6 does
       not run through every term" when you typed x + 6 reads as the mine being
       wrong about arithmetic. */
    B.last = {ok:false, why:r.why, reason:r.reason, swung:{m:m, k:k}};
    B.anim = 'glance';
    MF.repaint(['work']); return;
  }
  var a = {ore:r.left, id:++B.seq, fresh:true}, b2 = {ore:r.right, id:++B.seq, fresh:true};
  B.floor.splice(B.at, 1, a, b2);
  B.last = {ok:true, why:r.why, left:r.left, right:r.right, struck:t.ore};
  /* the pick moves itself to the next thing that is still rock */
  var nx = -1;
  for(var i=0;i<B.floor.length;i++){ if(!MF.isNative(B.floor[i].ore)){ nx=i; break; } }
  if(nx >= 0) B.at = nx;
  B.rawFor = null;
  B.anim = 'hit';
  /* THE STATE CHANGES NOW AND THE PICTURE CATCHES UP.
     The splice and the repaint stay synchronous, because MF.playthrough and
     the `break` and `inplace` groups all read the floor the instant swing()
     returns - deferring it to the moment of impact would have made every one
     of them read a floor that had not moved yet. The sequence a student sees
     is built out of animation-delay instead: the hammer falls, the burst lands
     at 260ms, and the new pieces are held back to arrive with it. */
  /* the floor changed and nothing else did: the lump is still the same lump
     in the cart, the wall is untouched, and nothing has reached the yard */
  MF.repaint(['work']);
  /* 2500ms, not 900: .piece.fresh is delayed to 1740ms (the beat) and runs for
     420ms, and it is animation-fill-mode:backwards that keeps the piece
     invisible until then. Strip the class early and the piece appears at 900ms
     - mid-upswing, before the hammer has come down on it. */
  setTimeout(function(){ a.fresh=false; b2.fresh=false; }, 2500);
};

/* THE AUGER'S TRACE: the division, after it has run. Not a hint - the swing
   has already landed and the answer is on screen. What this adds is WHY it
   landed, term by term, which is the part a loaded lump hides. */
MF.augerTrace = function(host, last){
  var l = last.left, r = last.right;
  if(l.kind==='number' || r.kind==='number') return;   /* nothing to trace on a plain metal */
  var lm = l.a===0 ? l.b : 0, lk = l.a===0 ? l.c : 0;
  var rm = r.a===0 ? r.b : 0, rk = r.a===0 ? r.c : 0;
  if(!lm || !rm) return;
  var box = E('div','panel'); box.style.background='#fff'; box.style.margin='10px 0 0';
  box.appendChild(H('div','panel-tag','&#128295; THE AUGER &mdash; HOW IT RAN'));
  var t = E('table','scan');
  var hr = E('tr'); ['this part of the rock','came from','which is'].forEach(function(h){ hr.appendChild(E('th',null,h)); });
  t.appendChild(hr);
  [['the x²', xt2(lm)+' × '+xt2(rm), (lm*rm===1?'x²':num(lm*rm)+'x²')],
   ['the end', num(lk)+' × '+num(rk), num(lk*rk)],
   ['the middle', xt2(lm)+' × '+num(rk)+'  and  '+num(lk)+' × '+xt2(rm),
    xt2(lm*rk)+' and '+xt2(lk*rm)+', which run together as '+xt2(lm*rk+lk*rm)]
  ].forEach(function(row){
    var tr = E('tr');
    tr.appendChild(H('td',null,'<b>'+row[0]+'</b>'));
    tr.appendChild(E('td',null,row[1]));
    tr.appendChild(H('td',null,'<b>'+row[2]+'</b>'));
    t.appendChild(tr);
  });
  box.appendChild(t);
  box.appendChild(H('div','hint','The ends were forced. The middle is the part that had to be checked, and it checked out.'));
  host.appendChild(box);
};

/* MF.glanceOff is gone. It shuddered the whole input bar to say a swing had
   not landed, which was the best a row of text boxes could do. The hammer
   bounces off the anvil and the burst reads CLANG! now - the refusal is
   performed where the swing happened, so a class on a panel is not needed. */

/* every click on a piece is answered, the same rule as the lumps in the seam */
MF.knockPiece = function(id){
  var host = MF._mine && MF._mine.root;
  var el = host && host.querySelector('.piece[data-piece="'+id+'"]');
  if(!el) return;
  el.classList.remove('knock'); void el.getBoundingClientRect();
  el.classList.add('knock');
  setTimeout(function(){ el.classList.remove('knock'); }, 320);
};

/* THE FLOOR GOES IN THE YARD: metal on the rack, rock on the heap. Rock is
   never destroyed and never counted - it is ore you have not finished with,
   and the heap is where you left it. */
/* ONE PLACE DECIDES RACK OR HEAP. Native metal is racked and the forge can
   spend it; anything still carrying a seam goes on the heap and can be broken
   later. Both routes into the yard - tipping the breaking floor, and sending a
   lump straight out of the cart - call this, so the rule cannot be true in one
   of them and wrong in the other. */
MF.stow = function(ore, from){
  if(MF.isNative(ore)){ MF.addToYard(MF.oreToIngot(ore), from || null); return 'rack'; }
  MF.state.rockpile.push(ore); return 'heap';
};
MF.tipFloor = function(B, why){
  /* WHAT THESE PIECES CAME OUT OF is the lump that landed on the bench, not
     the piece itself - a bar's origin is the rock it was broken from, and by
     the time it reaches the rack that rock no longer exists anywhere else. */
  var from = B && B.ore ? MF.oreText(B.ore) : null;
  B.floor.forEach(function(p){ MF.stow(p.ore, from); });
  MF.finishLump(B, why);
};

/* STRAIGHT FROM THE CART TO THE YARD, without touching the bench. Digging and
   stockpiling used to be one route with a workbench in the middle of it: the
   only way to put a lump down was to pick it up, and on a lump you did not
   want to work yet that is a hurdle with nothing on the other side of it. */
MF.cartToYard = function(id){
  var ore = null;
  MF.state.cart.forEach(function(o){ if(o.id===id) ore = o; });
  if(!ore) return false;
  var where = MF.stow(ore);
  MF.state.cart = MF.state.cart.filter(function(o){ return o.id!==id; });
  /* if it was the lump on the bench, the bench goes with it */
  if(MF.state.selected && MF.state.selected.id===id){ MF.state.selected = null; MF.state.anvil = null; }
  /* rack or heap, and it left the cart - the wall did not move */
  MF.repaint(['cart','yard','work']);
  MF.flash(where==='rack'
    ? MF.oreText(ore) + ' is native metal — racked in the yard.'
    : MF.oreText(ore) + ' still has a seam in it. On the heap, ready when you are.');
  return true;
};
/* THE X-PART BOX IS NOT THE NUMBER BOX, AND EMPTY DOES NOT MEAN ZERO IN IT.

   An empty CONSTANT box means "no constant", which is nought. An empty X-PART
   box means the student wrote no coefficient in front of the x — and that is
   ONE, exactly as x means 1x everywhere else in mathematics.

   Read as nought, clearing that box turned a swing at (x + 6) into a swing at
   6, refused it, and reported "6 does not run through every term" about a
   bracket the student had typed and the mine had never seen. It was reported
   as a maths error, and from where the student sat it was one: they swung a
   true factor of 3x² + 22x + 24 and were told it was not one.

   'x' and '-x' are read too, because a student who types what they mean has
   not made a mistake. */
MF.readPickM = function(raw){
  var s = String(raw==null?'':raw).trim().replace(/[−–—]/g,'-').replace(/[xX]/g,'');
  if(s==='' || s==='+') return 1;
  if(s==='-') return -1;
  return MF.readInt(s);
};
MF.readInt = function(raw){
  var s = String(raw||'').trim().replace(/[−–—]/g,'-');
  if(s===''||s==='-') return 0;
  if(!/^-?\d+$/.test(s)) return NaN;
  return parseInt(s,10);
};
function xt2(k){ if(k===0) return '0'; if(k===1) return 'x'; if(k===-1) return '−x'; return num(k)+'x'; }

/* THE SHIFTER'S POWER: the four products, named and traced, so x·x becoming x²
   is watched rather than asserted.
   TAKES TWO INGOTS DIRECTLY. It used to read B.slots and repaint into a host
   it had cached - both of which belonged to a crucible that no longer exists.
   On the breaking floor the two things it traces are the two pieces a swing
   just made, so it is handed them. */
MF.paintShifterRail = function(host, s1, s2){
  if(!host || !s1 || !s2) return;
  if(!isFinite(s1.m)||!isFinite(s1.k)||!isFinite(s2.m)||!isFinite(s2.k)) return;

  var rail = E('div','panel'); rail.style.background='#fff'; rail.style.margin='12px 0 0';
  rail.appendChild(H('div','panel-tag','&#8646; THE EXPONENT RAIL'));
  var parts = [
    ['x-part × x-part', xt2(s1.m)+' × '+xt2(s2.m), (s1.m*s2.m===0?'0':(s1.m*s2.m===1?'x²':num(s1.m*s2.m)+'x²')),
     'x · x = x², and this is the only place an x² can come from'],
    ['x-part × number',  xt2(s1.m)+' × '+num(s2.k), xt2(s1.m*s2.k), 'one x survives, so it lands in the middle'],
    ['number × x-part',  num(s1.k)+' × '+xt2(s2.m), xt2(s1.k*s2.m), 'one x survives, so it lands in the middle'],
    ['number × number',  num(s1.k)+' × '+num(s2.k), num(s1.k*s2.k), 'no x left at all, so it lands on the end']
  ];
  var tbl = E('table','scan');
  var hr = E('tr'); ['which two','multiplied','gives','why it lands where it does'].forEach(function(h){ hr.appendChild(E('th',null,h)); });
  tbl.appendChild(hr);
  parts.forEach(function(p,i){
    var tr = E('tr');
    if(i===1||i===2) tr.style.background = 'var(--tile-x)';
    p.forEach(function(cell,ci){ tr.appendChild(H('td',null, ci===2 ? '<b>'+cell+'</b>' : cell)); });
    tbl.appendChild(tr);
  });
  rail.appendChild(tbl);
  var mid = s1.m*s2.k + s1.k*s2.m;
  /* "−x + −8x" reads as nonsense; the two terms are named, not added in prose */
  rail.appendChild(H('div','hint','The two shaded rows are the same kind of thing, so they run together: ' +
    '<b>' + xt2(s1.m*s2.k) + '</b> and <b>' + xt2(s1.k*s2.m) + '</b> make <b>' + xt2(mid) + '</b>.'));
  host.appendChild(rail);
};

/* the decimal dial - gear. This is where integers stop being an assumption. */
MF.paintDial = function(host, B){
  var ore = B.ore;
  var d = E('div','panel'); d.style.background='#fff';
  d.appendChild(H('div','panel-tag','DECIMAL DIAL'));
  d.appendChild(H('p','hint','Nudge the last number off the whole numbers and watch what happens to the seam. The rock never changes — the <em>search</em> does.'));
  var off = 0;
  var readout = E('div'); d.appendChild(readout);
  var r = document.createElement('input');
  r.type='range'; r.min=-2; r.max=2; r.step=0.5; r.value=0;
  r.setAttribute('aria-label','Nudge the last term');
  on(r,'input',function(){ off = parseFloat(r.value); paint(); });
  d.appendChild(r);
  host.appendChild(d);
  function paint(){
    clear(readout);
    var c2 = ore.c + off;
    var res = MF.smeltPoly(ore.a, ore.b, c2);
    var clean = (res.kind!=='pure');
    readout.appendChild(H('div','eq sm', quad(ore.a, ore.b, c2)));
    var m = E('div','note ' + (clean?'good':'warn'));
    /* The dial says WHETHER a whole-number seam exists. It must never say what
       it is: printing the factorisation here put the finished answer directly
       above the pour button, which is supposed to be the only judge. */
    m.innerHTML = clean
      ? '<b>A whole-number seam runs through this one.</b> Whole ingots will land on it — though the dial is not going to tell you which.'
      : '<b>No whole-number seam.</b> ' + (res.realRoots
          ? (res.realRoots.length > 1
              ? 'The seam is real — near ' + num(Math.round(res.realRoots[0]*100)/100) + ' and ' + num(Math.round(res.realRoots[1]*100)/100) +
                ' — but those are not whole numbers, and whole ingots will never land on them.'
              : 'The seam is real — it runs at ' + num(Math.round(res.realRoots[0]*1000)/1000) +
                ' — but that is not a whole number, and whole ingots will never land on it.')
          : 'And none on decimals either.');
    readout.appendChild(m);
  }
  paint();
};

MF.scanTable = function(host, target, wanted){
  var rows = [];
  factorPairs(target).forEach(function(pr){
    var f=pr[0], s=pr[1];
    if(target>=0){ rows.push([f,s]); rows.push([-f,-s]); } else { rows.push([-f,s]); rows.push([f,-s]); }
  });
  rows = rows.filter(function(r){ return r[0]*r[1]===target; });
  var tbl = E('table','scan');
  var hr = E('tr'); ['pair','multiply to','add to'].forEach(function(h){ hr.appendChild(E('th',null,h)); });
  tbl.appendChild(hr);
  rows.forEach(function(r){
    var tr = E('tr');
    tr.appendChild(E('td',null, num(r[0]) + '  and  ' + num(r[1])));
    tr.appendChild(E('td',null, num(r[0]*r[1])));
    tr.appendChild(E('td',null, num(r[0]+r[1])));
    if(wanted!=null && r[0]+r[1]===wanted) tr.className='hit';
    tbl.appendChild(tr);
  });
  host.appendChild(tbl);
  return rows.length;
};


MF.finishLump = function(B, why){
  var id = B.ore.id;
  MF.state.cart = MF.state.cart.filter(function(o){ return o.id!==id; });
  MF.state.selected = null; MF.state.anvil = null;
  MF.state.broken++;
  /* the lump is finished: it leaves the cart, its metal reaches the yard, and
     the floor goes with it. The wall is untouched. */
  MF.repaint(['cart','yard','work']);
  MF.flash(why || 'Done.');
};
/* Flashes are QUEUED, not written straight into the column. Two of the three
   gear announcements never reached a student: grantGear flashed, and the very
   next line repainted the mine and wiped the message it had just inserted. */
MF.flashQueue = [];
/* Enqueue only - do NOT drain here. Every caller of flash() is followed by a
   repaint that clears the column, so draining immediately wrote the message
   into a panel that was about to be destroyed: two of the three gear
   announcements never reached the screen. paintMine drains at the END of a
   paint, and the timeout catches any flash with no repaint behind it. */
MF.flash = function(msg){
  MF.flashQueue.push(msg);
  setTimeout(MF.drainFlashes, 0);
};
MF.drainFlashes = function(){
  var host = MF._mine && MF._mine.mid;
  /* isConnected: MF._mine survives navigation away from the mine, so a flash
     raised off-mine drained into a detached node and emptied the queue with
     nothing reaching the page. Nothing triggers it today - flash has one call
     site, on the mine - but it is the same class as the gear announcements. */
  if(!host || !host.isConnected || !MF.flashQueue.length) return;
  MF.flashQueue.splice(0).forEach(function(msg){
    var n = H('div','note good', msg);
    host.insertBefore(n, host.firstChild);
    setTimeout(function(){ if(n.parentNode) n.parentNode.removeChild(n); }, 5200);
  });
};
/* =========================================================================
   HOLDING AN INSTRUMENT TO A PIECE OF ROCK.

   Drag a tool off the belt onto a lump, or open the lump's slot and pick one.
   The slot lights up with whatever is in it, and a panel rises with the
   reading. Both routes reach the same place: a drag with no click path is a
   control half the users cannot reach.

   THE PANEL IS A REAL DIALOG. It traps Tab, closes on Escape, and hands focus
   back to the slot it came from. A panel that steals focus and does not give
   it back leaves a keyboard user stranded on a page they cannot see.

   AND IT MUST LEAVE NOTHING BEHIND. A scrim left in the DOM covers the entire
   page and makes every control dead - the exact fault class that had the pick
   eating every click on the seam. The `sheet` group asserts it is gone.
   ========================================================================= */
MF._sheet = null;

/* ONE PLACE BUILDS THE PANEL. Three surfaces open one - a tool held to a
   lump, a tool explained off the belt, and an empty slot asking which - and
   three copies of the scrim, the focus move, the Tab trap and the Escape
   wiring is three chances for one of them to drift and quietly lose the trap.
   Callers supply the head and fill the body; everything that makes it a
   dialog lives here. */
MF._openSheet = function(o){
  MF.closeTool();                              /* never two at once */
  var scrim = E('div','scrim');
  var sheet = E('div','toolsheet');
  sheet.setAttribute('role','dialog');
  sheet.setAttribute('aria-modal','true');
  sheet.setAttribute('aria-label', o.label);
  sheet.tabIndex = -1;

  var head = E('div','tshead');
  head.appendChild(H('span','ic', o.icon));
  var ht = E('div');
  ht.appendChild(H('div','tsname', o.title));
  ht.appendChild(H('div','tsore', o.sub));
  head.appendChild(ht);
  var x = E('button','tsclose', o.closeText || 'Close'); x.type='button';
  x.setAttribute('aria-label', (o.closeText || 'Close') + ' — closes this panel');
  on(x,'click',function(){ MF.closeTool(); });
  head.appendChild(x);
  sheet.appendChild(head);

  var body = E('div','tsbody');
  try { o.fill(body); }
  catch(e){ body.appendChild(H('div','note warn','This instrument could not get a reading off that.')); }
  sheet.appendChild(body);

  var foot = E('div','tsfoot');
  foot.appendChild(H('div','hint', o.foot ||
    'Nothing here is a mark, and nothing here swings for you. Press <b>Esc</b> to put it away.'));
  sheet.appendChild(foot);

  scrim.appendChild(sheet);
  document.body.appendChild(scrim);
  /* clicking the ground outside the panel puts the instrument away */
  on(scrim,'pointerdown',function(e){ if(e.target===scrim) MF.closeTool(); });

  MF._sheet = {scrim:scrim, sheet:sheet, opener:o.opener || document.activeElement, key:o.key||null};
  sheet.focus();
  document.addEventListener('keydown', MF._sheetKeys, true);
};

MF.openTool = function(key, ore, opener, pieceId){
  var t = MF.TOOLS[key];
  if(!t || !ore) return;
  MF._openSheet({
    label: t.nm + ', held to ' + MF.oreText(ore),
    icon: t.ic, title: t.nm, sub: 'held to <b>' + MF.oreLabel(ore) + '</b>',
    closeText: 'Take it away', opener: opener, key: key,
    fill: function(body){
      var reader = MF.TOOL_READ[key];
      if(reader) reader(body, ore, pieceId);
      else body.appendChild(H('p','hint', t.ds));
    }
  });
};

MF._sheetKeys = function(e){
  if(!MF._sheet) return;
  if(e.key === 'Escape'){ e.preventDefault(); MF.closeTool(); return; }
  if(e.key !== 'Tab') return;
  /* TRAP TAB. Without this, tabbing walks out of the panel and onto the page
     behind it, which is inert to the eye and live to the keyboard. */
  var f = MF._sheet.sheet.querySelectorAll('button, a[href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if(!f.length) return;
  var first = f[0], last = f[f.length-1];
  if(e.shiftKey && (document.activeElement===first || document.activeElement===MF._sheet.sheet)){
    e.preventDefault(); last.focus();
  } else if(!e.shiftKey && document.activeElement===last){
    e.preventDefault(); first.focus();
  }
};

MF.closeTool = function(){
  var s = MF._sheet;
  if(!s) return;
  MF._sheet = null;
  document.removeEventListener('keydown', MF._sheetKeys, true);
  if(s.scrim.parentNode) s.scrim.parentNode.removeChild(s.scrim);
  /* focus goes back where it came from, if that node still exists after the
     repaints that may have happened while the panel was open */
  if(s.opener && s.opener.isConnected && s.opener.focus) s.opener.focus();
};

/* =========================================================================
   THE BELT. The instruments hang off it, and you take them off it to use
   them. It replaces a list of cards in a sidebar, which described the tools
   without ever letting you pick one up.
   ========================================================================= */
/* `atWork` is the belt hanging on the breaking floor, where it is actually
   used: no outer heading, dark labels for the dark box it sits in, and one
   short line of instruction instead of a card's worth. */
MF.paintBelt = function(host, atWork){
  var owned = MF.toolOrder().filter(MF.hasTool);
  var box = E('div', atWork ? 'gearbox atwork' : 'gearbox');
  box.appendChild(atWork ? H('div','beltlab','ON YOUR BELT') : H('h3',null,'On your belt'));

  if(!owned.length){
    var bare = E('div','beltstrap bare');
    bare.appendChild(H('div','beltempty','Bare leather. Tools are not handed out — you make them at the forge, out of metal you broke out yourself.'));
    box.appendChild(bare);
    host.appendChild(box);
    return;
  }

  box.appendChild(H('div', atWork ? 'beltnote' : 'hint', MF.state.armedTool
    ? '<b>' + MF.TOOLS[MF.state.armedTool].nm + ' is in your hand.</b> Click a rock to use it.'
    : 'Click one, then click a rock — or drag it onto one. <b>how?</b> opens the room that teaches it.'));
  var strap = E('div','beltstrap');
  owned.forEach(function(k){
    var t = MF.TOOLS[k];
    var loop = E('div','beltloop');
    var b = E('button','belttool'); b.type='button';
    b.setAttribute('data-tool', k);
    /* NO draggable="true". This whole gesture is built on POINTER events, and
       the HTML5 drag attribute makes the browser start its own native drag on
       a real mouse-down-and-move - which cancels the pointer stream the code
       is listening to. Synthetic PointerEvents never trip it, so every probe
       said the drag worked while no student could actually perform it. */
    b.appendChild(H('span','bic', t.ic));
    b.appendChild(H('span','bnm', t.nm.replace(/^The /,'')));
    /* ONE CLICK DOES IT TOO. Click the instrument to pick it up, click a rock
       to use it - the same thing the drag does. A drag with no click path is a
       control half the users cannot reach: it is the only gesture on this site
       that needs a pointer that can be held down and moved precisely, and it
       was ALSO the only way to use a tool in the cart. */
    if(MF.state.armedTool === k) b.setAttribute('data-armed','yes');
    b.setAttribute('aria-pressed', MF.state.armedTool === k ? 'true' : 'false');
    b.setAttribute('aria-label', t.nm + '. ' + t.ds +
      (MF.state.armedTool === k ? ' In your hand — click a rock to use it, or click again to put it back.'
                                : ' Click to pick it up, then click a rock. Or drag it onto one.'));
    b.title = t.ds;
    on(b,'click',function(){
      MF.state.armedTool = (MF.state.armedTool === k) ? null : k;
      /* the belt hangs in the cart AND on the floor, and arming marks the drop
         targets in both - but it changes nothing in the wall */
      MF.paintGear();
    });
    MF.dragTool(b, k);
    loop.appendChild(b);
    /* THE WAY OUT, ON THE TOOL ITSELF. The mine does not explain instruments
       any more (§20) - you drag one on and the ore changes. This is the quiet
       door to the room that teaches WHY, for a student who wants it, and it is
       small and underneath rather than a box in the way. */
    var why = E('button','beltwhy','how?'); why.type='button';
    why.setAttribute('aria-label','How does ' + t.nm + ' work? Go to ' + MF.toolRoomName(k) + '.');
    why.title = 'How it works — ' + MF.toolRoomName(k);
    on(why,'click',function(e){ e.stopPropagation(); MF.explainTool(k, b); });
    loop.appendChild(why);
    strap.appendChild(loop);
  });
  box.appendChild(strap);
  host.appendChild(box);
};

/* WHERE A TOOL IS EXPLAINED, and it is not here.

   USER DECISION, 2026-08-30 (§20): "The students should be able to use a tool
   without an explanation but have the option to understand why the tool works
   if they want it... The mine should act with little explanation or clicked
   boxes... If students want to understand how a tool works, send them to the
   casting shed or stamp mill."

   So the mine teaches by DOING: drag the instrument onto the lump and the lump
   changes. The lesson is not deleted - it is in the rooms built to teach it,
   which is where a student can be given room to read rather than a box over
   the rock they are working. A tool priced in plain numbers points at the
   Stamp Mill, which is about numbers; the rest point at the Casting Shed's
   methods room. */
MF.toolRoom = function(key){
  var t = MF.TOOLS[key];
  return (t && t.cast && t.cast.a === 0 && t.cast.b === 0) ? 'workshop-ore' : 'shed-methods';
};
MF.toolRoomName = function(key){
  return MF.toolRoom(key) === 'workshop-ore' ? 'the Stamp Mill' : 'the Casting Shed';
};
MF.explainTool = function(key, opener){
  MF.go(MF.toolRoom(key));
};

/* dragging a tool off the belt. Same shape as the heap drag, and the drop
   targets are the pieces on the floor. */
MF.dragTool = function(node, key){
  var moved=0, sx=0, sy=0, ghost=null, live=false;
  on(node,'pointerdown',function(e){
    if(e.button) return;
    live=true; moved=0; sx=e.clientX; sy=e.clientY;
    node.setPointerCapture && node.setPointerCapture(e.pointerId);
  });
  on(node,'pointermove',function(e){
    if(!live) return;
    moved = Math.max(moved, Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy));
    if(moved <= 5) return;
    if(!ghost){
      ghost = E('div','dragghost tool', MF.TOOLS[key].ic + ' ' + MF.TOOLS[key].nm);
      document.body.appendChild(ghost);
      MF.markPieceTargets(true);
    }
    ghost.style.left = (e.clientX+12)+'px';
    ghost.style.top  = (e.clientY+12)+'px';
    var over = MF.pieceAt(e.clientX, e.clientY);
    ghost.setAttribute('data-over', over ? 'yes' : 'no');
    MF.markPieceTargets(true, over);
  });
  ['pointerup','pointercancel'].forEach(function(ev){
    on(node,ev,function(e){
      if(!live) return;
      live=false;
      if(!ghost) return;
      var over = MF.pieceAt(e.clientX, e.clientY);
      ghost.parentNode && ghost.parentNode.removeChild(ghost); ghost=null;
      MF.markPieceTargets(false);
      if(!over) return;
      /* a floor piece carries data-piece, a cart lump data-ore */
      if(over.hasAttribute('data-piece'))
        MF.applyTool(key, parseInt(over.getAttribute('data-piece'),10), node);
      else
        MF.applyToolToOre(key, over.getAttribute('data-ore'));
    });
  });
};

MF.markPieceTargets = function(on_, hot){
  var host = MF._mine && MF._mine.root;
  if(!host) return;
  Array.prototype.forEach.call(host.querySelectorAll('.piece'), function(p){
    if(!on_){ p.removeAttribute('data-tooldrop'); return; }
    p.setAttribute('data-tooldrop', p===hot ? 'hot' : 'open');
  });
};
/* WHAT A TOOL CAN BE DROPPED ON: a piece on the breaking floor, OR a lump in
   the cart. The cart had no belt and no drop target at all - instruments only
   existed once ore was already on the bench - so the first thing a student
   could do with a lump they had just cut was move it somewhere else, and the
   tools they had paid for were a screen away from the rock they were for.
   Both live in MF._mine.mid, so one selector reaches both. */
MF.DROP_SEL = '.piece[data-piece], .lump[data-ore]';
MF.pieceAt = function(x, y){
  var host = MF._mine && MF._mine.root;
  if(!host) return null;
  var hit = null;
  Array.prototype.forEach.call(host.querySelectorAll(MF.DROP_SEL), function(p){
    var b = p.getBoundingClientRect();
    if(x>=b.left && x<=b.right && y>=b.top && y<=b.bottom) hit = p;
  });
  return hit;
};

/* THE TOOL GOES ON THE LUMP AND THE LUMP CHANGES. No panel rises any more:
   the reading IS the ore, re-drawn (MINE-SPEC §19), and the "why" lives in the
   Casting Shed and the Stamp Mill where it can be taught properly rather than
   in a box over the rock (§20). */
MF.applyTool = function(key, pieceId, opener){
  var B = MF.state.anvil;
  if(!B) return;
  var p = null;
  B.floor.forEach(function(pc){ if(pc.id===pieceId) p = pc; });
  if(!p) return;
  /* the same one twice takes it off, the same as in the cart (§23) */
  var off = (p.tool === key);
  p.tool = off ? null : key;
  if(p.ore) p.ore.tool = p.tool;
  MF.paintGear();
  MF.knockPiece && MF.knockPiece(pieceId);
};

/* the same act on a lump still in the cart. The tool RIDES WITH THE ORE: put
   the drill on a lump in the cart and it is still on it when the lump reaches
   the bench, because it is the same object either way.

   AND PUTTING THE SAME ONE ON TWICE TAKES IT OFF. Selecting has to be
   undoable in the same gesture that did it (§23) - otherwise the only way back
   to the plain expression is to find the slot, and a student who has just
   dropped the wrong instrument reaches for the one they dropped. */
MF.applyToolToOre = function(key, oreId){
  var found = null;
  MF.state.cart.forEach(function(o){ if(String(o.id) === String(oreId)) found = o; });
  if(!found) return;
  found.tool = (found.tool === key) ? null : key;
  MF.paintGear();
  MF.knockLump && MF.knockLump(found.id);
};

/* TAKING AN INSTRUMENT OFF, from either place. `ore` is what MF.oreDisplay
   reads; `piece` is the floor's own record of it, and both have to let go or
   the next repaint puts it straight back (they are synced in paintBreak). */
MF.clearTool = function(ore, piece){
  if(piece) piece.tool = null;
  if(ore) ore.tool = null;
  MF.paintGear();
  /* THE CONTROL THAT WAS CLICKED NO LONGER EXISTS. The slot is only drawn
     while an instrument is ON the lump, so taking it off deletes the button
     that took it off - and MF._refocus finds nothing to hand the keyboard back
     to, which drops it on <body>. The right landing place is the lump itself:
     it is what the student was working with, it is still there, and it is what
     they would reach for next. */
  var host = MF._mine && MF._mine.root;
  if(!host) return;
  var back = (piece && host.querySelector('.piece[data-piece="' + piece.id + '"]')) ||
             (ore && host.querySelector('[data-ore="' + ore.id + '"]'));
  if(back && back.focus) back.focus({preventScroll:true});
};

/* opening a slot with no tool in it: choose one, or be told plainly that the
   belt is empty and where tools come from */
MF.openSlot = function(pieceId, opener){
  var B = MF.state.anvil;
  if(!B) return;
  var p = null;
  B.floor.forEach(function(pc){ if(pc.id===pieceId) p = pc; });
  if(!p) return;
  var owned = MF.toolOrder().filter(MF.hasTool);
  MF._openSheet({
    label: 'Choose an instrument to hold to ' + MF.oreText(p.ore),
    icon: '&#128269;', title: 'The slot', sub: 'on <b>' + MF.oreLabel(p.ore) + '</b>',
    closeText: 'Close', opener: opener,
    fill: function(body){
      if(!owned.length){
        body.appendChild(H('div','note','<b>Nothing on the belt yet.</b> Instruments are not handed out here — you make them at the forge, out of metal you broke out yourself. ' +
          'Everything in the mine works without them; they only make it easier to see.'));
        return;
      }
      body.appendChild(H('p','hint','Which one do you want to hold to it?'));
      var row = E('div','pickrow');
      owned.forEach(function(k){
        var t = MF.TOOLS[k];
        var b = E('button','pickbtn'); b.type='button';
        b.appendChild(H('span','ic', t.ic));
        b.appendChild(H('span','nm', t.nm));
        b.setAttribute('aria-label','Hold ' + t.nm + ' to ' + MF.oreText(p.ore));
        on(b,'click',function(){ MF.applyTool(k, pieceId, opener); });
        row.appendChild(b);
      });
      body.appendChild(row);
    }
  });
};

/* =========================================================================
   THE YARD, DRAWN AS A PLACE.

   Not two lists with headings. A yard is a fenced patch of ground outside the
   adit with a lamp on a post: broken rock goes on the HEAP, and metal that
   will not break any further is racked on timber under the lamp. You can see
   at a glance how much of what you have brought up you have actually finished
   with, and you can pick a rock back off the heap.

   THE BACKDROP IS SCENERY AND MUST NEVER TAKE A CLICK. It is painted behind
   the rocks and bars, which are the controls; pointer-events:none on the svg
   is what keeps it that way, and the `overlay` group asserts it.
   ========================================================================= */
MF.yardScene = function(){
  var wrap = E('div','yardart');
  var W=300, VH=76;
  /* A BAND AT A FIXED HEIGHT, NOT A STRETCHED BACKDROP. Filling the whole
     panel with preserveAspectRatio:none scaled a 104-tall drawing over 438px
     of panel - the palings smeared and the lamp rendered as an ellipse. Sliced
     and pinned to the right edge, the drawing keeps its proportions at every
     column width and the lamp stays on screen; the dirt below it is a CSS
     gradient on .yardplace, which stretches without a shape to distort. */
  var svg = S('svg',{viewBox:'0 0 '+W+' '+VH,'aria-hidden':'true',preserveAspectRatio:'xMaxYMid slice'});

  var sky = S('linearGradient',{id:'yardsky',x1:'0',y1:'0',x2:'0',y2:'1'});
  sky.appendChild(S('stop',{offset:'0%','stop-color':'#4A3F34'}));
  sky.appendChild(S('stop',{offset:'100%','stop-color':'#2E2620'}));
  var defs = S('defs',{}); defs.appendChild(sky); svg.appendChild(defs);
  svg.appendChild(S('rect',{x:0,y:0,width:W,height:VH,fill:'url(#yardsky)'}));

  /* the paling fence along the back - a yard has an edge */
  for(var p=0;p<16;p++){
    var px = 4 + p*19;
    svg.appendChild(S('rect',{x:px,y:18,width:5,height:52,rx:1,fill:'#5A4B3C'}));
    svg.appendChild(S('path',{d:'M'+px+' 18 l2.5 -5 l2.5 5 Z',fill:'#6B5B48'}));
  }
  svg.appendChild(S('rect',{x:0,y:28,width:W,height:4,fill:'#6B5B48',opacity:'.8'}));
  svg.appendChild(S('rect',{x:0,y:52,width:W,height:4,fill:'#6B5B48',opacity:'.8'}));

  /* the ground the heap is tipped on, and the ruts a barrow leaves in it */
  svg.appendChild(S('path',{d:'M0 66 q64 -6 126 -2 q74 5 174 -2 L'+W+' '+VH+' L0 '+VH+' Z',fill:'#3E3328'}));
  svg.appendChild(S('path',{d:'M22 72 q42 -4 84 1',fill:'none',stroke:'#2A2118','stroke-width':'2',opacity:'.7'}));

  /* THE SCRIM, and it is not decoration. Text sits over this drawing, and the
     lightest thing behind it was a fence paling at #5A4B3C - lamp-gold on that
     measures 3.88:1 at 10px and the contrast sweep failed the build over it.
     The scrim pulls every backdrop down to about #3C3228, which .yardplace
     declares as its background-color so the sweep measures what is actually
     behind the words rather than the panel underneath the drawing. */
  svg.appendChild(S('rect',{x:0,y:0,width:W,height:VH,fill:'rgba(30,24,20,.55)'}));

  /* the lamp on its post, lit - the same flicker the mine's lanterns carry.
     Pinned near the right edge because the band slices from xMax, so it is on
     screen at every column width. */
  svg.appendChild(S('rect',{x:270,y:16,width:5,height:56,fill:'#4A3F34'}));
  svg.appendChild(S('path',{d:'M259 18 q13 -10 26 0 Z',fill:'#5A626A'}));
  svg.appendChild(S('circle',{class:'yardglow',cx:'272',cy:'28',r:'15',fill:'rgba(232,163,61,.22)'}));
  svg.appendChild(S('rect',{x:'266',y:'21',width:'12',height:'15',rx:'3',fill:'#E8A33D',stroke:'#8A6A2A','stroke-width':'2'}));

  wrap.appendChild(svg);
  return wrap;
};

MF.paintYard = function(){
  var host = clear(MF._mine.right);
  var box = E('div','yard');

  box.appendChild(H('h3',null,'The Yard'));
  box.appendChild(H('div','hint','Everything you have hauled out. Rock on the heap, metal on the rack.'));

  var place = E('div','yardplace');
  place.appendChild(MF.yardScene());
  var inner = E('div','yardin');

  /* ---- THE RACK: metal that will not break any further ---- */
  var rk = E('div','shelfrow');
  rk.appendChild(H('div','ylab','THE RACK &mdash; native metal'));
  var keys = Object.keys(MF.state.yard);
  if(!keys.length){
    rk.appendChild(H('div','yempty','Bare. Anything you break down to an element is racked here, with the lump it came out of written under it — and this is what the forge spends.'));
  } else {
    var rack = E('div','rack');
    [['plain metal', function(g){ return g.m===0; }],
     ['metal with an x in it', function(g){ return g.m!==0; }]].forEach(function(grp){
      var these = keys.filter(function(k){ return grp[1](MF.state.yard[k].ingot); });
      if(!these.length) return;
      var shelf = E('div','shelf');
      shelf.appendChild(H('div','sh', grp[0]));
      var row = E('div','metalrow');
      these.sort().forEach(function(k){
        var e = MF.state.yard[k];
        var label = e.ingot.label || ingotText(e.ingot);
        /* THE BAR, AND UNDER IT WHAT IT CAME OUT OF. The bar is the same chip
           it always was; the cell around it is what lets a caption sit under
           it without breaking the chip's own inline layout. */
        var cell = E('div','metalcell');
        cell.appendChild(H('div','metal' + (e.ingot.m===0?' pure':''),
          label + (e.count>1 ? ' <span class="ct">×'+e.count+'</span>' : '')));
        var from = e.from || [];
        cell.appendChild(H('div','mfrom', from.length
          ? 'out of ' + from[0] + (from.length>1 ? ' <span class="mmore">+'+(from.length-1)+' more</span>' : '')
          : '<span class="mmore">straight off the face</span>'));
        row.appendChild(cell);
      });
      shelf.appendChild(row);
      rack.appendChild(shelf);
    });
    rk.appendChild(rack);
  }
  inner.appendChild(rk);

  /* ---- THE HEAP: rock tipped here still carrying a seam ---- */
  var hp = E('div','heaprow');
  hp.appendChild(H('div','ylab','THE HEAP &mdash; still carrying a seam'));
  if(!MF.state.rockpile.length){
    hp.appendChild(H('div','yempty','Empty. Anything you tip here half-broken lands on the heap, and it is still here when you come back for it.'));
  } else {
    var heap = E('div','heap');
    MF.state.rockpile.forEach(function(o, idx){
      var b = E('button','heaprock'); b.type='button';
      b.setAttribute('data-heap', idx);
      /* THE HEAP DRAWS LUMPS, NOT LABELS. It was a text chip in a rock-shaped
         clip-path - the last place in the mine where the expression was beside
         the stone rather than cut into it. It is MF.oreRock now, the same
         drawn lump the seam, the cart and the anvil show, so an instrument put
         on a rock in the cart is still readable on it after it is tipped. */
      b.appendChild(MF.oreRock(o, {native:false}));
      b.setAttribute('aria-label', MF.oreDisplayText(o) + ' — still rock. Put it back under the pick.');
      b.title = 'Put it back under the pick';
      /* ONE CLICK DOES IT, and the drag below does exactly the same thing.
         A drag with no click path is a control half the users cannot reach. */
      on(b,'click',function(){ MF.takeFromHeap(idx); });
      MF.dragFromHeap(b, idx);
      heap.appendChild(b);
    });
    hp.appendChild(heap);
    hp.appendChild(H('div','yhint','Take one back under the pick — click it, or drag it onto the floor.'));
  }
  inner.appendChild(hp);

  place.appendChild(inner);
  box.appendChild(place);

  /* THE BELT IS NOT DRAWN TWICE. It hangs on the breaking floor now, beside
     the rock it acts on - a second copy over here would be the one a student
     reached for, and it is the far one. */

  var toForge = E('button','btn primary'); toForge.type='button';
  toForge.textContent = 'Haul the metal to the forge';
  toForge.style.marginTop='12px'; toForge.style.width='100%';
  on(toForge,'click',function(){ MF.go('forge'); });
  box.appendChild(toForge);

  box.appendChild(H('div','hint','<br>Nothing here is a mark. It is a record of what you have — and unlike a mark, you can spend it.'));
  host.appendChild(box);
};

/* off the heap and back under the pick. It goes through the cart, because the
   cart is how anything reaches the anvil - one route in, not two. */
MF.takeFromHeap = function(idx){
  var ore = MF.state.rockpile[idx];
  if(!ore) return;
  MF.state.rockpile.splice(idx,1);
  ore.id = 'heap-' + (MF._heapSeq = (MF._heapSeq||0)+1);
  ore.layer = ore.layer || MF.state.layer;
  ore.fresh = true;
  MF.state.cart.push(ore);
  MF.state.selected = ore;
  MF.state.anvil = null;
  /* off the heap, into the cart, onto the bench - the wall is untouched */
  MF.repaint(['cart','yard','work']);
  MF.flash('Off the heap and back under the pick.');
  setTimeout(function(){ ore.fresh = false; }, 600);
};

/* DRAG IS THE SECOND WAY, NEVER THE ONLY WAY. Built on pointer events to match
   the seam's drag-to-scan; HTML5 drag-and-drop is not used anywhere in this
   file and its drop targets do not survive a repaint. A drag under a few
   pixels is not a drag at all, so a click still lands. */
MF.dragFromHeap = function(node, idx){
  var moved = 0, startX = 0, startY = 0, ghost = null, live = false;
  on(node,'pointerdown',function(e){
    if(e.button) return;
    live = true; moved = 0; startX = e.clientX; startY = e.clientY;
    node.setPointerCapture && node.setPointerCapture(e.pointerId);
  });
  on(node,'pointermove',function(e){
    if(!live) return;
    moved = Math.max(moved, Math.abs(e.clientX-startX) + Math.abs(e.clientY-startY));
    if(moved <= 5) return;
    if(!ghost){
      ghost = E('div','dragghost', node.textContent);
      document.body.appendChild(ghost);
      MF.markDropTargets(true);
    }
    ghost.style.left = (e.clientX + 12) + 'px';
    ghost.style.top  = (e.clientY + 12) + 'px';
    var over = MF.dropTargetAt(e.clientX, e.clientY);
    ghost.setAttribute('data-over', over ? 'yes' : 'no');
  });
  ['pointerup','pointercancel'].forEach(function(ev){
    on(node,ev,function(e){
      if(!live) return;
      live = false;
      if(ghost){
        var over = MF.dropTargetAt(e.clientX, e.clientY);
        ghost.parentNode && ghost.parentNode.removeChild(ghost);
        ghost = null;
        MF.markDropTargets(false);
        /* dropped on the floor: same act as the click. Dropped anywhere else:
           nothing happens and the rock stays on the heap. */
        if(over){ MF.takeFromHeap(idx); return; }
      }
    });
  });
};

/* the floor lights up while something is in the air, so a drag has somewhere
   it is visibly going rather than being guesswork */
MF.markDropTargets = function(on_){
  var host = MF._mine && MF._mine.root;
  var t = host && host.querySelector('.floorbox');
  if(!t) return;
  if(on_) t.setAttribute('data-drop','open'); else t.removeAttribute('data-drop');
};
MF.dropTargetAt = function(x, y){
  var host = MF._mine && MF._mine.root;
  var t = host && host.querySelector('.floorbox');
  if(!t) return null;
  var b = t.getBoundingClientRect();
  return (x>=b.left && x<=b.right && y>=b.top && y<=b.bottom) ? t : null;
};

/* =========================================================================
   MF.validate() - every check reports its denominator, and it carries a
   control that MUST fail. A check that only ever passes is worthless.
   ========================================================================= */
MF.validate = function(){
  var errs = [], checked = 0, counts = {};
  function chk(group){ counts[group] = (counts[group]||0)+1; checked++; }

  /* THE INSTRUMENT MUST NOT DAMAGE THE SUBJECT (VERIFICATION s35).
     This function mounts every screen into detached probes, and MF.SCREENS.mine
     sets MF._mine as a side effect. Without this save/restore, running
     MF.validate() left MF._mine pointing at a probe that had been thrown away -
     so afterwards paintMine() drew the bench into a dead DOM and every click a
     student made did nothing, with no console error and no words on screen.

     A review agent hit exactly this, ran the documented instrument first as the
     docs tell you to, and reported "I could not assay a pure ingot". The gate
     was fine. The instrument had broken the page it was measuring, and the
     wreckage was indistinguishable from the defect it was hunting. */
  var _liveMine = MF._mine;
  var _liveScreen = MF.state.screen;

  /* 1. the engine: every factorisation must multiply back exactly */
  for(var a=0;a<=6;a++) for(var b=-12;b<=12;b++) for(var c=-12;c<=12;c++){
    if(a===0 && b===0) continue;
    var r = MF.smeltPoly(a,b,c);
    if(!r.ingots) continue;
    if(r.ingots.some(function(g){ return g.m===0 && g.k===0; })) continue;
    chk('engine');
    var back = ingotProduct(r.ingots);
    if(back.overflow || back.a!==a || back.b!==b || back.c!==c)
      errs.push('engine: '+a+','+b+','+c+' did not multiply back');
  }

  /* 2. seam classification on cases chosen because they are easy to get wrong */
  [[1,0,-9,'twin'],[4,0,-25,'twin'],[1,-5,6,'plain'],[1,0,4,'pure'],[1,0,-2,'pure'],
   [2,7,3,'loaded'],[3,12,0,'shared'],[1,1,0,'shared'],[12,0,-75,'shared'],[0,5,15,'shared'],[0,5,3,'pure']]
  .forEach(function(t){
    chk('classify');
    var got = MF.smeltPoly(t[0],t[1],t[2]).kind;
    if(got!==t[3]) errs.push('classify: '+t[0]+','+t[1]+','+t[2]+' expected '+t[3]+' got '+got);
  });

  /* 3. THE ORE GENERATOR. Every layer, many seeds, and every lump handed to a
        student must be classifiable and smeltable. This is the check that
        matters most, because the ore is generated rather than authored. */
  var rng = makeRng(20260819);
  for(var layer=1; layer<=5; layer++){
    for(var i=0;i<160;i++){
      chk('ore');
      var o = MF.digOre(layer, rng);
      if(!o){ errs.push('ore: layer '+layer+' produced nothing on draw '+i); continue; }
      var kind = MF.assayOf(o);
      if(!MF.ASSAY[kind]){ errs.push('ore: layer '+layer+' gave an unclassifiable lump '+MF.oreText(o)); continue; }
      if(o.kind==='poly'){
        var res = MF.smeltPoly(o.a,o.b,o.c);
        if(res.kind!=='pure'){
          var back2 = ingotProduct(res.ingots||[]);
          if(back2.overflow || back2.a!==o.a || back2.b!==o.b || back2.c!==o.c)
            errs.push('ore: layer '+layer+' lump '+MF.oreText(o)+' does not smelt back');
        }
        if(o.a===0 && o.b===0) errs.push('ore: layer '+layer+' produced an empty lump');
      } else if(o.n < 2){ errs.push('ore: layer '+layer+' produced a number below 2'); }
      /* the layer must actually deliver the ore it advertises */
      if(layer===5 && o.kind==='poly' && o.a===1) errs.push('ore: layer 5 handed out an unloaded trinomial');
      if(layer===1 && o.kind!=='number') errs.push('ore: layer 1 handed out a polynomial');
    }
  }

  /* 3a-ii. EVERY LAYER MUST BE ABLE TO PAY FOR THE TOOLS.

           Tools are bought with metal off the rack, and the two a student
           wants first are priced in PLAIN NUMBERS - the pick is 12 = 2·2·3,
           the lantern is 30 = 2·3·5. Nothing checked that the rock a student
           is standing in front of can produce those. Measured over 160 digs a
           layer, layers 3, 4 and 5 produced ZERO fives, and layers 4 and 5 no
           plain metal at all: a student working the interesting rock was
           locked out of the instrument that tells them whether a lump still
           has a seam in it, permanently, with nothing on screen to say why.

           So it is asserted. Dig a layer, break every lump the way the engine
           itself would, and require the yard to hold enough to cast both
           starting tools - using MF.castableFrom, the forge's own judge,
           rather than a second opinion about what 12 factors into.

           READ THE DENOMINATOR: 40 digs a layer at one seed. It says a layer
           CAN pay, not how long a real student takes to get there, and it says
           nothing about the four tools priced in polynomial metal. */
  [1,2,3,4,5].forEach(function(layer){
    var ecoSaved = {yard:MF.state.yard, heap:MF.state.rockpile};
    MF.state.yard = {}; MF.state.rockpile = [];
    var ecoRng = makeRng(31337 + layer * 101);
    for(var d=0; d<40; d++){
      var lump = MF.digOre(layer, ecoRng);
      if(!lump) continue;
      var B = MF.anvilInit(lump), guard = 0;
      while(!B.floor.every(function(p){ return MF.isNative(p.ore); }) && guard++ < 40){
        var pc = B.floor[B.at], f = MF.simplestFactor(pc.ore);
        if(!f) break;
        B.raw = {m:String(f.m), k:String(f.k)}; B.rawFor = pc.id;
        MF.swing(B);
      }
      B.floor.forEach(function(p){ MF.stow(p.ore); });
    }
    ['pick','lantern'].forEach(function(tk){
      chk('ore');
      var spec = MF.TOOLS[tk];
      if(!MF.castableFrom(spec.cast, spec.slots, MF.yardList()))
        errs.push('ore: 40 lumps out of layer ' + layer + ' (' + MF.LAYERS[layer-1].name +
          ') cannot pay for ' + spec.nm + ' — a student working this rock can never forge it');
    });
    MF.state.yard = ecoSaved.yard; MF.state.rockpile = ecoSaved.heap;
  });
  /* AND GRAVEL MUST PAY FOR THE FIRST TWO TOOLS QUICKLY.

     "I was spending a lot of time looking for factors of 2, 3 and 5 to get the
     first two tools… it's taking a bit to get to the tools." The check above
     only asks whether a layer CAN pay - 40 lumps is a lot of digging, and a
     student who cannot reach an instrument in a reasonable number of swings
     has met the site's economy instead of its mathematics.

     Measured before the fix, digs-to-both-tools over eight students were
     1, 1, 2, 5, 8, 12, 14, 21. The tail was the 28% chance of a prime from
     13..97, which pays nothing toward 12 or 30. Now: 1,1,2,2,2,2,2,2,3,3,3,
     3,3,4,4,4,4,6,9,11 over twenty - median 3, and seventeen of twenty inside
     four digs.

     READ THE DENOMINATOR: this measures the ENGINE's shortest path, breaking
     each lump with the factor the engine itself names. A real student picks
     their own factors and will sometimes take longer. It is a floor on the
     experience, not a description of it. */
  (function(){
    var tsSaved = {yard:MF.state.yard, heap:MF.state.rockpile};
    var slow = [];
    [11,29,53,97,131,173,211,257].forEach(function(seed){
      chk('ore');
      MF.state.yard = {}; MF.state.rockpile = [];
      var rng = makeRng(seed), digs = 0, got = 0;
      for(var i=0; i<40 && !got; i++){
        var lump = MF.digOre(1, rng);
        if(!lump) continue;
        digs++;
        var B = MF.anvilInit(lump), g = 0;
        while(!B.floor.every(function(p){ return MF.isNative(p.ore); }) && g++ < 40){
          var pc = B.floor[B.at], f = MF.simplestFactor(pc.ore);
          if(!f) break;
          B.raw = {m:String(f.m), k:String(f.k)}; B.rawFor = pc.id;
          MF.swing(B);
        }
        B.floor.forEach(function(p){ MF.stow(p.ore); });
        if(MF.castableFrom(MF.TOOLS.pick.cast, MF.TOOLS.pick.slots, MF.yardList()) &&
           MF.castableFrom(MF.TOOLS.lantern.cast, MF.TOOLS.lantern.slots, MF.yardList())) got = digs;
      }
      if(!got || got > 14) slow.push(seed + ':' + (got || 'never'));
    });
    MF.state.yard = tsSaved.yard; MF.state.rockpile = tsSaved.heap;
    if(slow.length)
      errs.push('ore: Gravel took more than fourteen lumps to pay for the pick and the lantern ' +
        'for ' + slow.length + ' of eight students (' + slow.join(', ') + ') — a student who cannot ' +
        'reach an instrument has met the economy instead of the mathematics');
  })();

  /* CONTROL: a yard with no plain metal in it must fail the same test */
  chk('ore');
  var ecoCtl = MF.state.yard;
  MF.state.yard = {};
  [[1,2],[1,-3],[2,5]].forEach(function(g){ MF.addToYard({m:g[0],k:g[1]}); });
  if(MF.castableFrom(MF.TOOLS.lantern.cast, MF.TOOLS.lantern.slots, MF.yardList()))
    errs.push('CONTROL: a rack holding nothing but x-metal still claims it can cast 30');
  MF.state.yard = ecoCtl;

  /* 3b. BREAKING. The mine's one move, swept the way a student uses it: take
         a real lump, break its true factors off ONE AT A TIME, and assert at
         every step that the two pieces still reconstruct the rock they came
         out of. A lump is only finished when nothing left on the floor can be
         broken further.

         READ THE DENOMINATOR: this sweeps generated ore at every layer, and
         the factors it names are the engine's own. It does not sweep what a
         student might type instead - the refusals below do that, and only for
         the four shapes named. */
  var brRng = makeRng(770077);
  for(var bl=1; bl<=MF.LAYERS.length; bl++){
    for(var bi=0; bi<40; bi++){
      var bore = MF.digOre(bl, brRng);
      if(!bore) continue;
      chk('break');
      /* the pieces on the floor, broken down until every one is native */
      var floor = [bore], guard = 0, wantTotal = (bore.kind==='number')
        ? {a:0,b:0,c:bore.n} : {a:bore.a,b:bore.b,c:bore.c};
      while(guard++ < 24){
        var at = -1;
        for(var fi=0; fi<floor.length; fi++){ if(!MF.isNative(floor[fi])){ at=fi; break; } }
        if(at < 0) break;                       /* everything is native metal */
        var piece = floor[at];
        /* the engine's own idea of what is in there, one factor of it */
        var one = null;
        if(piece.kind==='number'){ one = {m:0, k:primeFactors(piece.n)[0]}; }
        else {
          var pr = MF.smeltPoly(piece.a,piece.b,piece.c);
          var cand = (pr.ingots||[]).filter(function(g){ return !(g.m===0&&g.k===0) && !(g.m===0&&Math.abs(g.k)===1); });
          one = cand[0];
        }
        if(!one){ errs.push('break: '+MF.oreText(piece)+' is not native and the engine names nothing in it'); break; }
        var got = MF.breakOff(piece, one);
        if(!got.ok){
          errs.push('break: the engine\'s own factor '+ingotText(one)+' would not come out of '+MF.oreText(piece)+' ('+got.reason+')');
          break;
        }
        chk('break');
        if(!MF.oreSame(MF.oreMul(got.left, got.right), piece))
          errs.push('break: '+MF.oreText(piece)+' split into pieces that do not rebuild it');
        floor.splice(at, 1, got.left, got.right);
      }
      if(guard >= 24){ errs.push('break: '+MF.oreText(bore)+' never broke down to native metal'); continue; }
      /* and the whole floor must still be the lump that was dug */
      var acc = {kind:'number', n:1}, blew = false;
      floor.forEach(function(pc){
        if(blew) return;
        var mm = MF.oreMul(acc, pc);
        if(mm.overflow){ blew = true; return; }
        acc = MF.asOre(mm.a, mm.b, mm.c);
      });
      chk('break');
      if(blew || !MF.oreSame(MF.oreMul(acc, {kind:'number',n:1}), bore))
        errs.push('break: the pieces of '+MF.oreText(bore)+' do not multiply back to it');
    }
  }

  /* 3b-i. WHAT THE BOXES MEAN, WHICH IS NOT WHAT THE ENGINE THINKS.
           Reported as a maths error: on layer 5, (x + 6) was refused as a
           factor of 3x² + 22x + 24 — which it is. The engine was right the
           whole time. The student had CLEARED the x-part box, which read as
           nought, so the hammer was cut to 6 rather than to (x + 6), and the
           refusal named a shape they had never typed.

           An empty constant box means no constant, which IS nought. An empty
           x-part box means no coefficient written in front of the x, which is
           ONE. They are different boxes and they had one reader. */
  [['',      1, 'an empty x-part is one x, not none'],
   ['1',     1, 'a plain 1'],
   ['x',     1, 'the letter itself'],
   ['-x',   -1, 'a negative single x'],
   ['-',    -1, 'a lone minus'],
   ['0',     0, 'an explicit nought, which is how you ask for a plain metal'],
   ['3',     3, 'a coefficient'],
   ['2x',    2, 'a coefficient written with its x'],
   ['−4',   -4, 'a typographic minus']
  ].forEach(function(t){
    chk('break');
    var got = MF.readPickM(t[0]);
    if(got !== t[1])
      errs.push('break: the x-part box read "' + t[0] + '" as ' + got + ', expected ' + t[1] + ' — ' + t[2]);
  });
  /* and the constant box must still read empty as nought */
  chk('break');
  if(MF.readInt('') !== 0) errs.push('break: the constant box no longer reads empty as nought');
  /* the reported case, end to end through the two readers */
  chk('break');
  var repM = MF.readPickM(''), repK = MF.readInt('6');
  if(!MF.breakOff({kind:'poly',a:3,b:22,c:24}, {m:repM, k:repK}).ok)
    errs.push('break: an empty x-part and a 6 still will not take (x + 6) out of 3x² + 22x + 24');

  /* the four refusals, each a shape a student will actually swing */
  [[{kind:'poly',a:1,b:-5,c:6}, {m:1,k:2},  'glance',  'a bracket that is not in there'],
   [{kind:'number',n:12},       {m:0,k:5},  'glance',  'a number that does not divide'],
