MF.oreToIngot = function(ore){
  if(ore.kind==='number') return {m:0, k:ore.n};
  if(ore.a===0 && ore.b===0) return {m:0, k:ore.c};
  if(ore.a===0) return {m:ore.b, k:ore.c};
  return {m:0, k:0, poly:{a:ore.a,b:ore.b,c:ore.c}, label:MF.oreText(ore)};
};

MF.breakOff = function(ore, factor){
  var no = function(reason, why){ return {ok:false, reason:reason, why:why}; };
  if(!ore || !factor || !isInt(factor.m) || !isInt(factor.k))
    return no('malformed','That is not a shape a hammer can be cut to.');
  if(factor.m===0 && factor.k===0)
    return no('nothing','That is nothing at all — there is no edge on it to bring down.');
  if(factor.m===0 && Math.abs(factor.k)===1)
    return no('nothing','Everything divides by one. Taking it out would leave the lump exactly as it is.');

  var yes = function(left, right){
    /* MULTIPLY BACK BEFORE HANDING IT OVER. The algebra below solves for the
       quotient; this proves it. A division that solves and does not
       reconstruct would reach a student as a rock splitting into the wrong
       two pieces, with nothing on screen saying so. */
    if(!MF.oreSame(MF.oreMul(left, right), ore))
      return no('unsound','The pieces do not add back up to the rock they came out of.');
    return {ok:true, left:left, right:right, why:'The seam runs.'};
  };

  /* ---- a number lump ---- */
  if(ore.kind==='number'){
    if(factor.m!==0)
      return no('shape','There is no x anywhere in this lump for that to bite on.');
    var d = factor.k, n = ore.n;
    /* DIVISIBILITY FIRST. Ordered the other way, a pick bigger than the lump
       and a pick that simply does not fit both came back "that is the whole
       lump" - and 100 is not the whole of 12. */
    if(n % d !== 0)
      return no('glance','The hammer glanced off. ' + num(d) + ' does not run through ' + num(n) + '.');
    if(Math.abs(d) >= Math.abs(n))
      return no('whole','That is the whole lump. It would leave nothing behind it.');
    return yes({kind:'number', n:d}, {kind:'number', n:n/d});
  }

  /* ---- a plain metal out of a polynomial: the common-factor seam ---- */
  var a=ore.a, b=ore.b, c=ore.c;
  if(factor.m===0){
    var g = factor.k;
    if(a%g!==0 || b%g!==0 || c%g!==0)
      return no('glance','The hammer glanced off. ' + num(g) + ' does not run through every term.');
    var restPlain = asOre(a/g, b/g, c/g);
    if(restPlain.kind==='number' && Math.abs(restPlain.n)===1)
      return no('whole','That is the whole lump. It would leave nothing behind it.');
    return yes({kind:'number', n:g}, restPlain);
  }

  /* ---- an x-carrying bracket: (mx + k)(px + q) ---- */
  var m=factor.m, k=factor.k, p, q;
  if(a % m !== 0) return no('glance','The hammer glanced off. Nothing of that shape runs through this one.');
  p = a/m;
  if(k !== 0){
    if(c % k !== 0) return no('glance','The hammer glanced off. Nothing of that shape runs through this one.');
    q = c/k;
  } else {
    if(c !== 0)   return no('glance','The hammer glanced off. Nothing of that shape runs through this one.');
    if(b % m !== 0) return no('glance','The hammer glanced off. Nothing of that shape runs through this one.');
    q = b/m;
  }
  if(p*k + q*m !== b)
    return no('glance','The hammer glanced off. The ends match but the middle does not.');
  var rest = asOre(0, p, q);
  if(rest.kind==='number' && Math.abs(rest.n)===1)
    return no('whole','That is the whole lump. It would leave nothing behind it.');
  return yes(asOre(0, m, k), rest);
};

/* =========================================================================
   ORE. Any expression is ore: a number, a monomial, a binomial, a trinomial.
   {kind:'number', n} | {kind:'poly', a,b,c}
   ========================================================================= */
MF.oreLabel = function(o){ return o.kind==='number' ? num(o.n) : quad(o.a,o.b,o.c); };
MF.oreText  = function(o){ return o.kind==='number' ? num(o.n) : quadText(o.a,o.b,o.c); };

/* the assay answer for a lump, from the engine - never authored by hand */
MF.assayOf = function(o){
  if(o.kind==='number') return isPrime(o.n) ? 'pure' : 'composite';
  return MF.smeltPoly(o.a,o.b,o.c).kind;
};

/* EVERY READING THAT IS TRUE OF THE ROCK.
   4x² − 4 carries a shared 4, so the engine calls it a Common Vein - but it is
   ALSO, literally, two perfect squares with a minus between them and no middle
   term, which is the verbatim tell this site prints for a Twin Seam. The Assay
   Lamp even tells the student to check for exactly that. Grading only the
   engine's answer locked a correct student out of the bench.

   A gate exists to make a student commit to a reading, not to guess which
   reading the author preferred. Both are accepted; the follow-up says which
   move comes first and why. */
MF.assayAccepts = function(o){
  var out = [MF.assayOf(o)];
  if(o.kind==='poly' && o.a!==0 && o.b===0 && o.c<0 && isSquare(o.a) && isSquare(-o.c)){
    if(out.indexOf('twin') < 0) out.push('twin');
  }
  return out;
};

MF.ASSAY = {
  pure:      {name:'Pure Ingot',        tell:'Nothing separates out. It is already an element — a prime, or a polynomial no whole-number seam runs through.'},
  composite: {name:'Comes Apart',       tell:'It has factors in it. Split it and keep splitting until everything is pure.'},
  shared:    {name:'Shared Metal',      tell:'Every term carries the same lump. That comes out in front before anything else.'},
  twin:      {name:'Twin Seam',         tell:'Two perfect squares with a minus between them, and no middle term at all.'},
  plain:     {name:'Plain Trinomial',   tell:'One x² with nothing in front. Two numbers that multiply to c and add to b.'},
  loaded:    {name:'Loaded Trinomial',  tell:'Something sits in front of the x². The pair you hunt multiplies to a·c.'}
};

/* =========================================================================
   THE ORE GENERATOR. Endless, per layer, and every lump is checked against
   the engine before it is ever handed to a student.
   ========================================================================= */
MF.LAYERS = [
  {n:1, name:'Gravel',      what:'plain numbers'},
  {n:2, name:'Seam Rock',   what:'shared metal — 6x + 15, 3x² + 12x'},
  {n:3, name:'Twin Beds',   what:'two-term ore — x² − 9, and pure ingots'},
  {n:4, name:'Trinomial',   what:'x² + bx + c'},
  {n:5, name:'Loaded Vein', what:'ax² + bx + c'}
];
MF.SHUT_SHAFTS = [
  {name:'Grouping', what:'ax + ay + bx + by', note:'next shaft to open'},
  {name:'Higher Ground', what:'x⁴ − 5x² + 4'},
  {name:'Two Elements', what:'x² + 5xy + 6y²'},
  {name:'Cubes', what:'a³ ± b³'}
];

MF.digOre = function(layer, rng){
  var tries = 0;
  while(tries++ < 60){
    var o = MF.rawOre(layer, rng);
    if(!o) continue;
    /* never hand out a lump the engine cannot classify */
    var k = MF.assayOf(o);
    if(!MF.ASSAY[k]) continue;
    if(o.kind==='poly'){
      var r = MF.smeltPoly(o.a,o.b,o.c);
      /* a shared-metal lump whose core is unfactorable is fine, but a lump
         whose ingots we cannot state is not */
      if(r.kind!=='pure' && (!r.ingots || r.ingots.some(function(g){ return g.m===0 && g.k===0; }))) continue;
    }
    o.layer = layer;
    o.id = 'ore-' + (MF._oreSeq = (MF._oreSeq||0)+1);
    return o;
  }
  return null;
};

/* THE COMMON METAL SALTED INTO THE DEEP LAYERS, and why it had to exist.

   Tools are paid for in metal off the rack, and the two a student wants first
   are priced in PLAIN NUMBERS: the pick is 12 = 2·2·3 and the lantern is
   30 = 2·3·5. Measured over 160 digs a layer, before this existed:

     layer 1 Gravel        115 twos   67 threes   17 fives
     layer 2 Seam Rock     158        88          25
     layer 3 Twin Beds      48        26           0
     layer 4 Trinomial       0         0           0
     layer 5 Loaded Vein     0         0           0

   Three of the five layers could not pay for the lantern at any amount of
   digging, and layer 3 never produced a single 5. A student working the
   interesting rock was locked out of the instrument that tells them whether a
   lump still has a seam in it, with nothing on screen to say why.

   So a minority of lumps in the deep layers now carry a common metal in front.
   THIS IS NOT A CONCESSION, it is the move that should be taught first: check
   for something every term carries before you do anything else. A salted layer
   4 lump is g(x+p)(x+q) - still a trinomial, and now a two-step one. Layer 5's
   inner quadratic is still genuinely loaded; the metal comes off in front of
   it. The `ore` group's identity rule (layer 5 never hands out a===1) holds,
   because g·A is never 1.

   THE VALUES ARE THE PRIMES THE TWO STARTING TOOLS ARE PRICED IN, weighted by
   what the tools actually need. The pick is 2·2·3, so it wants TWO twos out of
   one seam: 4 and 12 carry a pair, and 12 is the pick's whole cast in a single
   lump. The lantern is 2·3·5 and 5 was the scarcest metal in the mine, so 5,
   10 and 15 each carry one.

   THE RATES ARE HELD LOW ENOUGH THAT EACH LAYER IS STILL ITSELF. Layer 4 sat
   at 0.32 for one run and it starved the Decimal Dial - the forge group,
   which requires every order to be castable from 70 real smelts, could no
   longer find (x + 1) and (x + 2) in the thinner supply of monic trinomials.
   That group catching it is the group working; the answer was to salt less,
   not to widen the sample until the failure went away. */
var SALT_METALS = [2,3,4,5,6,10,12,15];
function SALT(rng){ return pick(rng, SALT_METALS); }

MF.rawOre = function(layer, rng){
  var p, qq, g, m, n;
  switch(layer){
    /* GRAVEL PAYS FOR THE FIRST TWO TOOLS, and it used not to.

       The pick is 12 = 2·2·3 and the lantern 30 = 2·3·5, so a layer-1 dig is
       only worth anything if it yields 2s, 3s or 5s. This case used to draw a
       prime from 13..97 twenty-eight per cent of the time - one dig in four
       paying NOTHING toward either tool - and a random 12..144 otherwise.
       Measured over eight students, digs-to-lantern were 1, 1, 2, 5, 8, 12,
       14, 21: a median of 8 and a tail of twenty-one, and the two worst runs
       are exactly the two that drew eight and nine of those dead-end primes.

       PRIMES STAY, because "held to the light it stays exactly what it is" is
       the whole thesis and a student has to meet one early. They are SMALL
       now: 2, 3 and 5 are themselves lantern parts, so a prime is a lesson AND
       a payment instead of a lesson and a wasted swing.

       AND EVERY COMPOSITE IS BUILT FROM 2, 3, 5 (with the odd 7 or 11 for
       variety), so breaking one always puts something on the rack. */
    case 1:
      /* 2, 3 and 5 are listed twice: half the primes a student meets down here
         are ones the first two tools are priced in, so a prime is a lesson AND
         a payment. That drops the dead-end rate from one dig in four to about
         one in eleven. */
      if(rng() < 0.20) return {kind:'number', n: pick(rng,[2,2,3,3,5,5,7,11,13,17,19,23])};
      return {kind:'number', n: pick(rng,[
        12,18,20,24,28,30,36,40,42,44,45,48,50,54,56,60,63,64,66,70,72,75,80,84,
        88,90,96,98,99,100,108,110,120,125,126,128,132,135,140,144])};
    case 2:
      g = irange(rng,2,9);
      if(rng() < 0.45){                                  /* g·x² + g·k·x  */
        return {kind:'poly', a:g, b:g*irange(rng,1,9), c:0};
      }
      return {kind:'poly', a:0, b:g*irange(rng,2,9), c:g*irange(rng,1,9)};
    case 3:
      if(rng() < 0.30){ return {kind:'poly', a:1, b:0, c:irange(rng,1,12)*irange(rng,1,2)}; }  /* pure: x²+k */
      m = irange(rng,1,3); n = irange(rng,2,9);
      if(rng() < 0.34){                                   /* g·((mx)²−n²) */
        g = SALT(rng);
        return {kind:'poly', a:g*m*m, b:0, c:-g*n*n};
      }
      return {kind:'poly', a:m*m, b:0, c:-(n*n)};        /* twin: (mx)²−n² */
    case 4:
      if(rng() < 0.16){                                   /* a pure trinomial */
        return {kind:'poly', a:1, b:irange(rng,1,6), c:irange(rng,5,14)};
      }
      p = irange(rng,-9,9); qq = irange(rng,-9,9);
      if(p===0||qq===0) return null;
      if(rng() < 0.22){                                   /* g·(x+p)(x+q) — kept LOW so monic trinomials still dominate layer 4 */
        g = SALT(rng);
        return {kind:'poly', a:g, b:g*(p+qq), c:g*p*qq};
      }
      return {kind:'poly', a:1, b:p+qq, c:p*qq};
    case 5:
      m = irange(rng,2,4); n = irange(rng,1,3);
      p = irange(rng,-6,6); qq = irange(rng,-6,6);
      if(p===0||qq===0) return null;
      if(gcd(gcd(m,p), gcd(n,qq))>1) return null;         /* keep it genuinely loaded */
      var A=m*n, B=m*qq+n*p, C=p*qq;
      if(gcdAll([A,B,C])>1) return null;
      if(A===1) return null;
      if(rng() < 0.38){                                   /* g·(loaded) */
        g = SALT(rng);
        return {kind:'poly', a:g*A, b:g*B, c:g*C};
      }
      return {kind:'poly', a:A, b:B, c:C};
  }
  return null;
};

/* =========================================================================
   THE INSTRUMENTS.
   Not trophies and not descriptions - each one is a mathematical instrument,
   and each is FORGED BY DEMONSTRATING THE VERY MOVE IT THEN ASSISTS WITH.
   The forging is the lesson; the tool is what you keep.

   THE RULE THAT BINDS ALL OF THEM: a tool ASSISTS, it never GATES.
   A student who has forged nothing can still walk to the deepest layer and
   work it. It is harder without the instruments. It is never forbidden.
   ========================================================================= */
/* ---- EVERY ORDER NAMES THE EXACT OBJECT ITS MOLD IS CUT FOR.

     The board used to ask for a SHAPE - "three pure ingots", "any four metals
     at all" - and any three primes filled it. That taught nothing about what a
     factorisation is, because there was no particular thing to hit: a student
     could pour 2·3·5 or 7·11·13 and the mold accepted both.

     An order now names one object and the casting must come out as that
     object, exactly. Finding which metals multiply to 6x² + 7x − 3 IS
     factoring, run backwards and with a definite answer - and a casting that
     misses shows WHICH term it missed by.

     THE TARGETS CLIMB WITH THE TOOL. `rank` runs 1 to 7, ordered by how much
     the instrument does for you when you are getting metal out of rock, and
     the object it is cast from gets harder in step:

       1 Prospector's  12              2 · 2 · 3         plain numbers, one repeated
       2 Pit Lantern   30              2 · 3 · 5         three different primes
       3 Steel Pick    3x + 12         3 · (x + 4)       a metal spread over a bracket
       4 Decimal Dial  x² + 3x + 2     (x+1)(x+2)        two brackets, one apart
       5 Exponent Rail x² + 8x + 16    (x+4)(x+4)        a square: both x-parts the same
       6 Core Drill    x² − 25         (x+5)(x−5)        a twin seam: the middle cancels
       7 Powered Auger 6x² + 7x − 3    (2x+3)(3x−1)      loaded: both ends constrained

     The `forge` group asserts every one of these is castable from metal a yard
     built out of 70 real smelts actually holds, so a precise target can never
     become an unreachable one. ---- */
MF.TOOLS = {
  pick: {
    /* WAS 'The Deep Pick', 'three lumps a swing'. MF.breakRock never read
       hasTool('pick') - the only thing the tool did anywhere in the build was
       change the swing button's LABEL. It cost 12 metal and cut exactly one
       lump, same as bare hands, and its own copy said otherwise.
       A prospector's pick is the real instrument for the job it does now: you
       test the rock before you commit to digging it. */

/* =========================================================================
   THE SCHEMAS. A tool is a METHOD, not a remark.

   USER DECISION, 2026-08-25 (MINE-SPEC §13): "Each tool is a schema for
   approaching the ore... The tools is help realize part of the factor not all
   the factor. The hammer should confirm the test."

   So the old binding rule loosens by exactly one notch and no further. An
   instrument may now show PART of a factorisation - one side of it, one step
   of a named method - and must never show all of it. And nothing here judges:
   what a student names goes to the anvil and the ROCK answers, which is the
   mine's only correctness signal (MINE-SPEC §11e).

   ONE SOURCE, THREE SURFACES. The same schema is rendered in the tool panel
   (worked on the live lump), in the forge's tutorial (worked on a fixed
   example, with a practice), and in the Casting Shed (all seven, readable
   before you own one). Three copies would be three chances to drift - the
   same reason _openSheet builds every dialog and quad() prints every
   expression.

   `steps(ore)` returns [{act, shows, open, draw}] for THIS lump. `open:true`
   marks the step the student has to take; it renders as a ? and is never
   filled in. `practice` is a FIXED lump, so the tutorial shows the same worked
   example every time and MF.validate can assert it against the engine.
   ========================================================================= */
MF.SCHEMA = {

  /* rank 1. The prospector's pick has no factoring move - it names the SHAPE
     of a lump still in the wall and stops there. Saying that plainly beats
     inventing a method for it. */

    why: 'Every other instrument works on a lump you have already dug. This one works one step earlier, at the wall: hold it to a lump in the seam and it names what KIND of ore it is — shared metal, a twin seam, a plain trinomial, a loaded one, or an ingot that is already pure. It tells you nothing about the answer. It tells you which shape you are about to be looking at, so choosing what to cut out is a decision instead of a lottery. Turning lumps over at the face costs nothing and breaks nothing.',
    steps: function(ore){
      return [
        {act:'At the seam, pick out a lump and hold the pick to it.', shows:'what kind is this?'},
        {act:'It names the shape — and stops there. Which numbers are in it is still yours to find.', shows:MF.ASSAY[MF.assayOf(ore)].name},
        {act:'On the floor it has nothing to say. By then you have the lump.', shows:MF.oreLabel(ore)}
      ];
    },
    practice: {ore:{kind:'number',n:12}, ask:'Name one whole number that runs through 12.', answer:{m:0,k:2}}
  },

     as a ?, because a factorisation has two sides and knowing one forces the
     other - it is exactly what is left when the first comes out. Which side

     still the student's. */
  lantern: {
    name: 'One side lit, one side dark',

    steps: function(ore){

    name: 'The whole-number test',
    why: 'Breaking rock finds seams that sit on whole numbers, and only those. Nudge a coefficient half a step and a seam that looked certain is gone &mdash; the rock has not changed, the search has. That is why some lumps will not come apart however hard you look at them.',
    steps: function(ore){
      return [
        {act:'Take the lump as it is and ask whether a whole-number seam runs through it.', shows:MF.oreLabel(ore)},

  shifter: {
    name: 'The box method',
    why: 'An x&sup2; can only come from two x-parts multiplied together, and the plain number on the end can only come from the two numbers multiplied together. Put those two in opposite corners of a box and the sides are forced. The two corners left over have to add up to the middle &mdash; that is the whole check.',

      return [

         draw: function(li){
           MF.areaModel(li, {
             rows:[{label:'?'},{label:'?'}],

  drill: {
    name: 'The pair hunt, and the difference of two squares',
    why: 'Two numbers that multiply to the end and add to the middle are exactly the two numbers in the brackets. When the middle is nothing at all and the end is a negative square, that pair is a number and its own opposite &mdash; the two middles cancel, and what is left is a difference of two squares.',
    steps: function(ore){
      if(ore.kind==='number') return [

/* =========================================================================
   THE X, AND THE BOX IT FEEDS. The diagram school actually teaches.

   USER DECISION, 2026-08-26 (MINE-SPEC §15): "these tools should be visual
   overlays, as if they were diagrams... teach the X method of factoring, which
   is still popular in school... at least one number needs to be a ?"

   THE METHOD, so the code and the classroom agree on what is being drawn:
   for ax² + bx + c you put a·c at the TOP of an X and b at the BOTTOM, and the
   two numbers that multiply to the top and add to the bottom go LEFT and
   RIGHT. With a = 1 those two are the bracket constants and you are finished.
   With a ≠ 1 they split the middle term into two, and the four terms go into a
   2×2 box whose rows and columns give up the factors when you pull the common
   metal off each one.

   AT LEAST ONE CELL IS ALWAYS A ?. Pass null for it. This is the user's rule
   and it is also the rule the `schema` group already enforced from the other
   direction: on a monic trinomial the two sides of the X ARE the two bracket
   constants, so filling both in would be printing the whole factorisation, and
   the check fails the build for it. The two rules are one rule.

   NOT ONE NUMBER IS IN THE SVG. VERIFICATION §59: SVG <text> paints with
   `fill` and inherits the `color` a contrast sweep reads, which is real
   arithmetic about pixels the property never touches - ten labels failed at
   1.06:1 the last time this rule was broken. The strokes are SVG; every number
   is an HTML span pinned over them in percentages, the way MF.shedArt does it.
   ========================================================================= */
MF.xDiagram = function(host, o){
  var wrap = E('div','xdia');
  var W = 260, VH = 190;
  var svg = S('svg',{viewBox:'0 0 '+W+' '+VH, preserveAspectRatio:'xMidYMid meet','aria-hidden':'true'});
  var labs = E('div','xlabs');

  /* the two strokes of the X */
  ['M40 34 L220 156','M220 34 L40 156'].forEach(function(d){
    svg.appendChild(S('path',{d:d, stroke:'#C8B89A','stroke-width':'5',fill:'none','stroke-linecap':'round'}));
  });
  /* a disc behind each cell so a number never sits on a stroke */
  [[130,26],[130,164],[36,95],[224,95]].forEach(function(c){
    svg.appendChild(S('ellipse',{cx:String(c[0]),cy:String(c[1]),rx:'34',ry:'21',
      fill:'#FFFCF6',stroke:'#C8B89A','stroke-width':'2.5'}));
  });

  function cell(x, y, val, cls){
    var known = (val !== null && val !== undefined && val !== '');
    var n = H('span','xcell ' + (cls||'') + (known?'':' open'),
      known ? String(val) : '<span class="qm">?</span>');
    n.style.left = ((x/W)*100).toFixed(2) + '%';
    n.style.top  = ((y/VH)*100).toFixed(2) + '%';
    labs.appendChild(n);
  }
  cell(130, 26,  o.top,    'xtop');
  cell(130, 164, o.bottom, 'xbot');
  cell(36,  95,  o.left,   'xside');
  cell(224, 95,  o.right,  'xside');

  wrap.appendChild(svg);
  wrap.appendChild(labs);

  var box = E('div','xwrap');
  box.appendChild(wrap);
  var key = E('div','xkey');
  key.appendChild(H('div','xk','<b>top</b> — what they multiply to' + (o.topWhy ? ' <span class="dim">' + o.topWhy + '</span>' : '')));
  key.appendChild(H('div','xk','<b>bottom</b> — what they add to' + (o.botWhy ? ' <span class="dim">' + o.botWhy + '</span>' : '')));
  key.appendChild(H('div','xk','<b>sides</b> — the pair you are hunting'));
  box.appendChild(key);
  host.appendChild(box);

  /* an accessible reading of the same thing, because the numbers are the point */
  box.setAttribute('role','img');
  box.setAttribute('aria-label','An X diagram. Top: ' + (o.top==null?'unknown':o.top) +
    ', the number the pair multiplies to. Bottom: ' + (o.bottom==null?'unknown':o.bottom) +
    ', the number the pair adds to. Left: ' + (o.left==null?'unknown':o.left) +
    '. Right: ' + (o.right==null?'unknown':o.right) + '.');
  return box;
};

/* THE SPLIT: one lump above, two pieces below, one of them still a ?.
   The lantern's whole reading in a picture - a factorisation has two sides,
   and knowing one forces the other. Same rule as the X: strokes in SVG, every
   number an HTML span over them (VERIFICATION §59). */
MF.splitDiagram = function(host, o){
  var wrap = E('div','xdia splitdia');
  var W = 300, VH = 140;
  var svg = S('svg',{viewBox:'0 0 '+W+' '+VH, preserveAspectRatio:'xMidYMid meet','aria-hidden':'true'});
  /* the whole, and the two it comes apart into */
  svg.appendChild(S('rect',{x:'70',y:'8',width:'160',height:'40',rx:'9',
    fill:'#FFFCF6',stroke:'#C8B89A','stroke-width':'3'}));
  [[16,92],[172,92]].forEach(function(b){
    svg.appendChild(S('rect',{x:String(b[0]),y:'92',width:'112',height:'40',rx:'9',
      fill:'#FFFCF6',stroke:'#C8B89A','stroke-width':'3'}));
  });
  /* the two limbs down to them */
  ['M150 48 L72 92','M150 48 L228 92'].forEach(function(d){
    svg.appendChild(S('path',{d:d,stroke:'#C8B89A','stroke-width':'4',fill:'none','stroke-linecap':'round'}));
  });
  var labs = E('div','xlabs');
  function cell(x,y,val,cls){
    var known = (val !== null && val !== undefined && val !== '');
    var n = H('span','xcell ' + (cls||'') + (known?'':' open'),
      known ? String(val) : '<span class="qm">?</span>');
    n.style.left = ((x/W)*100).toFixed(2) + '%';
    n.style.top  = ((y/VH)*100).toFixed(2) + '%';
    labs.appendChild(n);
  }
  cell(150, 28, o.whole, 'xtop');
  cell(72, 112, o.left, 'xside');
  cell(228, 112, o.right, 'xside');
  wrap.appendChild(svg); wrap.appendChild(labs);
  var box = E('div','xwrap');
  box.appendChild(wrap);
  if(o.key){
    var k = E('div','xkey');
    k.appendChild(H('div','xk', o.key));
    box.appendChild(k);
  }
  box.setAttribute('role','img');
  box.setAttribute('aria-label','A split diagram. ' + (o.whole==null?'A lump':o.whole) +
    ' comes apart into ' + (o.left==null?'an unknown piece':o.left) + ' and ' +
    (o.right==null?'an unknown piece':o.right) + '.');
  host.appendChild(box);
  return box;
};

/* A LINE OF WORKING WITH HOLES IN IT. `parts` is a list of strings and nulls;
   a null is drawn as a ?. This is what "line-by-line steps with some numbers
   redacted" means in markup, and it is one function so a step cannot invent
   its own way of hiding a number. */
MF.workLine = function(host, label, parts, cls){
  var row = E('div','wline' + (cls?' '+cls:''));
  if(label) row.appendChild(H('span','wlab', label));
  var eq = E('span','weq');
  parts.forEach(function(p){
    if(p === null || p === undefined) eq.appendChild(H('span','qm','?'));
    else eq.appendChild(H('span','wpart', String(p)));
  });
  row.appendChild(eq);
  host.appendChild(row);
  return row;
};

/* THE X-BOX: the four terms in a 2×2, with the factors read off the edges.
   MF.areaModel already draws a box with dashed unknown sides and it is used by
   the Casting Shed and the Shifter, so this hands it the four corners rather
   than drawing a second kind of box that could drift from the first. */
MF.xBox = function(host, o){
  return MF.areaModel(host, {
    rows: o.rows, cols: o.cols, cells: o.cells,
    caption: o.caption,
    a11y: o.a11y || 'A two by two box holding the four terms, with the factors along its edges.'
  });
};

/* THE SIMPLER SIDE OF A LUMP, and only ever one of them. Plain metal before a
   bracket, and the smaller bracket before the larger, so the half the lantern
   lights is the half that leaves the most work behind. Returns null for native
   metal - an element has no two sides. */
MF.simplestFactor = function(ore){
  if(!ore || MF.isNative(ore)) return null;
  if(ore.kind==='number'){
    var pf = primeFactors(ore.n);
    return pf.length > 1 ? {m:0, k:pf[0]} : null;
  }
  var res = MF.smeltPoly(ore.a, ore.b, ore.c);
  var cand = (res.ingots||[]).filter(function(g){
    return !(g.m===0 && g.k===0) && !(g.m===0 && Math.abs(g.k)===1);
  });
  if(!cand.length) return null;
  cand.sort(function(x,y){
    if((x.m===0) !== (y.m===0)) return x.m===0 ? -1 : 1;      /* plain metal first */
    return (Math.abs(x.m)+Math.abs(x.k)) - (Math.abs(y.m)+Math.abs(y.k));
  });
  return cand[0];
};

/* THE METHOD, CREDITED IN ONE LINE, WITH THE ESSAY A CLICK AWAY.

   The tool panels used to carry the whole schema: name, a paragraph of
   reasoning, and the numbered method narrated in sentences. All true, all
   prose, and it is what the panel opened on. The `visual` group counts the
   prose outside the diagrams and fails the build over it now.

   The reading in the mine DRAWS. The reading that EXPLAINS lives in the
   Casting Shed, where MF.drawLesson walks the method a step at a time on a
   lump chosen for it - so nothing was deleted, it moved to the room built for
   reading. This is the pointer between the two.

   The lesson at the far end of this button exists only for a tool that has
   been cast (§29). That is not a problem for this line: it is drawn ON a tool
   panel, and a tool panel only exists for an instrument in your hand. */
MF.methodLine = function(host, key){
  var s = MF.SCHEMA[key];
  if(!s) return null;
  var row = E('div','methodline');
  row.appendChild(H('span','mlab','THE METHOD'));
  row.appendChild(H('span','mnm', s.name));
  var b = E('button','btn mlgo','read it in the Casting Shed &rarr;'); b.type='button';
  b.innerHTML = 'read it in the Casting Shed &rarr;';
  b.setAttribute('aria-label','Read the full method for ' + s.name + ' in the Casting Shed');
  on(b,'click',function(){ MF.closeTool(); MF.go('shed-methods'); });
  row.appendChild(b);
  host.appendChild(row);
  return row;
};

/* the method, drawn. Appends; never owns its host (the areaModel rule). */
MF.paintSchema = function(host, key, ore){
  var s = MF.SCHEMA[key];
  if(!s) return null;
  var box = E('div','schema');
  box.appendChild(H('div','slab','THE METHOD'));
  box.appendChild(H('div','snm', s.name));
  /* THE REASONING FOLDS AWAY. It is the best paragraph in the panel and it was
     the first thing on screen, which made every tool open on a wall of prose.
     A student who wants it opens it; a student who wants to work does not have
     to scroll past it. */
  var whyD = document.createElement('details');
  whyD.className = 'swhyfold';
  var whyS = document.createElement('summary');
  whyS.textContent = 'why this works';
  whyD.appendChild(whyS);
  whyD.appendChild(H('div','swhy', s.why));
  box.appendChild(whyD);
  var steps = [];
  try { steps = s.steps(ore) || []; }
  catch(e){
    box.appendChild(H('div','hint','This method does not reach that lump.'));
    host.appendChild(box); return box;
  }
  var ol = E('ol','ssteps');
  steps.forEach(function(st){
    var li = E('li', st.open ? 'open' : null);
    li.appendChild(H('div','sact', st.act));
    if(st.shows) li.appendChild(H('div','sshow', st.shows));
    if(st.draw){ try { st.draw(li); } catch(e2){} }
    ol.appendChild(li);
  });
  box.appendChild(ol);
  if(steps.some(function(st){ return st.open; }))
    box.appendChild(H('div','sfoot','The open steps are yours. Nothing here does them, and nothing here says whether you have them right.'));
  host.appendChild(box);
  return box;
};

/* CARRYING A NAMED FACTOR TO THE ANVIL.

   The panel does not judge - the hammer does (MINE-SPEC §11e). So what a
   student writes in the ? goes into the pick bar and they swing it, and the
   rock answers exactly as it does for anything else they type.

   B.rawFor IS LOAD-BEARING: paintBreak resets B.raw to MF.pickDefault whenever
   B.rawFor !== the id of the piece under the pick, so setting raw without
   rawFor would be thrown away on the very next paint and the bar would open
   empty with nothing on screen saying why. */
MF.cutHammerTo = function(pieceId, m, k){
  var B = MF.state.anvil;
  if(!B) return false;
  var at = -1;
  B.floor.forEach(function(pc, i){ if(pc.id===pieceId) at = i; });
  if(at < 0) return false;
  if(MF.isNative(B.floor[at].ore)) return false;
  B.at = at;
  B.raw = {m:String(m), k:String(k)};
  B.rawFor = B.floor[at].id;
  B.last = null;
  MF.closeTool();
  MF.paintMine();
  return true;
};

/* THE ? FILLED IN, AND TAKEN TO THE HAMMER. Only drawn when the panel knows
   which piece it is standing on - off the breaking floor there is no bar to
   cut, and a button that cannot do its one job is worse than no button.

   It reports nothing about the answer. That is the whole point of it. */
MF.paintNameSide = function(host, ore, pieceId){
  var B = MF.state.anvil;
  if(pieceId == null || !B) return null;
  var here = null;
  B.floor.forEach(function(pc){ if(pc.id===pieceId) here = pc; });
  if(!here || MF.isNative(here.ore)) return null;

  var isNum = (ore.kind==='number');
  var wrap = E('div','nameside');
  wrap.appendChild(H('div','nslab','THE OTHER SIDE'));
  wrap.appendChild(H('div','nshint','Write what you think it is, then take it to the anvil. The hammer is the only thing here that confirms anything.'));
  var row = E('div','nsrow');
  var box = E('div','hbox');
  var mi = null;
  if(!isNum){
    box.appendChild(H('span','paren','('));
    mi = document.createElement('input'); mi.type='text'; mi.inputMode='numeric'; mi.placeholder='1';
    mi.setAttribute('aria-label','how many x — leave it empty for a single x, or put 0 for a plain number');
    box.appendChild(mi);
    box.appendChild(H('span','paren','x +'));
  }
  var ki = document.createElement('input'); ki.type='text'; ki.inputMode='numeric'; ki.placeholder='0';
  ki.setAttribute('aria-label', isNum ? 'the number you think runs through it' : 'the number on the end');
  box.appendChild(ki);
  if(!isNum) box.appendChild(H('span','paren',')'));
  row.appendChild(box);

  var say = E('div','nssay');
  var go = E('button','btn primary','Cut the hammer to it'); go.type='button';
  on(go,'click',function(){
    var m = isNum ? 0 : MF.readPickM(mi.value);
    var k = MF.readInt(ki.value);
    if(!isFinite(m) || !isFinite(k) || isNaN(m) || isNaN(k)){
      clear(say).appendChild(H('div','hint','That is not a whole number, so there is nothing to cut the head to yet.'));
      return;
    }
    /* NOT A VERDICT. It cuts the bar and sends them to the anvil; whether the
       seam runs is the swing's to say and nothing else's. */
    if(!MF.cutHammerTo(pieceId, m, k))
      clear(say).appendChild(H('div','hint','That piece is not on the floor any more.'));
  });
  row.appendChild(go);
  wrap.appendChild(row);
  wrap.appendChild(say);
  host.appendChild(wrap);
  return wrap;
};

/* THE PAIR THE X IS HUNTING, and which side of it to light.

   Returns {ac, b, p, q} for a trinomial that factors over the whole numbers:
   p and q multiply to a·c and add to b. Straight off the engine's own
   factorisation rather than searched for again here, because two things that
   compute the same pair are two things that can disagree about it. */
MF.xPair = function(ore){
  if(!ore || ore.kind !== 'poly' || ore.a === 0) return null;
  var ac = ore.a * ore.c, res = MF.smeltPoly(ore.a, ore.b, ore.c);
  if(!res.ingots) return null;
  var br = res.ingots.filter(function(g){ return g.m !== 0; });
  if(br.length !== 2) return null;
  /* (m1 x + k1)(m2 x + k2) splits the middle into m1·k2 and m2·k1 */
  var g0 = res.ingots.filter(function(g){ return g.m === 0; })[0];
  var s = g0 ? g0.k : 1;
  var p = br[0].m * br[1].k * s, q = br[1].m * br[0].k * s;
  if(p * q !== ac || p + q !== ore.b) return null;
  return {ac:ac, b:ore.b, p:p, q:q};
};

/* =========================================================================
   WHAT A TOOL DOES WHEN YOU HOLD IT TO A PIECE OF ROCK.

   EVERY PANEL OPENS ON A PICTURE. They used to open on a method name, a
   paragraph of reasoning and a numbered list of sentences - correct, and
   almost entirely prose. A tool that has to be read before it can be used is
   a tool a student puts down. The reasoning is still here; it is behind a
   "why this works" fold, under the diagram.

   THE BINDING RULE, AS AMENDED 2026-08-25 (MINE-SPEC §13) AND EXTENDED
   2026-08-26 (§15): an instrument may show PART of a factorisation and never
   all of it, and what it shows is DRAWN with at least one number left as a ?.
   The X's two sides are the pair; one of them is always open. The box's edges
   are the factors; at least one is always dashed.

   AND NOTHING IN HERE JUDGES. What a student writes in the ? goes to the pick
   bar and they swing it. The rock is the only judge in the mine (§11e).

   `pieceId` is optional: the piece on the breaking floor this reading stands
   on, and what lets a reading reach the hammer.
   ========================================================================= */
/* =========================================================================
   THE LENS: A TOOL CHANGES THE ORE, NOT THE PAGE BESIDE IT.

   USER DECISION, 2026-08-30: "the tools need to act like tools not text
   boxes... Students should see ore in front of them, apply a tool, and the
   visual of the ore changes... literally making the ore data appear different
   giving clues to how to properly factor."

   Every instrument used to open a sheet NEXT TO the lump, so the lump sat
   there unchanged while a panel explained it. A tool is a lens now: the same
   expression, rearranged, so the structure the tool is about becomes visible
   IN THE ORE ITSELF.

     Steel Pick   6x² + 15x       ->  3·2x² + 3·5x        the shared metal, inside every term
     Core Drill   x² − 5x + 6     ->  the X, from this lump's own numbers
     Auger        6x² + 7x − 3    ->  6x² + 9x − 2x − 3   the middle term, split
     Shifter      x² + 8x + 16    ->  the same terms, laid out as a 2×2 box
     Lantern      any             ->  ( x − 2 ) × ( ? )   one side lit, one dark
     Dial         x² + 3x + 2     ->  the tail on a dial you can turn

   THE BINDING RULE: A LENS REARRANGES AND NEVER ADDS. Every form it draws must
   smelt back to the lump it was handed - `lens` asserts exactly that, because
   a tool that quietly changes the maths while claiming to reveal it is worse
   than a paragraph. And §13 still holds: at least one number stays a ?.

   Each entry returns null when it has nothing to say about this shape of ore,
   or {found, draw}: `found` is ONE LINE naming what it found, `draw` fills a
   host with the transformed ore. The compact form carries `found` so the
   click that expands it adds detail rather than revealing the only detail.
   ========================================================================= */

/* a lump's terms in reading order, with the coefficient and what it carries */
function oreTerms(ore){
  if(!ore) return [];
  if(ore.kind === 'number') return [{v:ore.n, suf:''}];
  var t = [];
  if(ore.a) t.push({v:ore.a, suf:'x<sup>2</sup>'});
  if(ore.b) t.push({v:ore.b, suf:'x'});
  if(ore.c) t.push({v:ore.c, suf:''});
  return t;
}
/* the operator that joins term i to the one before it, and the unsigned body */
function termParts(t, i){
  var op = i === 0 ? (t.v < 0 ? '−' : '') : (t.v < 0 ? ' − ' : ' + ');
  return {op:op, mag:Math.abs(t.v), suf:t.suf};
}

MF.LENS = {};

/* THE INFORMATION GOES IN THE ORE, NOT BESIDE IT.

   USER, 2026-08-30, and it is the correction to the first attempt: "Critical:
   Information needs to appear in the ore. NOT next to it while in the Mine or
   Yard. Tutorials can have numbers out of the ore for teaching purposes."

   The first lens drew a box UNDER the lump with the finding in it, which is a
   panel beside the rock wearing a different hat. A lens returns HTML that
   REPLACES the ore's own label. `6x² + 15x` in the cart does not grow a note
   saying every term carries 3 - it becomes `3·2x² + 3·5x`.

   Six instruments, six re-spellings, and each opens a different part:

     steel    6x² + 15x      ->  3·2x² + 3·5x          the shared metal, inside every term
     lantern  2x² + 10x + 12 ->  ( 2 )( ? )            the whole thing as a product
     drill    x² − 5x + 6    ->  x² + ( −2 + ? )x + 6  the MIDDLE, as a sum
     shifter  x² − 5x + 6    ->  x² − 5x + ( −2 · ? )  the END, as a product
     auger    6x² + 7x − 3   ->  6x² + 9x + ?x − 3     the middle actually split in two
     dial     x² + 3x + 2    ->  x² + 3x + ⟨2⟩         the tail, marked as the thing that moves

   THE DIAGRAMS DID NOT SURVIVE INTO THE MINE, and that is the point. An X and
   a 2×2 box are teaching apparatus - numbers taken OUT of the ore and laid
   beside it - so they belong in the Casting Shed and the Stamp Mill, which is
   where the `how?` on every belt loop goes (§20b). The mine gets the ore.

   THE BINDING RULE IS UNCHANGED: a lens rearranges and never adds. Whatever it
   spells must multiply back to the lump. And §13 holds - at least one `?`,
   except where the re-spelling IS the whole reading and has no unknown in it
   (steel and dial, which mark rather than ask). */

function lensMark(cls, s){ return '<span class="' + cls + '">' + s + '</span>'; }

/* THE STEEL PICK: the shared metal written inside every term it hides in. */
MF.LENS.steel = function(ore){
  var g = MF.commonMetal(ore);
  if(!g) return null;
  var terms = oreTerms(ore), G = Math.abs(g);
  if(!terms.length) return null;
  var out = '';
  terms.forEach(function(t, i){
    var p = termParts(t, i);
    if(p.op) out += lensMark('lop', p.op);
    var unit = p.mag / G;
    out += '<span class="lterm">' + lensMark('lshared', num(G)) + lensMark('ldot','·') +
           lensMark('lrest', (unit === 1 && p.suf) ? p.suf : (num(unit) + p.suf)) + '</span>';
  });
  return {html: out, found: 'every term carries ' + num(G)};
};

/* THE PIT LANTERN: the lump written as a product, one side lit. */
MF.LENS.lantern = function(ore){
  if(MF.isNative(ore)) return null;      /* nothing to open; the chip is already the answer */
  var one = MF.simplestFactor(ore);
  if(!one) return null;
  return {
    html: lensMark('llit','( ' + ingotHtml(one) + ' )') + lensMark('ldot','') +
          lensMark('ldark','( ' + lensMark('lqm','?') + ' )'),
    found: 'one side of it is ' + ingotText(one)
  };
};

/* THE CORE DRILL: the MIDDLE term, opened up as the sum it is. */
MF.LENS.drill = function(ore){
  if(ore.kind === 'number' || ore.a === 0) return null;
  var pr = MF.xPair(ore);
  if(!pr) return null;
  var head = ore.a ? sqTerm(ore.a) : '';
  var tail = ore.c ? (ore.c < 0 ? lensMark('lop',' − ') + num(Math.abs(ore.c))
                                : lensMark('lop',' + ') + num(ore.c)) : '';
  return {
    html: head + lensMark('lop',' + ') +
          lensMark('lsplit','( ' + num(pr.p) + ' + ' + lensMark('lqm','?') + ' )x') + tail,
    found: 'the middle is a sum'
  };
};

/* THE EXPONENT RAIL: the END term, opened up as the product it is. */
MF.LENS.shifter = function(ore){
  if(ore.kind === 'number' || ore.a === 0 || !ore.c) return null;
  var pr = MF.xPair(ore);
  if(!pr) return null;
  var head = sqTerm(ore.a);
  var mid = ore.b ? (ore.b < 0 ? lensMark('lop',' − ') + xt2(Math.abs(ore.b))
                               : lensMark('lop',' + ') + xt2(ore.b)) : '';
  return {
    html: head + mid + lensMark('lop',' + ') +
          lensMark('lsplit','( ' + num(pr.p) + ' · ' + lensMark('lqm','?') + ' )'),
    found: 'the end is a product'
  };
};

/* THE POWERED AUGER: the middle actually split into the two terms it makes. */
MF.LENS.auger = function(ore){
  if(ore.kind === 'number' || ore.a === 0) return null;
  var pr = MF.xPair(ore);
  if(!pr) return null;
  var tail = ore.c ? (ore.c < 0 ? lensMark('lop',' − ') + num(Math.abs(ore.c))
                                : lensMark('lop',' + ') + num(ore.c)) : '';
  return {
    html: sqTerm(ore.a) +
          lensMark('lop', pr.p < 0 ? ' − ' : ' + ') + lensMark('lsplit', xt2(Math.abs(pr.p))) +
          lensMark('lop',' + ') + lensMark('lqm','?') + 'x' + tail,
    found: 'four terms, not three'
  };
};

/* THE DECIMAL DIAL: the tail marked as the number that moves. */
MF.LENS.dial = function(ore){
  if(ore.kind === 'number' || ore.a === 0 || !ore.c) return null;
  var head = sqTerm(ore.a);
  var mid = ore.b ? (ore.b < 0 ? lensMark('lop',' − ') + xt2(Math.abs(ore.b))
                               : lensMark('lop',' + ') + xt2(ore.b)) : '';
  return {
    html: head + mid + lensMark('lop',' + ') + lensMark('ldial','&#10216;' + num(ore.c) + '&#10217;'),
    found: 'the tail is the thing that moves'
  };
};

/* THE PROSPECTOR'S PICK: does this come apart at all?

   USER, 2026-08-30: "the prospector pick has no effect on the ore in the mine
   and will appear to be a useless tool". It read at the FACE only (§17a), so
   in the cart and on the floor it did nothing - and now that an instrument's
   whole visible job is re-spelling the rock it is dropped on, a tool that
   re-spells nothing is the Deep Pick's original sin wearing a new name.

   Its reading is the cheapest one there is, which is right for the cheapest
   tool: it says whether the lump is a PRODUCT or an ELEMENT, and names
   neither side. The lantern lights one side; this only says there is one.
     6x + 15  ->  ( ? )( ? )
     x² + 4   ->  x² + 4, marked as final
   Distinct from every other lens, honest about how little it knows, and it
   leaves everything open. */
MF.LENS.pick = function(ore){
  if(MF.isNative(ore)){
    return {
      html: lensMark('lfinal', MF.oreLabel(ore)) + lensMark('lop',' ') + lensMark('lfinal','&#9670;'),
      found: 'nothing moves in there'
    };
  }
  return {
    html: lensMark('ldark','( ' + lensMark('lqm','?') + ' )') +
          lensMark('ldark','( ' + lensMark('lqm','?') + ' )'),
    found: 'it comes apart'
  };
};

/* WHAT A LENS IS ALLOWED TO CLAIM. Handed a lump and a tool, either a reading
   or null - and null is a real answer, not a failure: an instrument that has
   nothing to say about this shape should say nothing rather than invent. */
MF.lensFor = function(ore, tk){
  var fn = MF.LENS[tk];
  if(!fn || !ore) return null;
  try { return fn(ore) || null; } catch(e){ return null; }
};

/* THE ORE, AS IT SHOULD BE DRAWN RIGHT NOW. This is what every place a lump
   appears in the mine and the yard calls instead of MF.oreLabel: with no
   instrument on it, it is the expression; with one, it is the expression
   re-spelt by that instrument. One function, so a lump cannot be drawn
   one way in the cart and another on the floor. */
MF.oreDisplay = function(o){
  if(!o) return '';
  var tk = o.tool;
  if(tk && MF.hasTool(tk)){
    var read = MF.lensFor(o, tk);
    if(read && read.html) return '<span class="lensed">' + read.html + '</span>';
  }
  return MF.oreLabel(o);
};

/* =========================================================================
   A LUMP OF ORE, DRAWN, WITH ITS NUMBERS CUT INTO THE STONE.

   USER, 2026-08-30, pointing at the anvil and then at the cart: "This is an
   example of text inside the ore… This is an example of information not in
   the ore. You keep getting this wrong and all your tests are failing."

   They were right on both counts. The cart drew a lump as `.lump{background:
   #fff; border-radius:11px; min-height:44px}` - a white LIST ROW with a small
   glyph and a text label beside it - while the anvil drew a rock with 37 cut
   into it. "In the ore" means ON THE STONE, and I had read it three times as
   "in the ore's text".

   AND THE CHECKS PASSED THROUGHOUT, which is the more serious half. `lens`
   verified that a re-spelling was arithmetically true and carried no prose. It
   never asked where the numbers were. A group can be green across two hundred
   checks and measuring the wrong property the whole way.

   THE NUMBERS ARE HTML PINNED OVER THE SVG, not SVG <text> (§59): a lens marks
   the shared metal and the open ? in colour, and SVG text paints with `fill`
   while inheriting the `color` a contrast sweep reads - which is how ten
   labels once shipped at 1.06:1. The stone is SVG; every character on it is a
   span.
   ========================================================================= */
MF.oreRock = function(o, opts){
  var op = opts || {};
  var wrap = E('div','orerock' + (op.native ? ' native' : '') + (op.big ? ' big' : ''));
  var svg = S('svg',{viewBox:'0 0 150 104', preserveAspectRatio:'xMidYMid meet','aria-hidden':'true'});
  var body = op.native ? '#D9B45C' : '#7A6650',
      edge = op.native ? '#8A6A2A' : '#2E2620',
      face = op.native ? '#F2DCA4' : '#8F7A61';
  /* the stone: one flat silhouette and a dark outline, the way everything on
     this site is drawn since the anvil was flattened */
  svg.appendChild(S('polygon',{
    points:'10,54 30,24 70,10 116,18 140,44 136,80 98,96 46,94 14,76',
    fill:body, stroke:edge,'stroke-width':'4','stroke-linejoin':'round'}));
  /* one lit facet, so it reads as a solid and not a blob */
  svg.appendChild(S('polygon',{points:'30,24 70,10 116,18 84,40 44,42',fill:face,opacity:'.55'}));
  /* THE SEAM, and only on rock that still has one. On native metal there is
     nothing running through it and drawing a seam would be a lie. */
  /* THE SEAM RUNS UNDER THE NUMBERS, not through them. At y=62 it crossed the
     label, and an orange stroke behind an expression is noise on the one thing
     the stone exists to show. */
  if(!op.native)
    svg.appendChild(S('path',{d:'M20 80 q30 -12 60 -6 q28 3 52 -7',fill:'none',
      stroke:'#C96A1F','stroke-width':'4','stroke-linecap':'round'}));
  wrap.appendChild(svg);
  var lab = E('div','orelab');
  lab.innerHTML = MF.oreDisplay(o);
  wrap.appendChild(lab);
  return wrap;
};

/* and the same thing as plain words, for an aria-label */
MF.oreDisplayText = function(o){
  if(!o) return '';
  var tk = o.tool;
  if(tk && MF.hasTool(tk)){
    var read = MF.lensFor(o, tk);
    if(read) return MF.oreText(o) + ', read by the ' + (MF.TOOLS[tk] ? MF.TOOLS[tk].nm : tk) +
      ' as ' + String(read.html).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
  }
  return MF.oreText(o);
};

MF.TOOL_READ = {
  /* THE PIT LANTERN: is there still a seam in this, and if there is, one side
     of it. This is the tool the whole repeated swing hangs off. */
  lantern: function(host, ore, pieceId){
    var native = MF.isNative(ore);
    var lit = E('div','lampread' + (native?' clear':' seamed'));
    lit.appendChild(H('div','big', native
      ? 'Nothing moves in there.'
      : 'A seam still runs through this one.'));
    lit.appendChild(H('div','sm', native
      ? (ore.kind==='number'
          ? 'It is a prime. Held to the light it stays exactly what it is.'
          : 'No whole-number seam runs through it. It is an element — the same kind of object as a prime.')
      : 'It will come apart. The lantern lights one side and leaves the other dark.'));
    host.appendChild(lit);
    if(native){ MF.methodLine(host, "lantern"); return; }
    var one = MF.simplestFactor(ore);
    if(one){
      host.appendChild(H('div','diaglab','WHAT THE LIGHT REACHES'));
      MF.splitDiagram(host, {whole:MF.oreLabel(ore), left:'( ' + ingotHtml(one) + ' )', right:null,
        key:'One side is lit. The other is whatever is left when that one comes out — and the lantern will not light it.'});
    }
    MF.methodLine(host, 'lantern');
    MF.paintNameSide(host, ore, pieceId);
  },

  /* THE CORE DRILL: the X, and the pairs that could fill it. */
  drill: function(host, ore, pieceId){
    if(ore.kind==='number'){
      MF.workLine(host, 'every pair that multiplies to', [num(ore.n)], 'wbig');
      MF.scanTable(host, ore.n, null);
      host.appendChild(H('div','hint','No row is marked. Any of them can be swung; some leave more still to break.'));
      MF.methodLine(host, "drill");
      MF.paintNameSide(host, ore, pieceId);
      return;
    }
    if(ore.a===0){
      MF.workLine(host, 'no x² to hunt in — look at', [num(ore.b), ' and ', num(ore.c), ' together'], 'wbig');
      MF.methodLine(host, "drill");
      MF.paintNameSide(host, ore, pieceId);
      return;
    }
    /* THE X, WITH ONE SIDE LIT AND ONE OPEN */
    var pr = MF.xPair(ore);
    host.appendChild(H('div','diaglab','THE X — ' + (ore.a===1 ? 'the end on top, the middle below' : 'a·c on top, the middle below')));
    MF.xDiagram(host, {
      top: num(ore.a * ore.c), bottom: num(ore.b),
      left: pr ? num(pr.p) : null, right: null,
      topWhy: ore.a===1 ? '' : '= ' + num(ore.a) + ' × ' + num(ore.c),
      botWhy: ''
    });
    if(pr){
      MF.workLine(host, 'so the pair is', [num(pr.p), ' and ', null], 'wbig');
      host.appendChild(H('div','hint','One side is lit. The other multiplies with it to <b>' +
        num(ore.a*ore.c) + '</b> and adds with it to <b>' + num(ore.b) + '</b>.'));
    } else {
      host.appendChild(H('div','hint','No whole pair fills this X. That is the reading — nothing whole comes out of it.'));
    }
    var tgt = (ore.a===1) ? ore.c : ore.a*ore.c;
    if(Math.abs(tgt) < 600){
      host.appendChild(H('div','diaglab','EVERY PAIR THAT MULTIPLIES TO ' + num(tgt)));
      MF.scanTable(host, tgt, null);
      host.appendChild(H('div','hint','No row is marked. The drill reads the rock; it does not choose.'));
    }
    MF.methodLine(host, 'drill');
    MF.paintNameSide(host, ore, pieceId);
  },

  /* THE EXPONENT RAIL: the X carried into the box. */
  shifter: function(host, ore, pieceId){
    if(ore.kind==='number' || ore.a===0){
      host.appendChild(H('p','hint','<b>No x² in this one.</b> The box needs one for its first corner.'));
      MF.methodLine(host, "shifter");
      return;
    }
    var pr = MF.xPair(ore);
    host.appendChild(H('div','diaglab','THE X FIRST'));
    MF.xDiagram(host, {
      top: num(ore.a * ore.c), bottom: num(ore.b),
      left: pr ? num(pr.p) : null, right: null,
      topWhy: ore.a===1 ? '' : '= ' + num(ore.a) + ' × ' + num(ore.c)
    });
    host.appendChild(H('div','diaglab','AND THE PAIR GOES IN THE BOX'));
    MF.xBox(host, {
      rows:[{label:'?'},{label:'?'}],
      cols:[{label:'?'},{label:'?'}],
      cells:[[{kind:'sq',text:quadText(ore.a,0,0)},{kind:'x',text: pr ? xt2(pr.p) : '?'}],
             [{kind:'x',text:'?'},{kind:'k',text:num(ore.c)}]],
      caption:'Two corners are given, one is lit, and every side is still open.',
      a11y:'A two by two box with ' + quadText(ore.a,0,0) + ' in one corner and ' + num(ore.c) +
           ' in the opposite corner, and every side marked with a question mark.'
    });
    MF.workLine(host, 'the two middles must come to', [xt2(ore.b)], 'wbig');
    host.appendChild(H('div','hint','Pull the common metal off each row and each column, and the sides of the box are the answer.'));
    MF.methodLine(host, 'shifter');
    MF.paintNameSide(host, ore, pieceId);
  },

  /* THE DECIMAL DIAL: why nothing will come out, when nothing will. */
  dial: function(host, ore, pieceId){
    if(ore.kind==='number'){
      host.appendChild(H('p','hint','<b>The dial is cut for lumps with an x in them.</b>'));
      MF.methodLine(host, "dial");
      return;
    }
    MF.paintDial(host, {ore:ore});
    MF.methodLine(host, 'dial');
    MF.paintNameSide(host, ore, pieceId);
  },

  /* THE PROSPECTOR'S PICK works at the face, not on the floor. Its reading
     happens one step earlier than every other instrument's - in MF.paintFace,
     on a lump still in the wall - so by the time a lump is down here the pick
     has already said everything it has to say. */
  pick: function(host, ore, pieceId){
    host.appendChild(H('p','hint','<b>This one works at the seam, not on the floor.</b> Hold it to a lump still in the wall and it names what kind of ore is in there before you cut it out. Down here you already have the lump.'));
    MF.methodLine(host, "pick");
  },

  /* THE STEEL PICK: the common metal, drawn out in front of a bracket. */
  steel: function(host, ore, pieceId){
    var g = MF.commonMetal(ore);
    if(!g){
      /* NOTHING TO BITE ON IS STILL A READING, and it still gets drawn. A
         panel that answers "no" in a sentence and stops is the wall of text
         this whole change is against - so it shows the terms, shows that only
         1 divides all of them, and hands the lump to the method that does
         apply here. */
      host.appendChild(H('div','diaglab','WHAT EVERY TERM DIVIDES BY'));
      var sTerms = (ore.kind==='number') ? [num(ore.n)]
        : [ore.a?sqTerm(ore.a):null, ore.b?xt2(ore.b):null, ore.c?num(ore.c):null].filter(Boolean);
      MF.workLine(host, null, [sTerms.join('   ')], 'wbig');
      MF.workLine(host, 'the biggest that divides them all', ['1'], 'wbig');
      host.appendChild(H('div','hint','So there is nothing to stand in front of a bracket. The pair hunt is the way into this one:'));
      if(ore.kind==='poly' && ore.a!==0){
        var sPr = MF.xPair(ore);
        MF.xDiagram(host, {
          top: num(ore.a*ore.c), bottom: num(ore.b),
          left: sPr ? num(sPr.p) : null, right: null,
          topWhy: ore.a===1 ? '' : '= ' + num(ore.a) + ' × ' + num(ore.c)
        });
      } else {
        MF.splitDiagram(host, {whole:MF.oreLabel(ore), left:null, right:null,
          key:'Both sides are still yours. Name one and swing.'});
      }
      MF.methodLine(host, 'steel');
      MF.paintNameSide(host, ore, pieceId);
      return;
    }
    host.appendChild(H('div','diaglab','EVERY TERM IS CARRYING THE SAME METAL'));
    var terms = (ore.kind==='number') ? [num(ore.n)]
      : [ore.a?sqTerm(ore.a):null, ore.b?xt2(ore.b):null, ore.c?num(ore.c):null].filter(Boolean);
    MF.workLine(host, null, [terms.join('   ')], 'wbig');
    MF.workLine(host, 'each divides by', [num(g)], 'wbig');
    MF.workLine(host, 'so it comes out in front', [num(g), ' ( ', null, ' )'], 'wbig');
    var b = E('button','btn primary big','Rip out the common metal'); b.type='button';
    on(b,'click',function(){ MF.ripCommon(ore); });
    host.appendChild(b);
    MF.methodLine(host, "steel");
  },

  /* THE POWERED AUGER: the full X-box on loaded ore. */
  auger: function(host, ore, pieceId){
    if(ore.kind==='number'){
      MF.workLine(host, 'whatever comes out has to divide', [num(ore.n)], 'wbig');
      MF.methodLine(host, "auger");
      return;
    }
    if(ore.a===0){
      MF.workLine(host, 'whatever comes out has to divide both', [num(ore.b), ' and ', num(ore.c)], 'wbig');
      MF.methodLine(host, "auger");
      MF.paintNameSide(host, ore, pieceId);
      return;
    }
    var pr = MF.xPair(ore);
    host.appendChild(H('div','diaglab','1 — THE X'));
    MF.xDiagram(host, {
      top: num(ore.a*ore.c), bottom: num(ore.b),
      left: pr ? num(pr.p) : null, right: null,
      topWhy: '= ' + num(ore.a) + ' × ' + num(ore.c)
    });
    host.appendChild(H('div','diaglab','2 — SPLIT THE MIDDLE WITH THAT PAIR'));
    MF.workLine(host, null, [sqTerm(ore.a), ' + ', pr ? xt2(pr.p) : null, ' + ', null, ' + ', num(ore.c)], 'wbig');
    host.appendChild(H('div','diaglab','3 — THE FOUR TERMS GO IN THE BOX'));
    MF.xBox(host, {
      rows:[{label:'?'},{label:'?'}],
      cols:[{label:'?'},{label:'?'}],
      cells:[[{kind:'sq',text:quadText(ore.a,0,0)},{kind:'x',text: pr ? xt2(pr.p) : '?'}],
             [{kind:'x',text:'?'},{kind:'k',text:num(ore.c)}]],
      caption:'Pull the common metal off each row and each column. The sides are the factors.'
    });
    host.appendChild(H('div','diaglab','4 — READ THE FACTORS OFF THE EDGES'));
    MF.workLine(host, null, ['( ', null, ' )', ' × ', '( ', null, ' )'], 'wbig');
    host.appendChild(H('div','hint','Both sides are yours. The auger reads the rock and will not choose for you.'));
    MF.methodLine(host, 'auger');
    MF.paintNameSide(host, ore, pieceId);
  }
};

/* the one metal every term is carrying, or null. Used by the steel head and
   by nothing else that decides anything. */
MF.commonMetal = function(ore){
  if(!ore) return null;
  if(ore.kind==='number'){
    var f = primeFactors(ore.n);
    return f.length > 1 ? f[0] : null;
  }
  var g = gcdAll([ore.a, ore.b, ore.c]) || 1;
  if(ore.a < 0) g = -g;
  return Math.abs(g) > 1 ? g : null;
};

/* the steel head's swing. It goes through MF.swing so the split, the check
   that the pieces rebuild the rock, and the animation are the same ones a
   named swing gets - there is no second way to break a lump in this build. */
MF.ripCommon = function(ore){
  var B = MF.state.anvil;
  if(!B) return;
  var g = MF.commonMetal(ore);
  if(g == null) return;
  var at = -1;
  for(var i=0;i<B.floor.length;i++){ if(B.floor[i].ore === ore){ at = i; break; } }
  if(at < 0) return;
  B.at = at;
  B.raw = {m:'0', k:String(g)};
  B.rawFor = B.floor[at].id;
  MF.closeTool();
  MF.swing(B);
};

/* ---- the yard: metals in, and now metals OUT ----

   A BAR REMEMBERS WHAT IT CAME OUT OF. The rack used to be a row of labels: a
   student who had broken 2x² + 10x + 12 down to 2, (x+2) and (x+3) saw three
   bars with no sign they had ever been one lump. The whole thesis of the mine
   is that breaking is factoring, and the rack is where the evidence of that
   ends up - so it says where each bar came from.

   `from` is a LIST because the same metal comes out of different lumps: a 2 is
   a 2 whichever rock it was cut from, and `ingotKey` folds them into one
   entry. Capped at three, because this is a caption on a bar and not a ledger. */
MF.addToYard = function(ingot, from){
  var k = ingotKey(ingot);
  if(!MF.state.yard[k]) MF.state.yard[k] = {ingot:ingot, count:0, from:[]};
  var e = MF.state.yard[k];
  if(!e.from) e.from = [];               /* an entry made before origins existed */
  e.count++;
  if(from && e.from.indexOf(from) < 0 && e.from.length < 3) e.from.push(from);
};
MF.yardList = function(){                     /* one entry per metal held */
  var out = [];
  Object.keys(MF.state.yard).forEach(function(k){
    var e = MF.state.yard[k];
    for(var i=0;i<e.count;i++) out.push({key:k, ingot:e.ingot});
  });
  /* its position in this list IS its identity while it is being spent - the
     forge's slots hold yardIdx, and the rack is drawn in shelves that filter
     the list, so the index has to travel with the entry rather than being the
     loop counter of whichever subset happens to be on screen */
  out.forEach(function(e, i){ e.idx = i; });
  return out;
};
MF.spendFromYard = function(keys){
  keys.forEach(function(k){
    if(!MF.state.yard[k]) return;
    MF.state.yard[k].count--;
    if(MF.state.yard[k].count <= 0) delete MF.state.yard[k];
  });
};
/* is a metal a plain number (a prime, once smelted) or does it carry an x? */
function isPlainMetal(g){ return g.m===0 && !g.label; }
function isXMetal(g){ return g.m!==0; }

/* =========================================================================
   SCREENS
   ========================================================================= */
MF.SCREENS = {};
MF.go = function(name){
  MF.state.screen = name;
  var host = q('#screen');
  clear(host);
  try {
    MF.SCREENS[name](host);
  } catch(err){
    console.error('[mine] screen "'+name+'" failed:', err);
    host.appendChild(H('div','note bad','<b>This screen did not build.</b> That is a fault in the mine, not in you. ('+String(err.message||err)+')'));
  }
  MF.paintNav();
  host.focus();
  window.scrollTo(0,0);
  host.classList.remove('arriving');
  void host.offsetWidth;                 /* restart the wipe on every arrival */
  host.classList.add('arriving');
};
MF.paintNav = function(){
  var nav = q('#nav'); clear(nav);
  /* the same names the buildings carry on the surface - a door, its room and
     its nav entry disagreeing is how a place stops feeling like one place */
  [['home','Surface'],['workshop-ore','Stamp Mill'],['workshop-mold','Casting Shed'],['mine','The Mine'],['forge','The Forge']]
  .forEach(function(item){
    var b = E('button','navbtn', item[1]); b.type='button';
    /* A WORKSHOP KEEPS ITS BUILDING LIT. The three Casting Shed workshops are
       pages of that building, not places of their own, and a nav with nothing
       marked reads as "you are nowhere". */
    var here = MF.state.screen === item[0] ||
               (item[0]==='workshop-mold' && /^shed-/.test(MF.state.screen||''));
    if(here) b.setAttribute('aria-current','page');
    on(b,'click',function(){ MF.go(item[0]); });
    nav.appendChild(b);
  });
};

/* ---------- LOAD SCREEN ---------- */
MF.TICKER = ['opening the shaft','lighting the lamps','starting the stamps','warming the forge','stacking the cart','the rock is ready'];
MF.loadScreen = function(){
  q('#load-art').appendChild(MF.art(88));
  var fill = q('#loadbar-fill'), tick = q('#loadticker'), btn = q('#enter-btn');
  var i = 0, pct = 0;
  var t = setInterval(function(){
    pct += 8 + Math.random()*11;
    if(pct >= 100){
      pct = 100; clearInterval(t);
      tick.textContent = MF.TICKER[MF.TICKER.length-1];
      btn.style.display = '';
      btn.focus();
    } else {
      i = Math.min(MF.TICKER.length-2, Math.floor(pct/100*(MF.TICKER.length-1)));
      tick.textContent = MF.TICKER[i];
    }
    fill.style.width = pct + '%';
  }, 210);
  on(btn,'click',function(){ q('#loadscreen').classList.add('gone'); MF.go('home'); });
  return true;
};

/* =========================================================================
   THE SURFACE SCENE. The home screen is a PLACE you click into, not a menu.
   Everything that moves here is scenery: the wheel, the cart, the smoke and
   the clouds carry no information and never report a quantity.
   ========================================================================= */
/* A PROPER LANTERN, not a glowing dot: a hooped cage with a hood, a wire
   handle, glazing bars and a flame inside, sitting in its own pool of light.
   Module scope so the surface and the rooms draw the same object. */
/* A LIGHT THAT BOTH FLICKERS AND ANSWERS THE CLOCK.
   .sc-lamp animates opacity at 3.2s and the day/night level animates opacity
   over 240s; one property cannot carry both, and the later rule wins outright
   while the other silently does nothing. So the level goes on a wrapper and
   the flicker stays on the shape, and the two opacities multiply. */
function lit(node, kind){
  var g = S('g',{class:kind || 'sc-lit'});
  g.appendChild(node);
  return g;
}

function lantern(parent, cx, cy, scale, glowR){
  var g = S('g',{transform:'translate('+cx+','+cy+') scale('+(scale||1)+')'});
  /* the light it casts, behind everything */
  /* a soft halo, not a headlight. At r26/.20 in daylight it read as a large
     pale disc stuck to the scene, and the portal one covered the mine mouth. */
  /* THE HALO IS CAST LIGHT, so it rides sc-glow rather than sc-lit: all but
     invisible at noon, unmistakable at midnight. Its own opacity was pinned at
     .13 to stop it reading as a pale disc stuck to the scene in daylight - the
     day cycle does that properly now, so the shape can be a real light. */
  g.appendChild(lit(S('circle',{cx:'0',cy:'0',r:String(glowR||13),fill:'#FFD68A',opacity:'.55',class:'sc-lamp'}),'sc-glow'));
  /* hanging hook and handle */
  g.appendChild(S('path',{d:'M0 -20 q-7 -6 0 -11 q7 5 0 11 Z',fill:'none',stroke:'#4A4038','stroke-width':'2'}));
  /* hood */
  g.appendChild(S('path',{d:'M-10 -12 l20 0 l-4 -6 l-12 0 Z',fill:'#5A626A',stroke:'#39424A','stroke-width':'1.5'}));
  /* glass body */
  g.appendChild(S('path',{d:'M-8 -12 l16 0 l2 18 l-20 0 Z',fill:'#FFE9A8',stroke:'#4A4038','stroke-width':'2',class:'sc-lit'}));
  /* glazing bars */
  g.appendChild(S('line',{x1:'0',y1:'-12',x2:'0',y2:'6',stroke:'#8A6A45','stroke-width':'1.4',opacity:'.8'}));
  g.appendChild(S('line',{x1:'-9',y1:'-3',x2:'9',y2:'-3',stroke:'#8A6A45','stroke-width':'1.4',opacity:'.8'}));
  /* the flame */
  g.appendChild(lit(S('path',{d:'M0 3 q-4 -5 0 -10 q4 5 0 10 Z',fill:'#E2600F',class:'sc-lamp'})));
  /* base */
  g.appendChild(S('rect',{x:'-11',y:'5',width:'22',height:'5',rx:'2',fill:'#5A626A',stroke:'#39424A','stroke-width':'1.5'}));
  parent.appendChild(g);
  return g;
}


/* =========================================================================
   A TILED ROOF WITH A GUTTER ON IT. Module scope, and all three buildings on
   the surface call it - the Stamp Mill, the Casting Shed and the Forge.

   They had a flat coloured triangle each. The forge had seven rake lines
   standing in for pantiles, which is a hint at a roof rather than a roof, and
   the other two had nothing at all: a shed is a box with a wedge on top until
   the wedge has courses in it.

   ONE BUILDER, THREE ROOFS. Three copies of a tiling loop is three chances for
   one of them to drift, and this is the same reason `lantern`, `nameplate` and
   `lit` are up here rather than inside a scene. The caller passes the geometry
   and the palette; everything about how a tile is drawn lives once.

   THE TILES ARE CLIPPED TO THE PITCH. Courses are drawn as full-width rows
   across the roof's bounding box and cut to the triangle, so they narrow
   toward the ridge on their own - laying each course to its own width would be
   arithmetic that has to be kept in step with the roof line, and it would not
   be.

   THE GUTTER IS A REAL FIXTURE: a trough along the eaves with its inside in
   shadow, brackets under it, a downpipe running to the ground and a shoe at
   the bottom throwing the water clear of the wall. It hangs BELOW the fascia,
   which is where a gutter goes.
   ========================================================================= */
function tiledRoof(parent, o){
  var id = 'rf' + (tiledRoof._n = (tiledRoof._n || 0) + 1);
  var lx = o.lx, rx = o.rx, ey = o.ey, ax = o.ax, ay = o.ay;
  var tri = 'M' + lx + ' ' + ey + ' L' + ax + ' ' + ay + ' L' + rx + ' ' + ey + ' Z';

  /* the pitch itself */
  parent.appendChild(S('path', {d: tri, fill: o.tile}));

  /* courses of tiles, cut to the pitch */
  var defs = S('defs', {});
  var cp = S('clipPath', {id: id});
  cp.appendChild(S('path', {d: tri}));
  defs.appendChild(cp);
  parent.appendChild(defs);

  var tg = S('g', {'clip-path': 'url(#' + id + ')'});
  var step = o.course || 8, tw = o.tileW || 13;
  for (var y = ay; y < ey + step; y += step) {
    var row = Math.round((y - ay) / step);
    /* the lap: each course throws a line of shadow onto the one below it */
    tg.appendChild(S('rect', {x: String(lx - 8), y: String(y), width: String(rx - lx + 16),
      height: '2', fill: o.tileDark, opacity: '.55'}));
    /* and the tiles in that course, offset row to row so no joint runs */
    for (var x = lx - 8 + (row % 2 ? tw / 2 : 0); x < rx + 8; x += tw) {
      tg.appendChild(S('rect', {x: String(x + 1), y: String(y + 2), width: String(tw - 2),
        height: String(step - 2), rx: '2.5', fill: o.tileLit || o.tile, opacity: '.45'}));
      tg.appendChild(S('rect', {x: String(x + tw - 1), y: String(y + 2), width: '1.3',
        height: String(step - 2), fill: o.tileDark, opacity: '.42'}));
    }
  }
  parent.appendChild(tg);

  /* the ridge cap, sat over the apex where the two pitches meet */
  parent.appendChild(S('path', {d: 'M' + (ax - 11) + ' ' + (ay + 6) + ' L' + (ax + 11) + ' ' + (ay + 6) +
    ' L' + (ax + 7) + ' ' + (ay - 2) + ' L' + (ax - 7) + ' ' + (ay - 2) + ' Z', fill: o.ridge || o.tileDark}));

  /* the fascia board along the eaves */
  parent.appendChild(S('rect', {x: String(lx - 4), y: String(ey - 4), width: String(rx - lx + 8),
    height: '7', rx: '2', fill: o.fascia || o.tileDark}));

  /* ---- THE GUTTER ---- brackets first, so they sit behind the trough */
  var gx = lx - 6, gw = rx - lx + 12, gy = ey + 3;
  for (var bx = gx + 9; bx < gx + gw - 6; bx += 27)
    parent.appendChild(S('rect', {x: String(bx), y: String(gy - 2), width: '3', height: '9',
      rx: '1', fill: o.gutterDark}));
  parent.appendChild(S('rect', {x: String(gx), y: String(gy), width: String(gw), height: '6',
    rx: '3', fill: o.gutter}));
  /* the inside of the channel, in shadow - a gutter is a trough, not a pipe */
  parent.appendChild(S('rect', {x: String(gx + 2), y: String(gy + 0.6), width: String(gw - 4),
    height: '2', rx: '1', fill: o.gutterDark, opacity: '.75'}));

  /* ---- THE DOWNPIPE ---- from the gutter to the ground, with a shoe */
  if (o.downX != null) {
    var dx = o.downX, dTop = gy + 5, dBot = o.downTo;
    parent.appendChild(S('rect', {x: String(dx), y: String(dTop), width: '5',
      height: String(dBot - dTop), rx: '2', fill: o.gutter}));
    parent.appendChild(S('rect', {x: String(dx + 3.2), y: String(dTop), width: '1.4',
      height: String(dBot - dTop), fill: o.gutterDark, opacity: '.5'}));
    /* the bands that strap it to the wall */
    [0.34, 0.72].forEach(function (f) {
      parent.appendChild(S('rect', {x: String(dx - 1.6), y: String(dTop + (dBot - dTop) * f),
        width: '8.2', height: '2.6', rx: '1', fill: o.gutterDark}));
    });
    /* and the shoe at the foot, throwing the water clear of the wall */
    parent.appendChild(S('path', {d: 'M' + dx + ' ' + dBot + ' l5 0 l4 7 l-3 2.5 l-6 -6 Z',
      fill: o.gutter}));
  }
}


/* A JAGGED SKYLINE from a list of [x,y] points, closed down to a base line.
   Pure - it returns a path string and touches no DOM - so it can be used by
   any scene without the three-identical-scene-builders hazard (CLAUDE.md 1).
   Straight segments on purpose: a quadratic curve gives rolling hills, and
   this scene already has two of those. Mountains have edges. */
function ridgePath(pts, baseY){
  return 'M' + pts[0][0] + ' ' + baseY +
         ' L' + pts.map(function(p){ return p[0] + ' ' + p[1]; }).join(' L') +
         ' L' + pts[pts.length-1][0] + ' ' + baseY + ' Z';
}

/* A nameplate BOLTED TO A FACADE. Module scope, not inside a scene: it was
   first written inside roomScene by accident - both scene builders have an
   identically shaped P() helper - so surfaceScene could not see it and every
   building threw "nameplate is not defined". */
function nameplate(parent, cx, cy, label){
  var w = Math.max(74, label.length*6.9 + 16), h = 21;
  parent.appendChild(S('rect',{x:String(cx-w/2-3),y:String(cy-3),width:String(w+6),height:String(h+6),
    rx:'3',fill:'#6B4A32'}));

    fill:'#C79A66'}));
  parent.appendChild(S('rect',{x:String(cx-w/2+4),y:String(cy+4),width:String(w-8),height:'3',rx:'1',
    fill:'#DDB88A',opacity:'.7'}));
  [[cx-w/2+5, cy+h/2],[cx+w/2-5, cy+h/2]].forEach(function(bolt){
