/* ---- ONE PULL OF THE LEVER ---- */
MF.millStamp = function(M, box){
  var piece = M.floor[M.at];
  if(!piece) return;
  var d = parseInt(String(M.raw).trim(), 10);
  if(!isFinite(d) || isNaN(d)){
    M.last = {ok:false, why:'The stamp is cut to a whole number. Put one in the box and pull again.'};
    M.anim = 'miss'; MF.drawMill(box); return;
  }
  if(isPrime(piece.n)){
    M.last = {ok:false, why:num(piece.n) + ' is already an ingot. Nothing comes off it, however hard the stamp falls.'};
    M.anim = 'miss'; MF.drawMill(box); return;
  }
  if(d < 2 || d >= piece.n || piece.n % d !== 0){
    M.last = {ok:false,
      why:'<b>The stamp bounced.</b> ' + num(d) + ' does not divide ' + num(piece.n) + ' — ' +
          num(piece.n) + ' ÷ ' + num(d) + ' leaves ' +
          (d >= 2 ? 'a remainder of ' + num(((piece.n % d) + d) % d) : 'nothing to work with') +
          '. Nothing is lost; the lump is exactly as it was.'};
    M.anim = 'miss'; MF.drawMill(box); return;
  }
  /* IT SPLITS. Both halves land on the bench and either can be stamped again. */
  var a = {n:d, id:++M.seq, fresh:true}, c = {n:piece.n/d, id:++M.seq, fresh:true};
  M.floor.splice(M.at, 1, a, c);
  M.last = {ok:true, from:piece.n, why:'<b>' + num(piece.n) + ' came apart into ' + num(d) +
    ' and ' + num(piece.n/d) + '.</b>'};
  M.raw = '';
  /* the press moves itself to the next thing that is still ore */
  var nx = -1;
  for(var i=0;i<M.floor.length;i++){ if(!isPrime(M.floor[i].n)){ nx = i; break; } }
  M.at = nx >= 0 ? nx : 0;
  M.anim = 'hit';
  MF.drawMill(box);
  setTimeout(function(){ a.fresh = false; c.fresh = false; }, 1200);
};

/* ---- THE WHOLE ROOM, REDRAWN IN PLACE ----
   Never through MF.go: that rebuilds the screen, scrolls to the top and
   replays the arrival wipe, which is the fault the `inplace` group is for. */
MF.drawMill = function(box){
  var M = MF.millState();
  if(M.at >= M.floor.length) M.at = 0;
  var anim = M.anim; M.anim = null;
  var done = M.floor.every(function(p){ return isPrime(p.n); });
  var hadFocus = box.contains(document.activeElement);
  clear(box);

  /* ---- the mill, with the lump under the press ---- */
  var stage = E('div','millstage');
  if(anim) stage.setAttribute('data-stamp', anim);
  stage.appendChild(MF.millScene(M));
  box.appendChild(stage);

  var piece = M.floor[M.at];

  if(done){
    box.appendChild(H('div','note good','<b>Every piece is an ingot.</b> ' +
      'Nothing left on the bench will come apart — and that row is <b>every metal in ' +
      num(M.n) + '</b>, however you chose to cut it.'));
  } else {
    /* ---- NAME SOMETHING, AND PULL ---- */
    var ask = E('div','millask');
    ask.appendChild(H('div','mlab','UNDER THE STAMP'));
    ask.appendChild(H('div','meq', num(piece.n)));
    ask.appendChild(H('div','mhint','Name a whole number you think divides it, then pull the lever. ' +
      'Nothing here says whether it will — the stamp does.'));
    var row = E('div','row millrow');
    var inp = document.createElement('input');
    inp.type='text'; inp.inputMode='numeric'; inp.value = M.raw; inp.placeholder='2';
    inp.className = 'millin';
    inp.setAttribute('aria-label','A whole number you think divides ' + piece.n);
    on(inp,'input',function(){ M.raw = inp.value; });
    on(inp,'keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); MF.millStamp(M, box); } });
    row.appendChild(inp);
    var pull = E('button','btn primary big leverbtn','Pull the lever'); pull.type='button';
    pull.setAttribute('aria-label','Bring the stamp down on ' + piece.n);
    on(pull,'click',function(){ MF.millStamp(M, box); });
    row.appendChild(pull);
    ask.appendChild(row);
    box.appendChild(ask);
  }

  if(M.last)
    box.appendChild(H('div','note' + (M.last.ok ? ' good' : ''), M.last.why));

  /* ---- WHAT IS ON THE BENCH ---- */
  var lab = E('div','mlab'); lab.innerHTML = done ? 'EVERY METAL IN ' + num(M.n) : 'ON THE BENCH';
  box.appendChild(lab);
  var row2 = E('div','millfloor');
  M.floor.forEach(function(p, i){
    var prime = isPrime(p.n);
    var b = E('button','millpiece' + (prime?' ingot pure':' ore') +
                        (i===M.at && !done ? ' under' : '') + (p.fresh?' fresh':''));
    b.type='button';
    b.setAttribute('data-mp', p.id);
    b.textContent = num(p.n);
    b.setAttribute('aria-label', prime
      ? num(p.n) + ' — an ingot. Nothing in it comes apart.'
      : num(p.n) + ' — still ore. Click to put it under the stamp.');
    on(b,'click',function(){
      if(prime){
        M.last = {ok:false, why:'<b>' + num(p.n) + ' is an ingot.</b> It is prime — nothing divides it but 1 and itself.'};
      } else { M.at = i; M.last = null; M.raw = ''; }
      MF.drawMill(box);
    });
    row2.appendChild(b);
  });
  box.appendChild(row2);

  /* ---- A NEW LUMP ON THE BENCH ---- */
  var pick = E('div','millpick');
  pick.appendChild(H('div','mlab','PUT A NEW LUMP ON THE BENCH'));
  var prow = E('div','row');
  var sl = document.createElement('input');
  sl.type='range'; sl.min=MF.MILL_MIN; sl.max=MF.MILL_MAX; sl.step=1; sl.value=M.n;
  sl.className='millslide';
  sl.setAttribute('aria-label','Choose a number between ' + MF.MILL_MIN + ' and ' + MF.MILL_MAX);
  var shows = H('div','meq sm', num(M.n));
  on(sl,'input',function(){ shows.textContent = num(parseInt(sl.value,10)); });
  on(sl,'change',function(){
    MF.state.mill = MF.millInit(parseInt(sl.value,10));
    MF.drawMill(box);
  });
  prow.appendChild(shows);
  prow.appendChild(sl);
  pick.appendChild(prow);
  pick.appendChild(H('div','mhint','Anything from ' + MF.MILL_MIN + ' to ' + MF.MILL_MAX +
    '. Some of them come apart four times over and some will not move at all.'));
  box.appendChild(pick);

  box.appendChild(MF.says(done
    ? '<b>Mr Factor:</b> That row is the whole of it. Two miners who cut in a different order still end up with those same ingots — which is why a number has one set of metals in it.'
    : '<b>Mr Factor:</b> Keep stamping until every piece is an ingot. That is all this is, and it is exactly what you will do to a trinomial down the mine.'));

  if(hadFocus){
    var back = box.querySelector('.millin') || box.querySelector('.leverbtn');
    if(back && back.focus) back.focus({preventScroll:true});
  }
};

/* =========================================================================
   THE FORGE.
   Where the yard finally has a SINK. Metals are spent here, and the only way
   to fill an order is to pour metals you actually own - so needing a factor
   you have not got is what sends a student back down the shaft.

   Forging IS distributing. The pour is the judge here exactly as it is at the
   bench; there is no second mechanism anywhere in this build.

   NOTE ON REQUIREMENTS: they are drawn as SLOTS, filled or empty. Never as
   "2 of 3 metals" - that is an X-out-of-Y, which philosophy 2.5a forbids and
   MF.validate's no-grades check would (correctly) fail the build over.
   ========================================================================= */
/* CAN THE RACK ACTUALLY CAST THE THING? Not "does it hold two x-ingots" - does
   it hold a set of exactly `slots` metals whose product IS the target. The old
   version answered a question about shapes, so it said yes to a yard that
   could not make the object and the student found out at the pour.

   An irreducible polynomial in the yard is stored with m:0,k:0 and a label -
   it multiplies to nothing - so it is not a candidate for any mold. */
MF.castableFrom = function(target, slots, have){
  var pool = have.filter(function(e){ return !(e.ingot.m===0 && e.ingot.k===0); });
  var found = null;
  (function walk(start, chosen){
    if(found) return;
    if(chosen.length === slots){
      var p = ingotProduct(chosen.map(function(e){ return e.ingot; }));
      if(!p.overflow && p.a===target.a && p.b===target.b && p.c===target.c) found = chosen.slice();
      return;
    }
    /* prune: more metals still needed than the pool has left */
    if(pool.length - start < slots - chosen.length) return;
    for(var i=start; i<pool.length && !found; i++){
      chosen.push(pool[i]);
      walk(i+1, chosen);
      chosen.pop();
    }
  })(0, []);
  return found;
};
MF.toolReady = function(key){
  var t = MF.TOOLS[key];
  return !!MF.castableFrom(t.cast, t.slots, MF.yardList());
};

/* =========================================================================
   THE FORGE, IN TWO COLUMNS.

   ORDERS ON THE LEFT, THE YARD AND THE MOLD ON THE RIGHT - and the yard is
   there from the moment you walk in. It used to appear only INSIDE the mold,
   after an order had already been chosen, so a student picked a tool with no
   idea what metal they were holding and found out afterwards. What you own is
   the whole reason one order is possible and another is not; it has to be on
   screen while you choose.

   The heap is drawn here too, and it is deliberately not spendable. The forge
   takes native metal - rock still carrying a seam is no use until it has been
   broken, and seeing it sitting there unusable is what sends a student back
   down the shaft. That is the sink working.
   ========================================================================= */
MF.SCREENS.forge = function(host){
  var st = MF.state.forge;
  host.appendChild(MF.roomScene('forge'));
  host.appendChild(H('h2',null,'The Forge'));
  host.appendChild(H('p','lede','<b>This is where you make things.</b> The mine breaks rock apart; here the furnace runs the other way — ' +
    'native metal goes into a mold and one formed tool comes out. That is <b>distributing</b>, it happens nowhere else in the operation, ' +
    'and the mold forms around what you pour rather than being chosen. The part is sound, or it is scrap.'));

  var grid = E('div','forgegrid');
  var colL = E('div'), colR = E('div');
  grid.appendChild(colL); grid.appendChild(colR);
  host.appendChild(grid);
  MF._forge = {left:colL, right:colR};
  MF.paintForge();

  /* NO MINE DOOR HERE EITHER (user, 2026-09-05). It read "Back to the mine"
     rather than "Into the mine", which is the same route under another name.
     The masthead carries it on every page. */
  var back = E('div','row'); back.style.marginTop='14px';
  back.appendChild(MF.jump('Out to the surface &rarr;','home'));
  host.appendChild(back);
};

/* THE FORGE REPAINTS IN PLACE. Every click in here used to call MF.go('forge')
   - which rebuilds the whole screen, moves focus, RESTARTS THE ARRIVAL WIPE and
   scrolls to the top. Dropping one metal in a slot threw the page back to the
   masthead and played the arriving animation again, so choosing three metals
   meant three jumps and the pour meant a fourth. Same shape as paintMine, and
   the same isConnected guard: MF._forge outlives a navigation away from the
   forge, and painting into a detached column is the silent-failure class that
   already cost a review cycle (VERIFICATION s35). */
MF.paintForge = function(){
  if(!MF._forge || !MF._forge.right || !MF._forge.right.isConnected) return;
  var st = MF.state.forge;
  MF.paintOrders(clear(MF._forge.left), st);
  var r = clear(MF._forge.right);
  /* THE WORK FIRST, THE SINK UNDER IT. The rack used to be a panel of its own
     above this, with the heap between it and the mold; the rack now lives
     inside the craft floor and only the unspendable rock is left below. */
  MF.paintCraft(r, st);
  MF.paintHeap(r, st);
};

/* ---------- the left column: what can be made ---------- */
MF.paintOrders = function(host, st){
  var box = E('div','orderboard');
  box.appendChild(H('h3',null,'The Order Board'));
  box.appendChild(H('div','hint','Each order is cut for <b>one exact object</b>. Find the metals that multiply to it and the part comes out sound. They get harder down the board, and so do the tools.'));

  MF.toolOrder().forEach(function(key){
    var t = MF.TOOLS[key], made = MF.hasTool(key), ready = MF.toolReady(key);
    var b = E('button','order' + (made?' made':(ready?' ready':' short')));
    b.type = 'button';
    b.setAttribute('data-order', key);
    if(st.picked===key && !made) b.setAttribute('aria-current','true');
    b.appendChild(H('span','oic', t.ic));
    var txt = E('span','otx');
    txt.appendChild(H('span','onm', t.nm));
    /* THE TARGET IS ON THE CARD. An order that only names a tool tells a
       student nothing about what they are being asked to make. */
    txt.appendChild(H('span','ocast', 'cast <b>' + MF.castText(t) + '</b>'));
    txt.appendChild(H('span','ost', made ? 'in your hands' : (ready ? 'you have the metal' : 'not on the rack yet')));
    b.appendChild(txt);
    b.setAttribute('aria-label', t.nm + ', cast from ' + quadText(t.cast.a,t.cast.b,t.cast.c) + ' — ' + (made ? 'already made and on your belt' :
      (ready ? 'you have the metal for this. Open the mold.' : 'you do not have the metal for this yet. Open the mold to see what it wants.')));
    /* EVERY ORDER OPENS. A disabled button is a dead control that explains
       nothing; an open mold can say what it is waiting for, which is the
       thing that sends you back down the shaft knowing what to look for. */
    on(b,'click',function(){
      if(made){ MF.explainTool(key, b); return; }
      st.picked = key; st.slots = []; st.result = null; st.justFilled = false;
      MF.paintForge();
    });
    box.appendChild(b);
  });
  host.appendChild(box);
};

/* ---------- THE RACK, and it is drawn INSIDE the craft floor ----------

   It used to be a yard panel of its own, above the craft floor and below the
   room banner, with the heap between it and the mold. So filling a mold meant
   reading the target, scrolling up to the rack, clicking a metal, scrolling
   back down to see the slot, and repeating - and the pour button was below all
   of it again. Five moves for a three-metal order, none of which is the
   mathematics.

   It sits under the slots now, and the pour button sits under it, so target,
   mold, slots, metals and pour are one cluster with nothing in between. The
   behaviour is unchanged: click a metal to drop it in, spent metals grey out,
   and clicking one with no order open SAYS SO rather than doing nothing. */
MF.paintRack = function(host, st){
  var open = !!st.picked && !st.result;
  var want = open ? MF.slotsWanted(MF.TOOLS[st.picked]) : 0;

  var rk = E('div','shelfrow');
  rk.appendChild(H('div','ylab','THE RACK &mdash; native metal, and the forge spends this'));
  var have = MF.yardList();
  if(!have.length){
    rk.appendChild(H('div','yempty','Bare. Break a lump all the way down in the mine and the metal is racked here.'));
    host.appendChild(rk);
    return rk;
  }
  var rack = E('div','rack');
  [['plain metal', function(g){ return g.m===0; }],
   ['metal with an x in it', function(g){ return g.m!==0; }]].forEach(function(grp){
    var these = have.filter(function(e){ return grp[1](e.ingot); });
    if(!these.length) return;
    var shelf = E('div','shelf');
    shelf.appendChild(H('div','sh', grp[0]));
    var row = E('div','metalrow');
    these.forEach(function(e){
      var used = st.slots.some(function(s){ return s.yardIdx===e.idx; });
      var b = E('button','metalbtn' + (isPlainMetal(e.ingot)?' pure':'') + (used?' spent':''));
      b.type='button';
      b.setAttribute('data-metal', e.idx);
      b.appendChild(H('span','ml', e.ingot.label || ingotText(e.ingot)));
      b.setAttribute('aria-label', (e.ingot.label || ingotText(e.ingot)) +
        (used ? ' — already in the mold' : (open ? ' — drop it in the mold' : ' — pick an order first')));
      b.title = used ? 'Already in the mold' : (open ? 'Drop it in the mold' : 'Pick an order first');
      on(b,'click',function(){
        /* NOT A DEAD CONTROL WHEN NOTHING IS OPEN. It says what is missing
           instead of doing nothing, which is how the old chips behaved. */
        if(used){ st.note = 'That one is already in the mold. Click it in the slot to take it back out.'; MF.paintForge(); return; }
        if(!open){ st.note = 'Pick an order from the board on the left first, and the mold will open.'; MF.paintForge(); return; }
        if(st.slots.length >= want){ st.note = 'The mold is full. Take something out of a slot if you want to change it.'; MF.paintForge(); return; }
        st.slots.push({yardIdx:e.idx, key:e.key, ingot:e.ingot});
        st.note = null;
        /* THE LAST METAL ARMS THE POUR. Only the drop that FILLS the mold sets
           this, and paintCraft consumes it - otherwise every repaint would
           snatch focus back off whatever the student was doing. */
        if(st.slots.length === want) st.justFilled = true;
        MF.paintForge();
      });
      row.appendChild(b);
    });
    shelf.appendChild(row);
    rack.appendChild(shelf);
  });
  rk.appendChild(rack);
  host.appendChild(rk);
  return rk;
};

/* ---------- THE HEAP, and the yard drawn as a place ----------

   Below the work now rather than between the student and it. The forge takes
   native metal; rock still carrying a seam is no use until it has been broken,
   and it is deliberately NOT a button - a control that looks live and refuses
   is worse than a thing that plainly is not one. Seeing it sitting there
   unusable is what sends a student back down the shaft. That is the sink
   working, and it works just as well underneath the mold as above it. */
MF.paintHeap = function(host, st){
  var box = E('div','panel'); box.style.marginTop='16px';
  box.appendChild(H('div','panel-tag','THE YARD &mdash; WHAT IS STILL ROCK'));

  var place = E('div','yardplace');
  place.appendChild(MF.yardScene());
  var inner = E('div','yardin');

  var hp = E('div','heaprow');
  hp.appendChild(H('div','ylab','THE HEAP &mdash; still carrying a seam'));
  if(!MF.state.rockpile.length){
    hp.appendChild(H('div','yempty','Nothing tipped here. Anything you leave half-broken in the mine lands on the heap.'));
  } else {
    var heap = E('div','heap');
    MF.state.rockpile.forEach(function(o){
      var r = E('div','heaprock cold');
      r.appendChild(H('span','hv', MF.oreLabel(o)));
      r.setAttribute('aria-label', MF.oreText(o) + ' — still rock. The forge cannot spend it until it is broken down.');
      heap.appendChild(r);
    });
    hp.appendChild(heap);
    hp.appendChild(H('div','yhint','<b>The furnace will not take rock.</b> Anything on the heap still has a seam in it — break it down in the mine and the metal comes back here.'));
  }
  inner.appendChild(hp);

  place.appendChild(inner);
  box.appendChild(place);
  host.appendChild(box);
};

/* how many slots an order's mold has. This used to special-case matchedPair to
   2 - which its own `count` already says, and every other order's does too. */
MF.slotsWanted = function(t){ return t.slots; };

/* ---------- the right column, below: the mold ---------- */
MF.paintCraft = function(host, st){
  var box = E('div','panel craft');
  box.appendChild(H('div','panel-tag','THE CRAFT FLOOR'));

  if(st.note){
    box.appendChild(H('div','note', st.note));
    st.note = null;
  }

  if(!st.picked){
    box.appendChild(H('div','coldmold','The mold is cold.'));
    box.appendChild(MF.says('<b>Mr Factor:</b> Pick an order off the board and I will open the mold. ' +
      'Whatever you drop in gets used up — so if you spend your only (x + 3), you will be going back down for another.'));
    host.appendChild(box);
    return;
  }

  var t = MF.TOOLS[st.picked];
  box.appendChild(H('div','crafthead','<span class="ci">' + t.ic + '</span><b>' + t.nm + '</b>'));

  /* once poured, the casting IS the panel - the slots are gone and what the
     student is looking at is the thing they made */
  if(st.result){
    box.appendChild(st.result);
    host.appendChild(box);
    return;
  }

  /* THE TARGET, LARGE AND ON SCREEN THE WHOLE TIME. It is the question being
     asked, and asking it in a hint under the heading made it scenery. */
  var tgt = E('div','castfor');
  tgt.appendChild(H('div','cflab','THIS MOLD IS CUT FOR'));
  tgt.appendChild(H('div','cfeq', MF.castText(t)));
  tgt.appendChild(H('div','cfwhy', t.forge));
  box.appendChild(tgt);

  /* THE SHAPE IS CUT THE MOMENT THE ORDER IS TAKEN. You can see what you are
     making, and where the metal has to go, before you have any of it. */
  box.appendChild(MF.moldScene(st.picked, null));

  var want = MF.slotsWanted(t);
  var cru = E('div','crucible');
  cru.appendChild(H('h4',null,'What is going in'));
  var slotRow = E('div','ingotrow');
  for(var i=0;i<want;i++){
    (function(idx){
      var got = st.slots[idx];
      if(got){
        var chip = E('button','ingot' + (isPlainMetal(got.ingot)?' pure':''));
        chip.type='button';
        chip.appendChild(document.createTextNode(ingotText(got.ingot)));
        chip.title='Take it back out';
        chip.setAttribute('aria-label', ingotText(got.ingot) + ' is in the mold. Take it back out.');
        on(chip,'click',function(){ st.slots.splice(idx,1); st.note=null; MF.paintForge(); });
        slotRow.appendChild(chip);
      } else {
        var empty = H('div','slot moldslot','<span style="opacity:.6">empty</span>');
        slotRow.appendChild(empty);
      }
    })(i);
  }
  cru.appendChild(slotRow);
  cru.appendChild(H('div','hint', st.slots.length
    ? 'Click one to take it back out.'
    : 'Click a metal on the rack below to drop it in.'));
  box.appendChild(cru);

  /* THE METAL IS RIGHT HERE. Target, mold, slots, rack and pour, in that
     order, with nothing between any two of them. */
  MF.paintRack(box, st);

  /* WHAT IT IS WAITING FOR, when you cannot fill it. The old board disabled
     the button and said "not enough metal yet", which named nothing you could
     go and look for. */
  if(!MF.toolReady(st.picked) && st.slots.length < want){
    box.appendChild(H('div','note warn','<b>The rack cannot make ' + MF.castText(t) + ' yet.</b> ' +
      'No ' + want + ' metals on it multiply to that. Nothing is locked — break more ore and what comes out is racked here.'));
  }

  /* THE POUR ARMS WHEN THE MOLD IS FULL, AND SAYS NOTHING ABOUT WHETHER THE
     METALS ARE RIGHT. Lighting it only for a correct set would hand over the
     answer before the pour and make the casting ceremonial - which is exactly
     what MINE-SPEC §10a removed the free casting preview over. A wrong set and
     a right set look identical here; the casting is still the only judge. */
  var full = st.slots.length === want;
  var pourRow = E('div','row pourrow');
  var pour = E('button','btn primary big pourbtn','Pour the mold'); pour.type='button';
  pour.disabled = !full;
  if(full) pour.setAttribute('data-armed','yes');
  on(pour,'click',function(){ MF.forgePour(st); });
  pourRow.appendChild(pour);
  if(!full) pourRow.appendChild(H('div','hint','The mold is not full yet.'));
  box.appendChild(pourRow);
  /* FOCUS ONLY ON THE DROP THAT FILLED IT, and without scrolling: the button
     is already beside the rack, so moving the page would be the hurdle rather
     than the fix. The flag is consumed here, or every later repaint would
     snatch focus back off whatever the student had moved on to. */
  host.appendChild(box);
  /* AND THE FOCUS GOES LAST, because focus() on a node that is not in the
     document yet does nothing at all and says nothing about it. The panel is
     built detached and mounted on the line above; called before that, this was
     a control that looked wired and silently was not - the same class of
     silent failure as painting into a detached column (§35). */
  if(full && st.justFilled){
    st.justFilled = false;
    try { pour.focus({preventScroll:true}); } catch(e){ pour.focus(); }
  }
};

/* =========================================================================
   THE MOLD, SEEN FROM ABOVE.

   THE CAVITY IS THE TOOL'S OWN ICON, blacked out. Not a silhouette drawn to
   look like it - the same glyph the order board, the belt and every panel
   use, rendered large and knocked down to black, which is exactly what a
   shape cut into sand looks like from directly overhead. Nothing can drift out
   of step with the tool it makes, because it IS the tool.

   The metal runs down a trough, off the lip, into the basin, along the runner
   and into the shape - and as the pour front crosses the cavity it REVEALS the
   icon: colour and edges coming up out of the black, left to right, at the
   speed of the metal.

   And the liquid is the background for the maths. Over it, in transparent
   numerals with the operations written out, the factors resolve into one
   structure. Almost no words.
   ========================================================================= */

/* WHAT THE POUR SHOWS: what went in, where each product comes FROM, which two
   run together, and the one thing left. `from` is the pair that made the term
   - it is the difference between watching four numbers appear and seeing why
   they are those four numbers. */
MF.moldMaths = function(ingots, prod){
  var wrap = function(g){ return (g.m===0) ? num(g.k) : '(' + ingotText(g) + ')'; };
  var out = {
    into: ingots.map(wrap),
    terms: [], merge: null, mergeFrom: null, single: null
  };
  if(prod.overflow){ out.single = 'over'; return out; }
  out.single = quadText(prod.a, prod.b, prod.c);

  /* all plain metal: the numbers themselves are the products */
  if(ingots.every(function(g){ return g.m===0; })){
    out.terms = ingots.map(function(g){ return {t:num(g.k), from:'', mid:false}; });
    return out;
  }
  /* two brackets: the four corners, each with the pair that made it */
  if(ingots.length===2){
    var g1=ingots[0], g2=ingots[1];
    var p1 = g1.m===0 ? num(g1.k) : xt2(g1.m), p2 = g2.m===0 ? num(g2.k) : xt2(g2.m);
    var q1 = num(g1.k), q2 = num(g2.k);
    var sq=g1.m*g2.m, mA=g1.m*g2.k, mB=g1.k*g2.m, kk=g1.k*g2.k;
    if(sq) out.terms.push({t:(sq===1?'x²':num(sq)+'x²'), from:p1+' × '+p2, mid:false});
    var mids = [];
    if(mA) mids.push({t:xt2(mA), from:p1+' × '+q2});
    if(mB) mids.push({t:xt2(mB), from:q1+' × '+p2});
    if(mids.length === 2){
      mids.forEach(function(md){ out.terms.push({t:md.t, from:md.from, mid:true}); });
      out.merge = (mA + mB) === 0 ? '0' : xt2(mA + mB);
      out.mergeFrom = xt2(mA) + ' + ' + xt2(mB);
    } else if(mids.length === 1){
      out.terms.push({t:mids[0].t, from:mids[0].from, mid:false});
    }
    if(kk) out.terms.push({t:num(kk), from:q1+' × '+q2, mid:false});
    return out;
  }
  out.terms = [{t:out.single, from:'', mid:false}];
  return out;
};

/* =========================================================================
   THE POUR, WRITTEN OUT: EVERY PART OF ONE METAL MEETS EVERY PART OF THE OTHER.

   USER, 2026-09-05: "The Molds need to show multiplication in the pour to
   illustrate multiplying terms."

   The mold room drew an area model and one line of algebra, and the area model
   only ever held ONE ROW - a depth over two parts, a·(b + c). That is a number
   distributed over a sum, and it is not the move the mine runs backwards all
   day: the mine's job is two brackets, four products, and two middle terms
   that turn out to be the same kind of thing and collapse.

   So the pour is written out as a chain, a line at a time:

       ( x + 2 )( x + 3 )        what went in
       x·x  +  x·3  +  2·x  +  2·3    every part meets every part
        x²  +   3x  +   2x  +   6     each one multiplied out
        x²  +      5x       +   6     the two middles are the same kind
       = x² + 5x + 6                  one object

   IT DOES NOT DO ITS OWN ARITHMETIC. Every number and every pairing comes from
   MF.moldMaths, which the `mold` group already checks against ingotProduct -
   so this is a rendering of a computation that is already verified, and a
   second copy of the multiplication could not drift from the first because
   there is no second copy. */
MF.pourChain = function(host, ingots){
  var prod = ingotProduct(ingots);
  var m = MF.moldMaths(ingots, prod);
  var box = E('div','pourchain');
  box.appendChild(H('div','pclab','THE POUR, WRITTEN OUT'));

  var row = function(cls, cells, note){
    var r = E('div','pcrow ' + cls);
    var line = E('div','pcline');
    cells.forEach(function(c, i){
      if(i) line.appendChild(H('span','pcop', c.op || '+'));
      line.appendChild(H('span','pcterm' + (c.mid ? ' mid' : ''), c.t));
    });
    r.appendChild(line);
    if(note) r.appendChild(H('div','pcnote', note));
    box.appendChild(r);
    return r;
  };

  row('in', [{t: m.into.join(' '), op:''}], 'what went into the mold');
  if(m.single === 'over'){
    box.appendChild(H('div','pcnote','That is more metal than the mold holds.'));
    host.appendChild(box);
    return box;
  }

  /* every part meets every part - the pairings, before they are multiplied */
  var pairs = m.terms.filter(function(t){ return t.from; });
  if(pairs.length > 1)
    row('pairs', pairs.map(function(t){ return {t:t.from, mid:t.mid}; }),
      'every part of one metal meets every part of the other');

  /* each pairing multiplied out */
  if(m.terms.length > 1)
    row('terms', m.terms.map(function(t){ return {t:t.t, mid:t.mid}; }),
      pairs.length > 1 ? 'each pair multiplied out' : 'the depth reaches every part');

  /* the two middles are the same kind of thing, so they collapse */
  if(m.merge){
    var collapsed = [];
    var midSeen = false;
    m.terms.forEach(function(t){
      if(t.mid){ if(!midSeen){ collapsed.push({t:m.merge, mid:true}); midSeen = true; } }
      else collapsed.push({t:t.t});
    });
    row('merged', collapsed,
      m.mergeFrom + ' are the same kind of thing, so they are one term');
  }
  row('out', [{t:m.single, op:''}], 'one object comes out');
  host.appendChild(box);
  return box;
};

MF.moldScene = function(key, pour){
  var t = MF.TOOLS[key];
  var wrap = E('div','moldwrap');

  grad(uid+'iron', [['0%','#7E8A96'],['100%','#39424B']]);

  /* the bench you are leaning over */
  svg.appendChild(S('rect',{x:0,y:0,width:W,height:VH,fill:'url(#'+uid+'bench)'}));

    svg.appendChild(S('path',{d:'M0 '+(16+gn*30)+' q130 '+((gn%2)?5:-5)+' 400 '+((gn%3)?3:-3),

     IT STARTS AT 96, NOT 74. The ladle above it is a vessel seen in three
     quarters rather than a flat channel, and it needs the height. The cavity

  svg.appendChild(S('rect',{x:26,y:96,width:348,height:186,rx:11,fill:'url(#'+uid+'sand)',

      r:String(0.7+((sp*7)%3)*0.5), fill:'#6E6053', opacity:'.26'}));

  /* ======================================================================
     THE LADLE, TIPPED, WITH THE METAL COMING OFF THE LIP.

     USER, 2026-09-05, with a reference image: "The illustration around the
     pouring molds needs to look more realistic, 3D... and inside the stream
     there should be visible text of terms being multiplied."

     What was here was a flat iron channel: two quadrilaterals and three rivets,
     seen from the same overhead angle as the sand. It read as a gutter.

     This is the vessel from the reference - a bucket seen in three quarters and
     tipped over, so the mouth is an ELLIPSE rather than an edge, the far wall
     shows behind the near one, and the metal inside it is a pool you can see
     the surface of. The depth comes from the shading: a body gradient across
     the barrel, a lighter band on the rim, a dark inner wall, and a hot glow

     THE ART-STYLE RULE IS RELAXED HERE ON PURPOSE. `MF.anvilScene` is flat

     to that because it was the only rendered object on the site. The user has
     now asked for this one to be rendered, with a picture. It is one object,
     in one room, and the anvil is not it.

     THE TIP IS ONE TRANSFORM ON A STATIC GROUP. Nothing in here animates, so
     the attribute is safe (s5g is about ANIMATED elements, where a CSS
     transform would replace it). The pool and the stream inside animate their
     OPACITY only, and neither carries a transform of its own. */
  grad(uid+'body', [['0%','#8E9AA6'],['26%','#5E6A76'],['62%','#39424B'],['100%','#20262C']], true);
  grad(uid+'rim',  [['0%','#B6C2CE'],['48%','#7E8A96'],['100%','#39424B']], true);

  glow.appendChild(S('stop',{offset:'100%','stop-color':'#E2600F','stop-opacity':'0'}));
  defs.appendChild(glow);

  /* the heat it throws, behind everything */
  svg.appendChild(S('ellipse',{cx:112,cy:96,rx:132,ry:96,fill:'url(#'+uid+'glow)'}));

  var lad = S('g',{class:'mdladle', transform:'rotate(38 70 56)'});
  /* the barrel: tapered, with the near wall lit and the base in shadow */
  lad.appendChild(S('path',{d:'M28 18 L38 94 Q70 106 102 94 L112 18 Z',
    fill:'url(#'+uid+'body)', stroke:'#161B20','stroke-width':'3.5','stroke-linejoin':'round'}));
  /* two bands round the barrel, which is what makes it read as a vessel rather
     than a cup - and the pair of them is what gives it a curved surface */
  [46, 72].forEach(function(by){
    lad.appendChild(S('path',{d:'M32 '+by+' Q70 '+(by+12)+' 108 '+by,
      fill:'none',stroke:'#20262C','stroke-width':'6',opacity:'.7'}));
    lad.appendChild(S('path',{d:'M32 '+(by-3)+' Q70 '+(by+9)+' 108 '+(by-3),
      fill:'none',stroke:'#A2AEBA','stroke-width':'2.2',opacity:'.4'}));
  });
  /* the light down the near edge, and the shadow down the far one */
  lad.appendChild(S('path',{d:'M40 24 L48 90',fill:'none',stroke:'#D4DEE8','stroke-width':'5',
    opacity:'.32','stroke-linecap':'round'}));
  lad.appendChild(S('path',{d:'M104 24 L96 90',fill:'none',stroke:'#0E1216','stroke-width':'7',
    opacity:'.34','stroke-linecap':'round'}));
  /* THE MOUTH IS AN ELLIPSE, which is the whole of why this reads as a vessel:
     a rim with a lit top edge, the dark inner wall behind it, and a pool of
     metal standing in the bottom that you are looking down into. */
  lad.appendChild(S('ellipse',{cx:70,cy:18,rx:42,ry:15,fill:'url(#'+uid+'rim)',
    stroke:'#161B20','stroke-width':'3.5'}));
  lad.appendChild(S('path',{d:'M31 13 A42 15 0 0 1 109 13',fill:'none',
    stroke:'#D4DEE8','stroke-width':'2.5',opacity:'.5'}));
  lad.appendChild(S('ellipse',{cx:70,cy:19,rx:34,ry:11,fill:'#161B20'}));
  /* the metal standing in it - the first thing that arrives in the pour */
  lad.appendChild(S('ellipse',{class:'mdtrough', cx:70,cy:21,rx:30,ry:9,fill:'url(#'+uid+'pool)'}));
  /* the bail: a bracket each side and a pin through it */
  lad.appendChild(S('path',{d:'M27 34 L13 39 L18 54',fill:'none',stroke:'#39424B','stroke-width':'6',
    'stroke-linecap':'round','stroke-linejoin':'round'}));
  lad.appendChild(S('path',{d:'M113 34 L127 39 L122 54',fill:'none',stroke:'#39424B','stroke-width':'6',
    'stroke-linecap':'round','stroke-linejoin':'round'}));
  lad.appendChild(S('circle',{cx:13,cy:39,r:5,fill:'#7E8A96',stroke:'#161B20','stroke-width':'2'}));
  lad.appendChild(S('circle',{cx:127,cy:39,r:5,fill:'#7E8A96',stroke:'#161B20','stroke-width':'2'}));
  svg.appendChild(lad);

  /* ---- THE STREAM, AND THE TERMS RIDING DOWN IT ----
     The lip lands at about (116,46) once the group is tipped; the basin is
     directly under it, so the metal falls the way metal falls. */
  svg.appendChild(S('path',{class:'mdstream',
    d:'M105 48 C100 76, 100 102, 102 128 L136 128 C138 102, 138 74, 139 50 Z',
    fill:'url(#'+uid+'pool)'}));
  /* the bright core of it */
  svg.appendChild(S('path',{class:'mdstream mdcore',
    d:'M114 50 C111 76, 111 104, 113 128 L127 128 C129 104, 128 74, 128 50 Z',
    fill:'#FFF6D8'}));

  /* the pouring basin and the runner that feeds the shape, under the lip */
  svg.appendChild(S('circle',{cx:116,cy:150,r:27,fill:'#5A4B3C'}));
  svg.appendChild(S('circle',{cx:116,cy:150,r:20,fill:'#3A3129'}));
  svg.appendChild(S('path',{d:'M130 132 L206 172 L206 196 L130 168 Z',fill:'#3A3129'}));
  svg.appendChild(S('path',{d:'M130 132 L206 172',fill:'none',stroke:'#D6C6A8','stroke-width':'2',opacity:'.4'}));
  var clip = S('clipPath',{id:uid+'run'});
  clip.appendChild(S('circle',{cx:116,cy:150,r:20}));
  clip.appendChild(S('path',{d:'M130 132 L206 172 L206 196 L130 168 Z'}));
  defs.appendChild(clip);
  var runMetal = S('g',{'clip-path':'url(#'+uid+'run)'});
  runMetal.appendChild(S('rect',{class:'mdrun', x:88,y:120,width:130,height:100,fill:'url(#'+uid+'hot)'}));
  svg.appendChild(runMetal);

  /* ---- THE CAVITY: the tool's own icon, blacked out ----
     Rendered from MF.TOOLS[key].ic, so the hole in the sand and the thing on
     your belt can never be two different shapes. */
  var glyph = function(cls, size){
    var n = S('text',{x:'256',y:'186','text-anchor':'middle','dominant-baseline':'central',
      'font-size':String(size||150), class:cls});
    n.textContent = MF.iconChar(t.ic);
    return n;
  };
  svg.appendChild(glyph('mdcutshadow'));      /* the depth, offset down and right */
  svg.appendChild(glyph('mdcut'));            /* the cut itself, black */

  /* ---- THE CAVITY FILLS FROM THE BOTTOM ----
     It used to be a rect growing LEFT TO RIGHT over two things: the coloured
     glyph and a translucent orange panel 212x172 laid across the whole cavity
     area. That panel was the visible result - a transparent sheet dropped over
     the sand - and it is gone. Nothing tints the sand around the shape now.

     What is left rises: the clip rect is anchored at the FLOOR of the glyph and
     grows upward, so the tool's own colour comes up out of the black from the
     bottom, which is what a mold filling from underneath actually looks like.
     The black cut stays underneath the whole time, so what a student watches is
     an outline turning into metal rather than a picture being wiped on.

     THE NUMBERS: the glyph is centred at y=186 at 150px, so it runs from 111
     down to 261. The rect rests EMPTY on the floor of it (y=261, height=0) and
     the animation walks y up to 111 while height grows to 150. Both are CSS
     geometry properties on an SVG rect, which is the same mechanism the wipe
     already used - only the axis has changed. */
  var rc = S('clipPath',{id:uid+'rev'});
  rc.appendChild(S('rect',{class:'mdrevrect', x:120, y:261, width:270, height:0}));
  defs.appendChild(rc);

  /* ---- WHAT FILLS IT IS MOLTEN METAL, NOT THE GLYPH'S OWN COLOURS ----

     The reveal used to show the same glyph again unfiltered, on the assumption
     that a tool icon is a colour emoji. FOUR OF THE SEVEN ARE NOT: the pick,
     the lantern, the shifter and the drill are monochrome text glyphs, so the
     "coloured" copy rendered BLACK - the pour painted black over black and
     nothing on screen changed at all. The three that are colour emoji are pale
     grey-lilac, which is barely a change either. Measured, on a canvas: mean
     chroma 0.0 for four of them.

     So the colour cannot come from the glyph. The glyph becomes an ALPHA MASK
     and the metal is painted through it - the silhouette is the tool's own
     shape, and what fills it is a molten gradient that owes the emoji nothing.
     Sampled: rgb(230,178,97) against a cut at rgb(39,37,32).

     AND THEN IT COOLS. Three layers through the one mask - molten, then a deep
     red fading in, then steel - so the casting goes hot, dull red, and finally
     cold grey while the maths is still being read over it. That is the order a
     real casting goes through, and it is the difference between a picture that
     arrives and one that is alive for a moment. */
  var toolMask = S('mask',{id:uid+'tool', maskUnits:'userSpaceOnUse', x:'0', y:'0', width:String(W), height:String(VH)});
  toolMask.setAttribute('style','mask-type:alpha');
  toolMask.appendChild(glyph('mdmaskglyph'));
  defs.appendChild(toolMask);
  grad(uid+'cool', [['0%','#E8563C'],['48%','#B8321A'],['100%','#7A2410']]);
  grad(uid+'steel',[['0%','#C4CED8'],['52%','#8A96A2'],['100%','#5A6570']]);

  var rev = S('g',{class:'mdreveal','clip-path':'url(#'+uid+'rev)'});
  var melt = S('g',{class:'mdlive', mask:'url(#'+uid+'tool)'});
  /* one box each, all clipped to the tool by the mask above */
  melt.appendChild(S('rect',{class:'mdhot',   x:150,y:96,width:212,height:180,fill:'url(#'+uid+'hot)'}));
  melt.appendChild(S('rect',{class:'mdred',   x:150,y:96,width:212,height:180,fill:'url(#'+uid+'cool)'}));
  melt.appendChild(S('rect',{class:'mdsteel', x:150,y:96,width:212,height:180,fill:'url(#'+uid+'steel)'}));
  rev.appendChild(melt);
  svg.appendChild(rev);

  /* ---- THE MATHS, over the metal, with the operations written out ---- */
  if(pour && pour.maths){
    var m = pour.maths;
    /* THE HALO THAT MAKES THIS READABLE IS IN THE STYLESHEET, on `.mdnum`:
       a 4px #FFE9A8 stroke with paint-order:stroke. It has to be, because the
       thing under these numbers is not one colour and never will be — the
       casting is deliberately alive, molten to dull red to steel — and no flat
       ink clears both ends of that range. #3A1B06 on the halo is 13.05:1 at
       every frame of the pour.
       DO NOT set stroke or stroke-width as attributes here: CSS wins over SVG
       presentation attributes, so they would be inert and would read like a
       second opinion that never takes effect. */
    var txt = function(x,y,s,cls,size){
      var n = S('text',{x:String(x),y:String(y),'text-anchor':'middle',
        'font-family':"'Black Han Sans','Arial Black',Impact,sans-serif",
        'font-size':String(size||20), class:cls, fill:'#3A1B06'});
      n.style.color = '#3A1B06';
      n.textContent = s;
      return n;
    };
    /* ---- WHAT WENT IN, RIDING DOWN THE STREAM ----

       USER: "inside the stream there should be visible text of terms being
       multiplied."

       It used to be one line laid across the casting - `(x + 2) × (x + 3)`
       printed over the shape it was about to become, which says the answer and
       the question in the same place. In the stream it is the metal ARRIVING:
       the two brackets and the × between them fall into the mold, and what
       comes out of the mold is underneath.

       Spaced down the fall and centred on it, smaller when there are more
       tokens - a three-metal order is five tokens and they still have to fit
       between the lip and the basin. */
    var tokens = [];
    m.into.forEach(function(s, i){ if(i) tokens.push('×'); tokens.push(s); });
    var top = 66, bot = 120, fs = tokens.length > 3 ? 10.5 : 13;
    tokens.forEach(function(tok, i){
      var y = tokens.length === 1 ? 92 : (top + i * ((bot - top) / (tokens.length - 1)));
      var el = txt(120, y, tok, 'mdnum mdin' + (tok === '×' ? ' mdinx' : ''), fs);
      /* each one falls a beat after the one above it, and the keyframe carries
         its own hold and exit - so this is the only delay there is */
      el.style.animationDelay = (0.5 + i * 0.13) + 's';
      svg.appendChild(el);
    });
    /* the products, each above the pair that made it */
    var n2 = m.terms.length, span = 196, x0 = 256 - span/2;
    m.terms.forEach(function(tm, i){
      var x = n2===1 ? 256 : (x0 + i*(span/(n2-1)));
      var d = (1.95 + i*0.18) + 's';
      if(tm.from){
        var f = txt(x, 150, tm.from, 'mdnum mdfrom' + (tm.mid?' mdmid':''), 12);
        f.style.animationDelay = d; svg.appendChild(f);
      }
      var el = txt(x, 176, tm.t, 'mdnum mdterm' + (tm.mid?' mdmid':''), 21);
      el.style.animationDelay = d;
      svg.appendChild(el);
    });
    /* the two middles run together into one */
    if(m.merge){
      svg.appendChild(txt(256, 150, m.mergeFrom, 'mdnum mdmergefrom', 12));
      svg.appendChild(txt(256, 176, m.merge, 'mdnum mdmerged', 21));
    }
    /* and what is left is a single thing */
    svg.appendChild(txt(256, 224, '= ' + m.single, 'mdnum mdsingle', 26));
  }

  wrap.appendChild(svg);
  return wrap;
};

MF.forgePour = function(st){
  var t = MF.TOOLS[st.picked];
  var ingots = st.slots.map(function(s){ return s.ingot; });
  var prod = ingotProduct(ingots);
  var sound = MF.forgeJudge(t, ingots, prod);

  /* THE POUR IS THE PICTURE, NOT THE PARAGRAPH. What you poured, what it makes
     and what it comes to are all shown over the metal as it fills the shape -
     so the three lines that used to say the same thing in words are gone. What
     is left in words is the verdict, which is the one thing a picture of a
     casting cannot say for itself. */
  var box = E('div','casting castingwrap ' + (sound.ok?'clean':'deformed'));
  box.appendChild(MF.moldScene(st.picked, {ok:sound.ok, maths:MF.moldMaths(ingots, prod)}));
  box.appendChild(H('h4',null, sound.ok ? 'Sound.' : 'Scrap.'));
  box.appendChild(H('p',null, sound.why));
  st.result = box;

  if(sound.ok){
    MF.spendFromYard(st.slots.map(function(s){ return s.key; }));
    MF.state.tools[st.picked] = {forged:true};
    /* NO LESSON HERE (user, 2026-09-04). The whole method, its reasoning and a
       practice used to be appended to the casting - three seconds after a
       pour, when what the student is looking at is the object they just made.
       The forge makes the thing. What it says about teaching is where to go
       and that the lesson now exists, which it did not a moment ago. */
    var toSchool = E('div','note');
    toSchool.innerHTML = '<b>The lesson for it has opened on the Casting Shed’s working floor.</b> ' +
      'It walks ' + MF.SCHEMA[st.picked].name.toLowerCase() + ' a step at a time on a lump chosen for it, ' +
      'and there is one to try at the end. Nothing in the mine is waiting on it.';
    box.appendChild(toSchool);
    var goSchool = MF.jump('Read it in the Casting Shed &rarr;', 'shed-methods');
    goSchool.style.marginRight = '8px';
    box.appendChild(goSchool);
    var keep = E('button','btn primary','Hang it on your belt'); keep.type='button';
    on(keep,'click',function(){ st.picked=null; st.slots=[]; st.result=null; MF.paintForge(); });
    box.appendChild(keep);
  } else {
    var again = E('button','btn','Rake it out and try again'); again.type='button';
    on(again,'click',function(){ st.slots=[]; st.result=null; MF.paintForge(); });
    box.appendChild(again);
  }
  MF.paintForge();
  /* THE ONE SCROLL WORTH DOING, and only when it is needed. The casting is the
     answer to the pour; if it lands below the fold the student poured and saw
     nothing. `nearest` moves the page as little as it can, so it is a nudge
     rather than the jump to the masthead this screen used to do on every
     single click. */
  if(box.isConnected && box.getBoundingClientRect().bottom > window.innerHeight)
    box.scrollIntoView({block:'nearest', behavior:'smooth'});
};


/* THE FORGE STOPPED TEACHING.

   USER, 2026-09-04: "There should no more lessons on the tools in the forge."

   `MF.toolLesson` lived here - the whole method, its reasoning and a practice,
   appended to the casting three seconds after a pour, when what the student is
   looking at is the object they just made. It was also the block the Casting
   Shed listed seven times over, for tools nobody owned.

   It is deleted, not moved: the lesson it carried is now MF.drawLesson on the
   Casting Shed's working floor, walked a step at a time on a lump chosen for
   the method, and only for instruments that have actually been cast. What is
   left in the forge is a line saying where to go, which is the whole of what
   the forge has to say about teaching. */

/* WHAT MAKES A PART SOUND, and there is now exactly one rule: the casting is
   the object the order named, or it is not.

   This replaced seven bespoke shape predicates - "all plain and prime", "two
   ingots that both carry an x", "the same x-part and opposite numbers". Each
   was a different idea of correctness, none of them was the thing a
   factorisation actually is, and a student could satisfy every one of them
   without ever hitting a particular object.

   A miss is DESCRIBED, term by term, exactly as the mine describes a pick that
   glanced off: which part came out wrong and what the order wanted there. */
MF.forgeJudge = function(t, ingots, prod){
  var want = t.cast;
  if(prod.overflow)
    return {ok:false, why:'That is more metal than the mold holds — it has run over the sides. ' +
      'The order is for <b>' + MF.castText(t) + '</b>, and what you poured is bigger than that.'};
  /* AS FEW WORDS AS THE VERDICT NEEDS. The pour shows what went in, what it
     makes and what it comes to, over the metal - so the prose that used to
     re-say all of it in a paragraph is gone. What is left is the part a
     picture of a casting cannot say: whether it is the ordered part, and if
     not, which term missed. */
  if(prod.a===want.a && prod.b===want.b && prod.c===want.c)
    return {ok:true, why:'The metals that multiply to it were the metals in it.'};

  var off = [];
  if(prod.a!==want.a) off.push('x²&nbsp;<b>' + num(prod.a) + '</b>, wanted <b>' + num(want.a) + '</b>');
  if(prod.b!==want.b) off.push('middle&nbsp;<b>' + num(prod.b) + '</b>, wanted <b>' + num(want.b) + '</b>');
  if(prod.c!==want.c) off.push('end&nbsp;<b>' + num(prod.c) + '</b>, wanted <b>' + num(want.c) + '</b>');
  return {ok:false, why:'Missed: ' + off.join(' &middot; ') + '.'};
};

/* =========================================================================
   THE MINE
   ========================================================================= */
/* THE MINE IN TWO BANDS.

   The top band is the three places you MOVE between - the shaft you descend,
   the rock face you cut, the yard you stock - and they sit tight against each
   other so the whole operation is one glance.

   The bottom band is the WORK, full width, and the two boxes in it are side by
   side: what is on the floor, and what is under the hammer. They used to be
   stacked inside the middle column, one under the other and both squeezed into
   a third of the page, so the pieces you were choosing between and the bar you
   cut the hammer to could not be looked at together - which is the one pairing
   the whole act depends on. */
/* THE MINE IN FOUR BANDS, and the cart is one of them.

   USER, 2026-08-30: "the cart is not large enough to drag anything or properly
   see the ore… there should be mostly ores, buttons, and animations on the
   breaking floor and cart. I am thinking we need to redesign the mine layout."

   The cart used to sit inside the MIDDLE COLUMN of a three-column grid, under
   the rock face and beside the yard - a third of the page wide, so a lump was
   a 44px list row and there was nowhere to drop a tool. Every band is the full
   width now and each one does one job:

     1  the shaft and the rock face, side by side
     2  THE CART        - drawn rocks, the belt, and where each lump goes
     3  THE BREAKING FLOOR - and it is not in the DOM until a lump is sent
     4  THE YARD        - what you have taken out

   The face keeps a column beside the shaft because the shaft is a list of five
   layers and the face is a scrolling seam; those two genuinely pair. */
MF.SCREENS.mine = function(host){
  var top = E('div','minetop');
  var colL = E('div'), colF = E('div');
  top.appendChild(colL); top.appendChild(colF);
  host.appendChild(top);
  var cart = E('div','mineband');
  host.appendChild(cart);
  var work = E('div','minework');
  host.appendChild(work);
  var yard = E('div','mineband');
  host.appendChild(yard);
  /* `mid` and `right` are kept as names for the face and the yard so the
     probes and helpers that learned those words still find them. */
  MF._mine = {root:host, left:colL, mid:colF, face:colF, cart:cart, work:work,
              right:yard, yard:yard};
  MF.paintMine();
};
/* =========================================================================
   A CLICK REPAINTS WHAT IT CHANGED, AND KEEPS THE KEYBOARD WHERE IT WAS.

   USER, 2026-09-05: the same sweep the seam got (§32), for the cart and the
   breaking floor.

   MEASURED FIRST. Every click in either band - arming an instrument, putting
   one on a lump, taking it off, choosing a piece - ran the full MF.paintMine,
   which tears down and rebuilds ALL FIVE BANDS: 1,102 nodes, 23.3ms, including
   the seam's 691 SVG nodes and the whole wall texture. To change a chip in the
   cart. 23ms is longer than a frame, so every click dropped one.

   And every one of them DROPPED KEYBOARD FOCUS TO <body>: tab to an instrument,
   press Enter, and you are back at the top of the document with the belt gone
   from under you. That is the same fault the seam had, in the form it takes for
   somebody not using a mouse - and it was in all seven controls.

   TWO PARTS.

   `MF.repaint(bands)` paints only what a handler says changed. The face and
   the shaft are repainted when ORE moves - a layer change, a lump cut out of
   the wall - and not when an instrument is picked up in a different band.

   And the focus is carried across, by identity rather than by node: every
   control in the mine already carries a data attribute naming what it acts on
   (data-tool, data-ore, data-piece, data-heap), because the drag needed one.
   `preventScroll` is not optional - restoring focus without it scrolls the
   page, which is the jerk this is here to remove.
   ========================================================================= */
MF.BANDS = {shaft:'paintShaft', face:'paintFace', cart:'paintCart',
            yard:'paintYard', work:'paintWork'};
MF.ALL_BANDS = ['shaft','face','cart','yard','work'];

/* WHAT HAD THE KEYBOARD, described so it can be found again after the node it
   names has been thrown away and rebuilt. */
MF._focusKey = function(el){
  var host = MF._mine && MF._mine.root;
  if(!el || !host || !el.getAttribute || el === document.body || !host.contains(el)) return null;
  var attrs = [];
  ['data-tool','data-ore','data-piece','data-heap','data-i','data-ore-slot'].forEach(function(a){
    if(el.hasAttribute(a)) attrs.push('[' + a + '="' + el.getAttribute(a) + '"]');
  });
  /* classes that describe STATE rather than identity are dropped: a piece that
     was `.fresh` when it took focus will not be `.fresh` after the repaint. */
  var cls = String(el.className || '').trim().split(/\s+/).filter(function(c){
    return c && !/^(fresh|knock|under|held|native|rock)$/.test(c);
  });
  return {tag:el.tagName.toLowerCase(), attrs:attrs, cls:cls,
          text:(el.textContent || '').trim().slice(0,28)};
};
MF._refocus = function(key){
  var host = MF._mine && MF._mine.root;
  if(!key || !host) return false;
  var found = null;
  var sel = key.tag + key.attrs.join('') + (key.cls.length ? '.' + key.cls.join('.') : '');
  try { found = host.querySelector(sel); } catch(e){ found = null; }
  /* a control with no data attribute - the route buttons, the exits - is found
     by what it says, which is stable across a repaint */
  if(!found && key.text){
    found = [].slice.call(host.querySelectorAll(key.tag)).filter(function(n){
      return (n.textContent || '').trim().slice(0,28) === key.text;
    })[0];
  }
  if(found && found.focus){ found.focus({preventScroll:true}); return true; }
  return false;
};

MF.repaint = function(bands){
  /* isConnected, same guard drainFlashes carries: MF._mine outlives a
     navigation away from the mine, and painting into a detached column is the
     silent-failure class that already cost a review cycle (s35) */
  if(!MF._mine || !MF._mine.mid || !MF._mine.mid.isConnected) return;
  var key = MF._focusKey(document.activeElement);
  (bands || MF.ALL_BANDS).forEach(function(b){
    var fn = MF.BANDS[b];
    if(fn && MF[fn]) MF[fn]();
  });
  if(key) MF._refocus(key);
  MF.drainFlashes();          /* after the repaint, so a message survives it */
};

/* THE WHOLE MINE, and it is still what runs when the FACE changes. Every path
   that does not name its bands gets this, so a handler that is added without
   thinking about scope is correct-but-slow rather than wrong. */
MF.paintMine = function(){ MF.repaint(); };

/* the two bands an instrument touches. An instrument RIDES WITH THE ORE, and
   the same lump is drawn in the cart and on the bench at once - so putting one
   on in either place changes both, and the belt itself hangs in both. */
MF.paintGear = function(){ MF.repaint(['cart','work']); };

/* ---------- the shaft: descend freely, no gate anywhere ---------- */
MF.paintShaft = function(){
  var host = clear(MF._mine.left);
  var box = E('div','shaft');
  box.appendChild(H('h3',null,'The Shaft'));
  box.appendChild(H('div','hint','Go as deep as you like. You never have to break anything to descend — fill the cart and work it whenever you feel like it.'));

  /* the drawn shaft on the left, the layer buttons on the right */
  var body = E('div','shaftbody');
  var way = E('div','shaftway');
  way.appendChild(E('div','sets'));
  way.appendChild(E('div','ladder'));
  var cable = E('div','cable');
  way.appendChild(cable);
  var cage = E('div','cage');
  way.appendChild(cage);
  body.appendChild(way);
  var rungs = E('div'); rungs.style.flex='1 1 auto';
  body.appendChild(rungs);
  box.appendChild(body);

  MF.LAYERS.forEach(function(L){
    var b = E('button','layer'); b.type='button';
    b.appendChild(H('span','n','LAYER ' + L.n));
    b.appendChild(document.createTextNode(L.name));
    b.appendChild(H('div','hint', L.what));
    if(MF.state.layer===L.n) b.setAttribute('aria-current','true');
    on(b,'click',function(){
      MF.state.layer = L.n;
      if(L.n > MF.state.deepest) MF.state.deepest = L.n;
      MF.paintMine();
    });
    rungs.appendChild(b);
  });
  MF.SHUT_SHAFTS.forEach(function(s){
    var b = E('button','layer shut'); b.type='button'; b.disabled = true;
    b.appendChild(H('span','n','NOT YET TIMBERED'));
    b.appendChild(document.createTextNode(s.name));
    b.appendChild(H('div','hint', s.what));
    rungs.appendChild(b);
  });
  host.appendChild(box);

  /* ride the cage to whichever layer is being worked. Measured from the real
     button positions rather than assumed, so it stays right when the layer
     list changes length. */
  /* paintMine rebuilds the shaft on every click, so the cage is a NEW element
     each time and a CSS transition on it would have nothing to move from.
     It is planted at the last known position first, then sent to the new one
     on the next frame - which is what makes the ride visible. */
  requestAnimationFrame(function(){
    var btns = rungs.querySelectorAll('.layer:not(.shut)');
    var here = btns[MF.state.layer-1];
    if(!here) return;
    var wayTop = way.getBoundingClientRect().top;
    var mid = here.getBoundingClientRect().top + here.getBoundingClientRect().height/2 - wayTop;
    var top = Math.max(4, Math.min(way.clientHeight - 44, mid - 20));

    var from = (MF.state.cageTop == null) ? top : MF.state.cageTop;
    cage.style.transition = 'none';
    cage.style.top = from + 'px';
    cable.style.transition = 'none';
    cable.style.height = (from + 6) + 'px';
    void cage.offsetHeight;                       /* commit the start position */
    requestAnimationFrame(function(){
      cage.style.transition = '';
      cable.style.transition = '';
      cage.style.top = top + 'px';
      cable.style.height = (top + 6) + 'px';
      MF.state.cageTop = top;
    });
  });
};

/* =========================================================================
   EACH LAYER IS ITS OWN STONE. Palette, strata and glint change with depth,
   so descending LOOKS like descending rather than reading like a new label.

MF.LAYER_LOOK = [
  {sky:'#8A7458', rock:'#6E5A40', rock2:'#4A3B28', ore:'#C9A24B', glint:'#FFE9A8', strata:'#7E6A4E', grit:'#8C7554'},
  {sky:'#6E6152', rock:'#5C5140', rock2:'#3C3428', ore:'#C96A1F', glint:'#F6C98A', strata:'#6B5F4C', grit:'#7A6C56'},
  {sky:'#4E5A63', rock:'#44525C', rock2:'#2B343B', ore:'#7FB6C9', glint:'#D8F0F7', strata:'#54626C', grit:'#5E6E78'},
  {sky:'#5A3F3A', rock:'#4E3630', rock2:'#31201C', ore:'#C4543F', glint:'#F7C0A8', strata:'#5C443D', grit:'#6A4A42'},
  {sky:'#33302E', rock:'#2E2A28', rock2:'#191716', ore:'#E2600F', glint:'#FFB347', strata:'#3A3532', grit:'#443E3A'}
];

/* the rocks currently exposed on the face - you look before you break */
/* THE SEAM. The face is not a wall you stand in front of - it is a length of
   rock you SCAN ALONG. It is several screens wide, it scrolls, and the ore is
   spread down its length, so looking for something worth breaking is real
   movement rather than reading a grid of seven.
   SEAM_W is the drawn width; the viewport shows roughly a third of it. */
/* 2000, NOT 2900. The drawn width is in viewBox units and the seam is rendered
   at `window height / SEAM_H` per unit - so when the window grew from 542px to
   ~800 to match the shaft (§34), every unit got 48% wider too and the scan ran
   from 4.7 screens end to end to 7.3. Fewer units at a bigger zoom is the same
   number of PIXELS of seam: the scan distance and the lumps-per-screen hold
   where they were, and what the extra height buys is a bigger lump rather than
   a longer walk. */
MF.SEAM_W = 2000;
/* THE SEAM IS TALLER THAN IT WAS, because the window onto it now sits in a
   column the shaft sets the height of - 982px at 1250 - and only 307 of that
   was rock. The rest was empty wall under the scan row. This is more SEAM, not
   more zoom: the viewBox grows and the rendered height grows with it at the
   same 1.505px per unit, so a lump is the same size and there is simply more
   face to find one in. */
MF.SEAM_H = 360;
/* AND MORE ORE IN IT. Fifteen lumps over a seam this size is a thin scattering
   - a student scans a long way to find something worth breaking, which is the
   point of a seam, but not this far. The face is nearly twice as tall as it
   was, so the extra rock goes into space that already existed rather than
   making the scan longer: 15 -> 24 over a seam widened only 2280 -> 2900, so
   the lumps sit 117 units apart instead of 145 and are spread over 228 units
   of height instead of 142. */
MF.SEAM_COUNT = 24;
/* HOW MANY SCREEN PIXELS ONE SEAM UNIT IS DRAWN AT, and it is ONE number for
   both axes because that is the whole point of it.

   THE BLANK BANDS THE USER REPORTED WERE THIS, and they were not in the
   drawing at all. The commit that made the seam taller raised the element to
   `height:542px` in CSS and left the width at `W` - 2900 - in JS. A viewBox of
   2900x360 in a 2900x542 box with the default `xMidYMid meet` scales to fit
   the WIDTH, at 1.0, and letterboxes the rest: the rock painted 360px tall in
   the middle of the element with **91px of empty above it and 91px below**.
   Measured, not guessed.

   So the two numbers are derived from one here and cannot drift again: the svg
   is sized in JS on both axes and `.seamview svg` no longer states a height.
   1.505 is the ratio the old comment claimed the seam was already drawn at. */
MF.SEAM_ZOOM = 1.505;

MF.stockFace = function(){
  var L = MF.state.layer;
  if(MF.state.faceLayer !== L){
    MF.state.face = []; MF.state.faceLayer = L; MF.state.inspecting = null; MF.state.scan = 0;
  }
  var guard = 0;
  while(MF.state.face.length < MF.SEAM_COUNT && guard++ < 60){
    var o = MF.digOre(L, MF.state.rng);
    if(!o) break;
    /* GENUINELY RANDOM, not modulo arithmetic on the slot index. The old
       formulas were deterministic in the slot, so every layer laid its rocks
       out in the same repeating rhythm at the same repeating sizes and the
       seam looked stamped rather than dug. The slot still sets the coarse
       spacing, which is what keeps ore spread along the whole length. */
    var rng = MF.state.rng;
    var span = (MF.SEAM_W - 200) / (MF.SEAM_COUNT - 1);
    o.slot = MF.nextSeamSlot();
    o.px = 100 + o.slot * span + (rng() - 0.5) * span * 0.6;
    o.py = 46 + rng() * (MF.SEAM_H - 132);
    o.sz = 26 + rng() * 24;
    o.rot = rng() * Math.PI * 2;
    /* its own silhouette: a different number of faces, each pulled in or out
       by a different amount, so no two lumps are the same rock twice */
    o.faces = [];
    var nf = 7 + Math.floor(rng() * 4);
    for(var f=0; f<nf; f++) o.faces.push(0.68 + rng() * 0.5);
    MF.state.face.push(o);
  }
  return MF.state.face;
};
/* the emptiest position along the seam, so ore refills where it was taken */
MF.nextSeamSlot = function(){
  var used = {};
  MF.state.face.forEach(function(o){ used[o.slot] = true; });
  for(var i=0;i<MF.SEAM_COUNT;i++){ if(!used[i]) return i; }
  return MF.state.face.length % MF.SEAM_COUNT;
};

/* =========================================================================
   THE HAULAGE ROAD. A cart running the track above the cart box - the ore
   you break has to get out somehow. Decorative: no text, no information,

  var wrap = E('div','carttrack');

  /* tunnel wall behind, with timber sets receding down the road */
  R(0,0,W,VH,'#2E2620');
  for(var s=0;s<9;s++){
    var sx = s*72 + 6;
    R(sx,8,7,54,'#4A3B2C',{opacity:'.85'});
